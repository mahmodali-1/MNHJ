 من استفزه.<\/p><\/details><details class=\"more\"><summary><b>ألا يقلل تنظيف الغرفة أو مساعدة الوالدة في المطبخ من مقام الرجل؟<\/b><\/summary><p>هذا من رواسب الجاهلية. فخير البرية محمد ﷺ كان يخصف نعله ويرقع ثوبه ويكون في مهنة أهله. وخدمة الأهل بر ومروءة تدل على نبل النفس.<\/p><\/details><\/section><section class=\"bs warn\"><h3>رادار الحماية<\/h3><p><b>مؤشرات الخطر:<\/b> الجلافة مع الأهل والصغار، والتفاخر بالعنف أو التدخين، والاستخفاف بالعاملين وكبار السن، واستعمال الإهانة تسلية، وربط القيمة الذاتية بخوف الآخرين منه.<\/p><small>البروتوكول كاملاً في تبويب «الكامل».<\/small><\/section><section class=\"bs\"><h3>٥ · رحلة الأسبوع<\/h3><p class=\"\"><b>خدمة بيتية يومية:<\/b> يؤدي الطالب مهمة خدمة واحدة في بيته كل يوم دون أن يُطلب منه.<\/p><p class=\"\"><b>كظم الغضب:<\/b> يسجل موقفاً واحداً أمسك فيه نفسه عند الغضب، ويشاركه في اللقاء القادم.<\/p><p class=\"\"><b>مروءة صامتة:<\/b> يقوم بعمل خير واحد لا يعلم به أحد ولا يصوره.<\/p><p class=\"\"><b>جسر إلى اللقاء الثامن عشر:<\/b> المروءة تحتاج إلى شجاعة حين يكون الحق مكلفاً. وهذا موضوع «ثبات المبدأ».<\/p><\/section>", "slides": ["<div class=\"cn\">17<\/div><h2>معيار الرجولة الحق<\/h2><p class=\"q\">ما هي الرجولة الحقيقية بعيدا عن المظاهر المشوهة؟<\/p>", "<small>إضاءة استهلالية<\/small><h2>نديم وركان<\/h2><ul><li class=\"frag\">من منهما تثق به حين تحتاج إلى عون؟ ومن منهما يهابه الناس هيبة احترام لا هيبة خوف؟<\/li><li class=\"frag\">لماذا يظن كثير من الفتيان أن نديم هو الأقوى؟ وما الذي يخشاه حقاً؟<\/li><\/ul>", "<small>1<\/small><h2>الرجولة صفة إيمانية وأخلاقية<\/h2><p class=\"ayah lg\">﴿رِجَالٌ لَّا تُلْهِيهِمْ تِجَارَةٌ وَلَا بَيْعٌ عَن ذِكْرِ اللَّهِ وَإِقَامِ الصَّلَاةِ وَإِيتَاءِ الزَّكَاةِ ۙ يَخَافُونَ يَوْمًا تَتَقَلَّبُ فِيهِ الْقُلُوبُ وَالْأَبْصَارُ﴾ [النور: 37]<\/p><p class=\"g frag\">الرجولة ليست مظهرا أو صوتا عاليا ، بل استعلاء بالإيمان وثبات على الحق.<\/p>", "<small>2<\/small><h2>القوة في ضبط النفس<\/h2><p class=\"had\">قال رسول الله ﷺ: «لَيْسَ الشَّدِيدُ بِالصُّرَعَةِ، إِنَّمَا الشَّدِيدُ الَّذِي يَمْلِكُ نَفْسَهُ عِنْدَ الغَضَبِ» متفق عليه<\/p><p class=\"g frag\">الغضب » (متفق عليه) كظم الغيظ والحلم علامات القوة الحقيقية.<\/p>", "<small>3<\/small><h2>المروءة الصامتة<\/h2><p class=\"ayah\">﴿فَسَقَىٰ لَهُمَا ثُمَّ تَوَلَّىٰ إِلَى الظِّلِّ فَقَالَ رَبِّ إِنِّي لِمَا أَنزَلْتَ إِلَيَّ مِنْ خَيْرٍ فَقِيرٌ﴾ [القصص: 24]<\/p><p class=\"g frag\">نجدة الضعيف وعون الناس دون انتظار تصفيق أو تصوير هي ذروة الشهامة.<\/p>", "<small>4<\/small><h2>الرجل في بيته<\/h2><p class=\"g frag\">خدمة الأسرة واللين مع الأهل من صميم المروءة، وليست نقصا في الهيبة.<\/p>", "<small>سؤال للحوار<\/small><h2 class=\"big\">ما صورة الرجولة الشائعة؟ وما صورتها الحقيقية؟<\/h2>", "<small>نشاط تطبيقي<\/small><h2 class=\"big\">اكتب ثلاثة مواقف مروءة صامتة، ونفذ أحدها هذا الأسبوع.<\/h2>", "<small>سؤال وبرهان<\/small><details class=\"frag\"><summary><b>ألا يجعل الحلم والسكوت عن الإهانة الشاب موضع استضعاف وسخرية بين أقرانه؟<\/b><\/summary><p>هناك فرق جوهري بين العجز والذل، وبين الحلم والترفع. الحلم أن تكون قادراً ثم تمسك نفسك ابتغاء مرضاة الله. والشاب الذي لا يستفزه صراخ السفهاء يفرض احترامه على الجميع، بينما سريع الغضب يتحكم فيه كل من استفزه.<\/p><\/details><details class=\"frag\"><summary><b>ألا يقلل تنظيف الغرفة أو مساعدة الوالدة في المطبخ من مقام الرجل؟<\/b><\/summary><p>هذا من رواسب الجاهلية. فخير البرية محمد ﷺ كان يخصف نعله ويرقع ثوبه ويكون في مهنة أهله. وخدمة الأهل بر ومروءة تدل على نبل النفس.<\/p><\/details><details class=\"frag\"><summary><b>ما العيب في تصوير أعمال الخير والشهامة لنشر الإيجابية بين المتابعين؟<\/b><\/summary><p>نجدة المحتاج تقتضي حفظ كرامته ومشاعره. والمتاجرة بضعف الفقير لتحصيل المشاهدات تنقض الشهامة وتخدش الإخلاص. والشهامة الصامتة أعظم أجراً وأصدق مروءة.<\/p><\/details><details class=\"frag\"><summary><b>هل تعني هذه المعايير أن أتخلى عن الرياضة وبناء الجسم؟<\/b><\/summary><p>إطلاقاً. قال ﷺ: «الْمُؤْمِنُ الْقَوِيُّ خَيْرٌ وَأَحَبُّ إِلَى اللَّهِ مِنَ الْمُؤْمِنِ الضَّعِيفِ» رواه مسلم. القوة البدنية مطلوبة، لكنها وسيلة لحماية الضعيف وخدمة الدين لا للاستعراض والبطش.<\/p><\/details>", "<small>ميدان التطبيق<\/small><h2>«مختبر تفكيك الرجولة وميثاق المروءة»  نشاط ذهني وحواري<\/h2><ol><li class=\"frag\">1. التحليل: بعد قصة نديم وركان تقسّم المجموعات السبورة إلى عمودين، وتبني مصفوفة المقارنة بسلوكيات حقيقية يعرفونها.<\/li><li class=\"frag\">2. التخلية: يدوّن كل طالب سلوكين اعتاد بعض الفتيان عدهما رجولة وهما جلافة أو خفة (رفع الصوت على الأهل، السخرية من العمال).<\/li><li class=\"frag\">3. التحلية: يدوّن سلوكين عمليين للشهامة يلتزم بهما هذا الأسبوع (حمل المشتريات عن الوالدين، كظم الغيظ عند الخلاف).<\/li><li class=\"frag\">4. دراسة حالة: قصي (16 سنة) متابع لتحديات المقاطع المصورة.<\/li><li class=\"frag\">5. الاعتراض: يدافع أحد الطلاب عن «الفتوة الخشنة»: «العالم لا يحترم إلا القوي»، وتناقشه المجموعات بالأدلة.<\/li><\/ol>", "<small>رحلة الأسبوع<\/small><ul><li class=\"frag\"><b>خدمة بيتية يومية:<\/b> يؤدي الطالب مهمة خدمة واحدة في بيته كل يوم دون أن يُطلب منه.<\/li><li class=\"frag\"><b>كظم الغضب:<\/b> يسجل موقفاً واحداً أمسك فيه نفسه عند الغضب، ويشاركه في اللقاء القادم.<\/li><li class=\"frag\"><b>مروءة صامتة:<\/b> يقوم بعمل خير واحد لا يعلم به أحد ولا يصوره.<\/li><li class=\"frag\"><b>جسر إلى اللقاء الثامن عشر:<\/b> المروءة تحتاج إلى شجاعة حين يكون الحق مكلفاً. وهذا موضوع «ثبات المبدأ».<\/li><\/ul>"], "n": 17, "u": 3, "title": "معيار الرجولة الحق", "q": "ما هي الرجولة الحقيقية بعيدا عن المظاهر المشوهة؟", "dqq": "ما صورة الرجولة الشائعة؟ وما صورتها الحقيقية؟", "pact": "اكتب ثلاثة مواقف مروءة صامتة، ونفذ أحدها هذا الأسبوع."}, {"summary": "<p class=\"\">في كل مدرسة ومجموعة مواقف يكون فيها الحق مكلفاً: شهادة تُكتم خوفاً، وظلم يُترك خشية العزلة، ومنكر يُسكت عنه مجاملة. يتعلم الفتى في هذا اللقاء الفرق بين الشجاعة البدنية والشجاعة الأدبية، وأن الأخيرة هي التي يحتاجها في حياته اليومية، وأن مصدرها الخشية من الله وحده. ويتدرب على صياغة عبارة حازمة مؤدبة تنصر الحق وتحفظ الأدب.<\/p><p class=\"\">يدرك أن الصمت أمام الظلم ليس حياداً بل مشاركة.<\/p><p class=\"\">يفرق بين الحكمة في أسلوب بيان الحق وبين المداهنة.<\/p><p class=\"\">يتدرب على «سلّم الشجاعة الأدبية» بخطواته الأربع.<\/p><div class=\"tw\"><table><tr><th><b>المهارة<\/b><\/th><th><b>معناها العملي<\/b><\/th><\/tr><tr><td><b>الشجاعة الأدبية<\/b><\/td><td>يقول الحق وينصر المظلوم ولو كلّفه ذلك<\/td><\/tr><tr><td><b>مواجهة الخوف الاجتماعي<\/b><\/td><td>يفكك مخاوفه من النبذ والسخرية ويدرك أنها أكبر من حقيقتها<\/td><\/tr><tr><td><b>التعبير الحازم المؤدب<\/b><\/td><td>يصوغ اعتراضه بعبارة قوية لا تتطاول ولا تتنازل<\/td><\/tr><\/table><\/div>", "kit": "<p class=\"\"><b>ما يعيشه الفتى:<\/b> الخوف من النبذ أشد مخاوف هذه السن. والفتى يعلم أن الصمت ظلم، لكنه يخشى أن يخسر مكانته بين زملائه، فيختار أخف الضررين عنده: السكوت.<\/p><p class=\"\"><b>لا تجعله بطلاً مستعرضاً:<\/b> المطلوب ثبات هادئ لا مواجهة مستفزة، فالشجاعة لا تعني الوقاحة.<\/p><p class=\"\"><b>اعترف بكلفة الحق:<\/b> قد يخسر الفتى شيئاً بصدقه، وأخبره أن الله لا يضيع الصادقين.<\/p><p class=\"\"><b>خذ المخاوف بجدية:<\/b> لا تقل له «لا تخف»، بل اطلب منه أن يصف أسوأ ما يمكن أن يحدث، ثم فككه معه.<\/p><p class=\"\"><b>شارك موقفاً من حياتك:<\/b> احكِ موقفاً سكتّ فيه وندمت، أو ثبتّ فيه وربحت، فهذا أبلغ من التنظير.<\/p>", "hookT": "معضلة عُدَيّ", "hook": "<p class=\"\">في معمل المدرسة كسر <b>باسل<\/b> (أكثر الطلاب نفوذاً وشعبية) جهاز حاسوب عمداً، ثم اتهم الفتى الهادئ <b>عمر<\/b>، وهو طالب يتيم ضعيف الحال. وكان <b>عُدَيّ (17 سنة)<\/b> الشاهد الوحيد الذي رأى الحادثة وتأكد من براءة عمر. فلما أوشكت الإدارة على معاقبة عمر وفصله، اقترب باسل ورفاقه من عدي بلهجة تهديد: «أنت زميلنا، إياك أن تشهد ضد باسل، وإلا جعلنا حياتك جحيماً وقاطعناك وطردناك من كل مجموعاتنا!». ووقف عدي بين عمر المظلوم الباكي وأصدقائه الأقوياء المهددين.<\/p><p class=\"\"><b>أسئلة الاستثارة:<\/b><\/p><p class=\"\">ما الذي يخسره عدي إن شهد؟ وما الذي يخسره إن سكت؟ أيهما أثقل؟<\/p><p class=\"\">لو كنت مكان عمر، ماذا تتمنى أن يفعل عدي؟<\/p>", "pts": "<article class=\"pt\"><h4><span>أولاً<\/span>الخشية لله تسقط هيبة الخلق<\/h4><p class=\"ayah\">﴿الَّذِينَ يُبَلِّغُونَ رِسَالَاتِ اللَّهِ وَيَخْشَوْنَهُ وَلَا يَخْشَوْنَ أَحَدًا إِلَّا اللَّهَ ۗ وَكَفَىٰ بِاللَّهِ حَسِيبًا﴾ [الأحزاب: 39]<\/p><p class=\"\">جوهر الثبات في تجريد الخشية لله. فمتى استقرت هيبة الله في قلب الفتى سقطت أمامها هيبة الخلق ومخاوف التهميش. وختمت الآية بقوله ﴿وَكَفَىٰ بِاللَّهِ حَسِيبًا﴾، فالله هو الذي يحاسب ويكفي، فلا حاجة إلى استرضاء الناس.<\/p><\/article><article class=\"pt\"><h4><span>ثانياً<\/span>كتمان الشهادة إثم القلب<\/h4><p class=\"ayah\">﴿وَلَا تَكْتُمُوا الشَّهَادَةَ ۚ وَمَن يَكْتُمْهَا فَإِنَّهُ آثِمٌ قَلْبُهُ﴾ [البقرة: 283]<\/p><p class=\"\">الشاهد الوحيد على حادثة كحادثة عدي مؤتمن، وكتمان ما رآه خيانة للأمانة. وأمر الله بالقسط حتى ضد الأقارب والأصدقاء: ﴿كُونُوا قَوَّامِينَ بِالْقِسْطِ شُهَدَاءَ لِلَّهِ وَلَوْ عَلَىٰ أَنفُسِكُمْ أَوِ الْوَالِدَيْنِ وَالْأَقْرَبِينَ﴾ [النساء: 135]. فالعدالة لا تعرف مجاملة.<\/p><\/article><article class=\"pt\"><h4><span>ثالثاً<\/span>الحديث النبوي في الصدع بالحق<\/h4><p class=\"had\">قال رسول الله ﷺ: «أَلاَ لاَ يَمْنَعَنَّ رَجُلاً هَيْبَةُ النَّاسِ أَنْ يَقُولَ بِحَقٍّ إِذَا عَلِمَهُ» رواه الترمذي وأحمد<\/p><p class=\"\">نهي نبوي قاطع عن الجبن الاجتماعي. لا يجوز للخوف من الناس أو الخشية من ملامتهم أن يقعد الفتى عن قول الحق إذا علمه. وقال ﷺ: «أَفْضَلُ الجِهَادِ كَلِمَةُ عَدْلٍ عِنْدَ سُلْطَانٍ جَائِرٍ» رواه أبو داود والترمذي. فإذا كانت كلمة العدل أمام السلطان من أفضل الجهاد، فكلمة الحق في المدرسة أمام مجموعة من الأقران أولى بالثبات.<\/p><\/article><article class=\"pt\"><h4><span>رابعاً<\/span>نصرة المظلوم من الأخوة<\/h4><p class=\"had\">قال رسول الله ﷺ: «الْمُسْلِمُ أَخُو الْمُسْلِمِ، لاَ يَظْلِمُهُ وَلاَ يُسْلِمُهُ» متفق عليه. و«لا يسلمه» أي لا يتركه لمن يؤذيه. وقال ﷺ: «انْصُرْ أَخَاكَ ظَالِمًا أَوْ مَظْلُومًا»، فقيل: يا رسول الله، نصرته مظلوماً، فكيف أنصره ظالماً؟ قال: «تَحْجُزُهُ، أَوْ تَمْنَعُهُ، مِنَ الظُّلْمِ فَإِنَّ ذَلِكَ نَصْرُهُ» رواه البخاري. فمنع باسل من ظلمه نصرة له أيضاً، وليس عداءً له.<\/p><\/article><article class=\"pt\"><h4><span>خامساً<\/span>نماذج في القرآن والسيرة<\/h4><p class=\"\"><b>الرجل الذي جاء من أقصى المدينة:<\/b> ﴿وَجَاءَ مِنْ أَقْصَى الْمَدِينَةِ رَجُلٌ يَسْعَىٰ قَالَ يَا قَوْمِ اتَّبِعُوا الْمُرْسَلِينَ﴾ [يس: 20]. كسر حاجز السلبية وسعى من بعيد ليصدع بالحق أمام قومه ولم يخف.<\/p><p class=\"\"><b>أبو بكر الصديق رضي الله عنه:<\/b> حين رأى رجلاً من قريش يخنق النبي ﷺ عند الكعبة، قام ودفع الرجل عنه وقال: «أَتَقْتُلُونَ رَجُلاً أَنْ يَقُولَ رَبِّيَ اللَّهُ؟» رواه البخاري. فحمل كلمة الحق والمخاطرة أمام جمع غاضب.<\/p><p class=\"\"><b>عبد الله بن مسعود رضي الله عنه:<\/b> تروي كتب السيرة أن الصحابة تذاكروا أن قريشاً لم تسمع القرآن يُجهر به، فقال ابن مسعود: «أنا أسمعهموه»، فقرأ سورة الرحمن عند المقام جهراً، فضربوه في وجهه فثبت وعاد وهو يقول إنه لن يخاف بعدها. وفيه أن الثبات يُكتسب بالتجربة.<\/p><p class=\"\"><b>إبراهيم عليه السلام:<\/b> ﴿إِنَّ إِبْرَاهِيمَ كَانَ أُمَّةً قَانِتًا لِّلَّهِ حَنِيفًا﴾ [النحل: 120]. فرجل واحد ثابت على المبدأ يعدل أمة كاملة، والحق لا يوزن بالأعداد.<\/p><\/article><article class=\"pt\"><h4><span>سادساً<\/span>الشجاعة البدنية والأدبية<\/h4><div class=\"tw\"><table><tr><th><b>الموقف<\/b><\/th><th><b>الجبن والحياد السلبي<\/b><\/th><th><b>الشجاعة الأدبية<\/b><\/th><\/tr><tr><td><b>معنى التصرف<\/b><\/td><td>الصمت عن الحق طلباً لرضا الأقران وفراراً من المشكلات<\/td><td>الجهر بالصدق ونصرة المظلوم وتقديم هيبة الحق على هيبة الخلق<\/td><\/tr><tr><td><b>العاقبة<\/b><\/td><td>ضيق الضمير والندم وسقوط المظلوم<\/td><td>راحة الضمير واحترام باطن من الجميع<\/td><\/tr><\/table><\/div><p class=\"\">الشجاعة البدنية يشارك فيها كثير من الناس، أما الشجاعة الأدبية (قول الحق ورفض الباطل وتحمل كلفة الصدق) فلا يقوى عليها إلا الصادقون.<\/p><\/article><article class=\"pt\"><h4><span>سابعاً<\/span>الحكمة لا المداهنة<\/h4><p class=\"ayah\">﴿وَدُّوا لَوْ تُدْهِنُ فَيُدْهِنُونَ﴾ [القلم: 9]<\/p><p class=\"\">المداهنة أن تسكت عن الباطل مقابل رضا الناس، وهي ذمٌّ قرآني. أما الحكمة فهي اختيار الوقت المناسب والأسلوب الرفيق في إظهار الحق: ﴿ادْعُ إِلَىٰ سَبِيلِ رَبِّكَ بِالْحِكْمَةِ وَالْمَوْعِظَةِ الْحَسَنَةِ﴾ [النحل: 125]. وحتى مع فرعون الطاغية أمر الله موسى وهارون: ﴿فَقُولَا لَهُ قَوْلًا لَّيِّنًا﴾ [طه: 44]. فالشجاعة لا تعني الغلظة، بل الثبات مع الأدب.<\/p><\/article><article class=\"pt\"><h4><span>ثامناً<\/span>وهم الكثرة والرزق والأجل<\/h4><p class=\"\">يخاف الفتى أن تقطع جرأته صلته بأصدقائه أو ترزقه عداوة. والحقيقة أن الأرزاق والآجال بيد الله وحده، وقول الحق لا يقطع رزقاً ولا يقرب أجلاً. وقال ﷺ: «مَنِ الْتَمَسَ رِضَى اللَّهِ بِسَخَطِ النَّاسِ كَفَاهُ اللَّهُ مُؤْنَةَ النَّاسِ» رواه الترمذي. وكثيراً ما يحترم الأصدقاء أنفسهم من ثبت أمامهم، ويهابونه في باطنهم.<\/p><\/article><article class=\"pt\"><h4><span>تاسعاً<\/span>النصيحة لمن له حق عليك<\/h4><p class=\"had\">قال رسول الله ﷺ: «الدِّينُ النَّصِيحَةُ» رواه مسلم. والنصح للوالد والمعلم داخل في الشجاعة الأدبية، لكنه يكون سراً وبلطف وتوقير، وبصيغة استفسار رفيق لا بالتطاول أو التشهير.<\/p><\/article>", "qa": "<div class=\"tw\"><table><tr><th><b>السؤال المتوقع<\/b><\/th><th><b>تفكيكه<\/b><\/th><\/tr><tr><td><b>أليس من الحكمة والسياسة السكوت عن الباطل أحياناً لتجنب الصدام؟<\/b><\/td><td>هناك بون شاسع بين الحكمة في أسلوب بيان الحق وبين المداهنة والسكوت عن الظلم. الحكمة تعني اختيار الوقت المناسب والكلمة البصيرة، لا أن تسكت وتترك المظلوم يُسحق تحت سمعك وبصرك.<\/td><\/tr><tr><td><b>إذا شهدت بالحق وخسرت أصدقائي في المدرسة فكيف أعيش في عزلة؟<\/b><\/td><td>الصداقة التي تطلب منك خيانة ضميرك صداقة مسمومة. ومن أرضى الله بسخط الناس كفاه الله مؤنة الناس. وموقفك الشجاع سيجعل الأصدقاء أنفسهم يحترمون صدقك باطناً، وسيرزقك الله رفقة صالحة تشبهك.<\/td><\/tr><tr><td><b>هل تشمل الشجاعة الأدبية مناصحة المعلم أو الوالد إذا أخطأ؟<\/b><\/td><td>نعم، ولكن بأعلى درجات التوقير والأدب. فالشجاعة ليست وقاحة. تكون المناصحة سراً وبلطف وبر، وبصيغة استفسار رفيق لا بالتطاول والتشهير.<\/td><\/tr><\/table><\/div>", "radar": "<p class=\"\"><b>مؤشرات الخطر:<\/b> تبرير الصمت المتكرر عن المنكرات، والمجاملة في الباطل، ونشر الإشاعات أو الضحك على الأذى، وشعور حاد بالقلق من رأي المجموعة، وتحول الفتى إلى ظل لمن حوله.<\/p><p class=\"\"><b>بروتوكول التدخل:<\/b><\/p><p class=\"step\"><b>1. <\/b>اجلس معه وانتبه لمخاوفه: ما أسوأ ما يتوقع أن يحدث؟ ثم حللاه معاً.<\/p><p class=\"step\"><b>2. <\/b>درّبه على جملة حازمة مؤدبة وأعد معه الموقف تمثيلاً.<\/p><p class=\"step\"><b>3. <\/b>اتفق معه على شريك صالح يقف إلى جانبه في المواقف التالية.<\/p>", "actT": "«مختبر سُلّم الشجاعة الأدبية»  نشاط تدريبي", "act": "<p class=\"step\"><b>1. الدرجة الأولى، الاعتراف:<\/b> يكتب كل طالب موقفاً سابقاً تردد فيه وسكت عن قول الحق، ويحدد العائق النفسي: خجل أو خوف أو رغبة في القبول.<\/p><p class=\"step\"><b>2. الدرجة الثانية، تفكيك المخاوف:<\/b> يكتب أسوأ ما كان سيحدث، ثم يقارنه بما كان سيحدث فعلاً. غالباً تكون المخاوف أكبر من حقيقتها.<\/p><p class=\"step\"><b>3. الدرجة الثالثة، العبارة الحازمة:<\/b> يصوغ جملة صلبة ومؤدبة لقولها في مواقف مشابهة، مثل: «هذا ظلم ولا أقبل به» أو «هذا الكلام غيبة ولن أشارك فيه».<\/p><p class=\"step\"><b>4. الدرجة الرابعة، العهد:<\/b> يوقّع تعهداً بالصدع بالحق هذا الأسبوع في موقف واحد على الأقل.<\/p><p class=\"step\"><b>5. دراسة حالة:<\/b> طارق (16 سنة) في مجموعة دردشة تضم 15 طالباً. نشر أحد المتنفذين صورة لزميلهم الهادئ ياسين وسخروا من ملابسه وطريقته بعبارات مؤذية. شعر طارق بظلم شديد، لكنه خاف إن كتب معترضاً أن تنقلب المجموعة ضده ويطردوه. فسكت ووضع رمز «ضحك» مجاملة، وعاد إلى بيته يشعر بضيق الضمير. تحلل المجموعات: ما الذي كان يمكنه فعله بأدب وحزم؟ وما صياغته؟<\/p><p class=\"step\"><b>6. الاعتراض:<\/b> أحد الطلاب يدافع عن السكوت: «لا تتدخل فيما لا يعنيك وتسلم»، وتناقشه المجموعات.<\/p><div class=\"tw\"><table><tr><th colspan=\"2\"><b>بطاقة: سُلّم الشجاعة الأدبية<\/b><\/th><\/tr><tr><td><b>1. موقف سكتّ فيه<\/b><\/td><td>............................<\/td><\/tr><tr><td><b>2. أسوأ ما كنت أخشاه / ما كان سيحدث فعلاً<\/b><\/td><td>............ / ............<\/td><\/tr><tr><td><b>3. عبارتي الحازمة المؤدبة<\/b><\/td><td>«............................»<\/td><\/tr><tr><td><b>4. العهد<\/b><\/td><td>أعاهد الله أن أقول الحق بأدب في أول موقف يتطلب ذلك<\/td><\/tr><\/table><\/div>", "week": "<p class=\"\"><b>موقف حق واحد:<\/b> يطبق الطالب عبارته الحازمة في موقف حقيقي ويدوّن ما حدث.<\/p><p class=\"\"><b>نصرة مظلوم:<\/b> يقف إلى جانب زميل مستضعف بكلمة طيبة أو دعم عملي.<\/p><p class=\"\"><b>مراجعة الصمت:<\/b> يلاحظ مواضع سكوته عن الباطل هذا الأسبوع ويدوّنها للمشاركة.<\/p><p class=\"\"><b>جسر إلى اللقاء التاسع عشر:<\/b> الثبات على المبدأ يحتاج إلى هوية معتزة لا تذوب أمام الأقوى ولا تنبهر بما عنده. وهذا موضوع «الاعتزاز بالهوية».<\/p>", "kq": "الشجاعة الأدبية ونصرة الحق وقول الصدق في المواقف الحرجة", "brief": "<div class=\"plan\"><span>اقتراح لتوزيع الوقت (١٠–١٥ د)<\/span><b>افتتاح ٣<\/b><b>محاور ٥<\/b><b>حوار ٢<\/b><b>نشاط ٣<\/b><b>ختام ٢<\/b><\/div><section class=\"bs\"><h3>١ · الافتتاح: معضلة عُدَيّ<\/h3><p class=\"\">في معمل المدرسة كسر <b>باسل<\/b> (أكثر الطلاب نفوذاً وشعبية) جهاز حاسوب عمداً، ثم اتهم الفتى الهادئ <b>عمر<\/b>، وهو طالب يتيم ضعيف الحال. وكان <b>عُدَيّ (17 سنة)<\/b> الشاهد الوحيد الذي رأى الحادثة وتأكد من براءة عمر. فلما أوشكت الإدارة على معاقبة عمر وفصله، اقترب باسل ورفاقه من عدي بلهجة تهديد: «أنت زميلنا، إياك أن تشهد ضد باسل، وإلا جعلنا حياتك جحيماً وقاطعناك وطردناك من كل مجموعاتنا!». ووقف عدي بين عمر المظلوم الباكي وأصدقائه الأقوياء المهددين.<\/p><p class=\"\"><b>أسئلة الاستثارة:<\/b><\/p><p class=\"\">ما الذي يخسره عدي إن شهد؟ وما الذي يخسره إن سكت؟ أيهما أثقل؟<\/p><p class=\"\">لو كنت مكان عمر، ماذا تتمنى أن يفعل عدي؟<\/p><\/section><section class=\"bs\"><h3>٢ · المحاور<\/h3><article class=\"pt\"><h4><span>١<\/span>الخشية لله تسقط هيبة الخلق<\/h4><p class=\"ayah\">﴿الَّذِينَ يُبَلِّغُونَ رِسَالَاتِ اللَّهِ وَيَخْشَوْنَهُ وَلَا يَخْشَوْنَ أَحَدًا إِلَّا اللَّهَ ۗ وَكَفَىٰ بِاللَّهِ حَسِيبًا﴾ [الأحزاب: 39]<\/p><p class=\"g\">من استحضر رقابة الله سقطت عنده مخاوف السخرية من الأقران.<\/p><details class=\"more\"><summary>للتوسع<\/summary><p class=\"\">جوهر الثبات في تجريد الخشية لله. فمتى استقرت هيبة الله في قلب الفتى سقطت أمامها هيبة الخلق ومخاوف التهميش. وختمت الآية بقوله ﴿وَكَفَىٰ بِاللَّهِ حَسِيبًا﴾، فالله هو الذي يحاسب ويكفي، فلا حاجة إلى استرضاء الناس.<\/p><\/details><\/article><article class=\"pt\"><h4><span>٢<\/span>كتمان الحق إثم<\/h4><p class=\"ayah\">﴿وَلَا تَكْتُمُوا الشَّهَادَةَ ۚ وَمَن يَكْتُمْهَا فَإِنَّهُ آثِمٌ قَلْبُهُ﴾ [البقرة: 283]<\/p><p class=\"g\">الصمت عن الظلم ليس حيادا بل مشاركة فيه.<\/p><details class=\"more\"><summary>للتوسع<\/summary><p class=\"\">الشاهد الوحيد على حادثة كحادثة عدي مؤتمن، وكتمان ما رآه خيانة للأمانة. وأمر الله بالقسط حتى ضد الأقارب والأصدقاء: ﴿كُونُوا قَوَّامِينَ بِالْقِسْطِ شُهَدَاءَ لِلَّهِ وَلَوْ عَلَىٰ أَنفُسِكُمْ أَوِ الْوَالِدَيْنِ وَالْأَقْرَبِينَ﴾ [النساء: 135]. فالعدالة لا تعرف مجاملة.<\/p><\/details><\/article><article class=\"pt\"><h4><span>٣<\/span>الصدع بالحق بشجاعة<\/h4><p class=\"had\">قال رسول الله ﷺ: «أَلاَ لاَ يَمْنَعَنَّ رَجُلاً هَيْبَةُ النَّاسِ أَنْ يَقُولَ بِحَقٍّ إِذَا عَلِمَهُ» رواه الترمذي وأحمد<\/p><p class=\"g\">الترمذي) الشجاعة الأدبية تتطلب الجهر بالحق بأدب وحزم.<\/p><details class=\"more\"><summary>للتوسع<\/summary><p class=\"\">نهي نبوي قاطع عن الجبن الاجتماعي. لا يجوز للخوف من الناس أو الخشية من ملامتهم أن يقعد الفتى عن قول الحق إذا علمه. وقال ﷺ: «أَفْضَلُ الجِهَادِ كَلِمَةُ عَدْلٍ عِنْدَ سُلْطَانٍ جَائِرٍ» رواه أبو داود والترمذي. فإذا كانت كلمة العدل أمام السلطان من أفضل الجهاد، فكلمة الحق في المدرسة أمام مجموعة من الأقران أولى بالثبات.<\/p><\/details><\/article><article class=\"pt\"><h4><span>٤<\/span>الحكمة لا المداهنة<\/h4><p class=\"ayah\">﴿وَدُّوا لَوْ تُدْهِنُ فَيُدْهِنُونَ﴾ [القلم: 9]<\/p><p class=\"g\">الحكمة اختيار الأسلوب الأنسب للبيان، أما المداهنة فهي السكوت عن الباطل إرضاء للناس.<\/p><details class=\"more\"><summary>للتوسع<\/summary><p class=\"\">المداهنة أن تسكت عن الباطل مقابل رضا الناس، وهي ذمٌّ قرآني. أما الحكمة فهي اختيار الوقت المناسب والأسلوب الرفيق في إظهار الحق: ﴿ادْعُ إِلَىٰ سَبِيلِ رَبِّكَ بِالْحِكْمَةِ وَالْمَوْعِظَةِ الْحَسَنَةِ﴾ [النحل: 125]. وحتى مع فرعون الطاغية أمر الله موسى وهارون: ﴿فَقُولَا لَهُ قَوْلًا لَّيِّنًا﴾ [طه: 44]. فالشجاعة لا تعني الغلظة، بل الثبات مع الأدب.<\/p><\/details><\/article><\/section><section class=\"bs\"><h3>٣ · سؤال للحوار<\/h3><p class=\"big\">متى سكت عن حق خوفا من السخرية؟<\/p><\/section><section class=\"bs\"><h3>٤ · نشاط تطبيقي<\/h3><p class=\"big\">تمر ن على قول رأيك في موقف حرج بأدب وحزم أمام المجموعة.<\/p><\/section><section class=\"bs\"><h3>أسئلة قد تُطرح<\/h3><details class=\"more\"><summary><b>أليس من الحكمة والسياسة السكوت عن الباطل أحياناً لتجنب الصدام؟<\/b><\/summary><p>هناك بون شاسع بين الحكمة في أسلوب بيان الحق وبين المداهنة والسكوت عن الظلم. الحكمة تعني اختيار الوقت المناسب والكلمة البصيرة، لا أن تسكت وتترك المظلوم يُسحق تحت سمعك وبصرك.<\/p><\/details><details class=\"more\"><summary><b>إذا شهدت بالحق وخسرت أصدقائي في المدرسة فكيف أعيش في عزلة؟<\/b><\/summary><p>الصداقة التي تطلب منك خيانة ضميرك صداقة مسمومة. ومن أرضى الله بسخط الناس كفاه الله مؤنة الناس. وموقفك الشجاع سيجعل الأصدقاء أنفسهم يحترمون صدقك باطناً، وسيرزقك الله رفقة صالحة تشبهك.<\/p><\/details><\/section><section class=\"bs warn\"><h3>رادار الحماية<\/h3><p><b>مؤشرات الخطر:<\/b> تبرير الصمت المتكرر عن المنكرات، والمجاملة في الباطل، ونشر الإشاعات أو الضحك على الأذى، وشعور حاد بالقلق من رأي المجموعة، وتحول الفتى إلى ظل لمن حوله.<\/p><small>البروتوكول كاملاً في تبويب «الكامل».<\/small><\/section><section class=\"bs\"><h3>٥ · رحلة الأسبوع<\/h3><p class=\"\"><b>موقف حق واحد:<\/b> يطبق الطالب عبارته الحازمة في موقف حقيقي ويدوّن ما حدث.<\/p><p class=\"\"><b>نصرة مظلوم:<\/b> يقف إلى جانب زميل مستضعف بكلمة طيبة أو دعم عملي.<\/p><p class=\"\"><b>مراجعة الصمت:<\/b> يلاحظ مواضع سكوته عن الباطل هذا الأسبوع ويدوّنها للمشاركة.<\/p><p class=\"\"><b>جسر إلى اللقاء التاسع عشر:<\/b> الثبات على المبدأ يحتاج إلى هوية معتزة لا تذوب أمام الأقوى ولا تنبهر بما عنده. وهذا موضوع «الاعتزاز بالهوية».<\/p><\/section>", "slides": ["<div class=\"cn\">18<\/div><h2>ثبات المبدأ<\/h2><p class=\"q\">كيف نتحلى بالشجاعة الأدبية في المواقف الحرجة؟<\/p>", "<small>إضاءة استهلالية<\/small><h2>معضلة عُدَيّ<\/h2><ul><li class=\"frag\">ما الذي يخسره عدي إن شهد؟ وما الذي يخسره إن سكت؟ أيهما أثقل؟<\/li><li class=\"frag\">لو كنت مكان عمر، ماذا تتمنى أن يفعل عدي؟<\/li><\/ul>", "<small>1<\/small><h2>الخشية لله تسقط هيبة الخلق<\/h2><p class=\"ayah\">﴿الَّذِينَ يُبَلِّغُونَ رِسَالَاتِ اللَّهِ وَيَخْشَوْنَهُ وَلَا يَخْشَوْنَ أَحَدًا إِلَّا اللَّهَ ۗ وَكَفَىٰ بِاللَّهِ حَسِيبًا﴾ [الأحزاب: 39]<\/p><p class=\"g frag\">من استحضر رقابة الله سقطت عنده مخاوف السخرية من الأقران.<\/p>", "<small>2<\/small><h2>كتمان الحق إثم<\/h2><p class=\"ayah\">﴿وَلَا تَكْتُمُوا الشَّهَادَةَ ۚ وَمَن يَكْتُمْهَا فَإِنَّهُ آثِمٌ قَلْبُهُ﴾ [البقرة: 283]<\/p><p class=\"g frag\">الصمت عن الظلم ليس حيادا بل مشاركة فيه.<\/p>", "<small>3<\/small><h2>الصدع بالحق بشجاعة<\/h2><p class=\"had\">قال رسول الله ﷺ: «أَلاَ لاَ يَمْنَعَنَّ رَجُلاً هَيْبَةُ النَّاسِ أَنْ يَقُولَ بِحَقٍّ إِذَا عَلِمَهُ» رواه الترمذي وأحمد<\/p><p class=\"g frag\">الترمذي) الشجاعة الأدبية تتطلب الجهر بالحق بأدب وحزم.<\/p>", "<small>4<\/small><h2>الحكمة لا المداهنة<\/h2><p class=\"ayah\">﴿وَدُّوا لَوْ تُدْهِنُ فَيُدْهِنُونَ﴾ [القلم: 9]<\/p><p class=\"g frag\">الحكمة اختيار الأسلوب الأنسب للبيان، أما المداهنة فهي السكوت عن الباطل إرضاء للناس.<\/p>", "<small>سؤال للحوار<\/small><h2 class=\"big\">متى سكت عن حق خوفا من السخرية؟<\/h2>", "<small>نشاط تطبيقي<\/small><h2 class=\"big\">تمر ن على قول رأيك في موقف حرج بأدب وحزم أمام المجموعة.<\/h2>", "<small>سؤال وبرهان<\/small><details class=\"frag\"><summary><b>أليس من الحكمة والسياسة السكوت عن الباطل أحياناً لتجنب الصدام؟<\/b><\/summary><p>هناك بون شاسع بين الحكمة في أسلوب بيان الحق وبين المداهنة والسكوت عن الظلم. الحكمة تعني اختيار الوقت المناسب والكلمة البصيرة، لا أن تسكت وتترك المظلوم يُسحق تحت سمعك وبصرك.<\/p><\/details><details class=\"frag\"><summary><b>إذا شهدت بالحق وخسرت أصدقائي في المدرسة فكيف أعيش في عزلة؟<\/b><\/summary><p>الصداقة التي تطلب منك خيانة ضميرك صداقة مسمومة. ومن أرضى الله بسخط الناس كفاه الله مؤنة الناس. وموقفك الشجاع سيجعل الأصدقاء أنفسهم يحترمون صدقك باطناً، وسيرزقك الله رفقة صالحة تشبهك.<\/p><\/details><details class=\"frag\"><summary><b>هل تشمل الشجاعة الأدبية مناصحة المعلم أو الوالد إذا أخطأ؟<\/b><\/summary><p>نعم، ولكن بأعلى درجات التوقير والأدب. فالشجاعة ليست وقاحة. تكون المناصحة سراً وبلطف وبر، وبصيغة استفسار رفيق لا بالتطاول والتشهير.<\/p><\/details>", "<small>ميدان التطبيق<\/small><h2>«مختبر سُلّم الشجاعة الأدبية»  نشاط تدريبي<\/h2><ol><li class=\"frag\">1. الدرجة الأولى، الاعتراف: يكتب كل طالب موقفاً سابقاً تردد فيه وسكت عن قول الحق، ويحدد العائق النفسي: خجل أو خوف أو رغبة في القبول.<\/li><li class=\"frag\">2. الدرجة الثانية، تفكيك المخاوف: يكتب أسوأ ما كان سيحدث، ثم يقارنه بما كان سيحدث فعلاً.<\/li><li class=\"frag\">3. الدرجة الثالثة، العبارة الحازمة: يصوغ جملة صلبة ومؤدبة لقولها في مواقف مشابهة، مثل: «هذا ظلم ولا أقبل به» أو «هذا الكلام غيبة ولن أشارك فيه».<\/li><li class=\"frag\">4. الدرجة الرابعة، العهد: يوقّع تعهداً بالصدع بالحق هذا الأسبوع في موقف واحد على الأقل.<\/li><li class=\"frag\">5. دراسة حالة: طارق (16 سنة) في مجموعة دردشة تضم 15 طالباً.<\/li><li class=\"frag\">6. الاعتراض: أحد الطلاب يدافع عن السكوت: «لا تتدخل فيما لا يعنيك وتسلم»، وتناقشه المجموعات.<\/li><\/ol>", "<small>رحلة الأسبوع<\/small><ul><li class=\"frag\"><b>موقف حق واحد:<\/b> يطبق الطالب عبارته الحازمة في موقف حقيقي ويدوّن ما حدث.<\/li><li class=\"frag\"><b>نصرة مظلوم:<\/b> يقف إلى جانب زميل مستضعف بكلمة طيبة أو دعم عملي.<\/li><li class=\"frag\"><b>مراجعة الصمت:<\/b> يلاحظ مواضع سكوته عن الباطل هذا الأسبوع ويدوّنها للمشاركة.<\/li><li class=\"frag\"><b>جسر إلى اللقاء التاسع عشر:<\/b> الثبات على المبدأ يحتاج إلى هوية معتزة لا تذوب أمام الأقوى ولا تنبهر بما عنده. وهذا موضوع «الاعتزاز بالهوية».<\/li><\/ul>"], "n": 18, "u": 3, "title": "ثبات المبدأ", "q": "كيف نتحلى بالشجاعة الأدبية في المواقف الحرجة؟", "dqq": "متى سكت عن حق خوفا من السخرية؟", "pact": "تمر ن على قول رأيك في موقف حرج بأدب وحزم أمام المجموعة."}, {"summary": "<p class=\"\">يعيش الفتى في عالم مفتوح تغمره فيه صور الحضارة الغالبة تقنياً وإعلامياً، فيشعر أحياناً أن كل ما عند الآخرين متفوق وكل ما عنده متخلف. يتعلم الفتى في هذا اللقاء أن العزة أصل ملازم للمؤمن، وأن التفوق المادي لا يعني تفوق القيم، وأنه يستطيع أن يأخذ العلوم والصناعات النافعة دون أن يذوب في ثقافة غيره. ويتعلم أن اللسان العربي ووعاء الهوية، وأن نصرة الأمة تبدأ من نفسه وتخصصه وسلوكه.<\/p><p class=\"\">يميز بين العلوم النافعة التي يتعلمها والقيم الأخلاقية التي يعتز بمعيارها.<\/p><p class=\"\">يفهم أن إتقان لغة أجنبية لا يعني التبعية الثقافية.<\/p><p class=\"\">يحدد خطوة عملية يخدم بها أمته في تخصصه واهتمامه.<\/p><div class=\"tw\"><table><tr><th><b>المهارة<\/b><\/th><th><b>معناها العملي<\/b><\/th><\/tr><tr><td><b>الاستقلال الثقافي<\/b><\/td><td>ينتقي ما ينفعه ويرفض ما يخالف قيمه دون عقدة نقص<\/td><\/tr><tr><td><b>الانتماء الواعي<\/b><\/td><td>يربط نفسه بأمته ويتفاعل مع قضاياها بإيجابية<\/td><\/tr><tr><td><b>التمييز بين العلم والقيم<\/b><\/td><td>يفرّق بين المعرفة التقنية والمنظومة الأخلاقية<\/td><\/tr><\/table><\/div>", "kit": "<p class=\"\"><b>ما يعيشه الفتى:<\/b> يتأثر الفتى بما يراه من إنجازات تقنية وفنية غربية ومشاهير يتبعهم الملايين، فيشعر بالانبهار، وقد يخجل من لغته أو تاريخه. وهذا الشعور شائع ولا ينبغي معاملته كخيانة.<\/p><p class=\"\"><b>لا تعادِ التقنية والانفتاح:<\/b> المطلوب ألا ننغلق، بل أن نتفوق وننتقي بوعي.<\/p><p class=\"\"><b>اجعل الاعتزاز عملاً لا شعاراً:<\/b> الاعتزاز الحقيقي أن يتفوق الفتى في تخصصه ويرفع شأن أمته، لا أن يرفع الصوت بالفخر وهو متخلف.<\/p><p class=\"\"><b>احذر الاستعلاء الأجوف:<\/b> لا تحتقر الآخرين ولا تنكر إنجازاتهم، فالعدل مع الناس من الدين.<\/p><p class=\"\"><b>اربط بالواقع القريب:<\/b> اسأل الطلاب عن عادات ولغة ومصطلحات دخلت حياتهم دون أن ينتبهوا.<\/p>", "hookT": "زياد وراكان", "hook": "<p class=\"\"><b>زياد (17 سنة)<\/b> يشعر بالحرج إذا تحدث بالعربية أو استشهد بآية. يدس مصطلحات أجنبية مكسرة في كل جملة، ويقلد قصات شعر وسلوكيات مشاهير الغرب بحذافيرها. وإذا ذُكر تاريخ المسلمين ابتسم بسخرية: «نحن أمة متخلفة لا نملك إلا الماضي». أما <b>راكان (17 سنة)<\/b> فيتحدث العربية بفصاحة واعتزاز، وهو متفوق في البرمجة والفيزياء. وعندما يتحدث عن الحضارات يقول بتوازن: «نستفيد من علومهم وصناعاتهم النافعة، لكننا نترفع عن انحلالهم وإلحادهم؛ فنحن أصحاب رسالة خاتمة وهداية للبشرية».<\/p><p class=\"\"><b>أسئلة الاستثارة:<\/b><\/p><p class=\"\">أي الشابين يمكن أن يقدم لأمته أكثر؟ وأيهما يملك احتراماً حقيقياً لنفسه؟<\/p><p class=\"\">هل التمسك بالهوية يعني الانغلاق والتخلف؟ وكيف جمع راكان بين الاعتزاز والتفوق؟<\/p>", "pts": "<article class=\"pt\"><h4><span>أولاً<\/span>العزة أصل ملازم للمؤمن<\/h4><p class=\"ayah\">﴿وَلِلَّهِ الْعِزَّةُ وَلِرَسُولِهِ وَلِلْمُؤْمِنِينَ وَلَٰكِنَّ الْمُنَافِقِينَ لَا يَعْلَمُونَ﴾ [المنافقون: 8]<\/p><p class=\"\">العزة مستمدة من عزة الله ورسوله، وهي للمؤمنين أصلاً. فلا يسوغ لفتى مسلم أن يستشعر الدونية أو الانكسار أمام أي حضارة مادية. ومن لا يعلم هذا هم المنافقون الذين يقيسون العزة بالمال والقوة المادية فقط.<\/p><\/article><article class=\"pt\"><h4><span>ثانياً<\/span>النهي عن الوهن النفسي<\/h4><p class=\"ayah\">﴿وَلَا تَهِنُوا وَلَا تَحْزَنُوا وَأَنتُمُ الْأَعْلَوْنَ إِن كُنتُم مُّؤْمِنِينَ﴾ [آل عمران: 139]<\/p><p class=\"\">نزلت الآية في سياق هزيمة عسكرية بعد أحد، فوجّه الله المؤمنين إلى رفض الانكسار النفسي. والاستعلاء المقصود هو استعلاء الإيمان وقيمه، لا التعالي على الناس. وهذا الاستعلاء هو الحصن الذي يحفظ الهوية من الذوبان.<\/p><\/article><article class=\"pt\"><h4><span>ثالثاً<\/span>خيرية مشروطة بالعطاء<\/h4><p class=\"ayah\">﴿كُنتُمْ خَيْرَ أُمَّةٍ أُخْرِجَتْ لِلنَّاسِ تَأْمُرُونَ بِالْمَعْرُوفِ وَتَنْهَوْنَ عَنِ الْمُنكَرِ وَتُؤْمِنُونَ بِاللَّهِ﴾ [آل عمران: 110]<\/p><p class=\"\">الخيرية هنا ليست امتيازاً وراثياً بل وصف مرتبط بالعمل: الأمر بالمعروف والنهي عن المنكر والإيمان بالله. فمن أراد الاعتزاز بأمته فليكن إضافة لها، لا عبئاً عليها.<\/p><\/article><article class=\"pt\"><h4><span>رابعاً<\/span>التحذير من الذوبان والتبعية الهوجاء<\/h4><p class=\"had\">قال رسول الله ﷺ: «مَنْ تَشَبَّهَ بِقَوْمٍ فَهُوَ مِنْهُمْ» رواه أبو داود. وهو تحذير من التقليد الأعمى فيما يميز غير المسلمين من العقائد والشعارات والسلوكيات المخالفة للدين، وحماية لاستقلالية الشخصية. وقال ﷺ: «لاَ تَكُونُوا إِمَّعَةً، تَقُولُونَ: إِنْ أَحْسَنَ النَّاسُ أَحْسَنَّا، وَإِنْ ظَلَمُوا ظَلَمْنَا، وَلَكِنْ وَطِّنُوا أَنْفُسَكُمْ، إِنْ أَحْسَنَ النَّاسُ أَنْ تُحْسِنُوا، وَإِنْ أَسَاءُوا فَلاَ تَظْلِمُوا» رواه الترمذي. فشخصية الفتى المسلم مستقلة، تؤثر في واقعها ولا تذوب فيه.<\/p><\/article><article class=\"pt\"><h4><span>خامساً<\/span>جسد الأمة الواحد<\/h4><p class=\"had\">قال رسول الله ﷺ: «مَثَلُ الْمُؤْمِنِينَ فِي تَوَادِّهِمْ وَتَرَاحُمِهِمْ وَتَعَاطُفِهِمْ مَثَلُ الْجَسَدِ إِذَا اشْتَكَى مِنْهُ عُضْوٌ تَدَاعَى لَهُ سَائِرُ الْجَسَدِ بِالسَّهَرِ وَالْحُمَّى» متفق عليه<\/p><p class=\"\">الانتماء للأمة انتماء عقدي جامع يتجاوز الحدود، فيجعل الشاب حياً يتفاعل مع آلام إخوانه في كل مكان بالدعاء والمساندة والعمل. ولا يكون الانتماء صراخاً في الشاشات بل التزاماً وعطاءً.<\/p><\/article><article class=\"pt\"><h4><span>سادساً<\/span>ربعي بن عامر والاستعلاء الإيماني<\/h4><p class=\"\">تروي كتب التاريخ أن ربعي بن عامر رضي الله عنه دخل على رستم قائد الفرس، وقد ازدان مجلسه بالحرير والذهب، وهو بثيابه البسيطة وفرسه القصيرة. فلما سأله رستم: ما جاء بكم؟ قال بثقة: «اللَّهُ ابْتَعَثَنَا لِنُخْرِجَ مَنْ شَاءَ مِنْ عِبَادَةِ الْعِبَادِ إِلَى عِبَادَةِ اللَّهِ، وَمِنْ ضِيقِ الدُّنْيَا إِلَى سَعَتِهَا، وَمِنْ جَوْرِ الْأَدْيَانِ إِلَى عَدْلِ الْإِسْلَامِ». فالعزة ثقة بالرسالة لا بالمظهر والمال.<\/p><\/article><article class=\"pt\"><h4><span>سابعاً<\/span>العلم النافع لا يعني التبعية<\/h4><p class=\"\">أمر الله نبيه ﷺ أن يقول: ﴿وَقُل رَّبِّ زِدْنِي عِلْمًا﴾ [طه: 114]، ولم يحدد علماً دون علم. وقد أمر النبي ﷺ زيد بن ثابت رضي الله عنه أن يتعلم لغة اليهود (السريانية) ليأمن مكرهم، فتعلمها في نحو خمس عشرة ليلة. رواه الترمذي. فتعلم لغات الآخرين وعلومهم وسيلة للتمكن لا للذوبان. والمعيار هنا: خذ العلوم الكونية والتقنية النافعة وتفوق فيها، وارفض ما يخالف القيم والعقيدة.<\/p><\/article><article class=\"pt\"><h4><span>ثامناً<\/span>خريطة التعامل مع الثقافات الأخرى<\/h4><div class=\"tw\"><table><tr><th><b>المجال<\/b><\/th><th><b>موقفنا<\/b><\/th><th><b>مثال<\/b><\/th><\/tr><tr><td><b>العلوم التقنية والصناعات النافعة<\/b><\/td><td>نقتبسها ونتفوق فيها ونبني بها أمتنا<\/td><td>البرمجة، الفيزياء، الطب، اللغات<\/td><\/tr><tr><td><b>القيم الإيجابية المشتركة<\/b><\/td><td>نقبلها ونذكّر بأن ديننا سبق إليها<\/td><td>النظام، الصدق، إتقان العمل<\/td><\/tr><tr><td><b>الانحرافات الأخلاقية والإلحادية<\/b><\/td><td>نرفضها ونستعلي بإيماننا وقيمنا عنها<\/td><td>الإلحاد، الانحلال، الإساءة للمقدسات<\/td><\/tr><\/table><\/div><\/article><article class=\"pt\"><h4><span>تاسعاً<\/span>اللسان العربي وعاء الهوية<\/h4><p class=\"\">التحدث بالعربية الفصيحة شرف وعبادة ورباط بالقرآن، وتقول الأمم المتحضرة بلغاتها وتفخر بها. والرطانة المبتذلة واستبدال الكلمات العربية بغيرها دون حاجة علمية علامة على ضعف الثقة بالذات. ويستحسن للفتى إتقان لغة أجنبية على أنها أداة علم وتواصل، مع الحرص على لغته الأم.<\/p><\/article>", "qa": "<div class=\"tw\"><table><tr><th><b>السؤال المتوقع<\/b><\/th><th><b>تفكيكه<\/b><\/th><\/tr><tr><td><b>أليس الغربيون أفضل منا سلوكاً ونظاماً في شوارعهم ومؤسساتهم؟<\/b><\/td><td>النظام والصدق قيم إسلامية أصيلة دعا إليها ديننا قبل أن يطبقوها. فإذا أحسنوا في تطبيق قيمة فهذا يحسب للقيمة ذاتها. لكن تفوقهم الإداري لا يسوّغ قبول شذوذهم الأخلاقي وإلحادهم.<\/td><\/tr><tr><td><b>ألا يتطلب تعلم الإنجليزية والبرمجة أن نندمج في ثقافتهم وطرائقهم؟<\/b><\/td><td>هناك فرق بين إتقان اللغة أداة علم وتواصل، وبين تبني الثقافة والذوبان فيها. وهناك أمم أخرى متفوقة في التقنية تعتز بلغاتها وهوياتها أشد الاعتزاز.<\/td><\/tr><tr><td><b>ماذا أستطيع أن أقدم لأمتي وأنا شاب لا أملك سلطة ولا مالاً؟<\/b><\/td><td>تبدأ نصرة الأمة من نفسك: تفوقك الدراسي، وصيانة لسانك، وحفظ صلاتك، والدعاء للمستضعفين، والتخطيط لتكون رقماً صعباً في تخصصك لترفع راية أمتك.<\/td><\/tr><tr><td><b>هل الاعتزاز بالهوية يعني احتقار الآخرين؟<\/b><\/td><td>لا. الاستعلاء الإيماني استعلاء بالقيم لا بالأشخاص، وقد أمر الله بالعدل مع المخالفين: ﴿وَلَا يَجْرِمَنَّكُمْ شَنَآنُ قَوْمٍ عَلَىٰ أَلَّا تَعْدِلُوا﴾ [المائدة: 8].<\/td><\/tr><\/table><\/div>", "radar": "<p class=\"\"><b>مؤشرات الخطر:<\/b> السخرية من اللغة العربية والتاريخ الإسلامي، والإعجاب الأعمى بكل ما هو أجنبي، وتقليد الرموز المخالفة للدين، والتهاون في المساس بالمقدسات، أو الانغلاق العدائي الذي يرفض كل مفيد.<\/p><p class=\"\"><b>بروتوكول التدخل:<\/b><\/p><p class=\"step\"><b>1. <\/b>اسأله بهدوء عما يعجبه في هذا النموذج تحديداً، فقد يكشف جواب الفتى شعوراً بالنقص.<\/p><p class=\"step\"><b>2. <\/b>ميّز له بين ما يمكن الاستفادة منه وما يجب رفضه، بالأمثلة لا بالتعميم.<\/p><p class=\"step\"><b>3. <\/b>اقترح عليه مشروعاً عملياً يربطه بنفع أمته، فالعطاء أقوى علاج للشعور بالنقص.<\/p>", "actT": "«مختبر درع الهوية ومقاومة الذوبان»  نشاط حواري وتطبيقي", "act": "<p class=\"step\"><b>1. الرسم:<\/b> يرسم المدوّن على السبورة درعاً من أربعة قطاعات: اللسان، والمظهر، والعقل الناقد، ونصرة الأمة.<\/p><p class=\"step\"><b>2. قطاع اللسان:<\/b> يتعهد كل طالب بتنقية كلامه من الرطانة والاعتزاز بالعربية.<\/p><p class=\"step\"><b>3. قطاع المظهر:<\/b> يستبعد ما يروّج لرموز مخالفة للدين من ملابس أو شعارات.<\/p><p class=\"step\"><b>4. قطاع العقل الناقد:<\/b> يصوغ عبارة تفكك بريق الحضارة المادية الزائفة (مثل: «نأخذ علومهم لا انحلالهم»).<\/p><p class=\"step\"><b>5. قطاع نصرة الأمة:<\/b> يحدد خطوة عملية لخدمة قضايا المسلمين.<\/p><p class=\"step\"><b>6. دراسة حالة:<\/b> سامر (17 سنة) شغوف بالألعاب الإلكترونية. أطلقت شركة أجنبية لعبة مبهرة تقنياً، لكنها دسّت في مراحلها رموزاً وإهانات للمقدسات الإسلامية. شعر سامر بامتعاض أولي، لكن صديقه قال له: «هذه مجرد لعبة للتسلية، لا تخلط الدين بالترفيه». فاقتنع واشترى اللعبة وصار يدعو زملاءه إليها. وعندما سأله أخوه: «كيف تدفع مالك للعبة تسيء لدينك؟» أجاب: «نحن مستهلكون، وهم الأقوى والأذكى!». تحلل المجموعات: ما الخلل في موقف سامر؟ وما البديل؟<\/p><p class=\"step\"><b>7. الاعتراض:<\/b> أحد الطلاب يمثل المنبهر بالمظاهر الغربية ويدافع عنها، وتناقشه المجموعات.<\/p><div class=\"tw\"><table><tr><th colspan=\"2\"><b>بطاقة: درع الهوية<\/b><\/th><\/tr><tr><td><b>1. اللسان<\/b><\/td><td>تعهدي في تنقية كلامي: ............................<\/td><\/tr><tr><td><b>2. المظهر<\/b><\/td><td>ما سأتجنبه: ............................<\/td><\/tr><tr><td><b>3. العقل الناقد<\/b><\/td><td>عبارتي التي أفكك بها بريق الانبهار: ............................<\/td><\/tr><tr><td><b>4. نصرة الأمة<\/b><\/td><td>خطوة عملية أقوم بها هذا الأسبوع: ............................<\/td><\/tr><tr><td><b>5. شعار الدرع<\/b><\/td><td>«آخذ النافع بعقلي، وأحفظ هويتي بدينيّ، وأخدم أمتي بتفوقي»<\/td><\/tr><\/table><\/div>", "week": "<p class=\"\"><b>أسبوع اللسان:<\/b> يتحدث الطالب بالعربية الفصيحة المبسطة في اللقاءات ويتجنب الرطانة.<\/p><p class=\"\"><b>جرد التأثر:<\/b> يدوّن ثلاثة مصطلحات أو عادات أو رموز دخلت حياته دون وعي، ويحكم عليها بمعيار الدرع.<\/p><p class=\"\"><b>نصرة بالدعاء والعمل:<\/b> يدعو يومياً للمستضعفين من المسلمين، ويتبرع أو يساهم بعمل صغير.<\/p><p class=\"\"><b>جسر إلى الوحدة الخامسة:<\/b> وبعد أن بنينا الفتى فكراً وذاتاً وأولويات وهوية، ننتقل إلى إعداده لمهارات المستقبل. وهذا موضوع «المهارات المستقبلية والجاهزية العملية».<\/p>", "kq": "الانتماء الحضاري للأمة ومقاومة الذوبان والتبعية", "brief": "<div class=\"plan\"><span>اقتراح لتوزيع الوقت (١٠–١٥ د)<\/span><b>افتتاح ٣<\/b><b>محاور ٥<\/b><b>حوار ٢<\/b><b>نشاط ٣<\/b><b>ختام ٢<\/b><\/div><section class=\"bs\"><h3>١ · الافتتاح: زياد وراكان<\/h3><p class=\"\"><b>زياد (17 سنة)<\/b> يشعر بالحرج إذا تحدث بالعربية أو استشهد بآية. يدس مصطلحات أجنبية مكسرة في كل جملة، ويقلد قصات شعر وسلوكيات مشاهير الغرب بحذافيرها. وإذا ذُكر تاريخ المسلمين ابتسم بسخرية: «نحن أمة متخلفة لا نملك إلا الماضي». أما <b>راكان (17 سنة)<\/b> فيتحدث العربية بفصاحة واعتزاز، وهو متفوق في البرمجة والفيزياء. وعندما يتحدث عن الحضارات يقول بتوازن: «نستفيد من علومهم وصناعاتهم النافعة، لكننا نترفع عن انحلالهم وإلحادهم؛ فنحن أصحاب رسالة خاتمة وهداية للبشرية».<\/p><p class=\"\"><b>أسئلة الاستثارة:<\/b><\/p><p class=\"\">أي الشابين يمكن أن يقدم لأمته أكثر؟ وأيهما يملك احتراماً حقيقياً لنفسه؟<\/p><p class=\"\">هل التمسك بالهوية يعني الانغلاق والتخلف؟ وكيف جمع راكان بين الاعتزاز والتفوق؟<\/p><\/section><section class=\"bs\"><h3>٢ · المحاور<\/h3><article class=\"pt\"><h4><span>١<\/span>العزة أصل ملازم للمؤمن<\/h4><p class=\"ayah\">﴿وَلِلَّهِ الْعِزَّةُ وَلِرَسُولِهِ وَلِلْمُؤْمِنِينَ وَلَٰكِنَّ الْمُنَافِقِينَ لَا يَعْلَمُونَ﴾ [المنافقون: 8]<\/p><p class=\"g\">التفوق المادي لآلخرين لا يسوغ الشعور بالدونية أو الانكسار الحضاري.<\/p><details class=\"more\"><summary>للتوسع<\/summary><p class=\"\">العزة مستمدة من عزة الله ورسوله، وهي للمؤمنين أصلاً. فلا يسوغ لفتى مسلم أن يستشعر الدونية أو الانكسار أمام أي حضارة مادية. ومن لا يعلم هذا هم المنافقون الذين يقيسون العزة بالمال والقوة المادية فقط.<\/p><\/details><\/article><article class=\"pt\"><h4><span>٢<\/span>رفض التبعية والذوبان<\/h4><p class=\"g\">اقتباس العلوم التقنية ضرورة، لكن ذوبان الهوية وتقليد الانحرافات الأخلاقية هزيمة نفسية.<\/p><\/article><article class=\"pt\"><h4><span>٣<\/span>الانتماء لأمة الجسد الواحد<\/h4><p class=\"had\">قال رسول الله ﷺ: «مَثَلُ الْمُؤْمِنِينَ فِي تَوَادِّهِمْ وَتَرَاحُمِهِمْ وَتَعَاطُفِهِمْ مَثَلُ الْجَسَدِ إِذَا اشْتَكَى مِنْهُ عُضْوٌ تَدَاعَى لَهُ سَائِرُ الْجَسَدِ بِالسَّهَرِ وَالْحُمَّى» متفق عليه<\/p><p class=\"g\">الشاب المسلم يتفاعل مع آلام أمته، ويبدأ بنصرتها من تفوقه في تخصصه.<\/p><details class=\"more\"><summary>للتوسع<\/summary><p class=\"\">الانتماء للأمة انتماء عقدي جامع يتجاوز الحدود، فيجعل الشاب حياً يتفاعل مع آلام إخوانه في كل مكان بالدعاء والمساندة والعمل. ولا يكون الانتماء صراخاً في الشاشات بل التزاماً وعطاءً.<\/p><\/details><\/article><article class=\"pt\"><h4><span>٤<\/span>النهي عن الوهن النفسي<\/h4><p class=\"ayah\">﴿وَلَا تَهِنُوا وَلَا تَحْزَنُوا وَأَنتُمُ الْأَعْلَوْنَ إِن كُنتُم مُّؤْمِنِينَ﴾ [آل عمران: 139]<\/p><p class=\"g\">الاستعلاء بالقيم هو الحصن الذي يحمي العقل واللسان العربي.<\/p><details class=\"more\"><summary>للتوسع<\/summary><p class=\"\">نزلت الآية في سياق هزيمة عسكرية بعد أحد، فوجّه الله المؤمنين إلى رفض الانكسار النفسي. والاستعلاء المقصود هو استعلاء الإيمان وقيمه، لا التعالي على الناس. وهذا الاستعلاء هو الحصن الذي يحفظ الهوية من الذوبان.<\/p><\/details><\/article><\/section><section class=\"bs\"><h3>٣ · سؤال للحوار<\/h3><p class=\"big\">ما الذي تعتز به في هويتك؟ وما الذي تقل ده دون وعي؟<\/p><\/section><section class=\"bs\"><h3>٤ · نشاط تطبيقي<\/h3><p class=\"big\">قائمتان :ما نأخذه نافعا وما نرفضه، مع السبب.<\/p><\/section><section class=\"bs\"><h3>أسئلة قد تُطرح<\/h3><details class=\"more\"><summary><b>أليس الغربيون أفضل منا سلوكاً ونظاماً في شوارعهم ومؤسساتهم؟<\/b><\/summary><p>النظام والصدق قيم إسلامية أصيلة دعا إليها ديننا قبل أن يطبقوها. فإذا أحسنوا في تطبيق قيمة فهذا يحسب للقيمة ذاتها. لكن تفوقهم الإداري لا يسوّغ قبول شذوذهم الأخلاقي وإلحادهم.<\/p><\/details><details class=\"more\"><summary><b>ألا يتطلب تعلم الإنجليزية والبرمجة أن نندمج في ثقافتهم وطرائقهم؟<\/b><\/summary><p>هناك فرق بين إتقان اللغة أداة علم وتواصل، وبين تبني الثقافة والذوبان فيها. وهناك أمم أخرى متفوقة في التقنية تعتز بلغاتها وهوياتها أشد الاعتزاز.<\/p><\/details><\/section><section class=\"bs warn\"><h3>رادار الحماية<\/h3><p><b>مؤشرات الخطر:<\/b> السخرية من اللغة العربية والتاريخ الإسلامي، والإعجاب الأعمى بكل ما هو أجنبي، وتقليد الرموز المخالفة للدين، والتهاون في المساس بالمقدسات، أو الانغلاق العدائي الذي يرفض كل مفيد.<\/p><small>البروتوكول كاملاً في تبويب «الكامل».<\/small><\/section><section class=\"bs\"><h3>٥ · رحلة الأسبوع<\/h3><p class=\"\"><b>أسبوع اللسان:<\/b> يتحدث الطالب بالعربية الفصيحة المبسطة في اللقاءات ويتجنب الرطانة.<\/p><p class=\"\"><b>جرد التأثر:<\/b> يدوّن ثلاثة مصطلحات أو عادات أو رموز دخلت حياته دون وعي، ويحكم عليها بمعيار الدرع.<\/p><p class=\"\"><b>نصرة بالدعاء والعمل:<\/b> يدعو يومياً للمستضعفين من المسلمين، ويتبرع أو يساهم بعمل صغير.<\/p><p class=\"\"><b>جسر إلى الوحدة الخامسة:<\/b> وبعد أن بنينا الفتى فكراً وذاتاً وأولويات وهوية، ننتقل إلى إعداده لمهارات المستقبل. وهذا موضوع «المهارات المستقبلية والجاهزية العملية».<\/p><\/section>", "slides": ["<div class=\"cn\">19<\/div><h2>الاعتزاز بالهوية<\/h2><p class=\"q\">كيف نحافظ على استقاللنا الثقافي دون انغالق؟<\/p>", "<small>إضاءة استهلالية<\/small><h2>زياد وراكان<\/h2><ul><li class=\"frag\">أي الشابين يمكن أن يقدم لأمته أكثر؟ وأيهما يملك احتراماً حقيقياً لنفسه؟<\/li><li class=\"frag\">هل التمسك بالهوية يعني الانغلاق والتخلف؟ وكيف جمع راكان بين الاعتزاز والتفوق؟<\/li><\/ul>", "<small>1<\/small><h2>العزة أصل ملازم للمؤمن<\/h2><p class=\"ayah\">﴿وَلِلَّهِ الْعِزَّةُ وَلِرَسُولِهِ وَلِلْمُؤْمِنِينَ وَلَٰكِنَّ الْمُنَافِقِينَ لَا يَعْلَمُونَ﴾ [المنافقون: 8]<\/p><p class=\"g frag\">التفوق المادي لآلخرين لا يسوغ الشعور بالدونية أو الانكسار الحضاري.<\/p>", "<small>2<\/small><h2>رفض التبعية والذوبان<\/h2><p class=\"g frag\">اقتباس العلوم التقنية ضرورة، لكن ذوبان الهوية وتقليد الانحرافات الأخلاقية هزيمة نفسية.<\/p>", "<small>3<\/small><h2>الانتماء لأمة الجسد الواحد<\/h2><p class=\"had lg\">قال رسول الله ﷺ: «مَثَلُ الْمُؤْمِنِينَ فِي تَوَادِّهِمْ وَتَرَاحُمِهِمْ وَتَعَاطُفِهِمْ مَثَلُ الْجَسَدِ إِذَا اشْتَكَى مِنْهُ عُضْوٌ تَدَاعَى لَهُ سَائِرُ الْجَسَدِ بِالسَّهَرِ وَالْحُمَّى» متفق عليه<\/p><p class=\"g frag\">الشاب المسلم يتفاعل مع آلام أمته، ويبدأ بنصرتها من تفوقه في تخصصه.<\/p>", "<small>4<\/small><h2>النهي عن الوهن النفسي<\/h2><p class=\"ayah\">﴿وَلَا تَهِنُوا وَلَا تَحْزَنُوا وَأَنتُمُ الْأَعْلَوْنَ إِن كُنتُم مُّؤْمِنِينَ﴾ [آل عمران: 139]<\/p><p class=\"g frag\">الاستعلاء بالقيم هو الحصن الذي يحمي العقل واللسان العربي.<\/p>", "<small>سؤال للحوار<\/small><h2 class=\"big\">ما الذي تعتز به في هويتك؟ وما الذي تقل ده دون وعي؟<\/h2>", "<small>نشاط تطبيقي<\/small><h2 class=\"big\">قائمتان :ما نأخذه نافعا وما نرفضه، مع السبب.<\/h2>", "<small>سؤال وبرهان<\/small><details class=\"frag\"><summary><b>أليس الغربيون أفضل منا سلوكاً ونظاماً في شوارعهم ومؤسساتهم؟<\/b><\/summary><p>النظام والصدق قيم إسلامية أصيلة دعا إليها ديننا قبل أن يطبقوها. فإذا أحسنوا في تطبيق قيمة فهذا يحسب للقيمة ذاتها. لكن تفوقهم الإداري لا يسوّغ قبول شذوذهم الأخلاقي وإلحادهم.<\/p><\/details><details class=\"frag\"><summary><b>ألا يتطلب تعلم الإنجليزية والبرمجة أن نندمج في ثقافتهم وطرائقهم؟<\/b><\/summary><p>هناك فرق بين إتقان اللغة أداة علم وتواصل، وبين تبني الثقافة والذوبان فيها. وهناك أمم أخرى متفوقة في التقنية تعتز بلغاتها وهوياتها أشد الاعتزاز.<\/p><\/details><details class=\"frag\"><summary><b>ماذا أستطيع أن أقدم لأمتي وأنا شاب لا أملك سلطة ولا مالاً؟<\/b><\/summary><p>تبدأ نصرة الأمة من نفسك: تفوقك الدراسي، وصيانة لسانك، وحفظ صلاتك، والدعاء للمستضعفين، والتخطيط لتكون رقماً صعباً في تخصصك لترفع راية أمتك.<\/p><\/details><details class=\"frag\"><summary><b>هل الاعتزاز بالهوية يعني احتقار الآخرين؟<\/b><\/summary><p>لا. الاستعلاء الإيماني استعلاء بالقيم لا بالأشخاص، وقد أمر الله بالعدل مع المخالفين: ﴿وَلَا يَجْرِمَنَّكُمْ شَنَآنُ قَوْمٍ عَلَىٰ أَلَّا تَعْدِلُوا﴾ [المائدة: 8].<\/p><\/details>", "<small>ميدان التطبيق<\/small><h2>«مختبر درع الهوية ومقاومة الذوبان»  نشاط حواري وتطبيقي<\/h2><ol><li class=\"frag\">1. الرسم: يرسم المدوّن على السبورة درعاً من أربعة قطاعات: اللسان، والمظهر، والعقل الناقد، ونصرة الأمة.<\/li><li class=\"frag\">2. قطاع اللسان: يتعهد كل طالب بتنقية كلامه من الرطانة والاعتزاز بالعربية.<\/li><li class=\"frag\">3. قطاع المظهر: يستبعد ما يروّج لرموز مخالفة للدين من ملابس أو شعارات.<\/li><li class=\"frag\">4. قطاع العقل الناقد: يصوغ عبارة تفكك بريق الحضارة المادية الزائفة (مثل: «نأخذ علومهم لا انحلالهم»).<\/li><li class=\"frag\">5. قطاع نصرة الأمة: يحدد خطوة عملية لخدمة قضايا المسلمين.<\/li><li class=\"frag\">6. دراسة حالة: سامر (17 سنة) شغوف بالألعاب الإلكترونية.<\/li><li class=\"frag\">7. الاعتراض: أحد الطلاب يمثل المنبهر بالمظاهر الغربية ويدافع عنها، وتناقشه المجموعات.<\/li><\/ol>", "<small>رحلة الأسبوع<\/small><ul><li class=\"frag\"><b>أسبوع اللسان:<\/b> يتحدث الطالب بالعربية الفصيحة المبسطة في اللقاءات ويتجنب الرطانة.<\/li><li class=\"frag\"><b>جرد التأثر:<\/b> يدوّن ثلاثة مصطلحات أو عادات أو رموز دخلت حياته دون وعي، ويحكم عليها بمعيار الدرع.<\/li><li class=\"frag\"><b>نصرة بالدعاء والعمل:<\/b> يدعو يومياً للمستضعفين من المسلمين، ويتبرع أو يساهم بعمل صغير.<\/li><li class=\"frag\"><b>جسر إلى الوحدة الخامسة:<\/b> وبعد أن بنينا الفتى فكراً وذاتاً وأولويات وهوية، ننتقل إلى إعداده لمهارات المستقبل. وهذا موضوع «المهارات المستقبلية والجاهزية العملية».<\/li><\/ul>"], "n": 19, "u": 3, "title": "الاعتزاز بالهوية", "q": "كيف نحافظ على استقاللنا الثقافي دون انغالق؟", "dqq": "ما الذي تعتز به في هويتك؟ وما الذي تقل ده دون وعي؟", "pact": "قائمتان :ما نأخذه نافعا وما نرفضه، مع السبب."}, {"summary": "<p class=\"\">كم من فكرة عظيمة ماتت لأن صاحبها لم يعرف كيف يقدمها، وكم من فكرة متواضعة نجحت لأن صاحبها أحسن عرضها. يتعلم الفتى في هذا اللقاء أن الإلقاء مهارة مكتسبة تُبنى بالتدريب، وأن البيان نعمة امتنّ الله بها على الإنسان، وأن التأثير يجتمع فيه الصوت والجسد والكلمة. ويتدرب على التعامل مع الرهبة وتحويلها إلى حضور.<\/p><p class=\"\">يفهم أن الإلقاء الجيد خدمة للحق وإكرام للسامع، لا استعراض ولا رياء.<\/p><p class=\"\">يتعلم بنية كلمة قصيرة مؤثرة: مقدمة وصلب وخاتمة ودعوة للعمل.<\/p><p class=\"\">يتدرب على الثبات الجسدي والتنويع الصوتي والتواصل البصري.<\/p><div class=\"tw\"><table><tr><th><b>المهارة<\/b><\/th><th><b>معناها العملي<\/b><\/th><\/tr><tr><td><b>الإلقاء والتأثير<\/b><\/td><td>يعرض فكرته بوضوح وترتيب وحضور أمام الجمهور<\/td><\/tr><tr><td><b>التحكم في الرهبة<\/b><\/td><td>يحوّل التوتر إلى طاقة بالتنفس والتحضير والتركيز على السامع<\/td><\/tr><tr><td><b>لغة الجسد والصوت<\/b><\/td><td>يستعمل الوقفة واليدين والنظر والنبرة لخدمة المعنى<\/td><\/tr><\/table><\/div>", "kit": "<p class=\"\"><b>ما يعيشه الفتى:<\/b> أكثر ما يخيف الفتى في هذه السن أن يضحك عليه زملاؤه إذا أخطأ أمامهم. ولذلك يهرب من المنصة ويصف نفسه بأنه خجول بطبعه، فيحرم نفسه فرصاً كثيرة.<\/p><p class=\"\"><b>اصنع بيئة آمنة:<\/b> اتفق مع الطلاب منذ البداية ألا يسخر أحد من متحدث، وأن التعليق يكون على الأداء لا على الشخص.<\/p><p class=\"\"><b>ابدأ بمن يستعد:<\/b> لا تُجبر أحداً على الصعود المفاجئ، وشجّع المتردد بدور مساند كالتقديم أو المراقبة.<\/p><p class=\"\"><b>كن قدوة في الإلقاء:<\/b> أظهر لهم في اللقاء كيف تقف وتنظر وتتوقف، فالقدوة تعلّم أكثر من الشرح.<\/p><p class=\"\"><b>ركز على التقدم:<\/b> قارن الفتى بنفسه قبل أسبوع لا بزميله الأفصح.<\/p>", "hookT": "زياد وحسام في مسابقة المبادرات", "hook": "<p class=\"\">في مسابقة المبادرات الشبابية تقدم طالبان بمشروعين. <b>زياد (17 سنة)<\/b> يملك فكرة تقنية مبتكرة لحل أزمة تسرب المياه في المدن. صعد المنصة فارتبك، ونظر إلى السقف والأرض، ويداه ترتجفان في جيبه، وتحدث بنبرة واحدة منخفضة متلعثمة وقرأ الشرائح حرفياً دون أن ينظر إلى الحكام. شعر الجمهور بالملل ولم يفهم الحكام فكرته فرُفض مشروعه. أما <b>حسام (17 سنة)<\/b> فيملك فكرة متواضعة لجمع الكتب القديمة، لكنه صعد بثبات: ظهره مستقيم، وابتسامة واثقة، ونظراته تشمل الحضور، وصوته يتموج بين الهدوء والحماس، ويداه ترسمان المعاني بوقار. فاز بالمركز الأول وحظي بدعم كامل لمشروعه.<\/p><p class=\"\"><b>أسئلة الاستثارة:<\/b><\/p><p class=\"\">ما الذي قتل فكرة زياد؟ وما الذي رفع فكرة حسام؟<\/p><p class=\"\">كم فكرة نافعة في حياتنا ضاعت لأن أصحابها لم يحسنوا عرضها؟<\/p>", "pts": "<article class=\"pt\"><h4><span>أولاً<\/span>البيان نعمة من الله<\/h4><p class=\"ayah\">﴿الرَّحْمَٰنُ * عَلَّمَ الْقُرْآنَ * خَلَقَ الْإِنسَانَ * عَلَّمَهُ الْبَيَانَ﴾ [الرحمن: 1-4]<\/p><p class=\"\">امتنّ الله على الإنسان بنعمة البيان، أي القدرة على الإفصاح عما في نفسه وإفهام غيره. فالفصاحة والتعبير من أخص خصائص التكريم الإنساني، وإحسانهما شكر لهذه النعمة. وقال تعالى لنبيه ﷺ في أمر النصيحة: ﴿وَقُل لَّهُمْ فِي أَنفُسِهِمْ قَوْلًا بَلِيغًا﴾ [النساء: 63]، فجعل بلاغة القول مطلوبة في الدعوة والتأثير.<\/p><\/article><article class=\"pt\"><h4><span>ثانياً<\/span>موسى عليه السلام يسأل ربه انطلاق اللسان<\/h4><p class=\"ayah\">﴿قَالَ رَبِّ اشْرَحْ لِي صَدْرِي * وَيَسِّرْ لِي أَمْرِي * وَاحْلُلْ عُقْدَةً مِّن لِّسَانِي * يَفْقَهُوا قَوْلِي﴾ [طه: 25-28]<\/p><p class=\"\">لما كُلّف موسى عليه السلام بأعظم رسالة لجأ إلى الدعاء، وبدأ بشرح الصدر قبل حل عقدة اللسان. وفي الدعاء ترتيب مهم: الطمأنينة الداخلية أولاً ثم الفصاحة، وغاية ذلك ﴿يَفْقَهُوا قَوْلِي﴾، أي أن يفهم الناس. فالغاية من الإلقاء الفهم والتأثير، لا الزخرفة.<\/p><\/article><article class=\"pt\"><h4><span>ثالثاً<\/span>الإيجاز والبيان<\/h4><p class=\"had\">قال رسول الله ﷺ: «إِنَّ طُولَ صَلاَةِ الرَّجُلِ وَقِصَرَ خُطْبَتِهِ مَئِنَّةٌ مِنْ فِقْهِهِ، فَأَطِيلُوا الصَّلاَةَ وَاقْصُرُوا الخُطْبَةَ، وَإِنَّ مِنَ البَيَانِ لَسِحْرًا» رواه مسلم. ففي الحديث أن قصر الخطبة دليل على عمق الفقه، فمن فهم الفكرة اختصرها. وأن في البيان قوة تأثير حقيقية يجب أن تُستعمل في الحق لا في الباطل.<\/p><\/article><article class=\"pt\"><h4><span>رابعاً<\/span>الهدي النبوي في الكلام<\/h4><p class=\"\">قالت عائشة رضي الله عنها: «كَانَ كَلاَمُ رَسُولِ اللَّهِ ﷺ كَلاَمًا فَصْلاً يَفْهَمُهُ كُلُّ مَنْ سَمِعَهُ» رواه أبو داود. فالهدي النبوي في الإلقاء: التأني والوضوح والفصل بين الجمل ليفهم السامع. وهذه قواعد عملية: لا تسرع، ولا تدمج الأفكار، وتوقف بين فكرة وأخرى.<\/p><\/article><article class=\"pt\"><h4><span>خامساً<\/span>النبي ﷺ على الصفا<\/h4><p class=\"\">لما أُمر النبي ﷺ بالجهر بالدعوة صعد الصفا ونادى بطون قريش، فلما اجتمعوا قال لهم: «أَرَأَيْتَكُمْ لَوْ أَخْبَرْتُكُمْ أَنَّ خَيْلاً بِالوَادِي تُرِيدُ أَنْ تُغِيرَ عَلَيْكُمْ، أَكُنْتُمْ مُصَدِّقِيَّ؟» قالوا: نعم، ما جربنا عليك إلا صدقاً. رواه البخاري. ففي الموقف تقديم بسؤال يفتح العقول، وشاهد عقلي يعرفه الجميع، ثم عرض الرسالة. فبنية الكلمة المؤثرة: افتتاح يجذب وحجة تقنع ثم دعوة.<\/p><\/article><article class=\"pt\"><h4><span>سادساً<\/span>تشريح الرسالة الإلقائية<\/h4><div class=\"tw\"><table><tr><th><b>العنصر<\/b><\/th><th><b>ما يشمله<\/b><\/th><th><b>تطبيق عملي<\/b><\/th><\/tr><tr><td><b>لغة الجسد<\/b><\/td><td>ثبات القدمين، استقامة الظهر، اليدان المفتوحتان، التواصل البصري مع جميع الجهات<\/td><td>قف كالشجرة، ولا تُبقِ يديك في جيبك، وانظر إلى كل ركن في القاعة<\/td><\/tr><tr><td><b>الصوت<\/b><\/td><td>التنويع بين الحماس والهدوء، ورفع النبرة عند المعاني المهمة، والوقفات الذكية<\/td><td>توقف ثانيتين قبل الجملة المهمة وبعدها<\/td><\/tr><tr><td><b>الكلمات<\/b><\/td><td>فصاحة اللفظ، والبعد عن التقعر والابتذال، وفكرة مركزية واحدة<\/td><td>اجعل كلمتك تدور حول جملة واحدة يتذكرها السامع<\/td><\/tr><\/table><\/div><\/article><article class=\"pt\"><h4><span>سابعاً<\/span>التعامل مع الرهبة<\/h4><p class=\"\">التوتر ليس دليل فشل، بل طاقة طبيعية يفرزها الجسم للتحفز. والحل في ثلاثة أمور: التنفس العميق من البطن قبل الصعود، والتحضير الممتاز (فمن عرف مادته أقل خوفاً)، وتحويل التركيز من «كيف ينظر الناس إليّ» إلى «ما الفائدة التي أريد إيصالها لهم». فمن نوى خدمة الجمهور خفّ عنه ثقل نظرتهم. وأعظم الخطباء عانوا في بداياتهم من اللعثمة والرهبة، وتحولت رهبتهم بالممارسة إلى قوة حضور.<\/p><\/article><article class=\"pt\"><h4><span>ثامناً<\/span>النية بين الرياء والإتقان<\/h4><p class=\"\">العناية بالصوت وطريقة الوقوف لا تعني الرياء. فالنية هي التي تفصل بين التبليغ المأجور والاستعراض المذموم. إذا قصدت إيصال الحق وإكرام السامع بأسلوب حسن فأنت في عبادة، وإذا قصدت جلب الإعجاب لنفسك فاحذر. وقد قال النبي ﷺ: «إِنَّ اللَّهَ يُحِبُّ إِذَا عَمِلَ أَحَدُكُمْ عَمَلاً أَنْ يُتْقِنَهُ» رواه البيهقي. فالإتقان في الإلقاء من هذا الباب.<\/p><\/article>", "qa": "<div class=\"tw\"><table><tr><th><b>السؤال المتوقع<\/b><\/th><th><b>تفكيكه<\/b><\/th><\/tr><tr><td><b>هل الخطابة موهبة فطرية، فلا يمكن للشخص الخجول تعلمها؟<\/b><\/td><td>الإلقاء مهارة تُكتسب بالتدريب والتكرار. وكثير ممن يُشار إليهم بالفصاحة تدربوا كثيراً وعانوا في البدايات. وبالممارسة المستمرة تتحول الرهبة إلى حضور.<\/td><\/tr><tr><td><b>ألا يُعد تجميل الصوت والاعتناء بلغة الجسد نوعاً من الرياء والتصنع؟<\/b><\/td><td>الشريعة دعت إلى البلاغة: ﴿وَقُل لَّهُمْ فِي أَنفُسِهِمْ قَوْلًا بَلِيغًا﴾. والعناية بأسلوب الإلقاء إكرام للحق وإعانة للسامع على الفهم، والنية الصادقة هي التي تفرق بين التبليغ والاستعراض.<\/td><\/tr><tr><td><b>كيف أتصرف إذا نسيت الفكرة وأنا على المنصة وتملكني الصمت؟<\/b><\/td><td>لا ترتبك ولا تعتذر. خذ نفساً عميقاً واصمت ثلاث ثوانٍ، فسيعدّها الجمهور وقفة مقصودة. ثم أعد آخر فكرة قلتها بهدوء، أو انتقل إلى النقطة التالية.<\/td><\/tr><\/table><\/div>", "radar": "<p class=\"\"><b>مؤشرات الخطر:<\/b> تهرب متكرر من كل مشاركة أمام الآخرين، ووصف الذات بأنها «خجولة بطبعها»، وسخرية الطلاب من متحدث، وانهيار الفتى بعد موقف محرج واحد، أو الغرور المفرط بعد نجاح أول.<\/p><p class=\"\"><b>بروتوكول التدخل:<\/b><\/p><p class=\"step\"><b>1. <\/b>اجلس مع الفتى وصف له أن الخطأ الأول طبيعي وأن لكل خطيب بداية متعثرة.<\/p><p class=\"step\"><b>2. <\/b>اتفقا على خطوة صغيرة: كلمة من دقيقة أمام مجموعة صغيرة بعد تحضير مسبق.<\/p><p class=\"step\"><b>3. <\/b>تدخل بحزم عند أي سخرية من متحدث، وذكّر المجموعة بميثاق الأمان.<\/p>", "actT": "«مسرح تحدي التسعين ثانية»  نشاط تدريبي", "act": "<p class=\"step\"><b>1. التحضير:<\/b> يختار كل فتى فكرة قيمية محددة (أهمية صلاة الفجر، أو خطر الإدمان الرقمي، أو بر الوالدين، أو شغفه بالبرمجة)، ويحضّر كلمته بشكل موجز.<\/p><p class=\"step\"><b>2. البنية:<\/b> مقدمة آسرة بسؤال صادم أو رقم، ثم صلب الفكرة مع استشهاد قرآني أو واقعي، ثم خاتمة بدعوة محددة للعمل.<\/p><p class=\"step\"><b>3. الأداء:<\/b> يلقي كل طالب كلمته في تسعين ثانية تقريباً، بثبات القدمين وتواصل بصري شامل وحركات يدين مفتوحة ومتزنة.<\/p><p class=\"step\"><b>4. التقييم:<\/b> يرصد مدرب لغة الجسد (من الطلاب) الثبات والنظر وحركة اليدين، ويعطي كل متحدث نقطة قوة ونقطة تطوير.<\/p><p class=\"step\"><b>5. دراسة حالة:<\/b> منذر (16 سنة) طالب متفوق حافظ لكتاب الله، اختاره المعلم لإلقاء كلمة الصباح أمام خمسمئة طالب ومعلم. وقف أمام اللاقط فداهمه الذعر، وتسارعت دقات قلبه وجفّ حلقه، ووضع يديه في جيبه وقرأ بسرعة وبصوت خافت متلعثم. فلما همس بعض الطلاب ضاحكين قطع الكلمة ونزل راكضاً وأقسم ألا يواجه الناس ثانية. وبعد أسبوع عُرضت عليه مسابقة إلقاء فرفض قائلاً: «أنا خجول بطبعي والمنصات ليست لي». تحلل المجموعات: ما الذي أخطأ فيه؟ وكيف نعيده إلى المنصة تدريجياً؟<\/p><p class=\"step\"><b>6. الاعتراض:<\/b> أحد الطلاب يدافع عن «الكلام العفوي دون تحضير أفضل»، وتناقشه المجموعات.<\/p><div class=\"tw\"><table><tr><th colspan=\"2\"><b>بطاقة: كلمتي القيادية<\/b><\/th><\/tr><tr><td><b>1. الفكرة المركزية<\/b><\/td><td>جملة واحدة: ............................<\/td><\/tr><tr><td><b>2. الافتتاحية الآسرة<\/b><\/td><td>سؤال أو رقم: ............................<\/td><\/tr><tr><td><b>3. الدليل (آية أو واقعة)<\/b><\/td><td>............................<\/td><\/tr><tr><td><b>4. الدعوة للعمل<\/b><\/td><td>ماذا أريد من السامع أن يفعل؟ ............................<\/td><\/tr><tr><td><b>5. ملاحظة المدرب<\/b><\/td><td>نقطة قوة: ............ نقطة تطوير: ............<\/td><\/tr><\/table><\/div>", "week": "<p class=\"\"><b>كلمة يومية:<\/b> يلقي الطالب كلمة قصيرة أمام المرآة أو أمام أسرته ثلاث مرات هذا الأسبوع.<\/p><p class=\"\"><b>مشاركة علنية:<\/b> يشارك مرة واحدة على الأقل في مجلس أو صف بكلمة محضّرة.<\/p><p class=\"\"><b>دعاء موسى:<\/b> يدعو بدعاء ﴿رَبِّ اشْرَحْ لِي صَدْرِي﴾ قبل كل مشاركة.<\/p><p class=\"\"><b>جسر إلى اللقاء الحادي والعشرين:<\/b> وبعد أن تعلمنا كيف نعبّر بوضوح، نتعلم كيف نعمل مع الآخرين في فريق واحد. وهذا موضوع «العمل الجماعي».<\/p>", "kq": "التعبير عن الأفكار بقوة وثقة أمام الجمهور وإتقان لغة الجسد", "brief": "<div class=\"plan\"><span>اقتراح لتوزيع الوقت (١٠–١٥ د)<\/span><b>افتتاح ٣<\/b><b>محاور ٥<\/b><b>حوار ٢<\/b><b>نشاط ٣<\/b><b>ختام ٢<\/b><\/div><section class=\"bs\"><h3>١ · الافتتاح: زياد وحسام في مسابقة المبادرات<\/h3><p class=\"\">في مسابقة المبادرات الشبابية تقدم طالبان بمشروعين. <b>زياد (17 سنة)<\/b> يملك فكرة تقنية مبتكرة لحل أزمة تسرب المياه في المدن. صعد المنصة فارتبك، ونظر إلى السقف والأرض، ويداه ترتجفان في جيبه، وتحدث بنبرة واحدة منخفضة متلعثمة وقرأ الشرائح حرفياً دون أن ينظر إلى الحكام. شعر الجمهور بالملل ولم يفهم الحكام فكرته فرُفض مشروعه. أما <b>حسام (17 سنة)<\/b> فيملك فكرة متواضعة لجمع الكتب القديمة، لكنه صعد بثبات: ظهره مستقيم، وابتسامة واثقة، ونظراته تشمل الحضور، وصوته يتموج بين الهدوء والحماس، ويداه ترسمان المعاني بوقار. فاز بالمركز الأول وحظي بدعم كامل لمشروعه.<\/p><p class=\"\"><b>أسئلة الاستثارة:<\/b><\/p><p class=\"\">ما الذي قتل فكرة زياد؟ وما الذي رفع فكرة حسام؟<\/p><p class=\"\">كم فكرة نافعة في حياتنا ضاعت لأن أصحابها لم يحسنوا عرضها؟<\/p><\/section><section class=\"bs\"><h3>٢ · المحاور<\/h3><article class=\"pt\"><h4><span>١<\/span>البيان نعمة من الله<\/h4><p class=\"ayah\">﴿الرَّحْمَٰنُ * عَلَّمَ الْقُرْآنَ * خَلَقَ الْإِنسَانَ * عَلَّمَهُ الْبَيَانَ﴾ [الرحمن: 1-4]<\/p><p class=\"g\">الفصاحة والقدرة على إيصال الفكرة شكر لهذه النعمة وخدمة للحق.<\/p><details class=\"more\"><summary>للتوسع<\/summary><p class=\"\">امتنّ الله على الإنسان بنعمة البيان، أي القدرة على الإفصاح عما في نفسه وإفهام غيره. فالفصاحة والتعبير من أخص خصائص التكريم الإنساني، وإحسانهما شكر لهذه النعمة. وقال تعالى لنبيه ﷺ في أمر النصيحة: ﴿وَقُل لَّهُمْ فِي أَنفُسِهِمْ قَوْلًا بَلِيغًا﴾ [النساء: 63]، فجعل بلاغة القول مطلوبة في الدعوة والتأثير.<\/p><\/details><\/article><article class=\"pt\"><h4><span>٢<\/span>الاستعانة بالله لفك الرهبة<\/h4><p class=\"g\">الطمأنينة الداخلية تسبق طالقة اللسان.<\/p><details class=\"more\"><summary>للتوسع<\/summary><p class=\"\">التوتر ليس دليل فشل، بل طاقة طبيعية يفرزها الجسم للتحفز. والحل في ثلاثة أمور: التنفس العميق من البطن قبل الصعود، والتحضير الممتاز (فمن عرف مادته أقل خوفاً)، وتحويل التركيز من «كيف ينظر الناس إليّ» إلى «ما الفائدة التي أريد إيصالها لهم». فمن نوى خدمة الجمهور خفّ عنه ثقل نظرتهم. وأعظم الخطباء عانوا في بداياتهم من اللعثمة والرهبة، وتحولت رهبتهم بالممارسة إلى قوة حضور.<\/p><\/details><\/article><article class=\"pt\"><h4><span>٣<\/span>الإيجاز ووضوح الفكرة<\/h4><p class=\"had\">قال رسول الله ﷺ: «إِنَّ طُولَ صَلاَةِ الرَّجُلِ وَقِصَرَ خُطْبَتِهِ مَئِنَّةٌ مِنْ فِقْهِهِ، فَأَطِيلُوا الصَّلاَةَ وَاقْصُرُوا الخُطْبَةَ، وَإِنَّ مِنَ البَيَانِ لَسِحْرًا» رواه مسلم. ففي الحديث أن قصر الخطبة دليل على عمق الفقه، فمن فهم الفكرة اختصرها. وأن في البيان قوة تأثير حقيقية يجب أن تُستعمل في الحق لا في الباطل.<\/p><p class=\"g\">مسلم) الكلمة المؤثرة لها فكرة مركزية واحدة وتتسم بالوضوح المتأني.<\/p><details class=\"more\"><summary>للتوسع<\/summary><\/details><\/article><article class=\"pt\"><h4><span>٤<\/span>النية بين الإتقان والرياء<\/h4><p class=\"g\">العناية بلغة الجسد والصوت إكرام للسامع وليس استعراضا مذموما.<\/p><details class=\"more\"><summary>للتوسع<\/summary><p class=\"\">العناية بالصوت وطريقة الوقوف لا تعني الرياء. فالنية هي التي تفصل بين التبليغ المأجور والاستعراض المذموم. إذا قصدت إيصال الحق وإكرام السامع بأسلوب حسن فأنت في عبادة، وإذا قصدت جلب الإعجاب لنفسك فاحذر. وقد قال النبي ﷺ: «إِنَّ اللَّهَ يُحِبُّ إِذَا عَمِلَ أَحَدُكُمْ عَمَلاً أَنْ يُتْقِنَهُ» رواه البيهقي. فالإتقان في الإلقاء من هذا الباب.<\/p><\/details><\/article><\/section><section class=\"bs\"><h3>٣ · سؤال للحوار<\/h3><p class=\"big\">ما الذي يخيفك عند الوقوف أمام الناس؟<\/p><\/section><section class=\"bs\"><h3>٤ · نشاط تطبيقي<\/h3><p class=\"big\">ألق كلمة مدتها  ٩٠ثانية بفكرة واحدة، واستمع للتغذية الراجعة.<\/p><\/section><section class=\"bs\"><h3>أسئلة قد تُطرح<\/h3><details class=\"more\"><summary><b>هل الخطابة موهبة فطرية، فلا يمكن للشخص الخجول تعلمها؟<\/b><\/summary><p>الإلقاء مهارة تُكتسب بالتدريب والتكرار. وكثير ممن يُشار إليهم بالفصاحة تدربوا كثيراً وعانوا في البدايات. وبالممارسة المستمرة تتحول الرهبة إلى حضور.<\/p><\/details><details class=\"more\"><summary><b>ألا يُعد تجميل الصوت والاعتناء بلغة الجسد نوعاً من الرياء والتصنع؟<\/b><\/summary><p>الشريعة دعت إلى البلاغة: ﴿وَقُل لَّهُمْ فِي أَنفُسِهِمْ قَوْلًا بَلِيغًا﴾. والعناية بأسلوب الإلقاء إكرام للحق وإعانة للسامع على الفهم، والنية الصادقة هي التي تفرق بين التبليغ والاستعراض.<\/p><\/details><\/section><section class=\"bs warn\"><h3>رادار الحماية<\/h3><p><b>مؤشرات الخطر:<\/b> تهرب متكرر من كل مشاركة أمام الآخرين، ووصف الذات بأنها «خجولة بطبعها»، وسخرية الطلاب من متحدث، وانهيار الفتى بعد موقف محرج واحد، أو الغرور المفرط بعد نجاح أول.<\/p><small>البروتوكول كاملاً في تبويب «الكامل».<\/small><\/section><section class=\"bs\"><h3>٥ · رحلة الأسبوع<\/h3><p class=\"\"><b>كلمة يومية:<\/b> يلقي الطالب كلمة قصيرة أمام المرآة أو أمام أسرته ثلاث مرات هذا الأسبوع.<\/p><p class=\"\"><b>مشاركة علنية:<\/b> يشارك مرة واحدة على الأقل في مجلس أو صف بكلمة محضّرة.<\/p><p class=\"\"><b>دعاء موسى:<\/b> يدعو بدعاء ﴿رَبِّ اشْرَحْ لِي صَدْرِي﴾ قبل كل مشاركة.<\/p><p class=\"\"><b>جسر إلى اللقاء الحادي والعشرين:<\/b> وبعد أن تعلمنا كيف نعبّر بوضوح، نتعلم كيف نعمل مع الآخرين في فريق واحد. وهذا موضوع «العمل الجماعي».<\/p><\/section>", "slides": ["<div class=\"cn\">20<\/div><h2>فن الإلقاء والتأثير<\/h2><p class=\"q\">كيف نعبر عن أفكارنا بثقة وقوة؟<\/p>", "<small>إضاءة استهلالية<\/small><h2>زياد وحسام في مسابقة المبادرات<\/h2><ul><li class=\"frag\">ما الذي قتل فكرة زياد؟ وما الذي رفع فكرة حسام؟<\/li><li class=\"frag\">كم فكرة نافعة في حياتنا ضاعت لأن أصحابها لم يحسنوا عرضها؟<\/li><\/ul>", "<small>1<\/small><h2>البيان نعمة من الله<\/h2><p class=\"ayah\">﴿الرَّحْمَٰنُ * عَلَّمَ الْقُرْآنَ * خَلَقَ الْإِنسَانَ * عَلَّمَهُ الْبَيَانَ﴾ [الرحمن: 1-4]<\/p><p class=\"g frag\">الفصاحة والقدرة على إيصال الفكرة شكر لهذه النعمة وخدمة للحق.<\/p>", "<small>2<\/small><h2>الاستعانة بالله لفك الرهبة<\/h2><p class=\"g frag\">الطمأنينة الداخلية تسبق طالقة اللسان.<\/p>", "<small>3<\/small><h2>الإيجاز ووضوح الفكرة<\/h2><p class=\"had lg\">قال رسول الله ﷺ: «إِنَّ طُولَ صَلاَةِ الرَّجُلِ وَقِصَرَ خُطْبَتِهِ مَئِنَّةٌ مِنْ فِقْهِهِ، فَأَطِيلُوا الصَّلاَةَ وَاقْصُرُوا الخُطْبَةَ، وَإِنَّ مِنَ البَيَانِ لَسِحْرًا» رواه مسلم. ففي الحديث أن قصر الخطبة دليل على عمق الفقه، فمن فهم الفكرة اختصرها. وأن في البيان قوة تأثير حقيقية يجب أن تُستعمل في الحق لا في الباطل.<\/p><p class=\"g frag\">مسلم) الكلمة المؤثرة لها فكرة مركزية واحدة وتتسم بالوضوح المتأني.<\/p>", "<small>4<\/small><h2>النية بين الإتقان والرياء<\/h2><p class=\"g frag\">العناية بلغة الجسد والصوت إكرام للسامع وليس استعراضا مذموما.<\/p>", "<small>سؤال للحوار<\/small><h2 class=\"big\">ما الذي يخيفك عند الوقوف أمام الناس؟<\/h2>", "<small>نشاط تطبيقي<\/small><h2 class=\"big\">ألق كلمة مدتها  ٩٠ثانية بفكرة واحدة، واستمع للتغذية الراجعة.<\/h2>", "<small>سؤال وبرهان<\/small><details class=\"frag\"><summary><b>هل الخطابة موهبة فطرية، فلا يمكن للشخص الخجول تعلمها؟<\/b><\/summary><p>الإلقاء مهارة تُكتسب بالتدريب والتكرار. وكثير ممن يُشار إليهم بالفصاحة تدربوا كثيراً وعانوا في البدايات. وبالممارسة المستمرة تتحول الرهبة إلى حضور.<\/p><\/details><details class=\"frag\"><summary><b>ألا يُعد تجميل الصوت والاعتناء بلغة الجسد نوعاً من الرياء والتصنع؟<\/b><\/summary><p>الشريعة دعت إلى البلاغة: ﴿وَقُل لَّهُمْ فِي أَنفُسِهِمْ قَوْلًا بَلِيغًا﴾. والعناية بأسلوب الإلقاء إكرام للحق وإعانة للسامع على الفهم، والنية الصادقة هي التي تفرق بين التبليغ والاستعراض.<\/p><\/details><details class=\"frag\"><summary><b>كيف أتصرف إذا نسيت الفكرة وأنا على المنصة وتملكني الصمت؟<\/b><\/summary><p>لا ترتبك ولا تعتذر. خذ نفساً عميقاً واصمت ثلاث ثوانٍ، فسيعدّها الجمهور وقفة مقصودة. ثم أعد آخر فكرة قلتها بهدوء، أو انتقل إلى النقطة التالية.<\/p><\/details>", "<small>ميدان التطبيق<\/small><h2>«مسرح تحدي التسعين ثانية»  نشاط تدريبي<\/h2><ol><li class=\"frag\">1. التحضير: يختار كل فتى فكرة قيمية محددة (أهمية صلاة الفجر، أو خطر الإدمان الرقمي، أو بر الوالدين، أو شغفه بالبرمجة)، ويحضّر كلمته بشكل موجز.<\/li><li class=\"frag\">2. البنية: مقدمة آسرة بسؤال صادم أو رقم، ثم صلب الفكرة مع استشهاد قرآني أو واقعي، ثم خاتمة بدعوة محددة للعمل.<\/li><li class=\"frag\">3. الأداء: يلقي كل طالب كلمته في تسعين ثانية تقريباً، بثبات القدمين وتواصل بصري شامل وحركات يدين مفتوحة ومتزنة.<\/li><li class=\"frag\">4. التقييم: يرصد مدرب لغة الجسد (من الطلاب) الثبات والنظر وحركة اليدين، ويعطي كل متحدث نقطة قوة ونقطة تطوير.<\/li><li class=\"frag\">5. دراسة حالة: منذر (16 سنة) طالب متفوق حافظ لكتاب الله، اختاره المعلم لإلقاء كلمة الصباح أمام خمسمئة طالب ومعلم.<\/li><li class=\"frag\">6. الاعتراض: أحد الطلاب يدافع عن «الكلام العفوي دون تحضير أفضل»، وتناقشه المجموعات.<\/li><\/ol>", "<small>رحلة الأسبوع<\/small><ul><li class=\"frag\"><b>كلمة يومية:<\/b> يلقي الطالب كلمة قصيرة أمام المرآة أو أمام أسرته ثلاث مرات هذا الأسبوع.<\/li><li class=\"frag\"><b>مشاركة علنية:<\/b> يشارك مرة واحدة على الأقل في مجلس أو صف بكلمة محضّرة.<\/li><li class=\"frag\"><b>دعاء موسى:<\/b> يدعو بدعاء ﴿رَبِّ اشْرَحْ لِي صَدْرِي﴾ قبل كل مشاركة.<\/li><li class=\"frag\"><b>جسر إلى اللقاء الحادي والعشرين:<\/b> وبعد أن تعلمنا كيف نعبّر بوضوح، نتعلم كيف نعمل مع الآخرين في فريق واحد. وهذا موضوع «العمل الجماعي».<\/li><\/ul>"], "n": 20, "u": 4, "title": "فن الإلقاء والتأثير", "q": "كيف نعبر عن أفكارنا بثقة وقوة؟", "dqq": "ما الذي يخيفك عند الوقوف أمام الناس؟", "pact": "ألق كلمة مدتها  ٩٠ثانية بفكرة واحدة، واستمع للتغذية الراجعة."}, {"summary": "<p class=\"\">أغلب ما ينجزه الإنسان في الحياة ينجزه مع غيره: في الدراسة والعمل والدعوة والأسرة. ومع ذلك يعتقد كثير من الفتيان أن الذكاء الفردي يكفي، فإذا اجتمعوا في فريق أفسدت الأنانية والخلافات أعمالهم. يتعلم الفتى في هذا اللقاء أن العمل الجماعي عبادة وأخوة، وأن الفريق الناجح ليس أذكى فرق الأفراد بل أكثرها تعاوناً. ويتدرب على توزيع الأدوار وبروتوكول حل الخلاف والنزول عن رأيه إذا صوّت الفريق على غيره.<\/p><p class=\"\">يفهم أن النزاع الداخلي سبب مباشر للفشل وذهاب القوة.<\/p><p class=\"\">يتعلم أن القيادة خدمة وتنسيق للطاقات وليست استعلاء.<\/p><p class=\"\">يطبق بروتوكولاً خماسياً لإدارة الخلاف باحترام.<\/p><div class=\"tw\"><table><tr><th><b>المهارة<\/b><\/th><th><b>معناها العملي<\/b><\/th><\/tr><tr><td><b>التعاون وتوزيع الأدوار<\/b><\/td><td>يعرف دوره ويؤديه بإتقان ويساند غيره<\/td><\/tr><tr><td><b>إدارة الخلاف<\/b><\/td><td>يناقش الفكرة لا الشخص، ويلتزم بقرار الجماعة<\/td><\/tr><tr><td><b>القيادة التشاركية<\/b><\/td><td>ينسق طاقات الفريق ويتيح للمبدعين أن يبدعوا<\/td><\/tr><\/table><\/div>", "kit": "<p class=\"\"><b>ما يعيشه الفتى:<\/b> الفتى الذكي يكره أن يعتمد على غيره ويظن أنه يعمل أسرع وحده. والفتى الأقل ثقة قد يتكل على الآخرين. وكلاهما يحتاج إلى تجربة عملية تريه ما يخسره حين يعمل منفرداً أو متكلاً.<\/p><p class=\"\"><b>اجعل التجربة هي المعلم:<\/b> محاكاة الفريق تعلّم أكثر من الشرح، فأعطِ الوقت للتطبيق ثم للتأمل.<\/p><p class=\"\"><b>لا تُشعر أحداً بالإقصاء:<\/b> وزّع الفرق بحيث يجتمع المختلفون في الطباع والمهارات.<\/p><p class=\"\"><b>راقب بصمت:<\/b> سجّل ملاحظات عن لغة الحوار والمقاطعات لتعرضها بعد التمرين دون ذكر أسماء.<\/p><p class=\"\"><b>أبرز النموذج النبوي:<\/b> النبي ﷺ استشار أصحابه ونزل عند رأي الأكثرية، وعمل بيده مع أصحابه.<\/p>", "hookT": "العباقرة الأربعة والمشروع المنهار", "hook": "<p class=\"\">في مسابقة الروبوتات والذكاء الاصطناعي تشكل فريق من أربعة طلاب هم الأذكى في المدرسة: مبرمج محترف ومهندس ميكانيكا ومصمم بارع ومتحدث فصيح. عند بدء العمل أصر المبرمج على أن يقود وحده ويتحكم في كل صغيرة وكبيرة. وسخر المهندس من طريقة المصمم، ورفض المصمم ملاحظات المتحدث، وتحول النقاش إلى صراخ وتراشق شخصي. وفي يوم التحكيم انسحب اثنان ولم يكتمل الروبوت. وفي المقابل شكل أربعة طلاب عاديي الذكاء فريقاً آخر، وزعوا المهام بالشورى، ووضعوا آلية لحل الخلاف باحترام، وتعاونوا بتواضع، فصنعوا روبوتاً متقناً وفازوا بالمركز الأول.<\/p><p class=\"\"><b>أسئلة الاستثارة:<\/b><\/p><p class=\"\">لماذا فشل الفريق الأذكى؟ وما الذي صنع نجاح الفريق الأقل ذكاء؟<\/p><p class=\"\">هل شاركت في عمل جماعي أفسدته الأنانية أو الخلاف؟ ما الذي كان يمكن فعله؟<\/p>", "pts": "<article class=\"pt\"><h4><span>أولاً<\/span>الولاية والتناصر بين المؤمنين<\/h4><p class=\"ayah\">﴿وَالْمُؤْمِنُونَ وَالْمُؤْمِنَاتُ بَعْضُهُمْ أَوْلِيَاءُ بَعْضٍ ۚ يَأْمُرُونَ بِالْمَعْرُوفِ وَيَنْهَوْنَ عَنِ الْمُنكَرِ﴾ [التوبة: 71]<\/p><p class=\"\">قررت الآية أن المؤمنين شبكة متماسكة يسند بعضهم بعضاً في ميادين البناء والإصلاح. فالعمل الجماعي ليس خياراً تنظيمياً فقط بل هو من حقيقة الأخوة الإيمانية. والأخوة تظهر عملياً في التعاون على المهام المشتركة.<\/p><\/article><article class=\"pt\"><h4><span>ثانياً<\/span>التحذير القرآني من التنازع<\/h4><p class=\"ayah\">﴿وَأَطِيعُوا اللَّهَ وَرَسُولَهُ وَلَا تَنَازَعُوا فَتَفْشَلُوا وَتَذْهَبَ رِيحُكُمْ ۖ وَاصْبِرُوا ۚ إِنَّ اللَّهَ مَعَ الصَّابِرِينَ﴾ [الأنفال: 46]<\/p><p class=\"\">ربط القرآن بين التنازع والفشل وذهاب القوة (الريح هي الهيبة والقوة). فكل فريق ينشغل بصراعاته الداخلية يتبدد جهده. ولاحظ أن الآية ختمت بالأمر بالصبر؛ فالتعاون يحتاج إلى صبر على اختلاف الطباع والآراء.<\/p><\/article><article class=\"pt\"><h4><span>ثالثاً<\/span>الشورى منهج<\/h4><p class=\"ayah\">﴿وَأَمْرُهُمْ شُورَىٰ بَيْنَهُمْ﴾ [الشورى: 38]<\/p><p class=\"\">الشورى صفة من صفات المؤمنين، ووصف القرآن لأمر الجماعة بأنه شورى بينهم يعني أن القرار يُبنى بإشراك أصحاب الشأن. وقد أُمر النبي ﷺ بها: ﴿وَشَاوِرْهُمْ فِي الْأَمْرِ﴾ [آل عمران: 159]. فإذا كان سيد الخلق ﷺ أُمر بمشاورة أصحابه، فمن كان دونه أولى.<\/p><\/article><article class=\"pt\"><h4><span>رابعاً<\/span>البنيان المرصوص<\/h4><p class=\"had\">قال رسول الله ﷺ: «الْمُؤْمِنُ لِلْمُؤْمِنِ كَالْبُنْيَانِ يَشُدُّ بَعْضُهُ بَعْضًا»، وشبّك بين أصابعه. رواه البخاري. فالتمثيل الحسي بتشبيك الأصابع يعلّمنا أن الفريق قوته في التكامل: كل لبنة في موضعها، ولا تغني لبنة عن أخرى. وقال ﷺ: «يَدُ اللَّهِ مَعَ الْجَمَاعَةِ» رواه الترمذي، فالبركة والرعاية تحف الجماعة المؤتلفة التي تخلت عن الأنانية.<\/p><\/article><article class=\"pt\"><h4><span>خامساً<\/span>النبي ﷺ يعمل مع أصحابه في الخندق<\/h4><p class=\"\">لما حُفر الخندق قسّم النبي ﷺ المهام بين أصحابه، ولم يكتف بالتوجيه من بعيد، بل نزل معهم ينقل التراب ويكسر الصخر بنفسه، حتى رآه الصحابة يحمل التراب وقد اغبر بطنه. متفق عليه. فهكذا تكون القيادة: خدمة ومشاركة، لا أمراً من بعيد. والقائد الناجح هو الذي يحمل مع فريقه ويتواضع.<\/p><\/article><article class=\"pt\"><h4><span>سادساً<\/span>الأخذ برأي الأكثرية<\/h4><p class=\"\">في غزوة أحد كان رأي النبي ﷺ البقاء في المدينة، لكن أكثر أصحابه، ومنهم كثير من الشباب، أشاروا بالخروج، فنزل ﷺ عند رأيهم وخرج. ولما ظهرت الصعوبات لم يعنّفهم على رأيهم. وهذا درس لكل من ينزل الفريق عند رأي غيره: أن يعمل لإنجاح القرار بكل طاقته ما لم يكن معصية لله. فالرجولة أن تنزل عن رأيك دون أن تنزل عن عملك.<\/p><\/article><article class=\"pt\"><h4><span>سابعاً<\/span>العمل الفردي مقابل العمل الجماعي<\/h4><div class=\"tw\"><table><tr><th><b>العمل الفردي والأنانية<\/b><\/th><th><b>العمل الجماعي التشاركي<\/b><\/th><\/tr><tr><td><b>«رأيي هو الأوحد وعلى الجميع التنفيذ»<\/b><\/td><td>الشورى واستثمار تنوع الكفاءات<\/td><\/tr><tr><td><b>الانسحاب والتذمر عند أول خلاف<\/b><\/td><td>إدارة الخلاف بهدوء وفق بروتوكول محدد<\/td><\/tr><tr><td><b>حب الاستئثار بالأضواء والمديح<\/b><\/td><td>نكران الذات ونسبة النجاح للفريق ككل<\/td><\/tr><tr><td><b>التكاسل والاتكالية على جهد الآخرين<\/b><\/td><td>القيام بالمسؤولية المسندة بدقة وأمانة<\/td><\/tr><\/table><\/div><\/article><article class=\"pt\"><h4><span>ثامناً<\/span>بروتوكول حل الخلاف الخماسي<\/h4><div class=\"tw\"><table><tr><th><b>الخطوة<\/b><\/th><th><b>ما تفعله<\/b><\/th><\/tr><tr><td><b>1. الهدوء والتنفس<\/b><\/td><td>لا ترد وأنت غاضب، وخذ لحظة تهدأ فيها<\/td><\/tr><tr><td><b>2. الاستماع دون مقاطعة<\/b><\/td><td>دع المخالف يكمل فكرته ثم لخّصها قبل أن ترد<\/td><\/tr><tr><td><b>3. مناقشة الفكرة لا الشخص<\/b><\/td><td>تجنب العبارات التي تتناول الشخص، وركز على المشكلة<\/td><\/tr><tr><td><b>4. التصويت بالشورى<\/b><\/td><td>يُحسم الخلاف بصوت الأكثرية بعد عرض الآراء<\/td><\/tr><tr><td><b>5. الالتزام بالقرار<\/b><\/td><td>يعمل الجميع لإنجاحه حتى من اعترض عليه<\/td><\/tr><\/table><\/div><p class=\"\">الخلاف في الآراء طبيعي وصحي، والخلل أن يتحول إلى خصومة شخصية.<\/p><\/article>", "qa": "<div class=\"tw\"><table><tr><th><b>السؤال المتوقع<\/b><\/th><th><b>تفكيكه<\/b><\/th><\/tr><tr><td><b>إذا كان في الفريق عضو كسول لا يعمل، فلماذا أتحمل جهده وينال نفس تقييمي؟<\/b><\/td><td>الحل ليس بالانسحاب أو المشاجرة، بل في وضوح توزيع المهام المكتوبة منذ اليوم الأول وتوثيقها. فإن قصر عضو ناصحه القائد بلطف، فإن تمادى رُفع الأمر للمشرف أو المعلم ببيانات دقيقة وموضوعية دون تجريح.<\/td><\/tr><tr><td><b>هل يجب أن يكون القائد أذكى وأخبر أعضاء الفريق؟<\/b><\/td><td>لا يشترط. القائد الناجح ليس من يفعل كل شيء، بل من يحسن تنسيق الطاقات ويوفر البيئة التي تجعل الأذكياء يبدعون. فالقيادة خدمة وتيسير وليست رتبة استعلاء.<\/td><\/tr><tr><td><b>كيف أتصرف إذا صوّت الفريق على رأي أراه خاطئاً؟<\/b><\/td><td>من كمال الرجولة والشورى أن تنزل عند رأي الأغلبية وتعمل لإنجاحه بكل طاقتك، ما لم يكن معصية لله. وقد نزل النبي ﷺ عند رأي الأكثرية في الخروج إلى أحد مع أن رأيه كان البقاء.<\/td><\/tr><\/table><\/div>", "radar": "<p class=\"\"><b>مؤشرات الخطر:<\/b> الاستئثار بالقرار، والانسحاب الغاضب بعد كل خلاف، والسخرية من أفكار الآخرين، والاتكال المتكرر على جهد الزملاء، والتشهير بالفريق في وسائل التواصل بعد الخلاف.<\/p><p class=\"\"><b>بروتوكول التدخل:<\/b><\/p><p class=\"step\"><b>1. <\/b>اسمع للفتى المنسحب على انفراد، وساعده على تسمية ما أغضبه بلا حكم.<\/p><p class=\"step\"><b>2. <\/b>ذكّره بالفرق بين رفض الفكرة ورفض الشخص، وبأن العمل عهد والتزام.<\/p><p class=\"step\"><b>3. <\/b>اطلب منه مصالحة قصيرة مع الفريق وتحديد دور جديد له يعيد ثقته.<\/p>", "actT": "«مختبر محاكاة أزمة الفريق»  نشاط حركي وتعاوني", "act": "<p class=\"step\"><b>1. التشكيل:<\/b> فرق من أربعة فتيان، لكل فريق قائد ومنفذ ومنسق ومراقب.<\/p><p class=\"step\"><b>2. التحدي:<\/b> بناء أعلى برج ورقي متزن دون استخدام أي مادة لاصقة في وقت محدد.<\/p><p class=\"step\"><b>3. الأزمة الطارئة:<\/b> في منتصف الوقت يسلم المشرف كل فريق ظرفاً طارئاً (مثل: القائد لا يحق له الكلام إلا بالإشارة، أو سُحبت خمس أوراق وعليهم تعديل الخطة في ثلاثين ثانية).<\/p><p class=\"step\"><b>4. بروتوكول الخلاف:<\/b> يتدرب الفريق على اتخاذ القرار بالشورى بهدوء تحت الضغط.<\/p><p class=\"step\"><b>5. التأمل:<\/b> يناقش المراقب والفريق ما نجح وما أفشل، بالأدلة والأمثلة.<\/p><p class=\"step\"><b>6. دراسة حالة:<\/b> فريق «الرواد» من خمسة طلاب اتفقوا على إعداد مجسم علمي للمنافسة المدرسية. اقترح باسل فكرة معقدة ومكلفة، واقترح عمر فكرة ذكية بسيطة غير مكلفة. وبعد الشورى صوّت أربعة أعضاء لصالح فكرة عمر. استشاط باسل غضباً وقال: «أنتم لا تفهمون في الإبداع! وبما أنكم رفضتم فكرتي فأنا منسحب ولن أساعدكم بحرف!»، وأغلق هاتفه وهاجمهم في حساباته. تحلل المجموعات: أين الخطأ؟ وكيف يُرمَّم الفريق؟<\/p><p class=\"step\"><b>7. الاعتراض:<\/b> أحد الطلاب يدافع عن «العمل الفردي أسرع وأضمن»، وتناقشه المجموعات.<\/p><div class=\"tw\"><table><tr><th colspan=\"2\"><b>بطاقة: ميثاق الفريق<\/b><\/th><\/tr><tr><td><b>1. دوري القيادي في فريقي هذا الأسبوع<\/b><\/td><td>المهمة المسندة إليّ: ............................<\/td><\/tr><tr><td><b>2. الزميل الذي سأسانده<\/b><\/td><td>............................<\/td><\/tr><tr><td><b>3. سجل الالتزام (ضع ✓)<\/b><\/td><td>إنجاز مهمتي بدقة ( ) النزول عند رأي الأغلبية ( ) مساندة زميل متعثر ( )<\/td><\/tr><tr><td><b>4. عهد الفتى المسلم<\/b><\/td><td>«أنا لبنة صالحة في بنيان أمتي، قوتي في إخواني، وسلامة صدري عنوان رجولتي»<\/td><\/tr><\/table><\/div>", "week": "<p class=\"\"><b>مهمة جماعية:<\/b> ينفذ الطالب مع زميلين مهمة مشتركة صغيرة (دراسية أو خدمية) بتوزيع أدوار مكتوب.<\/p><p class=\"\"><b>مساندة زميل:<\/b> يساعد زميلاً في مهمة دون انتظار شكر.<\/p><p class=\"\"><b>تطبيق بروتوكول الخلاف:<\/b> يطبق الخطوات الخمس في خلاف واحد يواجهه ويدوّن النتيجة.<\/p><p class=\"\"><b>جسر إلى اللقاء الثاني والعشرين:<\/b> وإذا عملنا معاً ظهرت مشكلات حقيقية تحتاج إلى حل. وهذا موضوع «حل المشكلات واتخاذ القرار».<\/p>", "kq": "القيادة التشاركية وإدارة الخلافات وتوزيع الأدوار داخل الفريق", "brief": "<div class=\"plan\"><span>اقتراح لتوزيع الوقت (١٠–١٥ د)<\/span><b>افتتاح ٣<\/b><b>محاور ٥<\/b><b>حوار ٢<\/b><b>نشاط ٣<\/b><b>ختام ٢<\/b><\/div><section class=\"bs\"><h3>١ · الافتتاح: العباقرة الأربعة والمشروع المنهار<\/h3><p class=\"\">في مسابقة الروبوتات والذكاء الاصطناعي تشكل فريق من أربعة طلاب هم الأذكى في المدرسة: مبرمج محترف ومهندس ميكانيكا ومصمم بارع ومتحدث فصيح. عند بدء العمل أصر المبرمج على أن يقود وحده ويتحكم في كل صغيرة وكبيرة. وسخر المهندس من طريقة المصمم، ورفض المصمم ملاحظات المتحدث، وتحول النقاش إلى صراخ وتراشق شخصي. وفي يوم التحكيم انسحب اثنان ولم يكتمل الروبوت. وفي المقابل شكل أربعة طلاب عاديي الذكاء فريقاً آخر، وزعوا المهام بالشورى، ووضعوا آلية لحل الخلاف باحترام، وتعاونوا بتواضع، فصنعوا روبوتاً متقناً وفازوا بالمركز الأول.<\/p><p class=\"\"><b>أسئلة الاستثارة:<\/b><\/p><p class=\"\">لماذا فشل الفريق الأذكى؟ وما الذي صنع نجاح الفريق الأقل ذكاء؟<\/p><p class=\"\">هل شاركت في عمل جماعي أفسدته الأنانية أو الخلاف؟ ما الذي كان يمكن فعله؟<\/p><\/section><section class=\"bs\"><h3>٢ · المحاور<\/h3><article class=\"pt\"><h4><span>١<\/span>التحذير من التنازع الداخلي<\/h4><p class=\"ayah\">﴿وَأَطِيعُوا اللَّهَ وَرَسُولَهُ وَلَا تَنَازَعُوا فَتَفْشَلُوا وَتَذْهَبَ رِيحُكُمْ ۖ وَاصْبِرُوا ۚ إِنَّ اللَّهَ مَعَ الصَّابِرِينَ﴾ [الأنفال: 46]<\/p><p class=\"g\">الأنانية والنزاع يهدران طاقة الفريق مهما بلغت نسبة ذكاء أفراده.<\/p><details class=\"more\"><summary>للتوسع<\/summary><p class=\"\">ربط القرآن بين التنازع والفشل وذهاب القوة (الريح هي الهيبة والقوة). فكل فريق ينشغل بصراعاته الداخلية يتبدد جهده. ولاحظ أن الآية ختمت بالأمر بالصبر؛ فالتعاون يحتاج إلى صبر على اختلاف الطباع والآراء.<\/p><\/details><\/article><article class=\"pt\"><h4><span>٢<\/span>الشورى والنزول عند الأغلبية<\/h4><p class=\"g\">القائد ينسق الطاقات ولا يستبد. والرجولة أن ينزل الفرد عند رأي الأغلبية ويعمل لإنجاحه.<\/p><\/article><article class=\"pt\"><h4><span>٣<\/span>الفريق كالبنيان المرصوص<\/h4><p class=\"had\">قال رسول الله ﷺ: «الْمُؤْمِنُ لِلْمُؤْمِنِ كَالْبُنْيَانِ يَشُدُّ بَعْضُهُ بَعْضًا»، وشبّك بين أصابعه. رواه البخاري. فالتمثيل الحسي بتشبيك الأصابع يعلّمنا أن الفريق قوته في التكامل: كل لبنة في موضعها، ولا تغني لبنة عن أخرى. وقال ﷺ: «يَدُ اللَّهِ مَعَ الْجَمَاعَةِ» رواه الترمذي، فالبركة والرعاية تحف الجماعة المؤتلفة التي تخلت عن الأنانية.<\/p><p class=\"g\">قوة الفريق في تكامل الأدوار ومساندة المتعثر.<\/p><details class=\"more\"><summary>للتوسع<\/summary><\/details><\/article><article class=\"pt\"><h4><span>٤<\/span>القيادة خدمة ومشاركة<\/h4><p class=\"g\">عمل النبي ﷺ مع أصحابه في الخندق يرسخ أن القيادة تواضع ومشاركة ميدانية وليست أوامر من بعد.<\/p><\/article><\/section><section class=\"bs\"><h3>٣ · سؤال للحوار<\/h3><p class=\"big\">ما الدور الذي تحسنه داخل الفريق؟<\/p><\/section><section class=\"bs\"><h3>٤ · نشاط تطبيقي<\/h3><p class=\"big\">تحدي البرج :ابنوا أعلى برج بأدوات محدودة، ثم قي موا الأدوار.<\/p><\/section><section class=\"bs\"><h3>أسئلة قد تُطرح<\/h3><details class=\"more\"><summary><b>إذا كان في الفريق عضو كسول لا يعمل، فلماذا أتحمل جهده وينال نفس تقييمي؟<\/b><\/summary><p>الحل ليس بالانسحاب أو المشاجرة، بل في وضوح توزيع المهام المكتوبة منذ اليوم الأول وتوثيقها. فإن قصر عضو ناصحه القائد بلطف، فإن تمادى رُفع الأمر للمشرف أو المعلم ببيانات دقيقة وموضوعية دون تجريح.<\/p><\/details><details class=\"more\"><summary><b>هل يجب أن يكون القائد أذكى وأخبر أعضاء الفريق؟<\/b><\/summary><p>لا يشترط. القائد الناجح ليس من يفعل كل شيء، بل من يحسن تنسيق الطاقات ويوفر البيئة التي تجعل الأذكياء يبدعون. فالقيادة خدمة وتيسير وليست رتبة استعلاء.<\/p><\/details><\/section><section class=\"bs warn\"><h3>رادار الحماية<\/h3><p><b>مؤشرات الخطر:<\/b> الاستئثار بالقرار، والانسحاب الغاضب بعد كل خلاف، والسخرية من أفكار الآخرين، والاتكال المتكرر على جهد الزملاء، والتشهير بالفريق في وسائل التواصل بعد الخلاف.<\/p><small>البروتوكول كاملاً في تبويب «الكامل».<\/small><\/section><section class=\"bs\"><h3>٥ · رحلة الأسبوع<\/h3><p class=\"\"><b>مهمة جماعية:<\/b> ينفذ الطالب مع زميلين مهمة مشتركة صغيرة (دراسية أو خدمية) بتوزيع أدوار مكتوب.<\/p><p class=\"\"><b>مساندة زميل:<\/b> يساعد زميلاً في مهمة دون انتظار شكر.<\/p><p class=\"\"><b>تطبيق بروتوكول الخلاف:<\/b> يطبق الخطوات الخمس في خلاف واحد يواجهه ويدوّن النتيجة.<\/p><p class=\"\"><b>جسر إلى اللقاء الثاني والعشرين:<\/b> وإذا عملنا معاً ظهرت مشكلات حقيقية تحتاج إلى حل. وهذا موضوع «حل المشكلات واتخاذ القرار».<\/p><\/section>", "slides": ["<div class=\"cn\">21<\/div><h2>العمل الجماعي<\/h2><p class=\"q\">كيف ندير الخلافات وننجح بروح الفريق؟<\/p>", "<small>إضاءة استهلالية<\/small><h2>العباقرة الأربعة والمشروع المنهار<\/h2><ul><li class=\"frag\">لماذا فشل الفر
