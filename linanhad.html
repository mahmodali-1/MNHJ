 الشعور بالفراغ والضياع بعد انتهاء اللقاءات.<\/p><small>البروتوكول كاملاً في تبويب «الكامل».<\/small><\/section><section class=\"bs\"><h3>٥ · رحلة الأسبوع<\/h3><p class=\"\"><b>أول أسبوع بعد الختام:<\/b> يلتزم الطالب بالحد الأدنى الإيماني ويسجله يومياً.<\/p><p class=\"\"><b>لقاء الشريك:<\/b> يلتقي شريك مساءلته ويراجعان معاً ميثاق التتويج.<\/p><p class=\"\"><b>مبادرة شهرية:<\/b> يحدد مبادرة نافعة صغيرة لهذا الشهر (خدمة، أو تعليم، أو مشروع) ويبدأها.<\/p><p class=\"\"><b>خاتمة الوحدة:<\/b> تنتهي بهذا المؤتمر لقاءات الوحدات الخمس، وتبدأ مسيرة العمر. ويأتي بعدها ما يقيس الأثر ويثبّته: ميزان الأثر الشامل.<\/p><\/section>", "slides": ["<div class=\"cn\">25<\/div><h2>المؤتمر الختامي<\/h2><p class=\"q\">كيف نحول الختام إلى نقطة انطلاق ومسار مستدام؟<\/p>", "<small>إضاءة استهلالية<\/small><h2>الحفلان<\/h2><ul><li class=\"frag\">ما الذي جعل الحفل الثاني نهاية ببداية جديدة؟ وما الذي ينقص الحفل الأول؟<\/li><li class=\"frag\">ماذا تريد أن تقول لنفسك بعد عام من اليوم؟<\/li><\/ul>", "<small>1<\/small><h2>الصدق في العهد والثبات<\/h2><p class=\"ayah lg\">﴿مِّنَ الْمُؤْمِنِينَ رِجَالٌ صَدَقُوا مَا عَاهَدُوا اللَّهَ عَلَيْهِ ۖ فَمِنْهُم مَّن قَضَىٰ نَحْبَهُ وَمِنْهُم مَّن يَنتَظِرُ ۖ وَمَا بَدَّلُوا تَبْدِيلًا﴾ [الأحزاب: 23]<\/p><p class=\"g frag\">معيار النجاح ليس الحماس المؤقت وقت المؤتمر، بل الاستمرار دون تبديل.<\/p>", "<small>2<\/small><h2>العمل ملموس ومرئي<\/h2><p class=\"ayah\">﴿وَقُلِ اعْمَلُوا فَسَيَرَى اللَّهُ عَمَلَكُمْ وَرَسُولُهُ وَالْمُؤْمِنُونَ﴾ [التوبة: 105]<\/p><p class=\"g frag\">عرض المشاريع وتوقيع الميثاق علنا يحول النوايا إلى مسؤولية يشهد عليها الأهل.<\/p>", "<small>3<\/small><h2>المداومة جوهر النجاح<\/h2><p class=\"g frag\">الحفاظ على «الحد الأدنى الإيماني» يحمي الشاب من الانتكاسة بعد انتهاء البرنامج.<\/p>", "<small>4<\/small><h2>الإيمان ثم الاستقامة<\/h2><p class=\"had\">عن سفيان بن عبد الله الثقفي رضي الله عنه قال: قلت: يا رسول الله، قل لي في الإسلام قولاً لا أسأل عنه أحداً بعدك. قال: «قُلْ: آمَنْتُ بِاللَّهِ، ثُمَّ اسْتَقِمْ» رواه مسلم<\/p><p class=\"g frag\">الختام الرسالي يتطلب البقاء ضمن رفقة صالحة والانتقال من مرحلة التلقي إلى الفعل والإصلاح.<\/p>", "<small>سؤال للحوار<\/small><h2 class=\"big\">ما أول خطوة ستفعلها غدا بعد انتهاء البرنامج؟<\/h2>", "<small>نشاط تطبيقي<\/small><h2 class=\"big\">اعرض مشروعك، ووقع ميثاقك علنا أمام أهلك والمشرفين.<\/h2>", "<small>سؤال وبرهان<\/small><details class=\"frag\"><summary><b>أشعر بالخوف من العودة إلى الذنب والتراجع بعد انقضاء اللقاءات والبيئة الحاضنة<\/b><\/summary><p>هذا الخوف علامة حياة في القلب. والأمان الحقيقي في تثبيت «الحد الأدنى الإيماني» والارتباط برفيقك المحاسب. ومتى زلت قدمك فبادر بالتوبة والعودة فوراً، فإن الله يحب التوابين، ولا تجعل الزلة سبباً للهجران.<\/p><\/details><details class=\"frag\"><summary><b>هل دوري كمصلح يقتضي أن أكون متكلماً أو شيخاً في المجتمع؟<\/b><\/summary><p>إطلاقاً. الإصلاح أن تكون متقناً لدراستك، باراً بوالديك، صادقاً في معاملتك، آمراً بالمعروف برفق، ونافعاً للناس في تخصصك. فالمهندس النزيه مصلح، والطبيب الرحيم مصلح، والابن البار مصلح.<\/p><\/details><details class=\"frag\"><summary><b>كيف نحافظ على هذه الأخوة التي نشأت في هذا المنهج طوال السنوات القادمة؟<\/b><\/summary><p>عبر لقاءات دورية، ومشاريع عمل مشتركة، والتواصي المستمر بالحق والصبر. فالمرء قليل بنفسه كثير بإخوانه.<\/p><\/details>", "<small>ميدان التطبيق<\/small><h2>«مراسم ميثاق الاستمرارية والعهد الرسالي»  نشاط ختامي وتكاملي<\/h2><ol><li class=\"frag\">1. عرض مشاريع الأثر: يقدم كل فريق أو فتى مشروعه الميداني، مستعرضاً الصور والبيانات والنتائج أمام الآباء والمشرفين، ويُسأل عن الدروس المستفادة.<\/li><li class=\"frag\">2. قسم الميثاق الجماعي: يقف الفتيان ويلقون القسم بصوت موحد.<\/li><li class=\"frag\">3. التوقيع والاعتماد: يوقّع الفتى، ويعتمد والده توقيعه، ويشهد المشرف عليه.<\/li><li class=\"frag\">4. خطة ما بعد الختام: يختار كل فتى شريك مساءلة ويحدد موعد أول لقاء دوري ومشروع الشهر القادم.<\/li><li class=\"frag\">5. دراسة حالة: معاذ (17 سنة) تغيرت حياته جذرياً خلال البرنامج: أصلح صلته بوالديه، وترك مقاطع اللهو والسهر، وأتقن مهارة الإلقاء، وقاد مبادرة تنظيف…<\/li><li class=\"frag\">6. الاعتراض: أحد الطلاب يدافع عن «الاكتفاء بما تعلمته، فلا حاجة إلى لقاءات بعد اليوم»، وتناقشه المجموعات.<\/li><\/ol>", "<small>رحلة الأسبوع<\/small><ul><li class=\"frag\"><b>أول أسبوع بعد الختام:<\/b> يلتزم الطالب بالحد الأدنى الإيماني ويسجله يومياً.<\/li><li class=\"frag\"><b>لقاء الشريك:<\/b> يلتقي شريك مساءلته ويراجعان معاً ميثاق التتويج.<\/li><li class=\"frag\"><b>مبادرة شهرية:<\/b> يحدد مبادرة نافعة صغيرة لهذا الشهر (خدمة، أو تعليم، أو مشروع) ويبدأها.<\/li><li class=\"frag\"><b>خاتمة الوحدة:<\/b> تنتهي بهذا المؤتمر لقاءات الوحدات الخمس، وتبدأ مسيرة العمر. ويأتي بعدها ما يقيس الأثر ويثبّته: ميزان الأثر الشامل.<\/li><\/ul>"], "n": 25, "u": 4, "title": "المؤتمر الختامي", "q": "كيف نحول الختام إلى نقطة انطلاق ومسار مستدام؟", "dqq": "ما أول خطوة ستفعلها غدا بعد انتهاء البرنامج؟", "pact": "اعرض مشروعك، ووقع ميثاقك علنا أمام أهلك والمشرفين."}], "pg": {"about": "<p class=\"\">أيها المشرف، أنت لا تلقي درساً بل تصحب فتى في سنٍّ تتزاحم فيها الأسئلة. يريد أن يُعامَل كراشد وهو لم يكتمل بعد، فاجعل مجلسك مساحة أمان يسأل فيها بلا خوف، وتُجيبه فيها بالبرهان والرفق معاً. فلسفة هذا المنهج أن الفتى يُبنى من الداخل: غاية تحمله، وعقل يحميه، وعادات تثبّته، وأولويات تضبط وقته، وهوية تعتز بها، ومهارات تجعله نافعاً.<\/p><p class=\"\">اقتدِ بالنبي ﷺ حين احتوى الشاب الذي جاءه يستأذنه في الزنا، فقرّبه وحاوره بالأسئلة ولم يعنّفه. كن ميسّراً لا واعظاً، وقد سُمّيت أقسام كل درس لتعينك على التحرك: ما تقرأه قبل الجلسة، وما تفتتح به، وما تشرحه، وما يمارسه الطلاب.<\/p><h3>الفئة والأهداف العامة<\/h3><p class=\"\"><b>الفئة:<\/b> المرحلة الثانوية، من 15 إلى 18 سنة. <b>الأهداف:<\/b><\/p><p class=\"\">أن يعرف الفتى غايته وهويته المسلمة، ويصوغ لها بوصلة شخصية.<\/p><p class=\"\">أن يفكر نقدياً ويتعامل مع الشبهات بمنهج لا بخوف.<\/p><p class=\"\">أن يبني عادات إيمانية وحياتية مستدامة ويدير وقته وأولوياته.<\/p><p class=\"\">أن يتمثل معاني الرجولة والثبات والاعتزاز بالدين.<\/p><p class=\"\">أن يكتسب مهارات الإلقاء والعمل الجماعي وحل المشكلات والأمانة المهنية، ويرسم مساره المستقبلي.<\/p>", "measure": "<h3>ميزان أثر الوحدة الأولى<\/h3><div class=\"tw\"><table><tr><th><b>ما نقيسه<\/b><\/th><th><b>كيف نقيسه<\/b><\/th><th><b>علامة الوصول<\/b><\/th><\/tr><tr><td><b>وضوح الغاية<\/b><\/td><td>مراجعة بطاقات البوصلة والدستور بعد أسبوعين<\/td><td>يربط قراراته بغايته بعبارته هو<\/td><\/tr><tr><td><b>التفكير الناقد<\/b><\/td><td>موقف: خبر مختلق يُعرض عليهم دون تنبيه<\/td><td>يتثبت ويسأل عن المصدر قبل النشر<\/td><\/tr><tr><td><b>تحصين اليقين<\/b><\/td><td>أسئلة الشبهات في جلسة حرة<\/td><td>يسأل بثقة ويرجع للعلماء لا للشائعات<\/td><\/tr><\/table><\/div><h3>ميزان أثر الوحدة الثانية<\/h3><div class=\"tw\"><table><tr><th><b>ما نقيسه<\/b><\/th><th><b>كيف نقيسه<\/b><\/th><th><b>علامة الوصول<\/b><\/th><\/tr><tr><td><b>الاستمرارية<\/b><\/td><td>جدول العادة بعد أسبوعين<\/td><td>التزام بأغلب الأيام لا بكلها<\/td><\/tr><tr><td><b>ضبط البيئة<\/b><\/td><td>تغييرات الهاتف والمكان<\/td><td>تخلٍّ فعلي عن مصدر مشتت واحد<\/td><\/tr><tr><td><b>الإنجاز<\/b><\/td><td>مهمة مؤجلة سُلّمت<\/td><td>يبدأ فوراً ولا يؤجل<\/td><\/tr><\/table><\/div><h3>ميزان أثر الوحدة الثالثة<\/h3><div class=\"tw\"><table><tr><th><b>ما نقيسه<\/b><\/th><th><b>كيف نقيسه<\/b><\/th><th><b>علامة الوصول<\/b><\/th><\/tr><tr><td><b>التخطيط<\/b><\/td><td>الجدول الأسبوعي والميثاق بعد أسبوعين<\/td><td>التزام بالأولويات وتقديم المهم<\/td><\/tr><tr><td><b>القرار الأخلاقي<\/b><\/td><td>موقف تمثيلي جديد<\/td><td>رفض لبق واضح ومبرَّر<\/td><\/tr><tr><td><b>التوازن والمال<\/b><\/td><td>عجلة الحياة والميزانية<\/td><td>تحسن مجال مهمل وضبط الإنفاق<\/td><\/tr><\/table><\/div><h3>ميزان أثر الوحدة الرابعة<\/h3><div class=\"tw\"><table><tr><th><b>ما نقيسه<\/b><\/th><th><b>كيف نقيسه<\/b><\/th><th><b>علامة الوصول<\/b><\/th><\/tr><tr><td><b>مفهوم الرجولة<\/b><\/td><td>مقارنة ما يكتبونه قبل الوحدة وبعدها<\/td><td>تقديم المروءة على المظهر<\/td><\/tr><tr><td><b>الشجاعة الأدبية<\/b><\/td><td>موقف حقيقي يرويه الطالب<\/td><td>قول الحق بأدب<\/td><\/tr><tr><td><b>الاعتزاز<\/b><\/td><td>اختياراته وملاحظاته في المجلس<\/td><td>يستعمل لغة اعتزاز لا انبهار<\/td><\/tr><\/table><\/div><h3>ميزان أثر الوحدة الخامسة<\/h3><div class=\"tw\"><table><tr><th><b>ما نقيسه<\/b><\/th><th><b>كيف نقيسه<\/b><\/th><th><b>علامة الوصول<\/b><\/th><\/tr><tr><td><b>التواصل والإلقاء<\/b><\/td><td>تقييم الأقران لكلمة مسجلة<\/td><td>ثقة وتنظيم ووضوح<\/td><\/tr><tr><td><b>التعاون وحل المشكلات<\/b><\/td><td>مشروع جماعي ومحاكاة أزمة<\/td><td>أدوار واضحة وتحليل للسبب الجذري<\/td><\/tr><tr><td><b>الجاهزية والأمانة<\/b><\/td><td>ميثاق العمل وخطة المسار<\/td><td>إتقان ووفاء بالوعد ومسار مكتوب<\/td><\/tr><\/table><\/div><h3>ميزان الأثر الشامل<\/h3><p class=\"\">اقرأ الأثر في السلوك المتكرر لا في الحماس اللحظي: ما يفعله الفتى حين لا يراقبه أحد.<\/p><div class=\"tw\"><table><tr><th><b>البُعد<\/b><\/th><th><b>المؤشر<\/b><\/th><th><b>أداة القياس<\/b><\/th><\/tr><tr><td><b>الإيماني<\/b><\/td><td>محافظة على الصلاة والعادات الإيمانية واليقين<\/td><td>سجل متابعة ومحادثة فردية<\/td><\/tr><tr><td><b>الفكري<\/b><\/td><td>تثبّت وسؤال منضبط ومواجهة الشبهة بمنهج<\/td><td>مواقف نقاشية وأسئلة مفتوحة<\/td><\/tr><tr><td><b>الذاتي والسلوكي<\/b><\/td><td>التزام بعادات وتنظيم للوقت وأولويات<\/td><td>جداول المتابعة والميثاق الزمني<\/td><\/tr><tr><td><b>القيمي<\/b><\/td><td>مروءة وصدق وشجاعة أدبية واعتزاز<\/td><td>ملاحظة المشرف وشهادة الأقران والأسرة<\/td><\/tr><tr><td><b>المهاري والمستقبلي<\/b><\/td><td>إلقاء وتعاون وإتقان ومسار واضح<\/td><td>مشروع المؤتمر الختامي<\/td><\/tr><\/table><\/div><p class=\"\"><b>معيار النجاح الكلي:<\/b> أن يقول الفتى ما غايته ويفعل ما يوافقها، ويثبت أمام موقف حقيقي. قارن مرتين: قبل البرنامج وبعده.<\/p><h3>خزانة المصادر<\/h3><div class=\"tw\"><table><tr><th><b>المحور<\/b><\/th><th><b>المصدر المقترح<\/b><\/th><\/tr><tr><td><b>الغاية والهوية<\/b><\/td><td>سلسلة «إلى الجيل الصاعد» - أحمد بن يوسف السيد؛ «لماذا خلقنا الله؟» - د. إياد قنيبي (رحلة اليقين)؛ حلقة «معنى الحياة ولماذا نحن هنا؟» - بودكاست وعي<\/td><\/tr><tr><td><b>النفس والغاية<\/b><\/td><td>«الإنسان بين المادية والإسلام» - محمد قطب؛ «الداء والدواء» - ابن القيم<\/td><\/tr><tr><td><b>فهم المراهق<\/b><\/td><td>«المراهق: كيف نفهمه وكيف نوجهه؟» - د. عبد الكريم بكار<\/td><\/tr><tr><td><b>الأخلاق والأولويات<\/b><\/td><td>«خلق المسلم» - محمد الغزالي؛ «في فقه الأولويات» - د. يوسف القرضاوي<\/td><\/tr><tr><td><b>العادات والوقت<\/b><\/td><td>«العادات الذرية» - جيمس كلير؛ «العادات السبع للناس الأكثر فعالية» - ستيفن كوفي<\/td><\/tr><tr><td><b>الرجولة<\/b><\/td><td>تفريغ «معاني الرجولة في القرآن» - د. أحمد عبد المنعم<\/td><\/tr><\/table><\/div><h3>خاتمة تربوية<\/h3><p class=\"\">ليس المقياس أن أنهينا المحتوى، بل أن خرج فتى أصلب يقيناً وأصدق وعداً وأنفع لأهله وأمته. اصبر على التدرج، وارفق بالأسئلة، واجعل قدوتك سلوكك قبل كلامك. فمن أحسن غرس البذرة بالرفق والبرهان فلا يضيع عمله: ﴿وَالَّذِينَ جَاهَدُوا فِينَا لَنَهْدِيَنَّهُمْ سُبُلَنَا﴾ [العنكبوت: 69]. نسأل الله أن يجعلك وإياهم من الذين صدقوا ما عاهدوا الله عليه.<\/p><p class=\"\">2<\/p>"}}</script>
<script>
const D=JSON.parse(document.getElementById('D').textContent),$=s=>document.querySelector(s),root=document.documentElement;
const C=['#8b1538','#0f7b6c','#b07d1f','#4a3b8c','#c0502a'],PL=['اليقين','العادات','الأولويات','الرجولة','الجاهزية'],FS=[.85,1,1.15,1.3,1.5];
const ST={g(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},s(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const AR=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
let fi=ST.g('fs',1);const sf=()=>{root.style.setProperty('--fs',FS[fi]);ST.s('fs',fi)};sf();
$('#fp').onclick=()=>{fi=Math.min(4,fi+1);sf()};$('#fm').onclick=()=>{fi=Math.max(0,fi-1);sf()};
const t0=ST.g('th',null);if(t0)root.dataset.theme=t0;
$('#th').onclick=()=>{const d=root.dataset.theme?root.dataset.theme=='dark':matchMedia('(prefers-color-scheme: dark)').matches;root.dataset.theme=d?'light':'dark';ST.s('th',root.dataset.theme)};
const done=()=>ST.g('done',{});
// drawer
$('#da').innerHTML='<a href="#about"><b>◆</b>مقدمة المشرف والأهداف</a>'+D.units.map((u,i)=>`<h5 style="--c:${C[i]}">${u.name}</h5>`+u.ls.map(n=>`<a href="#l${n}" style="--c:${C[i]}"><b>${AR(n)}</b>${D.L[n-1].title}</a>`).join('')).join('')+'<a href="#measure"><b>◆</b>ميزان الأثر والمصادر</a>';
const dr=$('#dr');$('#mn').onclick=()=>dr.classList.add('on');dr.onclick=e=>{if(e.target==dr)dr.classList.remove('on')};
function home(){
 const d=done(),last=ST.g('last',0),cnt=Object.keys(d).length;
 $('#app').innerHTML=`<section class="hero"><p>الدليل التشغيلي للمشرف الميداني</p><h1>لِنَنْهَض</h1><p>منهج بناء الفتى: يقين، وعادات، وأولويات، ورجولة، وجاهزية</p>
 <div class="bars">${C.map((c,i)=>`<i style="background:${c};height:${44+i*18}px;animation-delay:${i*.15}s"></i>`).join('')}</div>
 <div class="pills">${PL.map((p,i)=>`<span style="background:${C[i]}">${p}</span>`).join('')}</div>
 <a class="cta" href="#l${last||1}">${last?'تابع من اللقاء '+AR(last):'ابدأ من اللقاء الأول'}</a><a class="cta o" href="#about">مقدمة المشرف</a>
 <p>${cnt?'جهّزت '+AR(cnt)+' من ٢٥ لقاءً':''}</p></section>
 <input class="srch" id="sq" type="search" placeholder="ابحث عن لقاء…">`+D.units.map((u,i)=>`<div class="un" style="--c:${C[i]}"><small>الوحدة ${['الأولى','الثانية','الثالثة','الرابعة','الخامسة'][i]}</small>${u.name}</div><div class="grid">${u.ls.map((n,j)=>{const L=D.L[n-1];return `<a class="lc" href="#l${n}" style="--c:${C[i]};animation-delay:${j*.06}s"><b>${AR(n)}</b><span>${L.title}</span><small>${L.q}</small>${d[n]?'<i>✓</i>':''}</a>`}).join('')}</div>`).join('')+'<p style="text-align:center;margin-top:24px"><a class="cta o" href="#measure">ميزان الأثر وخزانة المصادر</a></p>';
 $('#sq').oninput=e=>{const v=e.target.value.trim();document.querySelectorAll('.lc').forEach(a=>a.style.display=a.textContent.includes(v)?'':'none')};
}
function info(k){$('#app').innerHTML=`<div class="bs pg" style="--c:#8b1538"><h3>${k=='about'?'مقدمة المشرف':'ميزان الأثر وخزانة المصادر'}</h3>${D.pg[k]}</div><div class="nav"><a class="cta o" href="#home">الصفحة الرئيسية</a></div>`}
function lesson(n,tab){
 const L=D.L[n-1],c=C[L.u];ST.s('last',n);
 const T=[['brief','','مختصر'],['full','-full','كامل'],['show','-show','عرض'],['act','-act','أنشطة']];
 let b='';
 if(tab=='brief')b=L.brief;
 if(tab=='full')b=`<div class="tb"><button id="oa">فتح الكل</button><button id="ca">طي الكل</button></div><p class="kq">${L.kq}</p>`+[['summary','خلاصة الدرس',1],['kit','زاد المشرف',0],['hook','إضاءة استهلالية: '+L.hookT,0],['pts','مدار الفكرة المفصل',1],['qa','سؤال وبرهان',0],['radar','رادار الحماية',0],['act','ميدان التطبيق: '+L.actT,0],['week','رحلة الأسبوع',0]].map(([k,t,o])=>`<details class="ac" ${o?'open':''}><summary>${t}</summary><div>${L[k]}</div></details>`).join('');
 if(tab=='act')b=`<details class="ac" open><summary>كسر الجمود — إضاءة استهلالية: ${L.hookT}</summary><div>${L.hook}</div></details><details class="ac" open><summary>تفاعل سريع</summary><div><h4>سؤال للحوار</h4><p class="big">${L.dqq}</p><h4>نشاط تطبيقي</h4><p class="big">${L.pact}</p></div></details><details class="ac" open><summary>ميدان التطبيق: ${L.actT}</summary><div>${L.act}</div></details><details class="ac"><summary>رحلة الأسبوع</summary><div>${L.week}</div></details>`;
 if(tab=='show')b=`<div class="showc bs"><button class="play" id="pl" aria-label="ابدأ العرض">▶</button><h3>عرض اللقاء ${AR(n)}</h3><p>${AR(L.slides.length)} شريحة تفاعلية مختصرة. الأسهم أو السحب للتنقل، وفي كل شريحة تظهر العناصر واحداً بعد الآخر.</p></div>`;
 const d=done(),p=D.L[n-2],q=D.L[n];
 $('#app').innerHTML=`<div class="lh" style="--c:${c}" data-n="${AR(n)}"><small>${D.units[L.u].name} · اللقاء ${AR(n)}</small><h1>${L.title}</h1><p class="q">${L.q}</p></div>
 <nav class="tabs" style="--c:${c}">${T.map(([k,s,t])=>`<a href="#l${n}${s}" class="${k==tab?'on':''}">${t}</a>`).join('')}</nav><div style="--c:${c}">${b}
 <div class="nav"><button class="cta ${d[n]?'':'o'}" id="dn">${d[n]?'✓ تم التحضير':'علّم كمُحضَّر'}</button></div>
 <div class="nav">${p?`<a class="cta o" href="#l${n-1}">→ ${p.title}</a>`:'<span></span>'}<a class="cta o" href="#home">الفهرس</a>${q?`<a class="cta" href="#l${n+1}">${q.title} ←</a>`:'<span></span>'}</div></div>`;
 $('#dn').onclick=()=>{const x=done();x[n]?delete x[n]:x[n]=1;ST.s('done',x);lesson(n,tab)};
 if($('#oa')){$('#oa').onclick=()=>document.querySelectorAll('.ac').forEach(x=>x.open=true);$('#ca').onclick=()=>document.querySelectorAll('.ac').forEach(x=>x.open=false)}
 if($('#pl'))$('#pl').onclick=()=>show(n);
}
function show(n){
 const L=D.L[n-1];let i=0;const ov=document.createElement('div');ov.className='ov';ov.style.setProperty('--c',C[L.u]);
 ov.innerHTML=`<div class="bar"><i></i></div><button class="x" aria-label="إغلاق">✕</button><button class="fsb" aria-label="ملء الشاشة">⛶</button><div class="stage">${L.slides.map(s=>`<section class="sl">${s}</section>`).join('')}</div><button class="nv pv" aria-label="السابق">›</button><button class="nv nx" aria-label="التالي">‹</button><div class="ct"></div>`;
 document.body.appendChild(ov);const sl=[...ov.querySelectorAll('.sl')];
 const up=()=>{sl.forEach((s,j)=>s.classList.toggle('on',j==i));ov.querySelector('.bar i').style.width=(i+1)/sl.length*100+'%';ov.querySelector('.ct').textContent=AR(i+1)+' / '+AR(sl.length)};
 const fr=s=>[...s.querySelectorAll('.frag')];
 const step=d=>{const f=fr(sl[i]),on=f.filter(x=>x.classList.contains('on'));
  if(d>0){if(on.length<f.length){f[on.length].classList.add('on');return}if(i<sl.length-1){i++;fr(sl[i]).forEach(x=>x.classList.remove('on'));up()}}
  else{if(on.length){on[on.length-1].classList.remove('on');return}if(i>0){i--;fr(sl[i]).forEach(x=>x.classList.add('on'));up()}}};
 const close=()=>{document.removeEventListener('keydown',kd);if(document.fullscreenElement)document.exitFullscreen();ov.remove()};
 const kd=e=>{if(['ArrowLeft',' ','PageDown'].includes(e.key)){e.preventDefault();step(1)}else if(['ArrowRight','PageUp'].includes(e.key)){e.preventDefault();step(-1)}else if(e.key=='Escape')close();else if(e.key=='f')ov.requestFullscreen&&ov.requestFullscreen()};
 document.addEventListener('keydown',kd);
 ov.querySelector('.x').onclick=close;ov.querySelector('.nx').onclick=()=>step(1);ov.querySelector('.pv').onclick=()=>step(-1);
 ov.querySelector('.fsb').onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():ov.requestFullscreen()}catch(e){}};
 let x0=0;ov.ontouchstart=e=>x0=e.changedTouches[0].clientX;ov.ontouchend=e=>{const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>60)step(dx<0?1:-1)};
 up();
}
function route(){
 dr.classList.remove('on');const h=location.hash.slice(1)||'home',m=h.match(/^l(\d+)(?:-(full|act|show))?$/);
 if(m&&+m[1]>=1&&+m[1]<=25)lesson(+m[1],m[2]||'brief');else if(h=='about'||h=='measure')info(h);else home();
 const a=$('#app');a.style.animation='none';a.offsetWidth;a.style.animation='';scrollTo(0,0);
}
addEventListener('hashchange',route);route();
</script>
</body>
</html>
