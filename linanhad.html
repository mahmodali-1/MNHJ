an>رابعاً<\/span>الاستعاذة من العجز والكسل<\/h4><p class=\"\">كان النبي ﷺ يقول: «اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ العَجْزِ وَالكَسَلِ» رواه البخاري ومسلم. والكسل هو التسويف والمماطلة مع سلامة الجسد والقدرة، وهو آفة تسلب مروءة الشاب وقوته. وفي وصية ابن عمر رضي الله عنهما: «إِذَا أَمْسَيْتَ فَلاَ تَنْتَظِرِ الصَّبَاحَ، وَإِذَا أَصْبَحْتَ فَلاَ تَنْتَظِرِ المَسَاءَ، وَخُذْ مِنْ صِحَّتِكَ لِمَرَضِكَ، وَمِنْ حَيَاتِكَ لِمَوْتِكَ» رواه البخاري.<\/p><\/article><article class=\"pt\"><h4><span>خامساً<\/span>كعب بن مالك وعاقبة «سأتجهز غداً»<\/h4><p class=\"\">حكى كعب رضي الله عنه في حديث تخلفه عن غزوة تبوك أنه كان يخرج ليتجهز مع الجيش فيرجع ولم يقضِ شيئاً، ويقول في نفسه: «أنا قادر على ذلك إذا أردت»، فلم يزل ذلك يتمادى به حتى أسرع الجيش وفات الأمر. ثم عانى ما عانى من الهجر والكرب حتى تاب الله عليه. وفي القصة درس بليغ: التسويف قد يبدو صغيراً في أول يوم، لكنه يتراكم حتى يسلب الفرصة كلها.<\/p><\/article><article class=\"pt\"><h4><span>سادساً<\/span>ماذا يجري داخل الفتى؟<\/h4><div class=\"tw\"><table><tr><th><b>الجزء<\/b><\/th><th><b>وظيفته<\/b><\/th><th><b>ما يحدث عند التسويف<\/b><\/th><\/tr><tr><td><b>الجزء المخطِّط في الدماغ (القشرة الجبهية)<\/b><\/td><td>التخطيط والمنطق والأهداف البعيدة<\/td><td>يعرف أن المهمة مهمة ويضع الخطة<\/td><\/tr><tr><td><b>الجزء الانفعالي (اللوزة الدماغية)<\/b><\/td><td>الاستجابة السريعة للألم والخطر والبحث عن متعة فورية<\/td><td>إذا بدت المهمة ضخمة أو غامضة أرسل إشارة ضغط، فيهرب الفتى إلى الهاتف<\/td><\/tr><\/table><\/div><p class=\"\">الفتى إذاً لا يكسل بقدر ما يهرب من شعور مزعج. والحل ألا نواجه الشعور بالقوة بل نصغّر المهمة حتى لا تُثير الإنذار.<\/p><\/article><article class=\"pt\"><h4><span>سابعاً<\/span>وهم انتظار المزاج<\/h4><p class=\"\">القاعدة السلوكية: العمل هو الذي يولّد المزاج، لا المزاج هو الذي يولّد العمل. فإذا بدأ الفتى مهمته لمدة دقيقتين فقط تراجعت إشارات الضيق، وانخرط الدماغ في المهمة، لأن الدماغ يميل إلى إتمام ما بدأه. فالبداية الصغيرة تجرّ ما بعدها.<\/p><\/article><article class=\"pt\"><h4><span>ثامناً<\/span>أدوات كسر المماطلة<\/h4><div class=\"tw\"><table><tr><th><b>الأداة<\/b><\/th><th><b>كيف تطبقها<\/b><\/th><\/tr><tr><td><b>قاعدة الدقيقتين<\/b><\/td><td>اختصر بداية المهمة إلى دقيقتين فقط (افتح الدفتر واقرأ أول فقرة)<\/td><\/tr><tr><td><b>المؤقت (بومودورو)<\/b><\/td><td>خمس وعشرون دقيقة تركيز خالص بلا مشتتات، ثم راحة قصيرة خمس دقائق<\/td><\/tr><tr><td><b>العد التنازلي<\/b><\/td><td>5 - 4 - 3 - 2 - 1 ثم انطلق: حركة جسدية مباشرة تقطع حبال التردد<\/td><\/tr><\/table><\/div><\/article><article class=\"pt\"><h4><span>تاسعاً<\/span>لصوص الوقت الأربعة<\/h4><p class=\"\"><b>التصفح الرقمي التائه:<\/b> أن تفتح الهاتف لغرض ثم تجد نفسك في مكان آخر.<\/p><p class=\"\"><b>العجز عن قول «لا» للغو:<\/b> إجابة كل دعوة وكل رسالة دون تمييز.<\/p><p class=\"\"><b>فوضى المكان:<\/b> يضيع الوقت في البحث عن الأغراض والأدوات.<\/p><p class=\"\"><b>أوهام المثالية الصارمة:<\/b> لا أبدأ حتى تكتمل الظروف.<\/p><\/article>", "qa": "<div class=\"tw\"><table><tr><th><b>السؤال المتوقع<\/b><\/th><th><b>تفكيكه<\/b><\/th><\/tr><tr><td><b>أنا لا أبدع إلا تحت ضغط اللحظات الأخيرة، فهل التسويف ميزة لي؟<\/b><\/td><td>الإنجاز تحت ضغط الذعر يعطي نشوة مؤقتة، لكنه يقدم نتائج سطحية مليئة بالأخطاء ويرهق النفس والجسد. أما الإتقان العميق فيحتاج إلى صفاء وتركيز متدرج.<\/td><\/tr><tr><td><b>كيف أتخلص من جلد الذات وقد تراكمت عليّ مهام لأسابيع؟<\/b><\/td><td>جلد الذات وقود التسويف، لأن الدماغ يهرب من تأنيب الضمير إلى الشاشة. اقطع التفكير في الماضي، وسامح نفسك، وركز على مهمة الساعة الحالية فقط، فالجبال لا تُنقل إلا حجراً حجراً.<\/td><\/tr><tr><td><b>هل اعتذاري للزملاء عن الخروج أوقات الجد خذلان ونقص في المروءة؟<\/b><\/td><td>قولك «لا» للغو هو قولك «نعم» لكرامتك ورسالتك. والصاحب النبيل يقدّر وقتك ويشجعك، أما من يحزن لانضباطك فقد يسعى لجرّك إلى الفراغ ليؤنس بك تقصيره.<\/td><\/tr><\/table><\/div>", "radar": "<p class=\"\"><b>مؤشرات الخطر:<\/b> تراكم المهام وتأجيل مستمر، وتغيب متكرر عن مواعيد التسليم، وعبارات مثل «أنا فاشل بطبعي»، وقلق ذهني دائم يرافقه سهر وإنهاك.<\/p><p class=\"\"><b>بروتوكول التدخل:<\/b><\/p><p class=\"step\"><b>1. <\/b>استمع له دون محاكمة، واسأله ما الذي تتجنبه في هذه المهمة؟<\/p><p class=\"step\"><b>2. <\/b>اختر معه أصغر خطوة ممكنة، وقم بها معه إن أمكن.<\/p><p class=\"step\"><b>3. <\/b>تابعه في اليوم التالي بسؤال واحد: هل بدأت؟ واحتفِ ببدايته مهما صغرت.<\/p>", "actT": "«مختبر تفكيك جبل التسويف»  نشاط ذهني وعملي", "act": "<p class=\"step\"><b>1. الأدوات:<\/b> استمارة تفكيك المهام ومؤقت إلكتروني.<\/p><p class=\"step\"><b>2. التحديد:<\/b> يحدد كل فتى أضخم مهمة يؤجلها منذ أيام.<\/p><p class=\"step\"><b>3. خوارزمية التفكيك الخماسية:<\/b> يسمّي المهمة بدقة، ويحوّلها إلى أول حركة جسدية مدتها دقيقتان، ويحدد الموعد والمكان فور العودة للبيت، وينفي المشتت الرئيسي (إخراج الهاتف)، ثم يفعّل المؤقت ويطبق أول دقيقتين فعلياً في القاعة.<\/p><p class=\"step\"><b>4. دراسة حالة:<\/b> يوسف (16 سنة) متوقد الذكاء، لكنه لا يبدأ حفظه أو مذاكرته إلا بشروط: غرفة هادئة تماماً، ومزاج صافٍ، ويوم كامل أمامه، فيمر الوقت دون بدء. تحلل المجموعات: ما الشرط الوهمي؟ وما أصغر بداية ممكنة اليوم؟<\/p><p class=\"step\"><b>5. الاعتراض:<\/b> يتقمص أحد الطلاب دور محامي الشيطان ويدافع عن «الإنجاز تحت ضغط اللحظة الأخيرة»، وتفنّده المجموعات.<\/p><div class=\"tw\"><table><tr><th colspan=\"2\"><b>بطاقة: تفكيك جبل التسويف<\/b><\/th><\/tr><tr><td><b>1. المهمة التي أؤجلها<\/b><\/td><td>............................<\/td><\/tr><tr><td><b>2. أول حركة (دقيقتان)<\/b><\/td><td>............................<\/td><\/tr><tr><td><b>3. الموعد والمكان<\/b><\/td><td>اليوم الساعة ............ في ............<\/td><\/tr><tr><td><b>4. المشتت الذي سأبعده<\/b><\/td><td>............................<\/td><\/tr><tr><td><b>5. جملة البداية<\/b><\/td><td>«5 - 4 - 3 - 2 - 1 انطلق»<\/td><\/tr><\/table><\/div>", "week": "<p class=\"\"><b>مهمة مؤجلة يومياً:<\/b> ينفذ الطالب كل يوم أول دقيقتين من مهمة مؤجلة قبل أي ترفيه.<\/p><p class=\"\"><b>جلسة تركيز:<\/b> يطبق جلسة مؤقت واحدة (25 دقيقة) يومياً بلا هاتف.<\/p><p class=\"\"><b>جرد لصوص الوقت:<\/b> يدوّن ما أضاع وقته أكثر خلال الأسبوع ويشاركه في اللقاء القادم.<\/p><p class=\"\"><b>جسر إلى اللقاء العاشر:<\/b> وإذا ضبطنا الوقت وبدأنا بصدق، فكيف نصل بهذه المنهجية إلى أعمق عادة في حياة المسلم: عبادته؟ هذا موضوع «العادات الإيمانية المستدامة».<\/p>", "kq": "الانتقال من المماطلة إلى الإنجاز الفوري", "brief": "<div class=\"plan\"><span>اقتراح لتوزيع الوقت (١٠–١٥ د)<\/span><b>افتتاح ٣<\/b><b>محاور ٥<\/b><b>حوار ٢<\/b><b>نشاط ٣<\/b><b>ختام ٢<\/b><\/div><section class=\"bs\"><h3>١ · الافتتاح: معضلة حمزة<\/h3><p class=\"\"><b>حمزة (17 سنة)<\/b> يؤرقه منذ ثلاثة أسابيع بحث دراسي ومراجعة الرياضيات. كل يوم يقول: «سأبدأ عند السادسة مساءً حين أكون في مزاج رائق». فإذا دقت السادسة شعر بثقل فقال: «سأرتب المكتب وأعد كوباً من الشاي لأتهيأ جيداً». ويمضي الوقت بين الترتيب والهاتف حتى التاسعة فيقول: «تعبت، سأبدأ غداً في الفجر». تكرر ذلك عشرين يوماً، وفي الليلة الأخيرة أصابه الذعر فسهر ينسخ النصوص بضغط عصبي، وقدم عملاً مهلهلاً وهو يشعر بالخجل والإنهاك.<\/p><p class=\"\"><b>أسئلة الاستثارة:<\/b><\/p><p class=\"\">ما الذي كان يفعله حمزة فعلاً وهو يرتب المكتب ويعد الشاي؟<\/p><p class=\"\">متى يأتي «المزاج المناسب»؟ وهل جاء يوماً؟<\/p><\/section><section class=\"bs\"><h3>٢ · المحاور<\/h3><article class=\"pt\"><h4><span>١<\/span>المبادرة أمر إلهي<\/h4><p class=\"ayah\">﴿وَسَارِعُوا إِلَىٰ مَغْفِرَةٍ مِّن رَّبِّكُمْ وَجَنَّةٍ عَرْضُهَا السَّمَاوَاتُ وَالْأَرْضُ أُعِدَّتْ لِلْمُتَّقِينَ﴾ [آل عمران: 133]<\/p><p class=\"g\">التسويف وكلمة «سوف» هما بذرة الفوات والحسرة.<\/p><details class=\"more\"><summary>للتوسع<\/summary><p class=\"\">الأمر بالمسارعة يعني ألا يؤجل المسلم الخير، فالتأجيل يورث الفوات والندم. وفي الآية ربط جميل بين المسارعة والتقوى، فالمتقي يبادر لأن قلبه يعلم أن الوقت لا يعود.<\/p><\/details><\/article><article class=\"pt\"><h4><span>٢<\/span>الاستعاذة من العجز والكسل<\/h4><p class=\"g\">الكسل آفة تسلب مروءة الشاب وقوته مع سلامة جسده.<\/p><details class=\"more\"><summary>للتوسع<\/summary><p class=\"\">كان النبي ﷺ يقول: «اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ العَجْزِ وَالكَسَلِ» رواه البخاري ومسلم. والكسل هو التسويف والمماطلة مع سلامة الجسد والقدرة، وهو آفة تسلب مروءة الشاب وقوته. وفي وصية ابن عمر رضي الله عنهما: «إِذَا أَمْسَيْتَ فَلاَ تَنْتَظِرِ الصَّبَاحَ، وَإِذَا أَصْبَحْتَ فَلاَ تَنْتَظِرِ المَسَاءَ، وَخُذْ مِنْ صِحَّتِكَ لِمَرَضِكَ، وَمِنْ حَيَاتِكَ لِمَوْتِكَ» رواه البخاري.<\/p><\/details><\/article><article class=\"pt\"><h4><span>٣<\/span>وهم انتظار المزاج<\/h4><p class=\"g\">العمل هو الذي يولد المزاج وليس العكس. كسر المماطلة يبدأ بخطوة صغيرة فورية (قاعدة الدقيقتين).<\/p><details class=\"more\"><summary>للتوسع<\/summary><p class=\"\">القاعدة السلوكية: العمل هو الذي يولّد المزاج، لا المزاج هو الذي يولّد العمل. فإذا بدأ الفتى مهمته لمدة دقيقتين فقط تراجعت إشارات الضيق، وانخرط الدماغ في المهمة، لأن الدماغ يميل إلى إتمام ما بدأه. فالبداية الصغيرة تجرّ ما بعدها.<\/p><\/details><\/article><article class=\"pt\"><h4><span>٤<\/span>لصوص الوقت<\/h4><p class=\"g\">المثالية المعطلة، والعجز عن قول «لا» للغو، والتصفح الرقمي التائه، كلها تسرق رأس مال الإنسان.<\/p><details class=\"more\"><summary>للتوسع<\/summary><p class=\"\"><b>التصفح الرقمي التائه:<\/b> أن تفتح الهاتف لغرض ثم تجد نفسك في مكان آخر.<\/p><p class=\"\"><b>العجز عن قول «لا» للغو:<\/b> إجابة كل دعوة وكل رسالة دون تمييز.<\/p><p class=\"\"><b>فوضى المكان:<\/b> يضيع الوقت في البحث عن الأغراض والأدوات.<\/p><p class=\"\"><b>أوهام المثالية الصارمة:<\/b> لا أبدأ حتى تكتمل الظروف.<\/p><\/details><\/article><\/section><section class=\"bs\"><h3>٣ · سؤال للحوار<\/h3><p class=\"big\">ما المهمة التي تؤجلها منذ أسبوع؟ وما السبب الحقيقي؟<\/p><\/section><section class=\"bs\"><h3>٤ · نشاط تطبيقي<\/h3><p class=\"big\">طبق قاعدة الدقيقتين على مهمة مؤجلة، ثم أخبر المجموعة.<\/p><\/section><section class=\"bs\"><h3>أسئلة قد تُطرح<\/h3><details class=\"more\"><summary><b>أنا لا أبدع إلا تحت ضغط اللحظات الأخيرة، فهل التسويف ميزة لي؟<\/b><\/summary><p>الإنجاز تحت ضغط الذعر يعطي نشوة مؤقتة، لكنه يقدم نتائج سطحية مليئة بالأخطاء ويرهق النفس والجسد. أما الإتقان العميق فيحتاج إلى صفاء وتركيز متدرج.<\/p><\/details><details class=\"more\"><summary><b>كيف أتخلص من جلد الذات وقد تراكمت عليّ مهام لأسابيع؟<\/b><\/summary><p>جلد الذات وقود التسويف، لأن الدماغ يهرب من تأنيب الضمير إلى الشاشة. اقطع التفكير في الماضي، وسامح نفسك، وركز على مهمة الساعة الحالية فقط، فالجبال لا تُنقل إلا حجراً حجراً.<\/p><\/details><\/section><section class=\"bs warn\"><h3>رادار الحماية<\/h3><p><b>مؤشرات الخطر:<\/b> تراكم المهام وتأجيل مستمر، وتغيب متكرر عن مواعيد التسليم، وعبارات مثل «أنا فاشل بطبعي»، وقلق ذهني دائم يرافقه سهر وإنهاك.<\/p><small>البروتوكول كاملاً في تبويب «الكامل».<\/small><\/section><section class=\"bs\"><h3>٥ · رحلة الأسبوع<\/h3><p class=\"\"><b>مهمة مؤجلة يومياً:<\/b> ينفذ الطالب كل يوم أول دقيقتين من مهمة مؤجلة قبل أي ترفيه.<\/p><p class=\"\"><b>جلسة تركيز:<\/b> يطبق جلسة مؤقت واحدة (25 دقيقة) يومياً بلا هاتف.<\/p><p class=\"\"><b>جرد لصوص الوقت:<\/b> يدوّن ما أضاع وقته أكثر خلال الأسبوع ويشاركه في اللقاء القادم.<\/p><p class=\"\"><b>جسر إلى اللقاء العاشر:<\/b> وإذا ضبطنا الوقت وبدأنا بصدق، فكيف نصل بهذه المنهجية إلى أعمق عادة في حياة المسلم: عبادته؟ هذا موضوع «العادات الإيمانية المستدامة».<\/p><\/section>", "slides": ["<div class=\"cn\">9<\/div><h2>فك قيود التسويف ولصوص الوقت<\/h2><p class=\"q\">كيف ننتقل من المماطلة إلى الإنجاز الفوري؟<\/p>", "<small>إضاءة استهلالية<\/small><h2>معضلة حمزة<\/h2><ul><li class=\"frag\">ما الذي كان يفعله حمزة فعلاً وهو يرتب المكتب ويعد الشاي؟<\/li><li class=\"frag\">متى يأتي «المزاج المناسب»؟ وهل جاء يوماً؟<\/li><\/ul>", "<small>1<\/small><h2>المبادرة أمر إلهي<\/h2><p class=\"ayah\">﴿وَسَارِعُوا إِلَىٰ مَغْفِرَةٍ مِّن رَّبِّكُمْ وَجَنَّةٍ عَرْضُهَا السَّمَاوَاتُ وَالْأَرْضُ أُعِدَّتْ لِلْمُتَّقِينَ﴾ [آل عمران: 133]<\/p><p class=\"g frag\">التسويف وكلمة «سوف» هما بذرة الفوات والحسرة.<\/p>", "<small>2<\/small><h2>الاستعاذة من العجز والكسل<\/h2><p class=\"g frag\">الكسل آفة تسلب مروءة الشاب وقوته مع سلامة جسده.<\/p>", "<small>3<\/small><h2>وهم انتظار المزاج<\/h2><p class=\"g frag\">العمل هو الذي يولد المزاج وليس العكس. كسر المماطلة يبدأ بخطوة صغيرة فورية (قاعدة الدقيقتين).<\/p>", "<small>4<\/small><h2>لصوص الوقت<\/h2><p class=\"g frag\">المثالية المعطلة، والعجز عن قول «لا» للغو، والتصفح الرقمي التائه، كلها تسرق رأس مال الإنسان.<\/p>", "<small>سؤال للحوار<\/small><h2 class=\"big\">ما المهمة التي تؤجلها منذ أسبوع؟ وما السبب الحقيقي؟<\/h2>", "<small>نشاط تطبيقي<\/small><h2 class=\"big\">طبق قاعدة الدقيقتين على مهمة مؤجلة، ثم أخبر المجموعة.<\/h2>", "<small>سؤال وبرهان<\/small><details class=\"frag\"><summary><b>أنا لا أبدع إلا تحت ضغط اللحظات الأخيرة، فهل التسويف ميزة لي؟<\/b><\/summary><p>الإنجاز تحت ضغط الذعر يعطي نشوة مؤقتة، لكنه يقدم نتائج سطحية مليئة بالأخطاء ويرهق النفس والجسد. أما الإتقان العميق فيحتاج إلى صفاء وتركيز متدرج.<\/p><\/details><details class=\"frag\"><summary><b>كيف أتخلص من جلد الذات وقد تراكمت عليّ مهام لأسابيع؟<\/b><\/summary><p>جلد الذات وقود التسويف، لأن الدماغ يهرب من تأنيب الضمير إلى الشاشة. اقطع التفكير في الماضي، وسامح نفسك، وركز على مهمة الساعة الحالية فقط، فالجبال لا تُنقل إلا حجراً حجراً.<\/p><\/details><details class=\"frag\"><summary><b>هل اعتذاري للزملاء عن الخروج أوقات الجد خذلان ونقص في المروءة؟<\/b><\/summary><p>قولك «لا» للغو هو قولك «نعم» لكرامتك ورسالتك. والصاحب النبيل يقدّر وقتك ويشجعك، أما من يحزن لانضباطك فقد يسعى لجرّك إلى الفراغ ليؤنس بك تقصيره.<\/p><\/details>", "<small>ميدان التطبيق<\/small><h2>«مختبر تفكيك جبل التسويف»  نشاط ذهني وعملي<\/h2><ol><li class=\"frag\">1. الأدوات: استمارة تفكيك المهام ومؤقت إلكتروني.<\/li><li class=\"frag\">2. التحديد: يحدد كل فتى أضخم مهمة يؤجلها منذ أيام.<\/li><li class=\"frag\">3. خوارزمية التفكيك الخماسية: يسمّي المهمة بدقة، ويحوّلها إلى أول حركة جسدية مدتها دقيقتان، ويحدد الموعد والمكان فور العودة للبيت، وينفي المشتت…<\/li><li class=\"frag\">4. دراسة حالة: يوسف (16 سنة) متوقد الذكاء، لكنه لا يبدأ حفظه أو مذاكرته إلا بشروط: غرفة هادئة تماماً، ومزاج صافٍ، ويوم كامل أمامه، فيمر الوقت دون بدء.<\/li><li class=\"frag\">5. الاعتراض: يتقمص أحد الطلاب دور محامي الشيطان ويدافع عن «الإنجاز تحت ضغط اللحظة الأخيرة»، وتفنّده المجموعات.<\/li><\/ol>", "<small>رحلة الأسبوع<\/small><ul><li class=\"frag\"><b>مهمة مؤجلة يومياً:<\/b> ينفذ الطالب كل يوم أول دقيقتين من مهمة مؤجلة قبل أي ترفيه.<\/li><li class=\"frag\"><b>جلسة تركيز:<\/b> يطبق جلسة مؤقت واحدة (25 دقيقة) يومياً بلا هاتف.<\/li><li class=\"frag\"><b>جرد لصوص الوقت:<\/b> يدوّن ما أضاع وقته أكثر خلال الأسبوع ويشاركه في اللقاء القادم.<\/li><li class=\"frag\"><b>جسر إلى اللقاء العاشر:<\/b> وإذا ضبطنا الوقت وبدأنا بصدق، فكيف نصل بهذه المنهجية إلى أعمق عادة في حياة المسلم: عبادته؟ هذا موضوع «العادات الإيمانية المستدامة».<\/li><\/ul>"], "n": 9, "u": 1, "title": "فك قيود التسويف ولصوص الوقت", "q": "كيف ننتقل من المماطلة إلى الإنجاز الفوري؟", "dqq": "ما المهمة التي تؤجلها منذ أسبوع؟ وما السبب الحقيقي؟", "pact": "طبق قاعدة الدقيقتين على مهمة مؤجلة، ثم أخبر المجموعة."}, {"summary": "<p class=\"\">هذا اللقاء يختم الوحدة بتطبيق ما تعلمه الفتى على أعمق مجال في حياته: علاقته بالله. فكثير من الفتيان يعيشون دورة إيمانية متقلبة: اندفاع في المواسم، ثم فتور وانقطاع، ثم شعور بالنفاق. يتعلم الفتى أن الفتور طبيعة بشرية يحسن إدارتها، وأن الله يحب القليل الدائم، وأن العبادة تُجذَّر حين تُربط بروتين يومي ثابت، وأن له حداً أدنى إيمانياً لا يسمح بانهياره مهما كانت الظروف.<\/p><p class=\"\">يتبنى «الحد الأدنى الإيماني» حصناً لهويته.<\/p><p class=\"\">يربط عبادته بعادات يومية ثابتة فتصير جزءاً من يومه.<\/p><p class=\"\">يتعامل مع الفتور والذنب بالعودة لا بالهجران.<\/p><div class=\"tw\"><table><tr><th><b>المهارة<\/b><\/th><th><b>معناها العملي<\/b><\/th><\/tr><tr><td><b>المداومة الإيمانية<\/b><\/td><td>يلتزم بعبادات صغيرة ثابتة بدل مواسم متقطعة<\/td><\/tr><tr><td><b>تجميع العادات<\/b><\/td><td>يربط العبادة بعادة يومية قائمة فتثبت<\/td><\/tr><tr><td><b>إدارة الفتور<\/b><\/td><td>يعرف كيف يتصرف حين يضعف حماسه دون أن يهدم أساسه<\/td><\/tr><\/table><\/div>", "kit": "<p class=\"\"><b>ما يعيشه الفتى:<\/b> الفتى متأثر بالمواعظ والمواسم، فيندفع ثم يخبو. وإذا زلّ في معصية شعر بالخزي، وربما قال: «ما معنى أن أصلي بعد هذا؟». وقد يخشى الرياء إذا أظهر التزامه أمام زملائه.<\/p><p class=\"\"><b>اجعل الفتور موضوعاً مقبولاً:<\/b> إذا شعر الفتى بأن الفتور خطيئة كتمه، وإذا علم أنه طبيعي تحدث عنه فوجد من يعينه.<\/p><p class=\"\"><b>ركّز على الفرائض أولاً:<\/b> الحد الأدنى هو الصلوات في وقتها والفجر على الأخص، ثم الورد الصغير.<\/p><p class=\"\"><b>لا تحوّل المنهج إلى رقم:<\/b> غايتك أن يحب الفتى ربه ويستمر، لا أن يملأ جدولاً.<\/p><p class=\"\"><b>كن أنت قدوة في المداومة:<\/b> إن رأوك تؤدي أورادك بهدوء ثابت فهم أقرب إلى الاقتداء.<\/p>", "hookT": "طارق وزياد", "hook": "<p class=\"\"><b>طارق (17 سنة)<\/b> قرر في أول ليلة من رجب أن يغير حياته الإيمانية جذرياً: قام الليل بسورة البقرة، وتعهد بقراءة جزأين يومياً وصيام الإثنين والخميس. استمر عشرة أيام في نشوة، وفي اليوم الحادي عشر أصابه إرهاق شديد فترك القيام، ثم هجر المصحف، وعاد بعد أسابيع إلى فتور أشد. أما <b>زياد (17 سنة)<\/b> فألزم نفسه فقط بـ «المثلث الذري»: صلاة الفجر حاضراً، وصفحتين من المصحف بعد الصلاة، وركعة الوتر مع أذكار النوم، معاهداً ربه ألا يترك هذا الحد مهما اشتدت الظروف.<\/p><p class=\"\"><b>أسئلة الاستثارة:<\/b><\/p><p class=\"\">أيهما أعظم توفيقاً وأحب إلى الله ورسوله ﷺ؟ ولماذا؟<\/p><p class=\"\">لماذا نميل جميعاً إلى مسلك طارق ثم نشتكي من الانتكاسة وظلمة القلب؟<\/p>", "pts": "<article class=\"pt\"><h4><span>أولاً<\/span>العبودية مستمرة حتى اليقين<\/h4><p class=\"ayah\">﴿وَاعْبُدْ رَبَّكَ حَتَّىٰ يَأْتِيَكَ الْيَقِينُ﴾ [الحجر: 99]<\/p><p class=\"\">أمر الله نبيه ﷺ بالاستمرار في العبادة حتى الموت (اليقين)، فالعبودية صبغة حياة لا تنتهي بانقضاء موسم أو مرحلة عمرية. ومدح الله أهل الفلاح بصفة الدوام: ﴿الَّذِينَ هُمْ عَلَىٰ صَلَاتِهِمْ دَائِمُونَ﴾ [المعارج: 23]، فالقيمة العليا في الميزان الإلهي الاستمرارية والثبات.<\/p><p class=\"ayah\">﴿يَا أَيُّهَا الَّذِينَ آمَنُوا اصْبِرُوا وَصَابِرُوا وَرَابِطُوا وَاتَّقُوا اللَّهَ لَعَلَّكُمْ تُفْلِحُونَ﴾ [آل عمران: 200]<\/p><p class=\"\">المرابطة تتطلب الصبر على الطاعة وحماية الثغور، وأولى الثغور الفرائض، قبل الاستكثار من النوافل.<\/p><\/article><article class=\"pt\"><h4><span>ثانياً<\/span>العمل الدائم أحب إلى الله<\/h4><p class=\"\">سُئل النبي ﷺ: أَيُّ الأَعْمَالِ أَحَبُّ إِلَى اللهِ؟ قَالَ: «أَدْوَمُهَا وَإِنْ قَلَّ» متفق عليه. وقالت عائشة رضي الله عنها في وصف هديه: «وَكَانَ عَمَلُهُ دِيمَةً» متفق عليه. والديمة هي المطر الهادئ الدائم الذي يروي الأرض فيثمر زرعها، لا السيل الجارف الذي يقتلع التربة. وقال ﷺ لعبد الله بن عمرو: «يَا عَبْدَ اللهِ، لاَ تَكُنْ مِثْلَ فُلاَنٍ كَانَ يَقُومُ اللَّيْلَ فَتَرَكَ قِيَامَ اللَّيْلِ» رواه البخاري. وهو تحذير نبوي من الانقطاع بعد الإقبال، لأن التراجع يورث الجفاء وقسوة القلب.<\/p><\/article><article class=\"pt\"><h4><span>ثالثاً<\/span>فقه الشِّرة والفَترة<\/h4><p class=\"had\">قال رسول الله ﷺ: «إنَّ لِكُلِّ عابِدٍ شِرَّةً، ولِكُلِّ شِرَّةٍ فَتْرَةً، فإمَّا إلى سُنَّةٍ وإمَّا إلى بِدْعَةٍ، فمَن كانَتْ فَتْرَتُهُ إلى سُنَّةٍ فقدِ اهتدى، ومَن كانَتْ إلى غيرِ ذلكَ فقد هلَكَ» رواه أحمد وابن حبان<\/p><p class=\"\">الشِّرة هي الحماس والإقبال، والفترة السكون والفتور. وقد قرّر النبي ﷺ أن الفتور أمر طبيعي لا يسلم منه أحد. والمهم ألا يخرج الفتور عن دائرة السنة، فيحافظ الفتى فيه على الفرائض ويبتعد عن المحرمات، ولا يتحول الفتور إلى تضييع للصلاة أو وقوع في الكبائر.<\/p><\/article><article class=\"pt\"><h4><span>رابعاً<\/span>لا تجعل الذنب بوابة للهجران<\/h4><p class=\"had\">قال رسول الله ﷺ: «اتَّقِ اللهَ حَيْثُمَا كُنْتَ، وَأَتْبِعِ السَّيِّئَةَ الحَسَنَةَ تَمْحُهَا، وَخَالِقِ النَّاسَ بِخُلُقٍ حَسَنٍ» رواه الترمذي. فالعلاج النبوي للذنب هو المبادرة بحسنة تمحوه، لا الانقطاع عن الطاعة. وأخبث ما يفعله الشيطان أن يستغل الذنب ليقنع الفتى بأن لا معنى لصلاته وقراءته بعده، فيقطعه عن الله كلياً.<\/p><\/article><article class=\"pt\"><h4><span>خامساً<\/span>حنظلة والواقعية في فهم النفس<\/h4><p class=\"\">جاء حنظلة الأسيدي رضي الله عنه يبكي ويقول: «نافق حنظلة!»، لأنهم عند النبي ﷺ تدق قلوبهم، فإذا رجعوا إلى أهلهم عافسوا الدنيا ونسوا. فقال له النبي ﷺ: «وَالَّذِي نَفْسِي بِيَدِهِ، إِنْ لَوْ تَدُومُونَ عَلَى مَا تَكُونُونَ عِنْدِي وَفِي الذِّكْرِ، لَصَافَحَتْكُمُ الْمَلَائِكَةُ عَلَى فُرُشِكُمْ وَفِي طُرُقِكُمْ، وَلَكِنْ يَا حَنْظَلَةُ سَاعَةً وَسَاعَةً» رواه مسلم. فالنبي ﷺ ربّى الصحابة على فهم طبيعة النفس البشرية: ساعة للعبادة وساعة للحياة، ولا نفاق في تفاوت المشاعر.<\/p><\/article><article class=\"pt\"><h4><span>سادساً<\/span>تجميع العادات: ربط العبادة بروتين قائم<\/h4><p class=\"\">أسهل طريقة لتثبيت عبادة جديدة أن تربطها بعادة يومية ثابتة لديك أصلاً. والمعادلة: [بعد / قبل عادة ثابتة] + [سأؤدي العبادة الصغيرة].<\/p><div class=\"tw\"><table><tr><th><b>العبادة<\/b><\/th><th><b>عادة الربط<\/b><\/th><th><b>الصيغة<\/b><\/th><\/tr><tr><td><b>صفحتان من المصحف<\/b><\/td><td>الانتهاء من صلاة الفجر<\/td><td>«فور التسليم من الفجر سأقرأ صفحتين قبل مغادرة مكاني»<\/td><\/tr><tr><td><b>أذكار الصباح<\/b><\/td><td>ركوب الحافلة أو السيارة<\/td><td>«حين أركب سأقرأ أذكار الصباح»<\/td><\/tr><tr><td><b>ركعة الوتر وأذكار النوم<\/b><\/td><td>وضع الهاتف على الشاحن ليلاً<\/td><td>«قبل وضع الهاتف أصلي الوتر وأقرأ أذكار النوم»<\/td><\/tr><\/table><\/div><\/article><article class=\"pt\"><h4><span>سابعاً<\/span>الحد الأدنى الإيماني<\/h4><p class=\"\">هو جدار حماية لهويتك لا يسمح بانهياره تحت أي ظرف (امتحانات، سفر، مرض، فتور). وعناصره:<\/p><p class=\"\">الصلوات الخمس في أوقاتها مع الحرص على الفجر.<\/p><p class=\"\">ورد قرآني ثابت: صفحتان تستغرقان نحو أربع دقائق.<\/p><p class=\"\">ركعة الوتر مع أذكار الصباح والمساء.<\/p><p class=\"\">اجتناب الكبائر والمحرمات الظاهرة.<\/p><p class=\"\">فإذا جاء الفتور جاء وقد ثبّت الفتى أساسه، فلا يسقط في هاوية الانقطاع.<\/p><\/article>", "qa": "<div class=\"tw\"><table><tr><th><b>السؤال المتوقع<\/b><\/th><th><b>تفكيكه<\/b><\/th><\/tr><tr><td><b>أليس أداء العبادة القليلة (ركعة أو صفحتين) عملاً آلياً بارداً بلا خشوع؟<\/b><\/td><td>الخشوع واللذة ثمرة المداومة وليسا شرطاً لبدء العبادة. وانتظار المشاعر الدافئة حيلة تدفعك للترك. والصلاة في أوقات الجفاف العاطفي تعبير عن صدق الامتثال والعبودية الخالصة.<\/td><\/tr><tr><td><b>أخشى الرياء إذا حافظت على عباداتي أمام زملائي، فهل أتركها؟<\/b><\/td><td>ترك الطاعة خوفاً من الناس طريق خطير. لا تتراجع عن إظهار شعائرك خجلاً، واحمِ إخلاصك بأن تجعل لنفسك عملاً صالحاً خفياً في بيتك وغرفتك لا يطلع عليه إلا الله.<\/td><\/tr><tr><td><b>إذا زلّت قدمي في معصية شعرت بالخزي ورأيت أنه لا معنى لصلاتي بعدها<\/b><\/td><td>هذه من أخبث حيل الشيطان. العلاج النبوي: «وأتبع السيئة الحسنة تمحها». توضأ فوراً وصلِّ ركعتين وتصدق، فالطاعات تمحو، والفرار يكون إلى الله لا منه.<\/td><\/tr><\/table><\/div>", "radar": "<p class=\"\"><b>مؤشرات الخطر:<\/b> انتكاسة حادة بعد المواسم، وجلد الذات بعبارات مثل «أنا منافق كاذب»، وتضييع الفجر لأسابيع، وترك الورد كلياً بعد فتور واحد، والخوف من إظهار الالتزام.<\/p><p class=\"\"><b>بروتوكول التدخل:<\/b><\/p><p class=\"step\"><b>1. <\/b>ابدأ بتطبيع الفتور: «ما تشعر به شائع، وقد شكا منه الصحابة».<\/p><p class=\"step\"><b>2. <\/b>أعد بناء الحد الأدنى معه: الفريضة أولاً، ثم عبادة صغيرة جداً يستطيع الثبات عليها.<\/p><p class=\"step\"><b>3. <\/b>اتفق معه على صحبة صالحة تذكّره وتتابعه، وراجعه بعد أسبوع.<\/p>", "actT": "«مختبر المثلث الإيماني»  نشاط تصميمي", "act": "<p class=\"step\"><b>1. الأدوات:<\/b> استمارة تصميم المثلث الإيماني وروتين اليوم.<\/p><p class=\"step\"><b>2. التصميم الفردي:<\/b> يصمم كل فتى معادلات الربط الثلاث (الورد القرآني، أذكار اليوم، الوتر وأذكار النوم).<\/p><p class=\"step\"><b>3. المراجعة الثنائية:<\/b> يتبادل كل اثنين استماراتهما للتأكد أن كل معادلة واضحة وسهلة التنفيذ بنسبة مئة بالمئة.<\/p><p class=\"step\"><b>4. دراسة حالة:<\/b> سلمان (16 سنة) صادق القلب، التزم في رمضان ببرنامج شاق (قيام ساعة، جزآن من القرآن، صيام تطوع). فلما انقضى رمضان وبدأت الدراسة ثقل عليه القيام، وبدل أن يقلل عبادته للحد الأدنى قال لنفسه: «أنا منافق كاذب»، فترك القيام ثم هجر القرآن وتراجعت صلاته حتى ضاع الفجر لأسابيع. تحلل المجموعات: أين الخطأ؟ وما الخطة التي تعيده؟<\/p><p class=\"step\"><b>5. الاعتراض:<\/b> أحد الطلاب يدافع عن حجة «الطفرات أفضل من العبادة القليلة»، وتفنّده المجموعات.<\/p><div class=\"tw\"><table><tr><th colspan=\"2\"><b>بطاقة: المثلث الإيماني والحد الأدنى<\/b><\/th><\/tr><tr><td><b>1. عبادة الفجر<\/b><\/td><td>بعد صلاة الفجر مباشرة سأقرأ ............ صفحات<\/td><\/tr><tr><td><b>2. عبادة النهار<\/b><\/td><td>حين ............ سأقرأ أذكار ............<\/td><\/tr><tr><td><b>3. عبادة الليل<\/b><\/td><td>قبل وضع الهاتف سأصلي ............ وأقرأ أذكار النوم<\/td><\/tr><tr><td><b>4. حدّي الأدنى الذي لا أتنازل عنه<\/b><\/td><td>............................<\/td><\/tr><tr><td><b>5. خبيئتي الصالحة<\/b><\/td><td>عمل لا يعلمه إلا الله: ............................<\/td><\/tr><\/table><\/div>", "week": "<p class=\"\"><b>تطبيق المثلث:<\/b> يؤدي الطالب عباداته الثلاث الصغيرة وفق معادلات الربط ويسجل التزامه يومياً.<\/p><p class=\"\"><b>الخبيئة الصالحة:<\/b> يختار عملاً صالحاً خفياً يؤديه هذا الأسبوع ولا يخبر به أحداً.<\/p><p class=\"\"><b>عودة بعد الزلل:<\/b> إن وقع في تقصير فليتبع السيئة بحسنة فوراً (وضوء وركعتان وصدقة صغيرة) ولا ينقطع.<\/p><p class=\"\"><b>جسر إلى الوحدة الثالثة:<\/b> وبعد أن بنينا الذات والعادات، نتعلم كيف نوجّه هذه الطاقة نحو أولويات حياتنا. وهذا موضوع «فقه الأولويات وإدارة الحياة».<\/p>", "kq": "فقه «أحب العمل إلى الله أدومه وإن قل»", "brief": "<div class=\"plan\"><span>اقتراح لتوزيع الوقت (١٠–١٥ د)<\/span><b>افتتاح ٣<\/b><b>محاور ٥<\/b><b>حوار ٢<\/b><b>نشاط ٣<\/b><b>ختام ٢<\/b><\/div><section class=\"bs\"><h3>١ · الافتتاح: طارق وزياد<\/h3><p class=\"\"><b>طارق (17 سنة)<\/b> قرر في أول ليلة من رجب أن يغير حياته الإيمانية جذرياً: قام الليل بسورة البقرة، وتعهد بقراءة جزأين يومياً وصيام الإثنين والخميس. استمر عشرة أيام في نشوة، وفي اليوم الحادي عشر أصابه إرهاق شديد فترك القيام، ثم هجر المصحف، وعاد بعد أسابيع إلى فتور أشد. أما <b>زياد (17 سنة)<\/b> فألزم نفسه فقط بـ «المثلث الذري»: صلاة الفجر حاضراً، وصفحتين من المصحف بعد الصلاة، وركعة الوتر مع أذكار النوم، معاهداً ربه ألا يترك هذا الحد مهما اشتدت الظروف.<\/p><p class=\"\"><b>أسئلة الاستثارة:<\/b><\/p><p class=\"\">أيهما أعظم توفيقاً وأحب إلى الله ورسوله ﷺ؟ ولماذا؟<\/p><p class=\"\">لماذا نميل جميعاً إلى مسلك طارق ثم نشتكي من الانتكاسة وظلمة القلب؟<\/p><\/section><section class=\"bs\"><h3>٢ · المحاور<\/h3><article class=\"pt\"><h4><span>١<\/span>العبودية مستمرة حتى اليقين<\/h4><p class=\"ayah\">﴿وَاعْبُدْ رَبَّكَ حَتَّىٰ يَأْتِيَكَ الْيَقِينُ﴾ [الحجر: 99]<\/p><p class=\"g\">العبادة صبغة حياة لا تنتهي بانقضاء موسم أو مرحلة عمرية.<\/p><details class=\"more\"><summary>للتوسع<\/summary><p class=\"\">أمر الله نبيه ﷺ بالاستمرار في العبادة حتى الموت (اليقين)، فالعبودية صبغة حياة لا تنتهي بانقضاء موسم أو مرحلة عمرية. ومدح الله أهل الفلاح بصفة الدوام: ﴿الَّذِينَ هُمْ عَلَىٰ صَلَاتِهِمْ دَائِمُونَ﴾ [المعارج: 23]، فالقيمة العليا في الميزان الإلهي الاستمرارية والثبات.<\/p><p class=\"ayah\">﴿يَا أَيُّهَا الَّذِينَ آمَنُوا اصْبِرُوا وَصَابِرُوا وَرَابِطُوا وَاتَّقُوا اللَّهَ لَعَلَّكُمْ تُفْلِحُونَ﴾ [آل عمران: 200]<\/p><p class=\"\">المرابطة تتطلب الصبر على الطاعة وحماية الثغور، وأولى الثغور الفرائض، قبل الاستكثار من النوافل.<\/p><\/details><\/article><article class=\"pt\"><h4><span>٢<\/span>فقه الشرة والفترة<\/h4><p class=\"had\">قال رسول الله ﷺ: «إنَّ لِكُلِّ عابِدٍ شِرَّةً، ولِكُلِّ شِرَّةٍ فَتْرَةً، فإمَّا إلى سُنَّةٍ وإمَّا إلى بِدْعَةٍ، فمَن كانَتْ فَتْرَتُهُ إلى سُنَّةٍ فقدِ اهتدى، ومَن كانَتْ إلى غيرِ ذلكَ فقد هلَكَ» رواه أحمد وابن حبان<\/p><p class=\"g\">الفتور طبيعة بشرية، والمهم ألا يخرج الفتى عن الفرائض (الحد الأدنى الإيماني).<\/p><details class=\"more\"><summary>للتوسع<\/summary><p class=\"\">الشِّرة هي الحماس والإقبال، والفترة السكون والفتور. وقد قرّر النبي ﷺ أن الفتور أمر طبيعي لا يسلم منه أحد. والمهم ألا يخرج الفتور عن دائرة السنة، فيحافظ الفتى فيه على الفرائض ويبتعد عن المحرمات، ولا يتحول الفتور إلى تضييع للصلاة أو وقوع في الكبائر.<\/p><\/details><\/article><article class=\"pt\"><h4><span>٣<\/span>لا هجران بعد الذنب<\/h4><p class=\"had\">قال رسول الله ﷺ: «اتَّقِ اللهَ حَيْثُمَا كُنْتَ، وَأَتْبِعِ السَّيِّئَةَ الحَسَنَةَ تَمْحُهَا، وَخَالِقِ النَّاسَ بِخُلُقٍ حَسَنٍ» رواه الترمذي. فالعلاج النبوي للذنب هو المبادرة بحسنة تمحوه، لا الانقطاع عن الطاعة. وأخبث ما يفعله الشيطان أن يستغل الذنب ليقنع الفتى بأن لا معنى لصلاته وقراءته بعده، فيقطعه عن الله كلياً.<\/p><p class=\"g\">العلاج النبوي للزلل هو المسارعة بالطاعة لا الانقطاع عنها.<\/p><details class=\"more\"><summary>للتوسع<\/summary><\/details><\/article><article class=\"pt\"><h4><span>٤<\/span>الواقعية في فهم النفس<\/h4><p class=\"g\">النفس تحتاج لترويح مباح، وتفاوت المشاعر ليس نفاقا.<\/p><details class=\"more\"><summary>للتوسع<\/summary><p class=\"\">جاء حنظلة الأسيدي رضي الله عنه يبكي ويقول: «نافق حنظلة!»، لأنهم عند النبي ﷺ تدق قلوبهم، فإذا رجعوا إلى أهلهم عافسوا الدنيا ونسوا. فقال له النبي ﷺ: «وَالَّذِي نَفْسِي بِيَدِهِ، إِنْ لَوْ تَدُومُونَ عَلَى مَا تَكُونُونَ عِنْدِي وَفِي الذِّكْرِ، لَصَافَحَتْكُمُ الْمَلَائِكَةُ عَلَى فُرُشِكُمْ وَفِي طُرُقِكُمْ، وَلَكِنْ يَا حَنْظَلَةُ سَاعَةً وَسَاعَةً» رواه مسلم. فالنبي ﷺ ربّى الصحابة على فهم طبيعة النفس البشرية: ساعة للعبادة وساعة للحياة، ولا نفاق في تفاوت المشاعر.<\/p><\/details><\/article><\/section><section class=\"bs\"><h3>٣ · سؤال للحوار<\/h3><p class=\"big\">كيف تتصرف حين تشعر بفتور في العبادة؟<\/p><\/section><section class=\"bs\"><h3>٤ · نشاط تطبيقي<\/h3><p class=\"big\">حدد «حدك الأدنى الإيماني» اليومي في ثلاثة أعمال لا تتركها.<\/p><\/section><section class=\"bs\"><h3>أسئلة قد تُطرح<\/h3><details class=\"more\"><summary><b>أليس أداء العبادة القليلة (ركعة أو صفحتين) عملاً آلياً بارداً بلا خشوع؟<\/b><\/summary><p>الخشوع واللذة ثمرة المداومة وليسا شرطاً لبدء العبادة. وانتظار المشاعر الدافئة حيلة تدفعك للترك. والصلاة في أوقات الجفاف العاطفي تعبير عن صدق الامتثال والعبودية الخالصة.<\/p><\/details><details class=\"more\"><summary><b>أخشى الرياء إذا حافظت على عباداتي أمام زملائي، فهل أتركها؟<\/b><\/summary><p>ترك الطاعة خوفاً من الناس طريق خطير. لا تتراجع عن إظهار شعائرك خجلاً، واحمِ إخلاصك بأن تجعل لنفسك عملاً صالحاً خفياً في بيتك وغرفتك لا يطلع عليه إلا الله.<\/p><\/details><\/section><section class=\"bs warn\"><h3>رادار الحماية<\/h3><p><b>مؤشرات الخطر:<\/b> انتكاسة حادة بعد المواسم، وجلد الذات بعبارات مثل «أنا منافق كاذب»، وتضييع الفجر لأسابيع، وترك الورد كلياً بعد فتور واحد، والخوف من إظهار الالتزام.<\/p><small>البروتوكول كاملاً في تبويب «الكامل».<\/small><\/section><section class=\"bs\"><h3>٥ · رحلة الأسبوع<\/h3><p class=\"\"><b>تطبيق المثلث:<\/b> يؤدي الطالب عباداته الثلاث الصغيرة وفق معادلات الربط ويسجل التزامه يومياً.<\/p><p class=\"\"><b>الخبيئة الصالحة:<\/b> يختار عملاً صالحاً خفياً يؤديه هذا الأسبوع ولا يخبر به أحداً.<\/p><p class=\"\"><b>عودة بعد الزلل:<\/b> إن وقع في تقصير فليتبع السيئة بحسنة فوراً (وضوء وركعتان وصدقة صغيرة) ولا ينقطع.<\/p><p class=\"\"><b>جسر إلى الوحدة الثالثة:<\/b> وبعد أن بنينا الذات والعادات، نتعلم كيف نوجّه هذه الطاقة نحو أولويات حياتنا. وهذا موضوع «فقه الأولويات وإدارة الحياة».<\/p><\/section>", "slides": ["<div class=\"cn\">10<\/div><h2>العادات الإيمانية المستدامة<\/h2><p class=\"q\">كيف نثبت عبادتنا ونتعامل مع الفتور؟<\/p>", "<small>إضاءة استهلالية<\/small><h2>طارق وزياد<\/h2><ul><li class=\"frag\">أيهما أعظم توفيقاً وأحب إلى الله ورسوله ﷺ؟ ولماذا؟<\/li><li class=\"frag\">لماذا نميل جميعاً إلى مسلك طارق ثم نشتكي من الانتكاسة وظلمة القلب؟<\/li><\/ul>", "<small>1<\/small><h2>العبودية مستمرة حتى اليقين<\/h2><p class=\"ayah\">﴿وَاعْبُدْ رَبَّكَ حَتَّىٰ يَأْتِيَكَ الْيَقِينُ﴾ [الحجر: 99]<\/p><p class=\"g frag\">العبادة صبغة حياة لا تنتهي بانقضاء موسم أو مرحلة عمرية.<\/p>", "<small>2<\/small><h2>فقه الشرة والفترة<\/h2><p class=\"had lg\">قال رسول الله ﷺ: «إنَّ لِكُلِّ عابِدٍ شِرَّةً، ولِكُلِّ شِرَّةٍ فَتْرَةً، فإمَّا إلى سُنَّةٍ وإمَّا إلى بِدْعَةٍ، فمَن كانَتْ فَتْرَتُهُ إلى سُنَّةٍ فقدِ اهتدى، ومَن كانَتْ إلى غيرِ ذلكَ فقد هلَكَ» رواه أحمد وابن حبان<\/p><p class=\"g frag\">الفتور طبيعة بشرية، والمهم ألا يخرج الفتى عن الفرائض (الحد الأدنى الإيماني).<\/p>", "<small>3<\/small><h2>لا هجران بعد الذنب<\/h2><p class=\"had lg\">قال رسول الله ﷺ: «اتَّقِ اللهَ حَيْثُمَا كُنْتَ، وَأَتْبِعِ السَّيِّئَةَ الحَسَنَةَ تَمْحُهَا، وَخَالِقِ النَّاسَ بِخُلُقٍ حَسَنٍ» رواه الترمذي. فالعلاج النبوي للذنب هو المبادرة بحسنة تمحوه، لا الانقطاع عن الطاعة. وأخبث ما يفعله الشيطان أن يستغل الذنب ليقنع الفتى بأن لا معنى لصلاته وقراءته بعده، فيقطعه عن الله كلياً.<\/p><p class=\"g frag\">العلاج النبوي للزلل هو المسارعة بالطاعة لا الانقطاع عنها.<\/p>", "<small>4<\/small><h2>الواقعية في فهم النفس<\/h2><p class=\"g frag\">النفس تحتاج لترويح مباح، وتفاوت المشاعر ليس نفاقا.<\/p>", "<small>سؤال للحوار<\/small><h2 class=\"big\">كيف تتصرف حين تشعر بفتور في العبادة؟<\/h2>", "<small>نشاط تطبيقي<\/small><h2 class=\"big\">حدد «حدك الأدنى الإيماني» اليومي في ثلاثة أعمال لا تتركها.<\/h2>", "<small>سؤال وبرهان<\/small><details class=\"frag\"><summary><b>أليس أداء العبادة القليلة (ركعة أو صفحتين) عملاً آلياً بارداً بلا خشوع؟<\/b><\/summary><p>الخشوع واللذة ثمرة المداومة وليسا شرطاً لبدء العبادة. وانتظار المشاعر الدافئة حيلة تدفعك للترك. والصلاة في أوقات الجفاف العاطفي تعبير عن صدق الامتثال والعبودية الخالصة.<\/p><\/details><details class=\"frag\"><summary><b>أخشى الرياء إذا حافظت على عباداتي أمام زملائي، فهل أتركها؟<\/b><\/summary><p>ترك الطاعة خوفاً من الناس طريق خطير. لا تتراجع عن إظهار شعائرك خجلاً، واحمِ إخلاصك بأن تجعل لنفسك عملاً صالحاً خفياً في بيتك وغرفتك لا يطلع عليه إلا الله.<\/p><\/details><details class=\"frag\"><summary><b>إذا زلّت قدمي في معصية شعرت بالخزي ورأيت أنه لا معنى لصلاتي بعدها<\/b><\/summary><p>هذه من أخبث حيل الشيطان. العلاج النبوي: «وأتبع السيئة الحسنة تمحها». توضأ فوراً وصلِّ ركعتين وتصدق، فالطاعات تمحو، والفرار يكون إلى الله لا منه.<\/p><\/details>", "<small>ميدان التطبيق<\/small><h2>«مختبر المثلث الإيماني»  نشاط تصميمي<\/h2><ol><li class=\"frag\">1. الأدوات: استمارة تصميم المثلث الإيماني وروتين اليوم.<\/li><li class=\"frag\">2. التصميم الفردي: يصمم كل فتى معادلات الربط الثلاث (الورد القرآني، أذكار اليوم، الوتر وأذكار النوم).<\/li><li class=\"frag\">3. المراجعة الثنائية: يتبادل كل اثنين استماراتهما للتأكد أن كل معادلة واضحة وسهلة التنفيذ بنسبة مئة بالمئة.<\/li><li class=\"frag\">4. دراسة حالة: سلمان (16 سنة) صادق القلب، التزم في رمضان ببرنامج شاق (قيام ساعة، جزآن من القرآن، صيام تطوع).<\/li><li class=\"frag\">5. الاعتراض: أحد الطلاب يدافع عن حجة «الطفرات أفضل من العبادة القليلة»، وتفنّده المجموعات.<\/li><\/ol>", "<small>رحلة الأسبوع<\/small><ul><li class=\"frag\"><b>تطبيق المثلث:<\/b> يؤدي الطالب عباداته الثلاث الصغيرة وفق معادلات الربط ويسجل التزامه يومياً.<\/li><li class=\"frag\"><b>الخبيئة الصالحة:<\/b> يختار عملاً صالحاً خفياً يؤديه هذا الأسبوع ولا يخبر به أحداً.<\/li><li class=\"frag\"><b>عودة بعد الزلل:<\/b> إن وقع في تقصير فليتبع السيئة بحسنة فوراً (وضوء وركعتان وصدقة صغيرة) ولا ينقطع.<\/li><li class=\"frag\"><b>جسر إلى الوحدة الثالثة:<\/b> وبعد أن بنينا الذات والعادات، نتعلم كيف نوجّه هذه الطاقة نحو أولويات حياتنا. وهذا موضوع «فقه الأولويات وإدارة الحياة».<\/li><\/ul>"], "n": 10, "u": 1, "title": "العادات الإيمانية المستدامة", "q": "كيف نثبت عبادتنا ونتعامل مع الفتور؟", "dqq": "كيف تتصرف حين تشعر بفتور في العبادة؟", "pact": "حدد «حدك الأدنى الإيماني» اليومي في ثلاثة أعمال لا تتركها."}, {"summary": "<p class=\"\">تنتقل الوحدة هنا من بناء الذات إلى توجيهها. فبعد أن عرف الفتى غايته الكبرى في الوحدة الأولى وبنى عاداته في الثانية، يحتاج الآن إلى أن يحوّل هذه الغاية إلى أهداف محددة تنظم عامه. يتعلم في هذا اللقاء الفرق بين الغاية العظمى والأهداف المرحلية، وكيف تتحول الأهداف الدنيوية إلى عبادة بالنية الصالحة، وكيف يتجنب فخ التقلب بين الاهتمامات مع كل صيحة جديدة.<\/p><p class=\"\">يضع أهدافه الاستراتيجية الثلاثة للعام ضمن غايته الكبرى.<\/p><p class=\"\">يفهم أن الطموح الدنيوي لا يتعارض مع العبودية إذا كان خادماً لها.<\/p><p class=\"\">يتعلم بتر الاهتمامات الفائضة والتركيز على مجال واحد.<\/p><div class=\"tw\"><table><tr><th><b>المهارة<\/b><\/th><th><b>معناها العملي<\/b><\/th><\/tr><tr><td><b>التخطيط الاستراتيجي الشخصي<\/b><\/td><td>يحدد أهدافاً واضحة قابلة للقياس تخدم غايته<\/td><\/tr><tr><td><b>التركيز وبتر المشتتات<\/b><\/td><td>يختار مجالاً أساسياً ويتخلى عن التفرعات الفائضة<\/td><\/tr><tr><td><b>الربط بين الدنيا والآخرة<\/b><\/td><td>يحول إنجازاته الدنيوية إلى أعمال صالحة بالنية<\/td><\/tr><\/table><\/div>", "kit": "<p class=\"\"><b>ما يعيشه الفتى:<\/b> يتعرض الفتى كل يوم لمئات النماذج الجذابة: رائد أعمال، ولاعب، ومبرمج، وصانع محتوى. فينبهر بكل واحد ويشعر أنه يجب أن يكون كل هؤلاء معاً. والنتيجة تشتت وقلق ورحلة بلا نهاية.<\/p><p class=\"\"><b>احتفِ بطموحه:<\/b> لا تُصغّر أحلامه الدنيوية. ما تفعله أنك تجعلها جزءاً من غاية أكبر لا تخرج عنها.<\/p><p class=\"\"><b>ميّز بين الاستكشاف والتشتت:<\/b> الاستكشاف فترة محدودة لتجريب المجالات، أما التشتت فاستمرار بلا نهاية.<\/p><p class=\"\"><b>كن واقعياً في الأرقام:<\/b> ساعده على كتابة أهداف قابلة للقياس (جزءان من القرآن، معدل محدد) بدل العبارات العائمة.<\/p><p class=\"\"><b>لا تفرض عليه مجالاً:<\/b> دورك أن توضح المنهج، والاختيار له.<\/p>", "hookT": "السفينة الفاخرة والمجهول", "hook": "<p class=\"\">تخيل سفينة محيطية عملاقة تقدر بمليارات الدولارات، مزودة بأحدث محركات الملاحة والأنظمة الترفيهية ومحملة بآلاف الأطنان من الوقود والطعام. أبحر الربان بها في عرض المحيط، وبعد ثلاثة أيام صعد أحد المسافرين وسأله: «يا كابتن، السرعة مذهلة والمحركات جبارة، لكن إلى أي ميناء نتجه؟». فابتسم الربان بكل برود وقال: «في الحقيقة لا أدري! ليس لدينا خريطة ولا ميناء نرسو فيه. المهم أننا نتحرك بسرعة ونستمتع بالموسيقى!»<\/p><p class=\"\"><b>أسئلة الاستثارة:<\/b><\/p><p class=\"\">ما قيمة السرعة والمحركات الجبارة إذا لم تكن هناك وجهة؟<\/p><p class=\"\">كم شخصاً تعرفه يشبه هذه السفينة: نشيط جداً لكن لا يعرف إلى أين؟<\/p><p class=\"\">ما الميناء الذي ترسو عليه سفينتك أنت؟<\/p>", "pts": "<article class=\"pt\"><h4><span>أولاً<\/span>الغاية العظمى تحكم الأهداف الفرعية<\/h4><p class=\"ayah\">﴿وَمَا خَلَقْتُ الْجِنَّ وَالْإِنسَ إِلَّا لِيَعْبُدُونِ﴾ [الذاريات: 56]<\/p><p class=\"\">الآية تحدد الغاية الكبرى للوجود، وكل هدف دنيوي يجب أن يدور في فلكها ولا يعارضها. ومن نسي هذا الأصل تاهت أهدافه وتناقضت: ﴿وَلَا تَكُونُوا كَالَّذِينَ نَسُوا اللَّهَ فَأَنسَاهُمْ أَنفُسَهُمْ﴾ [الحشر: 19]. فنسيان الغاية يقود إلى تيه الهوية والشتات النفسي.<\/p><\/article><article class=\"pt\"><h4><span>ثانياً<\/span>وحدة الوجهة تمنح السكينة<\/h4><p class=\"had\">قال رسول الله ﷺ: «مَنْ كَانَتِ الآخِرَةُ هَمَّهُ جَعَلَ اللَّهُ غِنَاهُ فِي قَلْبِهِ وَجَمَعَ لَهُ شَمْلَهُ، وَأَتَتْهُ الدُّنْيَا وَهِيَ رَاغِمَةٌ، وَمَنْ كَانَتِ الدُّنْيَا هَمَّهُ جَعَلَ اللَّهُ فَقْرَهُ بَيْنَ عَيْنَيْهِ وَفَرَّقَ عَلَيْهِ شَمْلَهُ وَلَمْ يَأْتِهِ مِنَ الدُّنْيَا إِلَّا مَا قُدِّرَ لَهُ» رواه الترمذي وابن ماجه<\/p><p class=\"\">وحدة الغاية توحد شتات العقل وتمنح الغنى القلبي، أما تفرق الغايات فيشتت الطاقات ويورث قلقاً دائماً. وقد أخذ النبي ﷺ بمنكب ابن عمر وقال له: «كُنْ فِي الدُّنْيَا كَأَنَّكَ غَرِيبٌ أَوْ عَابِرُ سَبِيلٍ» رواه البخاري، فعابر السبيل يركز على وجهته ولا تستهلكه ملهيات المحطات.<\/p><\/article><article class=\"pt\"><h4><span>ثالثاً<\/span>النية تحوّل الهدف الدنيوي إلى عبادة<\/h4><p class=\"had\">قال رسول الله ﷺ: «إنَّما الأعمالُ بالنِّيَّاتِ، وإنَّما لِكُلِّ امْرِئٍ ما نَوَى» متفق عليه. فالمذاكرة والتمارين الرياضية وإتقان البرمجة تصير بالنية الصالحة أدوات لنصرة الدين وخدمة الأمة ونيل الأجر. ومن هنا لا يتعارض طموح الفتى بالتفوق مع عبوديته. وقد كان عثمان بن عفان وعبد الرحمن بن عوف رضي الله عنهما من كبار الأثرياء، وسخّرا مالهما لتمكين الدين والصدقة. فالإسلام لا يحرّم النجاح الدنيوي بل يرفض أن تكون الدنيا هي الغاية النهائية.<\/p><\/article><article class=\"pt\"><h4><span>رابعاً<\/span>السعي مقياس الإنسان<\/h4><p class=\"ayah\">﴿وَأَن لَّيْسَ لِلْإِنسَانِ إِلَّا مَا سَعَىٰ * وَأَنَّ سَعْيَهُ سَوْفَ يُرَىٰ﴾ [النجم: 39-40]<\/p><p class=\"\">الأهداف بلا سعي أمنيات، وقد جعل القرآن السعي ميزان الإنسان. فالفتى الذي يكتب أهدافه ويتابعها يومياً يعامل نفسه بجدية، ومن اتخذ الأمنيات بديلاً عن العمل لم يصل.<\/p><\/article><article class=\"pt\"><h4><span>خامساً<\/span>وضوح البوصلة عند الأنبياء<\/h4><p class=\"\">تروي كتب السيرة أن قريشاً عرضت على النبي ﷺ عن طريق عمه أبي طالب المال والملك والشرف ليترك دعوته، فكان ردّه ﷺ: «يَا عَمِّ، وَاللَّهِ لَوْ وَضَعُوا الشَّمْسَ فِي يَمِينِي، وَالْقَمَرَ فِي يَسَارِي عَلَى أَنْ أَتْرُكَ هَذَا الْأَمْرَ حَتَّى يُظْهِرَهُ اللَّهُ أَوْ أَهْلِكَ فِيهِ مَا تَرَكْتُهُ». ففي هذا الموقف وحدة الغاية ووضوح البوصلة التي لم تهزها أعظم المغريات.<\/p><\/article><article class=\"pt\"><h4><span>سادساً<\/span>هرم الغايات<\/h4><div class=\"tw\"><table><tr><th><b>المستوى<\/b><\/th><th><b>ما فيه<\/b><\/th><th><b>الإجراء<\/b><\/th><\/tr><tr><td><b>القمة: الغاية الكبرى<\/b><\/td><td>رضا الله والعبودية وعمارة الأرض بالخير<\/td><td>ثابتة لا تتغير<\/td><\/tr><tr><td><b>الوسط: الأهداف الاستراتيجية للعام<\/b><\/td><td>ثلاثة أهداف: إيماني وعقلي ومهاري<\/td><td>تُكتب وتُقاس وتُراجع<\/td><\/tr><tr><td><b>القاعدة: الأهداف الوسائلية<\/b><\/td><td>التفوق الدراسي، اللياقة، إتقان مهارة، النجاح المهني<\/td><td>تُوجَّه بالنية لتخدم القمة<\/td><\/tr><\/table><\/div><\/article><article class=\"pt\"><h4><span>سابعاً<\/span>فخ التقلب الأسبوعي<\/h4><p class=\"\">ملاحقة كل صيحة جديدة تجعل الفتى مستهلكاً سطحياً: أسبوع لمجال وأسبوع لآخر، وبعد ستة أشهر لا يحمل إتقاناً في شيء. والتميز يحتاج إلى التركيز وبتر الخيارات الفائضة. فلا بأس بفترة استكشاف قصيرة، ثم يختار مجالاً أساسياً ويعطيه عاماً كاملاً ليبني فيه عضلات الإتقان.<\/p><\/article>", "qa": "<div class=\"tw\"><table><tr><th><b>السؤال المتوقع<\/b><\/th><th><b>تفكيكه<\/b><\/th><\/tr><tr><td><b>هل يتعارض تحديد الغاية بالآخرة والعبودية مع الطموح للثراء وبناء المشاريع والشهرة؟<\/b><\/td><td>إطلاقاً. كان عثمان وعبد الرحمن بن عوف من كبار الأثرياء وسخّرا مالهما للتمكين والصدقة. الإسلام لا يحرم النجاح الدنيوي، بل يرفض أن تكون الدنيا هي الغاية النهائية، ويطلب أن تخدم الرسالة.<\/td><\/tr><tr><td><b>اهتماماتي كثيرة وأريد أن أكون مبرمجاً ورياضياً ومحامياً وطبيباً في آن واحد، فكيف أحسم؟<\/b><\/td><td>هذا «تشتت البدايات». الاستكشاف مطلوب لفترة وجيزة، لكن التميز يفرض التركيز وبتر التفرعات. اختر مجالاً أساسياً وركز عليه عاماً كاملاً.<\/td><\/tr><tr><td><b>كيف أتصرف إذا شعرت بالملل والفتور بعد أسابيع من كتابة أهدافي؟<\/b><\/td><td>الحماس الأولي يزول دائماً، فلا نعتمد عليه بل على نظام الانضباط اليومي والارتباط بالغاية الكبرى. ذكّر نفسك يومياً بالهدف، وجدّد العهد مع الله أسبوعياً.<\/td><\/tr><\/table><\/div>", "radar": "<p class=\"\"><b>مؤشرات الخطر:<\/b> تغيير الهدف كل بضعة أسابيع، والانبهار بكل نموذج جديد، وانفصال الأهداف الدنيوية عن أي إحساس بالغاية، أو حصر النجاح في المال والشهرة فقط.<\/p><p class=\"\"><b>بروتوكول التدخل:<\/b><\/p><p class=\"step\"><b>1. <\/b>اسأله بهدوء: ما الذي يعجبك فعلاً في هذا المجال؟ المال، أم الشهرة، أم الأثر؟<\/p><p class=\"step\"><b>2. <\/b>اقترح عليه تجميد التغيير مدة محددة والالتزام بمجال واحد.<\/p><p class=\"step\"><b>3. <\/b>اربط هدفه بنية نفع الأمة والتقرب إلى الله، فهذا يمنحه صبراً أطول.<\/p>", "actT": "«شجرة البوصلة الشخصية»  نشاط تخطيطي", "act": "<p class=\"step\"><b>1. الرسم:<\/b> يرسم المشرف على السبورة هرم الغايات وشجرة بجذور وأغصان ومقص.<\/p><p class=\"step\"><b>2. الجذور:<\/b> يكتب كل طالب بيان هويته: «أنا عبد مصلح ومستخلَف، غايتي مرضاة الله ونفع الأمة».<\/p><p class=\"step\"><b>3. الأغصان:<\/b> يكتب ثلاثة أهداف استراتيجية للعام: إيماني خلقي (مثل حفظ جزءين والمحافظة على الفجر)، وعقلي دراسي (معدل محدد وقراءة ستة كتب)، ومهاري بدني (إتقان مهارة تقنية وبرنامج رياضي).<\/p><p class=\"step\"><b>4. المقص:<\/b> يكتب ثلاثة لصوص وقت يلتزم بقصها هذا الأسبوع.<\/p><p class=\"step\"><b>5. دراسة حالة:<\/b> سهيل (17 سنة) شاهد في الأسبوع الأول مقطعاً عن الذكاء الاصطناعي فاشترى دورة، وفي الثاني مقطعاً لبطل رياضي فترك الدورة واشترك في نادٍ، وفي الثالث مقطعاً عن التجارة الرقمية فترك الرياضة. بعد ستة أشهر لم يتعلم برمجة ولم يبنِ لياقة ولم يربح شيئاً، وتراجع مستواه الدراسي. تحلل المجموعات: ما الخطأ؟ وكيف يصحح مساره؟<\/p><p class=\"step\"><b>6. الاعتراض:<\/b> أحد الطلاب يدافع عن حجة «الحياة تجارب فيجب تجربة كل شيء بلا قيود»، وتناقشه المجموعات.<\/p><div class=\"tw\"><table><tr><th colspan=\"2\"><b>بطاقة: شجرة البوصلة الشخصية<\/b><\/th><\/tr><tr><td><b>الجذور: غايتي الوجودية<\/b><\/td><td>............................<\/td><\/tr><tr><td><b>غصن 1: هدف إيماني خلقي<\/b><\/td><td>............................<\/td><\/tr><tr><td><b>غصن 2: هدف عقلي دراسي<\/b><\/td><td>............................<\/td><\/tr><tr><td><b>غصن 3: هدف مهاري بدني<\/b><\/td><td>............................<\/td><\/tr><tr><td><b>المقص: ثلاثة لصوص وقت سأقصها<\/b><\/td><td>1. ............ 2. ............ 3. ............<\/td><\/tr><\/table><\/div>", "week": "<p class=\"\"><b>تعليق الشجرة:<\/b> يعلق الطالب بطاقته في مكان يراه كل صباح.<\/p><p class=\"\"><b>قص لص واحد:<\/b> ينفذ فعلياً قص أحد لصوص الوقت الثلاثة طوال الأسبوع.<\/p><p class=\"\"><b>تجديد العهد:<\/b> يخصص دقائق في نهاية الأسبوع لمراجعة أهدافه ومناجاة ربه.<\/p><p class=\"\"><b>جسر إلى اللقاء الثاني عشر:<\/b> وإذا تحددت الأهداف فكيف نميز ما نبدأ به كل يوم بين عشرات المهام؟ هذا موضوع «مصفوفة المهام».<\/p>", "kq": "تحديد الغايات الكبرى وتجاوز التشتت", "brief": "<div class=\"plan\"><span>اقتراح لتوزيع الوقت (١٠–١٥ د)<\/span><b>افتتاح ٣<\/b><b>محاور ٥<\/b><b>حوار ٢<\/b><b>نشاط ٣<\/b><b>ختام ٢<\/b><\/div><section class=\"bs\"><h3>١ · الافتتاح: السفينة الفاخرة والمجهول<\/h3><p class=\"\">تخيل سفينة محيطية عملاقة تقدر بمليارات الدولارات، مزودة بأحدث محركات الملاحة والأنظمة الترفيهية ومحملة بآلاف الأطنان من الوقود والطعام. أبحر الربان بها في عرض المحيط، وبعد ثلاثة أيام صعد أحد المسافرين وسأله: «يا كابتن، السرعة مذهلة والمحركات جبارة، لكن إلى أي ميناء نتجه؟». فابتسم الربان بكل برود وقال: «في الحقيقة لا أدري! ليس لدينا خريطة ولا ميناء نرسو فيه. المهم أننا نتحرك بسرعة ونستمتع بالموسيقى!»<\/p><p class=\"\"><b>أسئلة الاستثارة:<\/b><\/p><p class=\"\">ما قيمة السرعة والمحركات الجبارة إذا لم تكن هناك وجهة؟<\/p><p class=\"\">كم شخصاً تعرفه يشبه هذه السفينة: نشيط جداً لكن لا يعرف إلى أين؟<\/p><p class=\"\">ما الميناء الذي ترسو عليه سفينتك أنت؟<\/p><\/section><section class=\"bs\"><h3>٢ · المحاور<\/h3><article class=\"pt\"><h4><span>١<\/span>الغاية العظمى تحكم الأهداف<\/h4><p class=\"ayah\">﴿وَمَا خَلَقْتُ الْجِنَّ وَالْإِنسَ إِلَّا لِيَعْبُدُونِ﴾ [الذاريات: 56]<\/p><p class=\"g\">كل هدف دنيوي (دراسة، رياضة، تقنية) يجب أن يدور في فلك العبودية.<\/p><details class=\"more\"><summary>للتوسع<\/summary><p class=\"\">الآية تحدد الغاية الكبرى للوجود، وكل هدف دنيوي يجب أن يدور في فلكها ولا يعارضها. ومن نسي هذا الأصل تاهت أهدافه وتناقضت: ﴿وَلَا تَكُونُوا كَالَّذِينَ نَسُوا اللَّهَ فَأَنسَاهُمْ أَنفُسَهُمْ﴾ [الحشر: 19]. فنسيان الغاية يقود إلى تيه الهوية والشتات النفسي.<\/p><\/details><\/article><article class=\"pt\"><h4><span>٢<\/span>وحدة الوجهة تمنح السكينة<\/h4><p class=\"had\">قال رسول الله ﷺ: «مَنْ كَانَتِ الآخِرَةُ هَمَّهُ جَعَلَ اللَّهُ غِنَاهُ فِي قَلْبِهِ وَجَمَعَ لَهُ شَمْلَهُ، وَأَتَتْهُ الدُّنْيَا وَهِيَ رَاغِمَةٌ، وَمَنْ كَانَتِ الدُّنْيَا هَمَّهُ جَعَلَ اللَّهُ فَقْرَهُ بَيْنَ عَيْنَيْهِ وَفَرَّقَ عَلَيْهِ شَمْلَهُ وَلَمْ يَأْتِهِ مِنَ الدُّنْيَا إِلَّا مَا قُدِّرَ لَهُ» رواه الترمذي وابن ماجه<\/p><p class=\"g\">شمله» (رواه الترمذي) تشتت الغايات يورث القلق والعجز.<\/p><details class=\"more\"><summary>للتوسع<\/summary><p class=\"\">وحدة الغاية توحد شتات العقل وتمنح الغنى القلبي، أما تفرق الغايات فيشتت الطاقات ويورث قلقاً دائماً. وقد أخذ النبي ﷺ بمنكب ابن عمر وقال له: «كُنْ فِي الدُّنْيَا كَأَنَّكَ غَرِيبٌ أَوْ عَابِرُ سَبِيلٍ» رواه البخاري، فعابر السبيل يركز على وجهته ولا تستهلكه ملهيات المحطات.<\/p><\/details><\/article><article class=\"pt\"><h4><span>٣<\/span>النية تحول الدنيا لعبادة<\/h4><p class=\"had\">قال رسول الله ﷺ: «إنَّما الأعمالُ بالنِّيَّاتِ، وإنَّما لِكُلِّ امْرِئٍ ما نَوَى» متفق عليه. فالمذاكرة والتمارين الرياضية وإتقان البرمجة تصير بالنية الصالحة أدوات لنصرة الدين وخدمة الأمة ونيل الأجر. ومن هنا لا يتعارض طموح الفتى بالتفوق مع عبوديته. وقد كان عثمان بن عفان وعبد الرحمن بن عوف رضي الله عنهما من كبار الأثرياء، وسخّرا مالهما لتمكين الدين والصدقة. فالإسلام لا يحرّم النجاح الدنيوي بل يرفض أن تكون الدنيا هي الغاية النهائية.<\/p><p class=\"g\">الطموح الدنيوي الناجح لخدمة الأمة هو عبادة بالنية الصالحة.<\/p><details class=\"more\"><summary>للتوسع<\/summary><\/details><\/article><article class=\"pt\"><h4><span>٤<\/span>السعي مقياس الإنسان<\/h4><p class=\"ayah\">﴿وَأَن لَّيْسَ لِلْإِنسَانِ إِلَّا مَا سَعَىٰ * وَأَنَّ سَعْيَهُ سَوْفَ يُرَىٰ﴾ [النجم: 39-40]<\/p><p class=\"g\">الأهداف بلا سعي وعمل يومي مركز هي مجرد أمنيات فارغة.<\/p><details class=\"more\"><summary>للتوسع<\/summary><p class=\"\">الأهداف بلا سعي أمنيات، وقد جعل القرآن السعي ميزان الإنسان. فالفتى الذي يكتب أهدافه ويتابعها يومياً يعامل نفسه بجدية، ومن اتخذ الأمنيات بديلاً عن العمل لم يصل.<\/p><\/details><\/article><\/section><section class=\"bs\"><h3>٣ · سؤال للحوار<\/h3><p class=\"big\">كيف يصير هدفك الدراسي عبادة؟<\/p><\/section><section class=\"bs\"><h3>٤ · نشاط تطبيقي<\/h3><p class=\"big\">حول غاية كبرى إلى هدف ذكي :محدد، قابل للقياس، له موعد.<\/p><\/section><section class=\"bs\"><h3>أسئلة قد تُطرح<\/h3><details class=\"more\"><summary><b>هل يتعارض تحديد الغاية بالآخرة والعبودية مع الطموح للثراء وبناء المشاريع والشهرة؟<\/b><\/summary><p>إطلاقاً. كان عثمان وعبد الرحمن بن عوف من كبار الأثرياء وسخّرا مالهما للتمكين والصدقة. الإسلام لا يحرم النجاح الدنيوي، بل يرفض أن تكون الدنيا هي الغاية النهائية، ويطلب أن تخدم الرسالة.<\/p><\/details><details class=\"more\"><summary><b>اهتماماتي كثيرة وأريد أن أكون مبرمجاً ورياضياً ومحامياً وطبيباً في آن واحد، فكيف أحسم؟<\/b><\/summary><p>هذا «تشتت البدايات». الاستكشاف مطلوب لفترة وجيزة، لكن التميز يفرض التركيز وبتر التفرعات. اختر مجالاً أساسياً وركز عليه عاماً كاملاً.<\/p><\/details><\/section><section class=\"bs warn\"><h3>رادار الحماية<\/h3><p><b>مؤشرات الخطر:<\/b> تغيير الهدف كل بضعة أسابيع، والانبهار بكل نموذج جديد، وانفصال الأهداف الدنيوية عن أي إحساس بالغاية، أو حصر النجاح في المال والشهرة فقط.<\/p><small>البروتوكول كاملاً في تبويب «الكامل».<\/small><\/section><section class=\"bs\"><h3>٥ · رحلة الأسبوع<\/h3><p class=\"\"><b>تعليق الشجرة:<\/b> يعلق الطالب بطاقته في مكان يراه كل صباح.<\/p><p class=\"\"><b>قص لص واحد:<\/b> ينفذ فعلياً قص أحد لصوص الوقت الثلاثة طوال الأسبوع.<\/p><p class=\"\"><b>تجديد العهد:<\/b> يخصص دقائق في نهاية الأسبوع لمراجعة أهدافه ومناجاة ربه.<\/p><p class=\"\"><b>جسر إلى اللقاء الثاني عشر:<\/b> وإذا تحددت الأهداف فكيف نميز ما نبدأ به كل يوم بين عشرات المهام؟ هذا موضوع «مصفوفة المهام».<\/p><\/section>", "slides": ["<div class=\"cn\">11<\/div><h2>بوصلة الأهداف<\/h2><p class=\"q\">كيف نحول الغايات الكبرى إلى أهداف واقعية؟<\/p>", "<small>إضاءة استهلالية<\/small><h2>السفينة الفاخرة والمجهول<\/h2><ul><li class=\"frag\">ما قيمة السرعة والمحركات الجبارة إذا لم تكن هناك وجهة؟<\/li><li class=\"frag\">كم شخصاً تعرفه يشبه هذه السفينة: نشيط جداً لكن لا يعرف إلى أين؟<\/li><li class=\"frag\">ما الميناء الذي ترسو عليه سفينتك أنت؟<\/li><\/ul>", "<small>1<\/small><h2>الغاية العظمى تحكم الأهداف<\/h2><p class=\"ayah\">﴿وَمَا خَلَقْتُ الْجِنَّ وَالْإِنسَ إِلَّا لِيَعْبُدُونِ﴾ [الذاريات: 56]<\/p><p class=\"g frag\">كل هدف دنيوي (دراسة، رياضة، تقنية) يجب أن يدور في فلك العبودية.<\/p>", "<small>2<\/small><h2>وحدة الوجهة تمنح السكينة<\/h2><p class=\"had lg\">قال رسول الله ﷺ: «مَنْ كَانَتِ الآخِرَةُ هَمَّهُ جَعَلَ اللَّهُ غِنَاهُ فِي قَلْبِهِ وَجَمَعَ لَهُ شَمْلَهُ، وَأَتَتْهُ الدُّنْيَا وَهِيَ رَاغِمَةٌ، وَمَنْ كَانَتِ الدُّنْيَا هَمَّهُ جَعَلَ اللَّهُ فَقْرَهُ بَيْنَ عَيْنَيْهِ وَفَرَّقَ عَلَيْهِ شَمْلَهُ وَلَمْ يَأْتِهِ مِنَ الدُّنْيَا إِلَّا مَا قُدِّرَ لَهُ» رواه الترمذي وابن ماجه<\/p><p class=\"g frag\">شمله» (رواه الترمذي) تشتت الغايات يورث القلق والعجز.<\/p>", "<small>3<\/small><h2>النية تحول الدنيا لعبادة<\/h2><p class=\"had lg\">قال رسول الله ﷺ: «إنَّما الأعمالُ بالنِّيَّاتِ، وإنَّما لِكُلِّ امْرِئٍ ما نَوَى» متفق عليه. فالمذاكرة والتمارين الرياضية وإتقان البرمجة تصير بالنية الصالحة أدوات لنصرة الدين وخدمة الأمة ونيل الأجر. ومن هنا لا يتعارض طموح الفتى بالتفوق مع عبوديته. وقد كان عثمان بن عفان وعبد الرحمن بن عوف رضي الله عنهما من كبار الأثرياء، وسخّرا مالهما لتمكين الدين والصدقة. فالإسلام لا يحرّم النجاح الدنيوي بل يرفض أن تكون الدنيا هي الغاية النهائية.<\/p><p class=\"g frag\">الطموح الدنيوي الناجح لخدمة الأمة هو عبادة بالنية الصالحة.<\/p>", "<small>4<\/small><h2>السعي مقياس الإنسان<\/h2><p class=\"ayah\">﴿وَأَن لَّيْسَ لِلْإِنسَانِ إِلَّا مَا سَعَىٰ * وَأَنَّ سَعْيَهُ سَوْفَ يُرَىٰ﴾ [النجم: 39-40]<\/p><p class=\"g frag\">الأهداف بلا سعي وعمل يومي مركز هي مجرد أمنيات فارغة.<\/p>", "<small>سؤال للحوار<\/small><h2 class=\"big\">كيف يصير هدفك الدراسي عبادة؟<\/h2>", "<small>نشاط تطبيقي<\/small><h2 class=\"big\">حول غاية كبرى إلى هدف ذكي :محدد، قابل للقياس، له موعد.<\/h2>", "<small>سؤال وبرهان<\/small><details class=\"frag\"><summary><b>هل يتعارض تحديد الغاية بالآخرة والعبودية مع الطموح للثراء وبناء المشاريع والشهرة؟<\/b><\/summary><p>إطلاقاً. كان عثمان وعبد الرحمن بن عوف من كبار الأثرياء وسخّرا مالهما للتمكين والصدقة. الإسلام لا يحرم النجاح الدنيوي، بل يرفض أن تكون الدنيا هي الغاية النهائية، ويطلب أن تخدم الرسالة.<\/p><\/details><details class=\"frag\"><summary><b>اهتماماتي كثيرة وأريد أن أكون مبرمجاً ورياضياً ومحامياً وطبيباً في آن واحد، فكيف أحسم؟<\/b><\/summary><p>هذا «تشتت البدايات». الاستكشاف مطلوب لفترة وجيزة، لكن التميز يفرض التركيز وبتر التفرعات. اختر مجالاً أساسياً وركز عليه عاماً كاملاً.<\/p><\/details><details class=\"frag\"><summary><b>كيف أتصرف إذا شعرت بالملل والفتور بعد أسابيع من كتابة أهدافي؟<\/b><\/summary><p>الحماس الأولي يزول دائماً، فلا نعتمد عليه بل على نظام الانضباط اليومي والارتباط بالغاية الكبرى. ذكّر نفسك يومياً بالهدف، وجدّد العهد مع الله أسبوعياً.<\/p><\/details>", "<small>ميدان التطبيق<\/small><h2>«شجرة البوصلة الشخصية»  نشاط تخطيطي<\/h2><ol><li class=\"frag\">1. الرسم: يرسم المشرف على السبورة هرم الغايات وشجرة بجذور وأغصان ومقص.<\/li><li class=\"frag\">2. الجذور: يكتب كل طالب بيان هويته: «أنا عبد مصلح ومستخلَف، غايتي مرضاة الله ونفع الأمة».<\/li><li class=\"frag\">3. الأغصان: يكتب ثلاثة أهداف استراتيجية للعام: إيماني خلقي (مثل حفظ جزءين والمحافظة على الفجر)، وعقلي دراسي (معدل محدد وقراءة ستة كتب)، ومهاري بدني…<\/li><li class=\"frag\">4. المقص: يكتب ثلاثة لصوص وقت يلتزم بقصها هذا الأسبوع.<\/li><li class=\"frag\">5. دراسة حالة: سهيل (17 سنة) شاهد في الأسبوع الأول مقطعاً عن الذكاء الاصطناعي فاشترى دورة، وفي الثاني مقطعاً لبطل رياضي فترك الدورة واشترك في نادٍ،…<\/li><li class=\"frag\">6. الاعتراض: أحد الطلاب يدافع عن حجة «الحياة تجارب فيجب تجربة كل شيء بلا قيود»، وتناقشه المجموعات.<\/li><\/ol>", "<small>رحلة الأسبوع<\/small><ul><li class=\"frag\"><b>تعليق الشجرة:<\/b> يعلق الطالب بطاقته في مكان يراه كل صباح.<\/li><li class=\"frag\"><b>قص لص واحد:<\/b> ينفذ فعلياً قص أحد لصوص الوقت الثلاثة طوال الأسبوع.<\/li><li class=\"frag\"><b>تجديد العهد:<\/b> يخصص دقائق في نهاية الأسبوع لمراجعة أهدافه ومناجاة ربه.<\/li><li class=\"frag\"><b>جسر إلى اللقاء الثاني عشر:<\/b> وإذا تحددت الأهداف فكيف نميز ما نبدأ به كل يوم بين عشرات المهام؟ هذا موضوع «مصفوفة المهام».<\/li><\/ul>"], "n": 11, "u": 2, "title": "بوصلة الأهداف", "q": "كيف نحول الغايات الكبرى إلى أهداف واقعية؟", "dqq": "كيف يصير هدفك الدراسي عبادة؟", "pact": "حول غاية كبرى إلى هدف ذكي :محدد، قابل للقياس، له موعد."}, {"summary": "<p class=\"\">يعيش كثير من الفتيان في يوم مقسوم بين ردّ الفعل على الإشعارات وإطفاء حرائق اللحظة الأخيرة، ثم يخرجون منهكين لم يفعلوا شيئاً مما يهمهم. يتعلم الفتى في هذا اللقاء أن يفرّق بين ما هو عاجل وما هو مهم، وأن يخصص أفضل طاقته للمهم غير العاجل، وأن يكتب جدول أسبوعه مسبقاً فيفرغ عقله من القلق ويضمن وقتاً للراحة بضمير مرتاح.<\/p><p class=\"\">يصنف مهامه في أربعة مربعات ويتخذ الإجراء المناسب لكل مربع.<\/p><p class=\"\">يدرك أن سر التفوق في المهم غير العاجل.<\/p><p class=\"\">يكتب جدولاً أسبوعياً بمواعيد وأماكن قاطعة ويترك وقتاً مرناً للطوارئ.<\/p><div class=\"tw\"><table><tr><th><b>المهارة<\/b><\/th><th><b>معناها العملي<\/b><\/th><\/tr><tr><td><b>ترتيب الأولويات<\/b><\/td><td>يميز بين المهم والعاجل ويقدم المهم<\/td><\/tr><tr><td><b>الجدولة الأسبوعية<\/b><\/td><td>يحوّل أهدافه إلى مواعيد محددة في أسبوعه<\/td><\/tr><tr><td><b>قول «لا» الواعي<\/b><\/td><td>يرفض أو يفوّض ما لا يخدم أولوياته بلباقة<\/td><\/tr><\/table><\/div>", "kit": "<p class=\"\"><b>ما يعيشه الفتى:<\/b> يعتاد كثير من الفتيان أن ينجزوا تحت ضغط اللحظة الأخيرة، فيظنون أن هذا أسلوبهم الطبيعي. وإذا قيل لهم «خطط» شعروا أن في ذلك تقييداً لحريتهم.<\/p><p class=\"\"><b>ابدأ بقصة لا بنظرية:<\/b> قصة الاختبار المفاجئ وسهر الليلتين تقنع أكثر من شرح المصفوفة.<\/p><p class=\"\"><b>لا تجعل الجدول مثالياً:<\/b> علّمهم أن يتركوا وقتاً مرناً لأنفسهم ولطلبات الأهل، فالجدول المحشو ينهار أول يوم.<\/p><p class=\"\"><b>راعِ بر الوالدين:<\/b> لا تعلّمهم أن يتجاهلوا طلبات الأهل بحجة المذاكرة. البر من أعلى الأولويات.<\/p><p class=\"\"><b>خذ جدولك أنت مثالاً:<\/b> اعرض لهم جدولاً حقيقياً لأسبوعك بما فيه من ترفيه وراحة.<\/p>", "hookT": "رجل الإطفاء والرسام", "hook": "<p class=\"\"><b>طارق (17 سنة)<\/b> يقضي يومه كرجل إطفاء: يقفز مذعوراً من إشعار هاتف، إلى مذاكرة امتحان الغد في اللحظة الأخيرة، إلى طلبات مفاجئة. وفي نهاية اليوم يخر مجهداً محبطاً: لم يحفظ قرآناً ولم يقرأ كتاباً ولم يمارس رياضة. أما <b>سامي (17 سنة)<\/b> فيخصص مساء كل جمعة خمس عشرة دقيقة لكتابة جدول أسبوعه، ويحدد أوقات المذاكرة قبل الامتحانات بأسابيع، وأوقات صلاته ورياضته. وعندما تفاجئه المشتتات يقول بثقة وهدوء: «آسف، هذا وقت المذاكرة، سأكون متاحاً بعده».<\/p><p class=\"\"><b>أسئلة الاستثارة:<\/b><\/p><p class=\"\">من منهما أقرب إلى بلوغ أهدافه في نهاية الشهر؟<\/p><p class=\"\">هل يمكن أن نكون مشغولين طوال اليوم ولا ننجز شيئاً مهماً؟<\/p>", "pts": "<article class=\"pt\"><h4><span>أولاً<\/span>لا فراغ مهدور في حياة المسلم<\/h4><p class=\"ayah\">﴿فَإِذَا فَرَغْتَ فَانصَبْ * وَإِلَىٰ رَبِّكَ فَارْغَب﴾ [الشرح: 7-8]<\/p><p class=\"\">توجيه قرآني إلى الانتقال المنظم من عمل إلى عمل، ومن إنجاز إلى عبادة، فلا يترك المسلم وقته نهباً للصدفة. والمسابقة إلى الخير تقتضي اختيار الأولى فالأولى: ﴿فَاسْتَبِقُوا الْخَيْرَاتِ﴾ [البقرة: 148].<\/p><\/article><article class=\"pt\"><h4><span>ثانياً<\/span>العواجل لا تلهي عن المهم الأكبر<\/h4><p class=\"ayah\">﴿يَا أَيُّهَا الَّذِينَ آمَنُوا لَا تُلْهِكُمْ أَمْوَالُكُمْ وَلَا أَوْلَادُكُمْ عَن ذِكْرِ اللَّهِ ۚ وَمَن يَفْعَلْ ذَٰلِكَ فَأُولَٰئِكَ هُمُ الْخَاسِرُونَ﴾ [المنافقون: 9]<\/p><p class=\"\">تحذير من أن تطغى الشواغل العارضة على المهم الأكبر وهو حق الله وبناء الروح. فالأمور العاجلة تصرخ باستمرار، أما المهم فيحتاج منك أن تبحث عنه وتحجز له وقته.<\/p><\/article><article class=\"pt\"><h4><span>ثالثاً<\/span>الحرص على النافع<\/h4><p class=\"had\">قال رسول الله ﷺ: «الْمُؤْمِنُ الْقَوِيُّ خَيْرٌ وَأَحَبُّ إِلَى اللَّهِ مِنَ الْمُؤْمِنِ الضَّعِيفِ، وَفِي كُلٍّ خَيْرٌ، احْرِصْ عَلَى مَا يَنْفَعُكَ، وَاسْتَعِنْ بِاللَّهِ وَلاَ تَعْجَزْ» رواه مسلم. فالحرص يجب أن يتوجه إلى ما يمتد نفعه، مع استباق العجز بتنظيم الوقت والتوكل على الله.<\/p><\/article><article class=\"pt\"><h4><span>رابعاً<\/span>ترتيب الأعمال في الميزان النبوي<\/h4><p class=\"\">سأل ابن مسعود رضي الله عنه النبي ﷺ: أَيُّ العَمَلِ أَحَبُّ إِلَى اللهِ؟ قَالَ: «الصَّلاَةُ عَلَى وَقْتِهَا». قَالَ: ثُمَّ أَيٌّ؟ قَالَ: «بِرُّ الوَالِدَيْنِ». قَالَ: ثُمَّ أَيٌّ؟ قَالَ: «الجِهَادُ فِي سَبِيلِ اللهِ» متفق عليه. وفي الحديث ترتيب للأعمال بحسب محبة الله لها، فالصلاة في وقتها أولاً، ثم بر الوالدين. فمن أراد أن يرتب جدوله فليجعل الفرائض في وقتها أول الجدول ثم يبني عليها بقية يومه.<\/p><\/article><article class=\"pt\"><h4><span>خامساً<\/span>أربعة مربعات للمهام<\/h4><div class=\"tw\"><table><tr><th><\/th><th><b>عاجل<\/b><\/th><th><b>غير عاجل<\/b><\/th><\/tr><tr><td><b>مهم<\/b><\/td><td><b>المربع الأول (الطوارئ):<\/b> اختبار الغد المفاجئ، أزمة صحية. الإجراء: أدِّه فوراً.<\/td><td><b>المربع الثاني (البناء):<\/b> حفظ القرآن، المذاكرة التراكمية الهادئة، الرياضة. الإجراء: خطّط له وجدوله.<\/td><\/tr><tr><td><b>غير مهم<\/b><\/td><td><b>المربع الثالث (الخداع):<\/b> إشعارات تافهة، مقاطعات وطلبات عارضة. الإجراء: فوّضه أو ارفضه.<\/td><td><b>المربع الرابع (الضياع):<\/b> تصفح المقاطع والألعاب، مجالس اللغو. الإجراء: ابتره وتخلص منه.<\/td><\/tr><\/table><\/div><\/article><article class=\"pt\"><h4><span>سادساً<\/span>سر التفوق في المربع الثاني<\/h4><p class=\"\">الناجحون يستثمرون أكبر نصيب من طاقتهم في المهم غير العاجل، لأن العمل فيه يمنع انفجار الأزمات في المربع الأول ويصنع بناءً متيناً بلا توتر. فمن يذاكر كل يوم بهدوء لا يسهر ليلة الامتحان، ومن يحفظ ثلاثة أسطر يومياً لا يحتاج إلى مراجعة مرعبة.<\/p><\/article><article class=\"pt\"><h4><span>سابعاً<\/span>أوقات مرنة لبر الوالدين<\/h4><p class=\"\">لا يعني التخطيط الصارم إهمال الأهل. بر الوالدين عبادة مقدمة، ولذلك نصمم الجدول بأوقات مرنة تتسع للطوارئ والبر. وإذا أطلعت أهلك مسبقاً على ساعات مذاكرتك المهمة عاونوك واحترموا وقتك. وقال ﷺ: «رِضَا الرَّبِّ فِي رِضَا الوَالِدِ، وَسَخَطُ الرَّبِّ فِي سَخَطِ الوَالِدِ» رواه الترمذي.<\/p><\/article>", "qa": "<div class=\"tw\"><table><tr><th><b>السؤال المتوقع<\/b><\/th><th><b>تفكيكه<\/b><\/th><\/tr><tr><td><b>لا أحفظ ولا أستوعب إلا ليلة الامتحان تحت ضغط الخوف، فهل هذا خطأ؟<\/b><\/td><td>هذا وهم ناتج عن إفراز هرمونات التوتر. الحفظ السريع تحت الهلع يتبخر فور الخروج من القاعة. أما التعلم الحقيقي الذي يبني ذكاءك ومستقبلك فهو التراكم الهادئ في المربع الثاني.<\/td><\/tr><tr><td><b>كيف أتصرف مع طلبات الأهل المفاجئة التي تقطع جدول المذاكرة؟<\/b><\/td><td>بر الوالدين عبادة مقدمة، فصمم جدولك بوقت مرن يتسع للطوارئ، وأخبر أهلك مسبقاً بساعات المذاكرة المهمة.<\/td><\/tr><tr><td><b>هل التخطيط الأسبوعي يقتل العفوية ويجعل اليوم رتيباً؟<\/b><\/td><td>العكس. التخطيط المسبق يفرغ عقلك من القلق ويضمن لك وقتاً حقيقياً للراحة واللعب وأنت مرتاح الضمير.<\/td><\/tr><\/table><\/div>", "radar": "<p class=\"\"><b>مؤشرات الخطر:<\/b> دوام الاستجابة للمقاطعات، وسهر ليلة الامتحان بمنبهات الطاقة، وتأجيل المذاكرة اليومية، وتصرف بعصبية عند أي تغيير في الجدول، أو الغرق في المربعين الثالث والرابع.<\/p><p class=\"\"><b>بروتوكول التدخل:<\/b><\/p><p class=\"step\"><b>1. <\/b>اجلس معه وارسم له أسبوعه الفعلي في المصفوفة ليرى بنفسه أين يضيع وقته.<\/p><p class=\"step\"><b>2. <\/b>اختر معه مهمة واحدة من المربع الثاني وحدد لها موعداً قاطعاً.<\/p><p class=\"step\"><b>3. <\/b>راجع معه نتيجة هذا الموعد بعد أسبوع واحتفِ بأي التزام.<\/p>", "actT": "«مختبر مصفوفة المهام وتخطيط الأسبوع»  نشاط ذهني وتخطيطي", "act": "<p class=\"step\"><b>1. الجرد:<\/b> يسجل كل فتى عشرة أنشطة يقوم بها في أسبوعه، ثم يصنفها داخل المربعات الأربعة.<\/p><p class=\"step\"><b>2. الاستخراج:<\/b> يختار ثلاث مهام أساسية من المربع الثاني (مذاكرة تراكمية، ورد قرآني، رياضة).<\/p><p class=\"step\"><b>3. الجدولة:<\/b> يضع هذه المهام في جدول الأسبوع بمواعيد وأماكن محددة وقاطعة.<\/p><p class=\"step\"><b>4. البتر:<\/b> يحدد مهمتين من المربعين الثالث والرابع ليقلصهما أو يحذفهما نهائياً.<\/p><p class=\"step\"><b>5. دراسة حالة:<\/b> فراس (16 سنة) يقضي أسبوعه بين لعب الهاتف لساعات، والخروج مع رفاقه كلما اتصلوا به، وإهمال المذاكرة. وقبل الاختبارات بأيام تراكمت عليه أربعة مقررات، فسهر ليلتين على منبهات الطاقة، ودخل الاختبار مشوش الذهن فحصل على درجات متدنية. تحلل المجموعات: أين ضاع المربع الثاني؟ وما الجدول البديل؟<\/p><p class=\"step\"><b>6. الاعتراض:<\/b> أحد الطلاب يدافع عن فكرة «الاستجابة لكل مستجد دون جدول»، وتناقشه المجموعات.<\/p><div class=\"tw\"><table><tr><th colspan=\"2\"><b>بطاقة: مصفوفة أسبوعي<\/b><\/th><\/tr><tr><td><b>ثلاث مهام من المربع الثاني<\/b><\/td><td>1. ............ 2. ............ 3. ............<\/td><\/tr><tr><td><b>موعد ومكان كل مهمة<\/b><\/td><td>............................<\/td><\/tr><tr><td><b>مهمة من المربع الثالث سأفوّضها أو أرفضها<\/b><\/td><td>............................<\/td><\/tr><tr><td><b>مهمة من المربع الرابع سأبترها<\/b><\/td><td>............................<\/td><\/tr><tr><td><b>وقت مرن للأهل والطوارئ<\/b><\/td><td>............................<\/td><\/tr><\/table><\/div>", "week": "<p class=\"\"><b>جلسة الجمعة:<\/b> يخصص الطالب خمس عشرة دقيقة قبل بداية الأسبوع لكتابة جدوله.<\/p><p class=\"\"><b>تقديم المربع الثاني:<\/b> ينفذ مهمته الأهم من هذا المربع قبل أي ترفيه كل يوم.<\/p><p class=\"\"><b>بتر مهمة:<\/b> يحذف مهمة واحدة من المربع الرابع طوال الأسبوع ويدوّن أثر ذلك.<\/p><p class=\"\"><b>جسر إلى اللقاء الثالث عشر:<\/b> وبين الأولويات تواجه الفتى مواقف يتعارض فيها الصواب مع إرضاء الأصدقاء. وهذا موضوع «صناعة القرار الأخلاقي».<\/p>", "kq": "التمييز بين العاجل والمهم وتخطيط الأسبوع", "brief": "<div class=\"plan\"><span>اقتراح لتوزيع الوقت (١٠–١٥ د)<\/span><b>افتتاح ٣<\/b><b>محاور ٥<\/b><b>حوار ٢<\/b><b>نشاط ٣<\/b><b>ختام ٢<\/b><\/div><section class=\"bs\"><h3>١ · الافتتاح: رجل الإطفاء والرسام<\/h3><p class=\"\"><b>طارق (17 سنة)<\/b> يقضي يومه كرجل إطفاء: يقفز مذعوراً من إشعار هاتف، إلى مذاكرة امتحان الغد في اللحظة الأخيرة، إلى طلبات مفاجئة. وفي نهاية اليوم يخر مجهداً محبطاً: لم يحفظ قرآناً ولم يقرأ كتاباً ولم يمارس رياضة. أما <b>سامي (17 سنة)<\/b> فيخصص مساء كل جمعة خمس عشرة دقيقة لكتابة جدول أسبوعه، ويحدد أوقات المذاكرة قبل الامتحانات بأسابيع، وأوقات صلاته ورياضته. وعندما تفاجئه المشتتات يقول بثقة وهدوء: «آسف، هذا وقت المذاكرة، سأكون متاحاً بعده».<\/p><p class=\"\"><b>أسئلة الاستثارة:<\/b><\/p><p class=\"\">من منهما أقرب إلى بلوغ أهدافه في نهاية الشهر؟<\/p><p class=\"\">هل يمكن أن نكون مشغولين طوال اليوم ولا ننجز شيئاً مهماً؟<\/p><\/section><section class=\"bs\"><h3>٢ · المحاور<\/h3><article class=\"pt\"><h4><span>١<\/span>العواجل لا تلهي عن المهم<\/h4><p class=\"ayah\">﴿يَا أَيُّهَا الَّذِينَ آمَنُوا لَا تُلْهِكُمْ أَمْوَالُكُمْ وَلَا أَوْلَادُكُمْ عَن ذِكْرِ اللَّهِ ۚ وَمَن يَفْعَلْ ذَٰلِكَ فَأُولَٰئِكَ هُمُ الْخَاسِرُونَ﴾ [المنافقون: 9]<\/p><p class=\"g\">ذكر لاله [ ﴾... المنافقون]9 : الشواغل العارضة تسرق الوقت المخصص للبناء.<\/p><details class=\"more\"><summary>للتوسع<\/summary><p class=\"\">تحذير من أن تطغى الشواغل العارضة على المهم الأكبر وهو حق الله وبناء الروح. فالأمور العاجلة تصرخ باستمرار، أما المهم فيحتاج منك أن تبحث عنه وتحجز له وقته.<\/p><\/details><\/article><article class=\"pt\"><h4><span>٢<\/span>ترتيب الأعمال في الميزان النبوي<\/h4><p class=\"g\">سئل ﷺ أي العم لأ حب إلى الله؟ ق لا « :الص لا ةع لى و قته ا» ثم<\/p><details class=\"more\"><summary>للتوسع<\/summary><p class=\"\">سأل ابن مسعود رضي الله عنه النبي ﷺ: أَيُّ العَمَلِ أَحَبُّ إِلَى اللهِ؟ قَالَ: «الصَّلاَةُ عَلَى وَقْتِهَا». قَالَ: ثُمَّ أَيٌّ؟ قَالَ: «بِرُّ الوَالِدَيْنِ». قَالَ: ثُمَّ أَيٌّ؟ قَالَ: «الجِهَادُ فِي سَبِيلِ اللهِ» متفق عليه. وفي الحديث ترتيب للأعمال بحسب محبة الله لها، فالصلاة في وقتها أولاً، ثم بر الوالدين. فمن أراد أن يرتب جدوله فليجعل الفرائض في وقتها أول الجدول ثم يبني عليها بقية يومه.<\/p><\/details><\/article><article class=\"pt\"><h4><span>٣<\/span>الحرص على النافع<\/h4><p class=\"had\">قال رسول الله ﷺ: «الْمُؤْمِنُ الْقَوِيُّ خَيْرٌ وَأَحَبُّ إِلَى اللَّهِ مِنَ الْمُؤْمِنِ الضَّعِيفِ، وَفِي كُلٍّ خَيْرٌ، احْرِصْ عَلَى مَا يَنْفَعُكَ، وَاسْتَعِنْ بِاللَّهِ وَلاَ تَعْجَزْ» رواه مسلم. فالحرص يجب أن يتوجه إلى ما يمتد نفعه، مع استباق العجز بتنظيم الوقت والتوكل على الله.<\/p><p class=\"g\">مسلم) الاستباق يتطلب التخطيط وتخصيص الطاقة للمهم غير العاجل.<\/p><details class=\"more\"><summary>للتوسع<\/summary><\/details><\/article><article class=\"pt\"><h4><span>٤<\/span>التخطيط المسبق<\/h4><p class=\"g\">كتابة مهام الأسبوع مسبقا تفرغ العقل من القلق وتضمن ترك مساحة مرنة للطوارئ وحقوق الأهل.<\/p><details class=\"more\"><summary>للتوسع<\/summary><p class=\"\">الناجحون يستثمرون أكبر نصيب من طاقتهم في المهم غير العاجل، لأن العمل فيه يمنع انفجار الأزمات في المربع الأول ويصنع بناءً متيناً بلا توتر. فمن يذاكر كل يوم بهدوء لا يسهر ليلة الامتحان، ومن يحفظ ثلاثة أسطر يومياً لا يحتاج إلى مراجعة مرعبة.<\/p><\/details><\/article><\/section><section class=\"bs\"><h3>٣ · سؤال للحوار<\/h3><p class=\"big\">ما الفرق بين العاجل والمهم في يومك؟<\/p><\/section><section class=\"bs\"><h3>٤ · نشاط تطبيقي<\/h3><p class=\"big\">وزع مهام أسبوعك على مصفوفة الأرباع الأربعة.<\/p><\/section><section class=\"bs\"><h3>أسئلة قد تُطرح<\/h3><details class=\"more\"><summary><b>لا أحفظ ولا أستوعب إلا ليلة الامتحان تحت ضغط الخوف، فهل هذا خطأ؟<\/b><\/summary><p>هذا وهم ناتج عن إفراز هرمونات التوتر. الحفظ السريع تحت الهلع يتبخر فور الخروج من القاعة. أما التعلم الحقيقي الذي يبني ذكاءك ومستقبلك فهو التراكم الهادئ في المربع الثاني.<\/p><\/details><details class=\"more\"><summary><b>كيف أتصرف مع طلبات الأهل المفاجئة التي تقطع جدول المذاكرة؟<\/b><\/summary><p>بر الوالدين عبادة مقدمة، فصمم جدولك بوقت مرن يتسع للطوارئ، وأخبر أهلك مسبقاً بساعات المذاكرة المهمة.<\/p><\/details><\/section><section class=\"bs warn\"><h3>رادار الحماية<\/h3><p><b>مؤشرات الخطر:<\/b> دوام الاستجابة للمقاطعات، وسهر ليلة الامتحان بمنبهات الطاقة، وتأجيل المذاكرة اليومية، وتصرف بعصبية عند أي تغيير في الجدول، أو الغرق في المربعين الثالث والرابع.<\/p><small>البروتوكول كاملاً في تبويب «الكامل».<\/small><\/section><section class=\"bs\"><h3>٥ · رحلة الأسبوع<\/h3><p class=\"\"><b>جلسة الجمعة:<\/b> يخصص الطالب خمس عشرة دقيقة قبل بداية الأسبوع لكتابة جدوله.<\/p><p class=\"\"><b>تقديم المربع الثاني:<\/b> ينفذ مهمته الأهم من هذا المربع قبل أي ترفيه كل يوم.<\/p><p class=\"\"><b>بتر مهمة:<\/b> يحذف مهمة واحدة من المربع الرابع طوال الأسبوع ويدوّن أثر ذلك.<\/p><p class=\"\"><b>جسر إلى اللقاء الثالث عشر:<\/b> وبين الأولويات تواجه الفتى مواقف يتعارض فيها الصواب مع إرضاء الأصدقاء. وهذا موضوع «صناعة القرار الأخلاقي».<\/p><\/section>", "slides": ["<div class=\"cn\">12<\/div><h2>مصفوفة المهام<\/h2><p class=\"q\">كيف نميز بين العاجل والمهم في يومنا؟<\/p>", "<small>إضاءة استهلالية<\/small><h2>رجل الإطفاء والرسام<\/h2><ul><li class=\"frag\">من منهما أقرب إلى بلوغ أهدافه في نهاية الشهر؟<\/li><li class=\"frag\">هل يمكن أن نكون مشغولين طوال اليوم ولا ننجز شيئاً مهماً؟<\/li><\/ul>", "<small>1<\/small><h2>العواجل لا تلهي عن المهم<\/h2><p class=\"ayah lg\">﴿يَا أَيُّهَا الَّذِينَ آمَنُوا لَا تُلْهِكُمْ أَمْوَالُكُمْ وَلَا أَوْلَادُكُمْ عَن ذِكْرِ اللَّهِ ۚ وَمَن يَفْعَلْ ذَٰلِكَ فَأُولَٰئِكَ هُمُ الْخَاسِرُونَ﴾ [المنافقون: 9]<\/p><p class=\"g frag\">ذكر لاله [ ﴾... المنافقون]9 : الشواغل العارضة تسرق الوقت المخصص للبناء.<\/p>", "<small>2<\/small><h2>ترتيب الأعمال في الميزان النبوي<\/h2><p class=\"g frag\">سئل ﷺ أي العم لأ حب إلى الله؟ ق لا « :الص لا ةع لى و قته ا» ثم<\/p>", "<small>3<\/small><h2>الحرص على النافع<\/h2><p class=\"had lg\">قال رسول الله ﷺ: «الْمُؤْمِنُ الْقَوِيُّ خَيْرٌ وَأَحَبُّ إِلَى اللَّهِ مِنَ الْمُؤْمِنِ الضَّعِيفِ، وَفِي كُلٍّ خَيْرٌ، احْرِصْ عَلَى مَا يَنْفَعُكَ، وَاسْتَعِنْ بِاللَّهِ وَلاَ تَعْجَزْ» رواه مسلم. فالحرص يجب أن يتوجه إلى ما يمتد نفعه، مع استباق العجز بتنظيم الوقت والتوكل على الله.<\/p><p class=\"g frag\">مسلم) الاستباق يتطلب التخطيط وتخصيص الطاقة للمهم غير العاجل.<\/p>", "<small>4<\/small><h2>التخطيط المسبق<\/h2><p class=\"g frag\">كتابة مهام الأسبوع مسبقا تفرغ العقل من القلق وتضمن ترك مساحة مرنة للطوارئ وحقوق الأهل.<\/p>", "<small>سؤال للحوار<\/small><h2 class=\"big\">ما الفرق بين العاجل والمهم في يومك؟<\/h2>", "<small>نشاط تطبيقي<\/small><h2 class=\"big\">وزع مهام أسبوعك على مصفوفة الأرباع الأربعة.<\/h2>", "<small>سؤال وبرهان<\/small><details class=\"frag\"><summary><b>لا أحفظ ولا أستوعب إلا ليلة الامتحان تحت ضغط الخوف، فهل هذا خطأ؟<\/b><\/summary><p>هذا وهم ناتج عن إفراز هرمونات التوتر. الحفظ السريع تحت الهلع يتبخر فور الخروج من القاعة. أما التعلم الحقيقي الذي يبني ذكاءك ومستقبلك فهو التراكم الهادئ في المربع الثاني.<\/p><\/details><details class=\"frag\"><summary><b>كيف أتصرف مع طلبات الأهل المفاجئة التي تقطع جدول المذاكرة؟<\/b><\/summary><p>بر الوالدين عبادة مقدمة، فصمم جدولك بوقت مرن يتسع للطوارئ، وأخبر أهلك مسبقاً بساعات المذاكرة المهمة.<\/p><\/details><details class=\"frag\"><summary><b>هل التخطيط الأسبوعي يقتل العفوية ويجعل اليوم رتيباً؟<\/b><\/summary><p>العكس. التخطيط المسبق يفرغ عقلك من القلق ويضمن لك وقتاً حقيقياً للراحة واللعب وأنت مرتاح الضمير.<\/p><\/details>", "<small>ميدان التطبيق<\/small><h2>«مختبر مصفوفة المهام وتخطيط الأسبوع»  نشاط ذهني وتخطيطي<\/h2><ol><li class=\"frag\">1. الجرد: يسجل كل فتى عشرة أنشطة يقوم بها في أسبوعه، ثم يصنفها داخل المربعات الأربعة.<\/li><li class=\"frag\">2. الاستخراج: يختار ثلاث مهام أساسية من المربع الثاني (مذاكرة تراكمية، ورد قرآني، رياضة).<\/li><li class=\"frag\">3. الجدولة: يضع هذه المهام في جدول الأسبوع بمواعيد وأماكن محددة وقاطعة.<\/li><li class=\"frag\">4. البتر: يحدد مهمتين من المربعين الثالث والرابع ليقلصهما أو يحذفهما نهائياً.<\/li><li class=\"frag\">5. دراسة حالة: فراس (16 سنة) يقضي أسبوعه بين لعب الهاتف لساعات، والخروج مع رفاقه كلما اتصلوا به، وإهمال المذاكرة.<\/li><li class=\"frag\">6. الاعتراض: أحد الطلاب يدافع عن فكرة «الاستجابة لكل مستجد دون جدول»، وتناقشه المجموعات.<\/li><\/ol>", "<small>رحلة الأسبوع<\/small><ul><li class=\"frag\"><b>جلسة الجمعة:<\/b> يخصص الطالب خمس عشرة دقيقة قبل بداية الأسبوع لكتابة جدوله.<\/li><li class=\"frag\"><b>تقديم المربع الثاني:<\/b> ينفذ مهمته الأهم من هذا المربع قبل أي ترفيه كل يوم.<\/li><li class=\"frag\"><b>بتر مهمة:<\/b> يحذف مهمة واحدة من المربع الرابع طوال الأسبوع ويدوّن أثر ذلك.<\/li><li class=\"frag\"><b>جسر إلى اللقاء الثالث عشر:<\/b> وبين الأولويات تواجه الفتى مواقف يتعارض فيها الصواب مع إرضاء الأصدقاء. وهذا موضوع «صناعة القرار الأخلاقي».<\/li><\/ul>"], "n": 12, "u": 2, "title": "مصفوفة المهام", "q": "كيف نميز بين العاجل والمهم في يومنا؟", "dqq": "ما الفرق بين العاجل والمهم في يومك؟", "pact": "وزع مهام أسبوعك على مصفوفة الأرباع الأربعة."}, {"summary": "<p class=\"\">تأتي على الفتى لحظات يتعارض فيها ما يعلم أنه صواب مع ما يريده أصدقاؤه، وتكون كلفة الموقف المبدئي سخرية أو مقاطعة أو خسارة منفعة. يتعلم الفتى في هذا اللقاء أن القرار الأخلاقي له ميزان يُستعمل، لا مجرد شعور عابر. فيتدرب على موازنة المصالح والمفاسد بقواعد واضحة، وعلى «الرفض الشجاع» الذي يحفظ المبدأ ويحترم الأشخاص.<\/p><p class=\"\">يتعرف على ثلاث قواعد حاكمة لأي قرار أخلاقي.<\/p><p class=\"\">يتدرب على جملة رفض محترمة وحازمة أمام ضغط الأقران.<\/p><p class=\"\">يفهم أن النجاح الملوث بالغش أو الكذب خسارة وإن بدا ربحاً.<\/p><div class=\"tw\"><table><tr><th><b>المهارة<\/b><\/th><th><b>معناها العملي<\/b><\/th><\/tr><tr><td><b>التفكير المقاصدي<\/b><\/td><td>يوازن بين المصالح والمفاسد قبل أن يقرر<\/td><\/tr><tr><td><b>الشجاعة الأدبية<\/b><\/td><td>يثبت على المبدأ أمام السخرية والتهديد بالمقاطعة<\/td><\/tr><tr><td><b>الرفض اللبق<\/b><\/td><td>يقول «لا» بنبرة واثقة تحفظ الود ولا تتنازل عن المبدأ<\/td><\/tr><\/table><\/div>", "kit": "<p class=\"\"><b>ما يعيشه الفتى:<\/b> يشتد في هذه السن الخوف من النبذ الاجتماعي. فقد يعلم الفتى أن الفعل خطأ ومع ذلك يسايره كي لا يخسر مجموعته. وأصعب ما عليه أن يقف وحده أمام «الكل يفعل ذلك».<\/p><p class=\"\"><b>خفف من قسوة الموقف:<\/b> لا تجعل الموقف المبدئي بطولة استعراضية، بل ثباتاً هادئاً محترماً.<\/p><p class=\"\"><b>اعترف بالكلفة:<\/b> قل لهم بصدق: الثبات قد يكلف أحياناً مكسباً أو صديقاً، لكن عاقبة التنازل أشد.<\/p><p class=\"\"><b>درّبهم على النطق:<\/b> الجملة التي لم يتدرب عليها الفتى لا يقولها عند الحاجة. اجعلهم يقولونها بصوت مسموع.<\/p><p class=\"\"><b>لا تحاكمهم على الماضي:<\/b> قد يكون بعضهم غشّ من قبل، فابدأ بالمستقبل.<\/p>", "hookT": "معضلة يحيى", "hook": "<p class=\"\"><b>يحيى (17 سنة)<\/b> يجلس في غرفته ليلة الاختبار، فينبثق إشعار في مجموعة «واتساب» تضم أعز أربعة أصدقاء له: أحدهم حصل على أسئلة الاختبار المسربة بإجاباتها النموذجية! يبدأ الأصدقاء بالاحتفال وتبادل الإجابات، ويحيى يعلم يقيناً أن هذا غش وظلم وخيانة للأمانة. فلما كتب ناصحاً: «يا إخوان هذا غش محرم ولا يجوز» انهالوا عليه بالسخرية: «صرت واعظاً الآن؟ مسوي فيها شريف؟». ثم هددوه: «إذا لم تستخدمها وتسكت، سنطردك من المجموعة ونقاطعك».<\/p><p class=\"\"><b>أسئلة الاستثارة:<\/b><\/p><p class=\"\">ما الذي يخسره يحيى إن ثبت؟ وما الذي يخسره إن تنازل؟ أيهما أثقل؟<\/p><p class=\"\">كيف يمكن أن يرد دون أن يتحول إلى واعظ متعالٍ؟<\/p>", "pts": "<article class=\"pt\"><h4><span>أولاً<\/span>ميزان الله يتجاوز الرغبة العاجلة<\/h4><p class=\"ayah\">﴿وَعَسَىٰ أَن تَكْرَهُوا شَيْئًا وَهُوَ خَيْرٌ لَّكُمْ ۖ وَعَسَىٰ أَن تُحِبُّوا شَيْئًا وَهُوَ شَرٌّ لَّكُمْ ۗ وَاللَّهُ يَعْلَمُ وَأَنتُمْ لَا تَعْلَمُونَ﴾ [البقرة: 216]<\/p><p class=\"\">ميزان الله في المصالح والمفاسد أوسع من رغباتنا العاجلة. فالأمر المكروه نفساً (كرفض الغش وما يتبعه من سخرية) قد يحمل خيراً عظيماً، واللذة العارضة (كإجابة جاهزة) قد تجلب شراً وندامة. والمؤمن يعلم أن علمه قاصر، فيرجع إلى ميزان خالقه.<\/p><\/article><article class=\"pt\"><h4><span>ثانياً<\/span>الكثرة ليست معيار الحق<\/h4><p class=\"ayah\">﴿قُل لَّا يَسْتَوِي الْخَبِيثُ وَالطَّيِّبُ وَلَوْ أَعْجَبَكَ كَثْرَةُ الْخَبِيثِ ۚ فَاتَّقُوا اللَّهَ يَا أُولِي الْأَلْبَابِ لَعَلَّكُمْ تُفْلِحُونَ﴾ [المائدة: 100]<\/p><p class=\"\">القبول الاجتماعي وكثرة الفاعلين ليسا معياراً للصواب. فالخبيث يبقى خبيثاً ولو اتفق عليه الناس جميعاً. وخاطبت الآية «أولي الألباب» أي أصحاب العقول، لأن الثبات على المبدأ ضد التيار عمل عقلي قبل أن يكون عمل قلب.<\/p><\/article><article class=\"pt\"><h4><span>ثالثاً<\/span>يوسف عليه السلام وقرار الاستقلال<\/h4><p class=\"ayah\">﴿قَالَ رَبِّ السِّجْنُ أَحَبُّ إِلَيَّ مِمَّا يَدْعُونَنِي إِلَيْهِ﴾ [يوسف: 33]<\/p><p class=\"\">كان يوسف فتى حين فُتن، وضُغط عليه بالإغراء ثم بالتهديد بالسجن. فاختار أن يتحمل كلفة الثبات على أن يفرط في مبدئه. وهذا هو القرار الأخلاقي الناضج: أن تقدّر الكلفة وتتحملها عن وعي.<\/p><\/article><article class=\"pt\"><h4><span>رابعاً<\/span>رضا الله مقدم على رضا الناس<\/h4><p class=\"had\">قال رسول الله ﷺ: «مَنِ الْتَمَسَ رِضَى اللَّهِ بِسَخَطِ النَّاسِ كَفَاهُ اللَّهُ مُؤْنَةَ النَّاسِ، وَمَنِ الْتَمَسَ رِضَى النَّاسِ بِسَخَطِ اللَّهِ وَكَلَهُ اللَّهُ إِلَى النَّاسِ» رواه الترمذي<\/p><p class=\"\">استقلال القرار الأخلاقي يقوم على تقديم مرضاة الله. فمن طلب رضا أصدقائه بمعصية الله أخلفوه عند أول أزمة، ومن ثبت كفاه الله مؤونتهم. وقد حذّر النبي ﷺ من الإمّعة الذي يتبع الناس في الإحسان والإساءة (رواه الترمذي).<\/p><\/article><article class=\"pt\"><h4><span>خامساً<\/span>الغش خيانة للأمانة<\/h4><p class=\"had\">قال رسول الله ﷺ: «مَنْ غَشَّنَا فَلَيْسَ مِنَّا» رواه مسلم. فالغش في الاختبار ليس مخالفة إدارية بل خلق مذموم يهدم الأمانة. والنجاح بالغش يؤسس لشخصية هشة مزورة، تنهار حين تُطلب منها كفاءة حقيقية. أما الرسوب بشرف وبذل جهد فيعقبه نجاح حقيقي.<\/p><\/article><article class=\"pt\"><h4><span>سادساً<\/span>قاعدة «لا ضرر ولا ضرار»<\/h4><p class=\"had\">قال رسول الله ﷺ: «لاَ ضَرَرَ وَلاَ ضِرَارَ» رواه ابن ماجه وأحمد. ومن مقاصد الشريعة أن درء المفاسد مقدم على جلب المصالح، فلا يجوز ارتكاب ضرر أخلاقي لتحصيل نفع مادي عاجل. وكل قرار تتخذه يجب أن تسأل فيه: من سيتضرر؟ وما كلفته على المدى البعيد؟<\/p><\/article><article class=\"pt\"><h4><span>سابعاً<\/span>ثبات الصحابة تحت الإغراء والتهديد<\/h4><p class=\"\">تروي كتب السير أن عبد الله بن حذافة السهمي رضي الله عنه أسره الروم، فعرض عليه ملكهم نصف ملكه وأن يزوجه ابنته على أن يترك دينه فأبى، ثم هُدد بالإلقاء في الزيت المغلي فثبت، ودمعت عيناه حزناً أن ليس له إلا نفس واحدة يبذلها في سبيل الله. وهي صورة بالغة من ثبات المبدأ أمام الإغراء والتهديد معاً.<\/p><\/article><article class=\"pt\"><h4><span>ثامناً<\/span>خوارزمية الموازنة وثلاث قواعد حاكمة<\/h4><div class=\"tw\"><table><tr><th><b>القاعدة<\/b><\/th><th><b>معناها<\/b><\/th><th><b>مثال<\/b><\/th><\/tr><tr><td><b>درء المفاسد مقدم على جلب المصالح<\/b><\/td><td>تجنب الإثم والضرر أولى من المكسب المؤقت<\/td><td>لا أغش ولو خسرت درجات<\/td><\/tr><tr><td><b>الغاية الشريفة لا تبرر الوسيلة الرخيصة<\/b><\/td><td>النجاح بالغش أو النفاق نجاح ملوث<\/td><td>لا أقبل إعلاناً مشبوهاً لأشتري حاسوباً<\/td><\/tr><tr><td><b>ميزان العواقب البعيدة<\/b><\/td><td>قس القرار بأثره بعد خمس سنوات ويوم تقف أمام الله<\/td><td>هل أفتخر بهذا الموقف لو عُرض أمام الجميع؟<\/td><\/tr><\/table><\/div><\/article><article class=\"pt\"><h4><span>تاسعاً<\/span>هندسة الرفض الذكي<\/h4><p class=\"\">الرفض الأخلاقي ليس وقاحة ولا عداءً، بل ثبات محترم. والنبرة الأنسب: «أنا أعتز بصداقتكم، لكني لا أوافق على هذا السلوك ولن أشارك فيه». وهي جملة تجمع المودة والحزم، فلا تحقر أحداً ولا تتنازل عن المبدأ.<\/p><\/article>", "qa": "<div class=\"tw\"><table><tr><th><b>السؤال المتوقع<\/b><\/th><th><b>تفكيكه<\/b><\/th><\/tr><tr><td><b>إذا كان «الجميع يفعل ذلك» أفلا يجعلني التمسك بالمبدأ منبوذاً؟<\/b><\/td><td>القيم يصنعها المصلحون الذين وقفوا ضد السيل لا المقلدون التابعون. من يساير الموجة التافهة يحتقره أصحابه في الباطن، أما صاحب المبدأ الصلب فيفرض احترامه ولو بعد حين.<\/td><\/tr><tr><td><b>ألا يمكن استخدام الغش أو الكذب حيلة مؤقتة لدرء رسوب أو مفسدة أكبر؟<\/b><\/td><td>أباحت الشريعة الكذب في مواضع محددة كالإصلاح بين الناس أو إنقاذ نفس، ولم تجعله أداة لتبرير الحرام والغش. فالرسوب بشرف أهون من نجاح يؤسس لشخصية مزورة.<\/td><\/tr><tr><td><b>كيف أتصرف إذا كان صاحب السلوك الخاطئ صديقي المقرب الذي لا أريد خسارته؟<\/b><\/td><td>الصديق الذي يطلب منك معصية أو خيانة أمانة لا يرعى مصلحتك الحقيقية. انصحه بينك وبينه برفق وحزم، وبيّن أنك تخاف عليه وعلى صداقتكما من غضب الله، فإن استكبر فاختر مبدأك ورضا ربك.<\/td><\/tr><\/table><\/div>", "radar": "<p class=\"\"><b>مؤشرات الخطر:<\/b> التبرير الدائم بعبارة «الجميع يفعل ذلك»، والخوف المبالغ فيه من رأي المجموعة، وتحول الفتى إلى تابع صامت، أو ظهور أرباح دنيوية لوسائل محرمة.<\/p><p class=\"\"><b>بروتوكول التدخل:<\/b><\/p><p class=\"step\"><b>1. <\/b>اجلس معه جلسة هادئة واسأله عما يخشاه تحديداً (السخرية؟ الطرد؟ الخسارة؟).<\/p><p class=\"step\"><b>2. <\/b>حلّلا الموقف على «ميزان القرار الخماسي» حتى يرى الصورة كاملة.<\/p><p class=\"step\"><b>3. <\/b>درّبه على جملة الرفض وساعده في اختيار شريك صالح يقف معه.<\/p>", "actT": "«ميزان القرار الأخلاقي الخماسي»  نشاط حواري", "act": "<p class=\"step\"><b>1. الخطوة الأولى، توصيف الموقف:<\/b> يكتب الطالب الخيار الشائك بوضوح بلا تجميل.<\/p><p class=\"step\"><b>2. الخطوة الثانية، جرد الميزان:<\/b> يضع المصالح المرجوة مقابل المفاسد المتوقعة في جدول متقابل.<\/p><p class=\"step\"><b>3. الخطوة الثالثة، الفحص المعياري:<\/b> هل في الخيار شبهة محرم قطعي (غش، كذب، ظلم)؟<\/p><p class=\"step\"><b>4. الخطوة الرابعة، اختبار العواقب:<\/b> هل يسعدني أن يُنشر هذا الموقف عني في الملأ وأمام الله؟<\/p><p class=\"step\"><b>5. الخطوة الخامسة، جملة الرفض:<\/b> يكتب نص الرفض ويقوله بصوت مسموع أمام زميله.<\/p><p class=\"step\"><b>6. دراسة حالة:<\/b> مازن (17 سنة) يدير حساباً تقنياً ناجحاً، فعرضت عليه شركة ألعاب مشبوهة تحتوي مراهنات
