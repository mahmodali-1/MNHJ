 مقنّعة ومحتوى غير أخلاقي مبلغ خمسمئة دولار عن كل مقطع ترويجي. وهو بحاجة ماسة إلى حاسوب يعينه على دراسته. قال له صديقه: «أعلن، الجميع يعلنون ولست مسؤولاً عن المتابعين». ونصحته أمه: «يا بني، المال الذي يأتي من إفساد الشباب محقوق البركة». تحلل المجموعات القرار بالميزان الخماسي وتعرض النتيجة.<\/p><p class=\"step\"><b>7. الاعتراض:<\/b> أحد الطلاب يمثل ضغط الأقران («لا تكن متزمتاً، الحياة تمشي هكذا»)، وتتدرب المجموعات على الرد.<\/p><div class=\"tw\"><table><tr><th colspan=\"2\"><b>بطاقة: ميزان القرار الأخلاقي<\/b><\/th><\/tr><tr><td><b>1. الموقف<\/b><\/td><td>............................<\/td><\/tr><tr><td><b>2. المصالح مقابل المفاسد<\/b><\/td><td>المصالح: ............ المفاسد: ............<\/td><\/tr><tr><td><b>3. هل فيه محرم قطعي؟<\/b><\/td><td>نعم / لا: ............<\/td><\/tr><tr><td><b>4. اختبار العواقب<\/b><\/td><td>هل أرضى أن يُعرف بعد خمس سنوات؟ ............<\/td><\/tr><tr><td><b>5. جملة الرفض<\/b><\/td><td>«أنا أعتز بصداقتكم، لكني ............................»<\/td><\/tr><\/table><\/div>", "week": "<p class=\"\"><b>الرفض الأول:<\/b> يطبق الطالب جملة الرفض في موقف حقيقي هذا الأسبوع ويدوّن ما حدث.<\/p><p class=\"\"><b>الميزان الخماسي:<\/b> يستعمل الميزان في قرار واحد يواجهه ويكتب نتيجته.<\/p><p class=\"\"><b>شريك الثبات:<\/b> يتفق مع صديق صالح على أن يتناصحا ويثبّت كل منهما الآخر.<\/p><p class=\"\"><b>جسر إلى اللقاء الرابع عشر:<\/b> وبعد أن نعرف كيف نقرر، لا بد أن نوازن بين حقوق الحياة المتعددة حتى لا تطغى إحداها على الأخرى. وهذا موضوع «الموازنة الحياتية».<\/p>", "kq": "موازنة المصالح والمفاسد والشجاعة الأدبية", "brief": "<div class=\"plan\"><span>اقتراح لتوزيع الوقت (١٠–١٥ د)<\/span><b>افتتاح ٣<\/b><b>محاور ٥<\/b><b>حوار ٢<\/b><b>نشاط ٣<\/b><b>ختام ٢<\/b><\/div><section class=\"bs\"><h3>١ · الافتتاح: معضلة يحيى<\/h3><p class=\"\"><b>يحيى (17 سنة)<\/b> يجلس في غرفته ليلة الاختبار، فينبثق إشعار في مجموعة «واتساب» تضم أعز أربعة أصدقاء له: أحدهم حصل على أسئلة الاختبار المسربة بإجاباتها النموذجية! يبدأ الأصدقاء بالاحتفال وتبادل الإجابات، ويحيى يعلم يقيناً أن هذا غش وظلم وخيانة للأمانة. فلما كتب ناصحاً: «يا إخوان هذا غش محرم ولا يجوز» انهالوا عليه بالسخرية: «صرت واعظاً الآن؟ مسوي فيها شريف؟». ثم هددوه: «إذا لم تستخدمها وتسكت، سنطردك من المجموعة ونقاطعك».<\/p><p class=\"\"><b>أسئلة الاستثارة:<\/b><\/p><p class=\"\">ما الذي يخسره يحيى إن ثبت؟ وما الذي يخسره إن تنازل؟ أيهما أثقل؟<\/p><p class=\"\">كيف يمكن أن يرد دون أن يتحول إلى واعظ متعالٍ؟<\/p><\/section><section class=\"bs\"><h3>٢ · المحاور<\/h3><article class=\"pt\"><h4><span>١<\/span>ميزان الله يتجاوز الرغبة العاجلة<\/h4><p class=\"ayah\">﴿وَعَسَىٰ أَن تَكْرَهُوا شَيْئًا وَهُوَ خَيْرٌ لَّكُمْ ۖ وَعَسَىٰ أَن تُحِبُّوا شَيْئًا وَهُوَ شَرٌّ لَّكُمْ ۗ وَاللَّهُ يَعْلَمُ وَأَنتُمْ لَا تَعْلَمُونَ﴾ [البقرة: 216]<\/p><p class=\"g\">كلفة الثبات (مثل الرفض للسخرية) قد تحمل خيرا يحمي الفتى.<\/p><details class=\"more\"><summary>للتوسع<\/summary><p class=\"\">ميزان الله في المصالح والمفاسد أوسع من رغباتنا العاجلة. فالأمر المكروه نفساً (كرفض الغش وما يتبعه من سخرية) قد يحمل خيراً عظيماً، واللذة العارضة (كإجابة جاهزة) قد تجلب شراً وندامة. والمؤمن يعلم أن علمه قاصر، فيرجع إلى ميزان خالقه.<\/p><\/details><\/article><article class=\"pt\"><h4><span>٢<\/span>الكثرة ليست معيار الحق<\/h4><p class=\"ayah\">﴿قُل لَّا يَسْتَوِي الْخَبِيثُ وَالطَّيِّبُ وَلَوْ أَعْجَبَكَ كَثْرَةُ الْخَبِيثِ ۚ فَاتَّقُوا اللَّهَ يَا أُولِي الْأَلْبَابِ لَعَلَّكُمْ تُفْلِحُونَ﴾ [المائدة: 100]<\/p><p class=\"g\">القبول الاجتماعي لا يبرر ارتكاب الخطأ أو مجاراة الباطل.<\/p><details class=\"more\"><summary>للتوسع<\/summary><p class=\"\">القبول الاجتماعي وكثرة الفاعلين ليسا معياراً للصواب. فالخبيث يبقى خبيثاً ولو اتفق عليه الناس جميعاً. وخاطبت الآية «أولي الألباب» أي أصحاب العقول، لأن الثبات على المبدأ ضد التيار عمل عقلي قبل أن يكون عمل قلب.<\/p><\/details><\/article><article class=\"pt\"><h4><span>٣<\/span>رضا الله مقدم على رضا الناس<\/h4><p class=\"had\">قال رسول الله ﷺ: «مَنِ الْتَمَسَ رِضَى اللَّهِ بِسَخَطِ النَّاسِ كَفَاهُ اللَّهُ مُؤْنَةَ النَّاسِ، وَمَنِ الْتَمَسَ رِضَى النَّاسِ بِسَخَطِ اللَّهِ وَكَلَهُ اللَّهُ إِلَى النَّاسِ» رواه الترمذي<\/p><p class=\"g\">الناس» (رواه الترمذي) من طلب رضا أصدقائه بالمعصية خذلوه.<\/p><details class=\"more\"><summary>للتوسع<\/summary><p class=\"\">استقلال القرار الأخلاقي يقوم على تقديم مرضاة الله. فمن طلب رضا أصدقائه بمعصية الله أخلفوه عند أول أزمة، ومن ثبت كفاه الله مؤونتهم. وقد حذّر النبي ﷺ من الإمّعة الذي يتبع الناس في الإحسان والإساءة (رواه الترمذي).<\/p><\/details><\/article><article class=\"pt\"><h4><span>٤<\/span>قاعدة لا ضرر ولا ضرار<\/h4><p class=\"had\">قال رسول الله ﷺ: «لاَ ضَرَرَ وَلاَ ضِرَارَ» رواه ابن ماجه وأحمد. ومن مقاصد الشريعة أن درء المفاسد مقدم على جلب المصالح، فلا يجوز ارتكاب ضرر أخلاقي لتحصيل نفع مادي عاجل. وكل قرار تتخذه يجب أن تسأل فيه: من سيتضرر؟ وما كلفته على المدى البعيد؟<\/p><p class=\"g\">النجاح الملوث بالغش خيانة للأمانة «من غش ناف لي سم نا». الشجاعة تقتضي الرفض اللبق والحازم للممارسات الخاطئة.<\/p><details class=\"more\"><summary>للتوسع<\/summary><\/details><\/article><\/section><section class=\"bs\"><h3>٣ · سؤال للحوار<\/h3><p class=\"big\">اذكر موقفا ضغط عليك فيه الأصدقاء. ماذا فعلت؟<\/p><\/section><section class=\"bs\"><h3>٤ · نشاط تطبيقي<\/h3><p class=\"big\">تمثيل أدوار :كيف ترفض بلباقة وحزم في ثلاث جمل؟<\/p><\/section><section class=\"bs\"><h3>أسئلة قد تُطرح<\/h3><details class=\"more\"><summary><b>إذا كان «الجميع يفعل ذلك» أفلا يجعلني التمسك بالمبدأ منبوذاً؟<\/b><\/summary><p>القيم يصنعها المصلحون الذين وقفوا ضد السيل لا المقلدون التابعون. من يساير الموجة التافهة يحتقره أصحابه في الباطن، أما صاحب المبدأ الصلب فيفرض احترامه ولو بعد حين.<\/p><\/details><details class=\"more\"><summary><b>ألا يمكن استخدام الغش أو الكذب حيلة مؤقتة لدرء رسوب أو مفسدة أكبر؟<\/b><\/summary><p>أباحت الشريعة الكذب في مواضع محددة كالإصلاح بين الناس أو إنقاذ نفس، ولم تجعله أداة لتبرير الحرام والغش. فالرسوب بشرف أهون من نجاح يؤسس لشخصية مزورة.<\/p><\/details><\/section><section class=\"bs warn\"><h3>رادار الحماية<\/h3><p><b>مؤشرات الخطر:<\/b> التبرير الدائم بعبارة «الجميع يفعل ذلك»، والخوف المبالغ فيه من رأي المجموعة، وتحول الفتى إلى تابع صامت، أو ظهور أرباح دنيوية لوسائل محرمة.<\/p><small>البروتوكول كاملاً في تبويب «الكامل».<\/small><\/section><section class=\"bs\"><h3>٥ · رحلة الأسبوع<\/h3><p class=\"\"><b>الرفض الأول:<\/b> يطبق الطالب جملة الرفض في موقف حقيقي هذا الأسبوع ويدوّن ما حدث.<\/p><p class=\"\"><b>الميزان الخماسي:<\/b> يستعمل الميزان في قرار واحد يواجهه ويكتب نتيجته.<\/p><p class=\"\"><b>شريك الثبات:<\/b> يتفق مع صديق صالح على أن يتناصحا ويثبّت كل منهما الآخر.<\/p><p class=\"\"><b>جسر إلى اللقاء الرابع عشر:<\/b> وبعد أن نعرف كيف نقرر، لا بد أن نوازن بين حقوق الحياة المتعددة حتى لا تطغى إحداها على الأخرى. وهذا موضوع «الموازنة الحياتية».<\/p><\/section>", "slides": ["<div class=\"cn\">13<\/div><h2>صناعة القرار الأخلاقي<\/h2><p class=\"q\">كيف نثبت على المبدأ أمام ضغط الأصدقاء؟<\/p>", "<small>إضاءة استهلالية<\/small><h2>معضلة يحيى<\/h2><ul><li class=\"frag\">ما الذي يخسره يحيى إن ثبت؟ وما الذي يخسره إن تنازل؟ أيهما أثقل؟<\/li><li class=\"frag\">كيف يمكن أن يرد دون أن يتحول إلى واعظ متعالٍ؟<\/li><\/ul>", "<small>1<\/small><h2>ميزان الله يتجاوز الرغبة العاجلة<\/h2><p class=\"ayah\">﴿وَعَسَىٰ أَن تَكْرَهُوا شَيْئًا وَهُوَ خَيْرٌ لَّكُمْ ۖ وَعَسَىٰ أَن تُحِبُّوا شَيْئًا وَهُوَ شَرٌّ لَّكُمْ ۗ وَاللَّهُ يَعْلَمُ وَأَنتُمْ لَا تَعْلَمُونَ﴾ [البقرة: 216]<\/p><p class=\"g frag\">كلفة الثبات (مثل الرفض للسخرية) قد تحمل خيرا يحمي الفتى.<\/p>", "<small>2<\/small><h2>الكثرة ليست معيار الحق<\/h2><p class=\"ayah\">﴿قُل لَّا يَسْتَوِي الْخَبِيثُ وَالطَّيِّبُ وَلَوْ أَعْجَبَكَ كَثْرَةُ الْخَبِيثِ ۚ فَاتَّقُوا اللَّهَ يَا أُولِي الْأَلْبَابِ لَعَلَّكُمْ تُفْلِحُونَ﴾ [المائدة: 100]<\/p><p class=\"g frag\">القبول الاجتماعي لا يبرر ارتكاب الخطأ أو مجاراة الباطل.<\/p>", "<small>3<\/small><h2>رضا الله مقدم على رضا الناس<\/h2><p class=\"had lg\">قال رسول الله ﷺ: «مَنِ الْتَمَسَ رِضَى اللَّهِ بِسَخَطِ النَّاسِ كَفَاهُ اللَّهُ مُؤْنَةَ النَّاسِ، وَمَنِ الْتَمَسَ رِضَى النَّاسِ بِسَخَطِ اللَّهِ وَكَلَهُ اللَّهُ إِلَى النَّاسِ» رواه الترمذي<\/p><p class=\"g frag\">الناس» (رواه الترمذي) من طلب رضا أصدقائه بالمعصية خذلوه.<\/p>", "<small>4<\/small><h2>قاعدة لا ضرر ولا ضرار<\/h2><p class=\"had lg\">قال رسول الله ﷺ: «لاَ ضَرَرَ وَلاَ ضِرَارَ» رواه ابن ماجه وأحمد. ومن مقاصد الشريعة أن درء المفاسد مقدم على جلب المصالح، فلا يجوز ارتكاب ضرر أخلاقي لتحصيل نفع مادي عاجل. وكل قرار تتخذه يجب أن تسأل فيه: من سيتضرر؟ وما كلفته على المدى البعيد؟<\/p><p class=\"g frag\">النجاح الملوث بالغش خيانة للأمانة «من غش ناف لي سم نا». الشجاعة تقتضي الرفض اللبق والحازم للممارسات الخاطئة.<\/p>", "<small>سؤال للحوار<\/small><h2 class=\"big\">اذكر موقفا ضغط عليك فيه الأصدقاء. ماذا فعلت؟<\/h2>", "<small>نشاط تطبيقي<\/small><h2 class=\"big\">تمثيل أدوار :كيف ترفض بلباقة وحزم في ثلاث جمل؟<\/h2>", "<small>سؤال وبرهان<\/small><details class=\"frag\"><summary><b>إذا كان «الجميع يفعل ذلك» أفلا يجعلني التمسك بالمبدأ منبوذاً؟<\/b><\/summary><p>القيم يصنعها المصلحون الذين وقفوا ضد السيل لا المقلدون التابعون. من يساير الموجة التافهة يحتقره أصحابه في الباطن، أما صاحب المبدأ الصلب فيفرض احترامه ولو بعد حين.<\/p><\/details><details class=\"frag\"><summary><b>ألا يمكن استخدام الغش أو الكذب حيلة مؤقتة لدرء رسوب أو مفسدة أكبر؟<\/b><\/summary><p>أباحت الشريعة الكذب في مواضع محددة كالإصلاح بين الناس أو إنقاذ نفس، ولم تجعله أداة لتبرير الحرام والغش. فالرسوب بشرف أهون من نجاح يؤسس لشخصية مزورة.<\/p><\/details><details class=\"frag\"><summary><b>كيف أتصرف إذا كان صاحب السلوك الخاطئ صديقي المقرب الذي لا أريد خسارته؟<\/b><\/summary><p>الصديق الذي يطلب منك معصية أو خيانة أمانة لا يرعى مصلحتك الحقيقية. انصحه بينك وبينه برفق وحزم، وبيّن أنك تخاف عليه وعلى صداقتكما من غضب الله، فإن استكبر فاختر مبدأك ورضا ربك.<\/p><\/details>", "<small>ميدان التطبيق<\/small><h2>«ميزان القرار الأخلاقي الخماسي»  نشاط حواري<\/h2><ol><li class=\"frag\">1. الخطوة الأولى، توصيف الموقف: يكتب الطالب الخيار الشائك بوضوح بلا تجميل.<\/li><li class=\"frag\">2. الخطوة الثانية، جرد الميزان: يضع المصالح المرجوة مقابل المفاسد المتوقعة في جدول متقابل.<\/li><li class=\"frag\">3. الخطوة الثالثة، الفحص المعياري: هل في الخيار شبهة محرم قطعي (غش، كذب، ظلم)؟<\/li><li class=\"frag\">4. الخطوة الرابعة، اختبار العواقب: هل يسعدني أن يُنشر هذا الموقف عني في الملأ وأمام الله؟<\/li><li class=\"frag\">5. الخطوة الخامسة، جملة الرفض: يكتب نص الرفض ويقوله بصوت مسموع أمام زميله.<\/li><li class=\"frag\">6. دراسة حالة: مازن (17 سنة) يدير حساباً تقنياً ناجحاً، فعرضت عليه شركة ألعاب مشبوهة تحتوي مراهنات مقنّعة ومحتوى غير أخلاقي مبلغ خمسمئة دولار عن كل…<\/li><li class=\"frag\">7. الاعتراض: أحد الطلاب يمثل ضغط الأقران («لا تكن متزمتاً، الحياة تمشي هكذا»)، وتتدرب المجموعات على الرد.<\/li><\/ol>", "<small>رحلة الأسبوع<\/small><ul><li class=\"frag\"><b>الرفض الأول:<\/b> يطبق الطالب جملة الرفض في موقف حقيقي هذا الأسبوع ويدوّن ما حدث.<\/li><li class=\"frag\"><b>الميزان الخماسي:<\/b> يستعمل الميزان في قرار واحد يواجهه ويكتب نتيجته.<\/li><li class=\"frag\"><b>شريك الثبات:<\/b> يتفق مع صديق صالح على أن يتناصحا ويثبّت كل منهما الآخر.<\/li><li class=\"frag\"><b>جسر إلى اللقاء الرابع عشر:<\/b> وبعد أن نعرف كيف نقرر، لا بد أن نوازن بين حقوق الحياة المتعددة حتى لا تطغى إحداها على الأخرى. وهذا موضوع «الموازنة الحياتية».<\/li><\/ul>"], "n": 13, "u": 2, "title": "صناعة القرار الأخلاقي", "q": "كيف نثبت على المبدأ أمام ضغط الأصدقاء؟", "dqq": "اذكر موقفا ضغط عليك فيه الأصدقاء. ماذا فعلت؟", "pact": "تمثيل أدوار :كيف ترفض بلباقة وحزم في ثلاث جمل؟"}, {"summary": "<p class=\"\">يقع الفتى المجتهد في فخ الانقطاع إلى جانب واحد: فهذا يهمل أهله وصحته من أجل الدراسة، وذاك يغرق في الترويح فتفسد دراسته وعبادته. يتعلم الفتى في هذا اللقاء أن الدين جاء بمنهج التوازن بين الحقوق، وأن طغيان جانب على آخر خلل حتى لو كان في العبادة نفسها. ويرسم «عجلة الحياة» ليرى أي عجلة مفرغة عنده فيرممها.<\/p><p class=\"\">يفهم أن التوازن فريضة شرعية وليس ترفاً.<\/p><p class=\"\">يميز بين الترويح النظيف الذي يعيد الطاقة والاستنزاف الرقمي الذي يهدرها.<\/p><p class=\"\">يقيّم واقعه في أربعة قطاعات ويضع قرارين تصحيحيين.<\/p><div class=\"tw\"><table><tr><th><b>المهارة<\/b><\/th><th><b>معناها العملي<\/b><\/th><\/tr><tr><td><b>التوازن بين الحقوق<\/b><\/td><td>يعطي كل مجال من حياته حقه بلا إفراط ولا تفريط<\/td><\/tr><tr><td><b>الوقاية من الاحتراق النفسي<\/b><\/td><td>يحمي نومه وصحته وعلاقاته وهو يجتهد<\/td><\/tr><tr><td><b>التقييم الذاتي<\/b><\/td><td>يقيّم واقعه بصدق ويضع خطوات تصحيحية محددة<\/td><\/tr><\/table><\/div>", "kit": "<p class=\"\"><b>ما يعيشه الفتى:<\/b> الفتى المتفوق يظن أن الراحة وقت ضائع، والفتى المتساهل يظن أن الجدية قيد. وكلاهما يحتاج إلى من يريه أن الحياة عجلات أربع تسير معاً.<\/p><p class=\"\"><b>ارفع عن الترويح الحرج:<\/b> الترويح ليس ذنباً. المشكلة في غياب الترتيب وفي الترويح الذي يهرب به الفتى من واجبه.<\/p><p class=\"\"><b>انتبه للطالب المنغلق:<\/b> الفتى الذي يعزل نفسه بالمذاكرة ويرفض الجلوس مع أسرته قد يكون على أعتاب احتراق نفسي.<\/p><p class=\"\"><b>ذكّرهم ببر الأسرة:<\/b> اجعل الحديث عن الأهل جزءاً أصيلاً من الدرس لا ملحقاً به.<\/p><p class=\"\"><b>قدّم نفسك قدوة:<\/b> أظهر لهم كيف توازن بين عملك وأسرتك وراحتك وعبادتك.<\/p>", "hookT": "السيارة ذات العجلة المعوجة", "hook": "<p class=\"\">تخيل سيارة تسير على أربع عجلات: عجلة العبادة والروح، وعجلة الدراسة والمهارات، وعجلة الأهل والبر، وعجلة الصحة والترويح. <b>سيف (17 سنة)<\/b> نفخ العجلة الدراسية بنسبة مئة بالمئة، لكن عجلة الأهل مفرغة تماماً وعجلة الراحة مكسورة. فلما انطلقت سيارته على الطريق السريع بدأت ترتج بعنف، وقبل الاختبارات بأسبوع اصطدمت بالحائط وأصيب باحتراق نفسي. أما <b>عامر (17 سنة)<\/b> فنفخ عجلة الترويح والألعاب بنسبة مئة بالمئة وأفرغ العجلات الثلاث الأخرى، فانقلبت سيارته وتدحرجت إلى قاع الفشل.<\/p><p class=\"\"><b>أسئلة الاستثارة:<\/b><\/p><p class=\"\">أي السيارتين أخطر؟ ولماذا لم تنفع العجلة المنفوخة بالكامل؟<\/p><p class=\"\">أي عجلة في سيارتك أنت تحتاج إلى نفخ؟<\/p>", "pts": "<article class=\"pt\"><h4><span>أولاً<\/span>المنهج القرآني للتوازن الشامل<\/h4><p class=\"ayah\">﴿وَابْتَغِ فِيمَا آتَاكَ اللَّهُ الدَّارَ الْآخِرَةَ ۖ وَلَا تَنسَ نَصِيبَكَ مِنَ الدُّنْيَا ۖ وَأَحْسِن كَمَا أَحْسَنَ اللَّهُ إِلَيْكَ﴾ [القصص: 77]<\/p><p class=\"\">رسمت الآية منهجاً متكاملاً: الغاية الكبرى للآخرة، ثم رعاية نصيب النفس والبدن والدنيا بغير إفراط ولا تفريط، ثم الإحسان إلى الناس. فلا يُعد الاهتمام بالصحة والراحة مناقضاً للتدين، بل هو جزء من الشكر.<\/p><\/article><article class=\"pt\"><h4><span>ثانياً<\/span>حق الله مقرون بحق الوالدين<\/h4><p class=\"ayah\">﴿وَقَضَىٰ رَبُّكَ أَلَّا تَعْبُدُوا إِلَّا إِيَّاهُ وَبِالْوَالِدَيْنِ إِحْسَانًا﴾ [الإسراء: 23]<\/p><p class=\"\">اقتران حق الله بحق الوالدين دليل على أن التوازن يقتضي ألا تطغى دراسة ولا عمل على رعاية البيت وبر الأسرة. فمن أخذ الوقت كله لمذاكرته وترك والديه فقد أخل بميزان الشرع.<\/p><\/article><article class=\"pt\"><h4><span>ثالثاً<\/span>سلمان وأبو الدرداء: التوازن فريضة<\/h4><p class=\"\">آخى النبي ﷺ بين سلمان وأبي الدرداء رضي الله عنهما، فزار سلمان أبا الدرداء فرأى أم الدرداء مبتذلة، فقال لها: ما شأنك؟ قالت: أخوك أبو الدرداء ليس له حاجة في الدنيا. ثم بات عنده، وكان أبو الدرداء يريد أن يقوم الليل، فقال له سلمان: نم. فلما كان آخر الليل قال: قم الآن. فصليا. ثم قال له سلمان: «إِنَّ لِرَبِّكَ عَلَيْكَ حَقًّا، وَلِنَفْسِكَ عَلَيْكَ حَقًّا، وَلأَهْلِكَ عَلَيْكَ حَقًّا، فَأَعْطِ كُلَّ ذِي حَقٍّ حَقَّهُ». فأتى أبو الدرداء النبي ﷺ فذكر ذلك له، فقال النبي ﷺ: «صَدَقَ سَلْمَانُ» رواه البخاري. وفي ذلك إقرار نبوي صريح بأن طغيان جانب على آخر، حتى في نوافل العبادة، خلل يرفضه الدين.<\/p><\/article><article class=\"pt\"><h4><span>رابعاً<\/span>ساعة وساعة<\/h4><p class=\"\">جاء حنظلة الأسيدي يشكو من تقلب قلبه بين مجلس النبي ﷺ ورعاية أهله، فقال له النبي ﷺ: «وَالَّذِي نَفْسِي بِيَدِهِ إِنْ لَوْ تَدُومُونَ عَلَى مَا تَكُونُونَ عِنْدِي وَفِي الذِّكْرِ، لَصَافَحَتْكُمُ الْمَلَائِكَةُ عَلَى فُرُشِكُمْ وَفِي طُرُقِكُمْ، وَلَكِنْ يَا حَنْظَلَةُ سَاعَةً وَسَاعَةً» رواه مسلم. فالنفس تحتاج إلى فترات من الراحة المباحة والمؤانسة، وهذه ليست نفاقاً ولا نقصاً في الإيمان.<\/p><\/article><article class=\"pt\"><h4><span>خامساً<\/span>في الدين فسحة<\/h4><p class=\"had\">قال رسول الله ﷺ: «لِتَعْلَمَ يَهُودُ أَنَّ فِي دِينِنَا فُسْحَةً، إِنِّي أُرْسِلْتُ بِحَنِيفِيَّةٍ سَمْحَةٍ» رواه أحمد. وقد كان ﷺ يمازح أصحابه ولا يقول إلا حقاً، وسابق عائشة رضي الله عنها فسبقته ثم سبقها، وكان يخدم أهله في بيته. فجمع بين قيادة الأمة وعبادة ربه ورعاية أهله والترويح عن النفس.<\/p><\/article><article class=\"pt\"><h4><span>سادساً<\/span>عجلة الحياة المتزنة<\/h4><div class=\"tw\"><table><tr><th><b>القطاع<\/b><\/th><th><b>ما يشمله<\/b><\/th><th><b>علامة الخلل<\/b><\/th><\/tr><tr><td><b>العبادة والروح<\/b><\/td><td>الفرائض، الورد القرآني، الأذكار<\/td><td>الانقطاع أو العبادة الشكلية<\/td><\/tr><tr><td><b>الدراسة والمهارات<\/b><\/td><td>المذاكرة التراكمية، المهارات، القراءة<\/td><td>التسويف أو الانغلاق المرضي<\/td><\/tr><tr><td><b>الأهل والعلاقات<\/b><\/td><td>البر، المؤانسة، قضاء الحوائج<\/td><td>العزلة والجفاء مع الأسرة<\/td><\/tr><tr><td><b>الصحة والترويح<\/b><\/td><td>الرياضة، النوم الكافي، الهوايات المباحة<\/td><td>السهر والكسل أو الاستنزاف الرقمي<\/td><\/tr><\/table><\/div><p class=\"\">والتوازن ليس قسمة حسابية بالساعات (ست ساعات لكل قطاع)، بل هو إعطاء كل قطاع حقه من التركيز والجودة بحسب الحاجة الشرعية والفطرية.<\/p><\/article><article class=\"pt\"><h4><span>سابعاً<\/span>الترويح النظيف والاستنزاف الرقمي<\/h4><p class=\"\">الترويح النظيف (الرياضة، لقاء الأصدقاء الصالحين، النزهة المباحة) يعيد شحن الطاقة وينعش الذهن. أما السهر الطويل على الشاشات فاستنزاف يورث الخمول والصداع. ويعرف الفتى الفرق بالسؤال: هل أقوم من هذا النشاط أنشط أم أثقل؟<\/p><\/article>", "qa": "<div class=\"tw\"><table><tr><th><b>السؤال المتوقع<\/b><\/th><th><b>تفكيكه<\/b><\/th><\/tr><tr><td><b>أمي تطلب مني طلبات أثناء مذاكرتي، فإن رفضت غضبت وإن وافقت تعطل ترتيبي، فكيف أتصرف؟<\/b><\/td><td>بر الوالدة مفتاح بركة الوقت. تصرف بلباقة: ابتسم وقل «سأنفذ ما تريدين فوراً»، وجدول وقتك بحيث تُقضى حاجات البيت قبل المذاكرة العميقة أو بعدها.<\/td><\/tr><tr><td><b>أشعر بذنب إن استرحت ولعبت مع أصدقائي وورائي مواد متراكمة، فهل الترويح حرام؟<\/b><\/td><td>الترويح ليس حراماً. المشكلة في غياب الترتيب. فإذا أديت مذاكرة مركزة فساعة الترويح بعدها مأجورة ومريحة للضمير. الخلل أن تروّح هرباً من المذاكرة.<\/td><\/tr><tr><td><b>كيف أحمي نفسي من الاحتراق النفسي قبل الامتحانات؟<\/b><\/td><td>بالحفاظ على أركان التوازن: نوم كافٍ (نحو سبع ساعات)، والمحافظة على الفرائض، وعشرين دقيقة مشي أو رياضة، والجلوس مع الأسرة. وإهمال هذه الأركان سبب مباشر لإجهاد الدماغ وعجزه عن الاستيعاب.<\/td><\/tr><\/table><\/div>", "radar": "<p class=\"\"><b>مؤشرات الخطر:<\/b> قلة النوم الشديدة، وعزلة عن الأسرة، وغضب عند أي مقاطعة، وصداع وقلق قبل الامتحانات، أو في المقابل غرق في الترفيه وإهمال الدراسة والعبادة.<\/p><p class=\"\"><b>بروتوكول التدخل:<\/b><\/p><p class=\"step\"><b>1. <\/b>تحدث معه عن حاله أولاً، لا عن درجاته: كيف نومك؟ كيف علاقتك بأسرتك؟<\/p><p class=\"step\"><b>2. <\/b>اتفق معه على قرار صغير يعيد التوازن (نوم، أو جلسة مع الأسرة، أو مشي).<\/p><p class=\"step\"><b>3. <\/b>إن ظهرت أعراض قلق حاد فأخبر أسرته بلطف وأشركهم في الحل.<\/p>", "actT": "«مختبر رسم عجلة الحياة»  نشاط تقييمي", "act": "<p class=\"step\"><b>1. التقييم:<\/b> يقيم كل فتى واقعه الحالي من 1 إلى 10 في القطاعات الأربعة: العبادة، والدراسة، والأهل، والصحة والترويح.<\/p><p class=\"step\"><b>2. الرسم:<\/b> يصل بين النقاط ليرى شكل العجلة: هل تسير بسلاسة أم تتعثر؟<\/p><p class=\"step\"><b>3. القرارات:<\/b> يكتب قرارين تصحيحيين فوريين لرفع القطاع الأكثر إهمالاً.<\/p><p class=\"step\"><b>4. دراسة حالة:<\/b> باسم (17 سنة) نابغ، وضع لنفسه جدولاً حديدياً: تسع ساعات مذاكرة متواصلة، وباب مغلق بالمفتاح، ونوم أربع ساعات. وحين طلبت منه أمه الجلوس مع الأسرة عشر دقائق صاح: «أنتم تدمرون مستقبلي!». وقبل الامتحانات بأسبوعين أصيب بنوبات ذعر وصداع مزمن وعجز عن قراءة صفحة، ورفض دخول الامتحانات. تحلل المجموعات: أي العجلات أفرغها؟ وكيف نعيد التوازن؟<\/p><p class=\"step\"><b>5. الاعتراض:<\/b> أحد الطلاب يدافع عن «الانقطاع التام للمذاكرة وإلغاء الحياة الاجتماعية»، وتناقشه المجموعات.<\/p><div class=\"tw\"><table><tr><th colspan=\"2\"><b>بطاقة: عجلة حياتي<\/b><\/th><\/tr><tr><td><b>تقييم العبادة (من 10)<\/b><\/td><td>........<\/td><\/tr><tr><td><b>تقييم الدراسة (من 10)<\/b><\/td><td>........<\/td><\/tr><tr><td><b>تقييم الأهل (من 10)<\/b><\/td><td>........<\/td><\/tr><tr><td><b>تقييم الصحة والترويح (من 10)<\/b><\/td><td>........<\/td><\/tr><tr><td><b>القطاع الأكثر إهمالاً<\/b><\/td><td>............................<\/td><\/tr><tr><td><b>قراراي التصحيحيان<\/b><\/td><td>1. ............ 2. ............<\/td><\/tr><tr><td><b>عهد الفتى المتزن<\/b><\/td><td>«أنا شاب مسلم متزن، أعطي كل ذي حق حقه»<\/td><\/tr><\/table><\/div>", "week": "<p class=\"\"><b>جلسة الأسرة:<\/b> يخصص الطالب ثلاثين دقيقة يومياً من المؤانسة مع أهله دون هاتف.<\/p><p class=\"\"><b>الحركة والراحة:<\/b> يمارس نشاطاً بدنياً أو نزهة مباحة ثلاث مرات هذا الأسبوع.<\/p><p class=\"\"><b>تتبع التوازن:<\/b> يضع علامة ✓ كل يوم عند الوفاء بالحقوق الأربعة: الله، والنفس، والأهل، والدراسة.<\/p><p class=\"\"><b>جسر إلى اللقاء الخامس عشر:<\/b> وللحياة مورد عملي نتعلم إدارته مبكراً: المال. وهذا موضوع «الوعي المالي المبكر».<\/p>", "kq": "الدراسة، والعبادة، والأهل، والترويح", "brief": "<div class=\"plan\"><span>اقتراح لتوزيع الوقت (١٠–١٥ د)<\/span><b>افتتاح ٣<\/b><b>محاور ٥<\/b><b>حوار ٢<\/b><b>نشاط ٣<\/b><b>ختام ٢<\/b><\/div><section class=\"bs\"><h3>١ · الافتتاح: السيارة ذات العجلة المعوجة<\/h3><p class=\"\">تخيل سيارة تسير على أربع عجلات: عجلة العبادة والروح، وعجلة الدراسة والمهارات، وعجلة الأهل والبر، وعجلة الصحة والترويح. <b>سيف (17 سنة)<\/b> نفخ العجلة الدراسية بنسبة مئة بالمئة، لكن عجلة الأهل مفرغة تماماً وعجلة الراحة مكسورة. فلما انطلقت سيارته على الطريق السريع بدأت ترتج بعنف، وقبل الاختبارات بأسبوع اصطدمت بالحائط وأصيب باحتراق نفسي. أما <b>عامر (17 سنة)<\/b> فنفخ عجلة الترويح والألعاب بنسبة مئة بالمئة وأفرغ العجلات الثلاث الأخرى، فانقلبت سيارته وتدحرجت إلى قاع الفشل.<\/p><p class=\"\"><b>أسئلة الاستثارة:<\/b><\/p><p class=\"\">أي السيارتين أخطر؟ ولماذا لم تنفع العجلة المنفوخة بالكامل؟<\/p><p class=\"\">أي عجلة في سيارتك أنت تحتاج إلى نفخ؟<\/p><\/section><section class=\"bs\"><h3>٢ · المحاور<\/h3><article class=\"pt\"><h4><span>١<\/span>المنهج القرآني للتوازن<\/h4><p class=\"ayah\">﴿وَابْتَغِ فِيمَا آتَاكَ اللَّهُ الدَّارَ الْآخِرَةَ ۖ وَلَا تَنسَ نَصِيبَكَ مِنَ الدُّنْيَا ۖ وَأَحْسِن كَمَا أَحْسَنَ اللَّهُ إِلَيْكَ﴾ [القصص: 77]<\/p><p class=\"g\">إعطاء الجسد والراحة حقهما جزء من الشكر.<\/p><details class=\"more\"><summary>للتوسع<\/summary><p class=\"\">رسمت الآية منهجاً متكاملاً: الغاية الكبرى للآخرة، ثم رعاية نصيب النفس والبدن والدنيا بغير إفراط ولا تفريط، ثم الإحسان إلى الناس. فلا يُعد الاهتمام بالصحة والراحة مناقضاً للتدين، بل هو جزء من الشكر.<\/p><\/details><\/article><article class=\"pt\"><h4><span>٢<\/span>حق الله مقرون بحق الوالدين<\/h4><p class=\"ayah\">﴿وَقَضَىٰ رَبُّكَ أَلَّا تَعْبُدُوا إِلَّا إِيَّاهُ وَبِالْوَالِدَيْنِ إِحْسَانًا﴾ [الإسراء: 23]<\/p><p class=\"g\">لا يجوز طغيان المذاكرة أو العمل على بر الوالدين ومؤانستهم.<\/p><details class=\"more\"><summary>للتوسع<\/summary><p class=\"\">اقتران حق الله بحق الوالدين دليل على أن التوازن يقتضي ألا تطغى دراسة ولا عمل على رعاية البيت وبر الأسرة. فمن أخذ الوقت كله لمذاكرته وترك والديه فقد أخل بميزان الشرع.<\/p><\/details><\/article><article class=\"pt\"><h4><span>٣<\/span>التوازن فريضة شرعية<\/h4><p class=\"g\">حق ا »... أقرها النبي ﷺ (رواه البخاري) الانقطاع لجانب واحد خلل.<\/p><details class=\"more\"><summary>للتوسع<\/summary><p class=\"\">آخى النبي ﷺ بين سلمان وأبي الدرداء رضي الله عنهما، فزار سلمان أبا الدرداء فرأى أم الدرداء مبتذلة، فقال لها: ما شأنك؟ قالت: أخوك أبو الدرداء ليس له حاجة في الدنيا. ثم بات عنده، وكان أبو الدرداء يريد أن يقوم الليل، فقال له سلمان: نم. فلما كان آخر الليل قال: قم الآن. فصليا. ثم قال له سلمان: «إِنَّ لِرَبِّكَ عَلَيْكَ حَقًّا، وَلِنَفْسِكَ عَلَيْكَ حَقًّا، وَلأَهْلِكَ عَلَيْكَ حَقًّا، فَأَعْطِ كُلَّ ذِي حَقٍّ حَقَّهُ». فأتى أبو الدرداء النبي ﷺ فذكر ذلك له، فقال النبي ﷺ: «صَدَقَ سَلْمَانُ» رواه البخاري. وفي ذلك إقرار نبوي صريح بأن طغيان جانب على آخر، حتى في نوافل العبادة، خلل يرفضه الدين.<\/p><\/details><\/article><article class=\"pt\"><h4><span>٤<\/span>الترويح النظيف<\/h4><p class=\"g\">الترويح المباح يعيد شحن الطاقة، بعكس الاستنزاف الرقمي الذي يهدرها.<\/p><details class=\"more\"><summary>للتوسع<\/summary><p class=\"\">الترويح النظيف (الرياضة، لقاء الأصدقاء الصالحين، النزهة المباحة) يعيد شحن الطاقة وينعش الذهن. أما السهر الطويل على الشاشات فاستنزاف يورث الخمول والصداع. ويعرف الفتى الفرق بالسؤال: هل أقوم من هذا النشاط أنشط أم أثقل؟<\/p><\/details><\/article><\/section><section class=\"bs\"><h3>٣ · سؤال للحوار<\/h3><p class=\"big\">أي حق من حقوقك عليك مظلوم الآن: الله، نفسك، أهلك؟<\/p><\/section><section class=\"bs\"><h3>٤ · نشاط تطبيقي<\/h3><p class=\"big\">ارسم «عجلة الحياة» وقيم كل جانب من عشرة.<\/p><\/section><section class=\"bs\"><h3>أسئلة قد تُطرح<\/h3><details class=\"more\"><summary><b>أمي تطلب مني طلبات أثناء مذاكرتي، فإن رفضت غضبت وإن وافقت تعطل ترتيبي، فكيف أتصرف؟<\/b><\/summary><p>بر الوالدة مفتاح بركة الوقت. تصرف بلباقة: ابتسم وقل «سأنفذ ما تريدين فوراً»، وجدول وقتك بحيث تُقضى حاجات البيت قبل المذاكرة العميقة أو بعدها.<\/p><\/details><details class=\"more\"><summary><b>أشعر بذنب إن استرحت ولعبت مع أصدقائي وورائي مواد متراكمة، فهل الترويح حرام؟<\/b><\/summary><p>الترويح ليس حراماً. المشكلة في غياب الترتيب. فإذا أديت مذاكرة مركزة فساعة الترويح بعدها مأجورة ومريحة للضمير. الخلل أن تروّح هرباً من المذاكرة.<\/p><\/details><\/section><section class=\"bs warn\"><h3>رادار الحماية<\/h3><p><b>مؤشرات الخطر:<\/b> قلة النوم الشديدة، وعزلة عن الأسرة، وغضب عند أي مقاطعة، وصداع وقلق قبل الامتحانات، أو في المقابل غرق في الترفيه وإهمال الدراسة والعبادة.<\/p><small>البروتوكول كاملاً في تبويب «الكامل».<\/small><\/section><section class=\"bs\"><h3>٥ · رحلة الأسبوع<\/h3><p class=\"\"><b>جلسة الأسرة:<\/b> يخصص الطالب ثلاثين دقيقة يومياً من المؤانسة مع أهله دون هاتف.<\/p><p class=\"\"><b>الحركة والراحة:<\/b> يمارس نشاطاً بدنياً أو نزهة مباحة ثلاث مرات هذا الأسبوع.<\/p><p class=\"\"><b>تتبع التوازن:<\/b> يضع علامة ✓ كل يوم عند الوفاء بالحقوق الأربعة: الله، والنفس، والأهل، والدراسة.<\/p><p class=\"\"><b>جسر إلى اللقاء الخامس عشر:<\/b> وللحياة مورد عملي نتعلم إدارته مبكراً: المال. وهذا موضوع «الوعي المالي المبكر».<\/p><\/section>", "slides": ["<div class=\"cn\">14<\/div><h2>الموازنة الحياتية<\/h2><p class=\"q\">كيف نوازن بين الدراسة، العبادة، الأهل، والترويح؟<\/p>", "<small>إضاءة استهلالية<\/small><h2>السيارة ذات العجلة المعوجة<\/h2><ul><li class=\"frag\">أي السيارتين أخطر؟ ولماذا لم تنفع العجلة المنفوخة بالكامل؟<\/li><li class=\"frag\">أي عجلة في سيارتك أنت تحتاج إلى نفخ؟<\/li><\/ul>", "<small>1<\/small><h2>المنهج القرآني للتوازن<\/h2><p class=\"ayah\">﴿وَابْتَغِ فِيمَا آتَاكَ اللَّهُ الدَّارَ الْآخِرَةَ ۖ وَلَا تَنسَ نَصِيبَكَ مِنَ الدُّنْيَا ۖ وَأَحْسِن كَمَا أَحْسَنَ اللَّهُ إِلَيْكَ﴾ [القصص: 77]<\/p><p class=\"g frag\">إعطاء الجسد والراحة حقهما جزء من الشكر.<\/p>", "<small>2<\/small><h2>حق الله مقرون بحق الوالدين<\/h2><p class=\"ayah\">﴿وَقَضَىٰ رَبُّكَ أَلَّا تَعْبُدُوا إِلَّا إِيَّاهُ وَبِالْوَالِدَيْنِ إِحْسَانًا﴾ [الإسراء: 23]<\/p><p class=\"g frag\">لا يجوز طغيان المذاكرة أو العمل على بر الوالدين ومؤانستهم.<\/p>", "<small>3<\/small><h2>التوازن فريضة شرعية<\/h2><p class=\"g frag\">حق ا »... أقرها النبي ﷺ (رواه البخاري) الانقطاع لجانب واحد خلل.<\/p>", "<small>4<\/small><h2>الترويح النظيف<\/h2><p class=\"g frag\">الترويح المباح يعيد شحن الطاقة، بعكس الاستنزاف الرقمي الذي يهدرها.<\/p>", "<small>سؤال للحوار<\/small><h2 class=\"big\">أي حق من حقوقك عليك مظلوم الآن: الله، نفسك، أهلك؟<\/h2>", "<small>نشاط تطبيقي<\/small><h2 class=\"big\">ارسم «عجلة الحياة» وقيم كل جانب من عشرة.<\/h2>", "<small>سؤال وبرهان<\/small><details class=\"frag\"><summary><b>أمي تطلب مني طلبات أثناء مذاكرتي، فإن رفضت غضبت وإن وافقت تعطل ترتيبي، فكيف أتصرف؟<\/b><\/summary><p>بر الوالدة مفتاح بركة الوقت. تصرف بلباقة: ابتسم وقل «سأنفذ ما تريدين فوراً»، وجدول وقتك بحيث تُقضى حاجات البيت قبل المذاكرة العميقة أو بعدها.<\/p><\/details><details class=\"frag\"><summary><b>أشعر بذنب إن استرحت ولعبت مع أصدقائي وورائي مواد متراكمة، فهل الترويح حرام؟<\/b><\/summary><p>الترويح ليس حراماً. المشكلة في غياب الترتيب. فإذا أديت مذاكرة مركزة فساعة الترويح بعدها مأجورة ومريحة للضمير. الخلل أن تروّح هرباً من المذاكرة.<\/p><\/details><details class=\"frag\"><summary><b>كيف أحمي نفسي من الاحتراق النفسي قبل الامتحانات؟<\/b><\/summary><p>بالحفاظ على أركان التوازن: نوم كافٍ (نحو سبع ساعات)، والمحافظة على الفرائض، وعشرين دقيقة مشي أو رياضة، والجلوس مع الأسرة. وإهمال هذه الأركان سبب مباشر لإجهاد الدماغ وعجزه عن الاستيعاب.<\/p><\/details>", "<small>ميدان التطبيق<\/small><h2>«مختبر رسم عجلة الحياة»  نشاط تقييمي<\/h2><ol><li class=\"frag\">1. التقييم: يقيم كل فتى واقعه الحالي من 1 إلى 10 في القطاعات الأربعة: العبادة، والدراسة، والأهل، والصحة والترويح.<\/li><li class=\"frag\">2. الرسم: يصل بين النقاط ليرى شكل العجلة: هل تسير بسلاسة أم تتعثر؟<\/li><li class=\"frag\">3. القرارات: يكتب قرارين تصحيحيين فوريين لرفع القطاع الأكثر إهمالاً.<\/li><li class=\"frag\">4. دراسة حالة: باسم (17 سنة) نابغ، وضع لنفسه جدولاً حديدياً: تسع ساعات مذاكرة متواصلة، وباب مغلق بالمفتاح، ونوم أربع ساعات.<\/li><li class=\"frag\">5. الاعتراض: أحد الطلاب يدافع عن «الانقطاع التام للمذاكرة وإلغاء الحياة الاجتماعية»، وتناقشه المجموعات.<\/li><\/ol>", "<small>رحلة الأسبوع<\/small><ul><li class=\"frag\"><b>جلسة الأسرة:<\/b> يخصص الطالب ثلاثين دقيقة يومياً من المؤانسة مع أهله دون هاتف.<\/li><li class=\"frag\"><b>الحركة والراحة:<\/b> يمارس نشاطاً بدنياً أو نزهة مباحة ثلاث مرات هذا الأسبوع.<\/li><li class=\"frag\"><b>تتبع التوازن:<\/b> يضع علامة ✓ كل يوم عند الوفاء بالحقوق الأربعة: الله، والنفس، والأهل، والدراسة.<\/li><li class=\"frag\"><b>جسر إلى اللقاء الخامس عشر:<\/b> وللحياة مورد عملي نتعلم إدارته مبكراً: المال. وهذا موضوع «الوعي المالي المبكر».<\/li><\/ul>"], "n": 14, "u": 2, "title": "الموازنة الحياتية", "q": "كيف نوازن بين الدراسة، العبادة، الأهل، والترويح؟", "dqq": "أي حق من حقوقك عليك مظلوم الآن: الله، نفسك، أهلك؟", "pact": "ارسم «عجلة الحياة» وقيم كل جانب من عشرة."}, {"summary": "<p class=\"\">المال أول مورد يتحمل الفتى مسؤولية إدارته، وإن قل مصروفه. وهو في الوقت نفسه محاصر بإعلانات تُصمَّم لتحويل الرغبة إلى حاجة والحاجة إلى ضرورة. يتعلم الفتى في هذا اللقاء أن المال أمانة يُسأل عنها، وأن الاعتدال بين الإسراف والتقتير منهج قرآني، وأن للوعي المالي أدوات بسيطة: التمييز بين الحاجة والرغبة، وتوزيع المصروف، وانتظار مدة قبل الشراء الاندفاعي.<\/p><p class=\"\">يدرك أن الإنفاق مسؤولية أمام الله لا حرية مطلقة.<\/p><p class=\"\">يرتب مشترياته بين الضروري والمفيد والكمالي.<\/p><p class=\"\">يطبق قاعدة توزيع المصروف وقاعدة الانتظار قبل الشراء.<\/p><div class=\"tw\"><table><tr><th><b>المهارة<\/b><\/th><th><b>معناها العملي<\/b><\/th><\/tr><tr><td><b>الاقتصاد الشخصي<\/b><\/td><td>يضع ميزانية بسيطة لمصروفه ويلتزم بها<\/td><\/tr><tr><td><b>مقاومة الاستهلاك الاندفاعي<\/b><\/td><td>يتوقف قبل الشراء ويسأل: هل أحتاجه فعلاً؟<\/td><\/tr><tr><td><b>المسؤولية المالية<\/b><\/td><td>يعامل المال كأمانة ويقدّم الإنفاق في الخير<\/td><\/tr><\/table><\/div>", "kit": "<p class=\"\"><b>ما يعيشه الفتى:<\/b> يتعرض الفتى لضغط الإعلانات وصور الأقران بالملابس والأجهزة الجديدة، وللمشتريات داخل الألعاب بنقرة واحدة. وقد يتوهم أن قيمته مرتبطة بما يملك.<\/p><p class=\"\"><b>لا تحرّم عليه الإنفاق:<\/b> الغاية ضبط الإنفاق لا حرمان النفس. فللنفس حق في التمتع المعتدل بالطيبات.<\/p><p class=\"\"><b>اعتمد الأرقام الصغيرة:<\/b> لا تتحدث عن ميزانيات الأسر الكبيرة، بل عن مصروفه الشخصي وإن كان قليلاً.<\/p><p class=\"\"><b>احذر مقارنة الأسر:<\/b> بعض الطلاب من أسر ميسورة وبعضهم من أسر بسيطة، فلا تحرج أحداً ولا تطلب أرقاماً شخصية علنية.<\/p><p class=\"\"><b>اذكر الصدقة:<\/b> اجعل جزءاً من الحديث عن العطاء كي لا يتحول الوعي المالي إلى بخل.<\/p>", "hookT": "الحذاء المثالي", "hook": "<p class=\"\"><b>مروان (16 سنة)<\/b> يملك ثلاثة أحذية رياضية في خزانته. صادف إعلاناً مبهراً لحذاء جديد من علامة شهيرة بثمن باهظ، وقد ظهر في صورة مؤثر مشهور. بدأ الإعلان يطارده في كل تطبيق، ثم قال له صديقه: «ما شاء الله، أنت الآن في المرحلة الثانوية ولا تلبس هذا؟!». شعر مروان بقلق وحاجة ملحة، فجمع مصروف أربعة أشهر واشتراه. وبعد يومين شعر بالفتور، ورأى إعلاناً لموديل أحدث فكرر القلق، بينما هو لا يملك ثمن كتاب يحتاجه.<\/p><p class=\"\"><b>أسئلة الاستثارة:<\/b><\/p><p class=\"\">هل كان مروان بحاجة فعلاً إلى هذا الحذاء؟ ومن الذي صنع الحاجة في عقله؟<\/p><p class=\"\">ما الذي تغير في يوم واحد حتى ذهبت متعة الشراء؟<\/p>", "pts": "<article class=\"pt\"><h4><span>أولاً<\/span>الاعتدال منهج الله في الإنفاق<\/h4><p class=\"ayah\">﴿وَالَّذِينَ إِذَا أَنفَقُوا لَمْ يُسْرِفُوا وَلَمْ يَقْتُرُوا وَكَانَ بَيْنَ ذَٰلِكَ قَوَامًا﴾ [الفرقان: 67]<\/p><p class=\"\">رسمت الآية صفة عباد الرحمن في الإنفاق: لا إسراف يبدد المال ويغذي الاستهلاك، ولا تقتير يحرم النفس والأهل من حقوقهم. و«القوام» هو الوسط الذي تستقيم عليه الأمور. وقال تعالى في الجانبين: ﴿وَلَا تَجْعَلْ يَدَكَ مَغْلُولَةً إِلَىٰ عُنُقِكَ وَلَا تَبْسُطْهَا كُلَّ الْبَسْطِ فَتَقْعُدَ مَلُومًا مَّحْسُورًا﴾ [الإسراء: 29].<\/p><\/article><article class=\"pt\"><h4><span>ثانياً<\/span>تحذير شديد من التبذير<\/h4><p class=\"ayah\">﴿إِنَّ الْمُبَذِّرِينَ كَانُوا إِخْوَانَ الشَّيَاطِينِ ۖ وَكَانَ الشَّيْطَانُ لِرَبِّهِ كَفُورًا﴾ [الإسراء: 27]<\/p><p class=\"\">جعل القرآن المبذر قريباً من الشيطان في الوصف، لأن التبذير كفران للنعمة وضياع للفرصة. والمقصود بالتبذير الإنفاق في غير حقه، وإن كان المبلغ يسيراً.<\/p><\/article><article class=\"pt\"><h4><span>ثالثاً<\/span>المال أمانة وسؤال<\/h4><p class=\"had\">قال رسول الله ﷺ: «لاَ تَزُولُ قَدَمَا عَبْدٍ يَوْمَ القِيَامَةِ حَتَّى يُسْأَلَ عَنْ أَرْبَعٍ: ... وَعَنْ مَالِهِ مِنْ أَيْنَ اكْتَسَبَهُ وَفِيمَ أَنْفَقَهُ» رواه الترمذي. فكل ريال يمر في يدك سؤال: من أين جاء؟ وفيم ذهب؟ والفتى يتعلم هذه الأمانة مبكراً بمصروفه الصغير.<\/p><\/article><article class=\"pt\"><h4><span>رابعاً<\/span>نظرة الإسلام الصحيحة للمال<\/h4><p class=\"\">الإسلام لا يذم المال بل يذم عبودية المال. قال ﷺ: «نِعْمَ الْمَالُ الصَّالِحُ لِلرَّجُلِ الصَّالِحِ» رواه أحمد. فالمال وسيلة تعين على العبادة وبناء الأسرة وخدمة الأمة. وفي الإنفاق قال ﷺ: «كُلُوا وَاشْرَبُوا وَالْبَسُوا وَتَصَدَّقُوا فِي غَيْرِ إِسْرَافٍ وَلاَ مَخِيلَةٍ» رواه النسائي وابن ماجه. فالتمتع بالطيبات مباح بشرطين: ألا يبلغ الإسراف، ولا يرافقه كبر.<\/p><\/article><article class=\"pt\"><h4><span>خامساً<\/span>نماذج من السيرة<\/h4><p class=\"\"><b>عبد الرحمن بن عوف رضي الله عنه:<\/b> لما هاجر إلى المدينة آخى النبي ﷺ بينه وبين سعد بن الربيع الذي عرض عليه نصف ماله، فقال له: «بَارَكَ اللَّهُ لَكَ فِي أَهْلِكَ وَمَالِكَ، دُلَّنِي عَلَى السُّوقِ» رواه البخاري. فرفض العطاء وبدأ بالعمل والتجارة حتى صار من كبار الأغنياء وأنفق في سبيل الله. وفي القصة ترفع عن المسألة وجِدّ في الكسب.<\/p><p class=\"\"><b>عثمان بن عفان رضي الله عنه:<\/b> اشترى بئر رومة وجعلها لعامة المسلمين بعد أن قال النبي ﷺ: «مَنْ يَشْتَرِي بِئْرَ رُومَةَ فَيَكُونُ دَلْوُهُ فِيهَا كَدِلاَءِ الْمُسْلِمِينَ، وَلَهُ بِهَا خَيْرٌ فِي الْجَنَّةِ؟» رواه الترمذي. وهنا يتحول المال إلى صدقة جارية.<\/p><\/article><article class=\"pt\"><h4><span>سادساً<\/span>هرم الإنفاق: الحاجة والرغبة<\/h4><div class=\"tw\"><table><tr><th><b>المستوى<\/b><\/th><th><b>تعريفه<\/b><\/th><th><b>مثال<\/b><\/th><\/tr><tr><td><b>ضروري<\/b><\/td><td>لا تستقيم حياتي ودراستي بدونه<\/td><td>الكتب، الغذاء، احتياج الصحة<\/td><\/tr><tr><td><b>مفيد<\/b><\/td><td>يرفع جودة حياتي وأستطيع الاستغناء عنه مؤقتاً<\/td><td>حذاء رياضي قديم استُبدل بجديد، أداة تعليمية<\/td><\/tr><tr><td><b>كمالي<\/b><\/td><td>رغبة تُلبّى بعد استيفاء ما قبلها<\/td><td>موديل أحدث، تطبيق ترفيهي مدفوع<\/td><\/tr><\/table><\/div><\/article><article class=\"pt\"><h4><span>سابعاً<\/span>قاعدة توزيع المصروف<\/h4><p class=\"\">قاعدة بسيطة تصلح للمبتدئين: خمسون بالمئة للضروريات، وثلاثون بالمئة للرغبات المباحة، وعشرون بالمئة للادخار والصدقة. فإذا كان مصروف الفتى خمسين ريالاً شهرياً: خمسة وعشرون للضروريات، وخمسة عشر للرغبات، وعشرة تُدّخر أو يُتصدق بجزء منها. وهذا التوزيع يعلّمه الانضباط لا الحرمان.<\/p><\/article><article class=\"pt\"><h4><span>ثامناً<\/span>قاعدة الثلاثين يوماً والإعلانات<\/h4><p class=\"\">أمام أي رغبة مفاجئة اكتب اسم الغرض وتاريخ اليوم، وأجّل القرار ثلاثين يوماً. فإن بقيت الحاجة ملحة بعد المدة فلتشترها، وإلا فقد كانت وهماً صنعه إعلان. والإعلانات تُصمَّم لتثير شعوراً بالنقص يزول بالشراء، وتستهدف المراهق خاصة لأنه أكثر تأثراً بالمقارنة. فاسأل نفسك عند كل إعلان: من المستفيد من إقناعي؟<\/p><\/article>", "qa": "<div class=\"tw\"><table><tr><th><b>السؤال المتوقع<\/b><\/th><th><b>تفكيكه<\/b><\/th><\/tr><tr><td><b>أنفق من مالي وليس من مال أحد، فلماذا أُحاسَب؟<\/b><\/td><td>المال في الإسلام أمانة وابتلاء. والمستخلَف عليه لا يملك حرية مطلقة، وقد أخبر النبي ﷺ أنه يُسأل عن ماله من أين اكتسبه وفيم أنفقه.<\/td><\/tr><tr><td><b>ألا يعد الادخار وتقنين المصروف بخلاً وحرماناً من الاستمتاع بالحياة؟<\/b><\/td><td>البخل منع الحقوق الواجبة. أما الادخار فتخطيط ذكي، وقد قال ﷺ: «كلوا واشربوا والبسوا وتصدقوا في غير إسراف ولا مخيلة». فالموازنة تتيح لك الاستمتاع براحة الضمير وتجنب الندم.<\/td><\/tr><tr><td><b>أصدقائي يشترون الأجهزة والملابس الغالية ويسخرون مني إن لم أفعل<\/b><\/td><td>هذا إحساس بالنقص صنعته المقارنة والإعلانات. قيمتك في دينك وخلقك وعقلك لا في ما تحمله، ومن يقيّمك بملابسك فصحبته لا تنفعك في الشدائد.<\/td><\/tr><\/table><\/div>", "radar": "<p class=\"\"><b>مؤشرات الخطر:<\/b> الشراء الاندفاعي المتكرر، وإنفاق المصروف كله في أيام، والاقتراض من الأصدقاء، والإنفاق داخل الألعاب بلا حساب، وربط القيمة الذاتية بالماركات.<\/p><p class=\"\"><b>بروتوكول التدخل:<\/b><\/p><p class=\"step\"><b>1. <\/b>اسأله بلطف: أين ذهب مصروفك هذا الشهر؟ وماذا شعرت بعد الشراء؟<\/p><p class=\"step\"><b>2. <\/b>اقترح عليه تسجيل نفقاته أسبوعاً واحداً بلا حكم، ليرى الصورة بنفسه.<\/p><p class=\"step\"><b>3. <\/b>إن كان الإنفاق في ألعاب أو تطبيقات فاقترح تقييد البطاقة أو حذفها واستشر أسرته.<\/p>", "actT": "«ورشة ميزانية الفتى وصيد الإعلانات»  نشاط حسابي وتحليلي", "act": "<p class=\"step\"><b>1. الميزانية:<\/b> يضع كل طالب رقماً افتراضياً لمصروفه الشهري (إن لم يرغب في ذكر رقمه الحقيقي)، ويوزعه بقاعدة 50 / 30 / 20.<\/p><p class=\"step\"><b>2. الفرز:<\/b> يستخرج من الإنفاق الأخير ثلاثة بنود، ويصنفها: ضروري أو مفيد أو كمالي.<\/p><p class=\"step\"><b>3. صيد الإعلانات:<\/b> يحلل كل فريق إعلاناً حقيقياً أو مصمماً: ما الشعور الذي يثيره؟ وما الحيلة النفسية فيه؟<\/p><p class=\"step\"><b>4. دراسة حالة:<\/b> أمجد (17 سنة) يتقاضى مصروفاً شهرياً، وينفقه في أول أسبوع على المطاعم والمشتريات داخل الألعاب، ثم يقترض من أصدقائه آخر الشهر ويتأخر في السداد فيتوتر. تحلل المجموعات: أين الخلل؟ وما ميزانيته البديلة؟<\/p><p class=\"step\"><b>5. الاعتراض:<\/b> أحد الطلاب يدافع عن «الإنفاق كله اليوم، فالمستقبل مجهول»، وتناقشه المجموعات.<\/p><div class=\"tw\"><table><tr><th colspan=\"2\"><b>بطاقة: ميزانية الفتى<\/b><\/th><\/tr><tr><td><b>مصروفي الشهري<\/b><\/td><td>............<\/td><\/tr><tr><td><b>50% للضروريات<\/b><\/td><td>............ (البنود: ............)<\/td><\/tr><tr><td><b>30% للرغبات المباحة<\/b><\/td><td>............ (البنود: ............)<\/td><\/tr><tr><td><b>20% للادخار والصدقة<\/b><\/td><td>ادخار: ............ صدقة: ............<\/td><\/tr><tr><td><b>غرض سأطبق عليه قاعدة الثلاثين يوماً<\/b><\/td><td>............................ (التاريخ: ............)<\/td><\/tr><\/table><\/div>", "week": "<p class=\"\"><b>دفتر المصروف:<\/b> يدوّن الطالب كل ما أنفقه هذا الأسبوع بلا استثناء.<\/p><p class=\"\"><b>صيد إعلان:<\/b> يلتقط إعلاناً واحداً أثّر فيه ويحلل الحيلة النفسية فيه.<\/p><p class=\"\"><b>صدقة صغيرة:<\/b> يخصص جزءاً من مصروفه لصدقة منتظمة مهما قلّ.<\/p><p class=\"\"><b>جسر إلى اللقاء السادس عشر:<\/b> وبعد أن تعلمنا الأولويات والقرار والتوازن والمال، نجمعها في وثيقة واحدة: «الميثاق الزمني الشخصي».<\/p>", "kq": "إدارة المصروف والتمييز بين الحاجة والرغبة", "brief": "<div class=\"plan\"><span>اقتراح لتوزيع الوقت (١٠–١٥ د)<\/span><b>افتتاح ٣<\/b><b>محاور ٥<\/b><b>حوار ٢<\/b><b>نشاط ٣<\/b><b>ختام ٢<\/b><\/div><section class=\"bs\"><h3>١ · الافتتاح: الحذاء المثالي<\/h3><p class=\"\"><b>مروان (16 سنة)<\/b> يملك ثلاثة أحذية رياضية في خزانته. صادف إعلاناً مبهراً لحذاء جديد من علامة شهيرة بثمن باهظ، وقد ظهر في صورة مؤثر مشهور. بدأ الإعلان يطارده في كل تطبيق، ثم قال له صديقه: «ما شاء الله، أنت الآن في المرحلة الثانوية ولا تلبس هذا؟!». شعر مروان بقلق وحاجة ملحة، فجمع مصروف أربعة أشهر واشتراه. وبعد يومين شعر بالفتور، ورأى إعلاناً لموديل أحدث فكرر القلق، بينما هو لا يملك ثمن كتاب يحتاجه.<\/p><p class=\"\"><b>أسئلة الاستثارة:<\/b><\/p><p class=\"\">هل كان مروان بحاجة فعلاً إلى هذا الحذاء؟ ومن الذي صنع الحاجة في عقله؟<\/p><p class=\"\">ما الذي تغير في يوم واحد حتى ذهبت متعة الشراء؟<\/p><\/section><section class=\"bs\"><h3>٢ · المحاور<\/h3><article class=\"pt\"><h4><span>١<\/span>الاعتدال منهج الله<\/h4><p class=\"ayah\">﴿وَالَّذِينَ إِذَا أَنفَقُوا لَمْ يُسْرِفُوا وَلَمْ يَقْتُرُوا وَكَانَ بَيْنَ ذَٰلِكَ قَوَامًا﴾ [الفرقان: 67]<\/p><p class=\"g\">الإسراف يبدد المال، والتقتير يحرم النفس.<\/p><details class=\"more\"><summary>للتوسع<\/summary><p class=\"\">رسمت الآية صفة عباد الرحمن في الإنفاق: لا إسراف يبدد المال ويغذي الاستهلاك، ولا تقتير يحرم النفس والأهل من حقوقهم. و«القوام» هو الوسط الذي تستقيم عليه الأمور. وقال تعالى في الجانبين: ﴿وَلَا تَجْعَلْ يَدَكَ مَغْلُولَةً إِلَىٰ عُنُقِكَ وَلَا تَبْسُطْهَا كُلَّ الْبَسْطِ فَتَقْعُدَ مَلُومًا مَّحْسُورًا﴾ [الإسراء: 29].<\/p><\/details><\/article><article class=\"pt\"><h4><span>٢<\/span>المال أمانة ومسؤولية<\/h4><p class=\"had\">قال رسول الله ﷺ: «لاَ تَزُولُ قَدَمَا عَبْدٍ يَوْمَ القِيَامَةِ حَتَّى يُسْأَلَ عَنْ أَرْبَعٍ: ... وَعَنْ مَالِهِ مِنْ أَيْنَ اكْتَسَبَهُ وَفِيمَ أَنْفَقَهُ» رواه الترمذي. فكل ريال يمر في يدك سؤال: من أين جاء؟ وفيم ذهب؟ والفتى يتعلم هذه الأمانة مبكراً بمصروفه الصغير.<\/p><p class=\"g\">وفيم أنفقه» (رواه الترمذي) الاستهلاك الاندفاعي تضييع للأمانة.<\/p><details class=\"more\"><summary>للتوسع<\/summary><\/details><\/article><article class=\"pt\"><h4><span>٣<\/span>التحذير من التبذير<\/h4><p class=\"ayah\">﴿إِنَّ الْمُبَذِّرِينَ كَانُوا إِخْوَانَ الشَّيَاطِينِ ۖ وَكَانَ الشَّيْطَانُ لِرَبِّهِ كَفُورًا﴾ [الإسراء: 27]<\/p><p class=\"g\">التبذير هو الإنفاق في غير حقه ولو كان مبلغا يسيرا.<\/p><details class=\"more\"><summary>للتوسع<\/summary><p class=\"\">جعل القرآن المبذر قريباً من الشيطان في الوصف، لأن التبذير كفران للنعمة وضياع للفرصة. والمقصود بالتبذير الإنفاق في غير حقه، وإن كان المبلغ يسيراً.<\/p><\/details><\/article><article class=\"pt\"><h4><span>٤<\/span>التمتع المعتدل والصدقة<\/h4><p class=\"g\">توزيع المصروف وتأجيل الرغبات الكمالية يقيك فخ الإعلانات.<\/p><\/article><\/section><section class=\"bs\"><h3>٣ · سؤال للحوار<\/h3><p class=\"big\">كم تنفق شهريا على ما تريد لا على ما تحتاج؟<\/p><\/section><section class=\"bs\"><h3>٤ · نشاط تطبيقي<\/h3><p class=\"big\">قسم مصروفك :احتياج، ادخار، صدقة، ترفيه.<\/p><\/section><section class=\"bs\"><h3>أسئلة قد تُطرح<\/h3><details class=\"more\"><summary><b>أنفق من مالي وليس من مال أحد، فلماذا أُحاسَب؟<\/b><\/summary><p>المال في الإسلام أمانة وابتلاء. والمستخلَف عليه لا يملك حرية مطلقة، وقد أخبر النبي ﷺ أنه يُسأل عن ماله من أين اكتسبه وفيم أنفقه.<\/p><\/details><details class=\"more\"><summary><b>ألا يعد الادخار وتقنين المصروف بخلاً وحرماناً من الاستمتاع بالحياة؟<\/b><\/summary><p>البخل منع الحقوق الواجبة. أما الادخار فتخطيط ذكي، وقد قال ﷺ: «كلوا واشربوا والبسوا وتصدقوا في غير إسراف ولا مخيلة». فالموازنة تتيح لك الاستمتاع براحة الضمير وتجنب الندم.<\/p><\/details><\/section><section class=\"bs warn\"><h3>رادار الحماية<\/h3><p><b>مؤشرات الخطر:<\/b> الشراء الاندفاعي المتكرر، وإنفاق المصروف كله في أيام، والاقتراض من الأصدقاء، والإنفاق داخل الألعاب بلا حساب، وربط القيمة الذاتية بالماركات.<\/p><small>البروتوكول كاملاً في تبويب «الكامل».<\/small><\/section><section class=\"bs\"><h3>٥ · رحلة الأسبوع<\/h3><p class=\"\"><b>دفتر المصروف:<\/b> يدوّن الطالب كل ما أنفقه هذا الأسبوع بلا استثناء.<\/p><p class=\"\"><b>صيد إعلان:<\/b> يلتقط إعلاناً واحداً أثّر فيه ويحلل الحيلة النفسية فيه.<\/p><p class=\"\"><b>صدقة صغيرة:<\/b> يخصص جزءاً من مصروفه لصدقة منتظمة مهما قلّ.<\/p><p class=\"\"><b>جسر إلى اللقاء السادس عشر:<\/b> وبعد أن تعلمنا الأولويات والقرار والتوازن والمال، نجمعها في وثيقة واحدة: «الميثاق الزمني الشخصي».<\/p><\/section>", "slides": ["<div class=\"cn\">15<\/div><h2>الوعي المالي المبكر<\/h2><p class=\"q\">كيف ندير المال ونميز بين الحاجة والرغبة؟<\/p>", "<small>إضاءة استهلالية<\/small><h2>الحذاء المثالي<\/h2><ul><li class=\"frag\">هل كان مروان بحاجة فعلاً إلى هذا الحذاء؟ ومن الذي صنع الحاجة في عقله؟<\/li><li class=\"frag\">ما الذي تغير في يوم واحد حتى ذهبت متعة الشراء؟<\/li><\/ul>", "<small>1<\/small><h2>الاعتدال منهج الله<\/h2><p class=\"ayah\">﴿وَالَّذِينَ إِذَا أَنفَقُوا لَمْ يُسْرِفُوا وَلَمْ يَقْتُرُوا وَكَانَ بَيْنَ ذَٰلِكَ قَوَامًا﴾ [الفرقان: 67]<\/p><p class=\"g frag\">الإسراف يبدد المال، والتقتير يحرم النفس.<\/p>", "<small>2<\/small><h2>المال أمانة ومسؤولية<\/h2><p class=\"had lg\">قال رسول الله ﷺ: «لاَ تَزُولُ قَدَمَا عَبْدٍ يَوْمَ القِيَامَةِ حَتَّى يُسْأَلَ عَنْ أَرْبَعٍ: ... وَعَنْ مَالِهِ مِنْ أَيْنَ اكْتَسَبَهُ وَفِيمَ أَنْفَقَهُ» رواه الترمذي. فكل ريال يمر في يدك سؤال: من أين جاء؟ وفيم ذهب؟ والفتى يتعلم هذه الأمانة مبكراً بمصروفه الصغير.<\/p><p class=\"g frag\">وفيم أنفقه» (رواه الترمذي) الاستهلاك الاندفاعي تضييع للأمانة.<\/p>", "<small>3<\/small><h2>التحذير من التبذير<\/h2><p class=\"ayah\">﴿إِنَّ الْمُبَذِّرِينَ كَانُوا إِخْوَانَ الشَّيَاطِينِ ۖ وَكَانَ الشَّيْطَانُ لِرَبِّهِ كَفُورًا﴾ [الإسراء: 27]<\/p><p class=\"g frag\">التبذير هو الإنفاق في غير حقه ولو كان مبلغا يسيرا.<\/p>", "<small>4<\/small><h2>التمتع المعتدل والصدقة<\/h2><p class=\"g frag\">توزيع المصروف وتأجيل الرغبات الكمالية يقيك فخ الإعلانات.<\/p>", "<small>سؤال للحوار<\/small><h2 class=\"big\">كم تنفق شهريا على ما تريد لا على ما تحتاج؟<\/h2>", "<small>نشاط تطبيقي<\/small><h2 class=\"big\">قسم مصروفك :احتياج، ادخار، صدقة، ترفيه.<\/h2>", "<small>سؤال وبرهان<\/small><details class=\"frag\"><summary><b>أنفق من مالي وليس من مال أحد، فلماذا أُحاسَب؟<\/b><\/summary><p>المال في الإسلام أمانة وابتلاء. والمستخلَف عليه لا يملك حرية مطلقة، وقد أخبر النبي ﷺ أنه يُسأل عن ماله من أين اكتسبه وفيم أنفقه.<\/p><\/details><details class=\"frag\"><summary><b>ألا يعد الادخار وتقنين المصروف بخلاً وحرماناً من الاستمتاع بالحياة؟<\/b><\/summary><p>البخل منع الحقوق الواجبة. أما الادخار فتخطيط ذكي، وقد قال ﷺ: «كلوا واشربوا والبسوا وتصدقوا في غير إسراف ولا مخيلة». فالموازنة تتيح لك الاستمتاع براحة الضمير وتجنب الندم.<\/p><\/details><details class=\"frag\"><summary><b>أصدقائي يشترون الأجهزة والملابس الغالية ويسخرون مني إن لم أفعل<\/b><\/summary><p>هذا إحساس بالنقص صنعته المقارنة والإعلانات. قيمتك في دينك وخلقك وعقلك لا في ما تحمله، ومن يقيّمك بملابسك فصحبته لا تنفعك في الشدائد.<\/p><\/details>", "<small>ميدان التطبيق<\/small><h2>«ورشة ميزانية الفتى وصيد الإعلانات»  نشاط حسابي وتحليلي<\/h2><ol><li class=\"frag\">1. الميزانية: يضع كل طالب رقماً افتراضياً لمصروفه الشهري (إن لم يرغب في ذكر رقمه الحقيقي)، ويوزعه بقاعدة 50 / 30 / 20.<\/li><li class=\"frag\">2. الفرز: يستخرج من الإنفاق الأخير ثلاثة بنود، ويصنفها: ضروري أو مفيد أو كمالي.<\/li><li class=\"frag\">3. صيد الإعلانات: يحلل كل فريق إعلاناً حقيقياً أو مصمماً: ما الشعور الذي يثيره؟<\/li><li class=\"frag\">4. دراسة حالة: أمجد (17 سنة) يتقاضى مصروفاً شهرياً، وينفقه في أول أسبوع على المطاعم والمشتريات داخل الألعاب، ثم يقترض من أصدقائه آخر الشهر ويتأخر في…<\/li><li class=\"frag\">5. الاعتراض: أحد الطلاب يدافع عن «الإنفاق كله اليوم، فالمستقبل مجهول»، وتناقشه المجموعات.<\/li><\/ol>", "<small>رحلة الأسبوع<\/small><ul><li class=\"frag\"><b>دفتر المصروف:<\/b> يدوّن الطالب كل ما أنفقه هذا الأسبوع بلا استثناء.<\/li><li class=\"frag\"><b>صيد إعلان:<\/b> يلتقط إعلاناً واحداً أثّر فيه ويحلل الحيلة النفسية فيه.<\/li><li class=\"frag\"><b>صدقة صغيرة:<\/b> يخصص جزءاً من مصروفه لصدقة منتظمة مهما قلّ.<\/li><li class=\"frag\"><b>جسر إلى اللقاء السادس عشر:<\/b> وبعد أن تعلمنا الأولويات والقرار والتوازن والمال، نجمعها في وثيقة واحدة: «الميثاق الزمني الشخصي».<\/li><\/ul>"], "n": 15, "u": 2, "title": "الوعي المالي المبكر", "q": "كيف ندير المال ونميز بين الحاجة والرغبة؟", "dqq": "كم تنفق شهريا على ما تريد لا على ما تحتاج؟", "pact": "قسم مصروفك :احتياج، ادخار، صدقة، ترفيه."}, {"summary": "<p class=\"\">هذا لقاء التتويج لوحدة «فقه الأولويات وإدارة الحياة». يجمع الفتى فيه ما تعلمه في اللقاءات الخمسة السابقة (بوصلة الأهداف، ومصفوفة المهام، والقرار الأخلاقي، والموازنة الحياتية، والوعي المالي) في وثيقة واحدة هي «الميثاق الزمني الشخصي»، يلتزم بها ويعرضها على شريك مساءلة. فالمعارف المتفرقة تُنسى، أما الميثاق المكتوب المعروض على شاهد فيحوّلها إلى نظام حياة.<\/p><p class=\"\">يدمج المهارات الخمس في وثيقة عملية موجزة.<\/p><p class=\"\">يتدرب على الدفاع عن ميثاقه أمام اعتراضات واقعية، فيكتشف ثغراته قبل أن يصطدم بها.<\/p><p class=\"\">يعين شريك مساءلة يتابعه أسبوعياً.<\/p><div class=\"tw\"><table><tr><th><b>المهارة<\/b><\/th><th><b>معناها العملي<\/b><\/th><\/tr><tr><td><b>التركيب والتكامل<\/b><\/td><td>يربط الأولويات والقرارات والتوازن والمال في نظام واحد<\/td><\/tr><tr><td><b>المساءلة الذاتية<\/b><\/td><td>يلتزم بوعوده ويقبل المتابعة من شريك<\/td><\/tr><tr><td><b>التفكير النقدي في خطته<\/b><\/td><td>يختبر ميثاقه بالاعتراضات الواقعية ويصلح ثغراته<\/td><\/tr><\/table><\/div>", "kit": "<p class=\"\"><b>جهّز المواد:<\/b> اجمع بطاقات اللقاءات الخمسة السابقة ليرجع إليها كل طالب (شجرة البوصلة، ومصفوفة الأسبوع، وميزان القرار، وعجلة الحياة، وميزانية الفتى).<\/p><p class=\"\"><b>أوصِ باختصار الميثاق:<\/b> صفحة واحدة فقط. فالوثيقة الطويلة تُهمل، والقصيرة تُقرأ.<\/p><p class=\"\"><b>اهتم بجودة الشريك:<\/b> الشريك الأنسب صديق صادق غير مجامل، ويفضَّل ألا يكون أخاً أو قريباً يتساهل معه.<\/p><p class=\"\"><b>أعلن الرحمة مع الصرامة:<\/b> الميثاق وعد مقصود به الثبات، وليس سوطاً يجلد به الفتى نفسه عند أول تقصير.<\/p>", "hookT": "المدير التنفيذي بلا عقد", "hook": "<p class=\"\">تخيل شاباً عُيّن مديراً تنفيذياً لشركة ناشئة، ولديه موهبة وحماس كبيران. لكنه لا يملك عقداً مكتوباً، ولا خطة، ولا ميزانية، ولا جدولاً، ولا موظفاً يحاسبه. ينتظر الإلهام كل صباح، وكلما مرّ إغراء أو مقاطعة انحرف عن المسار. وبعد ستة أشهر أفلست الشركة، وقال: «كانت لدي نوايا عظيمة».<\/p><p class=\"\"><b>أسئلة الاستثارة:<\/b><\/p><p class=\"\">لماذا فشل رغم موهبته؟ ما الذي كان ينقصه؟<\/p><p class=\"\">أنت مدير تنفيذي لأهم مشروع، وهو حياتك: فهل لديك عقد وخطة ومحاسب؟<\/p>", "pts": "<article class=\"pt\"><h4><span>أولاً<\/span>العقود والعهود في الشريعة<\/h4><p class=\"ayah\">﴿يَا أَيُّهَا الَّذِينَ آمَنُوا أَوْفُوا بِالْعُقُودِ﴾ [المائدة: 1]<\/p><p class=\"ayah\">﴿وَأَوْفُوا بِالْعَهْدِ ۖ إِنَّ الْعَهْدَ كَانَ مَسْئُولًا﴾ [الإسراء: 34]<\/p><p class=\"\">الميثاق الشخصي عقد يلزم به الفتى نفسه أمام ربه، وهو داخل في عموم الوفاء بالعهد. وقوله ﴿كَانَ مَسْئُولًا﴾ يعني أن العهد يُسأل عنه صاحبه، فلا يُعطى باستخفاف ولا يُنقض بلا عذر.<\/p><\/article><article class=\"pt\"><h4><span>ثانياً<\/span>الصدق مع الله في العهد<\/h4><p class=\"ayah\">﴿مِّنَ الْمُؤْمِنِينَ رِجَالٌ صَدَقُوا مَا عَاهَدُوا اللَّهَ عَلَيْهِ﴾ [الأحزاب: 23]<\/p><p class=\"\">مدح القرآن الذين صدقوا العهد وثبتوا عليه. وأعظم الصدق أن يصدق الفتى مع نفسه حين لا يراقبه أحد، فيفي بما وعد به خطته.<\/p><\/article><article class=\"pt\"><h4><span>ثالثاً<\/span>الالتزام بالشروط ما لم تخالف الشرع<\/h4><p class=\"had\">قال رسول الله ﷺ: «الْمُسْلِمُونَ عَلَى شُرُوطِهِمْ، إِلَّا شَرْطًا حَرَّمَ حَلَالًا أَوْ أَحَلَّ حَرَامًا» رواه أبو داود. فالمسلم يلتزم بما أوجبه على نفسه ما دام داخل حدود الشرع، ولذلك يجب أن تكون بنود الميثاق مشروعة ومقدورة.<\/p><\/article><article class=\"pt\"><h4><span>رابعاً<\/span>خطر خلف الوعد<\/h4><p class=\"had\">قال رسول الله ﷺ: «آيَةُ الْمُنَافِقِ ثَلاَثٌ: إِذَا حَدَّثَ كَذَبَ، وَإِذَا وَعَدَ أَخْلَفَ، وَإِذَا اؤْتُمِنَ خَانَ» متفق عليه. وهو تحذير من الاستخفاف بالوعود، حتى تلك التي نقطعها على أنفسنا. ولا يقصد به إيقاع الفتى في الحرج، بل بيان مكانة الوفاء. ثم يأتي علاج التقصير في التسديد: «سَدِّدُوا وَقَارِبُوا وَأَبْشِرُوا» رواه البخاري، فالسقوط يعقبه نهوض.<\/p><\/article><article class=\"pt\"><h4><span>خامساً<\/span>الرفقة المعينة على الوفاء<\/h4><p class=\"ayah\">﴿وَتَعَاوَنُوا عَلَى الْبِرِّ وَالتَّقْوَىٰ﴾ [المائدة: 2]<\/p><p class=\"\">الشاهد أو شريك المساءلة تطبيق عملي للتعاون على البر. فمن علم أن أخاً يسأله عن ميثاقه كل أسبوع كان أحرص على الوفاء. وقد أخذ النبي ﷺ البيعة من أصحابه على الأوامر الواضحة، فكانت البيعة ميثاقاً مشهوداً يقوّي العزيمة.<\/p><\/article><article class=\"pt\"><h4><span>سادساً<\/span>بنود الميثاق الخمسة (ثمرة الوحدة)<\/h4><div class=\"tw\"><table><tr><th><b>البند<\/b><\/th><th><b>مأخوذ من<\/b><\/th><th><b>صياغة نموذجية<\/b><\/th><\/tr><tr><td><b>الأهداف<\/b><\/td><td>اللقاء الحادي عشر<\/td><td>هدفي الإيماني والعقلي والمهاري لهذا العام هو: ...<\/td><\/tr><tr><td><b>الأولويات<\/b><\/td><td>اللقاء الثاني عشر<\/td><td>أخصص كل يوم وقتاً ثابتاً لمهمتي من المربع الثاني<\/td><\/tr><tr><td><b>القرار الأخلاقي<\/b><\/td><td>اللقاء الثالث عشر<\/td><td>أرفض الغش والكذب برفق وحزم ولو خسرت<\/td><\/tr><tr><td><b>التوازن<\/b><\/td><td>اللقاء الرابع عشر<\/td><td>أعطي أهلي وصحتي حقهما كل يوم<\/td><\/tr><tr><td><b>المال<\/b><\/td><td>اللقاء الخامس عشر<\/td><td>أوزع مصروفي 50 / 30 / 20 وأطبق قاعدة الثلاثين يوماً<\/td><\/tr><\/table><\/div><\/article><article class=\"pt\"><h4><span>سابعاً<\/span>كيف نكتب ميثاقاً يصمد؟<\/h4><p class=\"\"><b>صغير ومحدد:<\/b> بنود قليلة بصيغ يمكن قياسها (أقرأ ثلاث صفحات يومياً).<\/p><p class=\"\"><b>متدرج:<\/b> لا يبدأ بكل شيء دفعة واحدة، بل يختار الأهم.<\/p><p class=\"\"><b>قابل للمراجعة:<\/b> يراجع الفتى ميثاقه أسبوعياً ويعدّله إن اكتشف خللاً.<\/p><p class=\"\"><b>له بند للتعافي:<\/b> إن فاتني التزام ليوم عدت إليه في اليوم التالي، ولا أفوّته مرتين.<\/p><\/article>", "qa": "<div class=\"tw\"><table><tr><th><b>السؤال المتوقع<\/b><\/th><th><b>تفكيكه<\/b><\/th><\/tr><tr><td><b>أليس كتابة ميثاق صارم تقييداً لحريتي وعفويتي؟<\/b><\/td><td>الميثاق يحررك من فوضى اللحظة. فمن لا يملك خطة يصير أسير ظروفه وأهواء الآخرين. والعفوية الحقيقية تتحقق في إطار واضح، كما يعزف الموسيقي بحرية لأنه أتقن قواعد الإيقاع.<\/td><\/tr><tr><td><b>ماذا لو أخفقت في تنفيذ بند بعد أسبوعين فقط؟<\/b><\/td><td>الإخفاق متوقع، وهو معلومة تفيدك. راجع البند: هل هو مقدور؟ ثم عدّله ولا تتركه. وطبّق بند التعافي: لا تفوّت الالتزام مرتين.<\/td><\/tr><tr><td><b>لماذا أحتاج شريكاً يتابعني، ألا يكفي أن يعلم الله بما أفعل؟<\/b><\/td><td>الله مطلع على كل شيء، ومع ذلك أمرنا بالتعاون على البر. والشريك وسيلة تعين على الصدق، وليس بديلاً عن مراقبة الله.<\/td><\/tr><\/table><\/div>", "radar": "<p class=\"\"><b>مؤشرات الخطر:<\/b> تهرب الفتى من كتابة أي التزام، أو كتابة بنود مبالغ فيها يعلم أنه لن ينفذها، أو الاستخفاف بالميثاق، أو الإحباط الشديد عند أول تقصير، أو اختيار شريك مجامل لا يسأل.<\/p><p class=\"\"><b>بروتوكول التدخل:<\/b><\/p><p class=\"step\"><b>1. <\/b>حاوره على انفراد لتفهم سبب التهرب: خوف من الفشل؟ تجربة سابقة؟<\/p><p class=\"step\"><b>2. <\/b>اطلب منه بنداً واحداً صغيراً جداً بدل خمسة بنود.<\/p><p class=\"step\"><b>3. <\/b>اتفق معه على موعد قصير لمتابعة تنفيذه.<\/p>", "actT": "«محامي التردد وتوقيع الميثاق»  نشاط تكاملي", "act": "<p class=\"step\"><b>1. التجهيز:<\/b> يضع كل طالب أمامه بطاقاته الخمس السابقة ويستخلص منها بنود ميثاقه.<\/p><p class=\"step\"><b>2. الصياغة:<\/b> يكتب الميثاق في صفحة واحدة: الديباجة، والبنود الخمسة، وبند التعافي.<\/p><p class=\"step\"><b>3. محامي التردد:<\/b> يتبادل كل اثنين وثيقتيهما، ويلعب كل منهما دور «محامي التردد» الذي يطرح أصعب اعتراض واقعي على ميثاق زميله (مثل: «كيف تنفذ هذا وأنت مرهق؟» أو «ماذا لو قاطعك أصدقاؤك؟»)، ويدافع صاحب الميثاق عنه ويعدّله إن لزم.<\/p><p class=\"step\"><b>4. الشاهد:<\/b> يختار كل طالب شريك مساءلة ويوقّع الاثنان على الوثيقة.<\/p><p class=\"step\"><b>5. دراسة حالة:<\/b> سلمان (17 سنة) كتب ميثاقاً طموحاً من اثني عشر بنداً: خمس ساعات مذاكرة، وساعتان قرآن، ونادٍ رياضي، وصيام الإثنين والخميس، وسهر أقل من ست ساعات. وبعد خمسة أيام انهار وقال: «الميثاق لا يصلح». تحلل المجموعات: أين الخلل؟ وكيف يعيد كتابة ميثاق يصمد؟<\/p><p class=\"step\"><b>6. الختام:<\/b> يدعو المشرف دعاء الثبات، ويحتفظ بصورة من كل ميثاق للمتابعة.<\/p><div class=\"tw\"><table><tr><th colspan=\"2\"><b>وثيقة: الميثاق الزمني الشخصي<\/b><\/th><\/tr><tr><td><b>الديباجة<\/b><\/td><td>أنا ............ أعاهد الله ثم نفسي على ما يلي<\/td><\/tr><tr><td><b>البند 1: أهدافي<\/b><\/td><td>............................<\/td><\/tr><tr><td><b>البند 2: أولوياتي<\/b><\/td><td>............................<\/td><\/tr><tr><td><b>البند 3: قراري الأخلاقي<\/b><\/td><td>............................<\/td><\/tr><tr><td><b>البند 4: توازني<\/b><\/td><td>............................<\/td><\/tr><tr><td><b>البند 5: مالي<\/b><\/td><td>............................<\/td><\/tr><tr><td><b>بند التعافي<\/b><\/td><td>إن فاتني التزام عدت إليه في اليوم التالي ولم أفوّته مرتين<\/td><\/tr><tr><td><b>التوقيع والشاهد<\/b><\/td><td>الاسم: ............ التاريخ: ............ الشاهد: ............<\/td><\/tr><\/table><\/div>", "week": "<p class=\"\"><b>قراءة الميثاق:<\/b> يقرأ الطالب ميثاقه كل صباح قبل أن يمسك هاتفه.<\/p><p class=\"\"><b>لقاء الشاهد:<\/b> يلتقي شريكه مرة في الأسبوع بضع دقائق لمراجعة الالتزام.<\/p><p class=\"\"><b>مراجعة ختامية:<\/b> يعدّل أي بند ثبت عدم واقعيته، ويثبّت البنود الناجحة.<\/p><p class=\"\"><b>جسر إلى الوحدة الرابعة:<\/b> وبعد أن بنينا العقل والذات والأولويات، ننتقل إلى سؤال الهوية الأعمق: من هو الرجل؟ وهذا موضوع «معاني الرجولة والهوية».<\/p>", "kq": "جلسة تطبيقية وتكاملية تختم الوحدة الثالثة", "brief": "<div class=\"plan\"><span>اقتراح لتوزيع الوقت (١٠–١٥ د)<\/span><b>افتتاح ٣<\/b><b>محاور ٥<\/b><b>حوار ٢<\/b><b>نشاط ٣<\/b><b>ختام ٢<\/b><\/div><section class=\"bs\"><h3>١ · الافتتاح: المدير التنفيذي بلا عقد<\/h3><p class=\"\">تخيل شاباً عُيّن مديراً تنفيذياً لشركة ناشئة، ولديه موهبة وحماس كبيران. لكنه لا يملك عقداً مكتوباً، ولا خطة، ولا ميزانية، ولا جدولاً، ولا موظفاً يحاسبه. ينتظر الإلهام كل صباح، وكلما مرّ إغراء أو مقاطعة انحرف عن المسار. وبعد ستة أشهر أفلست الشركة، وقال: «كانت لدي نوايا عظيمة».<\/p><p class=\"\"><b>أسئلة الاستثارة:<\/b><\/p><p class=\"\">لماذا فشل رغم موهبته؟ ما الذي كان ينقصه؟<\/p><p class=\"\">أنت مدير تنفيذي لأهم مشروع، وهو حياتك: فهل لديك عقد وخطة ومحاسب؟<\/p><\/section><section class=\"bs\"><h3>٢ · المحاور<\/h3><article class=\"pt\"><h4><span>١<\/span>الوفاء بالعهود مسؤلية<\/h4><p class=\"ayah\">﴿يَا أَيُّهَا الَّذِينَ آمَنُوا أَوْفُوا بِالْعُقُودِ﴾ [المائدة: 1]<\/p><p class=\"g\">الميثاق الزمني عقد يلزم به الفتى نفسه بتنظيم حياته وأولوياته.<\/p><details class=\"more\"><summary>للتوسع<\/summary><p class=\"ayah\">﴿وَأَوْفُوا بِالْعَهْدِ ۖ إِنَّ الْعَهْدَ كَانَ مَسْئُولًا﴾ [الإسراء: 34]<\/p><p class=\"\">الميثاق الشخصي عقد يلزم به الفتى نفسه أمام ربه، وهو داخل في عموم الوفاء بالعهد. وقوله ﴿كَانَ مَسْئُولًا﴾ يعني أن العهد يُسأل عنه صاحبه، فلا يُعطى باستخفاف ولا يُنقض بلا عذر.<\/p><\/details><\/article><article class=\"pt\"><h4><span>٢<\/span>خطر خلف الوعد<\/h4><p class=\"had\">قال رسول الله ﷺ: «آيَةُ الْمُنَافِقِ ثَلاَثٌ: إِذَا حَدَّثَ كَذَبَ، وَإِذَا وَعَدَ أَخْلَفَ، وَإِذَا اؤْتُمِنَ خَانَ» متفق عليه. وهو تحذير من الاستخفاف بالوعود، حتى تلك التي نقطعها على أنفسنا. ولا يقصد به إيقاع الفتى في الحرج، بل بيان مكانة الوفاء. ثم يأتي علاج التقصير في التسديد: «سَدِّدُوا وَقَارِبُوا وَأَبْشِرُوا» رواه البخاري، فالسقوط يعقبه نهوض.<\/p><p class=\"g\">... و ذا وعد أ خلف » (متفق عليه) الوفاء بالوعود الذاتية علامة على احترام الفتى لذاته.<\/p><details class=\"more\"><summary>للتوسع<\/summary><\/details><\/article><article class=\"pt\"><h4><span>٣<\/span>التعاون على البر والمساءلة<\/h4><p class=\"ayah\">﴿وَتَعَاوَنُوا عَلَى الْبِرِّ وَالتَّقْوَىٰ﴾ [المائدة: 2]<\/p><p class=\"g\">إشراك «شاهد» أو رفيق لمتابعة الميثاق يعين على الاستمرارية وعدم التساهل.<\/p><details class=\"more\"><summary>للتوسع<\/summary><p class=\"\">الشاهد أو شريك المساءلة تطبيق عملي للتعاون على البر. فمن علم أن أخاً يسأله عن ميثاقه كل أسبوع كان أحرص على الوفاء. وقد أخذ النبي ﷺ البيعة من أصحابه على الأوامر الواضحة، فكانت البيعة ميثاقاً مشهوداً يقوّي العزيمة.<\/p><\/details><\/article><article class=\"pt\"><h4><span>٤<\/span>الالتزام الواقعي<\/h4><p class=\"had\">قال رسول الله ﷺ: «الْمُسْلِمُونَ عَلَى شُرُوطِهِمْ، إِلَّا شَرْطًا حَرَّمَ حَلَالًا أَوْ أَحَلَّ حَرَامًا» رواه أبو داود. فالمسلم يلتزم بما أوجبه على نفسه ما دام داخل حدود الشرع، ولذلك يجب أن تكون بنود الميثاق مشروعة ومقدورة.<\/p><p class=\"g\">يجب أن تكون بنود الميثاق صغيرة، محددة، وتحمل مادة للتعافي لتجاوز العثرات دون إحباط.<\/p><details class=\"more\"><summary>للتوسع<\/summary><\/details><\/article><\/section><section class=\"bs\"><h3>٣ · سؤال للحوار<\/h3><p class=\"big\">من الذي سيسألك عن التزامك بالميثاق؟<\/p><\/section><section class=\"bs\"><h3>٤ · نشاط تطبيقي<\/h3><p class=\"big\">صمم ميثاقك الزمني وسلم نسخة لرفيق المساءلة.<\/p><\/section><section class=\"bs\"><h3>أسئلة قد تُطرح<\/h3><details class=\"more\"><summary><b>أليس كتابة ميثاق صارم تقييداً لحريتي وعفويتي؟<\/b><\/summary><p>الميثاق يحررك من فوضى اللحظة. فمن لا يملك خطة يصير أسير ظروفه وأهواء الآخرين. والعفوية الحقيقية تتحقق في إطار واضح، كما يعزف الموسيقي بحرية لأنه أتقن قواعد الإيقاع.<\/p><\/details><details class=\"more\"><summary><b>ماذا لو أخفقت في تنفيذ بند بعد أسبوعين فقط؟<\/b><\/summary><p>الإخفاق متوقع، وهو معلومة تفيدك. راجع البند: هل هو مقدور؟ ثم عدّله ولا تتركه. وطبّق بند التعافي: لا تفوّت الالتزام مرتين.<\/p><\/details><\/section><section class=\"bs warn\"><h3>رادار الحماية<\/h3><p><b>مؤشرات الخطر:<\/b> تهرب الفتى من كتابة أي التزام، أو كتابة بنود مبالغ فيها يعلم أنه لن ينفذها، أو الاستخفاف بالميثاق، أو الإحباط الشديد عند أول تقصير، أو اختيار شريك مجامل لا يسأل.<\/p><small>البروتوكول كاملاً في تبويب «الكامل».<\/small><\/section><section class=\"bs\"><h3>٥ · رحلة الأسبوع<\/h3><p class=\"\"><b>قراءة الميثاق:<\/b> يقرأ الطالب ميثاقه كل صباح قبل أن يمسك هاتفه.<\/p><p class=\"\"><b>لقاء الشاهد:<\/b> يلتقي شريكه مرة في الأسبوع بضع دقائق لمراجعة الالتزام.<\/p><p class=\"\"><b>مراجعة ختامية:<\/b> يعدّل أي بند ثبت عدم واقعيته، ويثبّت البنود الناجحة.<\/p><p class=\"\"><b>جسر إلى الوحدة الرابعة:<\/b> وبعد أن بنينا العقل والذات والأولويات، ننتقل إلى سؤال الهوية الأعمق: من هو الرجل؟ وهذا موضوع «معاني الرجولة والهوية».<\/p><\/section>", "slides": ["<div class=\"cn\">16<\/div><h2>مشروع تطبيقي، الميثاق الزمني الشخصي<\/h2><p class=\"q\">كيف نجمع أولوياتنا وقراراتنا في ميثاق ملزم؟<\/p>", "<small>إضاءة استهلالية<\/small><h2>المدير التنفيذي بلا عقد<\/h2><ul><li class=\"frag\">لماذا فشل رغم موهبته؟ ما الذي كان ينقصه؟<\/li><li class=\"frag\">أنت مدير تنفيذي لأهم مشروع، وهو حياتك: فهل لديك عقد وخطة ومحاسب؟<\/li><\/ul>", "<small>1<\/small><h2>الوفاء بالعهود مسؤلية<\/h2><p class=\"ayah\">﴿يَا أَيُّهَا الَّذِينَ آمَنُوا أَوْفُوا بِالْعُقُودِ﴾ [المائدة: 1]<\/p><p class=\"g frag\">الميثاق الزمني عقد يلزم به الفتى نفسه بتنظيم حياته وأولوياته.<\/p>", "<small>2<\/small><h2>خطر خلف الوعد<\/h2><p class=\"had lg\">قال رسول الله ﷺ: «آيَةُ الْمُنَافِقِ ثَلاَثٌ: إِذَا حَدَّثَ كَذَبَ، وَإِذَا وَعَدَ أَخْلَفَ، وَإِذَا اؤْتُمِنَ خَانَ» متفق عليه. وهو تحذير من الاستخفاف بالوعود، حتى تلك التي نقطعها على أنفسنا. ولا يقصد به إيقاع الفتى في الحرج، بل بيان مكانة الوفاء. ثم يأتي علاج التقصير في التسديد: «سَدِّدُوا وَقَارِبُوا وَأَبْشِرُوا» رواه البخاري، فالسقوط يعقبه نهوض.<\/p><p class=\"g frag\">... و ذا وعد أ خلف » (متفق عليه) الوفاء بالوعود الذاتية علامة على احترام الفتى لذاته.<\/p>", "<small>3<\/small><h2>التعاون على البر والمساءلة<\/h2><p class=\"ayah\">﴿وَتَعَاوَنُوا عَلَى الْبِرِّ وَالتَّقْوَىٰ﴾ [المائدة: 2]<\/p><p class=\"g frag\">إشراك «شاهد» أو رفيق لمتابعة الميثاق يعين على الاستمرارية وعدم التساهل.<\/p>", "<small>4<\/small><h2>الالتزام الواقعي<\/h2><p class=\"had lg\">قال رسول الله ﷺ: «الْمُسْلِمُونَ عَلَى شُرُوطِهِمْ، إِلَّا شَرْطًا حَرَّمَ حَلَالًا أَوْ أَحَلَّ حَرَامًا» رواه أبو داود. فالمسلم يلتزم بما أوجبه على نفسه ما دام داخل حدود الشرع، ولذلك يجب أن تكون بنود الميثاق مشروعة ومقدورة.<\/p><p class=\"g frag\">يجب أن تكون بنود الميثاق صغيرة، محددة، وتحمل مادة للتعافي لتجاوز العثرات دون إحباط.<\/p>", "<small>سؤال للحوار<\/small><h2 class=\"big\">من الذي سيسألك عن التزامك بالميثاق؟<\/h2>", "<small>نشاط تطبيقي<\/small><h2 class=\"big\">صمم ميثاقك الزمني وسلم نسخة لرفيق المساءلة.<\/h2>", "<small>سؤال وبرهان<\/small><details class=\"frag\"><summary><b>أليس كتابة ميثاق صارم تقييداً لحريتي وعفويتي؟<\/b><\/summary><p>الميثاق يحررك من فوضى اللحظة. فمن لا يملك خطة يصير أسير ظروفه وأهواء الآخرين. والعفوية الحقيقية تتحقق في إطار واضح، كما يعزف الموسيقي بحرية لأنه أتقن قواعد الإيقاع.<\/p><\/details><details class=\"frag\"><summary><b>ماذا لو أخفقت في تنفيذ بند بعد أسبوعين فقط؟<\/b><\/summary><p>الإخفاق متوقع، وهو معلومة تفيدك. راجع البند: هل هو مقدور؟ ثم عدّله ولا تتركه. وطبّق بند التعافي: لا تفوّت الالتزام مرتين.<\/p><\/details><details class=\"frag\"><summary><b>لماذا أحتاج شريكاً يتابعني، ألا يكفي أن يعلم الله بما أفعل؟<\/b><\/summary><p>الله مطلع على كل شيء، ومع ذلك أمرنا بالتعاون على البر. والشريك وسيلة تعين على الصدق، وليس بديلاً عن مراقبة الله.<\/p><\/details>", "<small>ميدان التطبيق<\/small><h2>«محامي التردد وتوقيع الميثاق»  نشاط تكاملي<\/h2><ol><li class=\"frag\">1. التجهيز: يضع كل طالب أمامه بطاقاته الخمس السابقة ويستخلص منها بنود ميثاقه.<\/li><li class=\"frag\">2. الصياغة: يكتب الميثاق في صفحة واحدة: الديباجة، والبنود الخمسة، وبند التعافي.<\/li><li class=\"frag\">3. محامي التردد: يتبادل كل اثنين وثيقتيهما، ويلعب كل منهما دور «محامي التردد» الذي يطرح أصعب اعتراض واقعي على ميثاق زميله (مثل: «كيف تنفذ هذا وأنت…<\/li><li class=\"frag\">4. الشاهد: يختار كل طالب شريك مساءلة ويوقّع الاثنان على الوثيقة.<\/li><li class=\"frag\">5. دراسة حالة: سلمان (17 سنة) كتب ميثاقاً طموحاً من اثني عشر بنداً: خمس ساعات مذاكرة، وساعتان قرآن، ونادٍ رياضي، وصيام الإثنين والخميس، وسهر أقل من…<\/li><li class=\"frag\">6. الختام: يدعو المشرف دعاء الثبات، ويحتفظ بصورة من كل ميثاق للمتابعة.<\/li><\/ol>", "<small>رحلة الأسبوع<\/small><ul><li class=\"frag\"><b>قراءة الميثاق:<\/b> يقرأ الطالب ميثاقه كل صباح قبل أن يمسك هاتفه.<\/li><li class=\"frag\"><b>لقاء الشاهد:<\/b> يلتقي شريكه مرة في الأسبوع بضع دقائق لمراجعة الالتزام.<\/li><li class=\"frag\"><b>مراجعة ختامية:<\/b> يعدّل أي بند ثبت عدم واقعيته، ويثبّت البنود الناجحة.<\/li><li class=\"frag\"><b>جسر إلى الوحدة الرابعة:<\/b> وبعد أن بنينا العقل والذات والأولويات، ننتقل إلى سؤال الهوية الأعمق: من هو الرجل؟ وهذا موضوع «معاني الرجولة والهوية».<\/li><\/ul>"], "n": 16, "u": 2, "title": "مشروع تطبيقي، الميثاق الزمني الشخصي", "q": "كيف نجمع أولوياتنا وقراراتنا في ميثاق ملزم؟", "dqq": "من الذي سيسألك عن التزامك بالميثاق؟", "pact": "صمم ميثاقك الزمني وسلم نسخة لرفيق المساءلة."}, {"summary": "<p class=\"\">يتلقى الفتى صورة للرجولة من الشارع والشاشات والأقران: صوت عالٍ وعضلات وجرأة على الكبار وتدخين وتفاخر. فيحسب أن كل ذلك علامات الرجولة، ويخشى أن يوصف بالضعف إن خالفه. يكتشف في هذا اللقاء أن القرآن والسنة وضعا معياراً آخر: الرجولة خلق مكتسب قائم على ضبط النفس والمروءة ونجدة الضعيف وخدمة الأهل والثبات على الطاعة، وليست مجرد ذكورة جسدية.<\/p><p class=\"\">يفرّق بين الرجولة المزيفة والرجولة القرآنية بمعايير واضحة.<\/p><p class=\"\">يفهم الدافع النفسي وراء الاستعراض، فلا ينخدع به ولا يقلده.<\/p><p class=\"\">يلتزم بسلوكين للتخلية وسلوكين للتحلية، ويكتب ميثاق مروءته.<\/p><div class=\"tw\"><table><tr><th><b>المهارة<\/b><\/th><th><b>معناها العملي<\/b><\/th><\/tr><tr><td><b>نقد الصور النمطية<\/b><\/td><td>يفحص ما يُقدَّم له على أنه رجولة بمعيار الوحي<\/td><\/tr><tr><td><b>ضبط النفس<\/b><\/td><td>يكظم غضبه ولا يجعل صوته وبطشه دليل قوته<\/td><\/tr><tr><td><b>المروءة الصامتة<\/b><\/td><td>يعين الناس ويخدم أهله دون استعراض أو انتظار تصفيق<\/td><\/tr><\/table><\/div>", "kit": "<p class=\"\"><b>ما يعيشه الفتى:<\/b> يخاف الفتى في هذه السن أن يوصف بالضعف أو «الدلع»، فيبالغ في الخشونة ليثبت نفسه. وقد يخجل من خدمة أهله أو من اللين مع الصغار أمام أقرانه. وغالباً ما تخفي الخشونة المصطنعة شعوراً داخلياً بنقص الثقة.<\/p><p class=\"\"><b>لا تسخر من خشونته:<\/b> اسأله عما يخافه حين يرفع صوته أو يتعالى، فالسؤال يفتح باب الصدق أكثر من الوعظ.<\/p><p class=\"\"><b>اعرض النموذج الحي:<\/b> الرجل المهيب الذي يراه الفتى هادئاً مع أهله ومحترماً من الجميع أبلغ من أي خطبة.<\/p><p class=\"\"><b>احذر المقارنة الجارحة:<\/b> لا تقارن بين فتى وآخر، بل اجعل المعيار نصوص الوحي والسيرة.<\/p><p class=\"\"><b>أدخل الفتاة والأسرة في الحديث:<\/b> الرجولة تتجلى في معاملته لأمه وأخته وجاره، فاسأل عنها.<\/p>", "hookT": "نديم وركان", "hook": "<p class=\"\"><b>نديم (17 سنة)<\/b> يستعرض عضلاته وصوته المرتفع في الشارع، ويتطاول على العمال والسائقين، ويرى أن «الرجولة أن يخافك الناس». وفي البيت يصرخ في وجه أخته الصغيرة ويرفض مساعدة والده قائلاً: «أنا لست خادماً لأحد». أما <b>ركان (17 سنة)<\/b> فهو هادئ السمت قوي البنية. رأى في طريقه تحت المطر رجلاً مسناً يحمل أكياساً ثقيلة وقد زلت قدمه، فأسرع وحمل عنه الأكياس وأوصله إلى باب بيته مبتسماً، دون أن يصوّر المشهد بهاتفه. ولما عاد إلى بيته بادر بتنظيف غرفته ومساعدة أمه.<\/p><p class=\"\"><b>أسئلة الاستثارة:<\/b><\/p><p class=\"\">من منهما تثق به حين تحتاج إلى عون؟ ومن منهما يهابه الناس هيبة احترام لا هيبة خوف؟<\/p><p class=\"\">لماذا يظن كثير من الفتيان أن نديم هو الأقوى؟ وما الذي يخشاه حقاً؟<\/p>", "pts": "<article class=\"pt\"><h4><span>أولاً<\/span>الرجولة في القرآن صفة إيمانية<\/h4><p class=\"ayah\">﴿رِجَالٌ لَّا تُلْهِيهِمْ تِجَارَةٌ وَلَا بَيْعٌ عَن ذِكْرِ اللَّهِ وَإِقَامِ الصَّلَاةِ وَإِيتَاءِ الزَّكَاةِ ۙ يَخَافُونَ يَوْمًا تَتَقَلَّبُ فِيهِ الْقُلُوبُ وَالْأَبْصَارُ﴾ [النور: 37]<\/p><p class=\"\">وصف القرآن الرجال بصفات لا علاقة لها بالعضلات: لا تشغلهم الدنيا عن ربهم، ويحافظون على الصلاة، ويؤدون الزكاة، ويخافون يوماً عظيماً. فالرجل الحقيقي من يقود دنياه ويخضعها لطاعة ربه، لا من تقوده شهواته وتلهيه تجارته أو شاشاته.<\/p><\/article><article class=\"pt\"><h4><span>ثانياً<\/span>موسى عليه السلام، نموذج الشهامة الصامتة<\/h4><p class=\"ayah\">﴿فَسَقَىٰ لَهُمَا ثُمَّ تَوَلَّىٰ إِلَى الظِّلِّ فَقَالَ رَبِّ إِنِّي لِمَا أَنزَلْتَ إِلَيَّ مِنْ خَيْرٍ فَقِيرٌ﴾ [القصص: 24]<\/p><p class=\"\">وصل موسى إلى مدين غريباً متعباً جائعاً، فرأى امرأتين تنتظران فسقى لهما دون مساومة، ثم رجع إلى الظل ودعا ربه. ففي الموقف نجدة للمستضعف، وعفة وحياء، وزهد في الأجر البشري، وتوجه إلى الله بالسؤال. وبعدها جاءته إحدى المرأتين تمشي على استحياء. وكل ذلك وهو غريب ومنهك، فمروءته لم تنتظر ظروفاً مريحة.<\/p><\/article><article class=\"pt\"><h4><span>ثالثاً<\/span>القوة الحقيقية في ضبط النفس<\/h4><p class=\"had\">قال رسول الله ﷺ: «لَيْسَ الشَّدِيدُ بِالصُّرَعَةِ، إِنَّمَا الشَّدِيدُ الَّذِي يَمْلِكُ نَفْسَهُ عِنْدَ الغَضَبِ» متفق عليه<\/p><p class=\"\">غيّر النبي ﷺ مقياس القوة: ليست في صرع الخصوم بل في الإمساك بالنفس عند اشتعال الغضب. فالفتى الذي لا يستفزه صراخ السفهاء ويكظم غيظه يملك قوة أعظم من الذي ينفجر عند أول كلمة. وقال تعالى في وصف المتقين: ﴿وَالْكَاظِمِينَ الْغَيْظَ وَالْعَافِينَ عَنِ النَّاسِ﴾ [آل عمران: 134].<\/p><\/article><article class=\"pt\"><h4><span>رابعاً<\/span>الرجل في بيته<\/h4><p class=\"\">سألت عائشة رضي الله عنها: ما كان النبي ﷺ يصنع في بيته؟ قالت: «كَانَ يَكُونُ فِي مِهْنَةِ أَهْلِهِ، فَإِذَا حَضَرَتِ الصَّلاَةُ خَرَجَ إِلَى الصَّلاَةِ» رواه البخاري. فسيد الرجال ﷺ كان يخدم أهله، ويخصف نعله ويرقع ثوبه. ومن ظن أن خدمة الأهل تنقص هيبته فقد خالف سيرة قدوته. وقال ﷺ: «خَيْرُكُمْ خَيْرُكُمْ لأَهْلِهِ، وَأَنَا خَيْرُكُمْ لأَهْلِي» رواه الترمذي.<\/p><\/article><article class=\"pt\"><h4><span>خامساً<\/span>الرحمة بالضعفاء وتوقير الكبار<\/h4><p class=\"had\">قال رسول الله ﷺ: «لَيْسَ مِنَّا مَنْ لَمْ يَرْحَمْ صَغِيرَنَا وَيُوَقِّرْ كَبِيرَنَا» رواه الترمذي. وقال تعالى لنبيه ﷺ: ﴿وَاخْفِضْ جَنَاحَكَ لِلْمُؤْمِنِينَ﴾ [الحجر: 88]. فالمروءة أن ترحم الصغير وتعين الكبير وتحفظ كرامة الفقير، وتحذر أن تتحول مساعدتهم إلى مادة للتصوير والعرض.<\/p><\/article><article class=\"pt\"><h4><span>سادساً<\/span>الإخلاص يصون الشهامة<\/h4><p class=\"ayah\">﴿إِنَّمَا نُطْعِمُكُمْ لِوَجْهِ اللَّهِ لَا نُرِيدُ مِنكُمْ جَزَاءً وَلَا شُكُورًا﴾ [الإنسان: 9]<\/p><p class=\"\">المساعدة التي تُصوَّر لتحصيل المشاهدات تنقض الإخلاص وتخدش كرامة المحتاج الذي صار مادة عرض. أما الشهامة الصامتة فتجمع بين حفظ الكرامة وصدق النية. ومن أخلص عمله أحبه الناس من حيث لا يحتسب.<\/p><\/article><article class=\"pt\"><h4><span>سابعاً<\/span>الفطرة الكريمة تتزكى بالوحي<\/h4><p class=\"had\">قال رسول الله ﷺ: «خِيَارُكُمْ فِي الجَاهِلِيَّةِ خِيَارُكُمْ فِي الإِسْلاَمِ إِذَا فَقُهُوا» رواه البخاري. فصفات الكرم والنجدة والشجاعة أصلها فطري، ثم يزكيها الإسلام ويهذبها بالفقه والعلم. وقال ﷺ: «إِنَّمَا بُعِثْتُ لأُتَمِّمَ صَالِحَ الأَخْلاَقِ» رواه أحمد. وفي حديث آخر: «إِنَّ اللَّهَ يُحِبُّ مَعَالِيَ الأُمُورِ وَأَشْرَافَهَا، وَيَكْرَهُ سَفْسَافَهَا» رواه الطبراني. فالرجولة طلب للمعالي وترفع عن التوافه.<\/p><\/article><article class=\"pt\"><h4><span>ثامناً<\/span>مصفوفة المقارنة<\/h4><div class=\"tw\"><table><tr><th><b>الرجولة المشوهة (ذكورة مجردة)<\/b><\/th><th><b>الرجولة القرآنية (مكتسبة بالخلق)<\/b><\/th><\/tr><tr><td><b>الصوت العالي والجلافة مع الأهل<\/b><\/td><td>الهيبة والوقار والرحمة بالمستضعفين<\/td><\/tr><tr><td><b>استعراض العضلات والبطش بالضعفاء<\/b><\/td><td>نجدة المظلوم وحماية الضعيف بشهامة<\/td><\/tr><tr><td><b>التدخين والمخالفة كطقس لإثبات الذات<\/b><\/td><td>ضبط النفس عند الغضب وكف الأذى<\/td><\/tr><tr><td><b>التفاخر الرقمي والمباهاة المادية<\/b><\/td><td>المروءة الصامتة والعفة وستر العورات<\/td><\/tr><\/table><\/div><\/article><article class=\"pt\"><h4><span>تاسعاً<\/span>لماذا يُظهر المراهق الخشونة؟<\/h4><p class=\"\">يلجأ الفتى إلى الجلافة المصطنعة غالباً ليعوّض شعوراً داخلياً بنقص الثقة أو ضعف التقدير الذاتي. فيتوهم أن إخافة الآخرين تصنع له هيبة. والهيبة الحقيقية تنبع من النضج وضبط النفس وتقديم العون للناس، أما خوف الناس منك فلا يعني احترامهم لك.<\/p><\/article>", "qa": "<div class=\"tw\"><table><tr><th><b>السؤال المتوقع<\/b><\/th><th><b>تفكيكه<\/b><\/th><\/tr><tr><td><b>ألا يجعل الحلم والسكوت عن الإهانة الشاب موضع استضعاف وسخرية بين أقرانه؟<\/b><\/td><td>هناك فرق جوهري بين العجز والذل، وبين الحلم والترفع. الحلم أن تكون قادراً ثم تمسك نفسك ابتغاء مرضاة الله. والشاب الذي لا يستفزه صراخ السفهاء يفرض احترامه على الجميع، بينما سريع الغضب يتحكم فيه كل من استفزه.<\/td><\/tr><tr><td><b>ألا يقلل تنظيف الغرفة أو مساعدة الوالدة في المطبخ من مقام الرجل؟<\/b><\/td><td>هذا من رواسب الجاهلية. فخير البرية محمد ﷺ كان يخصف نعله ويرقع ثوبه ويكون في مهنة أهله. وخدمة الأهل بر ومروءة تدل على نبل النفس.<\/td><\/tr><tr><td><b>ما العيب في تصوير أعمال الخير والشهامة لنشر الإيجابية بين المتابعين؟<\/b><\/td><td>نجدة المحتاج تقتضي حفظ كرامته ومشاعره. والمتاجرة بضعف الفقير لتحصيل المشاهدات تنقض الشهامة وتخدش الإخلاص. والشهامة الصامتة أعظم أجراً وأصدق مروءة.<\/td><\/tr><tr><td><b>هل تعني هذه المعايير أن أتخلى عن الرياضة وبناء الجسم؟<\/b><\/td><td>إطلاقاً. قال ﷺ: «الْمُؤْمِنُ الْقَوِيُّ خَيْرٌ وَأَحَبُّ إِلَى اللَّهِ مِنَ الْمُؤْمِنِ الضَّعِيفِ» رواه مسلم. القوة البدنية مطلوبة، لكنها وسيلة لحماية الضعيف وخدمة الدين لا للاستعراض والبطش.<\/td><\/tr><\/table><\/div>", "radar": "<p class=\"\"><b>مؤشرات الخطر:<\/b> الجلافة مع الأهل والصغار، والتفاخر بالعنف أو التدخين، والاستخفاف بالعاملين وكبار السن، واستعمال الإهانة تسلية، وربط القيمة الذاتية بخوف الآخرين منه.<\/p><p class=\"\"><b>بروتوكول التدخل:<\/b><\/p><p class=\"step\"><b>1. <\/b>اجلس معه جلسة هادئة وخذ موقفاً محدداً بدل الحكم عليه عامة: «لاحظتُ أنك رفعت صوتك على كذا».<\/p><p class=\"step\"><b>2. <\/b>اسأله: ما الذي كنت تريد أن يظنه بك الآخرون؟ وكيف تشعر حقاً بعد ذلك؟<\/p><p class=\"step\"><b>3. <\/b>أسند إليه مهمة مروءة صغيرة داخل المجموعة (مساعدة، استقبال، تنظيم) ليختبر الاحترام الحقيقي.<\/p>", "actT": "«مختبر تفكيك الرجولة وميثاق المروءة»  نشاط ذهني وحواري", "act": "<p class=\"step\"><b>1. التحليل:<\/b> بعد قصة نديم وركان تقسّم المجموعات السبورة إلى عمودين، وتبني مصفوفة المقارنة بسلوكيات حقيقية يعرفونها.<\/p><p class=\"step\"><b>2. التخلية:<\/b> يدوّن كل طالب سلوكين اعتاد بعض الفتيان عدهما رجولة وهما جلافة أو خفة (رفع الصوت على الأهل، السخرية من العمال).<\/p><p class=\"step\"><b>3. التحلية:<\/b> يدوّن سلوكين عمليين للشهامة يلتزم بهما هذا الأسبوع (حمل المشتريات عن الوالدين، كظم الغيظ عند الخلاف).<\/p><p class=\"step\"><b>4. دراسة حالة:<\/b> قصي (16 سنة) متابع لتحديات المقاطع المصورة. وقع حادث تصادم خفيف أمام بيته واصطدمت سيارة رجل مسن برصيف الطريق. قال له صديقه: «افتح بثاً مباشراً فوراً، ستحصد آلاف المشاهدات!». تردد قصي، ثم ترك الهاتف في جيبه وأسرع إلى الرجل، واطمأن على سلامته وأحضر له الماء وهدّأ روعه حتى جاء الإسعاف، رافضاً تصويره. فلامه زملاؤه: «ضيعت فرصة المشاهدات!». تحلل المجموعات: ما الذي ربحه قصي وما الذي خسره؟ وكيف يجيب زملاءه؟<\/p><p class=\"step\"><b>5. الاعتراض:<\/b> يدافع أحد الطلاب عن «الفتوة الخشنة»: «العالم لا يحترم إلا القوي»، وتناقشه المجموعات بالأدلة.<\/p><div class=\"tw\"><table><tr><th colspan=\"2\"><b>بطاقة: ميثاق المروءة<\/b><\/th><\/tr><tr><td><b>1. سلوكان سأتخلى عنهما (التخلية)<\/b><\/td><td>1. ............ 2. ............<\/td><\/tr><tr><td><b>2. سلوكان للشهامة سأطبقهما (التحلية)<\/b><\/td><td>1. ............ 2. ............<\/td><\/tr><tr><td><b>3. موقف كظمت فيه غضبي هذا الأسبوع<\/b><\/td><td>............................<\/td><\/tr><tr><td><b>4. شعار المروءة<\/b><\/td><td>«أنا رجل بمروءتي وخدمتي لأهلي وديني، لا بصوتي ولا باستعراضي»<\/td><\/tr><\/table><\/div>", "week": "<p class=\"\"><b>خدمة بيتية يومية:<\/b> يؤدي الطالب مهمة خدمة واحدة في بيته كل يوم دون أن يُطلب منه.<\/p><p class=\"\"><b>كظم الغضب:<\/b> يسجل موقفاً واحداً أمسك فيه نفسه عند الغضب، ويشاركه في اللقاء القادم.<\/p><p class=\"\"><b>مروءة صامتة:<\/b> يقوم بعمل خير واحد لا يعلم به أحد ولا يصوره.<\/p><p class=\"\"><b>جسر إلى اللقاء الثامن عشر:<\/b> المروءة تحتاج إلى شجاعة حين يكون الحق مكلفاً. وهذا موضوع «ثبات المبدأ».<\/p>", "kq": "تفكيك المفاهيم المشوهة وترسيخ قيم المروءة والشهامة", "brief": "<div class=\"plan\"><span>اقتراح لتوزيع الوقت (١٠–١٥ د)<\/span><b>افتتاح ٣<\/b><b>محاور ٥<\/b><b>حوار ٢<\/b><b>نشاط ٣<\/b><b>ختام ٢<\/b><\/div><section class=\"bs\"><h3>١ · الافتتاح: نديم وركان<\/h3><p class=\"\"><b>نديم (17 سنة)<\/b> يستعرض عضلاته وصوته المرتفع في الشارع، ويتطاول على العمال والسائقين، ويرى أن «الرجولة أن يخافك الناس». وفي البيت يصرخ في وجه أخته الصغيرة ويرفض مساعدة والده قائلاً: «أنا لست خادماً لأحد». أما <b>ركان (17 سنة)<\/b> فهو هادئ السمت قوي البنية. رأى في طريقه تحت المطر رجلاً مسناً يحمل أكياساً ثقيلة وقد زلت قدمه، فأسرع وحمل عنه الأكياس وأوصله إلى باب بيته مبتسماً، دون أن يصوّر المشهد بهاتفه. ولما عاد إلى بيته بادر بتنظيف غرفته ومساعدة أمه.<\/p><p class=\"\"><b>أسئلة الاستثارة:<\/b><\/p><p class=\"\">من منهما تثق به حين تحتاج إلى عون؟ ومن منهما يهابه الناس هيبة احترام لا هيبة خوف؟<\/p><p class=\"\">لماذا يظن كثير من الفتيان أن نديم هو الأقوى؟ وما الذي يخشاه حقاً؟<\/p><\/section><section class=\"bs\"><h3>٢ · المحاور<\/h3><article class=\"pt\"><h4><span>١<\/span>الرجولة صفة إيمانية وأخلاقية<\/h4><p class=\"ayah\">﴿رِجَالٌ لَّا تُلْهِيهِمْ تِجَارَةٌ وَلَا بَيْعٌ عَن ذِكْرِ اللَّهِ وَإِقَامِ الصَّلَاةِ وَإِيتَاءِ الزَّكَاةِ ۙ يَخَافُونَ يَوْمًا تَتَقَلَّبُ فِيهِ الْقُلُوبُ وَالْأَبْصَارُ﴾ [النور: 37]<\/p><p class=\"g\">الرجولة ليست مظهرا أو صوتا عاليا ، بل استعلاء بالإيمان وثبات على الحق.<\/p><details class=\"more\"><summary>للتوسع<\/summary><p class=\"\">وصف القرآن الرجال بصفات لا علاقة لها بالعضلات: لا تشغلهم الدنيا عن ربهم، ويحافظون على الصلاة، ويؤدون الزكاة، ويخافون يوماً عظيماً. فالرجل الحقيقي من يقود دنياه ويخضعها لطاعة ربه، لا من تقوده شهواته وتلهيه تجارته أو شاشاته.<\/p><\/details><\/article><article class=\"pt\"><h4><span>٢<\/span>القوة في ضبط النفس<\/h4><p class=\"had\">قال رسول الله ﷺ: «لَيْسَ الشَّدِيدُ بِالصُّرَعَةِ، إِنَّمَا الشَّدِيدُ الَّذِي يَمْلِكُ نَفْسَهُ عِنْدَ الغَضَبِ» متفق عليه<\/p><p class=\"g\">الغضب » (متفق عليه) كظم الغيظ والحلم علامات القوة الحقيقية.<\/p><details class=\"more\"><summary>للتوسع<\/summary><p class=\"\">غيّر النبي ﷺ مقياس القوة: ليست في صرع الخصوم بل في الإمساك بالنفس عند اشتعال الغضب. فالفتى الذي لا يستفزه صراخ السفهاء ويكظم غيظه يملك قوة أعظم من الذي ينفجر عند أول كلمة. وقال تعالى في وصف المتقين: ﴿وَالْكَاظِمِينَ الْغَيْظَ وَالْعَافِينَ عَنِ النَّاسِ﴾ [آل عمران: 134].<\/p><\/details><\/article><article class=\"pt\"><h4><span>٣<\/span>المروءة الصامتة<\/h4><p class=\"ayah\">﴿فَسَقَىٰ لَهُمَا ثُمَّ تَوَلَّىٰ إِلَى الظِّلِّ فَقَالَ رَبِّ إِنِّي لِمَا أَنزَلْتَ إِلَيَّ مِنْ خَيْرٍ فَقِيرٌ﴾ [القصص: 24]<\/p><p class=\"g\">نجدة الضعيف وعون الناس دون انتظار تصفيق أو تصوير هي ذروة الشهامة.<\/p><details class=\"more\"><summary>للتوسع<\/summary><p class=\"\">وصل موسى إلى مدين غريباً متعباً جائعاً، فرأى امرأتين تنتظران فسقى لهما دون مساومة، ثم رجع إلى الظل ودعا ربه. ففي الموقف نجدة للمستضعف، وعفة وحياء، وزهد في الأجر البشري، وتوجه إلى الله بالسؤال. وبعدها جاءته إحدى المرأتين تمشي على استحياء. وكل ذلك وهو غريب ومنهك، فمروءته لم تنتظر ظروفاً مريحة.<\/p><\/details><\/article><article class=\"pt\"><h4><span>٤<\/span>الرجل في بيته<\/h4><p class=\"g\">خدمة الأسرة واللين مع الأهل من صميم المروءة، وليست نقصا في الهيبة.<\/p><details class=\"more\"><summary>للتوسع<\/summary><p class=\"\">سألت عائشة رضي الله عنها: ما كان النبي ﷺ يصنع في بيته؟ قالت: «كَانَ يَكُونُ فِي مِهْنَةِ أَهْلِهِ، فَإِذَا حَضَرَتِ الصَّلاَةُ خَرَجَ إِلَى الصَّلاَةِ» رواه البخاري. فسيد الرجال ﷺ كان يخدم أهله، ويخصف نعله ويرقع ثوبه. ومن ظن أن خدمة الأهل تنقص هيبته فقد خالف سيرة قدوته. وقال ﷺ: «خَيْرُكُمْ خَيْرُكُمْ لأَهْلِهِ، وَأَنَا خَيْرُكُمْ لأَهْلِي» رواه الترمذي.<\/p><\/details><\/article><\/section><section class=\"bs\"><h3>٣ · سؤال للحوار<\/h3><p class=\"big\">ما صورة الرجولة الشائعة؟ وما صورتها الحقيقية؟<\/p><\/section><section class=\"bs\"><h3>٤ · نشاط تطبيقي<\/h3><p class=\"big\">اكتب ثلاثة مواقف مروءة صامتة، ونفذ أحدها هذا الأسبوع.<\/p><\/section><section class=\"bs\"><h3>أسئلة قد تُطرح<\/h3><details class=\"more\"><summary><b>ألا يجعل الحلم والسكوت عن الإهانة الشاب موضع استضعاف وسخرية بين أقرانه؟<\/b><\/summary><p>هناك فرق جوهري بين العجز والذل، وبين الحلم والترفع. الحلم أن تكون قادراً ثم تمسك نفسك ابتغاء مرضاة الله. والشاب الذي لا يستفزه صراخ السفهاء يفرض احترامه على الجميع، بينما سريع الغضب يتحكم فيه كل
