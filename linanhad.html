<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لِنَنْهَض — الدليل التشغيلي للمشرف</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Poppins:wght@400;600&family=Amiri+Quran&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f2ea;--card:#fff;--ink:#2a2226;--mut:#6f6268;--line:#e6dccd;--gold:#b59a62;--c:#8b1538;--hd:#fbf8f3ee;--fs:1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17121a;--card:#221b27;--ink:#f1e9ec;--mut:#b7a9b0;--line:#3a2f3f;--hd:#17121aee;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17121a;--card:#221b27;--ink:#f1e9ec;--mut:#b7a9b0;--line:#3a2f3f;--hd:#17121aee;color-scheme:dark}
html{font-size:calc(100% * var(--fs));scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Poppins','Tajawal',system-ui,sans-serif;line-height:1.9;transition:background .3s,color .3s;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hd);z-index:30}
body::after{content:"";position:fixed;inset:0;z-index:-1;opacity:.5;background:radial-gradient(circle at 0 0,transparent 36px,var(--line) 37px,transparent 38px) 0 0/76px 76px,radial-gradient(circle at 0 0,transparent 36px,var(--line) 37px,transparent 38px) 38px 38px/76px 76px;animation:dr 60s linear infinite}
@keyframes dr{to{background-position:76px 76px,114px 114px}}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;cursor:pointer}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--hd);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.logo{font-weight:800;font-size:1.25rem;color:var(--c);margin-inline-end:auto;font-family:'Tajawal'}
.ib{border:1px solid var(--line);background:var(--card);border-radius:12px;min-width:40px;height:40px;padding:0 10px;font-weight:700;transition:transform .2s}.ib:hover{transform:translateY(-2px)}
main{max-width:920px;margin:0 auto;padding:16px 14px 90px;animation:in .45s both}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
.hero{text-align:center;padding:26px 8px 8px}
.hero h1{font-size:clamp(3rem,12vw,5.5rem);margin:0;color:var(--c);font-weight:800;line-height:1.3}
.hero p{margin:0 0 6px;color:var(--mut)}
.bars{display:flex;gap:10px;justify-content:center;align-items:flex-end;height:120px;margin:18px 0}
.bars i{width:38px;border-radius:9px;border:2px solid #fff6;transform-origin:bottom;animation:gr .9s cubic-bezier(.2,.9,.3,1.3) both;position:relative}
.bars i:last-child::after{content:"★";position:absolute;top:-30px;left:50%;transform:translateX(-50%);color:var(--gold);font-size:1.5rem;animation:tw 2s infinite}
@keyframes gr{from{transform:scaleY(0)}}@keyframes tw{50%{transform:translateX(-50%) scale(1.3) rotate(12deg)}}
.pills{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0 18px}
.pills span{color:#fff;border-radius:99px;padding:2px 14px;font-weight:700;font-size:.9rem}
.cta{display:inline-block;background:var(--c);color:#fff;border-radius:14px;padding:10px 26px;font-weight:700;margin:4px;box-shadow:0 6px 18px #0003;transition:transform .2s}.cta:hover{transform:translateY(-3px) scale(1.03)}.cta.o{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.srch{width:100%;margin:18px 0 6px;padding:11px 16px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.un{margin:26px 0 10px;border-radius:16px;padding:10px 16px;color:#fff;font-weight:800;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 60%,#000))}
.un small{display:block;font-weight:400;opacity:.85}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.lc{position:relative;display:block;background:var(--card);border:1px solid var(--line);border-inline-start:5px solid var(--c);border-radius:14px;padding:10px 14px 10px 44px;transition:transform .25s,box-shadow .25s;animation:in .5s both}
.lc:hover{transform:translateY(-4px);box-shadow:0 10px 22px #0002}
.lc b{position:absolute;inset-inline-end:12px;top:10px;width:34px;height:34px;border-radius:10px;background:var(--c);color:#fff;display:grid;place-items:center}
.lc span{display:block;font-weight:700;padding-inline-end:44px;line-height:1.5}.lc small{color:var(--mut);display:block;margin-top:2px;line-height:1.5}
.lc i{position:absolute;left:10px;top:8px;color:#0f9d6c;font-style:normal;font-weight:800}
.lh{border-radius:20px;color:#fff;padding:18px 20px;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 55%,#000));position:relative;overflow:hidden}
.lh::after{content:attr(data-n);position:absolute;inset-inline-start:10px;bottom:-30px;font-size:8rem;font-weight:800;opacity:.14}
.lh small{opacity:.85}.lh h1{margin:0;font-size:1.7rem;line-height:1.5}.lh .q{margin:4px 0 0;font-weight:500}
.tabs{display:flex;gap:6px;margin:12px 0;position:sticky;top:calc(env(safe-area-inset-top,0px) + 57px);z-index:15;background:var(--bg);padding:6px 0}
.tabs a{flex:1;text-align:center;padding:8px 4px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:.92rem;transition:.2s}
.tabs a.on{background:var(--c);color:#fff;border-color:var(--c);transform:translateY(-2px)}
.plan{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px;font-size:.88rem}.plan span{color:var(--mut)}.plan b{background:color-mix(in srgb,var(--c) 14%,var(--card));color:var(--c);border-radius:99px;padding:0 12px}
.bs,.ac,.pt{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 16px;margin:10px 0;animation:in .5s both}
.bs h3,.pg h3{margin:0 0 6px;color:var(--c)}.warn{border-color:#c0502a;background:color-mix(in srgb,#c0502a 8%,var(--card))}
.pt{border-inline-start:5px solid var(--c)}.pt h4{margin:0 0 4px;font-size:1.05rem;color:var(--c);display:flex;gap:8px;align-items:center}.pt h4 span{background:var(--c);color:#fff;border-radius:8px;min-width:26px;height:26px;display:grid;place-items:center;font-size:.8rem;padding:0 6px}
.ac{padding:0}.ac>summary{padding:12px 16px;font-weight:800;cursor:pointer;color:var(--c);list-style:none;display:flex;justify-content:space-between}.ac>summary::after,.more>summary::after{content:"▾";transition:transform .25s}.ac[open]>summary::after,.more[open]>summary::after{transform:rotate(180deg)}.ac>div{padding:0 16px 12px}
.more{border-top:1px dashed var(--line);margin-top:6px}.more>summary{cursor:pointer;color:var(--c);font-weight:700;padding:6px 0;list-style:none;display:flex;justify-content:space-between}
p{margin:.4rem 0}.g{color:var(--ink)}.big{font-size:1.25rem;font-weight:700}.kq{font-weight:800;font-size:1.1rem}
.ayah,.had{font-family:'Amiri Quran','Tajawal',serif;background:color-mix(in srgb,var(--gold) 14%,var(--card));border-radius:12px;padding:8px 14px;font-size:1.2rem;line-height:2.2}.had{font-family:'Tajawal'}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;margin:8px 0;font-size:.95rem}th,td{border:1px solid var(--line);padding:6px 10px;vertical-align:top;text-align:start}th{background:color-mix(in srgb,var(--c) 14%,var(--card))}
.nav{display:flex;gap:8px;justify-content:space-between;margin-top:22px;flex-wrap:wrap}
.tb{display:flex;gap:8px;margin:8px 0}.tb button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:2px 12px}
.showc{text-align:center;padding:30px 16px}.play{width:96px;height:96px;border-radius:50%;border:0;background:var(--c);color:#fff;font-size:2.4rem;box-shadow:0 0 0 0 var(--c);animation:pl 2s infinite}@keyframes pl{70%{box-shadow:0 0 0 24px #0000}}
.dr{position:fixed;inset:0;z-index:40;visibility:hidden;opacity:0;background:#0007;transition:.25s}.dr.on{visibility:visible;opacity:1}
.dr aside{position:absolute;top:0;bottom:0;inset-inline-start:0;width:min(86vw,360px);background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 12px) 12px 20px;overflow:auto;transform:translateX(100%);transition:transform .3s}.dr.on aside{transform:none}
.dr h5{margin:14px 0 4px;color:#fff;border-radius:10px;padding:2px 12px;background:var(--c)}.dr a{display:flex;gap:8px;padding:5px 8px;border-radius:8px}.dr a:hover{background:var(--line)}.dr a b{color:var(--c);min-width:24px}
.ov{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;justify-content:center;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);background-image:linear-gradient(160deg,color-mix(in srgb,var(--c) 22%,var(--bg)),var(--bg))}
.ov .bar{position:absolute;top:env(safe-area-inset-top,0px);inset-inline:0;height:5px;background:var(--line)}.ov .bar i{display:block;height:100%;width:0;background:var(--c);transition:width .4s}
.ov .x,.ov .fsb{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);inset-inline-end:12px;border:1px solid var(--line);background:var(--card);border-radius:12px;width:42px;height:42px;z-index:2}.ov .fsb{inset-inline-end:62px}
.stage{position:relative;flex:1;margin:60px 56px 40px}.sl{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;overflow:auto;visibility:hidden;opacity:0;transform:translateX(-40px);transition:.45s}.sl.on{visibility:visible;opacity:1;transform:none}
.sl h2{font-size:clamp(1.8rem,5vw,3.2rem);color:var(--c);margin:.2em 0;line-height:1.5}.sl h2.big{color:var(--ink)}.sl small{background:var(--c);color:#fff;border-radius:99px;padding:0 16px;font-weight:700}
.sl .cn{font-size:clamp(5rem,20vw,10rem);font-weight:800;color:var(--c);line-height:1;animation:pl2 1.2s both}@keyframes pl2{from{transform:scale(.3);opacity:0}}
.sl .q,.sl .g{font-size:clamp(1.1rem,3vw,1.7rem)}.sl .ayah,.sl .had{font-size:clamp(1.4rem,4vw,2.4rem);max-width:900px}.sl .lg{font-size:clamp(1.1rem,2.6vw,1.6rem)}
.sl ul,.sl ol{text-align:start;font-size:clamp(1.1rem,2.8vw,1.6rem);max-width:860px;padding-inline-start:1.4em}.sl details{text-align:start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 14px;margin:6px 0;width:min(100%,820px);font-size:clamp(1rem,2.4vw,1.3rem)}.sl summary{cursor:pointer;font-weight:700;color:var(--c)}
.frag{transition:.5s}.frag:not(.on){opacity:0;transform:translateY(16px);visibility:hidden}
.nv{position:absolute;top:50%;width:44px;height:64px;margin-top:-32px;border:1px solid var(--line);background:var(--card);border-radius:12px;font-size:1.8rem;z-index:2}.nx{left:6px}.pv{right:6px}.ct{position:absolute;bottom:8px;inset-inline:0;text-align:center;color:var(--mut);font-size:.85rem}
@media(max-width:600px){.stage{margin:60px 8px 40px}.nv{top:auto;bottom:6px;margin:0;height:40px}}
@media print{header,.tabs,.nav,.tb{display:none}}
</style>
</head>
<body>
<header><button class="ib" id="mn" aria-label="الفهرس">☰ الفهرس</button><a class="logo" href="#home">لِنَنْهَض</a><button class="ib" id="fm" aria-label="تصغير الخط">A−</button><button class="ib" id="fp" aria-label="تكبير الخط">A+</button><button class="ib" id="th" aria-label="الوضع الليلي أو النهاري">◐</button></header>
<div class="dr" id="dr"><aside id="da"></aside></div>
<main id="app"></main>
<script type="application/json" id="D">{"units": [{"name": "الحصانة الفكرية واليقين", "ls": [1, 2, 3, 4, 5, 6]}, {"name": "صناعة الذات وهندسة العادات", "ls": [7, 8, 9, 10]}, {"name": "فقه الأولويات وإدارة الحياة", "ls": [11, 12, 13, 14, 15, 16]}, {"name": "معاني الرجولة والهوية", "ls": [17, 18, 19]}, {"name": "المهارات المستقبلية والجاهزية العملية", "ls": [20, 21, 22, 23, 24, 25]}], "L": [{"summary": "<p class=\"\">يخرج الفتى من هذا اللقاء وقد أدرك أن وجوده ليس صدفة ولا عبثاً، وأنه عبدٌ لله مستخلَفٌ في الأرض، وأن هذه الغاية هي أساس هويته ومعيار نجاحه في كل ما يفعله. وهو اللقاء الذي تقوم عليه الوحدة كلها، فلا يمكن للفتى أن يفحص الشبهات أو يفكر نقدياً قبل أن تكون له بوصلة تدله على الاتجاه.<\/p><div class=\"tw\"><table><tr><th><b>المهارة المستهدفة<\/b><\/th><th><b>معناها العملي<\/b><\/th><\/tr><tr><td><b>الوعي الوجودي<\/b><\/td><td>يطرح أسئلة الغاية ويبحث عن المعنى الكلي لحياته<\/td><\/tr><tr><td><b>الاستقلال الواعي<\/b><\/td><td>يتحرر من ضغط الأقران والنموذج الاستهلاكي العابث<\/td><\/tr><tr><td><b>صناعة المعنى<\/b><\/td><td>يجعل رضا الله ميزان قراراته اليومية<\/td><\/tr><\/table><\/div>", "kit": "<p class=\"\"><b>ما يعيشه الفتى:<\/b> يجمع الفتى في هذه السن بين رغبة قوية في الاستقلال وتأكيد الذات، وارتباكٍ أمام أسئلة المعنى، مع ضغط العالم الرقمي وسطحية الترفيه. يريد أن يُعامَل كراشد، وقد يتصرف أحياناً كطفل. وكثير منهم نشأ على اهتمامات ترفيهية بلا أهداف كبرى، فهو يحتاج إلى من يفتح له الباب لا من يحاكمه على ما مضى.<\/p><p class=\"\"><b>منهجك في الاحتواء، وهو منهج نبوي:<\/b><\/p><p class=\"\"><b>استقبل القلق بلا استنكار:<\/b> أسئلة الفتى عن الوجود بداية نضج وبحث عن الحقيقة وليست انحرافاً يُعاقَب عليه. وقد قرّب النبي ﷺ الشاب الذي جاءه يستأذنه في الزنا وأدناه ولم يعنّفه.<\/p><p class=\"\"><b>حاور بأسئلة تولّد الجواب:<\/b> خاطب الفطرة والعقل معاً، كما قال له النبي ﷺ: «أتحبّه لأمّك؟ أتحبّه لأختك؟» حتى وصل الشاب بنفسه إلى الاقتناع.<\/p><p class=\"\"><b>استدعِ نموذج الفتوة الإسلامية:<\/b> أسامة بن زيد قاد الجيش وهو فتى، ومصعب بن عمير حمل سفارة الدعوة، ومعاذ بن جبل بلغ في الفقه والعلم مبلغاً عظيماً في سن مبكرة.<\/p><p class=\"\"><b>تذكّر:<\/b> دورك دور الميسّر لا المحاضر. اجعل نسبة حديثك أقل من نسبة حديثهم، وإذا أخطأ فتى في إجابته فابدأ بما أصاب فيه.<\/p>", "hookT": "رحلة الطائرة بلا وجهة", "hook": "<p class=\"\">اعرض صورة أو مجسماً لطائرة نفاثة مجهزة بكل أسباب الرفاهية: شاشات وألعاب ومقاعد فاخرة، ثم احكِ لهم القصة بهدوء:<\/p><p class=\"\">صعدتم إلى هذه الطائرة واستمتعتم بخدماتها، ثم سألتم الكابتن: إلى أين تأخذنا هذه الرحلة؟ فقال بهدوء: لا توجد وجهة محددة! نحن نطير ونستمتع حتى ينفد الوقود ونسقط في أي مكان!<\/p><p class=\"\"><b>أسئلة الاستثارة:<\/b><\/p><p class=\"\">ما شعورك لحظة سماع جواب الكابتن؟ وهل تبقى للرفاهية قيمتها؟<\/p><p class=\"\">هل يشبه هذا حال الإنسان الغارق في الاستهلاك الرقمي دون أن يعرف سبب وجوده ومحطته الأخيرة؟<\/p><p class=\"\"><b>كيف تربط:<\/b> دع الطلاب يصلون إلى أن الطائرة بلا وجهة تنتهي إلى السقوط مهما كانت فاخرة، ثم قل: سنقضي اللقاء في البحث عن وجهة رحلتنا.<\/p>", "pts": "<article class=\"pt\"><h4><span>أولاً<\/span>الغاية معلنة وصريحة<\/h4><p class=\"ayah\">﴿وَمَا خَلَقْتُ الْجِنَّ وَالْإِنسَ إِلَّا لِيَعْبُدُونِ﴾ [الذاريات: 56]<\/p><p class=\"\">العبادة في هذه الآية ليست شعائر تؤدى في المسجد فقط، بل هي منهج حياة كامل: كل عمل يُراد به وجه الله ويوافق شرعه، فتتحول الدراسة والعمل والرياضة والترفيه المباح إلى عبادة بالنية. وفي معنى العبودية تحرير الإنسان؛ فمن لم يكن عبداً لله صار عبداً لشهواته أو لأقرانه أو لصورته أمام الناس. ومن صرّح بهذه الحقيقة: ﴿قُلْ إِنَّ صَلَاتِي وَنُسُكِي وَمَحْيَايَ وَمَمَاتِي لِلَّهِ رَبِّ الْعَالَمِينَ﴾ [الأنعام: 162].<\/p><\/article><article class=\"pt\"><h4><span>ثانياً<\/span>الكون مسيّر بحكمة والإنسان لم يُخلق سدى<\/h4><p class=\"ayah\">﴿أَفَحَسِبْتُمْ أَنَّمَا خَلَقْنَاكُمْ عَبَثًا وَأَنَّكُمْ إِلَيْنَا لَا تُرْجَعُونَ﴾ [المؤمنون: 115]<\/p><p class=\"\">الاستفهام هنا إنكاري؛ فمن نظر في دقة الكون وإحكامه لا يليق به أن يظن أن خالقه خلق الإنسان بلا قصد ولا حساب. والإيمان بالرجوع إلى الله يعطي لكل فعل وزناً، فلا يكون الخير والشر عند الإنسان سواء.<\/p><\/article><article class=\"pt\"><h4><span>ثالثاً<\/span>التيه حين تُنسى الغاية<\/h4><p class=\"ayah\">﴿وَلَا تَكُونُوا كَالَّذِينَ نَسُوا اللَّهَ فَأَنسَاهُمْ أَنفُسَهُمْ ۚ أُولَٰئِكَ هُمُ الْفَاسِقُونَ﴾ [الحشر: 19]<\/p><p class=\"\">من نسي ربه فقد معرفة نفسه، ومن جهل نفسه ضاعت بوصلته. وهذا ما نراه في اضطراب الهوية والفراغ الذي يلاحق من يملك كل شيء ولا يعرف لماذا. وكل ما يقدمه الإنسان لنفسه بعد ذلك من غايات بديلة (شهرة، مال، متعة) لا يملأ الفراغ.<\/p><\/article><article class=\"pt\"><h4><span>رابعاً<\/span>الهوية والسيادة النفسية<\/h4><p class=\"had\">عن ابن عباس رضي الله عنهما قال: كنت خلف النبي ﷺ يوماً فقال: «يا غلامُ، إني أُعلِّمُك كلماتٍ: احفَظِ اللهَ يحفَظْك، احفَظِ اللهَ تَجِدْه تُجاهَك، إذا سأَلتَ فاسأَلِ اللهَ، وإذا استعَنْتَ فاستَعِنْ باللهِ، واعلَمْ أنَّ الأمَّةَ لو اجتمَعَتْ على أن ينفَعوك بشيءٍ لم ينفَعوك إلَّا بشيءٍ قد كتَبه اللهُ لك...» رواه الترمذي<\/p><p class=\"\">وجّه النبي ﷺ هذه الكلمات إلى غلام في سن قريبة من سن طلابك، فجعل هويته قائمة على حفظ الله وسؤاله والاستعانة به، فلا يخاف أحداً ولا يتعلق بأحد. وهذه هي السيادة النفسية: أن يعرف الفتى أن قيمته لا تأتي من إعجابات الناس ولا يهدمها رأيهم.<\/p><\/article><article class=\"pt\"><h4><span>خامساً<\/span>الشباب زمن البناء والمساءلة<\/h4><p class=\"had\">قال رسول الله ﷺ: «لا تزولُ قَدَمَا عَبْدٍ يومَ القيامةِ حتى يُسألَ عن أربعٍ: عن عُمُرِهِ فيما أفناهُ، وعن شَبابِهِ فيما أبلاهُ، وعن مالِهِ من أين اكتسبَهُ وفيما أنفقَهُ، وعن علمِهِ ماذا عمِلَ فيه» رواه الترمذي<\/p><p class=\"\">أُفرد الشباب بالسؤال بعد العمر، وفي ذلك إشارة إلى أنه أخصب مراحل العمر وأقواها طاقة، فهو زمن البناء والأثر لا زمن التسويف.<\/p><\/article><article class=\"pt\"><h4><span>سادساً<\/span>الغاية الكبرى والأهداف المرحلية<\/h4><p class=\"\">الغاية الكبرى واحدة لا تتغير، وهي رضا الله بالعبودية والإصلاح. أما الأهداف المرحلية كالتفوق الدراسي والتخصص والمشروعات فهي طرق لخدمتها. وإذا ضاق مفهوم النجاح حتى صار شهادة أو وظيفة أو مالاً، عاش الفتى قلقاً من الفشل. أما من يعرف أن مقياسه رضا الله والسعي الصادق، فيعمل بكل جهده ثم يطمئن إلى أن عليه السعي وليس عليه النتائج. وقد قال النبي ﷺ: «إنَّ اللهَ لا يَنظُرُ إلى صُوَرِكم وأموالِكم، ولكن يَنظُرُ إلى قلوبِكم وأعمالِكم» رواه مسلم.<\/p><\/article><article class=\"pt\"><h4><span>سابعاً<\/span>الاستخلاف وعمارة الأرض<\/h4><p class=\"ayah\">﴿وَإِذْ قَالَ رَبُّكَ لِلْمَلَائِكَةِ إِنِّي جَاعِلٌ فِي الْأَرْضِ خَلِيفَةً﴾ [البقرة: 30]<\/p><p class=\"\">الاستخلاف يعني أن الإنسان مكلَّف بعمارة الأرض وإصلاحها، فالتفوق العلمي والتقني جزء من العبادة إذا حسنت النية، وليس منافساً لها. والعبادات المفروضة تمارين متكررة تعوّد المسلم على الأخلاق الصحيحة: الصلاة تعلم الانضباط، والصيام يعلم ضبط الشهوة، والزكاة تعلم البذل.<\/p><\/article><article class=\"pt\"><h4><span>ثامناً<\/span>نموذجان قرآنيان للفتوة<\/h4><p class=\"\"><b>إبراهيم عليه السلام:<\/b> تأمل الكوكب والقمر والشمس فقال: ﴿لَا أُحِبُّ الْآفِلِينَ﴾ [الأنعام: 76]، ثم أعلن: ﴿إِنِّي وَجَّهْتُ وَجْهِيَ لِلَّذِي فَطَرَ السَّمَاوَاتِ وَالْأَرْضَ حَنِيفًا﴾ [الأنعام: 79]. الفائدة: استخدام التفكير الفطري السليم للوصول إلى الحقيقة والانفكاك عن تقليد البيئة الفاسدة.<\/p><p class=\"\"><b>أصحاب الكهف:<\/b> ﴿إِنَّهُمْ فِتْيَةٌ آمَنُوا بِرَبِّهِمْ وَزِدْنَاهُمْ هُدًى﴾ [الكهف: 13]. الفائدة: فتية واجهوا مجتمعاً وثنياً بثبات على المبدأ والهوية، فزادهم الله هدى.<\/p><\/article>", "qa": "<div class=\"tw\"><table><tr><th><b>السؤال المتوقع<\/b><\/th><th><b>تفكيكه<\/b><\/th><\/tr><tr><td><b>لماذا خلقنا الله وهو غني عن عبادتنا؟<\/b><\/td><td>عبادتنا ليست لحاجة الله إليها، فهو الغني المطلق، بل هي حاجة فطرية فينا. الإنسان مفطور على التعلق، فإن لم يعبد الله استعبدته الشهوات أو الأقران أو الترندات. والعبادة تطعم الروح سكينة وتمنح الحياة اتزانها.<\/td><\/tr><tr><td><b>هل الاهتمام بالغاية الأخروية يعني إهمال النجاح الدنيوي والتقدم التقني؟<\/b><\/td><td>إطلاقاً. عمارة الأرض جزء من الاستخلاف والعبادة إذا حسنت النية، وتحصيل التفوق التقني النافع فريضة يوجبها الدين وضرورة يحتمها الواقع.<\/td><\/tr><tr><td><b>أشعر بالتشتت ولا أعلم شغفي في الحياة<\/b><\/td><td>الغاية الكبرى محددة للجميع. أما المسارات والتخصصات فتُكتشف بالتجربة والعمل والتدرج، ولا يُطلب منه أن يعرفها كلها الآن.<\/td><\/tr><tr><td><b>هل أنا أقل إيماناً لأنني لا أشعر بهذه الغاية؟<\/b><\/td><td>الشعور بالتيه في هذه السن شائع، وهو دعوة للبحث لا دليل على ضعف الإيمان. المهم أن يتحرك بالسؤال نحو الجواب لا أن يبقى في الحيرة.<\/td><\/tr><\/table><\/div>", "radar": "<p class=\"\"><b>مؤشرات الخطر:<\/b> تردد عبارات عدمية مثل «لماذا نعيش إذا كنا سنموت؟»، والسخرية من الغايات الإيمانية، والانغماس الرقمي الكامل هرباً من الواقع.<\/p><p class=\"\"><b>بروتوكول التدخل:<\/b><\/p><p class=\"step\"><b>1. <\/b>تجنب الصدام والتخوين الإيماني أمام الطلاب.<\/p><p class=\"step\"><b>2. <\/b>اجلس معه جلسة فردية قائمة على الإنصات والرفق، واستمع لحيرته كاملة دون مقاطعة.<\/p><p class=\"step\"><b>3. <\/b>استثر فطرته بأسئلة هادئة، ثم أعد ربطه برفيق صالح من الحلقة.<\/p>", "actT": "«بوصلة حياتي»  نشاط ذهني وحواري", "act": "<p class=\"\"><b>الفكرة:<\/b> يقارن الطلاب بين نموذجين من الحياة، ثم يرسم كل واحد منهم بوصلته.<\/p><p class=\"step\"><b>1. التقسيم:<\/b> ثلاث مجموعات: المستكشفون، والبناة، والمرابطون.<\/p><p class=\"step\"><b>2. دراسة الحالة:<\/b> <b>سالم<\/b> متفوق دراسياً ورقمياً لكنه يعاني فراغاً واكتئاباً لغياب الغاية، و<b>عمر<\/b> مجتهد ورياضي يربط تفوقه بنية العبودية والاستخلاف ونفع المسلمين.<\/p><p class=\"step\"><b>3. المهمة:<\/b> تستخرج كل مجموعة أربعة فروق جوهرية: مرجعية الهوية، ومعيار النجاح، والصلابة عند الأزمات، والنظرة للمستقبل.<\/p><p class=\"step\"><b>4. العرض:<\/b> يقدم ممثل كل مجموعة خلاصة النقاش أمام الجميع.<\/p><p class=\"step\"><b>5. الخلوة الفردية:<\/b> يعبّئ كل طالب البطاقة التالية بنفسه بصمت.<\/p><div class=\"tw\"><table><tr><th colspan=\"2\"><b>بطاقة: بوصلة حياتي<\/b><\/th><\/tr><tr><td><b>1. هويتي الصلبة<\/b><\/td><td>ثلاث صفات أعتز بها كشاب مسلم: ............................<\/td><\/tr><tr><td><b>2. غايتي العظمى<\/b><\/td><td>ما الأثر الذي أريد أن ألقى الله به؟ ............................<\/td><\/tr><tr><td><b>3. أهدافي الثلاثة لخدمة غايتي<\/b><\/td><td>إيماني: ............ دراسي: ............ مهاري: ............<\/td><\/tr><tr><td><b>4. قرار التحرر<\/b><\/td><td>عادة أو رفقة سيئة سأتخلى عنها فوراً: ............................<\/td><\/tr><\/table><\/div><p class=\"\"><b>أدوار مجلس الفتيان:<\/b> ضابط الإيقاع (يلتزم بالفقرات)، ومدوّن الخلاصات (يسجل القواعد الناتجة)، ومنسّق التفاعل (ينظم المداخلات والأدوات).<\/p>", "week": "<p class=\"\"><b>خلوة الاستقامة:<\/b> خمس عشرة دقيقة يومياً بعيداً عن الهاتف والشاشات لمراجعة الأهداف.<\/p><p class=\"\"><b>قرار العبودية:<\/b> يلتزم كل طالب بتغيير سلوكي واحد دائم، ويقرأ بطاقة بوصلته كل يوم.<\/p><p class=\"\"><b>جسر إلى اللقاء الثاني:<\/b> امتلاك الغاية يحتاج إلى عقل مميِّز يحميها من الانحراف، وهذا موضوع «أدوات التفكير الصحيح».<\/p>", "kq": "من أنا؟ ولماذا أنا هنا؟", "brief": "<div class=\"plan\"><span>اقتراح لتوزيع الوقت (١٠–١٥ د)<\/span><b>افتتاح ٣<\/b><b>محاور ٥<\/b><b>حوار ٢<\/b><b>نشاط ٣<\/b><b>ختام ٢<\/b><\/div><section class=\"bs\"><h3>١ · الافتتاح: رحلة الطائرة بلا وجهة<\/h3><p class=\"\">اعرض صورة أو مجسماً لطائرة نفاثة مجهزة بكل أسباب الرفاهية: شاشات وألعاب ومقاعد فاخرة، ثم احكِ لهم القصة بهدوء:<\/p><p class=\"\">صعدتم إلى هذه الطائرة واستمتعتم بخدماتها، ثم سألتم الكابتن: إلى أين تأخذنا هذه الرحلة؟ فقال بهدوء: لا توجد وجهة محددة! نحن نطير ونستمتع حتى ينفد الوقود ونسقط في أي مكان!<\/p><p class=\"\"><b>أسئلة الاستثارة:<\/b><\/p><p class=\"\">ما شعورك لحظة سماع جواب الكابتن؟ وهل تبقى للرفاهية قيمتها؟<\/p><p class=\"\">هل يشبه هذا حال الإنسان الغارق في الاستهلاك الرقمي دون أن يعرف سبب وجوده ومحطته الأخيرة؟<\/p><p class=\"\"><b>كيف تربط:<\/b> دع الطلاب يصلون إلى أن الطائرة بلا وجهة تنتهي إلى السقوط مهما كانت فاخرة، ثم قل: سنقضي اللقاء في البحث عن وجهة رحلتنا.<\/p><\/section><section class=\"bs\"><h3>٢ · المحاور<\/h3><article class=\"pt\"><h4><span>١<\/span>الغاية معلنة وصريحة<\/h4><p class=\"ayah\">﴿وَمَا خَلَقْتُ الْجِنَّ وَالْإِنسَ إِلَّا لِيَعْبُدُونِ﴾ [الذاريات: 56]<\/p><p class=\"g\">العبادة منهج حياة كامل وليست شعائر فقط.<\/p><details class=\"more\"><summary>للتوسع<\/summary><p class=\"\">العبادة في هذه الآية ليست شعائر تؤدى في المسجد فقط، بل هي منهج حياة كامل: كل عمل يُراد به وجه الله ويوافق شرعه، فتتحول الدراسة والعمل والرياضة والترفيه المباح إلى عبادة بالنية. وفي معنى العبودية تحرير الإنسان؛ فمن لم يكن عبداً لله صار عبداً لشهواته أو لأقرانه أو لصورته أمام الناس. ومن صرّح بهذه الحقيقة: ﴿قُلْ إِنَّ صَلَاتِي وَنُسُكِي وَمَحْيَايَ وَمَمَاتِي لِلَّهِ رَبِّ الْعَالَمِينَ﴾ [الأنعام: 162].<\/p><\/details><\/article><article class=\"pt\"><h4><span>٢<\/span>الإنسان لم يخلق سدى<\/h4><p class=\"ayah\">﴿أَفَحَسِبْتُمْ أَنَّمَا خَلَقْنَاكُمْ عَبَثًا وَأَنَّكُمْ إِلَيْنَا لَا تُرْجَعُونَ﴾ [المؤمنون: 115]<\/p><p class=\"g\">دقة الكون تنفي العبثية.<\/p><details class=\"more\"><summary>للتوسع<\/summary><p class=\"\">الاستفهام هنا إنكاري؛ فمن نظر في دقة الكون وإحكامه لا يليق به أن يظن أن خالقه خلق الإنسان بلا قصد ولا حساب. والإيمان بالرجوع إلى الله يعطي لكل فعل وزناً، فلا يكون الخير والشر عند الإنسان سواء.<\/p><\/details><\/article><article class=\"pt\"><h4><span>٣<\/span>التيه حين تنسى الغاية<\/h4><p class=\"ayah\">﴿وَلَا تَكُونُوا كَالَّذِينَ نَسُوا اللَّهَ فَأَنسَاهُمْ أَنفُسَهُمْ ۚ أُولَٰئِكَ هُمُ الْفَاسِقُونَ﴾ [الحشر: 19]<\/p><p class=\"g\">نسيان الله يقود لضياع البوصلة والهوية.<\/p><details class=\"more\"><summary>للتوسع<\/summary><p class=\"\">من نسي ربه فقد معرفة نفسه، ومن جهل نفسه ضاعت بوصلته. وهذا ما نراه في اضطراب الهوية والفراغ الذي يلاحق من يملك كل شيء ولا يعرف لماذا. وكل ما يقدمه الإنسان لنفسه بعد ذلك من غايات بديلة (شهرة، مال، متعة) لا يملأ الفراغ.<\/p><\/details><\/article><article class=\"pt\"><h4><span>٤<\/span>الشباب زمن البناء والمساءلة<\/h4><p class=\"had\">قال رسول الله ﷺ: «لا تزولُ قَدَمَا عَبْدٍ يومَ القيامةِ حتى يُسألَ عن أربعٍ: عن عُمُرِهِ فيما أفناهُ، وعن شَبابِهِ فيما أبلاهُ، وعن مالِهِ من أين اكتسبَهُ وفيما أنفقَهُ، وعن علمِهِ ماذا عمِلَ فيه» رواه الترمذي<\/p><p class=\"g\">مرحلة القوة للأثر لا للتسويف.<\/p><details class=\"more\"><summary>للتوسع<\/summary><p class=\"\">أُفرد الشباب بالسؤال بعد العمر، وفي ذلك إشارة إلى أنه أخصب مراحل العمر وأقواها طاقة، فهو زمن البناء والأثر لا زمن التسويف.<\/p><\/details><\/article><\/section><section class=\"bs\"><h3>٣ · سؤال للحوار<\/h3><p class=\"big\">لو سئلت الآن «لماذا أنا هنا؟» فبأي جملة تجيب؟<\/p><\/section><section class=\"bs\"><h3>٤ · نشاط تطبيقي<\/h3><p class=\"big\">اكتب «رسالتي في عشر كلمات» وشاركها مع زميلك.<\/p><\/section><section class=\"bs\"><h3>أسئلة قد تُطرح<\/h3><details class=\"more\"><summary><b>لماذا خلقنا الله وهو غني عن عبادتنا؟<\/b><\/summary><p>عبادتنا ليست لحاجة الله إليها، فهو الغني المطلق، بل هي حاجة فطرية فينا. الإنسان مفطور على التعلق، فإن لم يعبد الله استعبدته الشهوات أو الأقران أو الترندات. والعبادة تطعم الروح سكينة وتمنح الحياة اتزانها.<\/p><\/details><details class=\"more\"><summary><b>هل الاهتمام بالغاية الأخروية يعني إهمال النجاح الدنيوي والتقدم التقني؟<\/b><\/summary><p>إطلاقاً. عمارة الأرض جزء من الاستخلاف والعبادة إذا حسنت النية، وتحصيل التفوق التقني النافع فريضة يوجبها الدين وضرورة يحتمها الواقع.<\/p><\/details><\/section><section class=\"bs warn\"><h3>رادار الحماية<\/h3><p><b>مؤشرات الخطر:<\/b> تردد عبارات عدمية مثل «لماذا نعيش إذا كنا سنموت؟»، والسخرية من الغايات الإيمانية، والانغماس الرقمي الكامل هرباً من الواقع.<\/p><small>البروتوكول كاملاً في تبويب «الكامل».<\/small><\/section><section class=\"bs\"><h3>٥ · رحلة الأسبوع<\/h3><p class=\"\"><b>خلوة الاستقامة:<\/b> خمس عشرة دقيقة يومياً بعيداً عن الهاتف والشاشات لمراجعة الأهداف.<\/p><p class=\"\"><b>قرار العبودية:<\/b> يلتزم كل طالب بتغيير سلوكي واحد دائم، ويقرأ بطاقة بوصلته كل يوم.<\/p><p class=\"\"><b>جسر إلى اللقاء الثاني:<\/b> امتلاك الغاية يحتاج إلى عقل مميِّز يحميها من الانحراف، وهذا موضوع «أدوات التفكير الصحيح».<\/p><\/section>", "slides": ["<div class=\"cn\">1<\/div><h2>بوصلة الوجود (الغاية والهوية)<\/h2><p class=\"q\">لماذا نحن هنا؟ وما غايتنا الكبرى؟<\/p>", "<small>إضاءة استهلالية<\/small><h2>رحلة الطائرة بلا وجهة<\/h2><ul><li class=\"frag\">ما شعورك لحظة سماع جواب الكابتن؟ وهل تبقى للرفاهية قيمتها؟<\/li><li class=\"frag\">هل يشبه هذا حال الإنسان الغارق في الاستهلاك الرقمي دون أن يعرف سبب وجوده ومحطته الأخيرة؟<\/li><\/ul>", "<small>1<\/small><h2>الغاية معلنة وصريحة<\/h2><p class=\"ayah\">﴿وَمَا خَلَقْتُ الْجِنَّ وَالْإِنسَ إِلَّا لِيَعْبُدُونِ﴾ [الذاريات: 56]<\/p><p class=\"g frag\">العبادة منهج حياة كامل وليست شعائر فقط.<\/p>", "<small>2<\/small><h2>الإنسان لم يخلق سدى<\/h2><p class=\"ayah\">﴿أَفَحَسِبْتُمْ أَنَّمَا خَلَقْنَاكُمْ عَبَثًا وَأَنَّكُمْ إِلَيْنَا لَا تُرْجَعُونَ﴾ [المؤمنون: 115]<\/p><p class=\"g frag\">دقة الكون تنفي العبثية.<\/p>", "<small>3<\/small><h2>التيه حين تنسى الغاية<\/h2><p class=\"ayah\">﴿وَلَا تَكُونُوا كَالَّذِينَ نَسُوا اللَّهَ فَأَنسَاهُمْ أَنفُسَهُمْ ۚ أُولَٰئِكَ هُمُ الْفَاسِقُونَ﴾ [الحشر: 19]<\/p><p class=\"g frag\">نسيان الله يقود لضياع البوصلة والهوية.<\/p>", "<small>4<\/small><h2>الشباب زمن البناء والمساءلة<\/h2><p class=\"had lg\">قال رسول الله ﷺ: «لا تزولُ قَدَمَا عَبْدٍ يومَ القيامةِ حتى يُسألَ عن أربعٍ: عن عُمُرِهِ فيما أفناهُ، وعن شَبابِهِ فيما أبلاهُ، وعن مالِهِ من أين اكتسبَهُ وفيما أنفقَهُ، وعن علمِهِ ماذا عمِلَ فيه» رواه الترمذي<\/p><p class=\"g frag\">مرحلة القوة للأثر لا للتسويف.<\/p>", "<small>سؤال للحوار<\/small><h2 class=\"big\">لو سئلت الآن «لماذا أنا هنا؟» فبأي جملة تجيب؟<\/h2>", "<small>نشاط تطبيقي<\/small><h2 class=\"big\">اكتب «رسالتي في عشر كلمات» وشاركها مع زميلك.<\/h2>", "<small>سؤال وبرهان<\/small><details class=\"frag\"><summary><b>لماذا خلقنا الله وهو غني عن عبادتنا؟<\/b><\/summary><p>عبادتنا ليست لحاجة الله إليها، فهو الغني المطلق، بل هي حاجة فطرية فينا. الإنسان مفطور على التعلق، فإن لم يعبد الله استعبدته الشهوات أو الأقران أو الترندات. والعبادة تطعم الروح سكينة وتمنح الحياة اتزانها.<\/p><\/details><details class=\"frag\"><summary><b>هل الاهتمام بالغاية الأخروية يعني إهمال النجاح الدنيوي والتقدم التقني؟<\/b><\/summary><p>إطلاقاً. عمارة الأرض جزء من الاستخلاف والعبادة إذا حسنت النية، وتحصيل التفوق التقني النافع فريضة يوجبها الدين وضرورة يحتمها الواقع.<\/p><\/details><details class=\"frag\"><summary><b>أشعر بالتشتت ولا أعلم شغفي في الحياة<\/b><\/summary><p>الغاية الكبرى محددة للجميع. أما المسارات والتخصصات فتُكتشف بالتجربة والعمل والتدرج، ولا يُطلب منه أن يعرفها كلها الآن.<\/p><\/details><details class=\"frag\"><summary><b>هل أنا أقل إيماناً لأنني لا أشعر بهذه الغاية؟<\/b><\/summary><p>الشعور بالتيه في هذه السن شائع، وهو دعوة للبحث لا دليل على ضعف الإيمان. المهم أن يتحرك بالسؤال نحو الجواب لا أن يبقى في الحيرة.<\/p><\/details>", "<small>ميدان التطبيق<\/small><h2>«بوصلة حياتي»  نشاط ذهني وحواري<\/h2><ol><li class=\"frag\">الفكرة: يقارن الطلاب بين نموذجين من الحياة، ثم يرسم كل واحد منهم بوصلته.<\/li><li class=\"frag\">1. التقسيم: ثلاث مجموعات: المستكشفون، والبناة، والمرابطون.<\/li><li class=\"frag\">2. دراسة الحالة: سالم متفوق دراسياً ورقمياً لكنه يعاني فراغاً واكتئاباً لغياب الغاية، وعمر مجتهد ورياضي يربط تفوقه بنية العبودية والاستخلاف ونفع…<\/li><li class=\"frag\">3. المهمة: تستخرج كل مجموعة أربعة فروق جوهرية: مرجعية الهوية، ومعيار النجاح، والصلابة عند الأزمات، والنظرة للمستقبل.<\/li><li class=\"frag\">4. العرض: يقدم ممثل كل مجموعة خلاصة النقاش أمام الجميع.<\/li><li class=\"frag\">5. الخلوة الفردية: يعبّئ كل طالب البطاقة التالية بنفسه بصمت.<\/li><\/ol>", "<small>رحلة الأسبوع<\/small><ul><li class=\"frag\"><b>خلوة الاستقامة:<\/b> خمس عشرة دقيقة يومياً بعيداً عن الهاتف والشاشات لمراجعة الأهداف.<\/li><li class=\"frag\"><b>قرار العبودية:<\/b> يلتزم كل طالب بتغيير سلوكي واحد دائم، ويقرأ بطاقة بوصلته كل يوم.<\/li><li class=\"frag\"><b>جسر إلى اللقاء الثاني:<\/b> امتلاك الغاية يحتاج إلى عقل مميِّز يحميها من الانحراف، وهذا موضوع «أدوات التفكير الصحيح».<\/li><\/ul>"], "n": 1, "u": 0, "title": "بوصلة الوجود (الغاية والهوية)", "q": "لماذا نحن هنا؟ وما غايتنا الكبرى؟", "dqq": "لو سئلت الآن «لماذا أنا هنا؟» فبأي جملة تجيب؟", "pact": "اكتب «رسالتي في عشر كلمات» وشاركها مع زميلك."}, {"summary": "<p class=\"\">بعد أن عرف الفتى غايته، يحتاج إلى عقل يحمي هذه البوصلة من الانحراف. يتعلم في هذا اللقاء أن الإسلام يطلب الدليل ويذم التقليد الأعمى، وأن التثبت من الخبر قبل نشره وتصديقه عبادة عقلية وأخلاقية. ويتدرب على كشف أشهر المغالطات التي تُستعمل في الإعلام والجدل.<\/p><div class=\"tw\"><table><tr><th><b>المهارة المستهدفة<\/b><\/th><th><b>معناها العملي<\/b><\/th><\/tr><tr><td><b>التفكير الناقد<\/b><\/td><td>يفحص الدعوى والدليل قبل أن يحكم<\/td><\/tr><tr><td><b>كشف المغالطات<\/b><\/td><td>يسمّي أسلوب التضليل ويفككه<\/td><\/tr><tr><td><b>التثبت المعرفي<\/b><\/td><td>يتحرر من الإشاعة والرأي الشائع<\/td><\/tr><\/table><\/div>", "kit": "<p class=\"\"><b>ما يعيشه الفتى:<\/b> يتحول تفكير الفتى في هذه المرحلة نحو الاستدلال المجرد، لكنه يتلقى سيلاً من المعلومات السريعة بلا فحص، فتختلط عليه الحجة بالضجيج. يحب أن يُقال له إنه قادر على التفكير، وأن يُطلب منه رأيه.<\/p><p class=\"\"><b>احذر سوء الفهم:<\/b> التفكير الناقد ليس شكاً في كل شيء ولا تمرداً على الثوابت. هو أداة لفحص الأدلة للوصول إلى اليقين.<\/p><p class=\"\"><b>كن قدوة في التثبت:<\/b> إذا سألك أحدهم سؤالاً لا تعرف جوابه فقل «سأتثبت وأعود إليكم»، فهذا أبلغ تعليم.<\/p><p class=\"\"><b>تجنب الاستعلاء:<\/b> لا تصف أحداً بالجهل أمام الطلاب. اجعل المغالطة هي المخطئة لا الشخص.<\/p>", "hookT": "مختبر المنشور المضلل", "hook": "<p class=\"\">اعرض منشوراً مصمماً بشكل احترافي نصه:<\/p><p class=\"\">أكد الدكتور (X) المتخصص في العلوم الإنسانية بجامعته المشهورة أن تناول السكريات قبل النوم يزيد الذكاء بنسبة 80%، وأضاف: وكل من يرفض هذه الحقيقة شخص رجعي يحارب التطوير الذاتي!<\/p><p class=\"\"><b>المهمة:<\/b> من ينشر هذا المنشور فوراً؟ ومن يتوقف للتثبت ولماذا؟<\/p><p class=\"\"><b>أسئلة الاستثارة:<\/b><\/p><p class=\"\">أين تكمن الحيل في المنشور؟ (الاحتكام لسلطة مجهولة، وإرهاب المخالف بالتصنيف والشخصنة).<\/p><p class=\"\">كم منشوراً وفكرة نقبلها يومياً بالطريقة نفسها دون فحص الأدلة؟<\/p>", "pts": "<article class=\"pt\"><h4><span>أولاً<\/span>التثبت أمر قرآني<\/h4><p class=\"ayah\">﴿يَا أَيُّهَا الَّذِينَ آمَنُوا إِن جَاءَكُمْ فَاسِقٌ بِنَبَإٍ فَتَبَيَّنُوا أَن تُصِيبُوا قَوْمًا بِجَهَالَةٍ فَتُصْبِحُوا عَلَىٰ مَا فَعَلْتُمْ نَادِمِينَ﴾ [الحجرات: 6]<\/p><p class=\"\">علّق الله الأمر بالتبيّن على خبر الفاسق، وجعل علة التبيّن ألا نُصيب قوماً بجهالة فنندم. والفكرة أوسع من الأخبار: كل ما يصلك من معلومة أو رأي يستحق الفحص قبل أن تبني عليه موقفاً. وقد قال النبي ﷺ: «كَفَى بالمَرْءِ كَذِبًا أَنْ يُحَدِّثَ بكُلِّ ما سَمِعَ» رواه مسلم. فمن نشر كل ما سمع صار شريكاً في الكذب ولو لم يتعمد.<\/p><p class=\"\">ومن مواقف التثبت في السيرة: حادثة بني المصطلق، حين بلغ النبي ﷺ أنهم امتنعوا عن دفع الزكاة، فتأنى ولم يتعجل في إرسال الجيش، حتى تبين أن الخبر غير صحيح. وذكر المفسرون أنها سبب نزول آية الحجرات.<\/p><\/article><article class=\"pt\"><h4><span>ثانياً<\/span>ذم التقليد الأعمى والإمّعية<\/h4><p class=\"ayah\">﴿وَإِذَا قِيلَ لَهُمُ اتَّبِعُوا مَا أَنزَلَ اللَّهُ قَالُوا بَلْ نَتَّبِعُ مَا أَلْفَيْنَا عَلَيْهِ آبَاءَنَا ۗ أَوَلَوْ كَانَ آبَاؤُهُمْ لَا يَعْقِلُونَ شَيْئًا وَلَا يَهْتَدُونَ﴾ [البقرة: 170]<\/p><p class=\"\">الاتباع بلا دليل لا يصنع إيماناً ولا ثقافة. وقد حذّر النبي ﷺ من الإمّعية فقال: «لا تَكونوا إمَّعَةً، تقولونَ: إن أحسَنَ النَّاسُ أحسَنَّا، وإن ظلَموا ظلَمنا، ولَكِن وَطِّنوا أنفُسَكُم، إن أحسَنَ النَّاسُ أن تُحسِنوا، وإن أساؤوا فلا تَظلِموا» رواه الترمذي. والإمّعة من ليس له رأي يميّزه، يتبع كل ناعق. وكثرة القائلين بالشيء لا تجعله حقاً: ﴿وَإِن تُطِعْ أَكْثَرَ مَن فِي الْأَرْضِ يُضِلُّوكَ عَن سَبِيلِ اللَّهِ﴾ [الأنعام: 116].<\/p><\/article><article class=\"pt\"><h4><span>ثالثاً<\/span>المسؤولية المعرفية<\/h4><p class=\"ayah\">﴿وَلَا تَقْفُ مَا لَيْسَ لَكَ بِهِ عِلْمٌ ۚ إِنَّ السَّمْعَ وَالْبَصَرَ وَالْفُؤَادَ كُلُّ أُولَٰئِكَ كَانَ عَنْهُ مَسْئُولًا﴾ [الإسراء: 36]<\/p><p class=\"\">السمع والبصر والعقل أدوات سيُسأل عنها الإنسان: ماذا سمع؟ ماذا نقل؟ ماذا صدّق؟ فالتثبت مسؤولية أمام الله لا ترف فكري.<\/p><\/article><article class=\"pt\"><h4><span>رابعاً<\/span>الإسلام يطلب البرهان<\/h4><p class=\"\">قال الله تعالى: ﴿قُلْ هَاتُوا بُرْهَانَكُمْ إِن كُنتُمْ صَادِقِينَ﴾ [البقرة: 111]. وهذه قاعدة مطلقة: الدعوى بلا دليل لا قيمة لها، سواء جاءت من مشهور أو من أكثرية. وقد ضرب إبراهيم عليه السلام مثالاً في كشف التناقض لقومه، فلما حطّم الأصنام وقال: ﴿بَلْ فَعَلَهُ كَبِيرُهُمْ هَٰذَا فَاسْأَلُوهُمْ إِن كَانُوا يَنطِقُونَ﴾ [الأنبياء: 63]، وضعهم أمام تناقضهم الصريح؛ كيف يعبدون ما لا ينطق ولا يدفع عن نفسه ضراً؟ فرجعوا إلى أنفسهم.<\/p><\/article><article class=\"pt\"><h4><span>خامساً<\/span>ستة شروط لقبول أي دعوى<\/h4><div class=\"tw\"><table><tr><th><b>الشرط<\/b><\/th><th><b>السؤال الذي تطرحه<\/b><\/th><\/tr><tr><td><b>وجود الدليل<\/b><\/td><td>هل قُدّم دليل أم مجرد كلام؟<\/td><\/tr><tr><td><b>صحة الدليل<\/b><\/td><td>هل الدليل ثابت وصحيح في نفسه؟<\/td><\/tr><tr><td><b>اللزوم<\/b><\/td><td>هل تلزم النتيجة من هذا الدليل منطقياً؟<\/td><\/tr><tr><td><b>عدم مناقضة القطعيات<\/b><\/td><td>هل تعارض ما ثبت بيقين؟ فالقطعي مقدّم على الظني<\/td><\/tr><tr><td><b>عدم التناقض<\/b><\/td><td>هل يناقض كلامه بعضه بعضاً؟ فالنقيضان لا يجتمعان<\/td><\/tr><tr><td><b>التفريق بين القطعي والظني<\/b><\/td><td>هل أعطيت كل مسألة درجتها من الثبوت؟<\/td><\/tr><\/table><\/div><\/article><article class=\"pt\"><h4><span>سادساً<\/span>المغالطات الشائعة<\/h4><div class=\"tw\"><table><tr><th><b>المغالطة<\/b><\/th><th><b>معناها<\/b><\/th><th><b>مثال<\/b><\/th><\/tr><tr><td><b>الشخصنة<\/b><\/td><td>مهاجمة القائل بدل مناقشة حجته<\/td><td>«كيف تأخذ نصيحة هذا المدرس وهو يقود سيارة قديمة؟»<\/td><\/tr><tr><td><b>رجل القش<\/b><\/td><td>تشويه حجة المخالف ليسهل ردها<\/td><td>«المتدينون يريدون منا ترك التقنية والعيش في الكهوف!»<\/td><\/tr><tr><td><b>الاحتكام للسلطة<\/b><\/td><td>قبول رأي مشهور في غير تخصصه<\/td><td>لاعب شهير يوصي بدواء<\/td><\/tr><tr><td><b>التعميم الخاطئ<\/b><\/td><td>تعميم حالة فردية على الجميع<\/td><td>«رأيت حافظ قرآن أساء الأدب، إذاً حلقات القرآن لا تربي!»<\/td><\/tr><\/table><\/div><\/article><article class=\"pt\"><h4><span>سابعاً<\/span>الناقد البنّاء والشكّاك السفسطائي<\/h4><p class=\"\">التفكير الناقد يسعى إلى المعرفة اليقينية الصحيحة، أما الشك العبثي فحالة تنكر حتى البديهيات ولا تنتهي إلا إلى التيه. ومن يشك في كل شيء يشك في شكّه نفسه. وهذا الفرق مهم؛ لأن الفتى قد يتخذ «التفكير الناقد» ذريعة للتهرب من الالتزام، فنبيّن له أن العقل هو الذي دلنا على صدق النبي ﷺ، فإذا ثبت الوحي صار من كمال العقل التسليم بما صح فيه.<\/p><\/article>", "qa": "<div class=\"tw\"><table><tr><th><b>السؤال المتوقع<\/b><\/th><th><b>تفكيكه<\/b><\/th><\/tr><tr><td><b>هل التفكير الناقد يبيح التشكيك في المسلّمات الشرعية؟<\/b><\/td><td>التفكير الناقد وسيلة للوصول إلى اليقين وفحص الأدلة، وقد ثبتت صحة الإسلام بالبراهين العقلية القاطعة. فمن تمام العقل التسليم بما صح عن الوحي لأن العقل دلّ على صدق الرسول ﷺ.<\/td><\/tr><tr><td><b>كيف أميز بين الحجة العلمية والمغالطة الذكية؟<\/b><\/td><td>اختبر ثلاث ركائز: هل الدليل ثابت وصحيح؟ وهل تلزم النتيجة منه منطقياً؟ وهل سلم الكلام من الشخصنة والتهويل العاطفي؟<\/td><\/tr><tr><td><b>لماذا نطالب بالدليل ومعظم الناس يكتفون بالرأي الشائع؟<\/b><\/td><td>لأن كثرة القائلين لا تجعل القول حقاً، والقرآن ذم اتباع الكثرة بغير علم: ﴿وَإِن تُطِعْ أَكْثَرَ مَن فِي الْأَرْضِ يُضِلُّوكَ عَن سَبِيلِ اللَّهِ﴾ [الأنعام: 116].<\/td><\/tr><\/table><\/div>", "radar": "<p class=\"\"><b>مؤشرات الخطر:<\/b> السفسطة وإنكار الحقائق البديهية، والتشكيك الدائم في نيات القدوات، واتخاذ الشك ذريعة للتهرب من الفرائض.<\/p><p class=\"\"><b>بروتوكول التدخل:<\/b><\/p><p class=\"step\"><b>1. <\/b>جلسة فردية هادئة تبدأ بسؤال: «هل تشك في وجودك وبديهيات عقلك؟».<\/p><p class=\"step\"><b>2. <\/b>أظهر له التناقض الذاتي للشك المطلق، فمن شك في كل شيء شك في شكه.<\/p><p class=\"step\"><b>3. <\/b>ميّز له بين الشك المنهجي العابر الموصل لليقين، والشك السفسطائي المرضي.<\/p>", "actT": "«مختبر فحص الأفكار»  نشاط ذهني", "act": "<p class=\"step\"><b>1. التقسيم:<\/b> ثلاث مجموعات: الباحثون، والمحققون، والنقاد.<\/p><p class=\"step\"><b>2. التحدي:<\/b> وزّع على المجموعات ثلاث مقولات واقعية (المدرس والسيارة، والمتدينون والكهوف، وحافظ القرآن المسيء).<\/p><p class=\"step\"><b>3. المهمة:<\/b> تسمّي كل مجموعة المغالطة في المقولة، وتصحّح العبارة وفق قواعد الاستدلال السليم.<\/p><p class=\"step\"><b>4. العرض:<\/b> يقدم كل فريق تحليله أمام الجميع.<\/p><p class=\"step\"><b>5. الخلوة الفردية:<\/b> يختار كل طالب فكرة أو شائعة مرت به هذا الأسبوع ويعبّئ البطاقة:<\/p><div class=\"tw\"><table><tr><th colspan=\"2\"><b>بطاقة: مختبر فحص الأفكار<\/b><\/th><\/tr><tr><td><b>1. الفكرة أو الدعوى<\/b><\/td><td>............................<\/td><\/tr><tr><td><b>2. الدليل المقدم لها<\/b><\/td><td>............................<\/td><\/tr><tr><td><b>3. فحص الدليل<\/b><\/td><td>هل هو ثابت؟ هل تلزم منه النتيجة؟ ............................<\/td><\/tr><tr><td><b>4. كشف المغالطة<\/b><\/td><td>هل تضمنت شخصنة / رجل قش / تعميماً؟ ............................<\/td><\/tr><tr><td><b>5. القرار المعرفي<\/b><\/td><td>أقبل الفكرة / أردّها / أتوقف للتثبت<\/td><\/tr><\/table><\/div>", "week": "<p class=\"\"><b>فلتر المنشورات:<\/b> يمتنع الطالب عن إعادة نشر أو تصديق أي خبر فكري أو اجتماعي قبل التثبت من مصدره ودليله.<\/p><p class=\"\"><b>رصد مغالطة:<\/b> يستخرج مغالطة واحدة مرت به في وسائل التواصل ويدوّنها ليشاركها في مطلع اللقاء القادم.<\/p><p class=\"\"><b>جسر إلى اللقاء الثالث:<\/b> إذا عرفنا كيف نفحص الأدلة، فلنرَ كيف يبني القرآن اليقين بالبرهان العقلي.<\/p>", "kq": "أساسيات التفكير الناقد وكشف المغالطات المنطقية", "brief": "<div class=\"plan\"><span>اقتراح لتوزيع الوقت (١٠–١٥ د)<\/span><b>افتتاح ٣<\/b><b>محاور ٥<\/b><b>حوار ٢<\/b><b>نشاط ٣<\/b><b>ختام ٢<\/b><\/div><section class=\"bs\"><h3>١ · الافتتاح: مختبر المنشور المضلل<\/h3><p class=\"\">اعرض منشوراً مصمماً بشكل احترافي نصه:<\/p><p class=\"\">أكد الدكتور (X) المتخصص في العلوم الإنسانية بجامعته المشهورة أن تناول السكريات قبل النوم يزيد الذكاء بنسبة 80%، وأضاف: وكل من يرفض هذه الحقيقة شخص رجعي يحارب التطوير الذاتي!<\/p><p class=\"\"><b>المهمة:<\/b> من ينشر هذا المنشور فوراً؟ ومن يتوقف للتثبت ولماذا؟<\/p><p class=\"\"><b>أسئلة الاستثارة:<\/b><\/p><p class=\"\">أين تكمن الحيل في المنشور؟ (الاحتكام لسلطة مجهولة، وإرهاب المخالف بالتصنيف والشخصنة).<\/p><p class=\"\">كم منشوراً وفكرة نقبلها يومياً بالطريقة نفسها دون فحص الأدلة؟<\/p><\/section><section class=\"bs\"><h3>٢ · المحاور<\/h3><article class=\"pt\"><h4><span>١<\/span>التثبت أمر قرآني<\/h4><p class=\"ayah\">﴿يَا أَيُّهَا الَّذِينَ آمَنُوا إِن جَاءَكُمْ فَاسِقٌ بِنَبَإٍ فَتَبَيَّنُوا أَن تُصِيبُوا قَوْمًا بِجَهَالَةٍ فَتُصْبِحُوا عَلَىٰ مَا فَعَلْتُمْ نَادِمِينَ﴾ [الحجرات: 6]<\/p><p class=\"g\">نشر المعلومات دون تثبت يفقد المسلم مصداقيته.<\/p><details class=\"more\"><summary>للتوسع<\/summary><p class=\"\">علّق الله الأمر بالتبيّن على خبر الفاسق، وجعل علة التبيّن ألا نُصيب قوماً بجهالة فنندم. والفكرة أوسع من الأخبار: كل ما يصلك من معلومة أو رأي يستحق الفحص قبل أن تبني عليه موقفاً. وقد قال النبي ﷺ: «كَفَى بالمَرْءِ كَذِبًا أَنْ يُحَدِّثَ بكُلِّ ما سَمِعَ» رواه مسلم. فمن نشر كل ما سمع صار شريكاً في الكذب ولو لم يتعمد.<\/p><p class=\"\">ومن مواقف التثبت في السيرة: حادثة بني المصطلق، حين بلغ النبي ﷺ أنهم امتنعوا عن دفع الزكاة، فتأنى ولم يتعجل في إرسال الجيش، حتى تبين أن الخبر غير صحيح. وذكر المفسرون أنها سبب نزول آية الحجرات.<\/p><\/details><\/article><article class=\"pt\"><h4><span>٢<\/span>ذم التقليد الأعمى والإمعية<\/h4><p class=\"ayah\">﴿وَإِذَا قِيلَ لَهُمُ اتَّبِعُوا مَا أَنزَلَ اللَّهُ قَالُوا بَلْ نَتَّبِعُ مَا أَلْفَيْنَا عَلَيْهِ آبَاءَنَا ۗ أَوَلَوْ كَانَ آبَاؤُهُمْ لَا يَعْقِلُونَ شَيْئًا وَلَا يَهْتَدُونَ﴾ [البقرة: 170]<\/p><p class=\"g\">العقل المسلم مستقل يتبع الدليل لا الكثرة.<\/p><details class=\"more\"><summary>للتوسع<\/summary><p class=\"\">الاتباع بلا دليل لا يصنع إيماناً ولا ثقافة. وقد حذّر النبي ﷺ من الإمّعية فقال: «لا تَكونوا إمَّعَةً، تقولونَ: إن أحسَنَ النَّاسُ أحسَنَّا، وإن ظلَموا ظلَمنا، ولَكِن وَطِّنوا أنفُسَكُم، إن أحسَنَ النَّاسُ أن تُحسِنوا، وإن أساؤوا فلا تَظلِموا» رواه الترمذي. والإمّعة من ليس له رأي يميّزه، يتبع كل ناعق. وكثرة القائلين بالشيء لا تجعله حقاً: ﴿وَإِن تُطِعْ أَكْثَرَ مَن فِي الْأَرْضِ يُضِلُّوكَ عَن سَبِيلِ اللَّهِ﴾ [الأنعام: 116].<\/p><\/details><\/article><article class=\"pt\"><h4><span>٣<\/span>المسؤولية المعرفية<\/h4><p class=\"ayah\">﴿وَلَا تَقْفُ مَا لَيْسَ لَكَ بِهِ عِلْمٌ ۚ إِنَّ السَّمْعَ وَالْبَصَرَ وَالْفُؤَادَ كُلُّ أُولَٰئِكَ كَانَ عَنْهُ مَسْئُولًا﴾ [الإسراء: 36]<\/p><p class=\"g\">أدوات الإدراك أمانة سنسأل عنها.<\/p><details class=\"more\"><summary>للتوسع<\/summary><p class=\"\">السمع والبصر والعقل أدوات سيُسأل عنها الإنسان: ماذا سمع؟ ماذا نقل؟ ماذا صدّق؟ فالتثبت مسؤولية أمام الله لا ترف فكري.<\/p><\/details><\/article><article class=\"pt\"><h4><span>٤<\/span>الإسلام يطلب البرهان<\/h4><p class=\"g\">كل دعوى يجب أنت طالب بالدليل الصحيح.<\/p><details class=\"more\"><summary>للتوسع<\/summary><p class=\"\">قال الله تعالى: ﴿قُلْ هَاتُوا بُرْهَانَكُمْ إِن كُنتُمْ صَادِقِينَ﴾ [البقرة: 111]. وهذه قاعدة مطلقة: الدعوى بلا دليل لا قيمة لها، سواء جاءت من مشهور أو من أكثرية. وقد ضرب إبراهيم عليه السلام مثالاً في كشف التناقض لقومه، فلما حطّم الأصنام وقال: ﴿بَلْ فَعَلَهُ كَبِيرُهُمْ هَٰذَا فَاسْأَلُوهُمْ إِن كَانُوا يَنطِقُونَ﴾ [الأنبياء: 63]، وضعهم أمام تناقضهم الصريح؛ كيف يعبدون ما لا ينطق ولا يدفع عن نفسه ضراً؟ فرجعوا إلى أنفسهم.<\/p><\/details><\/article><\/section><section class=\"bs\"><h3>٣ · سؤال للحوار<\/h3><p class=\"big\">متى آخر مرة شاركت خبرا دون أن تتأكد منه؟<\/p><\/section><section class=\"bs\"><h3>٤ · نشاط تطبيقي<\/h3><p class=\"big\">لعبة «صحيح أم إشاعة؟» :يتحقق كل فريق من ثلاثة أخبار بخطوات التثبت.<\/p><\/section><section class=\"bs\"><h3>أسئلة قد تُطرح<\/h3><details class=\"more\"><summary><b>هل التفكير الناقد يبيح التشكيك في المسلّمات الشرعية؟<\/b><\/summary><p>التفكير الناقد وسيلة للوصول إلى اليقين وفحص الأدلة، وقد ثبتت صحة الإسلام بالبراهين العقلية القاطعة. فمن تمام العقل التسليم بما صح عن الوحي لأن العقل دلّ على صدق الرسول ﷺ.<\/p><\/details><details class=\"more\"><summary><b>كيف أميز بين الحجة العلمية والمغالطة الذكية؟<\/b><\/summary><p>اختبر ثلاث ركائز: هل الدليل ثابت وصحيح؟ وهل تلزم النتيجة منه منطقياً؟ وهل سلم الكلام من الشخصنة والتهويل العاطفي؟<\/p><\/details><\/section><section class=\"bs warn\"><h3>رادار الحماية<\/h3><p><b>مؤشرات الخطر:<\/b> السفسطة وإنكار الحقائق البديهية، والتشكيك الدائم في نيات القدوات، واتخاذ الشك ذريعة للتهرب من الفرائض.<\/p><small>البروتوكول كاملاً في تبويب «الكامل».<\/small><\/section><section class=\"bs\"><h3>٥ · رحلة الأسبوع<\/h3><p class=\"\"><b>فلتر المنشورات:<\/b> يمتنع الطالب عن إعادة نشر أو تصديق أي خبر فكري أو اجتماعي قبل التثبت من مصدره ودليله.<\/p><p class=\"\"><b>رصد مغالطة:<\/b> يستخرج مغالطة واحدة مرت به في وسائل التواصل ويدوّنها ليشاركها في مطلع اللقاء القادم.<\/p><p class=\"\"><b>جسر إلى اللقاء الثالث:<\/b> إذا عرفنا كيف نفحص الأدلة، فلنرَ كيف يبني القرآن اليقين بالبرهان العقلي.<\/p><\/section>", "slides": ["<div class=\"cn\">2<\/div><h2>أدوات التفكير الصحيح<\/h2><p class=\"q\">كيف نحمي عقولنا في عصر المشتتات والشبهات؟<\/p>", "<small>إضاءة استهلالية<\/small><h2>مختبر المنشور المضلل<\/h2><ul><li class=\"frag\">أين تكمن الحيل في المنشور؟ (الاحتكام لسلطة مجهولة، وإرهاب المخالف بالتصنيف والشخصنة).<\/li><li class=\"frag\">كم منشوراً وفكرة نقبلها يومياً بالطريقة نفسها دون فحص الأدلة؟<\/li><\/ul>", "<small>1<\/small><h2>التثبت أمر قرآني<\/h2><p class=\"ayah\">﴿يَا أَيُّهَا الَّذِينَ آمَنُوا إِن جَاءَكُمْ فَاسِقٌ بِنَبَإٍ فَتَبَيَّنُوا أَن تُصِيبُوا قَوْمًا بِجَهَالَةٍ فَتُصْبِحُوا عَلَىٰ مَا فَعَلْتُمْ نَادِمِينَ﴾ [الحجرات: 6]<\/p><p class=\"g frag\">نشر المعلومات دون تثبت يفقد المسلم مصداقيته.<\/p>", "<small>2<\/small><h2>ذم التقليد الأعمى والإمعية<\/h2><p class=\"ayah lg\">﴿وَإِذَا قِيلَ لَهُمُ اتَّبِعُوا مَا أَنزَلَ اللَّهُ قَالُوا بَلْ نَتَّبِعُ مَا أَلْفَيْنَا عَلَيْهِ آبَاءَنَا ۗ أَوَلَوْ كَانَ آبَاؤُهُمْ لَا يَعْقِلُونَ شَيْئًا وَلَا يَهْتَدُونَ﴾ [البقرة: 170]<\/p><p class=\"g frag\">العقل المسلم مستقل يتبع الدليل لا الكثرة.<\/p>", "<small>3<\/small><h2>المسؤولية المعرفية<\/h2><p class=\"ayah\">﴿وَلَا تَقْفُ مَا لَيْسَ لَكَ بِهِ عِلْمٌ ۚ إِنَّ السَّمْعَ وَالْبَصَرَ وَالْفُؤَادَ كُلُّ أُولَٰئِكَ كَانَ عَنْهُ مَسْئُولًا﴾ [الإسراء: 36]<\/p><p class=\"g frag\">أدوات الإدراك أمانة سنسأل عنها.<\/p>", "<small>4<\/small><h2>الإسلام يطلب البرهان<\/h2><p class=\"g frag\">كل دعوى يجب أنت طالب بالدليل الصحيح.<\/p>", "<small>سؤال للحوار<\/small><h2 class=\"big\">متى آخر مرة شاركت خبرا دون أن تتأكد منه؟<\/h2>", "<small>نشاط تطبيقي<\/small><h2 class=\"big\">لعبة «صحيح أم إشاعة؟» :يتحقق كل فريق من ثلاثة أخبار بخطوات التثبت.<\/h2>", "<small>سؤال وبرهان<\/small><details class=\"frag\"><summary><b>هل التفكير الناقد يبيح التشكيك في المسلّمات الشرعية؟<\/b><\/summary><p>التفكير الناقد وسيلة للوصول إلى اليقين وفحص الأدلة، وقد ثبتت صحة الإسلام بالبراهين العقلية القاطعة. فمن تمام العقل التسليم بما صح عن الوحي لأن العقل دلّ على صدق الرسول ﷺ.<\/p><\/details><details class=\"frag\"><summary><b>كيف أميز بين الحجة العلمية والمغالطة الذكية؟<\/b><\/summary><p>اختبر ثلاث ركائز: هل الدليل ثابت وصحيح؟ وهل تلزم النتيجة منه منطقياً؟ وهل سلم الكلام من الشخصنة والتهويل العاطفي؟<\/p><\/details><details class=\"frag\"><summary><b>لماذا نطالب بالدليل ومعظم الناس يكتفون بالرأي الشائع؟<\/b><\/summary><p>لأن كثرة القائلين لا تجعل القول حقاً، والقرآن ذم اتباع الكثرة بغير علم: ﴿وَإِن تُطِعْ أَكْثَرَ مَن فِي الْأَرْضِ يُضِلُّوكَ عَن سَبِيلِ اللَّهِ﴾ [الأنعام: 116].<\/p><\/details>", "<small>ميدان التطبيق<\/small><h2>«مختبر فحص الأفكار»  نشاط ذهني<\/h2><ol><li class=\"frag\">1. التقسيم: ثلاث مجموعات: الباحثون، والمحققون، والنقاد.<\/li><li class=\"frag\">2. التحدي: وزّع على المجموعات ثلاث مقولات واقعية (المدرس والسيارة، والمتدينون والكهوف، وحافظ القرآن المسيء).<\/li><li class=\"frag\">3. المهمة: تسمّي كل مجموعة المغالطة في المقولة، وتصحّح العبارة وفق قواعد الاستدلال السليم.<\/li><li class=\"frag\">4. العرض: يقدم كل فريق تحليله أمام الجميع.<\/li><li class=\"frag\">5. الخلوة الفردية: يختار كل طالب فكرة أو شائعة مرت به هذا الأسبوع ويعبّئ البطاقة:<\/li><\/ol>", "<small>رحلة الأسبوع<\/small><ul><li class=\"frag\"><b>فلتر المنشورات:<\/b> يمتنع الطالب عن إعادة نشر أو تصديق أي خبر فكري أو اجتماعي قبل التثبت من مصدره ودليله.<\/li><li class=\"frag\"><b>رصد مغالطة:<\/b> يستخرج مغالطة واحدة مرت به في وسائل التواصل ويدوّنها ليشاركها في مطلع اللقاء القادم.<\/li><li class=\"frag\"><b>جسر إلى اللقاء الثالث:<\/b> إذا عرفنا كيف نفحص الأدلة، فلنرَ كيف يبني القرآن اليقين بالبرهان العقلي.<\/li><\/ul>"], "n": 2, "u": 0, "title": "أدوات التفكير الصحيح", "q": "كيف نحمي عقولنا في عصر المشتتات والشبهات؟", "dqq": "متى آخر مرة شاركت خبرا دون أن تتأكد منه؟", "pact": "لعبة «صحيح أم إشاعة؟» :يتحقق كل فريق من ثلاثة أخبار بخطوات التثبت."}, {"summary": "<p class=\"\">يكتشف الفتى في هذا اللقاء أن القرآن لا يطلب إيماناً بلا تفكير، بل يخاطب العقل بالبراهين والفطرة بالدلائل، ثم يحوّل القناعة العقلية إلى يقين نفسي وسلوك. يتعلم كيف يقرأ الآية قراءة المستدل المتدبر، لا قراءة المتلقي السريع.<\/p><div class=\"tw\"><table><tr><th><b>المهارة المستهدفة<\/b><\/th><th><b>معناها العملي<\/b><\/th><\/tr><tr><td><b>الاستدلال البرهاني<\/b><\/td><td>يبني قناعاته على أسس عقلية راسخة<\/td><\/tr><tr><td><b>التدبر والاستهداء<\/b><\/td><td>يتلقى القرآن منهج هداية ودليلاً<\/td><\/tr><tr><td><b>الانقياد للحق<\/b><\/td><td>يخضع للبرهان متى استبان<\/td><\/tr><\/table><\/div>", "kit": "<p class=\"\"><b>ما يعيشه الفتى:<\/b> يميل فتى هذه المرحلة إلى الاستدلال المجرد، لكن التدفق الرقمي السريع يجعل علاقته بالقرآن قراءةً سطحية سريعة. وقد يسمع من يقول إن القرآن كتاب قديم لا يخاطب واقعنا، فيصدّق دون أن يفتحه بوعي.<\/p><p class=\"\"><b>ابدأ بالقصة قبل القاعدة:<\/b> قصص الصحابة والعرب الذين تأثروا بالقرآن تفتح القلب قبل أن تقنع العقل.<\/p><p class=\"\"><b>أحضر نسخاً ميسّرة:<\/b> زوّد الطلاب بتفسير مختصر ميسّر يرجعون إليه (كتفسير السعدي أو المختصر في التفسير).<\/p><p class=\"\"><b>لا تفرض الخشوع:<\/b> دع الآيات تتكلم، وامنح الصمت فرصته بعد القراءة.<\/p>", "hookT": "شهادة الفصيح المعادي", "hook": "<p class=\"\">تروي كتب السيرة أن الوليد بن المغيرة، وكان من أبلغ العرب وأشدهم عداوة، سمع آيات من القرآن، فقال لقومه ما معناه: والله لقد سمعت منه كلاماً ما هو من كلام الإنس ولا من كلام الجن، وإن له لحلاوة، وإن عليه لطلاوة، وإن أعلاه لمثمر، وإن أسفله لمغدق، وإنه ليعلو ولا يُعلى عليه، وإنه ليحطم ما تحته.<\/p><p class=\"\"><b>أسئلة الاستثارة:<\/b><\/p><p class=\"\">رجلٌ معادٍ للإسلام ويملك أعلى ذائقة لغوية في قومه، لماذا انخلع قلبه وعجز عن إنكار القرآن؟<\/p><p class=\"\">ما الخصائص البرهانية في القرآن التي حيّرت عقول أعدائه؟<\/p><p class=\"\">كيف يحوّل تدبر هذا الكتاب القناعات الباردة إلى يقين نفسي لا يتزعزع؟<\/p>", "pts": "<article class=\"pt\"><h4><span>أولاً<\/span>برهان الخلق، قسمة عقلية حاصرة<\/h4><p class=\"ayah\">﴿أَمْ خُلِقُوا مِنْ غَيْرِ شَيْءٍ أَمْ هُمُ الْخَالِقُونَ * أَمْ خَلَقُوا السَّمَاوَاتِ وَالْأَرْضَ ۚ بَل لَّا يُوقِنُونَ﴾ [الطور: 35-36]<\/p><p class=\"\">تضع الآية ثلاثة احتمالات لا رابع لها: أن يكون الإنسان خُلق من غير خالق، أو أن يكون هو خالق نفسه، أو أن يكون له خالق. الأول مستحيل عقلاً لأن العدم لا يصنع شيئاً، والثاني مستحيل لأن الشيء لا يوجد نفسه قبل أن يوجد. فيبقى الثالث، وهو أن له خالقاً. وبهذا تبطل نظرية الصدفة بحجة عقلية تامة. وقد بلغ أثر هذه الآية أن جبير بن مطعم رضي الله عنه حين سمع النبي ﷺ يقرأ سورة الطور في المغرب ووصل إلى قوله ﴿أَمْ خُلِقُوا مِنْ غَيْرِ شَيْءٍ﴾ قال: «كادَ قَلْبِي أنْ يَطِيرَ»، وقال إن ذلك أول ما وقر الإيمان في قلبه. رواه البخاري.<\/p><\/article><article class=\"pt\"><h4><span>ثانياً<\/span>برهان التمانع وانتظام الكون<\/h4><p class=\"ayah\">﴿لَوْ كَانَ فِيهِمَا آلِهَةٌ إِلَّا اللَّهُ لَفَسَدَتَا ۚ فَسُبْحَانَ اللَّهِ رَبِّ الْعَرْشِ عَمَّا يَصِفُونَ﴾ [الأنبياء: 22]<\/p><p class=\"\">لو كان للكون أكثر من إله لاختلفت إرادتهم أو اتفقت، فإن اختلفوا فسد النظام، وإن اتفقوا فلا حاجة إلى تعددهم. وانتظام الكون ودقة قوانينه يدل على أن مدبره واحد. وهو برهان يجمع عمق المقدمات اليقينية ووضوح الفطرة، فيصلح للفيلسوف والبسيط معاً.<\/p><\/article><article class=\"pt\"><h4><span>ثالثاً<\/span>برهان الإعادة بعد النشأة الأولى<\/h4><p class=\"ayah\">﴿وَضَرَبَ لَنَا مَثَلًا وَنَسِيَ خَلْقَهُ ۖ قَالَ مَن يُحْيِي الْعِظَامَ وَهِيَ رَمِيمٌ * قُلْ يُحْيِيهَا الَّذِي أَنشَأَهَا أَوَّلَ مَرَّةٍ ۖ وَهُوَ بِكُلِّ خَلْقٍ عَلِيمٌ﴾ [يس: 78-79]<\/p><p class=\"\">من قدر على بدء الخلق من العدم فهو على إعادته أقدر وأهون. وهذا استدلال بديهي يخاطب الإنسان بما يعرفه من أصل خلقه، فلا يحتاج إلى مقدمات معقدة.<\/p><\/article><article class=\"pt\"><h4><span>رابعاً<\/span>القرآن معجزة عقلية خالدة<\/h4><p class=\"had\">قال رسول الله ﷺ: «ما مِنَ الأنْبِياءِ نَبِيٌّ إلَّا أُعْطِيَ ما مِثْلُهُ آمَنَ عليه البَشَرُ، وإنَّما كانَ الذي أُوتِيتُ وَحْيًا أَوْحاهُ اللَّهُ إلَيَّ، فأرْجُو أَنْ أَكُونَ أَكْثَرَهُمْ تابِعًا يَومَ القِيامَةِ» رواه البخاري. فمعجزات الأنبياء السابقين انتهت بانتهاء زمانهم، أما معجزة القرآن فباقية يقرؤها كل جيل ويتحقق منها بعقله. وهي معجزة تخاطب العقل بنظمها وبيانها وبراهينها، فمن أنصف وجد فيها تأليفاً خرج عن طبيعة التأليف البشري.<\/p><\/article><article class=\"pt\"><h4><span>خامساً<\/span>كيف يتحول البرهان إلى يقين وسلوك؟<\/h4><p class=\"\">لم ينزل القرآن ليُتلى بالحركات فقط، بل ليكون منهج حياة يترجم الإيمان إلى خُلق واليقين إلى عمل. وأول الطريق التدبر: ﴿أَفَلَا يَتَدَبَّرُونَ الْقُرْآنَ أَمْ عَلَىٰ قُلُوبٍ أَقْفَالُهَا﴾ [محمد: 24]، وقال سبحانه: ﴿كِتَابٌ أَنزَلْنَاهُ إِلَيْكَ مُبَارَكٌ لِّيَدَّبَّرُوا آيَاتِهِ وَلِيَتَذَكَّرَ أُولُو الْأَلْبَابِ﴾ [ص: 29]. وللتدبر خطوات عملية يعلّمها المشرف: اقرأ الآية بنية الاستهداء، واستعن بتفسير ميسّر على فهم الكلمات، وتوقف عند الحجة أو اللفتة الفطرية، ثم اسأل: ماذا تطلب مني هذه الآية اليوم؟<\/p><\/article><article class=\"pt\"><h4><span>سادساً<\/span>مشاهد من أثر القرآن في العقول<\/h4><p class=\"\"><b>عتبة بن ربيعة:<\/b> جاء يفاوض النبي ﷺ عارضاً المال والملك، فأنصت له النبي ﷺ حتى فرغ، ثم تلا عليه أوائل سورة فصلت. فلما بلغ آية السجدة أمسك عتبة بيده على فم النبي ﷺ مناشداً إياه أن يتوقف، ورجع لقريش بوجه غير الذي ذهب به.<\/p><p class=\"\"><b>أسيد بن حضير:<\/b> جاء بحربته متوعداً مصعب بن عمير، فقال له مصعب بمنطق النبوة: «أو تجلس فتسمع، فإن رضيت أمراً قبلته، وإن كرهته كففنا عنك ما تكره؟» فجلس وسمع، فما لبث أن قال: «ما أحسن هذا الكلام وأجمله!». الدرس: حسن الحوار والإنصات قبل الحكم.<\/p><\/article>", "qa": "<div class=\"tw\"><table><tr><th><b>السؤال المتوقع<\/b><\/th><th><b>تفكيكه<\/b><\/th><\/tr><tr><td><b>هل العقل مقدم على النقل عند التعارض؟<\/b><\/td><td>لا تعارض بين صريح العقل وصحيح النقل. العقل هو الذي دلّنا على صحة الوحي، فإذا ثبت الوحي صار من كمال العقل قبول أخباره وأحكامه. والتعارض لا يقع إلا إذا كان النص غير صحيح، أو كان «العقل» مجرد هوى وظنون.<\/td><\/tr><tr><td><b>لماذا لم يأتِ القرآن بأسلوب النظريات الفلسفية المعقدة؟<\/b><\/td><td>لأن المصطلحات الفلسفية تتغير بتغير العصور وتخص النخب، أما القرآن فنزل هداية عامة للبشرية، فصاغ حقائقه بأسلوب فطري عميق يفهمه الجميع.<\/td><\/tr><tr><td><b>كيف أستشعر اليقين بالقرآن وأنا لا أفهم بعض كلماته؟<\/b><\/td><td>اقرأ بنية الاستهداء واستعن بتفسير ميسّر، فالفهم مفتاح الخشوع، وابدأ بآيات قصيرة تفهمها كاملة.<\/td><\/tr><\/table><\/div>", "radar": "<p class=\"\"><b>مؤشرات الخطر:<\/b> الجفاء الشديد تجاه القرآن (مثل: «القرآن كتاب قديم لا يلبي واقعنا»)، والتشكيك في التشريعات القطعية استناداً إلى ثقافة غربية، والانقطاع التام عن التلاوة.<\/p><p class=\"\"><b>بروتوكول التدخل:<\/b><\/p><p class=\"step\"><b>1. <\/b>جلسة فردية هادئة دون تخوين.<\/p><p class=\"step\"><b>2. <\/b>بيّن أن الشبهة ناتجة عن تقديم العقل البشري المحدود على علم الله المطلق المحيط.<\/p><p class=\"step\"><b>3. <\/b>أهدِه كتاباً مبسطاً في عظمة القرآن (كالنبأ العظيم) وادرس معه فصلاً منه.<\/p>", "actT": "«شجرة البراهين القرآنية»  نشاط ذهني", "act": "<p class=\"step\"><b>1. التقسيم:<\/b> ثلاث مجموعات: أهل البرهان، وأهل التفكر، وأهل البصيرة.<\/p><p class=\"step\"><b>2. توزيع الآيات:<\/b> الفريق الأول (الطور: 35-36)، والثاني (الأنبياء: 22)، والثالث (يس: 78-79).<\/p><p class=\"step\"><b>3. المهمة:<\/b> تفكيك الآية واستخراج الحجة العقلية المضمرة فيها، وصياغتها دليلاً منطقياً حوارياً بلغة بسيطة.<\/p><p class=\"step\"><b>4. العرض:<\/b> يقدم كل فريق خلاصته ثم يتلقى أسئلة الآخرين.<\/p><p class=\"step\"><b>5. الخلوة الفردية:<\/b> يختار كل طالب آية استوقفته ويعبّئ البطاقة:<\/p><div class=\"tw\"><table><tr><th colspan=\"2\"><b>بطاقة: شجرة البراهين القرآنية<\/b><\/th><\/tr><tr><td><b>1. نص الآية<\/b><\/td><td>﴿ ............................ ﴾<\/td><\/tr><tr><td><b>2. قضية اليقين<\/b><\/td><td>وجود الله / وحدانيته / النبوة / البعث<\/td><\/tr><tr><td><b>3. الحجة العقلية المستفادة<\/b><\/td><td>............................<\/td><\/tr><tr><td><b>4. أثرها على طمأنينة قلبي وسلوكي<\/b><\/td><td>............................<\/td><\/tr><\/table><\/div>", "week": "<p class=\"\"><b>ورد التدبر والاستهداء:<\/b> عشر دقائق يومياً لقراءة صفحتين من المصحف مع الاستعانة بتفسير ميسّر.<\/p><p class=\"\"><b>استخراج برهان:<\/b> يدوّن كل طالب آية واحدة أسبوعياً فيها حجة عقلية أو لفتة فطرية، ويشاركها مع أقرانه.<\/p><p class=\"\"><b>جسر إلى اللقاء الرابع:<\/b> إذا بُني اليقين بالبرهان، فكيف نحميه حين تهجم الشبهات؟ هذا موضوع «حصون اليقين».<\/p>", "kq": "كيف يبني الوحي القناعات واليقين؟", "brief": "<div class=\"plan\"><span>اقتراح لتوزيع الوقت (١٠–١٥ د)<\/span><b>افتتاح ٣<\/b><b>محاور ٥<\/b><b>حوار ٢<\/b><b>نشاط ٣<\/b><b>ختام ٢<\/b><\/div><section class=\"bs\"><h3>١ · الافتتاح: شهادة الفصيح المعادي<\/h3><p class=\"\">تروي كتب السيرة أن الوليد بن المغيرة، وكان من أبلغ العرب وأشدهم عداوة، سمع آيات من القرآن، فقال لقومه ما معناه: والله لقد سمعت منه كلاماً ما هو من كلام الإنس ولا من كلام الجن، وإن له لحلاوة، وإن عليه لطلاوة، وإن أعلاه لمثمر، وإن أسفله لمغدق، وإنه ليعلو ولا يُعلى عليه، وإنه ليحطم ما تحته.<\/p><p class=\"\"><b>أسئلة الاستثارة:<\/b><\/p><p class=\"\">رجلٌ معادٍ للإسلام ويملك أعلى ذائقة لغوية في قومه، لماذا انخلع قلبه وعجز عن إنكار القرآن؟<\/p><p class=\"\">ما الخصائص البرهانية في القرآن التي حيّرت عقول أعدائه؟<\/p><p class=\"\">كيف يحوّل تدبر هذا الكتاب القناعات الباردة إلى يقين نفسي لا يتزعزع؟<\/p><\/section><section class=\"bs\"><h3>٢ · المحاور<\/h3><article class=\"pt\"><h4><span>١<\/span>برهان الخلق<\/h4><p class=\"ayah\">﴿أَمْ خُلِقُوا مِنْ غَيْرِ شَيْءٍ أَمْ هُمُ الْخَالِقُونَ * أَمْ خَلَقُوا السَّمَاوَاتِ وَالْأَرْضَ ۚ بَل لَّا يُوقِنُونَ﴾ [الطور: 35-36]<\/p><p class=\"g\">قسمة عقلية حاصرة تبطل نظرية الصدفة والعدم.<\/p><details class=\"more\"><summary>للتوسع<\/summary><p class=\"\">تضع الآية ثلاثة احتمالات لا رابع لها: أن يكون الإنسان خُلق من غير خالق، أو أن يكون هو خالق نفسه، أو أن يكون له خالق. الأول مستحيل عقلاً لأن العدم لا يصنع شيئاً، والثاني مستحيل لأن الشيء لا يوجد نفسه قبل أن يوجد. فيبقى الثالث، وهو أن له خالقاً. وبهذا تبطل نظرية الصدفة بحجة عقلية تامة. وقد بلغ أثر هذه الآية أن جبير بن مطعم رضي الله عنه حين سمع النبي ﷺ يقرأ سورة الطور في المغرب ووصل إلى قوله ﴿أَمْ خُلِقُوا مِنْ غَيْرِ شَيْءٍ﴾ قال: «كادَ قَلْبِي أنْ يَطِيرَ»، وقال إن ذلك أول ما وقر الإيمان في قلبه. رواه البخاري.<\/p><\/details><\/article><article class=\"pt\"><h4><span>٢<\/span>برهان التمانع وانتظام الكون<\/h4><p class=\"ayah\">﴿لَوْ كَانَ فِيهِمَا آلِهَةٌ إِلَّا اللَّهُ لَفَسَدَتَا ۚ فَسُبْحَانَ اللَّهِ رَبِّ الْعَرْشِ عَمَّا يَصِفُونَ﴾ [الأنبياء: 22]<\/p><p class=\"g\">دقة القوانين الكونية تدل على وحدة المدبر.<\/p><details class=\"more\"><summary>للتوسع<\/summary><p class=\"\">لو كان للكون أكثر من إله لاختلفت إرادتهم أو اتفقت، فإن اختلفوا فسد النظام، وإن اتفقوا فلا حاجة إلى تعددهم. وانتظام الكون ودقة قوانينه يدل على أن مدبره واحد. وهو برهان يجمع عمق المقدمات اليقينية ووضوح الفطرة، فيصلح للفيلسوف والبسيط معاً.<\/p><\/details><\/article><article class=\"pt\"><h4><span>٣<\/span>برهان الإعادة<\/h4><p class=\"ayah\">﴿وَضَرَبَ لَنَا مَثَلًا وَنَسِيَ خَلْقَهُ ۖ قَالَ مَن يُحْيِي الْعِظَامَ وَهِيَ رَمِيمٌ * قُلْ يُحْيِيهَا الَّذِي أَنشَأَهَا أَوَّلَ مَرَّةٍ ۖ وَهُوَ بِكُلِّ خَلْقٍ عَلِيمٌ﴾ [يس: 78-79]<\/p><p class=\"g\">من قدر على بدء الخلق من العدم فهو على إعادته أقدر.<\/p><details class=\"more\"><summary>للتوسع<\/summary><p class=\"\">من قدر على بدء الخلق من العدم فهو على إعادته أقدر وأهون. وهذا استدلال بديهي يخاطب الإنسان بما يعرفه من أصل خلقه، فلا يحتاج إلى مقدمات معقدة.<\/p><\/details><\/article><article class=\"pt\"><h4><span>٤<\/span>القرآن يخاطب العقل<\/h4><p class=\"g\">القرآن يحول القناعة العقلية إلى يقين نفسي وسلوك بالتدبر.<\/p><details class=\"more\"><summary>للتوسع<\/summary><p class=\"\"><b>عتبة بن ربيعة:<\/b> جاء يفاوض النبي ﷺ عارضاً المال والملك، فأنصت له النبي ﷺ حتى فرغ، ثم تلا عليه أوائل سورة فصلت. فلما بلغ آية السجدة أمسك عتبة بيده على فم النبي ﷺ مناشداً إياه أن يتوقف، ورجع لقريش بوجه غير الذي ذهب به.<\/p><p class=\"\"><b>أسيد بن حضير:<\/b> جاء بحربته متوعداً مصعب بن عمير، فقال له مصعب بمنطق النبوة: «أو تجلس فتسمع، فإن رضيت أمراً قبلته، وإن كرهته كففنا عنك ما تكره؟» فجلس وسمع، فما لبث أن قال: «ما أحسن هذا الكلام وأجمله!». الدرس: حسن الحوار والإنصات قبل الحكم.<\/p><\/details><\/article><\/section><section class=\"bs\"><h3>٣ · سؤال للحوار<\/h3><p class=\"big\">لو رأيت كتابا مرتبا بلا كاتب، ماذا يقول لك عقلك؟<\/p><\/section><section class=\"bs\"><h3>٤ · نشاط تطبيقي<\/h3><p class=\"big\">ارسم خريطة ذهنية لبراهين الخلق والتمانع والإعادة بكلماتك.<\/p><\/section><section class=\"bs\"><h3>أسئلة قد تُطرح<\/h3><details class=\"more\"><summary><b>هل العقل مقدم على النقل عند التعارض؟<\/b><\/summary><p>لا تعارض بين صريح العقل وصحيح النقل. العقل هو الذي دلّنا على صحة الوحي، فإذا ثبت الوحي صار من كمال العقل قبول أخباره وأحكامه. والتعارض لا يقع إلا إذا كان النص غير صحيح، أو كان «العقل» مجرد هوى وظنون.<\/p><\/details><details class=\"more\"><summary><b>لماذا لم يأتِ القرآن بأسلوب النظريات الفلسفية المعقدة؟<\/b><\/summary><p>لأن المصطلحات الفلسفية تتغير بتغير العصور وتخص النخب، أما القرآن فنزل هداية عامة للبشرية، فصاغ حقائقه بأسلوب فطري عميق يفهمه الجميع.<\/p><\/details><\/section><section class=\"bs warn\"><h3>رادار الحماية<\/h3><p><b>مؤشرات الخطر:<\/b> الجفاء الشديد تجاه القرآن (مثل: «القرآن كتاب قديم لا يلبي واقعنا»)، والتشكيك في التشريعات القطعية استناداً إلى ثقافة غربية، والانقطاع التام عن التلاوة.<\/p><small>البروتوكول كاملاً في تبويب «الكامل».<\/small><\/section><section class=\"bs\"><h3>٥ · رحلة الأسبوع<\/h3><p class=\"\"><b>ورد التدبر والاستهداء:<\/b> عشر دقائق يومياً لقراءة صفحتين من المصحف مع الاستعانة بتفسير ميسّر.<\/p><p class=\"\"><b>استخراج برهان:<\/b> يدوّن كل طالب آية واحدة أسبوعياً فيها حجة عقلية أو لفتة فطرية، ويشاركها مع أقرانه.<\/p><p class=\"\"><b>جسر إلى اللقاء الرابع:<\/b> إذا بُني اليقين بالبرهان، فكيف نحميه حين تهجم الشبهات؟ هذا موضوع «حصون اليقين».<\/p><\/section>", "slides": ["<div class=\"cn\">3<\/div><h2>القرآن والبرهان العقلي<\/h2><p class=\"q\">كيف يبني الوحي القناعات واليقين؟<\/p>", "<small>إضاءة استهلالية<\/small><h2>شهادة الفصيح المعادي<\/h2><ul><li class=\"frag\">رجلٌ معادٍ للإسلام ويملك أعلى ذائقة لغوية في قومه، لماذا انخلع قلبه وعجز عن إنكار القرآن؟<\/li><li class=\"frag\">ما الخصائص البرهانية في القرآن التي حيّرت عقول أعدائه؟<\/li><li class=\"frag\">كيف يحوّل تدبر هذا الكتاب القناعات الباردة إلى يقين نفسي لا يتزعزع؟<\/li><\/ul>", "<small>1<\/small><h2>برهان الخلق<\/h2><p class=\"ayah\">﴿أَمْ خُلِقُوا مِنْ غَيْرِ شَيْءٍ أَمْ هُمُ الْخَالِقُونَ * أَمْ خَلَقُوا السَّمَاوَاتِ وَالْأَرْضَ ۚ بَل لَّا يُوقِنُونَ﴾ [الطور: 35-36]<\/p><p class=\"g frag\">قسمة عقلية حاصرة تبطل نظرية الصدفة والعدم.<\/p>", "<small>2<\/small><h2>برهان التمانع وانتظام الكون<\/h2><p class=\"ayah\">﴿لَوْ كَانَ فِيهِمَا آلِهَةٌ إِلَّا اللَّهُ لَفَسَدَتَا ۚ فَسُبْحَانَ اللَّهِ رَبِّ الْعَرْشِ عَمَّا يَصِفُونَ﴾ [الأنبياء: 22]<\/p><p class=\"g frag\">دقة القوانين الكونية تدل على وحدة المدبر.<\/p>", "<small>3<\/small><h2>برهان الإعادة<\/h2><p class=\"ayah lg\">﴿وَضَرَبَ لَنَا مَثَلًا وَنَسِيَ خَلْقَهُ ۖ قَالَ مَن يُحْيِي الْعِظَامَ وَهِيَ رَمِيمٌ * قُلْ يُحْيِيهَا الَّذِي أَنشَأَهَا أَوَّلَ مَرَّةٍ ۖ وَهُوَ بِكُلِّ خَلْقٍ عَلِيمٌ﴾ [يس: 78-79]<\/p><p class=\"g frag\">من قدر على بدء الخلق من العدم فهو على إعادته أقدر.<\/p>", "<small>4<\/small><h2>القرآن يخاطب العقل<\/h2><p class=\"g frag\">القرآن يحول القناعة العقلية إلى يقين نفسي وسلوك بالتدبر.<\/p>", "<small>سؤال للحوار<\/small><h2 class=\"big\">لو رأيت كتابا مرتبا بلا كاتب، ماذا يقول لك عقلك؟<\/h2>", "<small>نشاط تطبيقي<\/small><h2 class=\"big\">ارسم خريطة ذهنية لبراهين الخلق والتمانع والإعادة بكلماتك.<\/h2>", "<small>سؤال وبرهان<\/small><details class=\"frag\"><summary><b>هل العقل مقدم على النقل عند التعارض؟<\/b><\/summary><p>لا تعارض بين صريح العقل وصحيح النقل. العقل هو الذي دلّنا على صحة الوحي، فإذا ثبت الوحي صار من كمال العقل قبول أخباره وأحكامه. والتعارض لا يقع إلا إذا كان النص غير صحيح، أو كان «العقل» مجرد هوى وظنون.<\/p><\/details><details class=\"frag\"><summary><b>لماذا لم يأتِ القرآن بأسلوب النظريات الفلسفية المعقدة؟<\/b><\/summary><p>لأن المصطلحات الفلسفية تتغير بتغير العصور وتخص النخب، أما القرآن فنزل هداية عامة للبشرية، فصاغ حقائقه بأسلوب فطري عميق يفهمه الجميع.<\/p><\/details><details class=\"frag\"><summary><b>كيف أستشعر اليقين بالقرآن وأنا لا أفهم بعض كلماته؟<\/b><\/summary><p>اقرأ بنية الاستهداء واستعن بتفسير ميسّر، فالفهم مفتاح الخشوع، وابدأ بآيات قصيرة تفهمها كاملة.<\/p><\/details>", "<small>ميدان التطبيق<\/small><h2>«شجرة البراهين القرآنية»  نشاط ذهني<\/h2><ol><li class=\"frag\">1. التقسيم: ثلاث مجموعات: أهل البرهان، وأهل التفكر، وأهل البصيرة.<\/li><li class=\"frag\">2. توزيع الآيات: الفريق الأول (الطور: 35-36)، والثاني (الأنبياء: 22)، والثالث (يس: 78-79).<\/li><li class=\"frag\">3. المهمة: تفكيك الآية واستخراج الحجة العقلية المضمرة فيها، وصياغتها دليلاً منطقياً حوارياً بلغة بسيطة.<\/li><li class=\"frag\">4. العرض: يقدم كل فريق خلاصته ثم يتلقى أسئلة الآخرين.<\/li><li class=\"frag\">5. الخلوة الفردية: يختار كل طالب آية استوقفته ويعبّئ البطاقة:<\/li><\/ol>", "<small>رحلة الأسبوع<\/small><ul><li class=\"frag\"><b>ورد التدبر والاستهداء:<\/b> عشر دقائق يومياً لقراءة صفحتين من المصحف مع الاستعانة بتفسير ميسّر.<\/li><li class=\"frag\"><b>استخراج برهان:<\/b> يدوّن كل طالب آية واحدة أسبوعياً فيها حجة عقلية أو لفتة فطرية، ويشاركها مع أقرانه.<\/li><li class=\"frag\"><b>جسر إلى اللقاء الرابع:<\/b> إذا بُني اليقين بالبرهان، فكيف نحميه حين تهجم الشبهات؟ هذا موضوع «حصون اليقين».<\/li><\/ul>"], "n": 3, "u": 0, "title": "القرآن والبرهان العقلي", "q": "كيف يبني الوحي القناعات واليقين؟", "dqq": "لو رأيت كتابا مرتبا بلا كاتب، ماذا يقول لك عقلك؟", "pact": "ارسم خريطة ذهنية لبراهين الخلق والتمانع والإعادة بكلماتك."}, {"summary": "<p class=\"\">يتعلم الفتى أن الشبهة ليست عدواً يُهرب منه ولا ضيفاً يُستقبل بلا فحص، وأن عنده «فلتراً» من أربع خطوات يمرر عليه كل ما يرد عليه من إشكال. فمن امتلك الفلتر لم يعد يضطرب من شبهة واحدة، بل تزيده بصيرة.<\/p><div class=\"tw\"><table><tr><th><b>المهارة المستهدفة<\/b><\/th><th><b>معناها العملي<\/b><\/th><\/tr><tr><td><b>الحصانة الفكرية<\/b><\/td><td>يحمي ثوابته الإيمانية من الشكوك<\/td><\/tr><tr><td><b>تفكيك الشبهات<\/b><\/td><td>يكشف الخلل والتناقض في الطرح المشكك<\/td><\/tr><tr><td><b>إدارة الانفعال المعرفي<\/b><\/td><td>يحافظ على اتزانه حين يرد ما يحيّره<\/td><\/tr><\/table><\/div>", "kit": "<p class=\"\"><b>الأمان أولاً:<\/b> الفتى الذي يخاف أن يُتهم في إيمانه سيكتم شبهته ويبحث عنها في أماكن أخطر. فأعلن في بداية اللقاء أن كل سؤال مرحّب به.<\/p><p class=\"\"><b>قدّم البناء على المطاردة:<\/b> المطلوب أولاً معرفة دلائل الحق والعمل بمقتضاه، ثم يكفي بعد ذلك أن نعرف أصول الشبهات المنتشرة.<\/p><p class=\"\"><b>اعترف بحدود علمك:<\/b> إن لم تعرف جواب شبهة فقل «سأسأل أهل العلم وأعود إليكم»، فهذا من صميم المنهج.<\/p><p class=\"\"><b>احذر من تحويل الجلسة إلى مناظرة:<\/b> الغاية تثبيت القلوب لا الانتصار.<\/p>", "hookT": "الفلتر والماء الملوث", "hook": "<p class=\"\">ضع أمامهم كأسين: ماء نقياً وماء ملوثاً بحبر أو طين، ومعهما مجسماً لفلتر متعدد الطبقات. ثم قل:<\/p><p class=\"\">هل يقبل أحدكم أن يشرب الماء الملوث؟ مستحيل! لكن لو مررناه عبر فلتر يُنقّيه تماماً شربناه باطمئنان. هذا الفلتر بالضبط هو ما يحتاجه عقلك أمام سيل الشبهات في الإنترنت.<\/p><p class=\"\"><b>أسئلة الاستثارة:<\/b><\/p><p class=\"\">ما الفرق بين من يبتلع الشبهات بلا تمحيص ومن يمتلك فلتر رد الفروع إلى الأصول؟<\/p><p class=\"\">لماذا يصاب الشاب غير المحصّن بالشك من شبهة واحدة، بينما تزيد المحصّن بصيرة؟<\/p>", "pts": "<article class=\"pt\"><h4><span>أولاً<\/span>المحكم والمتشابه<\/h4><p class=\"ayah\">﴿هُوَ الَّذِي أَنزَلَ عَلَيْكَ الْكِتَابَ مِنْهُ آيَاتٌ مُّحْكَمَاتٌ هُنَّ أُمُّ الْكِتَابِ وَأُخَرُ مُتَشَابِهَاتٌ ۖ فَأَمَّا الَّذِينَ فِي قُلُوبِهِمْ زَيْغٌ فَيَتَّبِعُونَ مَا تَشَابَهَ مِنْهُ ابْتِغَاءَ الْفِتْنَةِ﴾ [آل عمران: 7]<\/p><p class=\"\">الآية ترسم المنهج: القضايا الكبرى كوجود الله وعدله وصدق القرآن والنبوة قاطعة محكمة، هي «أم الكتاب» التي ترجع إليها الجزئيات. أما من في قلبه زيغ فيتتبع الجزئية المشتبهة ليهدم بها الأصل. فالأصل أن نردّ المتشابه إلى المحكم، لا أن نهدم المحكم بالمتشابه.<\/p><\/article><article class=\"pt\"><h4><span>ثانياً<\/span>سؤال أهل الاختصاص<\/h4><p class=\"ayah\">﴿فَاسْأَلُوا أَهْلَ الذِّكْرِ إِن كُنتُمْ لَا تَعْلَمُونَ﴾ [النحل: 43]<\/p><p class=\"\">نرجع في الطب إلى الطبيب وفي الهندسة إلى المهندس، وفي مسائل الدين إلى أهل العلم الراسخين، لا إلى مقاطع مجهولة المصدر. وجهلك بجواب مسألة لا يعني بطلان الحق، بل نقص علمك البشري.<\/p><\/article><article class=\"pt\"><h4><span>ثالثاً<\/span>الوقاية من مجالس الخوض<\/h4><p class=\"ayah\">﴿وَإِذَا رَأَيْتَ الَّذِينَ يَخُوضُونَ فِي آيَاتِنَا فَأَعْرِضْ عَنْهُمْ حَتَّىٰ يَخُوضُوا فِي حَدِيثٍ غَيْرِهِ﴾ [الأنعام: 68]<\/p><p class=\"\">القلوب ضعيفة والشبه خطّافة، والسلامة لا يعدلها شيء. ومجالس الجدل في المنصات المفتوحة خطر على غير المتأصّل، فنقدّم البناء أولاً ثم دفع الشبهة عند الحاجة.<\/p><\/article><article class=\"pt\"><h4><span>رابعاً<\/span>الاحتياط في المشتبهات والوساوس<\/h4><p class=\"had\">قال رسول الله ﷺ: «إنَّ الحَلالَ بَيِّنٌ، وإنَّ الحَرامَ بَيِّنٌ، وبينَهُما أُمُورٌ مُشْتَبِهاتٌ لا يَعْلَمُهُنَّ كَثِيرٌ مِنَ النَّاسِ، فَمَنِ اتَّقَى الشُّبُهاتِ اسْتَبْرَأَ لِدِينِهِ وعِرْضِهِ...» متفق عليه. وفي الخواطر والوساوس التشكيكية قال ﷺ: «يَأْتي الشَّيْطانُ أحَدَكُمْ فيَقولَ: مَن خَلَقَ كَذا وكَذا؟ حتَّى يَقُولَ له: مَن خَلَقَ رَبَّكَ؟ فإذا بَلَغَ ذلكَ، فَلْيَسْتَعِذْ باللَّهِ ولْيَنْتَهِ» رواه البخاري. أي أن الخاطر الشيطاني يُقطع بالاستعاذة وصرف الذهن، لا بالاسترسال في سلسلة أسئلة لا تنتهي.<\/p><\/article><article class=\"pt\"><h4><span>خامساً<\/span>الفلتر ذو الخطوات الأربع<\/h4><div class=\"tw\"><table><tr><th><b>الخطوة<\/b><\/th><th><b>ما تفعله<\/b><\/th><th><b>مثال<\/b><\/th><\/tr><tr><td><b>1. رد المتشابه إلى المحكم<\/b><\/td><td>ثبّت القضية الكبرى القاطعة، ثم انظر كيف تُفهم الجزئية في ضوئها<\/td><td>إشكال في حكم تفصيلي لا يهز يقينك بوجود الله وحكمته<\/td><\/tr><tr><td><b>2. فحص الثبوت<\/b><\/td><td>هل الرواية أو الخبر أو المعلومة ثابتة علمياً وتاريخياً أم مكذوبة؟<\/td><td>قصة منسوبة للإسلام بلا سند<\/td><\/tr><tr><td><b>3. كشف المغالطة<\/b><\/td><td>افحص طريقة الاستدلال وعلاقة اللزوم بين الدليل والنتيجة<\/td><td>رجل القش، تعميم، شخصنة<\/td><\/tr><tr><td><b>4. الرجوع لأهل العلم<\/b><\/td><td>اسأل العالم الثقة لا مجهول المنصة<\/td><td>﴿فَاسْأَلُوا أَهْلَ الذِّكْرِ﴾، وفي الحديث: «فإنما شفاء العيّ السؤال»<\/td><\/tr><\/table><\/div><\/article><article class=\"pt\"><h4><span>سادساً<\/span>ثبات أهل الإيمان أمام الشبهات<\/h4><p class=\"\"><b>أبو بكر في الحديبية:<\/b> جاء عمر رضي الله عنه في اضطراب مشروع يسأل: ألسنا على الحق وهم على الباطل؟ فعلام نعطي الدنية في ديننا؟ فردّ عليه أبو بكر بالمحكم القاطع: «أيها الرجل، إنه رسول الله، وليس يعصي ربه، وهو ناصره، فاستمسك بغرزه». ثبّته بأصل لا يتزعزع.<\/p><p class=\"\"><b>موسى عليه السلام أمام السحرة:<\/b> سحروا أعين الناس واسترهبوهم فأوجس في نفسه خيفة، فثبّته الوحي: ﴿قُلْنَا لَا تَخَفْ إِنَّكَ أَنتَ الْأَعْلَىٰ﴾ [طه: 68]. فالباطل زخرف يخدع الأعين، والحق يلقف ما صنعوا.<\/p><\/article>", "qa": "<div class=\"tw\"><table><tr><th><b>السؤال المتوقع<\/b><\/th><th><b>تفكيكه<\/b><\/th><\/tr><tr><td><b>ماذا لو صادفت شبهة لم أعرف جوابها واضطربت نفسي؟<\/b><\/td><td>جهلك بجواب مسألة لا يعني بطلان الحق. تمسك بالمحكم الثابت وضع الإشكال جانباً، واسأل أهل العلم الراسخين، وسيزول اللبس بإذن الله.<\/td><\/tr><tr><td><b>هل مشاهدة المناظرات الفكرية في تيك توك ويوتيوب تزيد ثقافتي؟<\/b><\/td><td>تشكل خطراً بالغاً على غير المتأصّل شرعياً، فالبناء أولاً ثم دفع الصائل إن لزم.<\/td><\/tr><tr><td><b>كيف أفرق بين المحكم الذي لا يقبل الشك والمسائل الاجتهادية؟<\/b><\/td><td>المحكم ما دلت عليه نصوص قاطعة الثبوت والدلالة وأجمعت عليه الأمة كأركان الإيمان والإسلام. أما الاجتهادي فما احتمل وجوهاً لظنية دليله.<\/td><\/tr><\/table><\/div>", "radar": "<p class=\"\"><b>مؤشرات الخطر:<\/b> القلق الوجودي الحاد، والتكاسل عن الصلاة بسبب فكرة تشكيكية عالقة، والانعزال التام مع متابعة مواقع الإلحاد والشك.<\/p><p class=\"\"><b>بروتوكول التدخل:<\/b><\/p><p class=\"step\"><b>1. <\/b>جلسة فردية قائمة على الأمان المطلق وتفريغ التساؤلات.<\/p><p class=\"step\"><b>2. <\/b>طبّق الخطوات الأربع على شبهته بهدوء وفكّك مقدماتها الفاسدة.<\/p><p class=\"step\"><b>3. <\/b>أهدِه كتاباً مناسباً أو نسّق له مع مستشار شرعي موثوق.<\/p>", "actT": "«فلتر الشبهات»  نشاط ذهني وحواري", "act": "<p class=\"step\"><b>1. التقسيم:<\/b> ثلاث مجموعات: أهل المحكمات، والمرشّحون، والمفكّكون.<\/p><p class=\"step\"><b>2. الشبهة المطروحة:<\/b> «يدعي بعض المشككين أن التشريعات الإسلامية تظلم الإنسان وتحد من حريته، بينما يوفر العالم الحديث الحرية المطلقة لكل شخص».<\/p><p class=\"step\"><b>3. المهمة:<\/b> فريق المحكمات يثبّت أصل العبودية وحكمة الخالق وغناه، وفريق المرشّحين يثبت وهم «الحرية المطلقة» في أي قانون بشري، وفريق المفكّكين يكشف مغالطة رجل القش ويصوغ جواباً متماسكاً.<\/p><p class=\"step\"><b>4. العرض:<\/b> يقدم كل فريق رده أمام الجميع ويربطه بخطوات الفلتر.<\/p><p class=\"step\"><b>5. الخلوة الفردية:<\/b> يعبّئ كل طالب البطاقة على إشكال خطر له:<\/p><div class=\"tw\"><table><tr><th colspan=\"2\"><b>بطاقة: فلتر الشبهات (خارطة التفكيك)<\/b><\/th><\/tr><tr><td><b>1. الشبهة<\/b><\/td><td>............................<\/td><\/tr><tr><td><b>2. المحكم الذي أردّها إليه<\/b><\/td><td>............................<\/td><\/tr><tr><td><b>3. فحص الثبوت<\/b><\/td><td>هل هي صحيحة تاريخياً وعلمياً؟ ............................<\/td><\/tr><tr><td><b>4. كشف المغالطة<\/b><\/td><td>ما التشويه أو التحريف المتبع؟ ............................<\/td><\/tr><tr><td><b>5. المرجع الآمن<\/b><\/td><td>العالم أو المصدر الذي سأسأله: ............................<\/td><\/tr><\/table><\/div>", "week": "<p class=\"\"><b>الصيام عن منصات الجدل:<\/b> التوقف التام عن متابعة حسابات المناظرات والشبهات العبثية.<\/p><p class=\"\"><b>تطبيق الفلتر:<\/b> عند مصادفة أي إشكال فكري عارض، يمرره الطالب على بطاقة الفلتر أو يعرضه على المشرف فوراً.<\/p><p class=\"\"><b>جسر إلى اللقاء الخامس:<\/b> وللثبات عدو آخر أخفى من الشبهة: الانشغال والتشتت. وهذا موضوع «الثبات في عصر المشتتات».<\/p>", "kq": "المنهجية العملية للتعامل مع الشبهات وتفكيكها", "brief": "<div class=\"plan\"><span>اقتراح لتوزيع الوقت (١٠–١٥ د)<\/span><b>افتتاح ٣<\/b><b>محاور ٥<\/b><b>حوار ٢<\/b><b>نشاط ٣<\/b><b>ختام ٢<\/b><\/div><section class=\"bs\"><h3>١ · الافتتاح: الفلتر والماء الملوث<\/h3><p class=\"\">ضع أمامهم كأسين: ماء نقياً وماء ملوثاً بحبر أو طين، ومعهما مجسماً لفلتر متعدد الطبقات. ثم قل:<\/p><p class=\"\">هل يقبل أحدكم أن يشرب الماء الملوث؟ مستحيل! لكن لو مررناه عبر فلتر يُنقّيه تماماً شربناه باطمئنان. هذا الفلتر بالضبط هو ما يحتاجه عقلك أمام سيل الشبهات في الإنترنت.<\/p><p class=\"\"><b>أسئلة الاستثارة:<\/b><\/p><p class=\"\">ما الفرق بين من يبتلع الشبهات بلا تمحيص ومن يمتلك فلتر رد الفروع إلى الأصول؟<\/p><p class=\"\">لماذا يصاب الشاب غير المحصّن بالشك من شبهة واحدة، بينما تزيد المحصّن بصيرة؟<\/p><\/section><section class=\"bs\"><h3>٢ · المحاور<\/h3><article class=\"pt\"><h4><span>١<\/span>رد المتشابه إلى المحكم<\/h4><p class=\"ayah\">﴿هُوَ الَّذِي أَنزَلَ عَلَيْكَ الْكِتَابَ مِنْهُ آيَاتٌ مُّحْكَمَاتٌ هُنَّ أُمُّ الْكِتَابِ وَأُخَرُ مُتَشَابِهَاتٌ ۖ فَأَمَّا الَّذِينَ فِي قُلُوبِهِمْ زَيْغٌ فَيَتَّبِعُونَ مَا تَشَابَهَ مِنْهُ ابْتِغَاءَ الْفِتْنَةِ﴾ [آل عمران: 7]<\/p><p class=\"g\">الأصل رد الفرعيات للأصول الكبرى القاطعة.<\/p><details class=\"more\"><summary>للتوسع<\/summary><p class=\"\">الآية ترسم المنهج: القضايا الكبرى كوجود الله وعدله وصدق القرآن والنبوة قاطعة محكمة، هي «أم الكتاب» التي ترجع إليها الجزئيات. أما من في قلبه زيغ فيتتبع الجزئية المشتبهة ليهدم بها الأصل. فالأصل أن نردّ المتشابه إلى المحكم، لا أن نهدم المحكم بالمتشابه.<\/p><\/details><\/article><article class=\"pt\"><h4><span>٢<\/span>سؤال أهل الاختصاص<\/h4><p class=\"ayah\">﴿فَاسْأَلُوا أَهْلَ الذِّكْرِ إِن كُنتُمْ لَا تَعْلَمُونَ﴾ [النحل: 43]<\/p><p class=\"g\">جهل الإنسان بالجواب لا يعني بطلان الحق.<\/p><details class=\"more\"><summary>للتوسع<\/summary><p class=\"\">نرجع في الطب إلى الطبيب وفي الهندسة إلى المهندس، وفي مسائل الدين إلى أهل العلم الراسخين، لا إلى مقاطع مجهولة المصدر. وجهلك بجواب مسألة لا يعني بطلان الحق، بل نقص علمك البشري.<\/p><\/details><\/article><article class=\"pt\"><h4><span>٣<\/span>الوقاية من مجالس الخوض<\/h4><p class=\"ayah\">﴿وَإِذَا رَأَيْتَ الَّذِينَ يَخُوضُونَ فِي آيَاتِنَا فَأَعْرِضْ عَنْهُمْ حَتَّىٰ يَخُوضُوا فِي حَدِيثٍ غَيْرِهِ﴾ [الأنعام: 68]<\/p><p class=\"g\">إ السلامة الفكرية تقتضي الابتعاد عن مواطن الجدل العبثي.<\/p><details class=\"more\"><summary>للتوسع<\/summary><p class=\"\">القلوب ضعيفة والشبه خطّافة، والسلامة لا يعدلها شيء. ومجالس الجدل في المنصات المفتوحة خطر على غير المتأصّل، فنقدّم البناء أولاً ثم دفع الشبهة عند الحاجة.<\/p><\/details><\/article><article class=\"pt\"><h4><span>٤<\/span>الاحتياط في المشتبهات<\/h4><p class=\"had\">قال رسول الله ﷺ: «إنَّ الحَلالَ بَيِّنٌ، وإنَّ الحَرامَ بَيِّنٌ، وبينَهُما أُمُورٌ مُشْتَبِهاتٌ لا يَعْلَمُهُنَّ كَثِيرٌ مِنَ النَّاسِ، فَمَنِ اتَّقَى الشُّبُهاتِ اسْتَبْرَأَ لِدِينِهِ وعِرْضِهِ...» متفق عليه. وفي الخواطر والوساوس التشكيكية قال ﷺ: «يَأْتي الشَّيْطانُ أحَدَكُمْ فيَقولَ: مَن خَلَقَ كَذا وكَذا؟ حتَّى يَقُولَ له: مَن خَلَقَ رَبَّكَ؟ فإذا بَلَغَ ذلكَ، فَلْيَسْتَعِذْ باللَّهِ ولْيَنْتَهِ» رواه البخاري. أي أن الخاطر الشيطاني يُقطع بالاستعاذة وصرف الذهن، لا بالاسترسال في سلسلة أسئلة لا تنتهي.<\/p><p class=\"g\">درء الوساوس يكون بقطعها وصرف الذهن عنها.<\/p><details class=\"more\"><summary>للتوسع<\/summary><\/details><\/article><\/section><section class=\"bs\"><h3>٣ · سؤال للحوار<\/h3><p class=\"big\">ما الشبهة التي سمعتها ولم تجد لها جوابا؟ وإلى من سترجع؟<\/p><\/section><section class=\"bs\"><h3>٤ · نشاط تطبيقي<\/h3><p class=\"big\">ابن «بطاقة الفلتر» :ثلاث خطوات تفعلها عند أي شبهة.<\/p><\/section><section class=\"bs\"><h3>أسئلة قد تُطرح<\/h3><details class=\"more\"><summary><b>ماذا لو صادفت شبهة لم أعرف جوابها واضطربت نفسي؟<\/b><\/summary><p>جهلك بجواب مسألة لا يعني بطلان الحق. تمسك بالمحكم الثابت وضع الإشكال جانباً، واسأل أهل العلم الراسخين، وسيزول اللبس بإذن الله.<\/p><\/details><details class=\"more\"><summary><b>هل مشاهدة المناظرات الفكرية في تيك توك ويوتيوب تزيد ثقافتي؟<\/b><\/summary><p>تشكل خطراً بالغاً على غير المتأصّل شرعياً، فالبناء أولاً ثم دفع الصائل إن لزم.<\/p><\/details><\/section><section class=\"bs warn\"><h3>رادار الحماية<\/h3><p><b>مؤشرات الخطر:<\/b> القلق الوجودي الحاد، والتكاسل عن الصلاة بسبب فكرة تشكيكية عالقة، والانعزال التام مع متابعة مواقع الإلحاد والشك.<\/p><small>البروتوكول كاملاً في تبويب «الكامل».<\/small><\/section><section class=\"bs\"><h3>٥ · رحلة الأسبوع<\/h3><p class=\"\"><b>الصيام عن منصات الجدل:<\/b> التوقف التام عن متابعة حسابات المناظرات والشبهات العبثية.<\/p><p class=\"\"><b>تطبيق الفلتر:<\/b> عند مصادفة أي إشكال فكري عارض، يمرره الطالب على بطاقة الفلتر أو يعرضه على المشرف فوراً.<\/p><p class=\"\"><b>جسر إلى اللقاء الخامس:<\/b> وللثبات عدو آخر أخفى من الشبهة: الانشغال والتشتت. وهذا موضوع «الثبات في عصر المشتتات».<\/p><\/section>", "slides": ["<div class=\"cn\">4<\/div><h2>حصون اليقين (صناعة الفلتر)<\/h2><p class=\"q\">ما هي
