يق الأذكى؟ وما الذي صنع نجاح الفريق الأقل ذكاء؟<\/li><li class=\"frag\">هل شاركت في عمل جماعي أفسدته الأنانية أو الخلاف؟ ما الذي كان يمكن فعله؟<\/li><\/ul>", "<small>1<\/small><h2>التحذير من التنازع الداخلي<\/h2><p class=\"ayah\">﴿وَأَطِيعُوا اللَّهَ وَرَسُولَهُ وَلَا تَنَازَعُوا فَتَفْشَلُوا وَتَذْهَبَ رِيحُكُمْ ۖ وَاصْبِرُوا ۚ إِنَّ اللَّهَ مَعَ الصَّابِرِينَ﴾ [الأنفال: 46]<\/p><p class=\"g frag\">الأنانية والنزاع يهدران طاقة الفريق مهما بلغت نسبة ذكاء أفراده.<\/p>", "<small>2<\/small><h2>الشورى والنزول عند الأغلبية<\/h2><p class=\"g frag\">القائد ينسق الطاقات ولا يستبد. والرجولة أن ينزل الفرد عند رأي الأغلبية ويعمل لإنجاحه.<\/p>", "<small>3<\/small><h2>الفريق كالبنيان المرصوص<\/h2><p class=\"had lg\">قال رسول الله ﷺ: «الْمُؤْمِنُ لِلْمُؤْمِنِ كَالْبُنْيَانِ يَشُدُّ بَعْضُهُ بَعْضًا»، وشبّك بين أصابعه. رواه البخاري. فالتمثيل الحسي بتشبيك الأصابع يعلّمنا أن الفريق قوته في التكامل: كل لبنة في موضعها، ولا تغني لبنة عن أخرى. وقال ﷺ: «يَدُ اللَّهِ مَعَ الْجَمَاعَةِ» رواه الترمذي، فالبركة والرعاية تحف الجماعة المؤتلفة التي تخلت عن الأنانية.<\/p><p class=\"g frag\">قوة الفريق في تكامل الأدوار ومساندة المتعثر.<\/p>", "<small>4<\/small><h2>القيادة خدمة ومشاركة<\/h2><p class=\"g frag\">عمل النبي ﷺ مع أصحابه في الخندق يرسخ أن القيادة تواضع ومشاركة ميدانية وليست أوامر من بعد.<\/p>", "<small>سؤال للحوار<\/small><h2 class=\"big\">ما الدور الذي تحسنه داخل الفريق؟<\/h2>", "<small>نشاط تطبيقي<\/small><h2 class=\"big\">تحدي البرج :ابنوا أعلى برج بأدوات محدودة، ثم قي موا الأدوار.<\/h2>", "<small>سؤال وبرهان<\/small><details class=\"frag\"><summary><b>إذا كان في الفريق عضو كسول لا يعمل، فلماذا أتحمل جهده وينال نفس تقييمي؟<\/b><\/summary><p>الحل ليس بالانسحاب أو المشاجرة، بل في وضوح توزيع المهام المكتوبة منذ اليوم الأول وتوثيقها. فإن قصر عضو ناصحه القائد بلطف، فإن تمادى رُفع الأمر للمشرف أو المعلم ببيانات دقيقة وموضوعية دون تجريح.<\/p><\/details><details class=\"frag\"><summary><b>هل يجب أن يكون القائد أذكى وأخبر أعضاء الفريق؟<\/b><\/summary><p>لا يشترط. القائد الناجح ليس من يفعل كل شيء، بل من يحسن تنسيق الطاقات ويوفر البيئة التي تجعل الأذكياء يبدعون. فالقيادة خدمة وتيسير وليست رتبة استعلاء.<\/p><\/details><details class=\"frag\"><summary><b>كيف أتصرف إذا صوّت الفريق على رأي أراه خاطئاً؟<\/b><\/summary><p>من كمال الرجولة والشورى أن تنزل عند رأي الأغلبية وتعمل لإنجاحه بكل طاقتك، ما لم يكن معصية لله. وقد نزل النبي ﷺ عند رأي الأكثرية في الخروج إلى أحد مع أن رأيه كان البقاء.<\/p><\/details>", "<small>ميدان التطبيق<\/small><h2>«مختبر محاكاة أزمة الفريق»  نشاط حركي وتعاوني<\/h2><ol><li class=\"frag\">1. التشكيل: فرق من أربعة فتيان، لكل فريق قائد ومنفذ ومنسق ومراقب.<\/li><li class=\"frag\">2. التحدي: بناء أعلى برج ورقي متزن دون استخدام أي مادة لاصقة في وقت محدد.<\/li><li class=\"frag\">3. الأزمة الطارئة: في منتصف الوقت يسلم المشرف كل فريق ظرفاً طارئاً (مثل: القائد لا يحق له الكلام إلا بالإشارة، أو سُحبت خمس أوراق وعليهم تعديل الخطة…<\/li><li class=\"frag\">4. بروتوكول الخلاف: يتدرب الفريق على اتخاذ القرار بالشورى بهدوء تحت الضغط.<\/li><li class=\"frag\">5. التأمل: يناقش المراقب والفريق ما نجح وما أفشل، بالأدلة والأمثلة.<\/li><li class=\"frag\">6. دراسة حالة: فريق «الرواد» من خمسة طلاب اتفقوا على إعداد مجسم علمي للمنافسة المدرسية.<\/li><li class=\"frag\">7. الاعتراض: أحد الطلاب يدافع عن «العمل الفردي أسرع وأضمن»، وتناقشه المجموعات.<\/li><\/ol>", "<small>رحلة الأسبوع<\/small><ul><li class=\"frag\"><b>مهمة جماعية:<\/b> ينفذ الطالب مع زميلين مهمة مشتركة صغيرة (دراسية أو خدمية) بتوزيع أدوار مكتوب.<\/li><li class=\"frag\"><b>مساندة زميل:<\/b> يساعد زميلاً في مهمة دون انتظار شكر.<\/li><li class=\"frag\"><b>تطبيق بروتوكول الخلاف:<\/b> يطبق الخطوات الخمس في خلاف واحد يواجهه ويدوّن النتيجة.<\/li><li class=\"frag\"><b>جسر إلى اللقاء الثاني والعشرين:<\/b> وإذا عملنا معاً ظهرت مشكلات حقيقية تحتاج إلى حل. وهذا موضوع «حل المشكلات واتخاذ القرار».<\/li><\/ul>"], "n": 21, "u": 4, "title": "العمل الجماعي", "q": "كيف ندير الخلافات وننجح بروح الفريق؟", "dqq": "ما الدور الذي تحسنه داخل الفريق؟", "pact": "تحدي البرج :ابنوا أعلى برج بأدوات محدودة، ثم قي موا الأدوار."}, {"summary": "<p class=\"\">تواجه الفتى مشكلات حقيقية: درجات متدنية، وخلاف مع صديق، وضغط من الأسرة، وحيرة في اختيار طريق. وقد يتعامل معها بالإنكار وإخفاء الأعراض، أو بالتردد حتى تتفاقم. يتعلم في هذا اللقاء أن حل المشكلة يبدأ بالبحث عن سببها الجذري لا الاكتفاء بمظهرها، وأن القرار الحكيم يمر بتوليد بدائل ثم موازنتها ثم الحسم مع التوكل على الله. ويتعلم الجمع بين الاستشارة والاستخارة، وأن الخطأ بعد اجتهاد جزء من النضج.<\/p><p class=\"\">يطبق تقنية «لماذا الخمس» ليصل إلى السبب الجذري.<\/p><p class=\"\">يولّد ثلاثة بدائل ويوازن بينها قبل أن يقرر.<\/p><p class=\"\">يتخلص من شلل التحليل بالحسم والتوكل.<\/p><div class=\"tw\"><table><tr><th><b>المهارة<\/b><\/th><th><b>معناها العملي<\/b><\/th><\/tr><tr><td><b>تحليل السبب الجذري<\/b><\/td><td>لا يقف عند ظاهر المشكلة بل يحفر حتى يصل إلى أصلها<\/td><\/tr><tr><td><b>التفكير الإبداعي<\/b><\/td><td>يولّد حلولاً متعددة منها المألوف والذكي والجذري<\/td><\/tr><tr><td><b>الحسم والتوكل<\/b><\/td><td>يقرر بعد الاستشارة والتحليل ثم يتوكل ولا يتردد<\/td><\/tr><\/table><\/div>", "kit": "<p class=\"\"><b>ما يعيشه الفتى:<\/b> كثير من الفتيان يعالجون الأعراض فقط: يلصقون «الشريط الأسود» فوق لمبة التحذير. وبعضهم يتجنب القرار خوفاً من الخطأ، فيتراكم عليه الندم من التأجيل.<\/p><p class=\"\"><b>اجعل المشكلات واقعية:<\/b> اطلب من الطلاب مشكلات من حياتهم، واحترم الخصوصية بأن يكتبوها دون أسماء.<\/p><p class=\"\"><b>لا تحل بدلاً عنهم:<\/b> دورك أن تسأل «لماذا؟» لا أن تعطي الجواب الجاهز.<\/p><p class=\"\"><b>طمئنهم من الخطأ:<\/b> القرار الخاطئ بعد اجتهاد مادة تعلّم، والجمود أسوأ منه.<\/p><p class=\"\"><b>احذر قضايا حساسة:<\/b> إن كشف فتى مشكلة خطيرة (أذى أو تهديد) فتعامل معها بسرية وإحالة مناسبة إلى ولي أمره أو مختص.<\/p>", "hookT": "مالك ومعاذ والمصباح الأحمر", "hook": "<p class=\"\"><b>مالك (17 سنة)<\/b> كان يقود سيارته فأضاءت فجأة لمبة التحذير الحمراء. بدلاً من التوقف والبحث عن العطل ألصق شريطاً أسود فوق اللمبة كي لا يراها وواصل السير مسرعاً. وبعد عشرة كيلومترات انفجر المحرك بالكامل وخسر مئات الدولارات. أما <b>معاذ (17 سنة)<\/b> فتعرض لموقف مماثل، فتوقف فوراً وفتح غطاء المحرك وفحص الزيت والماء، واكتشف تسرباً طفيفاً فأصلحه في دقائق ووفر ماله وسيارته.<\/p><p class=\"\"><b>أسئلة الاستثارة:<\/b><\/p><p class=\"\">ما «لمبة التحذير الحمراء» التي ألصقت عليها شريطاً أسود في حياتك؟ (درجات، علاقة، عادة)<\/p><p class=\"\">لماذا نهرب من جذر المشكلة مع أنه أرخص حلاً حين نبدأ مبكراً؟<\/p>", "pts": "<article class=\"pt\"><h4><span>أولاً<\/span>الحكمة وضع الأمور في مواضعها<\/h4><p class=\"ayah\">﴿يُؤْتِي الْحِكْمَةَ مَن يَشَاءُ ۚ وَمَن يُؤْتَ الْحِكْمَةَ فَقَدْ أُوتِيَ خَيْرًا كَثِيرًا ۗ وَمَا يَذَّكَّرُ إِلَّا أُولُو الْأَلْبَابِ﴾ [البقرة: 269]<\/p><p class=\"\">الحكمة هي وضع الشيء في موضعه اللائق، وهي من أعظم ما يعطيه الله لعباده. وتجتمع فيها دقة التحليل وسلامة القرار. وختمت الآية بقوله ﴿وَمَا يَذَّكَّرُ إِلَّا أُولُو الْأَلْبَابِ﴾، فمن لا يتأمل ولا يتعلم من تجاربه لا يتذكر.<\/p><\/article><article class=\"pt\"><h4><span>ثانياً<\/span>منهج القرآن في المفاضلة<\/h4><p class=\"ayah\">﴿فَبَشِّرْ عِبَادِ * الَّذِينَ يَسْتَمِعُونَ الْقَوْلَ فَيَتَّبِعُونَ أَحْسَنَهُ ۚ أُولَٰئِكَ الَّذِينَ هَدَاهُمُ اللَّهُ ۖ وَأُولَٰئِكَ هُمْ أُولُو الْأَلْبَابِ﴾ [الزمر: 17-18]<\/p><p class=\"\">رسم القرآن منهجاً لاتخاذ القرار: الاستماع إلى الخيارات المتعددة ثم اتباع أحسنها. فلا يكفي أن تفكر في خيار واحد، بل ولّد بدائل وقارن بينها، ثم اختر الأنفع والأرجح مصلحة.<\/p><\/article><article class=\"pt\"><h4><span>ثالثاً<\/span>اليسر والواقعية في الاختيار<\/h4><p class=\"\">قالت عائشة رضي الله عنها: «مَا خُيِّرَ رَسُولُ اللَّهِ ﷺ بَيْنَ أَمْرَيْنِ إِلاَّ أَخَذَ أَيْسَرَهُمَا مَا لَمْ يَكُنْ إِثْمًا» متفق عليه. فالنبي ﷺ كان واقعياً مرناً في قراراته، يختار الأيسر والأنفع بشرط السلامة من الحرام، ولا يعقّد على نفسه ولا يتكلف.<\/p><\/article><article class=\"pt\"><h4><span>رابعاً<\/span>اجمع المعلومات قبل الحكم<\/h4><p class=\"\">لما بعث النبي ﷺ علياً رضي الله عنه إلى اليمن قاضياً قال: يا رسول الله، تبعثني وأنا شاب لا أدري ما القضاء؟ فضرب في صدره وقال: «اللَّهُمَّ اهْدِ قَلْبَهُ وَثَبِّتْ لِسَانَهُ». ثم قال: «إِذَا جَلَسَ بَيْنَ يَدَيْكَ الْخَصْمَانِ فَلاَ تَقْضِيَنَّ حَتَّى تَسْمَعَ مِنَ الآخَرِ كَمَا سَمِعْتَ مِنَ الأَوَّلِ، فَإِنَّهُ أَحْرَى أَنْ يَتَبَيَّنَ لَكَ الْقَضَاءُ». رواه أبو داود والترمذي. فقبل أي قرار اسمع الأطراف كلها وافحص وجهات النظر.<\/p><\/article><article class=\"pt\"><h4><span>خامساً<\/span>مشورة أم سلمة في الحديبية<\/h4><p class=\"\">لما اشتد كرب الصحابة من بنود صلح الحديبية وتباطؤوا عن النحر والحلق، دخل النبي ﷺ على أم سلمة رضي الله عنها كئيباً، فأشارت عليه بحل ذكي: «اخْرُجْ ثُمَّ لاَ تُكَلِّمْ أَحَداً مِنْهُمْ كَلِمَةً حَتَّى تَنْحَرَ بُدْنَكَ وَتَدْعُوَ حَالِقَكَ فَيَحْلِقَكَ». ففعل، فقاموا فنحروا وحلقوا. رواه البخاري. فكان الحل في تغيير الطريقة لا زيادة الكلام: جذر المشكلة تردد المتابعين، وعلاجه قدوة عملية. وفي الموقف قيمة الاستماع لمشورة ذوي الرأي وقبولها.<\/p><\/article><article class=\"pt\"><h4><span>سادساً<\/span>الاستشارة والاستخارة متلازمتان<\/h4><p class=\"ayah\">﴿وَشَاوِرْهُمْ فِي الْأَمْرِ ۖ فَإِذَا عَزَمْتَ فَتَوَكَّلْ عَلَى اللَّهِ ۚ إِنَّ اللَّهَ يُحِبُّ الْمُتَوَكِّلِينَ﴾ [آل عمران: 159]<\/p><p class=\"\">في الآية ترتيب عملي لاتخاذ القرار: شاور، ثم اعزم، ثم توكل. وعلّم النبي ﷺ الاستخارة في الأمور كلها: «إِذَا هَمَّ أَحَدُكُمْ بِالأَمْرِ فَلْيَرْكَعْ رَكْعَتَيْنِ مِنْ غَيْرِ الْفَرِيضَةِ ثُمَّ لِيَقُلْ...» رواه البخاري. فالاستخارة لا تغني عن التفكير والتحليل والاستشارة، بل تأتي بعدها تفويضاً للأمر إلى الله.<\/p><\/article><article class=\"pt\"><h4><span>سابعاً<\/span>خوارزمية السبب الجذري: لماذا الخمس<\/h4><div class=\"tw\"><table><tr><th><b>السؤال<\/b><\/th><th><b>الجواب (مثال: درجاتي متدنية في الرياضيات)<\/b><\/th><\/tr><tr><td><b>لماذا 1؟<\/b><\/td><td>لأنني لم أحل جيداً في الاختبار<\/td><\/tr><tr><td><b>لماذا 2؟<\/b><\/td><td>لأنني لم أذاكر إلا ليلة الامتحان<\/td><\/tr><tr><td><b>لماذا 3؟<\/b><\/td><td>لأنني أجّلت المذاكرة أسبوعين<\/td><\/tr><tr><td><b>لماذا 4؟<\/b><\/td><td>لأنني أقضي ثلاث ساعات يومياً على المقاطع القصيرة بعد عودتي<\/td><\/tr><tr><td><b>لماذا 5 (السبب الجذر)<\/b><\/td><td>غياب نظام لحظر الهاتف وفوضى بيئة الغرفة<\/td><\/tr><\/table><\/div><p class=\"\">فلو عالج الفتى الظاهر (مذاكرة أكثر ليلة الامتحان) لتكررت المشكلة. وإذا عالج الجذر (نظام الهاتف والبيئة) انحلّ الظاهر.<\/p><\/article><article class=\"pt\"><h4><span>ثامناً<\/span>خوارزمية الحسم<\/h4><div class=\"tw\"><table><tr><th><b>الخطوة<\/b><\/th><th><b>ما تفعله<\/b><\/th><\/tr><tr><td><b>1. تشخيص السبب الجذر<\/b><\/td><td>طبّق «لماذا الخمس» حتى تصل إلى الأصل<\/td><\/tr><tr><td><b>2. توليد ثلاثة بدائل<\/b><\/td><td>حل مألوف، وحل ذكي قليل التكلفة، وحل جذري شجاع<\/td><\/tr><tr><td><b>3. موازنة المصالح والمفاسد<\/b><\/td><td>قيّم كل حل بدرجة من عشرة للمكاسب والأضرار<\/td><\/tr><tr><td><b>4. حسم القرار والتنفيذ<\/b><\/td><td>ابدأ خطوة أولى خلال أربع وعشرين ساعة<\/td><\/tr><\/table><\/div><\/article><article class=\"pt\"><h4><span>تاسعاً<\/span>شلل التحليل<\/h4><p class=\"\">لا يوجد قرار كامل بنسبة مئة بالمئة خالٍ من العيوب. والشجاعة تقتضي اختيار الأرجح مصلحة والأقل مفسدة، ثم التوكل على الله وترك التردد. فمن انتظر الحل المثالي لم يتحرك، والحياة لا تنتظر. والتردد المستمر قرار بحد ذاته، وغالباً هو أسوأ القرارات.<\/p><\/article>", "qa": "<div class=\"tw\"><table><tr><th><b>السؤال المتوقع<\/b><\/th><th><b>تفكيكه<\/b><\/th><\/tr><tr><td><b>ماذا لو اتخذت قراراً وتبين لاحقاً أنه خاطئ وندمت؟<\/b><\/td><td>اتخاذ قرار مبني على الاستشارة والتحليل ثم الخطأ فيه جزء أصيل من نضج الإنسان. والخطأ مادة للتعلم، والتردد والهروب المستمر أسوأ من قرار يحتاج إلى تصويب.<\/td><\/tr><tr><td><b>هل الاستخارة تغني عن التفكير التحليلي واستشارة الخبراء؟<\/b><\/td><td>الاستخارة والشورى متلازمتان. شرع الله استشارة العقلاء ودراسة البدائل أولاً، ثم صلاة الاستخارة تفويضاً للأمر إلى الله. ولا تعارض بين الشرع والعقل.<\/td><\/tr><tr><td><b>كيف أتصرف إذا واجهت مشكلة أجهل كيف أحلها؟<\/b><\/td><td>أول قواعد الحكمة الاعتراف بالجهل وسؤال أهل الخبرة: ﴿فَاسْأَلُوا أَهْلَ الذِّكْرِ إِن كُنتُمْ لَا تَعْلَمُونَ﴾. والرجولة تقتضي طلب العون لا التخبط والمكابرة.<\/td><\/tr><\/table><\/div>", "radar": "<p class=\"\"><b>مؤشرات الخطر:<\/b> إخفاء المشكلات حتى تتفاقم، والتردد المزمن، ولوم الظروف والآخرين دائماً، واتخاذ قرارات انفعالية مندفعة، أو الهروب بالنوم والشاشات عند أول ضغط.<\/p><p class=\"\"><b>بروتوكول التدخل:<\/b><\/p><p class=\"step\"><b>1. <\/b>اسأله: ما أكثر ما يشغلك الآن؟ ودعه يسمّ المشكلة بنفسه.<\/p><p class=\"step\"><b>2. <\/b>طبقا معاً «لماذا الخمس» على مشكلة واحدة صغيرة.<\/p><p class=\"step\"><b>3. <\/b>اتفق معه على خطوة واحدة خلال أربع وعشرين ساعة، وتابعه بعدها.<\/p>", "actT": "«عيادة الأزمات ومصفوفة اتخاذ القرار»  نشاط تحليلي", "act": "<p class=\"step\"><b>1. التشخيص:<\/b> يكتب كل طالب مشكلة حقيقية تؤرقه (ضعف دراسي، تسويف، خلاف) دون ذكر أسماء.<\/p><p class=\"step\"><b>2. حفر الجذور:<\/b> يطبق أسئلة «لماذا الخمس» حتى يصل إلى السبب الجوهري.<\/p><p class=\"step\"><b>3. توليد البدائل:<\/b> يكتب ثلاثة حلول: مألوف، وذكي قليل التكلفة، وجذري شجاع.<\/p><p class=\"step\"><b>4. المفاضلة:<\/b> يقيّم كل حل بدرجة من عشرة (المكاسب مطروحاً منها الأضرار) ويكتب قراره النهائي للبدء خلال أربع وعشرين ساعة.<\/p><p class=\"step\"><b>5. دراسة حالة:<\/b> حسام (17 سنة) في الصف الأخير بالثانوية. والده يضغط عليه ليدخل كلية الهندسة، وهو يملك شغفاً ومهارة عالية في البرمجة والذكاء الاصطناعي. أصابه الهلع والتردد: إن دخل الهندسة خشي الفشل، وإن دخل الحاسوب خشي غضب والده. فتوقف عن المذاكرة وصار يقضي ثماني ساعات في النوم والهروب بالشاشات. تحلل المجموعات: ما السبب الجذري؟ وما بدائله الثلاثة؟ وما قراره؟<\/p><p class=\"step\"><b>6. الاعتراض:<\/b> أحد الطلاب يدافع عن «الأفضل أن أترك الأمور تسير وحدها»، وتناقشه المجموعات.<\/p><div class=\"tw\"><table><tr><th colspan=\"2\"><b>بطاقة: قراري الحاسم<\/b><\/th><\/tr><tr><td><b>1. المشكلة<\/b><\/td><td>............................<\/td><\/tr><tr><td><b>2. السبب الجذر (بعد لماذا الخمس)<\/b><\/td><td>............................<\/td><\/tr><tr><td><b>3. البدائل الثلاثة<\/b><\/td><td>مألوف: ............ ذكي: ............ جذري: ............<\/td><\/tr><tr><td><b>4. القرار التنفيذي<\/b><\/td><td>............................ (يبدأ خلال 24 ساعة)<\/td><\/tr><tr><td><b>5. سجل الحسم (ضع ✓)<\/b><\/td><td>تشخيص السبب الجذر ( ) استشارة حكيمة ( ) خطوة قرار شجاع ( )<\/td><\/tr><tr><td><b>6. عهد الفتى المسلم<\/b><\/td><td>«أنا رجل حكيم، أواجه المشكلات ببصيرة، أتوكل على ربي، ولا أعرف التردد»<\/td><\/tr><\/table><\/div>", "week": "<p class=\"\"><b>مشكلة واحدة:<\/b> يطبق الطالب «لماذا الخمس» على مشكلة حقيقية ويدوّن النتيجة.<\/p><p class=\"\"><b>استشارة حكيمة:<\/b> يستشير شخصاً عاقلاً موثوقاً في قرار يواجهه.<\/p><p class=\"\"><b>خطوة شجاعة:<\/b> ينفذ خطوة واحدة من قراره خلال ثمان وأربعين ساعة.<\/p><p class=\"\"><b>جسر إلى اللقاء الثالث والعشرين:<\/b> ومن أعظم ما تواجهه في العمل أن يتعارض الإتقان مع الراحة، والأمانة مع الغش. وهذا موضوع «أخلاقيات المهن والعمل».<\/p>", "kq": "التفكير الإبداعي ومهارات تفكيك الأزمات الواقعية", "brief": "<div class=\"plan\"><span>اقتراح لتوزيع الوقت (١٠–١٥ د)<\/span><b>افتتاح ٣<\/b><b>محاور ٥<\/b><b>حوار ٢<\/b><b>نشاط ٣<\/b><b>ختام ٢<\/b><\/div><section class=\"bs\"><h3>١ · الافتتاح: مالك ومعاذ والمصباح الأحمر<\/h3><p class=\"\"><b>مالك (17 سنة)<\/b> كان يقود سيارته فأضاءت فجأة لمبة التحذير الحمراء. بدلاً من التوقف والبحث عن العطل ألصق شريطاً أسود فوق اللمبة كي لا يراها وواصل السير مسرعاً. وبعد عشرة كيلومترات انفجر المحرك بالكامل وخسر مئات الدولارات. أما <b>معاذ (17 سنة)<\/b> فتعرض لموقف مماثل، فتوقف فوراً وفتح غطاء المحرك وفحص الزيت والماء، واكتشف تسرباً طفيفاً فأصلحه في دقائق ووفر ماله وسيارته.<\/p><p class=\"\"><b>أسئلة الاستثارة:<\/b><\/p><p class=\"\">ما «لمبة التحذير الحمراء» التي ألصقت عليها شريطاً أسود في حياتك؟ (درجات، علاقة، عادة)<\/p><p class=\"\">لماذا نهرب من جذر المشكلة مع أنه أرخص حلاً حين نبدأ مبكراً؟<\/p><\/section><section class=\"bs\"><h3>٢ · المحاور<\/h3><article class=\"pt\"><h4><span>١<\/span>الحكمة في فحص الخيارات<\/h4><p class=\"g\">الحكمة تتجلى في البحث عن السبب الجذري للمشكلة بدلا من الاكتفاء بمعالجة أعراضها الظاهرة.<\/p><details class=\"more\"><summary>للتوسع<\/summary><p class=\"\">قالت عائشة رضي الله عنها: «مَا خُيِّرَ رَسُولُ اللَّهِ ﷺ بَيْنَ أَمْرَيْنِ إِلاَّ أَخَذَ أَيْسَرَهُمَا مَا لَمْ يَكُنْ إِثْمًا» متفق عليه. فالنبي ﷺ كان واقعياً مرناً في قراراته، يختار الأيسر والأنفع بشرط السلامة من الحرام، ولا يعقّد على نفسه ولا يتكلف.<\/p><\/details><\/article><article class=\"pt\"><h4><span>٢<\/span>منهجية المفاضلة<\/h4><p class=\"ayah\">﴿فَبَشِّرْ عِبَادِ * الَّذِينَ يَسْتَمِعُونَ الْقَوْلَ فَيَتَّبِعُونَ أَحْسَنَهُ ۚ أُولَٰئِكَ الَّذِينَ هَدَاهُمُ اللَّهُ ۖ وَأُولَٰئِكَ هُمْ أُولُو الْأَلْبَابِ﴾ [الزمر: 17-18]<\/p><p class=\"g\">توليد البدائل المتعددة واختيار الأرجح مصلحة هو المنهج القرآني في القرار.<\/p><details class=\"more\"><summary>للتوسع<\/summary><p class=\"\">رسم القرآن منهجاً لاتخاذ القرار: الاستماع إلى الخيارات المتعددة ثم اتباع أحسنها. فلا يكفي أن تفكر في خيار واحد، بل ولّد بدائل وقارن بينها، ثم اختر الأنفع والأرجح مصلحة.<\/p><\/details><\/article><article class=\"pt\"><h4><span>٣<\/span>اليسر والواقعية<\/h4><p class=\"g\">إثما» (متفق عليه) القرارات المعقدة والمثالية الزائدة تؤدي إلى شلل التنفيذ.<\/p><details class=\"more\"><summary>للتوسع<\/summary><p class=\"\">قالت عائشة رضي الله عنها: «مَا خُيِّرَ رَسُولُ اللَّهِ ﷺ بَيْنَ أَمْرَيْنِ إِلاَّ أَخَذَ أَيْسَرَهُمَا مَا لَمْ يَكُنْ إِثْمًا» متفق عليه. فالنبي ﷺ كان واقعياً مرناً في قراراته، يختار الأيسر والأنفع بشرط السلامة من الحرام، ولا يعقّد على نفسه ولا يتكلف.<\/p><\/details><\/article><article class=\"pt\"><h4><span>٤<\/span>الجمع بين الشورى والاستخارة<\/h4><p class=\"ayah\">﴿وَشَاوِرْهُمْ فِي الْأَمْرِ ۖ فَإِذَا عَزَمْتَ فَتَوَكَّلْ عَلَى اللَّهِ ۚ إِنَّ اللَّهَ يُحِبُّ الْمُتَوَكِّلِينَ﴾ [آل عمران: 159]<\/p><p class=\"g\">القرار الحكيم يبدأ بجمع المعلومات ثم الحسم والتوكل.<\/p><details class=\"more\"><summary>للتوسع<\/summary><p class=\"\">في الآية ترتيب عملي لاتخاذ القرار: شاور، ثم اعزم، ثم توكل. وعلّم النبي ﷺ الاستخارة في الأمور كلها: «إِذَا هَمَّ أَحَدُكُمْ بِالأَمْرِ فَلْيَرْكَعْ رَكْعَتَيْنِ مِنْ غَيْرِ الْفَرِيضَةِ ثُمَّ لِيَقُلْ...» رواه البخاري. فالاستخارة لا تغني عن التفكير والتحليل والاستشارة، بل تأتي بعدها تفويضاً للأمر إلى الله.<\/p><\/details><\/article><\/section><section class=\"bs\"><h3>٣ · سؤال للحوار<\/h3><p class=\"big\">كيف نفرق بين سبب المشكلة وع رضها؟<\/p><\/section><section class=\"bs\"><h3>٤ · نشاط تطبيقي<\/h3><p class=\"big\">طبق «لماذا × »٥على مشكلة حقيقية واقترح ثلاثة بدائل.<\/p><\/section><section class=\"bs\"><h3>أسئلة قد تُطرح<\/h3><details class=\"more\"><summary><b>ماذا لو اتخذت قراراً وتبين لاحقاً أنه خاطئ وندمت؟<\/b><\/summary><p>اتخاذ قرار مبني على الاستشارة والتحليل ثم الخطأ فيه جزء أصيل من نضج الإنسان. والخطأ مادة للتعلم، والتردد والهروب المستمر أسوأ من قرار يحتاج إلى تصويب.<\/p><\/details><details class=\"more\"><summary><b>هل الاستخارة تغني عن التفكير التحليلي واستشارة الخبراء؟<\/b><\/summary><p>الاستخارة والشورى متلازمتان. شرع الله استشارة العقلاء ودراسة البدائل أولاً، ثم صلاة الاستخارة تفويضاً للأمر إلى الله. ولا تعارض بين الشرع والعقل.<\/p><\/details><\/section><section class=\"bs warn\"><h3>رادار الحماية<\/h3><p><b>مؤشرات الخطر:<\/b> إخفاء المشكلات حتى تتفاقم، والتردد المزمن، ولوم الظروف والآخرين دائماً، واتخاذ قرارات انفعالية مندفعة، أو الهروب بالنوم والشاشات عند أول ضغط.<\/p><small>البروتوكول كاملاً في تبويب «الكامل».<\/small><\/section><section class=\"bs\"><h3>٥ · رحلة الأسبوع<\/h3><p class=\"\"><b>مشكلة واحدة:<\/b> يطبق الطالب «لماذا الخمس» على مشكلة حقيقية ويدوّن النتيجة.<\/p><p class=\"\"><b>استشارة حكيمة:<\/b> يستشير شخصاً عاقلاً موثوقاً في قرار يواجهه.<\/p><p class=\"\"><b>خطوة شجاعة:<\/b> ينفذ خطوة واحدة من قراره خلال ثمان وأربعين ساعة.<\/p><p class=\"\"><b>جسر إلى اللقاء الثالث والعشرين:<\/b> ومن أعظم ما تواجهه في العمل أن يتعارض الإتقان مع الراحة، والأمانة مع الغش. وهذا موضوع «أخلاقيات المهن والعمل».<\/p><\/section>", "slides": ["<div class=\"cn\">22<\/div><h2>حل المشكلات واتخاذ القرار<\/h2><p class=\"q\">كيف نحلل الأزمات ونتخذ قرارات حكيمة؟<\/p>", "<small>إضاءة استهلالية<\/small><h2>مالك ومعاذ والمصباح الأحمر<\/h2><ul><li class=\"frag\">ما «لمبة التحذير الحمراء» التي ألصقت عليها شريطاً أسود في حياتك؟ (درجات، علاقة، عادة)<\/li><li class=\"frag\">لماذا نهرب من جذر المشكلة مع أنه أرخص حلاً حين نبدأ مبكراً؟<\/li><\/ul>", "<small>1<\/small><h2>الحكمة في فحص الخيارات<\/h2><p class=\"g frag\">الحكمة تتجلى في البحث عن السبب الجذري للمشكلة بدلا من الاكتفاء بمعالجة أعراضها الظاهرة.<\/p>", "<small>2<\/small><h2>منهجية المفاضلة<\/h2><p class=\"ayah lg\">﴿فَبَشِّرْ عِبَادِ * الَّذِينَ يَسْتَمِعُونَ الْقَوْلَ فَيَتَّبِعُونَ أَحْسَنَهُ ۚ أُولَٰئِكَ الَّذِينَ هَدَاهُمُ اللَّهُ ۖ وَأُولَٰئِكَ هُمْ أُولُو الْأَلْبَابِ﴾ [الزمر: 17-18]<\/p><p class=\"g frag\">توليد البدائل المتعددة واختيار الأرجح مصلحة هو المنهج القرآني في القرار.<\/p>", "<small>3<\/small><h2>اليسر والواقعية<\/h2><p class=\"g frag\">إثما» (متفق عليه) القرارات المعقدة والمثالية الزائدة تؤدي إلى شلل التنفيذ.<\/p>", "<small>4<\/small><h2>الجمع بين الشورى والاستخارة<\/h2><p class=\"ayah\">﴿وَشَاوِرْهُمْ فِي الْأَمْرِ ۖ فَإِذَا عَزَمْتَ فَتَوَكَّلْ عَلَى اللَّهِ ۚ إِنَّ اللَّهَ يُحِبُّ الْمُتَوَكِّلِينَ﴾ [آل عمران: 159]<\/p><p class=\"g frag\">القرار الحكيم يبدأ بجمع المعلومات ثم الحسم والتوكل.<\/p>", "<small>سؤال للحوار<\/small><h2 class=\"big\">كيف نفرق بين سبب المشكلة وع رضها؟<\/h2>", "<small>نشاط تطبيقي<\/small><h2 class=\"big\">طبق «لماذا × »٥على مشكلة حقيقية واقترح ثلاثة بدائل.<\/h2>", "<small>سؤال وبرهان<\/small><details class=\"frag\"><summary><b>ماذا لو اتخذت قراراً وتبين لاحقاً أنه خاطئ وندمت؟<\/b><\/summary><p>اتخاذ قرار مبني على الاستشارة والتحليل ثم الخطأ فيه جزء أصيل من نضج الإنسان. والخطأ مادة للتعلم، والتردد والهروب المستمر أسوأ من قرار يحتاج إلى تصويب.<\/p><\/details><details class=\"frag\"><summary><b>هل الاستخارة تغني عن التفكير التحليلي واستشارة الخبراء؟<\/b><\/summary><p>الاستخارة والشورى متلازمتان. شرع الله استشارة العقلاء ودراسة البدائل أولاً، ثم صلاة الاستخارة تفويضاً للأمر إلى الله. ولا تعارض بين الشرع والعقل.<\/p><\/details><details class=\"frag\"><summary><b>كيف أتصرف إذا واجهت مشكلة أجهل كيف أحلها؟<\/b><\/summary><p>أول قواعد الحكمة الاعتراف بالجهل وسؤال أهل الخبرة: ﴿فَاسْأَلُوا أَهْلَ الذِّكْرِ إِن كُنتُمْ لَا تَعْلَمُونَ﴾. والرجولة تقتضي طلب العون لا التخبط والمكابرة.<\/p><\/details>", "<small>ميدان التطبيق<\/small><h2>«عيادة الأزمات ومصفوفة اتخاذ القرار»  نشاط تحليلي<\/h2><ol><li class=\"frag\">1. التشخيص: يكتب كل طالب مشكلة حقيقية تؤرقه (ضعف دراسي، تسويف، خلاف) دون ذكر أسماء.<\/li><li class=\"frag\">2. حفر الجذور: يطبق أسئلة «لماذا الخمس» حتى يصل إلى السبب الجوهري.<\/li><li class=\"frag\">3. توليد البدائل: يكتب ثلاثة حلول: مألوف، وذكي قليل التكلفة، وجذري شجاع.<\/li><li class=\"frag\">4. المفاضلة: يقيّم كل حل بدرجة من عشرة (المكاسب مطروحاً منها الأضرار) ويكتب قراره النهائي للبدء خلال أربع وعشرين ساعة.<\/li><li class=\"frag\">5. دراسة حالة: حسام (17 سنة) في الصف الأخير بالثانوية.<\/li><li class=\"frag\">6. الاعتراض: أحد الطلاب يدافع عن «الأفضل أن أترك الأمور تسير وحدها»، وتناقشه المجموعات.<\/li><\/ol>", "<small>رحلة الأسبوع<\/small><ul><li class=\"frag\"><b>مشكلة واحدة:<\/b> يطبق الطالب «لماذا الخمس» على مشكلة حقيقية ويدوّن النتيجة.<\/li><li class=\"frag\"><b>استشارة حكيمة:<\/b> يستشير شخصاً عاقلاً موثوقاً في قرار يواجهه.<\/li><li class=\"frag\"><b>خطوة شجاعة:<\/b> ينفذ خطوة واحدة من قراره خلال ثمان وأربعين ساعة.<\/li><li class=\"frag\"><b>جسر إلى اللقاء الثالث والعشرين:<\/b> ومن أعظم ما تواجهه في العمل أن يتعارض الإتقان مع الراحة، والأمانة مع الغش. وهذا موضوع «أخلاقيات المهن والعمل».<\/li><\/ul>"], "n": 22, "u": 4, "title": "حل المشكلات واتخاذ القرار", "q": "كيف نحلل الأزمات ونتخذ قرارات حكيمة؟", "dqq": "كيف نفرق بين سبب المشكلة وع رضها؟", "pact": "طبق «لماذا × »٥على مشكلة حقيقية واقترح ثلاثة بدائل."}, {"summary": "<p class=\"\">سمعة الإنسان المهنية لا تبدأ في أول وظيفة، بل تبدأ من مقاعد الدراسة: في واجب يُكتب بأمانة، وموعد يُحترم، ومشروع يُسلَّم بإتقان. يتعلم الفتى في هذا اللقاء أن الإتقان عبادة تُحب عند الله، وأن الأمانة لا تتجزأ ولو ظُلم صاحبها، وأن «الحد الأدنى» ثقافة فقيرة تقابلها ثقافة «القيمة المضافة» التي تبني الاسم والأثر. ويتدرب على اختيار الطريق النظيف حين يُعرض عليه الغش في لحظة ضعف.<\/p><p class=\"\">يفهم أن الجمع بين القوة (الكفاءة) والأمانة هو معيار الجاهزية في القرآن.<\/p><p class=\"\">يتعلم أن الغش والتسويف في الدراسة تدريب على الخيانة في العمل.<\/p><p class=\"\">يطبق مفهوم القيمة المضافة في عمل دراسي حقيقي.<\/p><div class=\"tw\"><table><tr><th><b>المهارة<\/b><\/th><th><b>معناها العملي<\/b><\/th><\/tr><tr><td><b>الإتقان والجودة<\/b><\/td><td>يسلّم عملاً دقيقاً في موعده ويراجعه قبل التسليم<\/td><\/tr><tr><td><b>الأمانة المهنية<\/b><\/td><td>لا ينتحل جهد غيره ولا يخفي عيباً ولا يخلف وعداً<\/td><\/tr><tr><td><b>صناعة القيمة المضافة<\/b><\/td><td>يقدم فوق المطلوب مما ينفع الناس ويبني سمعته<\/td><\/tr><\/table><\/div>", "kit": "<p class=\"\"><b>ما يعيشه الفتى:<\/b> يرى الفتى حوله من ينجح بالغش أو الواسطة أو الأعذار الكاذبة، فيشك أن الأمانة تنفع. وقد يعمل أول عمل (تصميم، تدريس، ترجمة) بأجر صغير فيرى أن الإتقان لا يستحق العناء.<\/p><p class=\"\"><b>اربط الدراسة بالعمل:<\/b> أرِ الطلاب أن عاداتهم اليوم في الواجبات والمواعيد هي نفسها التي ستصنع سمعتهم المهنية.<\/p><p class=\"\"><b>لا تجعل الأمانة شعاراً:<\/b> اسأل: ماذا تفعل لو عُرض عليك مشروع جاهز تتسلمه بلا تعب؟<\/p><p class=\"\"><b>اعترف بالظلم الواقعي:<\/b> قد يستغل صاحب عمل عاملاً، وقد يربح مخادع، لكن العاقبة بيد الله، ولا يبرر ذلك الخيانة.<\/p><p class=\"\"><b>شجّع من يعمل بيده:<\/b> اجعل من يعمل بجد في أي مهنة محل احترام في المجلس.<\/p>", "hookT": "المبرمجان وصاحب المتجر", "hook": "<p class=\"\">أراد تاجر تصميم متجر إلكتروني لمشروعه، فوظّف مبرمجين شابين بعقد قيمته ألف دولار لكل منهما. <b>الشاب (أ)<\/b> ذكي لكنه يفتقد الأمانة والجدية: تأخر أسبوعين وهو يقدم أعذاراً كاذبة، وسلّم متجراً مليئاً بالأعطال، وقال ببرود: «على قدر نقودكم أعمل». فحظره التاجر وحذّر التجار منه، وتدمرت سمعته. أما <b>الشاب (ب)<\/b> فكان متقناً أميناً: سلّم المتجر قبل الموعد بيومين بتصميم متقن، وزاد عليه دليلاً مصوراً مجانياً يشرح للتاجر كيف يضاعف مبيعاته. فانبهر التاجر ودفع له مكافأة ورشحه لعشرة من كبار التجار، فصار اسمه علامة وتدفقت عليه المشاريع.<\/p><p class=\"\"><b>أسئلة الاستثارة:<\/b><\/p><p class=\"\">ما الفرق بين الشابين في الأجر الأول؟ وما الفرق بينهما بعد سنة؟<\/p><p class=\"\">أي الشابين تشبه في واجباتك المدرسية؟<\/p>", "pts": "<article class=\"pt\"><h4><span>أولاً<\/span>القوي الأمين<\/h4><p class=\"ayah\">﴿قَالَتْ إِحْدَاهُمَا يَا أَبَتِ اسْتَأْجِرْهُ ۖ إِنَّ خَيْرَ مَنِ اسْتَأْجَرْتَ الْقَوِيُّ الْأَمِينُ﴾ [القصص: 26]<\/p><p class=\"\">هذه الآية هي معيار الجاهزية لسوق العمل: «القوي» أي الكفؤ جسدياً ومهارياً وعقلياً، و«الأمين» أي صاحب النزاهة والضمير الحي والصدق. والجمع بين الصفتين نادر وثمين، فالقوي بلا أمانة خطر، والأمين بلا كفاءة عاجز. ومن أراد أن يكون «خير من يُستأجر» فليجمعهما.<\/p><\/article><article class=\"pt\"><h4><span>ثانياً<\/span>الإحسان محفوظ الأجر<\/h4><p class=\"ayah\">﴿إِنَّا لَا نُضِيعُ أَجْرَ مَنْ أَحْسَنَ عَمَلًا﴾ [الكهف: 30]<\/p><p class=\"\">الإحسان والجودة والإتقان محفوظة الأجر بعهد الله، نماءً وذكراً في الدنيا وثواباً في الآخرة. فالفتى الذي يتقن عمله لا يضيع جهده ولو لم يلاحظه أحد في لحظته. وقال تعالى: ﴿وَأَوْفُوا بِالْعَهْدِ ۖ إِنَّ الْعَهْدَ كَانَ مَسْئُولًا﴾ [الإسراء: 34]، فتسليم العمل في موعده وفاء بعهد يُسأل عنه.<\/p><\/article><article class=\"pt\"><h4><span>ثالثاً<\/span>الإتقان عبادة<\/h4><p class=\"had\">قال رسول الله ﷺ: «إِنَّ اللَّهَ يُحِبُّ إِذَا عَمِلَ أَحَدُكُمْ عَمَلاً أَنْ يُتْقِنَهُ» رواه البيهقي. فالإتقان ينال به العبد محبة الله قبل أن ينال رضا مديره. وهذا يغير نظرة الفتى إلى العمل: من عبء يريد التخلص منه إلى عبادة يتقرب بها، فيجد فيها متعة ومعنى حتى لو كان الأجر قليلاً.<\/p><\/article><article class=\"pt\"><h4><span>رابعاً<\/span>شرف الكسب الطيب<\/h4><p class=\"\">سُئل النبي ﷺ: أَيُّ الكَسْبِ أَطْيَبُ؟ قَالَ: «عَمَلُ الرَّجُلِ بِيَدِهِ، وَكُلُّ بَيْعٍ مَبْرُورٍ» رواه أحمد. وقال ﷺ: «مَا أَكَلَ أَحَدٌ طَعَامًا قَطُّ خَيْرًا مِنْ أَنْ يَأْكُلَ مِنْ عَمَلِ يَدِهِ» رواه البخاري. فالإنتاج والكسب الخالي من الخيانة والغش شرف، ولا يُنقص من قدر الفتى أن يعمل بيده أو يبدأ بعمل صغير. والبيع المبرور هو الصادق الخالي من الغش.<\/p><\/article><article class=\"pt\"><h4><span>خامساً<\/span>الصدق والبيان في التعامل<\/h4><p class=\"had\">قال رسول الله ﷺ: «الْبَيِّعَانِ بِالْخِيَارِ مَا لَمْ يَتَفَرَّقَا، فَإِنْ صَدَقَا وَبَيَّنَا بُورِكَ لَهُمَا فِي بَيْعِهِمَا، وَإِنْ كَتَمَا وَكَذَبَا مُحِقَتْ بَرَكَةُ بَيْعِهِمَا» متفق عليه. وفي الحديث شرطان لبركة العمل: الصدق، وبيان العيوب. فمن أخفى عيباً أو مرّر خطأ خلسة محق الله بركة عمله. وقال ﷺ: «التَّاجِرُ الصَّدُوقُ الأَمِينُ مَعَ النَّبِيِّينَ وَالصِّدِّيقِينَ وَالشُّهَدَاءِ» رواه الترمذي. وقال: «مَنْ غَشَّنَا فَلَيْسَ مِنَّا» رواه مسلم.<\/p><\/article><article class=\"pt\"><h4><span>سادساً<\/span>الأمانة لا تتجزأ<\/h4><p class=\"had\">قال رسول الله ﷺ: «أَدِّ الأَمَانَةَ إِلَى مَنِ ائْتَمَنَكَ، وَلاَ تَخُنْ مَنْ خَانَكَ» رواه أبو داود والترمذي. فإذا قبلت العقد وجب عليك أداء العمل بإتقان، وإن شعرت أن الأجر ظالم فالطريق أن تطالب بحقك أو تترك العمل، لا أن تقابل الظلم بالخيانة. فالمسلم لا يرد على غيره بما يخالف دينه.<\/p><\/article><article class=\"pt\"><h4><span>سابعاً<\/span>تجارة النبي ﷺ قبل البعثة<\/h4><p class=\"\">تروي كتب السيرة أن النبي ﷺ قبل البعثة خرج بمال خديجة رضي الله عنها إلى الشام، ومعه غلامها ميسرة، فكان مثالاً فريداً في الأمانة والإتقان والوفاء بالمواعيد والوضوح التام في المكاسب دون إخفاء عيب. فرجعت التجارة بأرباح كبيرة، وتحدث ميسرة بما رأى من أخلاقه. فأخلاق العمل بنت السمعة التي سبقته إلى الناس، وعُرف قبل الوحي بالصادق الأمين.<\/p><\/article><article class=\"pt\"><h4><span>ثامناً<\/span>الحد الأدنى مقابل القيمة المضافة<\/h4><div class=\"tw\"><table><tr><th><b>الأداء الشكلي (الحد الأدنى والمطل)<\/b><\/th><th><b>الأمانة والإتقان (صناعة القيمة)<\/b><\/th><\/tr><tr><td><b>«على قدر نقودهم أعمل» والتفلت السريع<\/b><\/td><td>العمل عبادة يُتقرب بها إلى الله<\/td><\/tr><tr><td><b>التسويف والمطل والتأخر عن التسليم<\/b><\/td><td>الالتزام الصارم بالمواعيد والدقة<\/td><\/tr><tr><td><b>إخفاء العيوب وتمرير الأخطاء خلسة<\/b><\/td><td>الشفافية والصراحة وتقديم قيمة إضافية<\/td><\/tr><tr><td><b>رؤية العمل عبئاً يراد التخلص منه<\/b><\/td><td>رؤية العمل رسالة تبني السمعة والأثر<\/td><\/tr><\/table><\/div><\/article><article class=\"pt\"><h4><span>تاسعاً<\/span>السمعة المهنية تبدأ من مقاعد الدراسة<\/h4><p class=\"\">الفتى الذي يغش في واجبه، أو يخلف موعده مع أستاذه ووالده، يدرّب نفسه على الخيانة، وينقل العادة ذاتها إلى وظيفته ومستقبله. فالمواقف الصغيرة اليوم هي مختبر السمعة المهنية غداً. وفي المقابل، الفتى الذي يتقن ملخصه الدراسي ويقدمه منظماً ويضيف إليه ما ينفع زملاءه يبني عقلية التميز والقيادة.<\/p><\/article>", "qa": "<div class=\"tw\"><table><tr><th><b>السؤال المتوقع<\/b><\/th><th><b>تفكيكه<\/b><\/th><\/tr><tr><td><b>إذا كان صاحب العمل يستغلني ويعطيني أجراً بخساً، أليس من حقي التكاسل؟<\/b><\/td><td>الأمانة لا تتجزأ. إذا قبلت العقد وجب عليك أداء العمل بإتقان: «أدِّ الأمانة إلى من ائتمنك ولا تخن من خانك». وإذا كان الأجر ظالماً فطالب بحقك بالأسلوب المشروع أو اتركه.<\/td><\/tr><tr><td><b>هل يضر أخذ أفكار من مشاريع أخرى على الإنترنت وتقديمها باسمي؟<\/b><\/td><td>هذا سرقة علمية وخيانة للأمانة. الاستفادة من تجارب الآخرين مطلوبة للبناء عليها مع نسبة الفضل لأصحابه. أما سرقتها وادعاؤها كذباً فتدليس يمحق بركة العلم.<\/td><\/tr><tr><td><b>كيف أطبق صناعة القيمة المضافة في دراستي اليومية؟<\/b><\/td><td>عندما يطلب منك المعلم ملخصاً، قدمه بخط واضح مع فهرس ورسوم توضيحية ومصادر إضافية تفيد زملاءك. هذا الإتقان الزائد ينمي فيك عقلية القيادة والتميز.<\/td><\/tr><\/table><\/div>", "radar": "<p class=\"\"><b>مؤشرات الخطر:<\/b> الغش في الواجبات، ونسخ أعمال الآخرين، والأعذار الكاذبة للتأخر، وإخفاء الأخطاء، وعبارة «المهم أن أنجو بأقل جهد»، أو الاستخفاف بمن يعمل بيده.<\/p><p class=\"\"><b>بروتوكول التدخل:<\/b><\/p><p class=\"step\"><b>1. <\/b>اسأله بهدوء عن سبب اللجوء إلى النسخ أو التأجيل: عجز؟ ضغط؟ تسويف؟<\/p><p class=\"step\"><b>2. <\/b>ساعده على خطة صغيرة لإنجاز العمل بجهده ولو متواضعاً، فالعمل المتواضع الصادق أفضل.<\/p><p class=\"step\"><b>3. <\/b>أعد معه معنى «القوي الأمين» وأعطه مهمة أمانة في المجموعة.<\/p>", "actT": "«مختبر الشركة وميثاق القوي الأمين»  نشاط محاكاة", "act": "<p class=\"step\"><b>1. التشكيل:<\/b> شركات مصغرة من ثلاثة طلاب، وتُكلَّف كل شركة بإنتاج ورقة ملخص لمادة علمية معقدة لزملائهم.<\/p><p class=\"step\"><b>2. المعايير الملزمة:<\/b> (القوة) دقة المحتوى العلمي وسلامة اللغة، و(الأمانة) عدم النسخ العشوائي وذكر المراجع، و(القيمة المضافة) إضافة خريطة ذهنية أو سؤال اختباري لم يُطلب منهم.<\/p><p class=\"step\"><b>3. التحكيم:<\/b> يفحص مدقق الأمانة والجودة (من الطلاب) المنتجات ويسلّم درع «القوي الأمين» للشركة المتقنة.<\/p><p class=\"step\"><b>4. دراسة حالة:<\/b> صهيب (17 سنة) انشغل بالألعاب والتسويف طوال الشهر، وقبل تسليم مشروع البرمجة بأربع وعشرين ساعة وجد نفسه عاجزاً. قال له صديقه: «عندي مشروع كامل أخذته من موقع أجنبي، غيّر الاسم وسلّمه وسيعطيك المعلم الدرجة كاملة». تردد صهيب: يريد المعدل المرتفع لكن ضميره يؤنبه. تحلل المجموعات: ما خياراته؟ وما عاقبة كل خيار على المدى القريب والبعيد؟<\/p><p class=\"step\"><b>5. الاعتراض:<\/b> أحد الطلاب يدافع عن «الجميع يغش، والعالم لا يكافئ الأمين»، وتناقشه المجموعات.<\/p><div class=\"tw\"><table><tr><th colspan=\"2\"><b>بطاقة: ميثاق القوي الأمين<\/b><\/th><\/tr><tr><td><b>1. القوة (الكفاءة)<\/b><\/td><td>المهارة التي سأتقنها هذا الشهر: ............................<\/td><\/tr><tr><td><b>2. الأمانة<\/b><\/td><td>موقف أغريتني فيه الخيانة أو الغش وكيف سأتصرف: ............................<\/td><\/tr><tr><td><b>3. القيمة المضافة<\/b><\/td><td>عمل سأزيد فيه فوق المطلوب: ............................<\/td><\/tr><tr><td><b>4. الميثاق<\/b><\/td><td>«أجمع بين القوة والأمانة، وأتقن عملي لله، ولا أبني اسمي على غش»<\/td><\/tr><\/table><\/div>", "week": "<p class=\"\"><b>واجب بإتقان:<\/b> يسلّم الطالب هذا الأسبوع عملاً دراسياً واحداً بإتقان زائد في موعده.<\/p><p class=\"\"><b>عزو الفضل:<\/b> يذكر مصدر كل معلومة يستفيد منها في أي عمل يقدمه.<\/p><p class=\"\"><b>الوعد بالوفاء:<\/b> يلتزم بموعد واحد مع شخص ما ولا يخلفه.<\/p><p class=\"\"><b>جسر إلى اللقاء الرابع والعشرين:<\/b> وإذا بنينا القوة والأمانة سألنا: أين نضع طاقاتنا؟ وهذا موضوع «التوجيه المهني والمستقبلي».<\/p>", "kq": "الأمانة والإتقان وصناعة القيمة وبناء السمعة في بيئات العمل", "brief": "<div class=\"plan\"><span>اقتراح لتوزيع الوقت (١٠–١٥ د)<\/span><b>افتتاح ٣<\/b><b>محاور ٥<\/b><b>حوار ٢<\/b><b>نشاط ٣<\/b><b>ختام ٢<\/b><\/div><section class=\"bs\"><h3>١ · الافتتاح: المبرمجان وصاحب المتجر<\/h3><p class=\"\">أراد تاجر تصميم متجر إلكتروني لمشروعه، فوظّف مبرمجين شابين بعقد قيمته ألف دولار لكل منهما. <b>الشاب (أ)<\/b> ذكي لكنه يفتقد الأمانة والجدية: تأخر أسبوعين وهو يقدم أعذاراً كاذبة، وسلّم متجراً مليئاً بالأعطال، وقال ببرود: «على قدر نقودكم أعمل». فحظره التاجر وحذّر التجار منه، وتدمرت سمعته. أما <b>الشاب (ب)<\/b> فكان متقناً أميناً: سلّم المتجر قبل الموعد بيومين بتصميم متقن، وزاد عليه دليلاً مصوراً مجانياً يشرح للتاجر كيف يضاعف مبيعاته. فانبهر التاجر ودفع له مكافأة ورشحه لعشرة من كبار التجار، فصار اسمه علامة وتدفقت عليه المشاريع.<\/p><p class=\"\"><b>أسئلة الاستثارة:<\/b><\/p><p class=\"\">ما الفرق بين الشابين في الأجر الأول؟ وما الفرق بينهما بعد سنة؟<\/p><p class=\"\">أي الشابين تشبه في واجباتك المدرسية؟<\/p><\/section><section class=\"bs\"><h3>٢ · المحاور<\/h3><article class=\"pt\"><h4><span>١<\/span>القوي الأمين<\/h4><p class=\"ayah\">﴿قَالَتْ إِحْدَاهُمَا يَا أَبَتِ اسْتَأْجِرْهُ ۖ إِنَّ خَيْرَ مَنِ اسْتَأْجَرْتَ الْقَوِيُّ الْأَمِينُ﴾ [القصص: 26]<\/p><p class=\"g\">الكفاءة (القوة) بدون نزاهة (أمانة) خطر، والجمع بينهما هو معيار الجاهزية لسوق العمل.<\/p><details class=\"more\"><summary>للتوسع<\/summary><p class=\"\">هذه الآية هي معيار الجاهزية لسوق العمل: «القوي» أي الكفؤ جسدياً ومهارياً وعقلياً، و«الأمين» أي صاحب النزاهة والضمير الحي والصدق. والجمع بين الصفتين نادر وثمين، فالقوي بلا أمانة خطر، والأمين بلا كفاءة عاجز. ومن أراد أن يكون «خير من يُستأجر» فليجمعهما.<\/p><\/details><\/article><article class=\"pt\"><h4><span>٢<\/span>الإحسان محفوظ الأجر<\/h4><p class=\"ayah\">﴿إِنَّا لَا نُضِيعُ أَجْرَ مَنْ أَحْسَنَ عَمَلًا﴾ [الكهف: 30]<\/p><p class=\"g\">تقديم «قيمة مضافة» في العمل يرفع من قدرك ويبني سمعتك على المدى الطويل.<\/p><details class=\"more\"><summary>للتوسع<\/summary><p class=\"\">الإحسان والجودة والإتقان محفوظة الأجر بعهد الله، نماءً وذكراً في الدنيا وثواباً في الآخرة. فالفتى الذي يتقن عمله لا يضيع جهده ولو لم يلاحظه أحد في لحظته. وقال تعالى: ﴿وَأَوْفُوا بِالْعَهْدِ ۖ إِنَّ الْعَهْدَ كَانَ مَسْئُولًا﴾ [الإسراء: 34]، فتسليم العمل في موعده وفاء بعهد يُسأل عنه.<\/p><\/details><\/article><article class=\"pt\"><h4><span>٣<\/span>الأمانة لا تتجزأ<\/h4><p class=\"had\">قال رسول الله ﷺ: «أَدِّ الأَمَانَةَ إِلَى مَنِ ائْتَمَنَكَ، وَلاَ تَخُنْ مَنْ خَانَكَ» رواه أبو داود والترمذي. فإذا قبلت العقد وجب عليك أداء العمل بإتقان، وإن شعرت أن الأجر ظالم فالطريق أن تطالب بحقك أو تترك العمل، لا أن تقابل الظلم بالخيانة. فالمسلم لا يرد على غيره بما يخالف دينه.<\/p><p class=\"g\">داود) الغش الدراسي أو التبرير بضعف المردود هو تدريب مبكر على خيانة الأمانة.<\/p><details class=\"more\"><summary>للتوسع<\/summary><\/details><\/article><article class=\"pt\"><h4><span>٤<\/span>الصدق والبيان يصنعان البركة<\/h4><p class=\"had\">قال رسول الله ﷺ: «الْبَيِّعَانِ بِالْخِيَارِ مَا لَمْ يَتَفَرَّقَا، فَإِنْ صَدَقَا وَبَيَّنَا بُورِكَ لَهُمَا فِي بَيْعِهِمَا، وَإِنْ كَتَمَا وَكَذَبَا مُحِقَتْ بَرَكَةُ بَيْعِهِمَا» متفق عليه. وفي الحديث شرطان لبركة العمل: الصدق، وبيان العيوب. فمن أخفى عيباً أو مرّر خطأ خلسة محق الله بركة عمله. وقال ﷺ: «التَّاجِرُ الصَّدُوقُ الأَمِينُ مَعَ النَّبِيِّينَ وَالصِّدِّيقِينَ وَالشُّهَدَاءِ» رواه الترمذي. وقال: «مَنْ غَشَّنَا فَلَيْسَ مِنَّا» رواه مسلم.<\/p><p class=\"g\">وبنا بورك لهما» (متفق عليه) إخفاء العيوب والتدليس يمحق بركة العمل والأجر.<\/p><details class=\"more\"><summary>للتوسع<\/summary><\/details><\/article><\/section><section class=\"bs\"><h3>٣ · سؤال للحوار<\/h3><p class=\"big\">هل الغش الدراسي «حيلة» أم خيانة أمانة؟<\/p><\/section><section class=\"bs\"><h3>٤ · نشاط تطبيقي<\/h3><p class=\"big\">اكتب سيرتك المهنية بعد عشر سنوات، وقيم صفاتها.<\/p><\/section><section class=\"bs\"><h3>أسئلة قد تُطرح<\/h3><details class=\"more\"><summary><b>إذا كان صاحب العمل يستغلني ويعطيني أجراً بخساً، أليس من حقي التكاسل؟<\/b><\/summary><p>الأمانة لا تتجزأ. إذا قبلت العقد وجب عليك أداء العمل بإتقان: «أدِّ الأمانة إلى من ائتمنك ولا تخن من خانك». وإذا كان الأجر ظالماً فطالب بحقك بالأسلوب المشروع أو اتركه.<\/p><\/details><details class=\"more\"><summary><b>هل يضر أخذ أفكار من مشاريع أخرى على الإنترنت وتقديمها باسمي؟<\/b><\/summary><p>هذا سرقة علمية وخيانة للأمانة. الاستفادة من تجارب الآخرين مطلوبة للبناء عليها مع نسبة الفضل لأصحابه. أما سرقتها وادعاؤها كذباً فتدليس يمحق بركة العلم.<\/p><\/details><\/section><section class=\"bs warn\"><h3>رادار الحماية<\/h3><p><b>مؤشرات الخطر:<\/b> الغش في الواجبات، ونسخ أعمال الآخرين، والأعذار الكاذبة للتأخر، وإخفاء الأخطاء، وعبارة «المهم أن أنجو بأقل جهد»، أو الاستخفاف بمن يعمل بيده.<\/p><small>البروتوكول كاملاً في تبويب «الكامل».<\/small><\/section><section class=\"bs\"><h3>٥ · رحلة الأسبوع<\/h3><p class=\"\"><b>واجب بإتقان:<\/b> يسلّم الطالب هذا الأسبوع عملاً دراسياً واحداً بإتقان زائد في موعده.<\/p><p class=\"\"><b>عزو الفضل:<\/b> يذكر مصدر كل معلومة يستفيد منها في أي عمل يقدمه.<\/p><p class=\"\"><b>الوعد بالوفاء:<\/b> يلتزم بموعد واحد مع شخص ما ولا يخلفه.<\/p><p class=\"\"><b>جسر إلى اللقاء الرابع والعشرين:<\/b> وإذا بنينا القوة والأمانة سألنا: أين نضع طاقاتنا؟ وهذا موضوع «التوجيه المهني والمستقبلي».<\/p><\/section>", "slides": ["<div class=\"cn\">23<\/div><h2>أخلاقيات المهن والعمل<\/h2><p class=\"q\">كيف نبني سمعتنا المهنية من مقاعد الدراسة؟<\/p>", "<small>إضاءة استهلالية<\/small><h2>المبرمجان وصاحب المتجر<\/h2><ul><li class=\"frag\">ما الفرق بين الشابين في الأجر الأول؟ وما الفرق بينهما بعد سنة؟<\/li><li class=\"frag\">أي الشابين تشبه في واجباتك المدرسية؟<\/li><\/ul>", "<small>1<\/small><h2>القوي الأمين<\/h2><p class=\"ayah\">﴿قَالَتْ إِحْدَاهُمَا يَا أَبَتِ اسْتَأْجِرْهُ ۖ إِنَّ خَيْرَ مَنِ اسْتَأْجَرْتَ الْقَوِيُّ الْأَمِينُ﴾ [القصص: 26]<\/p><p class=\"g frag\">الكفاءة (القوة) بدون نزاهة (أمانة) خطر، والجمع بينهما هو معيار الجاهزية لسوق العمل.<\/p>", "<small>2<\/small><h2>الإحسان محفوظ الأجر<\/h2><p class=\"ayah\">﴿إِنَّا لَا نُضِيعُ أَجْرَ مَنْ أَحْسَنَ عَمَلًا﴾ [الكهف: 30]<\/p><p class=\"g frag\">تقديم «قيمة مضافة» في العمل يرفع من قدرك ويبني سمعتك على المدى الطويل.<\/p>", "<small>3<\/small><h2>الأمانة لا تتجزأ<\/h2><p class=\"had lg\">قال رسول الله ﷺ: «أَدِّ الأَمَانَةَ إِلَى مَنِ ائْتَمَنَكَ، وَلاَ تَخُنْ مَنْ خَانَكَ» رواه أبو داود والترمذي. فإذا قبلت العقد وجب عليك أداء العمل بإتقان، وإن شعرت أن الأجر ظالم فالطريق أن تطالب بحقك أو تترك العمل، لا أن تقابل الظلم بالخيانة. فالمسلم لا يرد على غيره بما يخالف دينه.<\/p><p class=\"g frag\">داود) الغش الدراسي أو التبرير بضعف المردود هو تدريب مبكر على خيانة الأمانة.<\/p>", "<small>4<\/small><h2>الصدق والبيان يصنعان البركة<\/h2><p class=\"had lg\">قال رسول الله ﷺ: «الْبَيِّعَانِ بِالْخِيَارِ مَا لَمْ يَتَفَرَّقَا، فَإِنْ صَدَقَا وَبَيَّنَا بُورِكَ لَهُمَا فِي بَيْعِهِمَا، وَإِنْ كَتَمَا وَكَذَبَا مُحِقَتْ بَرَكَةُ بَيْعِهِمَا» متفق عليه. وفي الحديث شرطان لبركة العمل: الصدق، وبيان العيوب. فمن أخفى عيباً أو مرّر خطأ خلسة محق الله بركة عمله. وقال ﷺ: «التَّاجِرُ الصَّدُوقُ الأَمِينُ مَعَ النَّبِيِّينَ وَالصِّدِّيقِينَ وَالشُّهَدَاءِ» رواه الترمذي. وقال: «مَنْ غَشَّنَا فَلَيْسَ مِنَّا» رواه مسلم.<\/p><p class=\"g frag\">وبنا بورك لهما» (متفق عليه) إخفاء العيوب والتدليس يمحق بركة العمل والأجر.<\/p>", "<small>سؤال للحوار<\/small><h2 class=\"big\">هل الغش الدراسي «حيلة» أم خيانة أمانة؟<\/h2>", "<small>نشاط تطبيقي<\/small><h2 class=\"big\">اكتب سيرتك المهنية بعد عشر سنوات، وقيم صفاتها.<\/h2>", "<small>سؤال وبرهان<\/small><details class=\"frag\"><summary><b>إذا كان صاحب العمل يستغلني ويعطيني أجراً بخساً، أليس من حقي التكاسل؟<\/b><\/summary><p>الأمانة لا تتجزأ. إذا قبلت العقد وجب عليك أداء العمل بإتقان: «أدِّ الأمانة إلى من ائتمنك ولا تخن من خانك». وإذا كان الأجر ظالماً فطالب بحقك بالأسلوب المشروع أو اتركه.<\/p><\/details><details class=\"frag\"><summary><b>هل يضر أخذ أفكار من مشاريع أخرى على الإنترنت وتقديمها باسمي؟<\/b><\/summary><p>هذا سرقة علمية وخيانة للأمانة. الاستفادة من تجارب الآخرين مطلوبة للبناء عليها مع نسبة الفضل لأصحابه. أما سرقتها وادعاؤها كذباً فتدليس يمحق بركة العلم.<\/p><\/details><details class=\"frag\"><summary><b>كيف أطبق صناعة القيمة المضافة في دراستي اليومية؟<\/b><\/summary><p>عندما يطلب منك المعلم ملخصاً، قدمه بخط واضح مع فهرس ورسوم توضيحية ومصادر إضافية تفيد زملاءك. هذا الإتقان الزائد ينمي فيك عقلية القيادة والتميز.<\/p><\/details>", "<small>ميدان التطبيق<\/small><h2>«مختبر الشركة وميثاق القوي الأمين»  نشاط محاكاة<\/h2><ol><li class=\"frag\">1. التشكيل: شركات مصغرة من ثلاثة طلاب، وتُكلَّف كل شركة بإنتاج ورقة ملخص لمادة علمية معقدة لزملائهم.<\/li><li class=\"frag\">2. المعايير الملزمة: (القوة) دقة المحتوى العلمي وسلامة اللغة، و(الأمانة) عدم النسخ العشوائي وذكر المراجع، و(القيمة المضافة) إضافة خريطة ذهنية أو سؤال…<\/li><li class=\"frag\">3. التحكيم: يفحص مدقق الأمانة والجودة (من الطلاب) المنتجات ويسلّم درع «القوي الأمين» للشركة المتقنة.<\/li><li class=\"frag\">4. دراسة حالة: صهيب (17 سنة) انشغل بالألعاب والتسويف طوال الشهر، وقبل تسليم مشروع البرمجة بأربع وعشرين ساعة وجد نفسه عاجزاً.<\/li><li class=\"frag\">5. الاعتراض: أحد الطلاب يدافع عن «الجميع يغش، والعالم لا يكافئ الأمين»، وتناقشه المجموعات.<\/li><\/ol>", "<small>رحلة الأسبوع<\/small><ul><li class=\"frag\"><b>واجب بإتقان:<\/b> يسلّم الطالب هذا الأسبوع عملاً دراسياً واحداً بإتقان زائد في موعده.<\/li><li class=\"frag\"><b>عزو الفضل:<\/b> يذكر مصدر كل معلومة يستفيد منها في أي عمل يقدمه.<\/li><li class=\"frag\"><b>الوعد بالوفاء:<\/b> يلتزم بموعد واحد مع شخص ما ولا يخلفه.<\/li><li class=\"frag\"><b>جسر إلى اللقاء الرابع والعشرين:<\/b> وإذا بنينا القوة والأمانة سألنا: أين نضع طاقاتنا؟ وهذا موضوع «التوجيه المهني والمستقبلي».<\/li><\/ul>"], "n": 23, "u": 4, "title": "أخلاقيات المهن والعمل", "q": "كيف نبني سمعتنا المهنية من مقاعد الدراسة؟", "dqq": "هل الغش الدراسي «حيلة» أم خيانة أمانة؟", "pact": "اكتب سيرتك المهنية بعد عشر سنوات، وقيم صفاتها."}, {"summary": "<p class=\"\">في سنوات قليلة يتخذ الفتى أحد أكبر قرارات حياته: ماذا يدرس؟ وكثيراً ما يُتخذ هذا القرار بدافع المعدل أو لقب الكلية أو رغبة الأسرة، لا بدافع الاستعداد والرسالة. يتعلم الفتى في هذا اللقاء أن الله فطر الناس على استعدادات متنوعة، وأن النجاح أن يكتشف «شاكلته» وينميها في ثغر تحتاجه أمته. ويتعرف على «البوصلة المهنية» بدوائرها الأربع، ويتعلم كيف يحاور والديه بأدب ليقنعهم بخياره.<\/p><p class=\"\">يفهم أن لا كلية «قمة» وأخرى «قاع»، بل المتقن في تخصصه هو الأعلى.<\/p><p class=\"\">يربط قدراته وشغفه وحاجة الأمة ونيته في اختيار واحد.<\/p><p class=\"\">يتعلم أن الشغف يُكتشف بالتجربة لا بالانتظار.<\/p><div class=\"tw\"><table><tr><th><b>المهارة<\/b><\/th><th><b>معناها العملي<\/b><\/th><\/tr><tr><td><b>معرفة الذات المهنية<\/b><\/td><td>يرصد قدراته وميوله بصدق وبالتجربة<\/td><\/tr><tr><td><b>استكشاف المستقبل<\/b><\/td><td>يدرس التخصصات وحاجات الأمة وسوق العمل بواقعية<\/td><\/tr><tr><td><b>الحوار البار مع الأسرة<\/b><\/td><td>يعرض رأيه على والديه ببيانات وأدب ويكسب قلوبهم<\/td><\/tr><\/table><\/div>", "kit": "<p class=\"\"><b>ما يعيشه الفتى:<\/b> يحمل الفتى هم المعدل ورأي الأسرة وتوقعات الأقارب، ويخاف أن يختار خطأً فيندم. وقد يتأثر بإعلانات الجامعات أو بقصص النجاح المبهرة في وسائل التواصل، فيظن أن هناك طريقاً واحداً.<\/p><p class=\"\"><b>لا تفرض تخصصاً:<\/b> دورك أن توضح المنهج، والقرار للفتى مع أسرته، والاستشارة والاستخارة أمامه.<\/p><p class=\"\"><b>اعرض نماذج متنوعة:<\/b> رجل أعمال، وطبيب، ومبرمج، ومعلم، وحِرفي متقن، ليرى أن الرزق والأثر في كل مجال.<\/p><p class=\"\"><b>احذر الوعود الكبيرة:<\/b> لا تقل «اختر هذا وستغتني»، فسوق العمل يتغير، ولكن قل «اختر ما تتقنه وتحبه وتحتاجه الأمة».<\/p><p class=\"\"><b>راعِ ظروف الأسر:<\/b> بعض الطلاب لا يملكون خيارات واسعة، فاحترم ذلك وابحث معهم عن أقرب طريق للمهارة.<\/p>", "hookT": "وسيم ومالك", "hook": "<p class=\"\"><b>وسيم (25 سنة)<\/b> نال في الثانوية معدل 98%، وخضوعاً لرغبة أسرته في نيل لقب «والد الطبيب» دخل كلية الطب رغماً عن ميوله، فهو يكره جو المشافي ويعشق التقنية والبرمجيات. وهو اليوم طبيب متعثر تعيس يمارس مهنته بضيق، ويشعر أنه دفن سنوات من عمره في مكان لا يحبه. أما <b>مالك (25 سنة)<\/b> فحصل على معدل 85%، واختار بوعي وشغف تخصص الأمن السيبراني والذكاء الاصطناعي رغم اعتراض أقاربه. وهو اليوم يقود شركة أمن رقمي تحمي بيانات مؤسسات المسلمين، ويحقق دخلاً مباركاً، ويعيش في قمة الإنجاز والشغف.<\/p><p class=\"\"><b>أسئلة الاستثارة:<\/b><\/p><p class=\"\">من منهما يخدم أمته أكثر؟ ولماذا لم يضمن المعدل الأعلى سعادة وسيم؟<\/p><p class=\"\">من الذي يتخذ قراراً بحجم عمرك كله؟ أنت؟ أم من حولك؟<\/p>", "pts": "<article class=\"pt\"><h4><span>أولاً<\/span>لكل إنسان شاكلته<\/h4><p class=\"ayah\">﴿قُلْ كُلٌّ يَعْمَلُ عَلَىٰ شَاكِلَتِهِ فَرَبُّكُمْ أَعْلَمُ بِمَنْ هُوَ أَهْدَىٰ سَبِيلًا﴾ [الإسراء: 84]<\/p><p class=\"had\">«الشاكلة» الطريقة والتركيبة التي فطر الله عليها كل إنسان. وفي الآية تقرير للتنوع الفطري في الطاقات والاستعدادات. فالنجاح الحقيقي أن ينطلق الشاب من شاكلته وتركيبته، لا أن يلبس ثوباً لا يناسبه. وقال تعالى: ﴿لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا﴾ [البقرة: 286]، فلا يسوغ لفتى أن يحمل نفسه مساراً ينافي قدراته فيبوء بالإحباط والانقطاع.<\/p><\/article><article class=\"pt\"><h4><span>ثانياً<\/span>كل ميسَّر لما خُلق له<\/h4><p class=\"had\">قال رسول الله ﷺ: «اعْمَلُوا فَكُلٌّ مُيَسَّرٌ لِمَا خُلِقَ لَهُ» متفق عليه. وهذا توجيه نبوي خالد في التخصص: الله ركّب في كل إنسان ميولاً واستعدادات لثغر محدد، والتوفيق في البحث عما يسّره الله لك وتوظيفه في نفع الأمة. وليس معنى الحديث ترك الأخذ بالأسباب، بل السعي في معرفة ما تيسّر لك.<\/p><\/article><article class=\"pt\"><h4><span>ثالثاً<\/span>الحرص على النافع<\/h4><p class=\"had\">قال رسول الله ﷺ: «احْرِصْ عَلَى مَا يَنْفَعُكَ، وَاسْتَعِنْ بِاللَّهِ وَلاَ تَعْجَزْ» رواه مسلم. فاختيار التخصص مبادرة وحرص على ما يثمر نفعاً حقيقياً في الدين والدنيا، مع نبذ العجز والكسل والتأجيل، والاستعانة بالله في كل خطوة.<\/p><\/article><article class=\"pt\"><h4><span>رابعاً<\/span>تنوع الكفاءات في جيل الصحابة<\/h4><p class=\"\">لم يضع النبي ﷺ أصحابه في قالب مكرر، بل اكتشف موهبة كل واحد ووجّهه إلى ثغره. قال ﷺ: «أَرْحَمُ أُمَّتِي بِأُمَّتِي أَبُو بَكْرٍ، وَأَشَدُّهُمْ فِي أَمْرِ اللَّهِ عُمَرُ، وَأَصْدَقُهُمْ حَيَاءً عُثْمَانُ، وَأَقْضَاهُمْ عَلِيٌّ، وَأَقْرَؤُهُمْ لِكِتَابِ اللَّهِ أُبَيٌّ، وَأَعْلَمُهُمْ بِالْحَلاَلِ وَالْحَرَامِ مُعَاذُ بْنُ جَبَلٍ، وَأَفْرَضُهُمْ زَيْدُ بْنُ ثَابِتٍ» رواه الترمذي. فكل واحد منهم تميّز في مجال، والأمة محتاجة إلى جميعهم.<\/p><p class=\"\"><b>زيد بن ثابت:<\/b> استثمر النبي ﷺ سرعة حفظه وذكاءه، فأمره بتعلم السريانية، فصار كاتب الوحي وترجمان الرسالة.<\/p><p class=\"\"><b>خالد بن الوليد:<\/b> رأى النبي ﷺ عبقريته القتالية فسمّاه «سيف الله»، كما في البخاري.<\/p><p class=\"\"><b>حسان بن ثابت:<\/b> وجد النبي ﷺ فيه الموهبة الشعرية، فقال له: «اهْجُهُمْ وَجِبْرِيلُ مَعَكَ» رواه البخاري، وجعل له موضعاً في المسجد ينافح عن الإسلام.<\/p><\/article><article class=\"pt\"><h4><span>خامساً<\/span>البوصلة المهنية الرباعية<\/h4><div class=\"tw\"><table><tr><th><b>الدائرة<\/b><\/th><th><b>السؤال<\/b><\/th><th><b>كيف تكتشفها<\/b><\/th><\/tr><tr><td><b>القدرات<\/b><\/td><td>ماذا أتقن؟<\/td><td>المهارات التي تبرع فيها ويسهل عليك تعلمها<\/td><\/tr><tr><td><b>الشغف<\/b><\/td><td>ماذا أحب؟<\/td><td>مجالات تستمتع بالعمل فيها لساعات دون ملل<\/td><\/tr><tr><td><b>حاجة الأمة والسوق<\/b><\/td><td>ماذا يحتاج الواقع؟<\/td><td>التخصصات والثغور المطلوبة الآن ومستقبلاً<\/td><\/tr><tr><td><b>الأثر والرسالة<\/b><\/td><td>أين الأجر؟<\/td><td>النية الرسالية لنفع المسلمين وعمارة الأرض<\/td><\/tr><\/table><\/div><p class=\"\">والثغر المهني الأنسب هو نقطة الالتقاء بين هذه الدوائر الأربع: قدرة تملكها، وشغف تحبه، وحاجة يحتاجها الواقع، ونية تجعله عبادة.<\/p><\/article><article class=\"pt\"><h4><span>سادساً<\/span>أوهام «كليات القمة»<\/h4><p class=\"\">لا توجد في الحقيقة كلية قمة وكلية قاع. القمة أن تكون استثنائياً متقناً في تخصصك أياً كان، والمتميز في الإعلام أو التقنية أو التعليم أو الحرف يخدم أمته أكثر من طبيب متعثر أو مهندس متكلف. والمعدل مفتاح باب، لا حكم على الرسالة. وقال ﷺ: «الْمُؤْمِنُ الْقَوِيُّ خَيْرٌ وَأَحَبُّ إِلَى اللَّهِ مِنَ الْمُؤْمِنِ الضَّعِيفِ» رواه مسلم، والقوة هنا تشمل الإتقان في المجال الذي اخترته.<\/p><\/article><article class=\"pt\"><h4><span>سابعاً<\/span>الشغف يُكتشف بالتجربة<\/h4><p class=\"\">الشغف لا يهبط على الفتى وهو نائم، بل يُكتشف بالتجربة والاحتكاك الميداني: يقرأ، ويجرب دورة في البرمجة، ثم في اللغات، ثم في الإسعافات أو التصميم، ويقابل أهل مهنة، فيرى ما تميل إليه نفسه وما تبرع فيه. وقد قال تعالى: ﴿وَقُل رَّبِّ زِدْنِي عِلْمًا﴾ [طه: 114]، فطلب العلم المتنوع يوسّع الخيارات.<\/p><\/article><article class=\"pt\"><h4><span>ثامناً<\/span>الاستشارة والاستخارة<\/h4><p class=\"\">في قرار مصيري كهذا يجمع الفتى بين الأخذ بالأسباب والاستشارة والاستخارة: يجمع المعلومات، ويستشير أهل الخبرة وأهله، ثم يصلي الاستخارة ويتوكل. قال تعالى: ﴿وَشَاوِرْهُمْ فِي الْأَمْرِ فَإِذَا عَزَمْتَ فَتَوَكَّلْ عَلَى اللَّهِ﴾ [آل عمران: 159]. ولا تعارض بين الاستخارة والتخطيط، فالأولى تفويض للأمر والثانية بذل للأسباب.<\/p><\/article><article class=\"pt\"><h4><span>تاسعاً<\/span>الحوار البار مع الأسرة<\/h4><p class=\"\">رأي الوالدين مهم، وبرهما فريضة، لكن اختلاف الرأي في التخصص لا يعني العقوق ما دام الفتى يبرهما ويحاورهما. قال تعالى: ﴿فَلَا تَقُل لَّهُمَا أُفٍّ وَلَا تَنْهَرْهُمَا وَقُل لَّهُمَا قَوْلًا كَرِيمًا﴾ [الإسراء: 23]. والذكاء أن يكسب الفتى قلب أبيه بالحوار والبيانات: يعد عرضاً عن مجالات عمل تخصصه وأسواقه ومستقبله، ويستعين بشخص يحترمه الوالد ليشرح له بأدب ووقار، دون صدام ولا رفع صوت.<\/p><\/article>", "qa": "<div class=\"tw\"><table><tr><th><b>السؤال المتوقع<\/b><\/th><th><b>تفكيكه<\/b><\/th><\/tr><tr><td><b>أنا لا أعرف شغفي وميولي حتى الآن، فكيف أختار؟<\/b><\/td><td>الشغف يُكتشف بالتجربة والاحتكاك الميداني. اقرأ وجرّب دورات في البرمجة واللغات والإسعافات والتصميم، وقابل أهل المهن، ومن خلال التجربة ستعرف ما تميل إليه نفسك وما تتقنه.<\/td><\/tr><tr><td><b>أبي يصر على تخصص معين ويرفض تخصصي الذي أحبه، فهل مخالفته عقوق؟<\/b><\/td><td>ليست عقوقاً ما دمت تبره وتحاوره. والذكاء أن تكسب قلبه بالحوار والبيانات: اعرض عليه مجالات العمل ومستقبل تخصصك، واستعن بمن يحترمه ليشرح له بأدب، دون صدام.<\/td><\/tr><tr><td><b>يقولون إن الذكاء الاصطناعي سيلغي كل الوظائف، فهل للدراسة قيمة؟<\/b><\/td><td>الذكاء الاصطناعي لن يلغي الإنسان بل سيغيّر شكل كثير من الوظائف. والمتميز القادر على التفكير الإبداعي وإدارة التقنيات وحل المشكلات سيزداد الطلب عليه، ولن يستغني أحد عن الأمين الكفء.<\/td><\/tr><\/table><\/div>", "radar": "<p class=\"\"><b>مؤشرات الخطر:<\/b> اختيار التخصص تحت ضغط الأقارب وحدهم، والاستسلام للمعدل مهما كان، وفقدان الدافع الدراسي بسبب الحيرة، وصدام حاد مع الوالدين حول الخيار، أو التأجيل المستمر للقرار.<\/p><p class=\"\"><b>بروتوكول التدخل:<\/b><\/p><p class=\"step\"><b>1. <\/b>اسأله: ماذا تتمنى أن تكون بعد عشر سنوات؟ ثم ما الذي يمنعك من ذلك؟<\/p><p class=\"step\"><b>2. <\/b>ساعده على لقاء شخص يعمل في المجال الذي يميل إليه ليسمع تجربة واقعية.<\/p><p class=\"step\"><b>3. <\/b>إن كان الخلاف مع الأسرة حاداً فاقترح جلسة هادئة يحضرها شخص يحترمه الوالدان.<\/p>", "actT": "«مختبر رسم البوصلة المهنية والجامعية»  نشاط تخطيطي", "act": "<p class=\"step\"><b>1. الدائرة الأولى، القدرات:<\/b> يسجل الفتى ثلاث مواد أو مهارات يتقنها ويستوعبها بسهولة (رياضيات، لغات، تحليل، إلقاء).<\/p><p class=\"step\"><b>2. الدائرة الثانية، الشغف:<\/b> يسجل ثلاثة موضوعات يستمتع بمتابعتها والبحث فيها دون إجبار.<\/p><p class=\"step\"><b>3. الدائرة الثالثة، حاجة الأمة:<\/b> يستعرض تخصصات المستقبل (الأمن السيبراني، والذكاء الاصطناعي، والطاقة البديلة، والاقتصاد الإسلامي، والإعلام الرقمي، وغيرها) ويضيف ما يراه من واقعه.<\/p><p class=\"step\"><b>4. نقطة الالتقاء:<\/b> يحدد التخصص الجامعي المقترح ويربطه بنية نصرة الأمة.<\/p><p class=\"step\"><b>5. دراسة حالة:<\/b> طارق (17 سنة) متفوق في الثانوية، يعشق الفيزياء التطبيقية وتكنولوجيا الطاقة المتجددة منذ سنوات وله ابتكارات صغيرة. قال له والده وأعمامه بحزم في مجلس الأسرة: «إما أن تدخل الهندسة المدنية لتعمل في مقاولات العائلة، أو إدارة الأعمال! أما الفيزياء فمضيعة للوقت». يعلم طارق أن الهندسة المدنية ليست شغفه وسيتعثر فيها، ويخشى في الوقت نفسه اتهامه بالعقوق والتمرد إن خالفهم. تحلل المجموعات: كيف يحاورهم؟ وما البيانات التي يجهزها؟<\/p><p class=\"step\"><b>6. الاعتراض:<\/b> أحد الطلاب يدافع عن «اختر ما يقوله المجتمع، فهو الأضمن»، وتناقشه المجموعات.<\/p><div class=\"tw\"><table><tr><th colspan=\"2\"><b>بطاقة: ثغري المهني والجامعي<\/b><\/th><\/tr><tr><td><b>1. قدراتي (ثلاث)<\/b><\/td><td>............ ............ ............<\/td><\/tr><tr><td><b>2. شغفي (ثلاثة)<\/b><\/td><td>............ ............ ............<\/td><\/tr><tr><td><b>3. حاجة الأمة التي أراها<\/b><\/td><td>............................<\/td><\/tr><tr><td><b>4. التخصص المستهدف<\/b><\/td><td>............................<\/td><\/tr><tr><td><b>5. خبير سأقابله هذا الأسبوع<\/b><\/td><td>............................<\/td><\/tr><tr><td><b>6. سجل الاستكشاف (ضع ✓)<\/b><\/td><td>مقابلة خبير ( ) مراجعة الخطة الدراسية ( ) حوار بارّ مع الوالدين ( )<\/td><\/tr><tr><td><b>7. عهد الفتى المسلم<\/b><\/td><td>«أنا صاحب ثغر، سأبني نفسي في التخصص الذي هيأني ربي له لخدمة أمتي»<\/td><\/tr><\/table><\/div>", "week": "<p class=\"\"><b>مقابلة خبير:<\/b> يلتقي الطالب أو يتصل بشخص يعمل في مجال يهمه ويسأله عن يومه الحقيقي.<\/p><p class=\"\"><b>تجربة صغيرة:<\/b> يجرب شيئاً جديداً في مجال يميل إليه (دورة تعريفية، أو مشروع صغير).<\/p><p class=\"\"><b>حوار بارّ:<\/b> يجلس مع والديه ويعرض عليهم بطاقته المهنية بأدب واستعداد للاستماع.<\/p><p class=\"\"><b>جسر إلى اللقاء الخامس والعشرين:<\/b> وبعد أن بنى الفتى نفسه وعرف طريقه، نختم الرحلة بمؤتمر يعرض فيه أثره ويعاهد فيه على الاستمرار. وهذا موضوع «المؤتمر الختامي».<\/p>", "kq": "استكشاف الشغف والقدرات واختيار التخصص الجامعي بوعي", "brief": "<div class=\"plan\"><span>اقتراح لتوزيع الوقت (١٠–١٥ د)<\/span><b>افتتاح ٣<\/b><b>محاور ٥<\/b><b>حوار ٢<\/b><b>نشاط ٣<\/b><b>ختام ٢<\/b><\/div><section class=\"bs\"><h3>١ · الافتتاح: وسيم ومالك<\/h3><p class=\"\"><b>وسيم (25 سنة)<\/b> نال في الثانوية معدل 98%، وخضوعاً لرغبة أسرته في نيل لقب «والد الطبيب» دخل كلية الطب رغماً عن ميوله، فهو يكره جو المشافي ويعشق التقنية والبرمجيات. وهو اليوم طبيب متعثر تعيس يمارس مهنته بضيق، ويشعر أنه دفن سنوات من عمره في مكان لا يحبه. أما <b>مالك (25 سنة)<\/b> فحصل على معدل 85%، واختار بوعي وشغف تخصص الأمن السيبراني والذكاء الاصطناعي رغم اعتراض أقاربه. وهو اليوم يقود شركة أمن رقمي تحمي بيانات مؤسسات المسلمين، ويحقق دخلاً مباركاً، ويعيش في قمة الإنجاز والشغف.<\/p><p class=\"\"><b>أسئلة الاستثارة:<\/b><\/p><p class=\"\">من منهما يخدم أمته أكثر؟ ولماذا لم يضمن المعدل الأعلى سعادة وسيم؟<\/p><p class=\"\">من الذي يتخذ قراراً بحجم عمرك كله؟ أنت؟ أم من حولك؟<\/p><\/section><section class=\"bs\"><h3>٢ · المحاور<\/h3><article class=\"pt\"><h4><span>١<\/span>لكل إنسان شاكلته واستعداده<\/h4><p class=\"ayah\">﴿قُلْ كُلٌّ يَعْمَلُ عَلَىٰ شَاكِلَتِهِ فَرَبُّكُمْ أَعْلَمُ بِمَنْ هُوَ أَهْدَىٰ سَبِيلًا﴾ [الإسراء: 84]<\/p><p class=\"g\">التميز يبدأ من اكتشاف القدرات الفطرية والميول وتوجيهها في المسار الصحيح.<\/p><details class=\"more\"><summary>للتوسع<\/summary><p class=\"had\">«الشاكلة» الطريقة والتركيبة التي فطر الله عليها كل إنسان. وفي الآية تقرير للتنوع الفطري في الطاقات والاستعدادات. فالنجاح الحقيقي أن ينطلق الشاب من شاكلته وتركيبته، لا أن يلبس ثوباً لا يناسبه. وقال تعالى: ﴿لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا﴾ [البقرة: 286]، فلا يسوغ لفتى أن يحمل نفسه مساراً ينافي قدراته فيبوء بالإحباط والانقطاع.<\/p><\/details><\/article><article class=\"pt\"><h4><span>٢<\/span>التيسير نحو المهارة<\/h4><p class=\"g\">ليس هناك «كلية قمة» مطلقة، بل القمة أن تكون متقنا وشغوفا في تخصص يحتاجه مجتمعك.<\/p><details class=\"more\"><summary>للتوسع<\/summary><p class=\"\">رأي الوالدين مهم، وبرهما فريضة، لكن اختلاف الرأي في التخصص لا يعني العقوق ما دام الفتى يبرهما ويحاورهما. قال تعالى: ﴿فَلَا تَقُل لَّهُمَا أُفٍّ وَلَا تَنْهَرْهُمَا وَقُل لَّهُمَا قَوْلًا كَرِيمًا﴾ [الإسراء: 23]. والذكاء أن يكسب الفتى قلب أبيه بالحوار والبيانات: يعد عرضاً عن مجالات عمل تخصصه وأسواقه ومستقبله، ويستعين بشخص يحترمه الوالد ليشرح له بأدب ووقار، دون صدام ولا رفع صوت.<\/p><\/details><\/article><article class=\"pt\"><h4><span>٣<\/span>الحوار البار مع الأسرة<\/h4><p class=\"g\">عند اختلاف الرغبة المهنية مع الوالدين، يدار الخلاف بالحوار المبني على البيانات وبأعلى درجات الأدب.<\/p><details class=\"more\"><summary>للتوسع<\/summary><p class=\"\">رأي الوالدين مهم، وبرهما فريضة، لكن اختلاف الرأي في التخصص لا يعني العقوق ما دام الفتى يبرهما ويحاورهما. قال تعالى: ﴿فَلَا تَقُل لَّهُمَا أُفٍّ وَلَا تَنْهَرْهُمَا وَقُل لَّهُمَا قَوْلًا كَرِيمًا﴾ [الإسراء: 23]. والذكاء أن يكسب الفتى قلب أبيه بالحوار والبيانات: يعد عرضاً عن مجالات عمل تخصصه وأسواقه ومستقبله، ويستعين بشخص يحترمه الوالد ليشرح له بأدب ووقار، دون صدام ولا رفع صوت.<\/p><\/details><\/article><article class=\"pt\"><h4><span>٤<\/span>الحرص على نفع الأمة<\/h4><p class=\"had\">قال رسول الله ﷺ: «احْرِصْ عَلَى مَا يَنْفَعُكَ، وَاسْتَعِنْ بِاللَّهِ وَلاَ تَعْجَزْ» رواه مسلم. فاختيار التخصص مبادرة وحرص على ما يثمر نفعاً حقيقياً في الدين والدنيا، مع نبذ العجز والكسل والتأجيل، والاستعانة بالله في كل خطوة.<\/p><p class=\"g\">التقاء الشغف والقدرة مع حاجة الأمة والنية الصالحة يصنع الثغر المهني الأمثل للفتى.<\/p><details class=\"more\"><summary>للتوسع<\/summary><\/details><\/article><\/section><section class=\"bs\"><h3>٣ · سؤال للحوار<\/h3><p class=\"big\">ما الذي تتقنه ويحتاجه مجتمعك؟<\/p><\/section><section class=\"bs\"><h3>٤ · نشاط تطبيقي<\/h3><p class=\"big\">امأل «مثلث الاختيار» :شغفي، قدرتي، حاجة أمتي.<\/p><\/section><section class=\"bs\"><h3>أسئلة قد تُطرح<\/h3><details class=\"more\"><summary><b>أنا لا أعرف شغفي وميولي حتى الآن، فكيف أختار؟<\/b><\/summary><p>الشغف يُكتشف بالتجربة والاحتكاك الميداني. اقرأ وجرّب دورات في البرمجة واللغات والإسعافات والتصميم، وقابل أهل المهن، ومن خلال التجربة ستعرف ما تميل إليه نفسك وما تتقنه.<\/p><\/details><details class=\"more\"><summary><b>أبي يصر على تخصص معين ويرفض تخصصي الذي أحبه، فهل مخالفته عقوق؟<\/b><\/summary><p>ليست عقوقاً ما دمت تبره وتحاوره. والذكاء أن تكسب قلبه بالحوار والبيانات: اعرض عليه مجالات العمل ومستقبل تخصصك، واستعن بمن يحترمه ليشرح له بأدب، دون صدام.<\/p><\/details><\/section><section class=\"bs warn\"><h3>رادار الحماية<\/h3><p><b>مؤشرات الخطر:<\/b> اختيار التخصص تحت ضغط الأقارب وحدهم، والاستسلام للمعدل مهما كان، وفقدان الدافع الدراسي بسبب الحيرة، وصدام حاد مع الوالدين حول الخيار، أو التأجيل المستمر للقرار.<\/p><small>البروتوكول كاملاً في تبويب «الكامل».<\/small><\/section><section class=\"bs\"><h3>٥ · رحلة الأسبوع<\/h3><p class=\"\"><b>مقابلة خبير:<\/b> يلتقي الطالب أو يتصل بشخص يعمل في مجال يهمه ويسأله عن يومه الحقيقي.<\/p><p class=\"\"><b>تجربة صغيرة:<\/b> يجرب شيئاً جديداً في مجال يميل إليه (دورة تعريفية، أو مشروع صغير).<\/p><p class=\"\"><b>حوار بارّ:<\/b> يجلس مع والديه ويعرض عليهم بطاقته المهنية بأدب واستعداد للاستماع.<\/p><p class=\"\"><b>جسر إلى اللقاء الخامس والعشرين:<\/b> وبعد أن بنى الفتى نفسه وعرف طريقه، نختم الرحلة بمؤتمر يعرض فيه أثره ويعاهد فيه على الاستمرار. وهذا موضوع «المؤتمر الختامي».<\/p><\/section>", "slides": ["<div class=\"cn\">24<\/div><h2>التوجيه المهني والمستقبلي<\/h2><p class=\"q\">كيف نختار تخصصنا وشغفنا بوعي؟<\/p>", "<small>إضاءة استهلالية<\/small><h2>وسيم ومالك<\/h2><ul><li class=\"frag\">من منهما يخدم أمته أكثر؟ ولماذا لم يضمن المعدل الأعلى سعادة وسيم؟<\/li><li class=\"frag\">من الذي يتخذ قراراً بحجم عمرك كله؟ أنت؟ أم من حولك؟<\/li><\/ul>", "<small>1<\/small><h2>لكل إنسان شاكلته واستعداده<\/h2><p class=\"ayah\">﴿قُلْ كُلٌّ يَعْمَلُ عَلَىٰ شَاكِلَتِهِ فَرَبُّكُمْ أَعْلَمُ بِمَنْ هُوَ أَهْدَىٰ سَبِيلًا﴾ [الإسراء: 84]<\/p><p class=\"g frag\">التميز يبدأ من اكتشاف القدرات الفطرية والميول وتوجيهها في المسار الصحيح.<\/p>", "<small>2<\/small><h2>التيسير نحو المهارة<\/h2><p class=\"g frag\">ليس هناك «كلية قمة» مطلقة، بل القمة أن تكون متقنا وشغوفا في تخصص يحتاجه مجتمعك.<\/p>", "<small>3<\/small><h2>الحوار البار مع الأسرة<\/h2><p class=\"g frag\">عند اختلاف الرغبة المهنية مع الوالدين، يدار الخلاف بالحوار المبني على البيانات وبأعلى درجات الأدب.<\/p>", "<small>4<\/small><h2>الحرص على نفع الأمة<\/h2><p class=\"had lg\">قال رسول الله ﷺ: «احْرِصْ عَلَى مَا يَنْفَعُكَ، وَاسْتَعِنْ بِاللَّهِ وَلاَ تَعْجَزْ» رواه مسلم. فاختيار التخصص مبادرة وحرص على ما يثمر نفعاً حقيقياً في الدين والدنيا، مع نبذ العجز والكسل والتأجيل، والاستعانة بالله في كل خطوة.<\/p><p class=\"g frag\">التقاء الشغف والقدرة مع حاجة الأمة والنية الصالحة يصنع الثغر المهني الأمثل للفتى.<\/p>", "<small>سؤال للحوار<\/small><h2 class=\"big\">ما الذي تتقنه ويحتاجه مجتمعك؟<\/h2>", "<small>نشاط تطبيقي<\/small><h2 class=\"big\">امأل «مثلث الاختيار» :شغفي، قدرتي، حاجة أمتي.<\/h2>", "<small>سؤال وبرهان<\/small><details class=\"frag\"><summary><b>أنا لا أعرف شغفي وميولي حتى الآن، فكيف أختار؟<\/b><\/summary><p>الشغف يُكتشف بالتجربة والاحتكاك الميداني. اقرأ وجرّب دورات في البرمجة واللغات والإسعافات والتصميم، وقابل أهل المهن، ومن خلال التجربة ستعرف ما تميل إليه نفسك وما تتقنه.<\/p><\/details><details class=\"frag\"><summary><b>أبي يصر على تخصص معين ويرفض تخصصي الذي أحبه، فهل مخالفته عقوق؟<\/b><\/summary><p>ليست عقوقاً ما دمت تبره وتحاوره. والذكاء أن تكسب قلبه بالحوار والبيانات: اعرض عليه مجالات العمل ومستقبل تخصصك، واستعن بمن يحترمه ليشرح له بأدب، دون صدام.<\/p><\/details><details class=\"frag\"><summary><b>يقولون إن الذكاء الاصطناعي سيلغي كل الوظائف، فهل للدراسة قيمة؟<\/b><\/summary><p>الذكاء الاصطناعي لن يلغي الإنسان بل سيغيّر شكل كثير من الوظائف. والمتميز القادر على التفكير الإبداعي وإدارة التقنيات وحل المشكلات سيزداد الطلب عليه، ولن يستغني أحد عن الأمين الكفء.<\/p><\/details>", "<small>ميدان التطبيق<\/small><h2>«مختبر رسم البوصلة المهنية والجامعية»  نشاط تخطيطي<\/h2><ol><li class=\"frag\">1. الدائرة الأولى، القدرات: يسجل الفتى ثلاث مواد أو مهارات يتقنها ويستوعبها بسهولة (رياضيات، لغات، تحليل، إلقاء).<\/li><li class=\"frag\">2. الدائرة الثانية، الشغف: يسجل ثلاثة موضوعات يستمتع بمتابعتها والبحث فيها دون إجبار.<\/li><li class=\"frag\">3. الدائرة الثالثة، حاجة الأمة: يستعرض تخصصات المستقبل (الأمن السيبراني، والذكاء الاصطناعي، والطاقة البديلة، والاقتصاد الإسلامي، والإعلام الرقمي،…<\/li><li class=\"frag\">4. نقطة الالتقاء: يحدد التخصص الجامعي المقترح ويربطه بنية نصرة الأمة.<\/li><li class=\"frag\">5. دراسة حالة: طارق (17 سنة) متفوق في الثانوية، يعشق الفيزياء التطبيقية وتكنولوجيا الطاقة المتجددة منذ سنوات وله ابتكارات صغيرة.<\/li><li class=\"frag\">6. الاعتراض: أحد الطلاب يدافع عن «اختر ما يقوله المجتمع، فهو الأضمن»، وتناقشه المجموعات.<\/li><\/ol>", "<small>رحلة الأسبوع<\/small><ul><li class=\"frag\"><b>مقابلة خبير:<\/b> يلتقي الطالب أو يتصل بشخص يعمل في مجال يهمه ويسأله عن يومه الحقيقي.<\/li><li class=\"frag\"><b>تجربة صغيرة:<\/b> يجرب شيئاً جديداً في مجال يميل إليه (دورة تعريفية، أو مشروع صغير).<\/li><li class=\"frag\"><b>حوار بارّ:<\/b> يجلس مع والديه ويعرض عليهم بطاقته المهنية بأدب واستعداد للاستماع.<\/li><li class=\"frag\"><b>جسر إلى اللقاء الخامس والعشرين:<\/b> وبعد أن بنى الفتى نفسه وعرف طريقه، نختم الرحلة بمؤتمر يعرض فيه أثره ويعاهد فيه على الاستمرار. وهذا موضوع «المؤتمر الختامي».<\/li><\/ul>"], "n": 24, "u": 4, "title": "التوجيه المهني والمستقبلي", "q": "كيف نختار تخصصنا وشغفنا بوعي؟", "dqq": "ما الذي تتقنه ويحتاجه مجتمعك؟", "pact": "امأل «مثلث الاختيار» :شغفي، قدرتي، حاجة أمتي."}, {"summary": "<p class=\"\">هذا اللقاء ليس حفل وداع، بل نقطة انطلاق. فالبرامج التربوية تنتهي كثيراً بشهادة تُعلَّق على الجدار ثم يعود الفتى إلى ما كان عليه. أما المؤتمر الختامي فيجعل النهاية عهداً: يعرض الفتيان أمام أهلهم ما أنجزوه من مشاريع وأثر، ويجددون العهد مع الله على الاستمرار، ويرتبطون برفقة صالحة تتابعهم بعد انتهاء اللقاءات. وهنا يتحول ما بُني من يقين وعادات وأولويات وهوية ومهارات إلى مسيرة ممتدة.<\/p><p class=\"\">يعرض مشروعه وأثره بوضوح وتواضع أمام الأهل والمشرف.<\/p><p class=\"\">يفهم أن الاستقامة بعد انتهاء البرنامج هي الاختبار الحقيقي.<\/p><p class=\"\">يوقّع ميثاق الاستمرارية بشهادة والده والمشرف.<\/p><div class=\"tw\"><table><tr><th><b>المهارة<\/b><\/th><th><b>معناها العملي<\/b><\/th><\/tr><tr><td><b>عرض الأثر والمنجز<\/b><\/td><td>يقدم مشروعه ببيانات وصور ونتائج حقيقية دون مبالغة<\/td><\/tr><tr><td><b>الاستمرارية بعد الختام<\/b><\/td><td>يصمم نظاماً يحميه من الانتكاس بعد انتهاء البرنامج<\/td><\/tr><tr><td><b>الرسالية والمبادرة<\/b><\/td><td>يرى نفسه مصلحاً يخدم مجتمعه من موقعه وتخصصه<\/td><\/tr><\/table><\/div>", "kit": "<p class=\"\"><b>ما يعيشه الفتى:<\/b> هو فخور بما أنجز، ومشتاق إلى التقدير، وخائف في الوقت نفسه من أن يخسر بيئة الدعم فيعود تدريجياً إلى سلبيته القديمة. وقد يحزن لفراق المجموعة.<\/p><p class=\"\"><b>أعدّ المؤتمر مبكراً:<\/b> المشاريع تحتاج إلى متابعة قبل اللقاء بأسابيع، فلا تترك الاستعداد للحظات الأخيرة.<\/p><p class=\"\"><b>احتفِ بالصدق لا بالضخامة:<\/b> قد يكون مشروع فتى بسيطاً لكنه حقيقي ومؤثر، فاجعل التكريم للأثر الحقيقي والالتزام.<\/p><p class=\"\"><b>أشرك الأسرة بحكمة:<\/b> دعوة الآباء تضاعف أثر اللقاء، ولا تُحرج فتى لم يحضر أهله بل اجعل له شاهداً بديلاً.<\/p><p class=\"\"><b>خطط لما بعد المؤتمر:<\/b> الأمر الأهم أن يجد كل فتى رفيقاً يتابعه ولقاءً دورياً يلتقي فيه برفاقه.<\/p>", "hookT": "الحفلان", "hook": "<p class=\"\">تأمل الفرق بين نهايتين لرحلتين تربويتين. في <b>الحفل (أ)<\/b> استلم الطلاب شهادات ورقية مزخرفة والتقطوا صوراً سريعة، ثم علّقوا الشهادات على الجدران ليعلوها الغبار، وعادوا في اليوم التالي إلى التسويف والخمول والانقياد للمشتتات كأنهم لم يتعلموا شيئاً. أما في <b>حفل «مؤتمر الجيل الصاعد» (ب)<\/b> فصعد الفتيان رجالاً مصلحين وصناع أثر: قدموا مشاريع حقيقية أثرت في الميدان (مبادرات توعوية، ومنصات تقنية، وأعمال بر وخدمة، وهواتف طُهّرت بالعفة والانضباط). ووقف الآباء والدموع تملأ أعينهم فخراً، وقال أب لابنه وهو يعانقه: «اليوم وُلد لي رجل حقيقي أعتمد عليه في ديني ودنياي».<\/p><p class=\"\"><b>أسئلة الاستثارة:<\/b><\/p><p class=\"\">ما الذي جعل الحفل الثاني نهاية ببداية جديدة؟ وما الذي ينقص الحفل الأول؟<\/p><p class=\"\">ماذا تريد أن تقول لنفسك بعد عام من اليوم؟<\/p>", "pts": "<article class=\"pt\"><h4><span>أولاً<\/span>الصدق في العهد والثبات عليه<\/h4><p class=\"ayah\">﴿مِّنَ الْمُؤْمِنِينَ رِجَالٌ صَدَقُوا مَا عَاهَدُوا اللَّهَ عَلَيْهِ ۖ فَمِنْهُم مَّن قَضَىٰ نَحْبَهُ وَمِنْهُم مَّن يَنتَظِرُ ۖ وَمَا بَدَّلُوا تَبْدِيلًا﴾ [الأحزاب: 23]<\/p><p class=\"\">رتبة الرجولة القرآنية الكبرى هي الصدق في العهد والثبات على المبدأ والاستمرار على الطريق دون انتكاس ولا تبديل. فمعيار النجاح ليس لحظة الحماس في المؤتمر بل ما بعده بسنوات: ﴿وَمَا بَدَّلُوا تَبْدِيلًا﴾.<\/p><\/article><article class=\"pt\"><h4><span>ثانياً<\/span>الفراغ من مرحلة بداية لأخرى<\/h4><p class=\"ayah\">﴿فَإِذَا فَرَغْتَ فَانصَبْ * وَإِلَىٰ رَبِّكَ فَارْغَب﴾ [الشرح: 7-8]<\/p><p class=\"\">منهج المؤمن مستمر: الفراغ من مرحلة تربوية إيذان بالبذل في مرحلة وميدان جديدين. فالمؤتمر الختامي بوابة إلى مرحلة أوسع من العطاء، وليس وقفة تقاعد.<\/p><\/article><article class=\"pt\"><h4><span>ثالثاً<\/span>العمل يراه الله ورسوله والمؤمنون<\/h4><p class=\"ayah\">﴿وَقُلِ اعْمَلُوا فَسَيَرَى اللَّهُ عَمَلَكُمْ وَرَسُولُهُ وَالْمُؤْمِنُونَ﴾ [التوبة: 105]<\/p><p class=\"\">الآية تجعل العمل مرئياً، وفي رؤية المؤمنين له شهادة وتوثيق. وهنا حكمة المؤتمر: أن يرى الأهل والرفاق ما أنجزه الفتى، فيصير ما قاله التزاماً يُسأل عنه. وفي الآية تذكير بأن الله هو الأول في الرؤية، فيصحح الفتى نيته أن يكون العمل لله لا للتصفيق.<\/p><\/article><article class=\"pt\"><h4><span>رابعاً<\/span>المداومة جوهر النجاح<\/h4><p class=\"\">سُئل النبي ﷺ: أَيُّ الأَعْمَالِ أَحَبُّ إِلَى اللَّهِ؟ قَالَ: «أَدْوَمُهَا وَإِنْ قَلَّ» متفق عليه. فالأثر الثابت الدائم أحب إلى الله من هبّات متقطعة. وهذه هي خلاصة هذه الوحدات الخمس: أن نبني عادات صغيرة دائمة وهوية راسخة ومهارات نافعة، لا أن ننجز مشروعاً كبيراً واحداً ثم ننقطع.<\/p><\/article><article class=\"pt\"><h4><span>خامساً<\/span>الإيمان ثم الاستقامة<\/h4><p class=\"had\">عن سفيان بن عبد الله الثقفي رضي الله عنه قال: قلت: يا رسول الله، قل لي في الإسلام قولاً لا أسأل عنه أحداً بعدك. قال: «قُلْ: آمَنْتُ بِاللَّهِ، ثُمَّ اسْتَقِمْ» رواه مسلم<\/p><p class=\"\">هذه الوصية الجامعة خلاصة التربية كلها في كلمتين: ثبات العقيدة، ثم الاستقامة الدائمة على الصراط. وقال تعالى: ﴿إِنَّ الَّذِينَ قَالُوا رَبُّنَا اللَّهُ ثُمَّ اسْتَقَامُوا فَلَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَ﴾ [الأحقاف: 13]. فالاستقامة هي الاختبار الحقيقي بعد المؤتمر.<\/p><\/article><article class=\"pt\"><h4><span>سادساً<\/span>حجة الوداع، إشهاد على إتمام البلاغ<\/h4><p class=\"\">وقف النبي ﷺ على عرفات بعد أن بنى الجيل وأتم البلاغ وغرس الهوية، فخطب خطبته الجامعة، ثم قال: «وَأَنْتُمْ تُسْأَلُونَ عَنِّي، فَمَا أَنْتُمْ قَائِلُونَ؟» قالوا: نشهد أنك قد بلغت وأديت ونصحت. فقال بإصبعه يرفعها إلى السماء وينكتها إلى الناس: «اللَّهُمَّ اشْهَدْ، اللَّهُمَّ اشْهَدْ» رواه مسلم. وقال: «فَلْيُبَلِّغِ الشَّاهِدُ الْغَائِبَ». ففي ذلك أن نهاية المسيرة التربوية تسليم الراية للجيل التالي: ما تعلمته تبلّغه.<\/p><\/article><article class=\"pt\"><h4><span>سابعاً<\/span>البلاغ والتعليم بعد التخرج<\/h4><p class=\"had\">قال رسول الله ﷺ: «بَلِّغُوا عَنِّي وَلَوْ آيَةً» رواه البخاري. فكل فتى مؤهل أن يبلّغ في موضعه: يعلّم زميلاً صلاة، أو يقود مبادرة في حيّه، أو يساعد في المسجد. وليس المصلح هو الواعظ فقط. فالإصلاح أن يكون الفتى متقناً لدراسته، باراً بوالديه، صادقاً في معاملته، آمراً بالمعروف برفق، نافعاً للناس في تخصصه.<\/p><\/article><article class=\"pt\"><h4><span>ثامناً<\/span>الختام المنقطع والختام الرسالي<\/h4><div class=\"tw\"><table><tr><th><b>الختام المنقطع (حفل الشهادة الورقية)<\/b><\/th><th><b>الختام الرسالي (مؤتمر الأثر والعهد)<\/b><\/th><\/tr><tr><td><b>العودة إلى الفتور والعادات القديمة فوراً<\/b><\/td><td>الثبات والاستمرارية وتعميق الهوية<\/td><\/tr><tr><td><b>الاقتصار على المشاعر والتنظير<\/b><\/td><td>تقديم مخرجات وبيانات ومشاريع حية<\/td><\/tr><tr><td><b>انتهاء العلاقة بالمربي والرفقة<\/b><\/td><td>تأسيس رابطة ممتدة ومساءلة أخوية<\/td><\/tr><tr><td><b>شخصية اتكالية تعيش لنفسها فقط<\/b><\/td><td>رجل مصلح يقود التغيير في مجتمعه<\/td><\/tr><\/table><\/div><\/article><article class=\"pt\"><h4><span>تاسعاً<\/span>هندسة الأمان ضد الانتكاس<\/h4><p class=\"\">الحفاظ على العادات لا يعتمد على المشاعر المؤقتة بل على الأنظمة اليومية والبيئة الصالحة. وأركان هذا الأمان: <b>الحد الأدنى الإيماني<\/b> الثابت (المثلث الإيماني)، و<b>شريك المساءلة<\/b> الذي يتابع التزام الفتى، و<b>اللقاء الدوري<\/b> مع الرفقة الصالحة، و<b>الخدمة المستمرة<\/b> للناس. فمن ضمن هذه الأركان وجد ما يسنده عند أول فتور. وقال تعالى: ﴿وَتَوَاصَوْا بِالْحَقِّ وَتَوَاصَوْا بِالصَّبْرِ﴾ [العصر: 3].<\/p><\/article>", "qa": "<div class=\"tw\"><table><tr><th><b>السؤال المتوقع<\/b><\/th><th><b>تفكيكه<\/b><\/th><\/tr><tr><td><b>أشعر بالخوف من العودة إلى الذنب والتراجع بعد انقضاء اللقاءات والبيئة الحاضنة<\/b><\/td><td>هذا الخوف علامة حياة في القلب. والأمان الحقيقي في تثبيت «الحد الأدنى الإيماني» والارتباط برفيقك المحاسب. ومتى زلت قدمك فبادر بالتوبة والعودة فوراً، فإن الله يحب التوابين، ولا تجعل الزلة سبباً للهجران.<\/td><\/tr><tr><td><b>هل دوري كمصلح يقتضي أن أكون متكلماً أو شيخاً في المجتمع؟<\/b><\/td><td>إطلاقاً. الإصلاح أن تكون متقناً لدراستك، باراً بوالديك، صادقاً في معاملتك، آمراً بالمعروف برفق، ونافعاً للناس في تخصصك. فالمهندس النزيه مصلح، والطبيب الرحيم مصلح، والابن البار مصلح.<\/td><\/tr><tr><td><b>كيف نحافظ على هذه الأخوة التي نشأت في هذا المنهج طوال السنوات القادمة؟<\/b><\/td><td>عبر لقاءات دورية، ومشاريع عمل مشتركة، والتواصي المستمر بالحق والصبر. فالمرء قليل بنفسه كثير بإخوانه.<\/td><\/tr><\/table><\/div>", "radar": "<p class=\"\"><b>مؤشرات الخطر:<\/b> الخوف الشديد من انتهاء البرنامج، والتهرب من حضور المؤتمر أو من تقديم مشروع، والاكتفاء بالشكليات والصور دون أثر، والعودة السريعة للتسويف في الأسابيع الأولى بعد الختام، أو الشعور بالفراغ والضياع بعد انتهاء اللقاءات.<\/p><p class=\"\"><b>بروتوكول التدخل:<\/b><\/p><p class=\"step\"><b>1. <\/b>اجلس مع الفتى الخائف واسمع مخاوفه، وبيّن أن الخوف علامة حرص، ثم ضع معه خطة عملية.<\/p><p class=\"step\"><b>2. <\/b>أكد له أنك وإخوانه باقون، وحدد موعد أول لقاء دوري.<\/p><p class=\"step\"><b>3. <\/b>تابعه شخصياً أول أسابيع بعد الختام بسؤال واحد بسيط عن حاله وأوراده.<\/p>", "actT": "«مراسم ميثاق الاستمرارية والعهد الرسالي»  نشاط ختامي وتكاملي", "act": "<p class=\"step\"><b>1. عرض مشاريع الأثر:<\/b> يقدم كل فريق أو فتى مشروعه الميداني، مستعرضاً الصور والبيانات والنتائج أمام الآباء والمشرفين، ويُسأل عن الدروس المستفادة.<\/p><p class=\"step\"><b>2. قسم الميثاق الجماعي:<\/b> يقف الفتيان ويلقون القسم بصوت موحد. <b>عهد العبودية:<\/b> الثبات على الصلاة وعفة الخلوات والاستعلاء بالإيمان. <b>عهد البر:<\/b> الوفاء للأهل والخدمة دون تذمر. <b>عهد الأثر:<\/b> تسخير المهارات والتخصصات لنفع الأمة وعمارة الأرض.<\/p><p class=\"step\"><b>3. التوقيع والاعتماد:<\/b> يوقّع الفتى، ويعتمد والده توقيعه، ويشهد المشرف عليه.<\/p><p class=\"step\"><b>4. خطة ما بعد الختام:<\/b> يختار كل فتى شريك مساءلة ويحدد موعد أول لقاء دوري ومشروع الشهر القادم.<\/p><p class=\"step\"><b>5. دراسة حالة:<\/b> معاذ (17 سنة) تغيرت حياته جذرياً خلال البرنامج: أصلح صلته بوالديه، وترك مقاطع اللهو والسهر، وأتقن مهارة الإلقاء، وقاد مبادرة تنظيف مسجد الحي بنجاح. وليلة المؤتمر أسرّ إلى المشرف بخوفه: «أنا سعيد بما أنجزت، لكنني مرعوب من أن ينتهي البرنامج فأعود تدريجياً إلى سلبيتي القديمة وأخسر كل ما بنيته». تحلل المجموعات: ما خطته الواقعية للاستمرار؟ وما دور رفاقه؟<\/p><p class=\"step\"><b>6. الاعتراض:<\/b> أحد الطلاب يدافع عن «الاكتفاء بما تعلمته، فلا حاجة إلى لقاءات بعد اليوم»، وتناقشه المجموعات.<\/p><div class=\"tw\"><table><tr><th colspan=\"2\"><b>وثيقة: ميثاق التتويج والاستمرارية<\/b><\/th><\/tr><tr><td><b>العهد<\/b><\/td><td>«أعاهد الله تعالى على الاستقامة، والثبات على ما تعلمت، وأن أبقى خادماً لديني وأمتي»<\/td><\/tr><tr><td><b>مشروعي الميداني<\/b><\/td><td>............................<\/td><\/tr><tr><td><b>شريك مساءلتي بعد الختام<\/b><\/td><td>............................<\/td><\/tr><tr><td><b>سجل الاستقامة والمسيرة الممتدة (ضع ✓)<\/b><\/td><td>المحافظة على الفجر والورد ( ) مبادرة شهرية نافعة ( ) التواصل مع الرفقة الصالحة ( )<\/td><\/tr><tr><td><b>توقيع الطالب (صاحب العهد)<\/b><\/td><td>............................<\/td><\/tr><tr><td><b>توقيع ولي الأمر (الشاهد الأول)<\/b><\/td><td>............................<\/td><\/tr><tr><td><b>توقيع المشرف (الشاهد الثاني)<\/b><\/td><td>............................<\/td><\/tr><tr><td><b>عهد الفتى المسلم<\/b><\/td><td>«أنا رجل صدق ما عاهد الله عليه، استقامتي ديمة، وأثري ممتد حتى ألقى ربي»<\/td><\/tr><\/table><\/div>", "week": "<p class=\"\"><b>أول أسبوع بعد الختام:<\/b> يلتزم الطالب بالحد الأدنى الإيماني ويسجله يومياً.<\/p><p class=\"\"><b>لقاء الشريك:<\/b> يلتقي شريك مساءلته ويراجعان معاً ميثاق التتويج.<\/p><p class=\"\"><b>مبادرة شهرية:<\/b> يحدد مبادرة نافعة صغيرة لهذا الشهر (خدمة، أو تعليم، أو مشروع) ويبدأها.<\/p><p class=\"\"><b>خاتمة الوحدة:<\/b> تنتهي بهذا المؤتمر لقاءات الوحدات الخمس، وتبدأ مسيرة العمر. ويأتي بعدها ما يقيس الأثر ويثبّته: ميزان الأثر الشامل.<\/p>", "kq": "عرض الفتيان لمشاريعهم السنوية وتقييم الأثر الميداني والتتويج", "brief": "<div class=\"plan\"><span>اقتراح لتوزيع الوقت (١٠–١٥ د)<\/span><b>افتتاح ٣<\/b><b>محاور ٥<\/b><b>حوار ٢<\/b><b>نشاط ٣<\/b><b>ختام ٢<\/b><\/div><section class=\"bs\"><h3>١ · الافتتاح: الحفلان<\/h3><p class=\"\">تأمل الفرق بين نهايتين لرحلتين تربويتين. في <b>الحفل (أ)<\/b> استلم الطلاب شهادات ورقية مزخرفة والتقطوا صوراً سريعة، ثم علّقوا الشهادات على الجدران ليعلوها الغبار، وعادوا في اليوم التالي إلى التسويف والخمول والانقياد للمشتتات كأنهم لم يتعلموا شيئاً. أما في <b>حفل «مؤتمر الجيل الصاعد» (ب)<\/b> فصعد الفتيان رجالاً مصلحين وصناع أثر: قدموا مشاريع حقيقية أثرت في الميدان (مبادرات توعوية، ومنصات تقنية، وأعمال بر وخدمة، وهواتف طُهّرت بالعفة والانضباط). ووقف الآباء والدموع تملأ أعينهم فخراً، وقال أب لابنه وهو يعانقه: «اليوم وُلد لي رجل حقيقي أعتمد عليه في ديني ودنياي».<\/p><p class=\"\"><b>أسئلة الاستثارة:<\/b><\/p><p class=\"\">ما الذي جعل الحفل الثاني نهاية ببداية جديدة؟ وما الذي ينقص الحفل الأول؟<\/p><p class=\"\">ماذا تريد أن تقول لنفسك بعد عام من اليوم؟<\/p><\/section><section class=\"bs\"><h3>٢ · المحاور<\/h3><article class=\"pt\"><h4><span>١<\/span>الصدق في العهد والثبات<\/h4><p class=\"ayah\">﴿مِّنَ الْمُؤْمِنِينَ رِجَالٌ صَدَقُوا مَا عَاهَدُوا اللَّهَ عَلَيْهِ ۖ فَمِنْهُم مَّن قَضَىٰ نَحْبَهُ وَمِنْهُم مَّن يَنتَظِرُ ۖ وَمَا بَدَّلُوا تَبْدِيلًا﴾ [الأحزاب: 23]<\/p><p class=\"g\">معيار النجاح ليس الحماس المؤقت وقت المؤتمر، بل الاستمرار دون تبديل.<\/p><details class=\"more\"><summary>للتوسع<\/summary><p class=\"\">رتبة الرجولة القرآنية الكبرى هي الصدق في العهد والثبات على المبدأ والاستمرار على الطريق دون انتكاس ولا تبديل. فمعيار النجاح ليس لحظة الحماس في المؤتمر بل ما بعده بسنوات: ﴿وَمَا بَدَّلُوا تَبْدِيلًا﴾.<\/p><\/details><\/article><article class=\"pt\"><h4><span>٢<\/span>العمل ملموس ومرئي<\/h4><p class=\"ayah\">﴿وَقُلِ اعْمَلُوا فَسَيَرَى اللَّهُ عَمَلَكُمْ وَرَسُولُهُ وَالْمُؤْمِنُونَ﴾ [التوبة: 105]<\/p><p class=\"g\">عرض المشاريع وتوقيع الميثاق علنا يحول النوايا إلى مسؤولية يشهد عليها الأهل.<\/p><details class=\"more\"><summary>للتوسع<\/summary><p class=\"\">الآية تجعل العمل مرئياً، وفي رؤية المؤمنين له شهادة وتوثيق. وهنا حكمة المؤتمر: أن يرى الأهل والرفاق ما أنجزه الفتى، فيصير ما قاله التزاماً يُسأل عنه. وفي الآية تذكير بأن الله هو الأول في الرؤية، فيصحح الفتى نيته أن يكون العمل لله لا للتصفيق.<\/p><\/details><\/article><article class=\"pt\"><h4><span>٣<\/span>المداومة جوهر النجاح<\/h4><p class=\"g\">الحفاظ على «الحد الأدنى الإيماني» يحمي الشاب من الانتكاسة بعد انتهاء البرنامج.<\/p><details class=\"more\"><summary>للتوسع<\/summary><p class=\"\">سُئل النبي ﷺ: أَيُّ الأَعْمَالِ أَحَبُّ إِلَى اللَّهِ؟ قَالَ: «أَدْوَمُهَا وَإِنْ قَلَّ» متفق عليه. فالأثر الثابت الدائم أحب إلى الله من هبّات متقطعة. وهذه هي خلاصة هذه الوحدات الخمس: أن نبني عادات صغيرة دائمة وهوية راسخة ومهارات نافعة، لا أن ننجز مشروعاً كبيراً واحداً ثم ننقطع.<\/p><\/details><\/article><article class=\"pt\"><h4><span>٤<\/span>الإيمان ثم الاستقامة<\/h4><p class=\"had\">عن سفيان بن عبد الله الثقفي رضي الله عنه قال: قلت: يا رسول الله، قل لي في الإسلام قولاً لا أسأل عنه أحداً بعدك. قال: «قُلْ: آمَنْتُ بِاللَّهِ، ثُمَّ اسْتَقِمْ» رواه مسلم<\/p><p class=\"g\">الختام الرسالي يتطلب البقاء ضمن رفقة صالحة والانتقال من مرحلة التلقي إلى الفعل والإصلاح.<\/p><details class=\"more\"><summary>للتوسع<\/summary><p class=\"\">هذه الوصية الجامعة خلاصة التربية كلها في كلمتين: ثبات العقيدة، ثم الاستقامة الدائمة على الصراط. وقال تعالى: ﴿إِنَّ الَّذِينَ قَالُوا رَبُّنَا اللَّهُ ثُمَّ اسْتَقَامُوا فَلَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَ﴾ [الأحقاف: 13]. فالاستقامة هي الاختبار الحقيقي بعد المؤتمر.<\/p><\/details><\/article><\/section><section class=\"bs\"><h3>٣ · سؤال للحوار<\/h3><p class=\"big\">ما أول خطوة ستفعلها غدا بعد انتهاء البرنامج؟<\/p><\/section><section class=\"bs\"><h3>٤ · نشاط تطبيقي<\/h3><p class=\"big\">اعرض مشروعك، ووقع ميثاقك علنا أمام أهلك والمشرفين.<\/p><\/section><section class=\"bs\"><h3>أسئلة قد تُطرح<\/h3><details class=\"more\"><summary><b>أشعر بالخوف من العودة إلى الذنب والتراجع بعد انقضاء اللقاءات والبيئة الحاضنة<\/b><\/summary><p>هذا الخوف علامة حياة في القلب. والأمان الحقيقي في تثبيت «الحد الأدنى الإيماني» والارتباط برفيقك المحاسب. ومتى زلت قدمك فبادر بالتوبة والعودة فوراً، فإن الله يحب التوابين، ولا تجعل الزلة سبباً للهجران.<\/p><\/details><details class=\"more\"><summary><b>هل دوري كمصلح يقتضي أن أكون متكلماً أو شيخاً في المجتمع؟<\/b><\/summary><p>إطلاقاً. الإصلاح أن تكون متقناً لدراستك، باراً بوالديك، صادقاً في معاملتك، آمراً بالمعروف برفق، ونافعاً للناس في تخصصك. فالمهندس النزيه مصلح، والطبيب الرحيم مصلح، والابن البار مصلح.<\/p><\/details><\/section><section class=\"bs warn\"><h3>رادار الحماية<\/h3><p><b>مؤشرات الخطر:<\/b> الخوف الشديد من انتهاء البرنامج، والتهرب من حضور المؤتمر أو من تقديم مشروع، والاكتفاء بالشكليات والصور دون أثر، والعودة السريعة للتسويف في الأسابيع الأولى بعد الختام، أو
