المنهجية العملية للتعامل مع الشبهات؟<\/p>", "<small>إضاءة استهلالية<\/small><h2>الفلتر والماء الملوث<\/h2><ul><li class=\"frag\">ما الفرق بين من يبتلع الشبهات بلا تمحيص ومن يمتلك فلتر رد الفروع إلى الأصول؟<\/li><li class=\"frag\">لماذا يصاب الشاب غير المحصّن بالشك من شبهة واحدة، بينما تزيد المحصّن بصيرة؟<\/li><\/ul>", "<small>1<\/small><h2>رد المتشابه إلى المحكم<\/h2><p class=\"ayah lg\">﴿هُوَ الَّذِي أَنزَلَ عَلَيْكَ الْكِتَابَ مِنْهُ آيَاتٌ مُّحْكَمَاتٌ هُنَّ أُمُّ الْكِتَابِ وَأُخَرُ مُتَشَابِهَاتٌ ۖ فَأَمَّا الَّذِينَ فِي قُلُوبِهِمْ زَيْغٌ فَيَتَّبِعُونَ مَا تَشَابَهَ مِنْهُ ابْتِغَاءَ الْفِتْنَةِ﴾ [آل عمران: 7]<\/p><p class=\"g frag\">الأصل رد الفرعيات للأصول الكبرى القاطعة.<\/p>", "<small>2<\/small><h2>سؤال أهل الاختصاص<\/h2><p class=\"ayah\">﴿فَاسْأَلُوا أَهْلَ الذِّكْرِ إِن كُنتُمْ لَا تَعْلَمُونَ﴾ [النحل: 43]<\/p><p class=\"g frag\">جهل الإنسان بالجواب لا يعني بطلان الحق.<\/p>", "<small>3<\/small><h2>الوقاية من مجالس الخوض<\/h2><p class=\"ayah\">﴿وَإِذَا رَأَيْتَ الَّذِينَ يَخُوضُونَ فِي آيَاتِنَا فَأَعْرِضْ عَنْهُمْ حَتَّىٰ يَخُوضُوا فِي حَدِيثٍ غَيْرِهِ﴾ [الأنعام: 68]<\/p><p class=\"g frag\">إ السلامة الفكرية تقتضي الابتعاد عن مواطن الجدل العبثي.<\/p>", "<small>4<\/small><h2>الاحتياط في المشتبهات<\/h2><p class=\"had lg\">قال رسول الله ﷺ: «إنَّ الحَلالَ بَيِّنٌ، وإنَّ الحَرامَ بَيِّنٌ، وبينَهُما أُمُورٌ مُشْتَبِهاتٌ لا يَعْلَمُهُنَّ كَثِيرٌ مِنَ النَّاسِ، فَمَنِ اتَّقَى الشُّبُهاتِ اسْتَبْرَأَ لِدِينِهِ وعِرْضِهِ...» متفق عليه. وفي الخواطر والوساوس التشكيكية قال ﷺ: «يَأْتي الشَّيْطانُ أحَدَكُمْ فيَقولَ: مَن خَلَقَ كَذا وكَذا؟ حتَّى يَقُولَ له: مَن خَلَقَ رَبَّكَ؟ فإذا بَلَغَ ذلكَ، فَلْيَسْتَعِذْ باللَّهِ ولْيَنْتَهِ» رواه البخاري. أي أن الخاطر الشيطاني يُقطع بالاستعاذة وصرف الذهن، لا بالاسترسال في سلسلة أسئلة لا تنتهي.<\/p><p class=\"g frag\">درء الوساوس يكون بقطعها وصرف الذهن عنها.<\/p>", "<small>سؤال للحوار<\/small><h2 class=\"big\">ما الشبهة التي سمعتها ولم تجد لها جوابا؟ وإلى من سترجع؟<\/h2>", "<small>نشاط تطبيقي<\/small><h2 class=\"big\">ابن «بطاقة الفلتر» :ثلاث خطوات تفعلها عند أي شبهة.<\/h2>", "<small>سؤال وبرهان<\/small><details class=\"frag\"><summary><b>ماذا لو صادفت شبهة لم أعرف جوابها واضطربت نفسي؟<\/b><\/summary><p>جهلك بجواب مسألة لا يعني بطلان الحق. تمسك بالمحكم الثابت وضع الإشكال جانباً، واسأل أهل العلم الراسخين، وسيزول اللبس بإذن الله.<\/p><\/details><details class=\"frag\"><summary><b>هل مشاهدة المناظرات الفكرية في تيك توك ويوتيوب تزيد ثقافتي؟<\/b><\/summary><p>تشكل خطراً بالغاً على غير المتأصّل شرعياً، فالبناء أولاً ثم دفع الصائل إن لزم.<\/p><\/details><details class=\"frag\"><summary><b>كيف أفرق بين المحكم الذي لا يقبل الشك والمسائل الاجتهادية؟<\/b><\/summary><p>المحكم ما دلت عليه نصوص قاطعة الثبوت والدلالة وأجمعت عليه الأمة كأركان الإيمان والإسلام. أما الاجتهادي فما احتمل وجوهاً لظنية دليله.<\/p><\/details>", "<small>ميدان التطبيق<\/small><h2>«فلتر الشبهات»  نشاط ذهني وحواري<\/h2><ol><li class=\"frag\">1. التقسيم: ثلاث مجموعات: أهل المحكمات، والمرشّحون، والمفكّكون.<\/li><li class=\"frag\">2. الشبهة المطروحة: «يدعي بعض المشككين أن التشريعات الإسلامية تظلم الإنسان وتحد من حريته، بينما يوفر العالم الحديث الحرية المطلقة لكل شخص».<\/li><li class=\"frag\">3. المهمة: فريق المحكمات يثبّت أصل العبودية وحكمة الخالق وغناه، وفريق المرشّحين يثبت وهم «الحرية المطلقة» في أي قانون بشري، وفريق المفكّكين يكشف…<\/li><li class=\"frag\">4. العرض: يقدم كل فريق رده أمام الجميع ويربطه بخطوات الفلتر.<\/li><li class=\"frag\">5. الخلوة الفردية: يعبّئ كل طالب البطاقة على إشكال خطر له:<\/li><\/ol>", "<small>رحلة الأسبوع<\/small><ul><li class=\"frag\"><b>الصيام عن منصات الجدل:<\/b> التوقف التام عن متابعة حسابات المناظرات والشبهات العبثية.<\/li><li class=\"frag\"><b>تطبيق الفلتر:<\/b> عند مصادفة أي إشكال فكري عارض، يمرره الطالب على بطاقة الفلتر أو يعرضه على المشرف فوراً.<\/li><li class=\"frag\"><b>جسر إلى اللقاء الخامس:<\/b> وللثبات عدو آخر أخفى من الشبهة: الانشغال والتشتت. وهذا موضوع «الثبات في عصر المشتتات».<\/li><\/ul>"], "n": 4, "u": 0, "title": "حصون اليقين (صناعة الفلتر)", "q": "ما هي المنهجية العملية للتعامل مع الشبهات؟", "dqq": "ما الشبهة التي سمعتها ولم تجد لها جوابا؟ وإلى من سترجع؟", "pact": "ابن «بطاقة الفلتر» :ثلاث خطوات تفعلها عند أي شبهة."}, {"summary": "<p class=\"\">الثبات لا يهدده الشك وحده، بل يهدده أيضاً التشتت الذي يسرق الوقت والتركيز والغاية. يدرك الفتى في هذا اللقاء أن عمره رأس ماله، وأن الشاشات تُصمَّم لتُبقيه مسلوب الإرادة، وأنه يستطيع استعادة سيادته بتعديل بيئته وبناء عادات صغيرة مستمرة.<\/p><div class=\"tw\"><table><tr><th><b>المهارة المستهدفة<\/b><\/th><th><b>معناها العملي<\/b><\/th><\/tr><tr><td><b>إدارة الانتباه والتركيز العميق<\/b><\/td><td>يحمي قدراته الذهنية ويعمل بتركيز مكثف<\/td><\/tr><tr><td><b>هندسة العادات الصغيرة<\/b><\/td><td>يصمم بيئته ليتخلص من الإدمان الرقمي تدريجياً<\/td><\/tr><tr><td><b>استثمار الزمن<\/b><\/td><td>يدرك أن العمر رأس مال لا يُعوَّض<\/td><\/tr><\/table><\/div>", "kit": "<p class=\"\"><b>لا توبيخ ولا ذنب:<\/b> الفتى المدمن على المقاطع القصيرة يعلم أنه يخسر، والتوبيخ يزيد هروبه إلى الشاشة. اجلس معه كمن يعالج لا كمن يحاكم.<\/p><p class=\"\"><b>اعتمد الأرقام:<\/b> زمن الشاشة في الهاتف حقيقة مجردة أبلغ من أي موعظة.<\/p><p class=\"\"><b>الحل في البيئة لا في الإرادة:<\/b> الإدمان الرقمي له شق إيماني، لكن شقه الأكبر تصميم عصبي وخوارزمي يستغل دماغ المراهق، فعالجه بتغيير المحيط.<\/p><p class=\"\"><b>ابدأ بنفسك:<\/b> إن رآك الطلاب ممسكاً بهاتفك طوال اللقاء ضاعت الرسالة.<\/p>", "hookT": "المصيدة والساعة الرملية", "hook": "<p class=\"\">أحضر ساعة رملية أو مؤقت هاتف، واطلب من طالب أن يتصفح المقاطع القصيرة ستين ثانية، ثم اسأله: كم مقطعاً شاهدت؟ وما المعرفة الراسخة التي استفدتها لبناء مستقبلك؟ (النتيجة عادةً: تشتت ومتعة لحظية لا أثر لها).<\/p><p class=\"\"><b>أسئلة الاستثارة:<\/b><\/p><p class=\"\">إذا كانت دقيقة واحدة تسلب خمسة مشاهد وتشتت ذهنك، فماذا تصنع أربع ساعات يومياً؟ (أربع ساعات يومياً تعادل نحو شهرين كاملين من الوقت في كل سنة).<\/p><p class=\"\">آلاف المهندسين يُدفع لهم المليارات لهدف واحد: أن تبقى أمام الشاشة. فهل تقبل أن تكون أنت السلعة؟<\/p>", "pts": "<article class=\"pt\"><h4><span>أولاً<\/span>الوقت أقسم الله به<\/h4><p class=\"ayah\">﴿وَالْعَصْرِ * إِنَّ الْإِنسَانَ لَفِي خُسْرٍ * إِلَّا الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ وَتَوَاصَوْا بِالْحَقِّ وَتَوَاصَوْا بِالصَّبْرِ﴾ [العصر: 1-3]<\/p><p class=\"\">أقسم الله بالعصر وهو الزمان، ثم حكم بالخسران على كل إنسان إلا من استثمر وقته في الإيمان والعمل الصالح، وتواصى مع غيره بالحق والصبر. ففي السورة أربعة أركان للنجاة، آخرها صحبة تعين على الثبات، فالثبات لا يكون فردياً.<\/p><\/article><article class=\"pt\"><h4><span>ثانياً<\/span>هجر اللغو من صفات المؤمنين<\/h4><p class=\"ayah\">﴿وَالَّذِينَ هُمْ عَنِ اللَّغْوِ مُّعْرِضُونَ﴾ [المؤمنون: 3]<\/p><p class=\"\">اللغو كل ما لا فائدة فيه في دين ولا دنيا. وفي زماننا تدخل فيه المقاطع التافهة والتصفح بلا هدف. ولا يعني ذلك حرمان الفتى من الترويح المباح، بل أن يكون قراره بيده لا بيد الخوارزمية.<\/p><\/article><article class=\"pt\"><h4><span>ثالثاً<\/span>لا فراغ في حياة المؤمن<\/h4><p class=\"ayah\">﴿فَإِذَا فَرَغْتَ فَانصَبْ * وَإِلَىٰ رَبِّكَ فَارْغَب﴾ [الشرح: 7-8]<\/p><p class=\"\">إذا فرغ المسلم من عمل نافع انتقل إلى غيره، فلا يترك فراغاً يملؤه التافه. والفراغ في ذاته نعمة يُغبن فيها كثير: قال رسول الله ﷺ: «نِعْمَتانِ مَغْبُونٌ فِيهِما كَثِيرٌ مِنَ النَّاسِ: الصِّحَّةُ والفَراغُ» رواه البخاري. والغبن أن تبيع الغالي (عمرك) بأبخس الأثمان (التفاهة الرقمية).<\/p><\/article><article class=\"pt\"><h4><span>رابعاً<\/span>اغتنام الشباب<\/h4><p class=\"had\">قال رسول الله ﷺ: «اغتَنِم خَمساً قبلَ خَمسٍ: شَبابَكَ قَبلَ هَرَمِكَ، وصِحَّتَكَ قَبلَ سَقَمِكَ، وغِناءكَ قَبلَ فَقرِكَ، وفَراغَكَ قَبلَ شُغلِكَ، وحَياتَكَ قَبلَ مَوتِكَ» رواه الحاكم وصححه<\/p><p class=\"\">خمس نعم لا نشعر بقيمتها إلا إذا فقدناها. ومن هنا نفهم أن الوقت لا يُستردّ، وأن كل ساعة تمر هي من رأس مالك.<\/p><\/article><article class=\"pt\"><h4><span>خامساً<\/span>قواعد عملية لاستعادة الانتباه<\/h4><div class=\"tw\"><table><tr><th><b>القاعدة<\/b><\/th><th><b>معناها<\/b><\/th><th><b>تطبيق للفتى<\/b><\/th><\/tr><tr><td><b>التحسين بنسبة 1% يومياً<\/b><\/td><td>الخطوات الصغيرة المتراكمة تصنع تحولاً كبيراً<\/td><td>قراءة صفحة واحدة يومياً ثم زيادتها<\/td><\/tr><tr><td><b>الهوية قبل الهدف<\/b><\/td><td>السلوك الذي لا يوافق هويتك لا يدوم<\/td><td>«أنا شاب موقن، أملك هاتفي ولا يملكني»<\/td><\/tr><tr><td><b>اجعلها خفية<\/b><\/td><td>أبعد المثير عن نظرك<\/td><td>إخراج الهاتف من غرفة النوم والمذاكرة<\/td><\/tr><tr><td><b>اجعلها صعبة<\/b><\/td><td>ضع حاجزاً بينك وبين العادة السيئة<\/td><td>حذف التطبيق وإلغاء الإشعارات<\/td><\/tr><tr><td><b>اجعلها غير جذابة<\/b><\/td><td>قلّل بريق المحفز<\/td><td>تحويل الشاشة للأبيض والأسود<\/td><\/tr><\/table><\/div><\/article><article class=\"pt\"><h4><span>سادساً<\/span>الاستمرار خير من الاندفاع<\/h4><p class=\"\">سُئل النبي ﷺ: أي الأعمال أحب إلى الله؟ قال: «أدْوَمُها وإنْ قَلَّ» متفق عليه. فمن بدأ بقفزة مفاجئة لا تطيقها نفسه انتكس بعد أيام. والحل أن يبدأ بدقيقتين أو صفحة واحدة ويثبّتها قبل أن يزيد.<\/p><\/article><article class=\"pt\"><h4><span>سابعاً<\/span>نموذجان من السيرة<\/h4><p class=\"\"><b>اليوم النبوي:<\/b> كان يوم النبي ﷺ مقسماً بوعي عالٍ بين ربه وأهله وأمته وشؤون التعليم والغزوات، فلم تكن فيه لحظة عابثة ولا فراغ مهدور، ومع ذلك كان أرفق الناس وأبشهم وجهاً.<\/p><p class=\"\"><b>زيد بن ثابت رضي الله عنه:<\/b> أمره النبي ﷺ أن يتعلم كتابة اليهود ولغتهم ليأمن مكرهم، فتعلمها في نحو خمس عشرة ليلة، بفضل التركيز الصافي والهمة العالية، وكان فتى حينها.<\/p><\/article>", "qa": "<div class=\"tw\"><table><tr><th><b>السؤال المتوقع<\/b><\/th><th><b>تفكيكه<\/b><\/th><\/tr><tr><td><b>أشعر بإدمان شديد للمقاطع القصيرة، فهل هذا نقص في ديني؟<\/b><\/td><td>له شق إيماني، لكن شقه الأكبر تصميم عصبي وخوارزمي يستغل دماغك. والعلاج لا يكون بجلد الذات، بل بإعادة هندسة البيئة: حذف التطبيق، وإلغاء الإشعارات، ووضع الهاتف في غرفة أخرى.<\/td><\/tr><tr><td><b>التكنولوجيا ضرورية لحياتنا ودراستنا، فكيف نتركها؟<\/b><\/td><td>لا ندعو إلى ترك التقنية بل إلى السيادة عليها، لتكون خادماً لك وأداة لنفعك، لا أن تكون أنت السلعة التي تحركها خوارزميات الشركات.<\/td><\/tr><tr><td><b>أضع جداول صارمة لكنني أنتكس بعد أيام<\/b><\/td><td>لأنك تبدأ بقفزات لا تطيقها النفس. ابدأ بدقيقتين أو صفحة واحدة وثبّتها قبل أن تزيد، عملاً بهدي: «أدومها وإن قل».<\/td><\/tr><\/table><\/div>", "radar": "<p class=\"\"><b>مؤشرات الخطر:<\/b> إجهاد رقمي حاد، وفوات صلاة الفجر المتكرر بسبب السهر، ونوبات قلق وتوتر عند سحب الهاتف لساعة واحدة، وتراجع دراسي مفاجئ.<\/p><p class=\"\"><b>بروتوكول التدخل:<\/b><\/p><p class=\"step\"><b>1. <\/b>جلسة احتواء بعيداً عن إشعاره بالذنب أو التوبيخ.<\/p><p class=\"step\"><b>2. <\/b>افحص زمن الشاشة معه ليرى الحقيقة بالأرقام المجردة.<\/p><p class=\"step\"><b>3. <\/b>اتفقا على خطوة واحدة قابلة للتطبيق، مثل ألا يدخل الهاتف غرفة النوم بعد الحادية عشرة مساءً.<\/p>", "actT": "«إنقاذ خالد»  نشاط ذهني وتخطيطي", "act": "<p class=\"step\"><b>1. التقسيم:<\/b> ثلاث مجموعات: فرسان الانتباه، وبناة العادات، وحراس الوقت.<\/p><p class=\"step\"><b>2. الحالة:<\/b> خالد يسهر يومياً إلى الثانية ليلاً على الهاتف، ويتشتت كل خمس دقائق أثناء المذاكرة، وتضيع عليه صلاة الفجر.<\/p><p class=\"step\"><b>3. المهمة:<\/b> فرسان الانتباه يهندسون البيئة (إخراج الهاتف من الغرفة وقت النوم والمذاكرة). وبناة العادات يصممون عادة بديلة (قراءة ثلاث صفحات يومياً). وحراس الوقت يكتبون إعلان الهوية الجديد وجدولاً بسيطاً.<\/p><p class=\"step\"><b>4. العرض:<\/b> تقدم كل مجموعة خطتها، ثم تُدمج الخطط في «خطة إنقاذ» واحدة.<\/p><p class=\"step\"><b>5. الخلوة الفردية:<\/b> يعبّئ كل طالب البطاقة لنفسه:<\/p><div class=\"tw\"><table><tr><th colspan=\"2\"><b>بطاقة: هندسة البيئة الرقمية وتحدي 1%<\/b><\/th><\/tr><tr><td><b>1. أكبر مصدر تشتت عندي<\/b><\/td><td>............................<\/td><\/tr><tr><td><b>2. تعديل البيئة الذي سأنفذه الليلة<\/b><\/td><td>............................<\/td><\/tr><tr><td><b>3. العادة البديلة (بنسبة 1%)<\/b><\/td><td>............................<\/td><\/tr><tr><td><b>4. إعلان الهوية<\/b><\/td><td>«أنا شاب موقن، أملك هاتفي ولا يملكني»<\/td><\/tr><\/table><\/div>", "week": "<p class=\"\"><b>صيام الشاشات:<\/b> مقاطعة المقاطع القصيرة والألعاب ساعتين متواصلتين يومياً قبل النوم، وإخراج الهاتف كلياً من غرفة النوم ليلاً.<\/p><p class=\"\"><b>عادة 1%:<\/b> قراءة ثلاث صفحات من كتاب نافع أو من القرآن يومياً في هذا الوقت المفرّغ من الشاشات.<\/p><p class=\"\"><b>جسر إلى اللقاء السادس:<\/b> بعد أن تعلمنا الغاية والعقل والفلتر والانتباه، سنجمع ذلك كله في وثيقة واحدة: «الدستور الشخصي».<\/p>", "kq": "إدارة حرب الانتباه ومواجهة الفراغ والسيولة الرقمية", "brief": "<div class=\"plan\"><span>اقتراح لتوزيع الوقت (١٠–١٥ د)<\/span><b>افتتاح ٣<\/b><b>محاور ٥<\/b><b>حوار ٢<\/b><b>نشاط ٣<\/b><b>ختام ٢<\/b><\/div><section class=\"bs\"><h3>١ · الافتتاح: المصيدة والساعة الرملية<\/h3><p class=\"\">أحضر ساعة رملية أو مؤقت هاتف، واطلب من طالب أن يتصفح المقاطع القصيرة ستين ثانية، ثم اسأله: كم مقطعاً شاهدت؟ وما المعرفة الراسخة التي استفدتها لبناء مستقبلك؟ (النتيجة عادةً: تشتت ومتعة لحظية لا أثر لها).<\/p><p class=\"\"><b>أسئلة الاستثارة:<\/b><\/p><p class=\"\">إذا كانت دقيقة واحدة تسلب خمسة مشاهد وتشتت ذهنك، فماذا تصنع أربع ساعات يومياً؟ (أربع ساعات يومياً تعادل نحو شهرين كاملين من الوقت في كل سنة).<\/p><p class=\"\">آلاف المهندسين يُدفع لهم المليارات لهدف واحد: أن تبقى أمام الشاشة. فهل تقبل أن تكون أنت السلعة؟<\/p><\/section><section class=\"bs\"><h3>٢ · المحاور<\/h3><article class=\"pt\"><h4><span>١<\/span>الوقت أقسم الله به<\/h4><p class=\"ayah\">﴿وَالْعَصْرِ * إِنَّ الْإِنسَانَ لَفِي خُسْرٍ * إِلَّا الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ وَتَوَاصَوْا بِالْحَقِّ وَتَوَاصَوْا بِالصَّبْرِ﴾ [العصر: 1-3]<\/p><p class=\"g\">رأس مال الإنسان عمره، وتضييعه خسران مبين.<\/p><details class=\"more\"><summary>للتوسع<\/summary><p class=\"\">أقسم الله بالعصر وهو الزمان، ثم حكم بالخسران على كل إنسان إلا من استثمر وقته في الإيمان والعمل الصالح، وتواصى مع غيره بالحق والصبر. ففي السورة أربعة أركان للنجاة، آخرها صحبة تعين على الثبات، فالثبات لا يكون فردياً.<\/p><\/details><\/article><article class=\"pt\"><h4><span>٢<\/span>هجر اللغو صفة المؤمنين<\/h4><p class=\"ayah\">﴿وَالَّذِينَ هُمْ عَنِ اللَّغْوِ مُّعْرِضُونَ﴾ [المؤمنون: 3]<\/p><p class=\"g\">اللغو يشمل التصفح الرقمي التافه بلا هدف.<\/p><details class=\"more\"><summary>للتوسع<\/summary><p class=\"\">اللغو كل ما لا فائدة فيه في دين ولا دنيا. وفي زماننا تدخل فيه المقاطع التافهة والتصفح بلا هدف. ولا يعني ذلك حرمان الفتى من الترويح المباح، بل أن يكون قراره بيده لا بيد الخوارزمية.<\/p><\/details><\/article><article class=\"pt\"><h4><span>٣<\/span>لا فراغ في حياة المؤمن<\/h4><p class=\"ayah\">﴿فَإِذَا فَرَغْتَ فَانصَبْ * وَإِلَىٰ رَبِّكَ فَارْغَب﴾ [الشرح: 7-8]<\/p><p class=\"g\">إ الفراغ السلبي مرتع للمشتتات، والمؤمن دائم البذل.<\/p><details class=\"more\"><summary>للتوسع<\/summary><p class=\"\">إذا فرغ المسلم من عمل نافع انتقل إلى غيره، فلا يترك فراغاً يملؤه التافه. والفراغ في ذاته نعمة يُغبن فيها كثير: قال رسول الله ﷺ: «نِعْمَتانِ مَغْبُونٌ فِيهِما كَثِيرٌ مِنَ النَّاسِ: الصِّحَّةُ والفَراغُ» رواه البخاري. والغبن أن تبيع الغالي (عمرك) بأبخس الأثمان (التفاهة الرقمية).<\/p><\/details><\/article><article class=\"pt\"><h4><span>٤<\/span>اغتنام الشباب<\/h4><p class=\"had\">قال رسول الله ﷺ: «اغتَنِم خَمساً قبلَ خَمسٍ: شَبابَكَ قَبلَ هَرَمِكَ، وصِحَّتَكَ قَبلَ سَقَمِكَ، وغِناءكَ قَبلَ فَقرِكَ، وفَراغَكَ قَبلَ شُغلِكَ، وحَياتَكَ قَبلَ مَوتِكَ» رواه الحاكم وصححه<\/p><p class=\"g\">الحاكم) الوقت لا يسترد، والسيادة على التقنية ضرورة.<\/p><details class=\"more\"><summary>للتوسع<\/summary><p class=\"\">خمس نعم لا نشعر بقيمتها إلا إذا فقدناها. ومن هنا نفهم أن الوقت لا يُستردّ، وأن كل ساعة تمر هي من رأس مالك.<\/p><\/details><\/article><\/section><section class=\"bs\"><h3>٣ · سؤال للحوار<\/h3><p class=\"big\">كم ساعة تقضيها يوميا أمام الشاشة؟ وماذا تتمنى لو صرفتها؟<\/p><\/section><section class=\"bs\"><h3>٤ · نشاط تطبيقي<\/h3><p class=\"big\">تحدي  ٢٤ساعة بلا تصفح عشوائي، ثم اكتب ما أنجزته.<\/p><\/section><section class=\"bs\"><h3>أسئلة قد تُطرح<\/h3><details class=\"more\"><summary><b>أشعر بإدمان شديد للمقاطع القصيرة، فهل هذا نقص في ديني؟<\/b><\/summary><p>له شق إيماني، لكن شقه الأكبر تصميم عصبي وخوارزمي يستغل دماغك. والعلاج لا يكون بجلد الذات، بل بإعادة هندسة البيئة: حذف التطبيق، وإلغاء الإشعارات، ووضع الهاتف في غرفة أخرى.<\/p><\/details><details class=\"more\"><summary><b>التكنولوجيا ضرورية لحياتنا ودراستنا، فكيف نتركها؟<\/b><\/summary><p>لا ندعو إلى ترك التقنية بل إلى السيادة عليها، لتكون خادماً لك وأداة لنفعك، لا أن تكون أنت السلعة التي تحركها خوارزميات الشركات.<\/p><\/details><\/section><section class=\"bs warn\"><h3>رادار الحماية<\/h3><p><b>مؤشرات الخطر:<\/b> إجهاد رقمي حاد، وفوات صلاة الفجر المتكرر بسبب السهر، ونوبات قلق وتوتر عند سحب الهاتف لساعة واحدة، وتراجع دراسي مفاجئ.<\/p><small>البروتوكول كاملاً في تبويب «الكامل».<\/small><\/section><section class=\"bs\"><h3>٥ · رحلة الأسبوع<\/h3><p class=\"\"><b>صيام الشاشات:<\/b> مقاطعة المقاطع القصيرة والألعاب ساعتين متواصلتين يومياً قبل النوم، وإخراج الهاتف كلياً من غرفة النوم ليلاً.<\/p><p class=\"\"><b>عادة 1%:<\/b> قراءة ثلاث صفحات من كتاب نافع أو من القرآن يومياً في هذا الوقت المفرّغ من الشاشات.<\/p><p class=\"\"><b>جسر إلى اللقاء السادس:<\/b> بعد أن تعلمنا الغاية والعقل والفلتر والانتباه، سنجمع ذلك كله في وثيقة واحدة: «الدستور الشخصي».<\/p><\/section>", "slides": ["<div class=\"cn\">5<\/div><h2>الثبات في عصر المشتتات<\/h2><p class=\"q\">كيف ندير حرب الانتباه ونواجه السيولة الرقمية؟<\/p>", "<small>إضاءة استهلالية<\/small><h2>المصيدة والساعة الرملية<\/h2><ul><li class=\"frag\">إذا كانت دقيقة واحدة تسلب خمسة مشاهد وتشتت ذهنك، فماذا تصنع أربع ساعات يومياً؟ (أربع ساعات يومياً تعادل نحو شهرين كاملين من الوقت في كل سنة).<\/li><li class=\"frag\">آلاف المهندسين يُدفع لهم المليارات لهدف واحد: أن تبقى أمام الشاشة. فهل تقبل أن تكون أنت السلعة؟<\/li><\/ul>", "<small>1<\/small><h2>الوقت أقسم الله به<\/h2><p class=\"ayah\">﴿وَالْعَصْرِ * إِنَّ الْإِنسَانَ لَفِي خُسْرٍ * إِلَّا الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ وَتَوَاصَوْا بِالْحَقِّ وَتَوَاصَوْا بِالصَّبْرِ﴾ [العصر: 1-3]<\/p><p class=\"g frag\">رأس مال الإنسان عمره، وتضييعه خسران مبين.<\/p>", "<small>2<\/small><h2>هجر اللغو صفة المؤمنين<\/h2><p class=\"ayah\">﴿وَالَّذِينَ هُمْ عَنِ اللَّغْوِ مُّعْرِضُونَ﴾ [المؤمنون: 3]<\/p><p class=\"g frag\">اللغو يشمل التصفح الرقمي التافه بلا هدف.<\/p>", "<small>3<\/small><h2>لا فراغ في حياة المؤمن<\/h2><p class=\"ayah\">﴿فَإِذَا فَرَغْتَ فَانصَبْ * وَإِلَىٰ رَبِّكَ فَارْغَب﴾ [الشرح: 7-8]<\/p><p class=\"g frag\">إ الفراغ السلبي مرتع للمشتتات، والمؤمن دائم البذل.<\/p>", "<small>4<\/small><h2>اغتنام الشباب<\/h2><p class=\"had lg\">قال رسول الله ﷺ: «اغتَنِم خَمساً قبلَ خَمسٍ: شَبابَكَ قَبلَ هَرَمِكَ، وصِحَّتَكَ قَبلَ سَقَمِكَ، وغِناءكَ قَبلَ فَقرِكَ، وفَراغَكَ قَبلَ شُغلِكَ، وحَياتَكَ قَبلَ مَوتِكَ» رواه الحاكم وصححه<\/p><p class=\"g frag\">الحاكم) الوقت لا يسترد، والسيادة على التقنية ضرورة.<\/p>", "<small>سؤال للحوار<\/small><h2 class=\"big\">كم ساعة تقضيها يوميا أمام الشاشة؟ وماذا تتمنى لو صرفتها؟<\/h2>", "<small>نشاط تطبيقي<\/small><h2 class=\"big\">تحدي  ٢٤ساعة بلا تصفح عشوائي، ثم اكتب ما أنجزته.<\/h2>", "<small>سؤال وبرهان<\/small><details class=\"frag\"><summary><b>أشعر بإدمان شديد للمقاطع القصيرة، فهل هذا نقص في ديني؟<\/b><\/summary><p>له شق إيماني، لكن شقه الأكبر تصميم عصبي وخوارزمي يستغل دماغك. والعلاج لا يكون بجلد الذات، بل بإعادة هندسة البيئة: حذف التطبيق، وإلغاء الإشعارات، ووضع الهاتف في غرفة أخرى.<\/p><\/details><details class=\"frag\"><summary><b>التكنولوجيا ضرورية لحياتنا ودراستنا، فكيف نتركها؟<\/b><\/summary><p>لا ندعو إلى ترك التقنية بل إلى السيادة عليها، لتكون خادماً لك وأداة لنفعك، لا أن تكون أنت السلعة التي تحركها خوارزميات الشركات.<\/p><\/details><details class=\"frag\"><summary><b>أضع جداول صارمة لكنني أنتكس بعد أيام<\/b><\/summary><p>لأنك تبدأ بقفزات لا تطيقها النفس. ابدأ بدقيقتين أو صفحة واحدة وثبّتها قبل أن تزيد، عملاً بهدي: «أدومها وإن قل».<\/p><\/details>", "<small>ميدان التطبيق<\/small><h2>«إنقاذ خالد»  نشاط ذهني وتخطيطي<\/h2><ol><li class=\"frag\">1. التقسيم: ثلاث مجموعات: فرسان الانتباه، وبناة العادات، وحراس الوقت.<\/li><li class=\"frag\">2. الحالة: خالد يسهر يومياً إلى الثانية ليلاً على الهاتف، ويتشتت كل خمس دقائق أثناء المذاكرة، وتضيع عليه صلاة الفجر.<\/li><li class=\"frag\">3. المهمة: فرسان الانتباه يهندسون البيئة (إخراج الهاتف من الغرفة وقت النوم والمذاكرة).<\/li><li class=\"frag\">4. العرض: تقدم كل مجموعة خطتها، ثم تُدمج الخطط في «خطة إنقاذ» واحدة.<\/li><li class=\"frag\">5. الخلوة الفردية: يعبّئ كل طالب البطاقة لنفسه:<\/li><\/ol>", "<small>رحلة الأسبوع<\/small><ul><li class=\"frag\"><b>صيام الشاشات:<\/b> مقاطعة المقاطع القصيرة والألعاب ساعتين متواصلتين يومياً قبل النوم، وإخراج الهاتف كلياً من غرفة النوم ليلاً.<\/li><li class=\"frag\"><b>عادة 1%:<\/b> قراءة ثلاث صفحات من كتاب نافع أو من القرآن يومياً في هذا الوقت المفرّغ من الشاشات.<\/li><li class=\"frag\"><b>جسر إلى اللقاء السادس:<\/b> بعد أن تعلمنا الغاية والعقل والفلتر والانتباه، سنجمع ذلك كله في وثيقة واحدة: «الدستور الشخصي».<\/li><\/ul>"], "n": 5, "u": 0, "title": "الثبات في عصر المشتتات", "q": "كيف ندير حرب الانتباه ونواجه السيولة الرقمية؟", "dqq": "كم ساعة تقضيها يوميا أمام الشاشة؟ وماذا تتمنى لو صرفتها؟", "pact": "تحدي  ٢٤ساعة بلا تصفح عشوائي، ثم اكتب ما أنجزته."}, {"summary": "<p class=\"\">هذا لقاء التتويج: يجمع الفتى ما تعلمه في اللقاءات الخمسة السابقة في وثيقة مكتوبة هي «دستوره الشخصي»، يعاهد بها نفسه وربه، ويضع لها خارطة ثبات تعينه حين تضعف همته. فالنوايا الشفهية الجميلة تتبخر عند أول عاصفة، أما الميثاق المكتوب فمرجع في لحظات الضعف.<\/p><div class=\"tw\"><table><tr><th><b>المهارة المستهدفة<\/b><\/th><th><b>معناها العملي<\/b><\/th><\/tr><tr><td><b>التخطيط الاستراتيجي الشخصي<\/b><\/td><td>يحوّل مبادئه إلى أهداف وخطط سلوكية محددة<\/td><\/tr><tr><td><b>المسؤولية والوفاء بالعهد<\/b><\/td><td>يلزم نفسه بالسلوك القويم ويحاسبها<\/td><\/tr><tr><td><b>التركيب المعرفي<\/b><\/td><td>يدمج المعارف المتفرقة في منظومة عمل واحدة<\/td><\/tr><\/table><\/div>", "kit": "<p class=\"\"><b>راجع قبل اللقاء:<\/b> اجمع بطاقات اللقاءات السابقة (بوصلة حياتي، فحص الأفكار، شجرة البراهين، فلتر الشبهات، خطة الانتباه) ليرجع إليها كل طالب.<\/p><p class=\"\"><b>الدستور ليس شعاراً:<\/b> مواده قليلة وواضحة وقابلة للقياس، فالوثيقة الطويلة لا تُقرأ ولا تُنفذ.<\/p><p class=\"\"><b>ازرع الرحمة مع الصرامة:<\/b> وعد الله بالرضا لمن صدق، وهو يقبل المقصّر الراجع، فلا تجعل الدستور سبباً لجلد النفس.<\/p><p class=\"\"><b>اجعل اللحظة مهيبة:<\/b> قدّم الوثيقة بشكل أنيق وهدوء، فالأثر النفسي للميثاق يبدأ من احترام لحظته.<\/p>", "hookT": "وثيقة المدينة ومواثيق العظماء", "hook": "<p class=\"\">اعرض نموذج وثيقة تاريخية أنيقة مربوطة بشريط رسمي، ثم قل:<\/p><p class=\"\">عندما دخل النبي ﷺ المدينة لم يكتفِ بالنوايا الطيبة، بل كتب «وثيقة المدينة» ليحدد الهوية والحقوق والواجبات بدقة. لماذا تعتمد الأمم والجيوش والقادة على مواثيق مكتوبة ملزمة بدلاً من النوايا الشفهية؟<\/p><p class=\"\"><b>أسئلة الاستثارة:<\/b><\/p><p class=\"\">ما الذي يحدث للنوايا الشفهية الجميلة عند أول عاصفة من الشهوات أو ضغط الأقران؟ (تتبخر وتُنسى!).<\/p><p class=\"\">كيف يحميك «دستورك الشخصي المكتوب» ليكون مرجعيتك في أصعب لحظات ضعفك وتشتتك؟<\/p>", "pts": "<article class=\"pt\"><h4><span>أولاً<\/span>الوفاء بالعهد قيمة قرآنية<\/h4><p class=\"ayah\">﴿يَا أَيُّهَا الَّذِينَ آمَنُوا أَوْفُوا بِالْعُقُودِ﴾ [المائدة: 1]<\/p><p class=\"ayah\">﴿وَأَوْفُوا بِعَهْدِ اللَّهِ إِذَا عَاهَدتُّمْ وَلَا تَنقُضُوا الْأَيْمَانَ بَعْدَ تَوْكِيدِهَا وَقَدْ جَعَلْتُمُ اللَّهَ عَلَيْكُمْ كَفِيلًا﴾ [النحل: 91]<\/p><p class=\"\">العقد يشمل كل التزام، ومنه ما يلزم به الفتى نفسه أمام ربه. وقوله ﴿وَقَدْ جَعَلْتُمُ اللَّهَ عَلَيْكُمْ كَفِيلًا﴾ يجعل العهد مع النفس عهداً بين العبد وربه.<\/p><\/article><article class=\"pt\"><h4><span>ثانياً<\/span>الصدق في العهد رتبة الرجال<\/h4><p class=\"ayah\">﴿مِّنَ الْمُؤْمِنِينَ رِجَالٌ صَدَقُوا مَا عَاهَدُوا اللَّهَ عَلَيْهِ ۖ فَمِنْهُم مَّن قَضَىٰ نَحْبَهُ وَمِنْهُم مَّن يَنتَظِرُ ۖ وَمَا بَدَّلُوا تَبْدِيلًا﴾ [الأحزاب: 23]<\/p><p class=\"\">مدحت الآية الثابتين على العهد، وقسمتهم قسمين: من قضى نحبه وصدق حتى لقي الله، ومن ينتظر ولم يبدّل. فالمعيار هو الاستمرار بلا تبديل، لا لحظة الحماس الأولى.<\/p><\/article><article class=\"pt\"><h4><span>ثالثاً<\/span>الالتزام بالشروط المشروعة<\/h4><p class=\"had\">قال رسول الله ﷺ: «المُسْلِمُونَ علَى شُرُوطِهِمْ، إلَّا شَرْطًا حَرَّمَ حَلَالًا، أوْ أحَلَّ حَرامًا» رواه أبو داود والترمذي وصححه. فالمؤمن يلتزم بما أوجبه على نفسه ما دام في حدود الشرع. ولهذا يجب أن تكون مواد الدستور مشروعة وفي مقدور صاحبها.<\/p><\/article><article class=\"pt\"><h4><span>رابعاً<\/span>الدستور مع الرحمة والتسديد<\/h4><p class=\"\">حتى لا يتحول الميثاق إلى كمالية تقتل صاحبها، قال رسول الله ﷺ: «سَدِّدُوا وقارِبُوا، وأَبْشِرُوا، فإنَّه لَنْ يُدْخِلَ أحَدًا الجَنَّةَ عَمَلُهُ. قالوا: ولا أنْتَ يا رَسولَ اللَّهِ؟ قالَ: ولا أنا، إلَّا أنْ يَتَغَمَّدَنِي اللَّهُ بمَغْفِرَةٍ ورَحْمَةٍ» رواه البخاري ومسلم. فنسدد قدر استطاعتنا ونرجو الرحمة، ونعود بعد كل تقصير.<\/p><\/article><article class=\"pt\"><h4><span>خامساً<\/span>مواثيق الثبات في السيرة<\/h4><p class=\"\"><b>بيعة العقبة الثانية:<\/b> بايع رجال وفتيان الأنصار النبي ﷺ في جنح الليل بمكة، ولم تكن عاطفة عابرة بل ميثاقاً صريحاً على السمع والطاعة والنفقة والأمر بالمعروف والثبات ولو حاربتهم الدنيا كلها.<\/p><p class=\"\"><b>بيعة الرضوان:<\/b> ﴿لَّقَدْ رَضِيَ اللَّهُ عَنِ الْمُؤْمِنِينَ إِذْ يُبَايِعُونَكَ تَحْتَ الشَّجَرَةِ فَعَلِمَ مَا فِي قُلُوبِهِمْ فَأَنزَلَ السَّكِينَةَ عَلَيْهِمْ﴾ [الفتح: 18]. ميثاق الثبات الصادق وقت الأزمات يتبعه الرضا والسكينة.<\/p><\/article><article class=\"pt\"><h4><span>سادساً<\/span>أركان الدستور الخمسة (ثمرة الوحدة)<\/h4><div class=\"tw\"><table><tr><th><b>الركن<\/b><\/th><th><b>مأخوذ من<\/b><\/th><th><b>مادة نموذجية في الدستور<\/b><\/th><\/tr><tr><td><b>الغاية والهوية<\/b><\/td><td>اللقاء الأول<\/td><td>أنا عبد لله مستخلَف، وأقيس نجاحي برضاه<\/td><\/tr><tr><td><b>العقلية الناقدة<\/b><\/td><td>اللقاء الثاني<\/td><td>لا أقبل خبراً ولا أنشره قبل أن أتثبت منه<\/td><\/tr><tr><td><b>مرجعية الوحي<\/b><\/td><td>اللقاء الثالث<\/td><td>أخصص وقتاً يومياً للتدبر وأسأل ماذا تطلب مني الآية<\/td><\/tr><tr><td><b>حصن الفلتر<\/b><\/td><td>اللقاء الرابع<\/td><td>أمرر كل إشكال على الفلتر وأسأل أهل العلم<\/td><\/tr><tr><td><b>حماية الانتباه<\/b><\/td><td>اللقاء الخامس<\/td><td>أخرج الهاتف من غرفة نومي وأبدأ بعادة 1%<\/td><\/tr><\/table><\/div><\/article><article class=\"pt\"><h4><span>سابعاً<\/span>كيف نكتب مادة قابلة للتنفيذ؟<\/h4><p class=\"\"><b>قصيرة:<\/b> جملة واحدة واضحة.<\/p><p class=\"\"><b>قابلة للقياس:<\/b> «أقرأ ثلاث صفحات يومياً»، لا «سأقرأ كثيراً».<\/p><p class=\"\"><b>مشروعة ومقدورة:<\/b> لا أعد بما لا أستطيع.<\/p><p class=\"\"><b>بصيغة الهوية:<\/b> «أنا شاب أحفظ وقتي»، فهي أرسخ من «سأحاول».<\/p><p class=\"\"><b>مادة التعافي:<\/b> لا تفوّت العادة مرتين متتاليتين. إن فاتك يوم فعد في اليوم الذي بعده، فالانقطاع مرة خطأ والانقطاع مرتين بداية عادة جديدة. وبذلك يجمع الدستور بين الحزم والرحمة.<\/p><\/article>", "qa": "<div class=\"tw\"><table><tr><th><b>السؤال المتوقع<\/b><\/th><th><b>تفكيكه<\/b><\/th><\/tr><tr><td><b>هل أن أكتب دستوراً يعني أنني أعد نفسي بالكمال؟<\/b><\/td><td>لا. الدستور اتجاه لا كمال، وفيه مادة للتعافي. وقد علّمنا النبي ﷺ: «سددوا وقاربوا وأبشروا».<\/td><\/tr><tr><td><b>ماذا لو لم ألتزم ببند من بنوده؟<\/b><\/td><td>راجع البند: هل هو واضح ومقدور؟ ثم عدّله ولا تتركه. التوبة والعودة جزء من الميثاق نفسه.<\/td><\/tr><tr><td><b>لماذا أشهد أحداً على دستوري؟<\/b><\/td><td>الشاهد مصدر مراقبة ودعم، وقد قال الله ﴿وَتَعَاوَنُوا عَلَى الْبِرِّ وَالتَّقْوَىٰ﴾ [المائدة: 2]. ومن تواصى بالحق كان أثبت.<\/td><\/tr><\/table><\/div>", "radar": "<p class=\"\"><b>مؤشرات الخطر:<\/b> تهرب الفتى من كتابة أي التزام، أو كتابة مواد مبالغ فيها يعلم أنه لن ينفذها، أو الاستخفاف بالميثاق بالضحك والسخرية، أو إحباط شديد عند أول تقصير.<\/p><p class=\"\"><b>بروتوكول التدخل:<\/b><\/p><p class=\"step\"><b>1. <\/b>حاوره على انفراد لتفهم سبب التهرب: خوف من الفشل؟ تجربة سابقة؟<\/p><p class=\"step\"><b>2. <\/b>اطلب منه مادة واحدة صغيرة جداً بدلاً من خمس مواد.<\/p><p class=\"step\"><b>3. <\/b>اتفق معه على موعد قصير لمتابعة تنفيذها.<\/p>", "actT": "«ورشة الدستور الشخصي»  نشاط تطبيقي وتكاملي", "act": "<p class=\"step\"><b>1. التمهيد:<\/b> سلّم كل فتى وثيقة أنيقة عنوانها «الدستور الشخصي وخارطة الثبات».<\/p><p class=\"step\"><b>2. التقسيم:<\/b> ثلاث مجموعات: صائغو المواد (يكتبون المواد الخمس بصيغ قابلة للتنفيذ)، والمراجعون (يفحصون المواد: هل هي واضحة ومقدورة؟)، والشهود (يتدربون على صيغة الشهادة والمتابعة).<\/p><p class=\"step\"><b>3. الصياغة الفردية:<\/b> يعبّئ كل طالب وثيقته بصمت، مستعيناً ببطاقات اللقاءات السابقة.<\/p><p class=\"step\"><b>4. المراجعة الثنائية:<\/b> يتبادل كل طالب وثيقته مع زميل يراجعها، ثم يوقّع عليها شاهداً.<\/p><p class=\"step\"><b>5. الختام:<\/b> يتلو المشرف دعاء الثبات، وتُحفظ نسخة من كل وثيقة لدى المشرف للمتابعة.<\/p><div class=\"tw\"><table><tr><th colspan=\"2\"><b>وثيقة: الدستور الشخصي وخارطة الثبات<\/b><\/th><\/tr><tr><td><b>الديباجة<\/b><\/td><td>أنا ............ أعاهد الله ثم نفسي على ما يلي<\/td><\/tr><tr><td><b>المادة 1: الغاية<\/b><\/td><td>............................<\/td><\/tr><tr><td><b>المادة 2: العقل<\/b><\/td><td>............................<\/td><\/tr><tr><td><b>المادة 3: الوحي<\/b><\/td><td>............................<\/td><\/tr><tr><td><b>المادة 4: الفلتر<\/b><\/td><td>............................<\/td><\/tr><tr><td><b>المادة 5: الانتباه<\/b><\/td><td>............................<\/td><\/tr><tr><td><b>مادة التعافي<\/b><\/td><td>إن فاتني يوم عدت في اليوم التالي ولم أفوّته مرتين<\/td><\/tr><tr><td><b>التوقيع والشاهد<\/b><\/td><td>الاسم: ............ التاريخ: ............ الشاهد: ............<\/td><\/tr><\/table><\/div>", "week": "<p class=\"\"><b>قراءة الدستور:<\/b> يقرأ الطالب دستوره كل صباح قبل أن يمسك هاتفه.<\/p><p class=\"\"><b>متابعة الشاهد:<\/b> يلتقي كل طالب بشاهده مرة في الأسبوع لخمس دقائق يراجعان فيها التزام المواد.<\/p><p class=\"\"><b>مادة واحدة مكثفة:<\/b> يختار أصعب مادة عنده ويبذل جهده في تثبيتها.<\/p><p class=\"\"><b>جسر إلى الوحدة الثانية:<\/b> الدستور يضع الاتجاه، والعادات تصنع المسير. وفي «صناعة الذات وهندسة العادات» سنتعلم كيف نحوّل مواد الدستور إلى سلوك يومي ثابت.<\/p>", "kq": "جلسة تطبيقية وتكاملية تختم الوحدة الأولى", "brief": "<div class=\"plan\"><span>اقتراح لتوزيع الوقت (١٠–١٥ د)<\/span><b>افتتاح ٣<\/b><b>محاور ٥<\/b><b>حوار ٢<\/b><b>نشاط ٣<\/b><b>ختام ٢<\/b><\/div><section class=\"bs\"><h3>١ · الافتتاح: وثيقة المدينة ومواثيق العظماء<\/h3><p class=\"\">اعرض نموذج وثيقة تاريخية أنيقة مربوطة بشريط رسمي، ثم قل:<\/p><p class=\"\">عندما دخل النبي ﷺ المدينة لم يكتفِ بالنوايا الطيبة، بل كتب «وثيقة المدينة» ليحدد الهوية والحقوق والواجبات بدقة. لماذا تعتمد الأمم والجيوش والقادة على مواثيق مكتوبة ملزمة بدلاً من النوايا الشفهية؟<\/p><p class=\"\"><b>أسئلة الاستثارة:<\/b><\/p><p class=\"\">ما الذي يحدث للنوايا الشفهية الجميلة عند أول عاصفة من الشهوات أو ضغط الأقران؟ (تتبخر وتُنسى!).<\/p><p class=\"\">كيف يحميك «دستورك الشخصي المكتوب» ليكون مرجعيتك في أصعب لحظات ضعفك وتشتتك؟<\/p><\/section><section class=\"bs\"><h3>٢ · المحاور<\/h3><article class=\"pt\"><h4><span>١<\/span>الوفاء بالعهد قيمة قرآنية<\/h4><p class=\"ayah\">﴿يَا أَيُّهَا الَّذِينَ آمَنُوا أَوْفُوا بِالْعُقُودِ﴾ [المائدة: 1]<\/p><p class=\"g\">الميثاق الشخصي عهد يلتزم به الفتى أمام ربه.<\/p><details class=\"more\"><summary>للتوسع<\/summary><p class=\"ayah\">﴿وَأَوْفُوا بِعَهْدِ اللَّهِ إِذَا عَاهَدتُّمْ وَلَا تَنقُضُوا الْأَيْمَانَ بَعْدَ تَوْكِيدِهَا وَقَدْ جَعَلْتُمُ اللَّهَ عَلَيْكُمْ كَفِيلًا﴾ [النحل: 91]<\/p><p class=\"\">العقد يشمل كل التزام، ومنه ما يلزم به الفتى نفسه أمام ربه. وقوله ﴿وَقَدْ جَعَلْتُمُ اللَّهَ عَلَيْكُمْ كَفِيلًا﴾ يجعل العهد مع النفس عهداً بين العبد وربه.<\/p><\/details><\/article><article class=\"pt\"><h4><span>٢<\/span>الصدق رتبة الرجال<\/h4><p class=\"ayah\">﴿مِّنَ الْمُؤْمِنِينَ رِجَالٌ صَدَقُوا مَا عَاهَدُوا اللَّهَ عَلَيْهِ ۖ فَمِنْهُم مَّن قَضَىٰ نَحْبَهُ وَمِنْهُم مَّن يَنتَظِرُ ۖ وَمَا بَدَّلُوا تَبْدِيلًا﴾ [الأحزاب: 23]<\/p><p class=\"g\">المعيار هو الاستمرار بلا تبديل عند الأزمات.<\/p><details class=\"more\"><summary>للتوسع<\/summary><p class=\"\">مدحت الآية الثابتين على العهد، وقسمتهم قسمين: من قضى نحبه وصدق حتى لقي الله، ومن ينتظر ولم يبدّل. فالمعيار هو الاستمرار بلا تبديل، لا لحظة الحماس الأولى.<\/p><\/details><\/article><article class=\"pt\"><h4><span>٣<\/span>الالتزام بالشروط المشروعة<\/h4><p class=\"had\">قال رسول الله ﷺ: «المُسْلِمُونَ علَى شُرُوطِهِمْ، إلَّا شَرْطًا حَرَّمَ حَلَالًا، أوْ أحَلَّ حَرامًا» رواه أبو داود والترمذي وصححه. فالمؤمن يلتزم بما أوجبه على نفسه ما دام في حدود الشرع. ولهذا يجب أن تكون مواد الدستور مشروعة وفي مقدور صاحبها.<\/p><p class=\"g\">يجب أن تكون مواد الدستور مقدورة وفي حدود الشرع.<\/p><details class=\"more\"><summary>للتوسع<\/summary><\/details><\/article><article class=\"pt\"><h4><span>٤<\/span>الدستور مع الرحمة والتسديد<\/h4><p class=\"g\">الدستور اتجاه لا كمال مطلق، والتعافي بعد التعثر جزء من الميثاق.<\/p><details class=\"more\"><summary>للتوسع<\/summary><p class=\"\">حتى لا يتحول الميثاق إلى كمالية تقتل صاحبها، قال رسول الله ﷺ: «سَدِّدُوا وقارِبُوا، وأَبْشِرُوا، فإنَّه لَنْ يُدْخِلَ أحَدًا الجَنَّةَ عَمَلُهُ. قالوا: ولا أنْتَ يا رَسولَ اللَّهِ؟ قالَ: ولا أنا، إلَّا أنْ يَتَغَمَّدَنِي اللَّهُ بمَغْفِرَةٍ ورَحْمَةٍ» رواه البخاري ومسلم. فنسدد قدر استطاعتنا ونرجو الرحمة، ونعود بعد كل تقصير.<\/p><\/details><\/article><\/section><section class=\"bs\"><h3>٣ · سؤال للحوار<\/h3><p class=\"big\">ما المبدأ الذي لا تتنازل عنه مهما كلف الأمر؟<\/p><\/section><section class=\"bs\"><h3>٤ · نشاط تطبيقي<\/h3><p class=\"big\">اكتب خمس مواد لدستورك الشخصي ووق عها أمام شاهد.<\/p><\/section><section class=\"bs\"><h3>أسئلة قد تُطرح<\/h3><details class=\"more\"><summary><b>هل أن أكتب دستوراً يعني أنني أعد نفسي بالكمال؟<\/b><\/summary><p>لا. الدستور اتجاه لا كمال، وفيه مادة للتعافي. وقد علّمنا النبي ﷺ: «سددوا وقاربوا وأبشروا».<\/p><\/details><details class=\"more\"><summary><b>ماذا لو لم ألتزم ببند من بنوده؟<\/b><\/summary><p>راجع البند: هل هو واضح ومقدور؟ ثم عدّله ولا تتركه. التوبة والعودة جزء من الميثاق نفسه.<\/p><\/details><\/section><section class=\"bs warn\"><h3>رادار الحماية<\/h3><p><b>مؤشرات الخطر:<\/b> تهرب الفتى من كتابة أي التزام، أو كتابة مواد مبالغ فيها يعلم أنه لن ينفذها، أو الاستخفاف بالميثاق بالضحك والسخرية، أو إحباط شديد عند أول تقصير.<\/p><small>البروتوكول كاملاً في تبويب «الكامل».<\/small><\/section><section class=\"bs\"><h3>٥ · رحلة الأسبوع<\/h3><p class=\"\"><b>قراءة الدستور:<\/b> يقرأ الطالب دستوره كل صباح قبل أن يمسك هاتفه.<\/p><p class=\"\"><b>متابعة الشاهد:<\/b> يلتقي كل طالب بشاهده مرة في الأسبوع لخمس دقائق يراجعان فيها التزام المواد.<\/p><p class=\"\"><b>مادة واحدة مكثفة:<\/b> يختار أصعب مادة عنده ويبذل جهده في تثبيتها.<\/p><p class=\"\"><b>جسر إلى الوحدة الثانية:<\/b> الدستور يضع الاتجاه، والعادات تصنع المسير. وفي «صناعة الذات وهندسة العادات» سنتعلم كيف نحوّل مواد الدستور إلى سلوك يومي ثابت.<\/p><\/section>", "slides": ["<div class=\"cn\">6<\/div><h2>صياغة «الدستور الشخصي» وخارطة الثبات<\/h2><p class=\"q\">كيف نحول المعارف إلى ميثاق عملي للحياة؟<\/p>", "<small>إضاءة استهلالية<\/small><h2>وثيقة المدينة ومواثيق العظماء<\/h2><ul><li class=\"frag\">ما الذي يحدث للنوايا الشفهية الجميلة عند أول عاصفة من الشهوات أو ضغط الأقران؟ (تتبخر وتُنسى!).<\/li><li class=\"frag\">كيف يحميك «دستورك الشخصي المكتوب» ليكون مرجعيتك في أصعب لحظات ضعفك وتشتتك؟<\/li><\/ul>", "<small>1<\/small><h2>الوفاء بالعهد قيمة قرآنية<\/h2><p class=\"ayah\">﴿يَا أَيُّهَا الَّذِينَ آمَنُوا أَوْفُوا بِالْعُقُودِ﴾ [المائدة: 1]<\/p><p class=\"g frag\">الميثاق الشخصي عهد يلتزم به الفتى أمام ربه.<\/p>", "<small>2<\/small><h2>الصدق رتبة الرجال<\/h2><p class=\"ayah lg\">﴿مِّنَ الْمُؤْمِنِينَ رِجَالٌ صَدَقُوا مَا عَاهَدُوا اللَّهَ عَلَيْهِ ۖ فَمِنْهُم مَّن قَضَىٰ نَحْبَهُ وَمِنْهُم مَّن يَنتَظِرُ ۖ وَمَا بَدَّلُوا تَبْدِيلًا﴾ [الأحزاب: 23]<\/p><p class=\"g frag\">المعيار هو الاستمرار بلا تبديل عند الأزمات.<\/p>", "<small>3<\/small><h2>الالتزام بالشروط المشروعة<\/h2><p class=\"had lg\">قال رسول الله ﷺ: «المُسْلِمُونَ علَى شُرُوطِهِمْ، إلَّا شَرْطًا حَرَّمَ حَلَالًا، أوْ أحَلَّ حَرامًا» رواه أبو داود والترمذي وصححه. فالمؤمن يلتزم بما أوجبه على نفسه ما دام في حدود الشرع. ولهذا يجب أن تكون مواد الدستور مشروعة وفي مقدور صاحبها.<\/p><p class=\"g frag\">يجب أن تكون مواد الدستور مقدورة وفي حدود الشرع.<\/p>", "<small>4<\/small><h2>الدستور مع الرحمة والتسديد<\/h2><p class=\"g frag\">الدستور اتجاه لا كمال مطلق، والتعافي بعد التعثر جزء من الميثاق.<\/p>", "<small>سؤال للحوار<\/small><h2 class=\"big\">ما المبدأ الذي لا تتنازل عنه مهما كلف الأمر؟<\/h2>", "<small>نشاط تطبيقي<\/small><h2 class=\"big\">اكتب خمس مواد لدستورك الشخصي ووق عها أمام شاهد.<\/h2>", "<small>سؤال وبرهان<\/small><details class=\"frag\"><summary><b>هل أن أكتب دستوراً يعني أنني أعد نفسي بالكمال؟<\/b><\/summary><p>لا. الدستور اتجاه لا كمال، وفيه مادة للتعافي. وقد علّمنا النبي ﷺ: «سددوا وقاربوا وأبشروا».<\/p><\/details><details class=\"frag\"><summary><b>ماذا لو لم ألتزم ببند من بنوده؟<\/b><\/summary><p>راجع البند: هل هو واضح ومقدور؟ ثم عدّله ولا تتركه. التوبة والعودة جزء من الميثاق نفسه.<\/p><\/details><details class=\"frag\"><summary><b>لماذا أشهد أحداً على دستوري؟<\/b><\/summary><p>الشاهد مصدر مراقبة ودعم، وقد قال الله ﴿وَتَعَاوَنُوا عَلَى الْبِرِّ وَالتَّقْوَىٰ﴾ [المائدة: 2]. ومن تواصى بالحق كان أثبت.<\/p><\/details>", "<small>ميدان التطبيق<\/small><h2>«ورشة الدستور الشخصي»  نشاط تطبيقي وتكاملي<\/h2><ol><li class=\"frag\">1. التمهيد: سلّم كل فتى وثيقة أنيقة عنوانها «الدستور الشخصي وخارطة الثبات».<\/li><li class=\"frag\">2. التقسيم: ثلاث مجموعات: صائغو المواد (يكتبون المواد الخمس بصيغ قابلة للتنفيذ)، والمراجعون (يفحصون المواد: هل هي واضحة ومقدورة؟)، والشهود (يتدربون…<\/li><li class=\"frag\">3. الصياغة الفردية: يعبّئ كل طالب وثيقته بصمت، مستعيناً ببطاقات اللقاءات السابقة.<\/li><li class=\"frag\">4. المراجعة الثنائية: يتبادل كل طالب وثيقته مع زميل يراجعها، ثم يوقّع عليها شاهداً.<\/li><li class=\"frag\">5. الختام: يتلو المشرف دعاء الثبات، وتُحفظ نسخة من كل وثيقة لدى المشرف للمتابعة.<\/li><\/ol>", "<small>رحلة الأسبوع<\/small><ul><li class=\"frag\"><b>قراءة الدستور:<\/b> يقرأ الطالب دستوره كل صباح قبل أن يمسك هاتفه.<\/li><li class=\"frag\"><b>متابعة الشاهد:<\/b> يلتقي كل طالب بشاهده مرة في الأسبوع لخمس دقائق يراجعان فيها التزام المواد.<\/li><li class=\"frag\"><b>مادة واحدة مكثفة:<\/b> يختار أصعب مادة عنده ويبذل جهده في تثبيتها.<\/li><li class=\"frag\"><b>جسر إلى الوحدة الثانية:<\/b> الدستور يضع الاتجاه، والعادات تصنع المسير. وفي «صناعة الذات وهندسة العادات» سنتعلم كيف نحوّل مواد الدستور إلى سلوك يومي ثابت.<\/li><\/ul>"], "n": 6, "u": 0, "title": "صياغة «الدستور الشخصي» وخارطة الثبات", "q": "كيف نحول المعارف إلى ميثاق عملي للحياة؟", "dqq": "ما المبدأ الذي لا تتنازل عنه مهما كلف الأمر؟", "pact": "اكتب خمس مواد لدستورك الشخصي ووق عها أمام شاهد."}, {"summary": "<p class=\"\">يقف الفتى كثيراً أمام حماس يشتعل ثم ينطفئ: يبدأ بقرارات كبيرة ثم ينتكس بعد أيام فيحتقر نفسه. يكتشف في هذا اللقاء أن السرّ ليس في ضعف الإرادة بل في طريقة البدء، وأن الخطوات الصغيرة المستمرة تتراكم حتى تصنع شخصية جديدة، وأن النظام اليومي أبقى أثراً من الهدف الكبير. ويخرج بقاعدة تحميه من الانتكاسة: لا يفوّت العادة مرتين متتاليتين.<\/p><p class=\"\">يفهم معنى التراكم الإيجابي وكيف يعمل مع الزمن.<\/p><p class=\"\">يبدأ بعادة صغيرة جداً يستطيع الثبات عليها في أسوأ أيامه.<\/p><p class=\"\">يتعامل مع التعثر بالعودة لا بجلد الذات.<\/p><div class=\"tw\"><table><tr><th><b>المهارة<\/b><\/th><th><b>معناها العملي<\/b><\/th><\/tr><tr><td><b>التراكم الإيجابي<\/b><\/td><td>يستثمر الخطوات الصغيرة المتكررة بدل القفزات المؤقتة<\/td><\/tr><tr><td><b>الصبر الاستراتيجي<\/b><\/td><td>يحتمل مرحلة غياب النتائج الظاهرة دون أن يتوقف<\/td><\/tr><tr><td><b>بناء الأنظمة اليومية<\/b><\/td><td>يصمم طقوساً يومية بسيطة تخدم أهدافه<\/td><\/tr><\/table><\/div>", "kit": "<p class=\"\"><b>ما يعيشه الفتى:<\/b> الفتى في هذه السن شديد التأثر بالمقاطع التحفيزية، فيقرر تغيير حياته كلها في ليلة واحدة، ثم يصطدم بالواقع في اليوم الثالث. وإذا فشل قال: «أنا لا أصلح»، فتتحول الانتكاسة إلى حكم على هويته.<\/p><p class=\"\"><b>لا تسخر من حماسه:<\/b> الحماس طاقة جميلة تحتاج إلى وعاء، فمهمتك أن تعلّمه كيف يستثمرها دون أن يحترق.<\/p><p class=\"\"><b>اجعل الصغر شرفاً:<\/b> قد يفهم الطالب البدء بدقيقتين تماطلاً. أقنعه بأن العادة التي لا وجود لها لا يمكن تحسينها، وأن الدقيقتين تؤسسان الهوية.<\/p><p class=\"\"><b>اعرض نموذجاً من نفسك:<\/b> احكِ عن عادة صغيرة التزمت بها فغيّرت شيئاً في حياتك، فالقصة الواقعية أبلغ من القاعدة.<\/p><p class=\"\"><b>راقب المثالية الخفية:<\/b> الطالب المتفوق قد يكون أكثر عرضة لجلد الذات إذا انكسر نظامه، فاحتفِ بالعودة أكثر من الاحتفاء بالتفوق.<\/p>", "hookT": "زياد ورامي في النادي", "hook": "<p class=\"\">اعرض القصة على الشاشة أو في بطاقات حوارية:<\/p><p class=\"\"><b>زياد (16 سنة)<\/b> استيقظ يوم الأحد بحماس عارم بعد مقطع تحفيزي، فذهب إلى النادي وأدى مئة تمرين ضغط دفعة واحدة حتى تمزقت عضلاته. في اليوم التالي استلقى في الفراش عاجزاً من الألم، وشعر بالإحباط، وتوقف تماماً بقية الشهر. أما <b>رامي (16 سنة)<\/b> فقرر أن يبدأ بتمرين ضغط واحد فقط يومياً بعد صلاة الفجر، مع زيادة تمرين واحد أسبوعياً بشرط ألا يقطع يوماً واحداً.<\/p><p class=\"\"><b>أسئلة الاستثارة:<\/b><\/p><p class=\"\">بعد ستة أشهر، من منهما يملك الجسد الأقوى؟ ومن منهما يملك «هوية الشاب الرياضي»؟<\/p><p class=\"\">لماذا نكرر جميعاً سلوك زياد في دراستنا وصلاتنا وعلاقتنا مع الله ثم ننتكس؟<\/p>", "pts": "<article class=\"pt\"><h4><span>أولاً<\/span>المجاهدة المستمرة سبيل الهداية<\/h4><p class=\"ayah\">﴿وَالَّذِينَ جَاهَدُوا فِينَا لَنَهْدِيَنَّهُمْ سُبُلَنَا وَإِنَّ اللَّهَ لَمَعَ الْمُحْسِنِينَ﴾ [العنكبوت: 69]<\/p><p class=\"\">المجاهدة في الآية بذل متجدد لا لحظة واحدة، والهداية جاءت جزاءً وفاقاً على هذا البذل، وختمت الآية بمعية الله للمحسنين. فالتوفيق ثمرة تتراكم من مجاهدة النفس في صغائر الأعمال وكبائرها، لا هبة تنزل بعد ليلة حماس.<\/p><\/article><article class=\"pt\"><h4><span>ثانياً<\/span>معيار الذرة<\/h4><p class=\"ayah\">﴿فَمَن يَعْمَلْ مِثْقَالَ ذَرَّةٍ خَيْرًا يَرَهُ * وَمَن يَعْمَلْ مِثْقَالَ ذَرَّةٍ شَرًّا يَرَهُ﴾ [الزلزلة: 7-8]<\/p><p class=\"\">أرست الشريعة معيار الذرة في بناء الشخصية، فلا يُحتقر عمل يسير دائم كصفحة من كتاب أو ركعة خفيفة، ولا يُستهان بهفوة صغيرة، فالجبال الشاهقة أصلها حصى متراكم. وقد قال النبي ﷺ لأبي ذر: «لاَ تَحْقِرَنَّ مِنَ المَعْرُوفِ شَيْئًا، وَلَوْ أَنْ تَلْقَى أَخَاكَ بِوَجْهٍ طَلْقٍ» رواه مسلم.<\/p><\/article><article class=\"pt\"><h4><span>ثالثاً<\/span>القليل الدائم مقدَّم على الكثير المنقطع<\/h4><p class=\"\">سُئل النبي ﷺ: أَيُّ الأَعْمَالِ أَحَبُّ إِلَى اللهِ؟ قَالَ: «أَدْوَمُهَا وَإِنْ قَلَّ» متفق عليه. وقال ﷺ: «سَدِّدُوا وَقَارِبُوا، وَاعْلَمُوا أَنْ لَنْ يُدْخِلَ أَحَدَكُمْ عَمَلُهُ الجَنَّةَ، وَأَنَّ أَحَبَّ الأَعْمَالِ إِلَى اللهِ أَدْوَمُهَا وَإِنْ قَلَّ» رواه البخاري. فالدوام يربي النفس على عبودية ثابتة وانضباط ذاتي. والسداد والمقاربة هما العلاج النبوي لوهم المثالية الصارمة الذي ينتهي بالانقطاع. وقال ﷺ: «إنَّ الدِّينَ يُسْرٌ، ولَنْ يُشادَّ الدِّينَ أحَدٌ إلَّا غَلَبَهُ» رواه البخاري، أي لا يتكلف أحد فوق طاقته إلا انكسر.<\/p><\/article><article class=\"pt\"><h4><span>رابعاً<\/span>دروس من السيرة<\/h4><p class=\"\"><b>عبد الله بن عمرو بن العاص رضي الله عنهما:<\/b> دخل في عبادة مجهدة وأراد صيام الدهر وختم القرآن كل ليلة، فردّه النبي ﷺ بالتدريج إلى القصد والاعتدال. فلما كبر وعجز قال: «يا ليتني قبلت رخصة رسول الله ﷺ». وفي ذلك درس بأن الاندفاع الأول قد يندم عليه صاحبه حين تضعف قوته.<\/p><p class=\"\"><b>التدرج في التشريع:<\/b> أخبرت عائشة رضي الله عنها أن أول ما نزل من القرآن سور فيها ذكر الجنة والنار، حتى إذا ثاب الناس إلى الإسلام نزل الحلال والحرام، ولو نزل أول شيء «لا تشربوا الخمر» لقالوا لا ندع الخمر أبداً. رواه البخاري. فالتغيير الدائم يبدأ بترسيخ الأساس ثم يتدرج.<\/p><\/article><article class=\"pt\"><h4><span>خامساً<\/span>خديعة الاندفاع وحساب التراكم<\/h4><div class=\"tw\"><table><tr><th><b>المعادلة<\/b><\/th><th><b>النتيجة<\/b><\/th><th><b>معناها<\/b><\/th><\/tr><tr><td><b>(1.01) مرفوعة للقوة 365<\/b><\/td><td>نحو 38 ضعفاً<\/td><td>التحسن بنسبة 1% يومياً يضاعف القدرة عشرات المرات في عام<\/td><\/tr><tr><td><b>(0.99) مرفوعة للقوة 365<\/b><\/td><td>نحو 0.03<\/td><td>التراجع بنسبة 1% يومياً ينحدر بك إلى الصفر تقريباً<\/td><\/tr><tr><td><b>4 صفحات يومياً<\/b><\/td><td>أكثر من 7 كتب في السنة<\/td><td>إنجاز كبير بلا إجهاد<\/td><\/tr><\/table><\/div><\/article><article class=\"pt\"><h4><span>سادساً<\/span>وادي الإحباط: لماذا يتوقف الشباب في المنتصف؟<\/h4><p class=\"\">يتوقع الفتى أن تظهر نتائج جهده في خط صاعد مباشر، لكن النتائج الحقيقية تتراكم تحت السطح قبل أن تظهر، كالبذرة التي تمتد جذورها في التربة سنوات ثم ينمو ساقها فجأة. وهنا يقع الإحباط فيتوقف الفتى قبل لحظة الظهور. والعلاج أن يعلم أن غياب النتائج المرئية لا يعني غياب التقدم، وأن مهمته الاستمرار.<\/p><\/article><article class=\"pt\"><h4><span>سابعاً<\/span>الأهداف الكبيرة والأنظمة اليومية<\/h4><p class=\"\">الهدف محطة وصول، أما النظام فهو السلوكيات الصغيرة التي تُمارس كل يوم. الركض خلف هدف مجرد دون نظام يورث القلق والعجز، أما التركيز على النظام الصغير فيمنح رضا وإنجازاً مستمراً. فبدل «سأحفظ القرآن» قل: «سأحفظ ثلاثة أسطر بعد الفجر». وإذا ربط الفتى عادته بهويته («أنا شاب قارئ») صارت أصعب على الانطفاء.<\/p><\/article>", "qa": "<div class=\"tw\"><table><tr><th><b>السؤال المتوقع<\/b><\/th><th><b>تفكيكه<\/b><\/th><\/tr><tr><td><b>أليس البدء بخطوة يسيرة كصفحة أو تمرين لدقيقتين تماطلاً ورضا بالدونية؟<\/b><\/td><td>الغاية الأولى ليست حجم النتيجة بل تثبيت عادة الحضور والهوية. فالعادة التي لا وجود لها يستحيل تحسينها، ودقيقتان يومياً ترسخ هويتك قارئاً أو رياضياً، ثم يأتي التوسيع تلقائياً.<\/td><\/tr><tr><td><b>ألا تتطلب المعالي طفرات كبرى بدل هذه الخطوات البطيئة؟<\/b><\/td><td>القفزات الكبيرة بلا أنظمة حماية تنتهي بالانكسار. والإنجازات العظيمة صُنعت من آلاف الساعات الهادئة غير المرئية من الانضباط في الأساسيات، لا من ومضات الحماس المؤقت.<\/td><\/tr><tr><td><b>إذا انكسرت العادة يوماً بسبب ظرف قاهر، هل يضيع التراكم وأبدأ من الصفر؟<\/b><\/td><td>لا. القاعدة الذهبية: لا تفوّت العادة مرتين متتاليتين. تفويت المرة الواحدة عارض بشري، أما المرتان فبداية عادة سلبية بديلة. فإذا تعثرت فعد في اليوم التالي ولو بالحد الأدنى.<\/td><\/tr><\/table><\/div>", "radar": "<p class=\"\"><b>مؤشرات الخطر:<\/b> دورة «حماس ثم انهيار ثم جلد للذات» المتكررة، وعبارات مثل «انكسر النظام ولا فائدة مني»، وتخلي الفتى عن عادات سابقة كلياً بعد تعثر واحد.<\/p><p class=\"\"><b>بروتوكول التدخل:<\/b><\/p><p class=\"step\"><b>1. <\/b>احتوِه بهدوء وافصل بين سلوكه وهويته: «لقد تعثرت اليوم، وهذا لا يعني أنك فاشل».<\/p><p class=\"step\"><b>2. <\/b>اطلب منه أن يصغّر عادته إلى حجم يستطيع الثبات عليه في أسوأ أيامه.<\/p><p class=\"step\"><b>3. <\/b>اتفق معه على موعد متابعة قصير بعد أسبوع ليحتفل بعودته.<\/p>", "actT": "«مختبر المكعبات»  نشاط حركي", "act": "<p class=\"step\"><b>1. الأدوات:<\/b> مئة مكعب صغير (أو أي قطع متراصة).<\/p><p class=\"step\"><b>2. التقسيم:<\/b> فريقان: فريق الطفرة (فريق زياد) وفريق التراكم (فريق رامي).<\/p><p class=\"step\"><b>3. المهمة:<\/b> يُطلب من فريق الطفرة بناء برج من خمسين مكعباً في أسرع وقت ممكن، ويضع فريق التراكم مكعباً واحداً كل ثلاث ثوانٍ بتأنٍّ وثبات على مدى دقيقتين.<\/p><p class=\"step\"><b>4. الربط التربوي:<\/b> غالباً ينهار برج الطفرة لانعدام الاتزان، ويكتمل برج التراكم بثبات. اسأل: ماذا يخبرنا هذا عن بناء الشخصية؟<\/p><p class=\"step\"><b>5. دراسة حالة:<\/b> ياسين، يضع في بداية كل عام جدولاً صارماً (استيقاظ 4:30، ست ساعات مذاكرة، جزء حفظ شهرياً، وجري 5 كم). ينجح ثلاثة أيام، ثم يتعثر في الرابع فيقول: «انكسر النظام ولا فائدة مني» ويتوقف كلياً. تُفكك المجموعات الحالة: أين الخطأ؟ وما الجدول الذري البديل؟<\/p><p class=\"step\"><b>6. الخلوة الفردية:<\/b> يعبّئ كل طالب البطاقة:<\/p><div class=\"tw\"><table><tr><th colspan=\"2\"><b>بطاقة: عادتي الذرية<\/b><\/th><\/tr><tr><td><b>1. العادة التي أريد بناءها<\/b><\/td><td>............................<\/td><\/tr><tr><td><b>2. نسختها المصغّرة (دقيقتان)<\/b><\/td><td>............................<\/td><\/tr><tr><td><b>3. متى وأين أؤديها؟<\/b><\/td><td>بعد ............ في ............<\/td><\/tr><tr><td><b>4. هويتي الجديدة<\/b><\/td><td>«أنا شاب ............»<\/td><\/tr><tr><td><b>5. قاعدة التعافي<\/b><\/td><td>إن فاتني يوم عدت في اليوم التالي ولم أفوّت مرتين<\/td><\/tr><\/table><\/div><p class=\"\"><b>أدوار المجلس:<\/b> الميسّر الشاب (يدير المداخلات)، والمدوّن (يسجل المعادلات والمفاهيم)، والمعارض (يطرح اعتراضات الواقع)، وضابط الإيقاع (يلتزم بالفقرات).<\/p>", "week": "<p class=\"\"><b>تحدي الدقيقتين:<\/b> أداء العادة المصغّرة يومياً دون استثناء، وتسجيلها في جدول بسيط.<\/p><p class=\"\"><b>الزيادة التدريجية:<\/b> لا يزيد الطالب العادة إلا بعد أسبوع ثابت، وبمقدار صغير.<\/p><p class=\"\"><b>يوم العودة:<\/b> إن تعثر فليسجل «عدت» بدل «فشلت»، ويأتي بالجدول إلى اللقاء القادم.<\/p><p class=\"\"><b>جسر إلى اللقاء الثامن:<\/b> وكيف نحمي العادات الصغيرة من البيئة التي قد تُفسدها؟ هذا موضوع «هندسة البيئة والمحيط».<\/p>", "kq": "أثر الـ 1% والتراكم الإيجابي في بناء الشخصية", "brief": "<div class=\"plan\"><span>اقتراح لتوزيع الوقت (١٠–١٥ د)<\/span><b>افتتاح ٣<\/b><b>محاور ٥<\/b><b>حوار ٢<\/b><b>نشاط ٣<\/b><b>ختام ٢<\/b><\/div><section class=\"bs\"><h3>١ · الافتتاح: زياد ورامي في النادي<\/h3><p class=\"\">اعرض القصة على الشاشة أو في بطاقات حوارية:<\/p><p class=\"\"><b>زياد (16 سنة)<\/b> استيقظ يوم الأحد بحماس عارم بعد مقطع تحفيزي، فذهب إلى النادي وأدى مئة تمرين ضغط دفعة واحدة حتى تمزقت عضلاته. في اليوم التالي استلقى في الفراش عاجزاً من الألم، وشعر بالإحباط، وتوقف تماماً بقية الشهر. أما <b>رامي (16 سنة)<\/b> فقرر أن يبدأ بتمرين ضغط واحد فقط يومياً بعد صلاة الفجر، مع زيادة تمرين واحد أسبوعياً بشرط ألا يقطع يوماً واحداً.<\/p><p class=\"\"><b>أسئلة الاستثارة:<\/b><\/p><p class=\"\">بعد ستة أشهر، من منهما يملك الجسد الأقوى؟ ومن منهما يملك «هوية الشاب الرياضي»؟<\/p><p class=\"\">لماذا نكرر جميعاً سلوك زياد في دراستنا وصلاتنا وعلاقتنا مع الله ثم ننتكس؟<\/p><\/section><section class=\"bs\"><h3>٢ · المحاور<\/h3><article class=\"pt\"><h4><span>١<\/span>القليل الدائم مقدم على الكثير المنقطع<\/h4><p class=\"g\">بناء الشخصية يحتاج إلى أنظمة يومية صغيرة ومستمرة لا إلى قفزات مؤقتة.<\/p><details class=\"more\"><summary>للتوسع<\/summary><p class=\"\">سُئل النبي ﷺ: أَيُّ الأَعْمَالِ أَحَبُّ إِلَى اللهِ؟ قَالَ: «أَدْوَمُهَا وَإِنْ قَلَّ» متفق عليه. وقال ﷺ: «سَدِّدُوا وَقَارِبُوا، وَاعْلَمُوا أَنْ لَنْ يُدْخِلَ أَحَدَكُمْ عَمَلُهُ الجَنَّةَ، وَأَنَّ أَحَبَّ الأَعْمَالِ إِلَى اللهِ أَدْوَمُهَا وَإِنْ قَلَّ» رواه البخاري. فالدوام يربي النفس على عبودية ثابتة وانضباط ذاتي. والسداد والمقاربة هما العلاج النبوي لوهم المثالية الصارمة الذي ينتهي بالانقطاع. وقال ﷺ: «إنَّ الدِّينَ يُسْرٌ، ولَنْ يُشادَّ الدِّينَ أحَدٌ إلَّا غَلَبَهُ» رواه البخاري، أي لا يتكلف أحد فوق طاقته إلا انكسر.<\/p><\/details><\/article><article class=\"pt\"><h4><span>٢<\/span>المجاهدة المستمرة سبيل الهداية<\/h4><p class=\"ayah\">﴿وَالَّذِينَ جَاهَدُوا فِينَا لَنَهْدِيَنَّهُمْ سُبُلَنَا وَإِنَّ اللَّهَ لَمَعَ الْمُحْسِنِينَ﴾ [العنكبوت: 69]<\/p><p class=\"g\">هدي همس بلنا﴾ [العنكبوت]69 : التوفيق ثمرة تتراكم من مجاهدة النفس في صغائر الأعمال.<\/p><details class=\"more\"><summary>للتوسع<\/summary><p class=\"\">المجاهدة في الآية بذل متجدد لا لحظة واحدة، والهداية جاءت جزاءً وفاقاً على هذا البذل، وختمت الآية بمعية الله للمحسنين. فالتوفيق ثمرة تتراكم من مجاهدة النفس في صغائر الأعمال وكبائرها، لا هبة تنزل بعد ليلة حماس.<\/p><\/details><\/article><article class=\"pt\"><h4><span>٣<\/span>معيار الذرة والتراكم<\/h4><p class=\"ayah\">﴿فَمَن يَعْمَلْ مِثْقَالَ ذَرَّةٍ خَيْرًا يَرَهُ * وَمَن يَعْمَلْ مِثْقَالَ ذَرَّةٍ شَرًّا يَرَهُ﴾ [الزلزلة: 7-8]<\/p><p class=\"g\">تحسين أدائك بنسبة  %1يوميا يصنع فارقا ضخما على المدى الطويل.<\/p><details class=\"more\"><summary>للتوسع<\/summary><p class=\"\">أرست الشريعة معيار الذرة في بناء الشخصية، فلا يُحتقر عمل يسير دائم كصفحة من كتاب أو ركعة خفيفة، ولا يُستهان بهفوة صغيرة، فالجبال الشاهقة أصلها حصى متراكم. وقد قال النبي ﷺ لأبي ذر: «لاَ تَحْقِرَنَّ مِنَ المَعْرُوفِ شَيْئًا، وَلَوْ أَنْ تَلْقَى أَخَاكَ بِوَجْهٍ طَلْقٍ» رواه مسلم.<\/p><\/details><\/article><article class=\"pt\"><h4><span>٤<\/span>الدين يسر<\/h4><p class=\"g\">البخاري) الاندفاع العنيف ينتهي بالانقطاع، والتدرج هو الحل.<\/p><\/article><\/section><section class=\"bs\"><h3>٣ · سؤال للحوار<\/h3><p class=\"big\">لماذا ينطفئ حماسنا بعد أسبوع من البداية؟<\/p><\/section><section class=\"bs\"><h3>٤ · نشاط تطبيقي<\/h3><p class=\"big\">اختر عادة من دقيقتين وابدأها اليوم، وسجل أيامها في جدول.<\/p><\/section><section class=\"bs\"><h3>أسئلة قد تُطرح<\/h3><details class=\"more\"><summary><b>أليس البدء بخطوة يسيرة كصفحة أو تمرين لدقيقتين تماطلاً ورضا بالدونية؟<\/b><\/summary><p>الغاية الأولى ليست حجم النتيجة بل تثبيت عادة الحضور والهوية. فالعادة التي لا وجود لها يستحيل تحسينها، ودقيقتان يومياً ترسخ هويتك قارئاً أو رياضياً، ثم يأتي التوسيع تلقائياً.<\/p><\/details><details class=\"more\"><summary><b>ألا تتطلب المعالي طفرات كبرى بدل هذه الخطوات البطيئة؟<\/b><\/summary><p>القفزات الكبيرة بلا أنظمة حماية تنتهي بالانكسار. والإنجازات العظيمة صُنعت من آلاف الساعات الهادئة غير المرئية من الانضباط في الأساسيات، لا من ومضات الحماس المؤقت.<\/p><\/details><\/section><section class=\"bs warn\"><h3>رادار الحماية<\/h3><p><b>مؤشرات الخطر:<\/b> دورة «حماس ثم انهيار ثم جلد للذات» المتكررة، وعبارات مثل «انكسر النظام ولا فائدة مني»، وتخلي الفتى عن عادات سابقة كلياً بعد تعثر واحد.<\/p><small>البروتوكول كاملاً في تبويب «الكامل».<\/small><\/section><section class=\"bs\"><h3>٥ · رحلة الأسبوع<\/h3><p class=\"\"><b>تحدي الدقيقتين:<\/b> أداء العادة المصغّرة يومياً دون استثناء، وتسجيلها في جدول بسيط.<\/p><p class=\"\"><b>الزيادة التدريجية:<\/b> لا يزيد الطالب العادة إلا بعد أسبوع ثابت، وبمقدار صغير.<\/p><p class=\"\"><b>يوم العودة:<\/b> إن تعثر فليسجل «عدت» بدل «فشلت»، ويأتي بالجدول إلى اللقاء القادم.<\/p><p class=\"\"><b>جسر إلى اللقاء الثامن:<\/b> وكيف نحمي العادات الصغيرة من البيئة التي قد تُفسدها؟ هذا موضوع «هندسة البيئة والمحيط».<\/p><\/section>", "slides": ["<div class=\"cn\">7<\/div><h2>قوة التحسين المستمر<\/h2><p class=\"q\">كيف نتجنب الانتكاس بعد فترات الحماس؟<\/p>", "<small>إضاءة استهلالية<\/small><h2>زياد ورامي في النادي<\/h2><ul><li class=\"frag\">بعد ستة أشهر، من منهما يملك الجسد الأقوى؟ ومن منهما يملك «هوية الشاب الرياضي»؟<\/li><li class=\"frag\">لماذا نكرر جميعاً سلوك زياد في دراستنا وصلاتنا وعلاقتنا مع الله ثم ننتكس؟<\/li><\/ul>", "<small>1<\/small><h2>القليل الدائم مقدم على الكثير المنقطع<\/h2><p class=\"g frag\">بناء الشخصية يحتاج إلى أنظمة يومية صغيرة ومستمرة لا إلى قفزات مؤقتة.<\/p>", "<small>2<\/small><h2>المجاهدة المستمرة سبيل الهداية<\/h2><p class=\"ayah\">﴿وَالَّذِينَ جَاهَدُوا فِينَا لَنَهْدِيَنَّهُمْ سُبُلَنَا وَإِنَّ اللَّهَ لَمَعَ الْمُحْسِنِينَ﴾ [العنكبوت: 69]<\/p><p class=\"g frag\">هدي همس بلنا﴾ [العنكبوت]69 : التوفيق ثمرة تتراكم من مجاهدة النفس في صغائر الأعمال.<\/p>", "<small>3<\/small><h2>معيار الذرة والتراكم<\/h2><p class=\"ayah\">﴿فَمَن يَعْمَلْ مِثْقَالَ ذَرَّةٍ خَيْرًا يَرَهُ * وَمَن يَعْمَلْ مِثْقَالَ ذَرَّةٍ شَرًّا يَرَهُ﴾ [الزلزلة: 7-8]<\/p><p class=\"g frag\">تحسين أدائك بنسبة  %1يوميا يصنع فارقا ضخما على المدى الطويل.<\/p>", "<small>4<\/small><h2>الدين يسر<\/h2><p class=\"g frag\">البخاري) الاندفاع العنيف ينتهي بالانقطاع، والتدرج هو الحل.<\/p>", "<small>سؤال للحوار<\/small><h2 class=\"big\">لماذا ينطفئ حماسنا بعد أسبوع من البداية؟<\/h2>", "<small>نشاط تطبيقي<\/small><h2 class=\"big\">اختر عادة من دقيقتين وابدأها اليوم، وسجل أيامها في جدول.<\/h2>", "<small>سؤال وبرهان<\/small><details class=\"frag\"><summary><b>أليس البدء بخطوة يسيرة كصفحة أو تمرين لدقيقتين تماطلاً ورضا بالدونية؟<\/b><\/summary><p>الغاية الأولى ليست حجم النتيجة بل تثبيت عادة الحضور والهوية. فالعادة التي لا وجود لها يستحيل تحسينها، ودقيقتان يومياً ترسخ هويتك قارئاً أو رياضياً، ثم يأتي التوسيع تلقائياً.<\/p><\/details><details class=\"frag\"><summary><b>ألا تتطلب المعالي طفرات كبرى بدل هذه الخطوات البطيئة؟<\/b><\/summary><p>القفزات الكبيرة بلا أنظمة حماية تنتهي بالانكسار. والإنجازات العظيمة صُنعت من آلاف الساعات الهادئة غير المرئية من الانضباط في الأساسيات، لا من ومضات الحماس المؤقت.<\/p><\/details><details class=\"frag\"><summary><b>إذا انكسرت العادة يوماً بسبب ظرف قاهر، هل يضيع التراكم وأبدأ من الصفر؟<\/b><\/summary><p>لا. القاعدة الذهبية: لا تفوّت العادة مرتين متتاليتين. تفويت المرة الواحدة عارض بشري، أما المرتان فبداية عادة سلبية بديلة. فإذا تعثرت فعد في اليوم التالي ولو بالحد الأدنى.<\/p><\/details>", "<small>ميدان التطبيق<\/small><h2>«مختبر المكعبات»  نشاط حركي<\/h2><ol><li class=\"frag\">1. الأدوات: مئة مكعب صغير (أو أي قطع متراصة).<\/li><li class=\"frag\">2. التقسيم: فريقان: فريق الطفرة (فريق زياد) وفريق التراكم (فريق رامي).<\/li><li class=\"frag\">3. المهمة: يُطلب من فريق الطفرة بناء برج من خمسين مكعباً في أسرع وقت ممكن، ويضع فريق التراكم مكعباً واحداً كل ثلاث ثوانٍ بتأنٍّ وثبات على مدى دقيقتين.<\/li><li class=\"frag\">4. الربط التربوي: غالباً ينهار برج الطفرة لانعدام الاتزان، ويكتمل برج التراكم بثبات.<\/li><li class=\"frag\">5. دراسة حالة: ياسين، يضع في بداية كل عام جدولاً صارماً (استيقاظ 4:30، ست ساعات مذاكرة، جزء حفظ شهرياً، وجري 5 كم).<\/li><li class=\"frag\">6. الخلوة الفردية: يعبّئ كل طالب البطاقة:<\/li><\/ol>", "<small>رحلة الأسبوع<\/small><ul><li class=\"frag\"><b>تحدي الدقيقتين:<\/b> أداء العادة المصغّرة يومياً دون استثناء، وتسجيلها في جدول بسيط.<\/li><li class=\"frag\"><b>الزيادة التدريجية:<\/b> لا يزيد الطالب العادة إلا بعد أسبوع ثابت، وبمقدار صغير.<\/li><li class=\"frag\"><b>يوم العودة:<\/b> إن تعثر فليسجل «عدت» بدل «فشلت»، ويأتي بالجدول إلى اللقاء القادم.<\/li><li class=\"frag\"><b>جسر إلى اللقاء الثامن:<\/b> وكيف نحمي العادات الصغيرة من البيئة التي قد تُفسدها؟ هذا موضوع «هندسة البيئة والمحيط».<\/li><\/ul>"], "n": 7, "u": 1, "title": "قوة التحسين المستمر", "q": "كيف نتجنب الانتكاس بعد فترات الحماس؟", "dqq": "لماذا ينطفئ حماسنا بعد أسبوع من البداية؟", "pact": "اختر عادة من دقيقتين وابدأها اليوم، وسجل أيامها في جدول."}, {"summary": "<p class=\"\">يعتقد كثير من الفتيان أن مشكلتهم ضعف الإرادة، فيعاهدون أنفسهم ثم ينتكسون. يكتشفون في هذا اللقاء أن البيئة المحيطة بهم أقوى من الإرادة المجردة، وأن الصحبة والأماكن وما يدخل هواتفهم تشكّل أفكارهم وسلوكهم دون وعي. ويتعلمون كيف يصمم الإنسان محيطه ليصبح فعل الخير أسهل وفعل المشتت أصعب.<\/p><p class=\"\">يفهم قانون العدوى السلوكية وأثر الجليس.<\/p><p class=\"\">يتعلم قواعد تصميم الإشارات: أن يجعل الخير ظاهراً والمشتت خفياً.<\/p><p class=\"\">يعيد ترتيب هاتفه ومكان دراسته عملياً.<\/p><div class=\"tw\"><table><tr><th><b>المهارة<\/b><\/th><th><b>معناها العملي<\/b><\/th><\/tr><tr><td><b>الوعي ببيئة التأثير<\/b><\/td><td>يرصد ما يؤثر في سلوكه من صحبة ومحتوى ومكان<\/td><\/tr><tr><td><b>هندسة المحفزات<\/b><\/td><td>يغيّر الإشارات المحيطة بدل الاعتماد على المقاومة وحدها<\/td><\/tr><tr><td><b>الانتقاء الواعي للصحبة<\/b><\/td><td>يختار رفقته ومدخلاته الرقمية بمعيار هدفه<\/td><\/tr><\/table><\/div>", "kit": "<p class=\"\"><b>ما يعيشه الفتى:<\/b> الفتى في هذه المرحلة شديد الحساسية لرأي أقرانه ولا يريد أن يظهر بمظهر المنعزل. وهو يعيش في عالمين: مدرسة وأصدقاء، وهاتف يحمل عشرات المؤثرات التي يختارها له الآخرون.<\/p><p class=\"\"><b>لا تدعُ إلى القطيعة:<\/b> الهدف إعادة ترتيب دوائر القرب لا معاداة الزملاء. ميّز بين صديق الملازمة والتأثير وبين زميل البر والدعوة.<\/p><p class=\"\"><b>ابدأ بالمحيط الذي يملكه:<\/b> قد لا يملك الفتى غرفة مستقلة، لكنه يملك زاوية صغيرة وهاتفه، وهذه بداية كافية.<\/p><p class=\"\"><b>قدّم نفسك مثالاً:<\/b> إن رأى هاتفك مشتتاً في كل لحظة فلن يقتنع بحديثك عن البيئة.<\/p><p class=\"\"><b>احذر من الاستعلاء:<\/b> لا تجعل الفتى يظن أن من يتعرض للإغراء أقل منه إيماناً، فالأصل الفرار من الفتنة لا اختبار النفس بها.<\/p>", "hookT": "معضلة أمين", "hook": "<p class=\"\"><b>أمين (17 سنة)<\/b> متأخر دراسياً ويفوّت صلاة الفجر، ويشعر بالذنب والخذلان. عاهد نفسه ليلة الأحد أن يبدأ «صفحة جديدة»، فأقسم أنه سيذاكر أربع ساعات وسيستيقظ لصلاة الفجر. لكن هاتفه بجوار وسادته، وإشعاراته لا تنقطع، ومكتبه مغطى بالأوراق والألعاب، وأصدقاؤه يسهرون على المحادثات حتى الفجر.<\/p><p class=\"\"><b>أسئلة الاستثارة:<\/b><\/p><p class=\"\">هل المشكلة في إرادة أمين أم في غرفته المفخخة بالمشتتات؟<\/p><p class=\"\">لو أُجبر على الاستيقاظ في هذه الغرفة، كم يوماً سيصمد؟ وما الذي يجب أن يتغير أولاً؟<\/p>", "pts": "<article class=\"pt\"><h4><span>أولاً<\/span>الهندسة الاجتماعية في القرآن<\/h4><p class=\"ayah\">﴿وَاصْبِرْ نَفْسَكَ مَعَ الَّذِينَ يَدْعُونَ رَبَّهُم بِالْغَدَاةِ وَالْعَشِيِّ يُرِيدُونَ وَجْهَهُ ۖ وَلَا تَعْدُ عَيْنَاكَ عَنْهُمْ تُرِيدُ زِينَةَ الْحَيَاةِ الدُّنْيَا﴾ [الكهف: 28]<\/p><p class=\"\">لم يكتفِ التوجيه الرباني بالأمر بالصبر المجرد، بل قرنه بتحديد البيئة الاجتماعية: «مع الذين يدعون ربهم». فالعين والقلب يتشكلان بما يديمان النظر إليه ومجالسته. والصبر على الطاعة أيسر حين تكون في صحبة تعين عليها.<\/p><p class=\"ayah\">﴿وَقَدْ نَزَّلَ عَلَيْكُمْ فِي الْكِتَابِ أَنْ إِذَا سَمِعْتُمْ آيَاتِ اللَّهِ يُكْفَرُ بِهَا وَيُسْتَهْزَأُ بِهَا فَلَا تَقْعُدُوا مَعَهُمْ حَتَّىٰ يَخُوضُوا فِي حَدِيثٍ غَيْرِهِ ۚ إِنَّكُمْ إِذًا مِّثْلُهُمْ﴾ [النساء: 140]<\/p><p class=\"\">تقرير قرآني لقانون العدوى السلوكية: من بقي في بيئة موبوءة تشابه معها شيئاً فشيئاً. وقال تعالى: ﴿يَا أَيُّهَا الَّذِينَ آمَنُوا اتَّقُوا اللَّهَ وَكُونُوا مَعَ الصَّادِقِينَ﴾ [التوبة: 119]، فجعل الصحبة جزءاً من منظومة التقوى.<\/p><\/article><article class=\"pt\"><h4><span>ثانياً<\/span>الجليس يصنع الإنسان<\/h4><p class=\"had\">قال رسول الله ﷺ: «مَثَلُ الجَلِيسِ الصَّالِحِ وَالجَلِيسِ السَّوْءِ كَمَثَلِ صَاحِبِ المِسْكِ وَنَافِخِ الكِيرِ؛ فَصَاحِبُ المِسْكِ إِمَّا أَنْ يُحْذِيَكَ، وَإِمَّا أَنْ تَبْتَاعَ مِنْهُ، وَإِمَّا أَنْ تَجِدَ مِنْهُ رِيحًا طَيِّبَةً، وَنَافِخُ الكِيرِ إِمَّا أَنْ يُحْرِقَ ثِيَابَكَ، وَإِمَّا أَنْ تَجِدَ رِيحًا خَبِيثَةً» متفق عليه<\/p><p class=\"\">التأثر بالبيئة قانون حتمي: فأنت لا تستطيع أن تجلس عند صاحب المسك وتخرج بلا أثر، ولا عند الحداد وتخرج نقياً. وقال ﷺ: «الرَّجُلُ عَلَى دِينِ خَلِيلِهِ، فَلْيَنْظُرْ أَحَدُكُمْ مَنْ يُخَالِلُ» رواه أبو داود والترمذي.<\/p><\/article><article class=\"pt\"><h4><span>ثالثاً<\/span>تغيير الجغرافيا شرط للتوبة<\/h4><p class=\"\">في حديث الرجل الذي قتل تسعة وتسعين نفساً ثم أراد التوبة، قال له العالم: «انْطَلِقْ إِلَى أَرْضِ كَذَا وَكَذَا، فَإِنَّ بِهَا أُنَاسًا يَعْبُدُونَ اللهَ فَاعْبُدِ اللهَ مَعَهُمْ، وَلاَ تَرْجِعْ إِلَى أَرْضِكَ فَإِنَّهَا أَرْضُ سَوْءٍ» رواه مسلم. لم يكتفِ العالم بوعظ شفهي، بل اشترط تغيير المكان والمحيط، لأن البيئة القديمة تعيد إحياء العادات القديمة.<\/p><\/article><article class=\"pt\"><h4><span>رابعاً<\/span>الفرار من الفتنة هو الأصل<\/h4><p class=\"\">قال النبي ﷺ: «مَنْ سَمِعَ بِالدَّجَّالِ فَلْيَنْأَ عَنْهُ» رواه أبو داود. فالأصل تطهير البيئة والابتعاد عن مواطن الفتنة، لا تعريض النفس للاختبار استعلاءً بقوة موهومة. وهذا هو المعنى العملي لقاعدة سد الذرائع.<\/p><\/article><article class=\"pt\"><h4><span>خامساً<\/span>مشاهد من السيرة<\/h4><p class=\"\"><b>مصعب بن عمير رضي الله عنه:<\/b> ترك بيئة الترف والجاهلية في مكة وهاجر إلى بيئة الأنصار في المدينة، فبنى واقعاً إيمانياً جديداً وصار سفير الإسلام الأول فيها.<\/p><p class=\"\"><b>تأسيس المسجد والسوق في المدينة:<\/b> أدرك النبي ﷺ أن للمكان أثراً في صناعة الإنسان، فجعل المسجد بيئة للعبادة والأخوة، وجعل للمسلمين سوقاً يقوم على العدل ويحررهم من بيئة الربا والاحتكار.<\/p><\/article><article class=\"pt\"><h4><span>سادساً<\/span>خديعة قوة الإرادة وقوانين تصميم الإشارات<\/h4><p class=\"\">أصحاب الانضباط العالي ليسوا خارقين يصارعون المغريات طوال يومهم، بل مهندسون أذكياء لبيئاتهم يتعرضون للإغراء أقل بكثير من غيرهم.<\/p><div class=\"tw\"><table><tr><th><b>الهدف<\/b><\/th><th><b>القاعدة<\/b><\/th><th><b>مثال تطبيقي<\/b><\/th><\/tr><tr><td><b>بناء عادة حسنة<\/b><\/td><td>اجعل الإشارة مرئية ومباشرة<\/td><td>المصحف مفتوحاً على المكتب، والحذاء الرياضي أمام الباب<\/td><\/tr><tr><td><b>قطع عادة سيئة<\/b><\/td><td>اجعل الإشارة خفية وبعيدة المنال<\/td><td>الهاتف في غرفة أخرى، وإيقاف الإشعارات<\/td><\/tr><\/table><\/div><\/article><article class=\"pt\"><h4><span>سابعاً<\/span>الجليس الرقمي والعدوى الخفية<\/h4><p class=\"\">الفتى اليوم ليس نتاج رفاق المدرسة وحدهم، بل نتاج الحسابات التي يتابعها في هاتفه. فالمحتوى المتكرر يعيد ضبط ما يعده الدماغ مألوفاً وطبيعياً، ويصنع معاييره الذهنية لما هو مقبول أو منكر دون وعي مباشر. فاسأل نفسك: من هم الحسابات الخمسة الأكثر ظهوراً في هاتفي؟ وإلى أي شخص يصنعونني؟<\/p><\/article><article class=\"pt\"><h4><span>ثامناً<\/span>قاعدة «مكان واحد لسياق واحد»<\/h4><p class=\"\">لا تخلط بيئة الراحة ببيئة الجد: السرير للنوم، والمكتب للدراسة والمطالعة. بهذا يربط الدماغ تلقائياً بين دخول المكان وبدء السلوك المطلوب. ولو كان المكان صغيراً فخصص زاوية واحدة، أو طاولة في مكتبة عامة، أو ركناً هادئاً في المسجد.<\/p><\/article>", "qa": "<div class=\"tw\"><table><tr><th><b>السؤال المتوقع<\/b><\/th><th><b>تفكيكه<\/b><\/th><\/tr><tr><td><b>هل تعني هندسة البيئة اعتزال زملاء المدرسة وقطع العلاقات إن قصّروا في الصلاة؟<\/b><\/td><td>هناك فرق بين صديق الملازمة والتأثير وزميل البر والمعاملة والدعوة. لا تعادهم ولا تستعلِ عليهم، لكن انقلهم من دائرة الخلطة اليومية المقربة التي تصوغ أفكارك إلى دائرة الزمالة الطيبة والدعوة بالتي هي أحسن.<\/td><\/tr><tr><td><b>أعيش في مساحة ضيقة ومزدحمة، فكيف أهندس بيئتي؟<\/b><\/td><td>ابدأ من الحيز الصغير الخاص بك: زاوية ترتبها، أو طاولة في مكتبة، أو ركن في المسجد، وسماعة تحجب الضوضاء. والأهم أن بيئتك الرقمية في هاتفك تحت سيطرتك التامة.<\/td><\/tr><tr><td><b>أليس إخفاء التطبيقات ضعفاً؟ ألا ينبغي أن أدرب نفسي على المقاومة المباشرة؟<\/b><\/td><td>هذا فخ الكبر النفسي. قامت الشريعة على سد الذرائع والفرار من مواطن الفتنة. واستنزاف طاقتك في مقاومة إغراء متواصل يجعلك منهكاً عاجزاً عن الإنجاز، وإبعاد المشتت ذكاء وحماية لمستقبلك.<\/td><\/tr><tr><td><b>أنا أملك إرادة حديدية ولا تؤثر بي البيئة<\/b><\/td><td>الحديث النبوي أخبر عن قانون عام: «الرجل على دين خليله». والإرادة طاقة تنفد، أما البيئة فتعمل بلا انقطاع. فالأذكى أن تجعل البيئة حليفاً لا خصماً.<\/td><\/tr><\/table><\/div>", "radar": "<p class=\"\"><b>مؤشرات الخطر:<\/b> تعثر متكرر في المواضع نفسها، وفتور ملحوظ بعد الاختلاط بمجموعة معينة، وانشغال ذهني بمحتوى رقمي يتكرر في حديثه، وتبرير مستمر بعبارة «لا أستطيع ترك أصدقائي».<\/p><p class=\"\"><b>بروتوكول التدخل:<\/b><\/p><p class=\"step\"><b>1. <\/b>اجلس معه بعيداً عن المجموعة، وساعده على تسمية المؤثرات بنفسه دون أن تهاجم أصدقاءه.<\/p><p class=\"step\"><b>2. <\/b>اقترح عليه تعديلاً صغيراً واحداً في بيئته يطبقه خلال الأسبوع.<\/p><p class=\"step\"><b>3. <\/b>عرّفه على رفقة صالحة أو نشاط جماعي يوفر له بديلاً اجتماعياً قبل أن يفقد القديم.<\/p>", "actT": "«قبل وبعد: مختبر إعادة تصميم البيئة»  نشاط عملي", "act": "<p class=\"step\"><b>1. الأدوات:<\/b> استمارة ورقية تمثل «شاشة هاتف مفخخة بالمشتتات» و«مكتب فوضوي».<\/p><p class=\"step\"><b>2. المهمة الجماعية:<\/b> يعيد الطلاب تصميم الشاشة والمكتب بالنمط الجديد: إخفاء تطبيقات الترفيه في المجلد الأخير، وقصر الشاشة الأولى على القرآن والملاحظات والمنبه التعليمي، وتحديد مكان شحن الهاتف خارج غرفة النوم، وتجهيز كتب الدرس والمصحف على المكتب قبل النوم.<\/p><p class=\"step\"><b>3. دراسة حالة:<\/b> عمار (17 سنة) متفوق، لكنه كلما جلس للمذاكرة وجد نفسه بعد دقائق يتنقل بين المقاطع القصيرة لساعتين. التطبيق على صفحته الرئيسية، والإشعارات تنبثق باستمرار، وحسابه يتابع قنوات تعرض محتوى سريعاً. تحلل المجموعات: ما الإشارات التي تدفعه؟ وما التعديلات الثلاثة الأولى؟<\/p><p class=\"step\"><b>4. الخلوة الفردية:<\/b> يعبّئ كل طالب البطاقة بنفسه، ثم ينفذ التعديل الأول في الليلة نفسها.<\/p><div class=\"tw\"><table><tr><th colspan=\"2\"><b>بطاقة: إعادة تصميم بيئتي<\/b><\/th><\/tr><tr><td><b>1. أقوى مشتت في هاتفي<\/b><\/td><td>............................<\/td><\/tr><tr><td><b>2. تعديل رقمي سأنفذه الليلة<\/b><\/td><td>إخفاء / حذف / إيقاف الإشعارات: ............<\/td><\/tr><tr><td><b>3. زاوية الجد<\/b><\/td><td>مكان دراستي الثابت: ............................<\/td><\/tr><tr><td><b>4. إشارة الخير التي سأجعلها ظاهرة<\/b><\/td><td>............................<\/td><\/tr><tr><td><b>5. الجليس الذي سأقترب منه<\/b><\/td><td>............................<\/td><\/tr><\/table><\/div>", "week": "<p class=\"\"><b>ليلة الهاتف:<\/b> يبيت الهاتف خارج غرفة النوم طوال الأسبوع.<\/p><p class=\"\"><b>جرد الحسابات:<\/b> يراجع الطالب الحسابات التي يتابعها ويحذف ما يشتته أو يضره.<\/p><p class=\"\"><b>الجليس الصالح:<\/b> يدعو كل طالب رفيقاً صالحاً لنشاط مشترك (مذاكرة، صلاة جماعة، رياضة).<\/p><p class=\"\"><b>جسر إلى اللقاء التاسع:<\/b> وإذا هندسنا البيئة بقي عدو داخلي أخطر: التسويف الذي يؤجل البدء. وهذا موضوع «فك قيود التسويف».<\/p>", "kq": "أثر الصحبة والأماكن والمدخلات الرقمية في تشكيل الهوية", "brief": "<div class=\"plan\"><span>اقتراح لتوزيع الوقت (١٠–١٥ د)<\/span><b>افتتاح ٣<\/b><b>محاور ٥<\/b><b>حوار ٢<\/b><b>نشاط ٣<\/b><b>ختام ٢<\/b><\/div><section class=\"bs\"><h3>١ · الافتتاح: معضلة أمين<\/h3><p class=\"\"><b>أمين (17 سنة)<\/b> متأخر دراسياً ويفوّت صلاة الفجر، ويشعر بالذنب والخذلان. عاهد نفسه ليلة الأحد أن يبدأ «صفحة جديدة»، فأقسم أنه سيذاكر أربع ساعات وسيستيقظ لصلاة الفجر. لكن هاتفه بجوار وسادته، وإشعاراته لا تنقطع، ومكتبه مغطى بالأوراق والألعاب، وأصدقاؤه يسهرون على المحادثات حتى الفجر.<\/p><p class=\"\"><b>أسئلة الاستثارة:<\/b><\/p><p class=\"\">هل المشكلة في إرادة أمين أم في غرفته المفخخة بالمشتتات؟<\/p><p class=\"\">لو أُجبر على الاستيقاظ في هذه الغرفة، كم يوماً سيصمد؟ وما الذي يجب أن يتغير أولاً؟<\/p><\/section><section class=\"bs\"><h3>٢ · المحاور<\/h3><article class=\"pt\"><h4><span>١<\/span>الهندسة الاجتماعية وتأثير البيئة<\/h4><p class=\"ayah\">﴿وَاصْبِرْ نَفْسَكَ مَعَ الَّذِينَ يَدْعُونَ رَبَّهُم بِالْغَدَاةِ وَالْعَشِيِّ يُرِيدُونَ وَجْهَهُ ۖ وَلَا تَعْدُ عَيْنَاكَ عَنْهُمْ تُرِيدُ زِينَةَ الْحَيَاةِ الدُّنْيَا﴾ [الكهف: 28]<\/p><p class=\"g\">الصبر على الطاعة أيسر في الصحبة المعينة.<\/p><details class=\"more\"><summary>للتوسع<\/summary><p class=\"\">لم يكتفِ التوجيه الرباني بالأمر بالصبر المجرد، بل قرنه بتحديد البيئة الاجتماعية: «مع الذين يدعون ربهم». فالعين والقلب يتشكلان بما يديمان النظر إليه ومجالسته. والصبر على الطاعة أيسر حين تكون في صحبة تعين عليها.<\/p><p class=\"ayah\">﴿وَقَدْ نَزَّلَ عَلَيْكُمْ فِي الْكِتَابِ أَنْ إِذَا سَمِعْتُمْ آيَاتِ اللَّهِ يُكْفَرُ بِهَا وَيُسْتَهْزَأُ بِهَا فَلَا تَقْعُدُوا مَعَهُمْ حَتَّىٰ يَخُوضُوا فِي حَدِيثٍ غَيْرِهِ ۚ إِنَّكُمْ إِذًا مِّثْلُهُمْ﴾ [النساء: 140]<\/p><p class=\"\">تقرير قرآني لقانون العدوى السلوكية: من بقي في بيئة موبوءة تشابه معها شيئاً فشيئاً. وقال تعالى: ﴿يَا أَيُّهَا الَّذِينَ آمَنُوا اتَّقُوا اللَّهَ وَكُونُوا مَعَ الصَّادِقِينَ﴾ [التوبة: 119]، فجعل الصحبة جزءاً من منظومة التقوى.<\/p><\/details><\/article><article class=\"pt\"><h4><span>٢<\/span>الجليس يصنع الإنسان<\/h4><p class=\"had\">قال رسول الله ﷺ: «مَثَلُ الجَلِيسِ الصَّالِحِ وَالجَلِيسِ السَّوْءِ كَمَثَلِ صَاحِبِ المِسْكِ وَنَافِخِ الكِيرِ؛ فَصَاحِبُ المِسْكِ إِمَّا أَنْ يُحْذِيَكَ، وَإِمَّا أَنْ تَبْتَاعَ مِنْهُ، وَإِمَّا أَنْ تَجِدَ مِنْهُ رِيحًا طَيِّبَةً، وَنَافِخُ الكِيرِ إِمَّا أَنْ يُحْرِقَ ثِيَابَكَ، وَإِمَّا أَنْ تَجِدَ رِيحًا خَبِيثَةً» متفق عليه<\/p><p class=\"g\">الترمذي) الجليس الواقعي والرقمي يعيد صياغة أفكارك ومعاييرك.<\/p><details class=\"more\"><summary>للتوسع<\/summary><p class=\"\">التأثر بالبيئة قانون حتمي: فأنت لا تستطيع أن تجلس عند صاحب المسك وتخرج بلا أثر، ولا عند الحداد وتخرج نقياً. وقال ﷺ: «الرَّجُلُ عَلَى دِينِ خَلِيلِهِ، فَلْيَنْظُرْ أَحَدُكُمْ مَنْ يُخَالِلُ» رواه أبو داود والترمذي.<\/p><\/details><\/article><article class=\"pt\"><h4><span>٣<\/span>الفرار من الفتنة<\/h4><p class=\"g\">الأصل تطهير البيئة وإخفاء المشتتات لا اختبار قوة الإرادة أمامها.<\/p><details class=\"more\"><summary>للتوسع<\/summary><p class=\"\">قال النبي ﷺ: «مَنْ سَمِعَ بِالدَّجَّالِ فَلْيَنْأَ عَنْهُ» رواه أبو داود. فالأصل تطهير البيئة والابتعاد عن مواطن الفتنة، لا تعريض النفس للاختبار استعلاءً بقوة موهومة. وهذا هو المعنى العملي لقاعدة سد الذرائع.<\/p><\/details><\/article><article class=\"pt\"><h4><span>٤<\/span>العدوى السلوكية<\/h4><p class=\"g\">البقاء في بيئة سلبية يؤدي للتشابه معها.<\/p><details class=\"more\"><summary>للتوسع<\/summary><p class=\"\"><b>مصعب بن عمير رضي الله عنه:<\/b> ترك بيئة الترف والجاهلية في مكة وهاجر إلى بيئة الأنصار في المدينة، فبنى واقعاً إيمانياً جديداً وصار سفير الإسلام الأول فيها.<\/p><p class=\"\"><b>تأسيس المسجد والسوق في المدينة:<\/b> أدرك النبي ﷺ أن للمكان أثراً في صناعة الإنسان، فجعل المسجد بيئة للعبادة والأخوة، وجعل للمسلمين سوقاً يقوم على العدل ويحررهم من بيئة الربا والاحتكار.<\/p><\/details><\/article><\/section><section class=\"bs\"><h3>٣ · سؤال للحوار<\/h3><p class=\"big\">من أصدقاؤك الذين يرفعونك؟ ومن الذين ينزلونك؟<\/p><\/section><section class=\"bs\"><h3>٤ · نشاط تطبيقي<\/h3><p class=\"big\">«تنظيف البيئة» :احذف أو أخف ثلاثة مشتتات من هاتفك الآن.<\/p><\/section><section class=\"bs\"><h3>أسئلة قد تُطرح<\/h3><details class=\"more\"><summary><b>هل تعني هندسة البيئة اعتزال زملاء المدرسة وقطع العلاقات إن قصّروا في الصلاة؟<\/b><\/summary><p>هناك فرق بين صديق الملازمة والتأثير وزميل البر والمعاملة والدعوة. لا تعادهم ولا تستعلِ عليهم، لكن انقلهم من دائرة الخلطة اليومية المقربة التي تصوغ أفكارك إلى دائرة الزمالة الطيبة والدعوة بالتي هي أحسن.<\/p><\/details><details class=\"more\"><summary><b>أعيش في مساحة ضيقة ومزدحمة، فكيف أهندس بيئتي؟<\/b><\/summary><p>ابدأ من الحيز الصغير الخاص بك: زاوية ترتبها، أو طاولة في مكتبة، أو ركن في المسجد، وسماعة تحجب الضوضاء. والأهم أن بيئتك الرقمية في هاتفك تحت سيطرتك التامة.<\/p><\/details><\/section><section class=\"bs warn\"><h3>رادار الحماية<\/h3><p><b>مؤشرات الخطر:<\/b> تعثر متكرر في المواضع نفسها، وفتور ملحوظ بعد الاختلاط بمجموعة معينة، وانشغال ذهني بمحتوى رقمي يتكرر في حديثه، وتبرير مستمر بعبارة «لا أستطيع ترك أصدقائي».<\/p><small>البروتوكول كاملاً في تبويب «الكامل».<\/small><\/section><section class=\"bs\"><h3>٥ · رحلة الأسبوع<\/h3><p class=\"\"><b>ليلة الهاتف:<\/b> يبيت الهاتف خارج غرفة النوم طوال الأسبوع.<\/p><p class=\"\"><b>جرد الحسابات:<\/b> يراجع الطالب الحسابات التي يتابعها ويحذف ما يشتته أو يضره.<\/p><p class=\"\"><b>الجليس الصالح:<\/b> يدعو كل طالب رفيقاً صالحاً لنشاط مشترك (مذاكرة، صلاة جماعة، رياضة).<\/p><p class=\"\"><b>جسر إلى اللقاء التاسع:<\/b> وإذا هندسنا البيئة بقي عدو داخلي أخطر: التسويف الذي يؤجل البدء. وهذا موضوع «فك قيود التسويف».<\/p><\/section>", "slides": ["<div class=\"cn\">8<\/div><h2>هندسة البيئة والمحيط<\/h2><p class=\"q\">كيف تشكل الصحبة والأماكن هويتنا؟<\/p>", "<small>إضاءة استهلالية<\/small><h2>معضلة أمين<\/h2><ul><li class=\"frag\">هل المشكلة في إرادة أمين أم في غرفته المفخخة بالمشتتات؟<\/li><li class=\"frag\">لو أُجبر على الاستيقاظ في هذه الغرفة، كم يوماً سيصمد؟ وما الذي يجب أن يتغير أولاً؟<\/li><\/ul>", "<small>1<\/small><h2>الهندسة الاجتماعية وتأثير البيئة<\/h2><p class=\"ayah lg\">﴿وَاصْبِرْ نَفْسَكَ مَعَ الَّذِينَ يَدْعُونَ رَبَّهُم بِالْغَدَاةِ وَالْعَشِيِّ يُرِيدُونَ وَجْهَهُ ۖ وَلَا تَعْدُ عَيْنَاكَ عَنْهُمْ تُرِيدُ زِينَةَ الْحَيَاةِ الدُّنْيَا﴾ [الكهف: 28]<\/p><p class=\"g frag\">الصبر على الطاعة أيسر في الصحبة المعينة.<\/p>", "<small>2<\/small><h2>الجليس يصنع الإنسان<\/h2><p class=\"had lg\">قال رسول الله ﷺ: «مَثَلُ الجَلِيسِ الصَّالِحِ وَالجَلِيسِ السَّوْءِ كَمَثَلِ صَاحِبِ المِسْكِ وَنَافِخِ الكِيرِ؛ فَصَاحِبُ المِسْكِ إِمَّا أَنْ يُحْذِيَكَ، وَإِمَّا أَنْ تَبْتَاعَ مِنْهُ، وَإِمَّا أَنْ تَجِدَ مِنْهُ رِيحًا طَيِّبَةً، وَنَافِخُ الكِيرِ إِمَّا أَنْ يُحْرِقَ ثِيَابَكَ، وَإِمَّا أَنْ تَجِدَ رِيحًا خَبِيثَةً» متفق عليه<\/p><p class=\"g frag\">الترمذي) الجليس الواقعي والرقمي يعيد صياغة أفكارك ومعاييرك.<\/p>", "<small>3<\/small><h2>الفرار من الفتنة<\/h2><p class=\"g frag\">الأصل تطهير البيئة وإخفاء المشتتات لا اختبار قوة الإرادة أمامها.<\/p>", "<small>4<\/small><h2>العدوى السلوكية<\/h2><p class=\"g frag\">البقاء في بيئة سلبية يؤدي للتشابه معها.<\/p>", "<small>سؤال للحوار<\/small><h2 class=\"big\">من أصدقاؤك الذين يرفعونك؟ ومن الذين ينزلونك؟<\/h2>", "<small>نشاط تطبيقي<\/small><h2 class=\"big\">«تنظيف البيئة» :احذف أو أخف ثلاثة مشتتات من هاتفك الآن.<\/h2>", "<small>سؤال وبرهان<\/small><details class=\"frag\"><summary><b>هل تعني هندسة البيئة اعتزال زملاء المدرسة وقطع العلاقات إن قصّروا في الصلاة؟<\/b><\/summary><p>هناك فرق بين صديق الملازمة والتأثير وزميل البر والمعاملة والدعوة. لا تعادهم ولا تستعلِ عليهم، لكن انقلهم من دائرة الخلطة اليومية المقربة التي تصوغ أفكارك إلى دائرة الزمالة الطيبة والدعوة بالتي هي أحسن.<\/p><\/details><details class=\"frag\"><summary><b>أعيش في مساحة ضيقة ومزدحمة، فكيف أهندس بيئتي؟<\/b><\/summary><p>ابدأ من الحيز الصغير الخاص بك: زاوية ترتبها، أو طاولة في مكتبة، أو ركن في المسجد، وسماعة تحجب الضوضاء. والأهم أن بيئتك الرقمية في هاتفك تحت سيطرتك التامة.<\/p><\/details><details class=\"frag\"><summary><b>أليس إخفاء التطبيقات ضعفاً؟ ألا ينبغي أن أدرب نفسي على المقاومة المباشرة؟<\/b><\/summary><p>هذا فخ الكبر النفسي. قامت الشريعة على سد الذرائع والفرار من مواطن الفتنة. واستنزاف طاقتك في مقاومة إغراء متواصل يجعلك منهكاً عاجزاً عن الإنجاز، وإبعاد المشتت ذكاء وحماية لمستقبلك.<\/p><\/details><details class=\"frag\"><summary><b>أنا أملك إرادة حديدية ولا تؤثر بي البيئة<\/b><\/summary><p>الحديث النبوي أخبر عن قانون عام: «الرجل على دين خليله». والإرادة طاقة تنفد، أما البيئة فتعمل بلا انقطاع. فالأذكى أن تجعل البيئة حليفاً لا خصماً.<\/p><\/details>", "<small>ميدان التطبيق<\/small><h2>«قبل وبعد: مختبر إعادة تصميم البيئة»  نشاط عملي<\/h2><ol><li class=\"frag\">1. الأدوات: استمارة ورقية تمثل «شاشة هاتف مفخخة بالمشتتات» و«مكتب فوضوي».<\/li><li class=\"frag\">2. المهمة الجماعية: يعيد الطلاب تصميم الشاشة والمكتب بالنمط الجديد: إخفاء تطبيقات الترفيه في المجلد الأخير، وقصر الشاشة الأولى على القرآن والملاحظات…<\/li><li class=\"frag\">3. دراسة حالة: عمار (17 سنة) متفوق، لكنه كلما جلس للمذاكرة وجد نفسه بعد دقائق يتنقل بين المقاطع القصيرة لساعتين.<\/li><li class=\"frag\">4. الخلوة الفردية: يعبّئ كل طالب البطاقة بنفسه، ثم ينفذ التعديل الأول في الليلة نفسها.<\/li><\/ol>", "<small>رحلة الأسبوع<\/small><ul><li class=\"frag\"><b>ليلة الهاتف:<\/b> يبيت الهاتف خارج غرفة النوم طوال الأسبوع.<\/li><li class=\"frag\"><b>جرد الحسابات:<\/b> يراجع الطالب الحسابات التي يتابعها ويحذف ما يشتته أو يضره.<\/li><li class=\"frag\"><b>الجليس الصالح:<\/b> يدعو كل طالب رفيقاً صالحاً لنشاط مشترك (مذاكرة، صلاة جماعة، رياضة).<\/li><li class=\"frag\"><b>جسر إلى اللقاء التاسع:<\/b> وإذا هندسنا البيئة بقي عدو داخلي أخطر: التسويف الذي يؤجل البدء. وهذا موضوع «فك قيود التسويف».<\/li><\/ul>"], "n": 8, "u": 1, "title": "هندسة البيئة والمحيط", "q": "كيف تشكل الصحبة والأماكن هويتنا؟", "dqq": "من أصدقاؤك الذين يرفعونك؟ ومن الذين ينزلونك؟", "pact": "«تنظيف البيئة» :احذف أو أخف ثلاثة مشتتات من هاتفك الآن."}, {"summary": "<p class=\"\">التسويف ليس كسلاً بسيطاً كما يظن الفتى، بل هو هروب من شعور مزعج تثيره المهمة، ثم تتراكم المهام فيزداد الشعور سوءاً. يتعلم الفتى في هذا اللقاء كيف يفكك الصراع الداخلي، وأن العمل هو الذي يولّد المزاج لا العكس، وكيف يكسر جبل المهمة بخطوة صغيرة سريعة، ويحمي وقته من لصوص يتسللون إليه.<\/p><p class=\"\">يفهم الفرق بين الكسل الجسدي والتسويف النفسي.<\/p><p class=\"\">يتعلم أدوات حسم بسيطة: قاعدة الدقيقتين، والمؤقت، والعد التنازلي.<\/p><p class=\"\">يتحرر من جلد الذات الذي يغذي التسويف.<\/p><div class=\"tw\"><table><tr><th><b>المهارة<\/b><\/th><th><b>معناها العملي<\/b><\/th><\/tr><tr><td><b>المبادرة وبدء العمل<\/b><\/td><td>يتغلب على مقاومة البداية بخطوة صغيرة فورية<\/td><\/tr><tr><td><b>تفكيك المهام<\/b><\/td><td>يحوّل المهمة الضخمة إلى حركات واضحة قابلة للتنفيذ<\/td><\/tr><tr><td><b>إدارة الوقت والانتباه<\/b><\/td><td>يحمي وقته من اللغو والمشتتات والمثالية المعطِّلة<\/td><\/tr><\/table><\/div>", "kit": "<p class=\"\"><b>ما يعيشه الفتى:<\/b> يشعر الفتى بضغط الدراسة والالتزامات، ويقابله إغراء الهاتف والترفيه، فينشأ صراع يومي يخسره أحياناً، ثم يعاقب نفسه بالتوبيخ فيزداد هروبه.<\/p><p class=\"\"><b>لا تختصر التسويف في الكسل:<\/b> كثير من المسوّفين مجتهدون يخافون الفشل، أو يشترطون ظروفاً مثالية لا تأتي.<\/p><p class=\"\"><b>خفف جلد الذات:<\/b> قل له إن جلد الذات يغذي الهروب، وإن الإنسان لا يتغير بالتحقير بل بالخطوة التالية.<\/p><p class=\"\"><b>طبّق أمامهم:<\/b> جرّب قاعدة الدقيقتين على مهمة صغيرة لديك أثناء اللقاء، وأخبرهم بما شعرت.<\/p><p class=\"\"><b>حافظ على صدق المنهج:<\/b> لا تعرض الأدوات كحلول سحرية، بل كتمارين تنجح بالتكرار.<\/p>", "hookT": "معضلة حمزة", "hook": "<p class=\"\"><b>حمزة (17 سنة)<\/b> يؤرقه منذ ثلاثة أسابيع بحث دراسي ومراجعة الرياضيات. كل يوم يقول: «سأبدأ عند السادسة مساءً حين أكون في مزاج رائق». فإذا دقت السادسة شعر بثقل فقال: «سأرتب المكتب وأعد كوباً من الشاي لأتهيأ جيداً». ويمضي الوقت بين الترتيب والهاتف حتى التاسعة فيقول: «تعبت، سأبدأ غداً في الفجر». تكرر ذلك عشرين يوماً، وفي الليلة الأخيرة أصابه الذعر فسهر ينسخ النصوص بضغط عصبي، وقدم عملاً مهلهلاً وهو يشعر بالخجل والإنهاك.<\/p><p class=\"\"><b>أسئلة الاستثارة:<\/b><\/p><p class=\"\">ما الذي كان يفعله حمزة فعلاً وهو يرتب المكتب ويعد الشاي؟<\/p><p class=\"\">متى يأتي «المزاج المناسب»؟ وهل جاء يوماً؟<\/p>", "pts": "<article class=\"pt\"><h4><span>أولاً<\/span>المبادرة أمر إلهي<\/h4><p class=\"ayah\">﴿وَسَارِعُوا إِلَىٰ مَغْفِرَةٍ مِّن رَّبِّكُمْ وَجَنَّةٍ عَرْضُهَا السَّمَاوَاتُ وَالْأَرْضُ أُعِدَّتْ لِلْمُتَّقِينَ﴾ [آل عمران: 133]<\/p><p class=\"\">الأمر بالمسارعة يعني ألا يؤجل المسلم الخير، فالتأجيل يورث الفوات والندم. وفي الآية ربط جميل بين المسارعة والتقوى، فالمتقي يبادر لأن قلبه يعلم أن الوقت لا يعود.<\/p><\/article><article class=\"pt\"><h4><span>ثانياً<\/span>بذور الحسرة: «سوف» و«لعل»<\/h4><p class=\"ayah\">﴿حَتَّىٰ إِذَا جَاءَ أَحَدَهُمُ الْمَوْتُ قَالَ رَبِّ ارْجِعُونِ * لَعَلِّي أَعْمَلُ صَالِحًا فِيمَا تَرَكْتُ ۚ كَلَّا﴾ [المؤمنون: 99-100]<\/p><p class=\"\">يبيّن القرآن خطورة التسويف: من ظل يؤجل «لعله يعمل» وجد نفسه عند انقضاء الأجل يتمنى فرصة لن تعود. فكلمة «سوف» هي بذرة الحسرة الكبرى.<\/p><\/article><article class=\"pt\"><h4><span>ثالثاً<\/span>لا فراغ في حياة المؤمن<\/h4><p class=\"ayah\">﴿فَإِذَا فَرَغْتَ فَانصَبْ * وَإِلَىٰ رَبِّكَ فَارْغَب﴾ [الشرح: 7-8]<\/p><p class=\"\">لا يعرف المنهج الإسلامي الفراغ السلبي المهدور، بل هو انتقال متجدد من عمل إلى عمل ومن عبادة إلى بناء. وقد سمى النبي ﷺ إضاعة الفراغ غبناً فقال: «نِعْمَتَانِ مَغْبُونٌ فِيهِمَا كَثِيرٌ مِنَ النَّاسِ: الصِّحَّةُ وَالفَرَاغُ» رواه البخاري. والغبن أفحش درجات الخسارة في البيع، لأن رأس مال الإنسان هو عمره المحدود.<\/p><\/article><article class=\"pt\"><h4><sp
